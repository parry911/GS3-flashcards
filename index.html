-to-valley planning, integrating upper-catchment treatment, drainage management, groundwater recharge and downstream crop-water planning."},{"l":"Core takeaway","t":"Watershed development must move beyond constructing water-harvesting structures towards community-managed, equitable and sustainable landscape restoration."}],"q":"How can watershed development work better?","cue":"Fund upkeep → converge with MGNREGS → include the landless → map with GIS → budget water → protect springs → plan ridge to valley."},{"k":"data","rows":[{"l":"Srikakulam (Andhra Pradesh)","t":"watershed projects raised maize yields by [[≈25%]] and rice by [[≈21%]], by linking soil and moisture conservation with cropping patterns (ICAR study)"}],"q":"What data and examples back up Watershed development?"},{"k":"diagram","q":"Draw the diagram for Watershed development","g":{"dir":"LR","nodes":[["R","Ridge - trenches, plantation"],["D","Drainage line - check dams"],["H","Valley - ponds, recharge"],["G","Groundwater up"],["Y","Yields and jobs"]],"edges":[["R","D",""],["D","H",""],["H","G",""],["G","Y",""]]}}]},{"id":"GS34-jal-shakti-abhiyan","line":"GS3.4","part":"Irrigation","name":"Jal Shakti Abhiyan","own":true,"cards":[{"k":"define","text":"A mission-mode water conservation campaign (Ministry of Jal Shakti, 2019; nationwide as ‘Catch the Rain’ in 2021) for rainwater harvesting and groundwater recharge through community participation.","q":"What is meant by Jal Shakti Abhiyan?","ed":true},{"k":"list","q":"How has the Jal Shakti Abhiyan evolved?","rows":[{"l":"2019","t":"JSA in 256 water-stressed districts"},{"l":"2021","t":"JSA: Catch the Rain, nationwide"},{"l":"2024","t":"Jal Sanchay Jan Bhagidari"},{"l":"2026","t":"JSJB: Catch the Rain integration"}]},{"k":"for","rows":[{"l":"Administrative Convergence","t":"Fiscal Convergence – Pools MGNREGS, PMKSY, AMRUT and Finance Commission grants without a separate dedicated campaign budget."},{"l":"Groundwater Recharge","t":"Rainwater harvesting, recharge shafts and revival of defunct borewells replenish shallow aquifers supporting well and tube-well irrigation."},{"l":"Climate-Resilient Agriculture","t":"Improved groundwater availability provides protective irrigation and reduces crop vulnerability to dry spells and erratic monsoons."},{"l":"Social Capital","t":"Jan Bhagidari – Jal Sanchay Jan Bhagidari (launched September 2024) mobilises communities, CSR and women’s collectives through the 3Cs: Community, CSR and Cost. The 2024 campaign theme was Nari Shakti se Jal Shakti."},{"l":"District-Level Planning","t":"712 Jal Shakti Kendras and 640 District Water Conservation Plans strengthen local technical support and decentralised water planning."},{"l":"Revival of Traditional Commons","t":"Desilting stepwells (baolis), village tanks and community ponds restores decentralised water storage."},{"l":"[[1.6 crore]]+ artificial groundwater recharge structures","t":"constructed under Jal Sanchay Jan Bhagidari. In June 2026, JSJB was integrated with JSA: Catch the Rain as JSJB: CTR."}],"q":"What has the Jal Shakti Abhiyan achieved?","cue":"Converge funds → recharge → protect farms → mobilise people → plan by district → revive commons."},{"k":"against","rows":[{"l":"Fiscal Constraints","t":"Absence of a dedicated fund","h":"Finance"},{"l":"Maintenance Deficit","t":"Recharge shafts, check dams and ponds suffer from siltation","h":"Infrastructure"},{"l":"Hydrogeological Mismatch","t":"Uniform civil-work templates without local aquifer mapping can result in recharge structures being built in low-permeability zones.","h":"Technology"},{"l":"Input-Output-Outcome Mismatch","t":"prioritisation of the number of structures rather than actual groundwater-level improvement","h":"Rules and institutions"},{"l":"Incentive Distortion","t":"Free agricultural electricity makes groundwater pumping cheap, encouraging over-extraction and undermining recharge efforts.","h":"Rules and institutions"}],"q":"What are the limits of the Jal Shakti Abhiyan?","cue":"No own fund → assets silt up → one design for all aquifers → counting structures, not water → free power."},{"k":"value","rows":[{"l":"Conjunctive Water Management","t":"Outcome-Based Monitoring – Shift from counting structures to measuring groundwater recovery through piezometers, Digital Water Level Recorders (DWLRs) and Gram Panchayat-level water budgets. Replicate Atal Bhujal Yojana's community-led water budgeting model."},{"l":"Dedicated Maintenance Financing","t":"Leverage Finance Commission grants to PRIs and MGNREGS for recurring pre-monsoon desilting, repairs and maintenance of community water assets."},{"l":"Incentive Rationalisation","t":"Demand-Side Reforms – Introduce rational irrigation-water pricing and DBT-based water subsidies, alongside separation of agricultural power feeders, as suggested by the Ashok Dalwai Committee. Complement these with PM-KUSUM and groundwater budgeting."},{"l":"Evidence-Based Planning","t":"Scientific Aquifer Mapping – Integrate CGWB's NAQUIM 2.0 high-resolution aquifer maps into District Water Conservation Plans to identify suitable recharge zones and improve groundwater management."},{"l":"Participatory Water Management","t":"Women-Led Water Governance – Empower village-level Pani Samitis and women SHGs with formal maintenance responsibilities and community rights over rejuvenated ponds."},{"l":"Integrated Water Governance","t":"Adopt basin-level surface and groundwater planning; the Mihir Shah Committee (2016) proposed integrating CWC and CGWB into a unified National Water Commission to improve holistic water-resource management."},{"l":"Core takeaway","t":"JSA must evolve from a structure-construction campaign into an outcome-oriented, community-managed water conservation movement, combining groundwater recharge with demand-side management."}],"q":"How should the Jal Shakti Abhiyan evolve?","cue":"Measure outcomes → fund upkeep → price water → map aquifers → let women lead → plan by basin."}]},{"id":"GS34-pm-kusum","line":"GS3.4","part":"Irrigation","name":"PM-KUSUM","own":true,"cards":[{"k":"define","text":"PM Kisan Urja Suraksha evam Utthaan Mahabhiyan: solar pumps and solarised farm feeders, so irrigation gets cheaper, cleaner power and farmers can sell surplus power to the grid.","q":"What is meant by PM-KUSUM?"},{"k":"for","rows":[{"l":"Water and energy efficiency","t":"solar pumps paired with micro-irrigation; decentralised power at the farm"},{"l":"Cost saving","t":"no diesel or electricity bill for irrigation"},{"l":"Extra income","t":"surplus solar power sold to the grid"},{"l":"Crop diversification","t":"Chandrapur case: farmers moved from paddy to vegetables (your notes)"}],"q":"Why is PM-KUSUM useful?","cue":"Efficient → free to run → earns income → lets farmers diversify."},{"k":"against","rows":[{"l":"Finance","t":"high initial cost for small farmers","h":"Finance"},{"l":"Technology","t":"no efficient, affordable energy storage","h":"Technology"},{"l":"Equity and sustainability","t":"near-free daytime power can encourage over-pumping of groundwater unless paired with micro-irrigation and metering","h":"Equity and sustainability"}],"q":"What are the problems with PM-KUSUM?","cue":"Costly to start → no storage → may drain groundwater."},{"k":"value","rows":[{"l":"PM-KUSUM","t":"solar pumps and solarised feeders (see Keywords → PM-KUSUM)"}],"q":"What schemes, data and examples back up PM-KUSUM?"},{"k":"data","q":"What data goes with PM-KUSUM?","title":"Data","rows":[{"l":"PM-KUSUM (2019)","t":"solar pumps and feeder solarisation; [[₹34,422 crore]] of central support for [[34.8 GW]], but only [[≈13 GW]] installed by March 2026 with some projects given until March 2027 (MNRE)"}]}]},{"id":"GS34-saving-water-in-a-depleting-scenario","line":"GS3.4","part":"Irrigation","name":"Saving water in a depleting scenario","own":true,"cards":[{"k":"list","rows":[{"l":"Rainwater harvesting","t":"India receives ≈1,180 mm of rain a year but harvests only [[≈8%]] of it; rainwater projects in Bundelkhand (Parasi-Sindh) raised groundwater by [[≈10%]]"},{"l":"Watershed management","t":"e.g. the Mid-Himalayan Watershed Development Project treated [[≈1 lakh]] ha (see Watershed development)"},{"l":"Micro-irrigation plus mulching","t":"mulch cuts evaporation from the soil"},{"l":"Drought-tolerant crops","t":"millets and pulses"},{"l":"Sub-surface dykes","t":"underground barriers that slow groundwater flow and hold it near wells"},{"l":"Water schedules","t":"Warabandi in Punjab (turn-by-turn sharing)"},{"l":"Water audit","t":"Maharashtra audits its irrigation water use (since 2003)"},{"l":"Water pricing","t":"volumetric pricing in Andhra Pradesh"}],"q":"How can India save water in agriculture as groundwater depletes?","cue":"Catch rain → treat watersheds → drip and mulch → grow hardy crops → hold groundwater → share by turn → audit → price."},{"k":"value","rows":[{"l":"Soil and water","t":"soil degradation affects ≈147 Mha (ICAR). India gets ≈1,180 mm of rainfall a year but harvests only [[≈8%]] of it"},{"l":"Warabandi","t":"rotational water-sharing system in Punjab (Agriculture notes)"}],"q":"What data and examples back up water saving?"}]},{"id":"GS34-surface-manual-irrigation","line":"GS3.4","part":"Irrigation","name":"Surface (manual) irrigation","own":true,"cards":[{"k":"define","text":"Surface irrigation: letting water flow over the soil surface by gravity (e.g. flood, furrow and basin irrigation). Manual irrigation: applying water by hand with buckets, watering cans or hoses.","q":"What is meant by surface (manual) irrigation?","ed":true}]},{"id":"GS34-sprinkler-irrigation","line":"GS3.4","part":"Irrigation","name":"Sprinkler irrigation","own":true,"cards":[{"k":"define","text":"Spraying water over crops through pipes and sprinklers, simulating rainfall.","q":"What is meant by sprinkler irrigation?"}]},{"id":"GS34-sub-surface-irrigation","line":"GS3.4","part":"Irrigation","name":"Sub-surface irrigation","own":true,"cards":[{"k":"define","text":"Supplying water directly to the root zone through underground pipes or buried drip lines.","q":"What is meant by sub-surface irrigation?"}]},{"id":"GS34-automated-precision-irrigation","line":"GS3.4","part":"Irrigation","name":"Automated (precision) irrigation","own":true,"cards":[{"k":"define","text":"Using sensors, timers and automated systems to deliver precise quantities of water according to crop requirements and soil moisture.","q":"What is meant by automated (precision) irrigation?"}]},{"id":"GS34-jevons-paradox-rebound-effect","line":"GS3.4","part":"Irrigation","name":"Jevons paradox (rebound effect)","own":true,"cards":[{"k":"define","text":"A situation where improvements in resource-use efficiency reduce the cost of using a resource, encouraging greater consumption and thereby offsetting the expected resource savings.","q":"What is meant by Jevons paradox (rebound effect)?"}]},{"id":"GS34-apmc-and-the-2020-farm-laws","line":"GS3.4","part":"Agricultural marketing","name":"APMC","own":true,"cards":[{"k":"define","q":"How do APMC mandis work?","text":"APMC mandis are state-regulated market yards where notified agricultural produce is traded through licensed commission agents (arhtiyas). Statutory fees and commissions add [[≈15%]] to intermediation costs."},{"k":"for","q":"Why reform APMCs (the case behind the 2020 farm laws)?","rows":[{"l":"Prevents distress sales by mandating transparent, competitive open-auction price discovery","t":""},{"l":"Anchors reliable MSP procurement and public stockholding","t":"e.g. Punjab and Haryana mandis supply >[[70%]] of FCI wheat and rice"},{"l":"Guarantees timely payment and standardized weighment, protecting smallholders from trader fraud","t":""},{"l":"Generates state revenue via mandi fees to fund rural roads and market infrastructure","t":"e.g. Punjab's Rural Development Fund"},{"l":"Provides a centralized physical hub where buyers and sellers aggregate, lowering search costs","t":""}],"cue":"Exam-hall trigger: Think \"Institutional safety net\" — regulated yards prevent distress sales, guarantee payment, and anchor state procurement."},{"k":"against","q":"Why did the 2020 farm laws fail, and what is wrong with APMCs?","rows":[{"l":"Arhtiya (commission agent) cartels rig auctions and trap indebted farmers in single mandis via informal credit, depressing farm-gate prices","t":""},{"l":"Cascading mandi taxes, rural development cesses, and commissions add [[≈15%]] to costs (historically up to [[8.5%]] in Punjab), deterring private buyers","t":""},{"l":"Severe infrastructure deficit","t":"fewer than [[20%]] of mandis have scientific sorting, grading, cold storage, or assaying labs, driving post-harvest losses."},{"l":"Fragmented state rules restrict seamless interstate trade, locking farmers out of national price arbitrage","t":""},{"l":"Low digital literacy and price asymmetry leave smallholders reliant on local traders rather than real-time market rates","t":""}],"cue":"Exam-hall trigger: Think \"Monopsony & rent-seeking\" — tying farmers to a single market creates middleman cartels, high levies, and poor infrastructure."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Integrate mandis onto e-NAM with unified single-point licenses and electronic assaying labs ([[1,389]]+ mandis integrated)","t":""},{"l":"Cap statutory mandi fees and commissions","t":"(e.g., Model APLM Act 2017 recommends a [[1–2%]] cap) to make regulated markets cost-competitive."},{"l":"Upgrade [[22,000]] Gramin Agricultural Markets (GrAMs) as farm-gate feeder hubs within a [[5 km]] radius(Dalwai Committee benchmark)","t":""},{"l":"Deploy the [[₹1 lakh crore]] Agriculture Infrastructure Fund (AIF) to build cold chains, grading, and warehousing inside mandi yards","t":""},{"l":"Decontrol perishables (fruits and vegetables) from mandatory mandi routing so farmers can sell directly without middlemen","t":""}],"cue":"Exam-hall trigger: Think \"Modernize & decongest\" — digitize existing mandis, cap fees, and build rural feeder markets."},{"k":"diagram","q":"Draw the diagram for APMC and the 2020 farm laws","g":{"dir":"LR","nodes":[["F","Farmer"],["A","APMC mandi - commission agent"],["W","Wholesaler"],["R","Retailer"],["C","Consumer"],["P","FPO, e-NAM, processor - shorter chain"]],"edges":[["F","A",""],["A","W",""],["W","R",""],["R","C",""],["F","P",""],["P","R",""]]}},{"k":"data","q":"What did commentators say about the private sector in farm markets?","title":"Data","rows":[{"l":"Private sector and agriculture (Sansad TV perspective)","t":"with the right tools, corporate–farm linkages (contract farming, FPO–agritech tie-ups) could drive modernisation; the safeguards are under Contract farming, GS3.6"}]}]},{"id":"GS34-the-2020-farm-laws","line":"GS3.4","part":"E-technology for farmers","name":"The 2020 Farm Laws","own":true,"cards":[{"k":"define","q":"What is The 2020 Farm Laws?","text":"Three central acts passed in September 2020 to create tax-free parallel trade areas outside APMCs, permit contract farming, and deregulate stock limits; repealed in November 2021 following sustained protests."},{"k":"for","q":"What are the gains from The 2020 Farm Laws?","rows":[{"l":"Allows farmers to sell directly to third parties outside notified mandis for better price discovery","t":"e.g. Model APLM Act 2017 allowed private markets and direct marketing"},{"l":"Boosts net farm income by [[13.5–17.1%]] through competitive bidding across multiple channels (Ashok Dalwai Committee estimates)","t":""},{"l":"Cuts [[≈15%]] intermediation costs by bypassing multi-tier arhtiya commissions and mandi levies","t":"e.g. Safal / Mother Dairy direct-sourcing model"},{"l":"Attracts private capex into cold chains, logistics, and processing, curbing India's [[₹1.5 lakh crore]] annual post-harvest losses (NABCONS study)","t":""},{"l":"Encourages crop diversification into perishables and oilseeds via assured corporate off-take","t":"e.g. ITC e-Choupal linkages"}],"cue":"Exam-hall trigger: Think \"Competition breaks monopsony\" — parallel buyers cut middleman margins, unlock private capex, and raise farmer realization."},{"k":"against","q":"What are the problems with The 2020 Farm Laws?","rows":[{"l":"Triggered existential fear that tax-free private markets would starve APMCs of revenue, collapsing procurement and de facto ending MSP (especially in Punjab and Haryana)","t":""},{"l":"Violated cooperative federalism by encroaching on State List subjects","t":"Entry [[28]] (Markets and fairs) and Entry [[14]] (Agriculture)—provoking state counter-bills (e.g., Punjab and Rajasthan)."},{"l":"Suffered a legitimacy deficit due to the COVID-era ordinance route (June 2020) without Parliamentary Standing Committee scrutiny or farmer consultation","t":""},{"l":"Left smallholders ([[86%]] of farmers, <[[2]] ha) vulnerable to corporate asymmetry in contract farming by barring civil court jurisdiction in favor of executive boards (SDM/ADM)","t":""},{"l":"Risked repeating the Bihar precedent, where repealing the APMC Act in 2006 without alternative infrastructure led to lower farm-gate prices and weak procurement","t":""}],"cue":"Exam-hall trigger: Think \"Trust deficit + Federal bypass\" — deregulating markets without MSP guarantees or state consultation triggered existential fears."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Build consensus via a GST Council-style federal body and incentive grants instead of unilateral central laws, letting states adopt the Model APLM Act 2017","t":""},{"l":"Aggregate smallholders through the [[10,000]] FPOs scheme to give them collective bargaining power against large corporate buyers","t":"e.g. Sahyadri Farms, Maharashtra"},{"l":"Upgrade existing APMCs and link [[22,000]] rural haats (GrAMs) to e-NAM rather than letting regulated mandis atrophy","t":""},{"l":"Enact balanced state contract-farming laws (Model APLCS Act 2018) with civil court recourse and mandatory crop insurance linkage","t":""},{"l":"Strengthen MSP procurement and expand PM-AASHA price-deficiency payments to non-cereal crops to de-risk market transitions","t":""}],"cue":"Exam-hall trigger: Think \"Consensus, aggregation & price assurance\" — build federal consensus, empower smallholders via FPOs, and safeguard MSP."}]},{"id":"GS34-fpos","line":"GS3.4","part":"Agricultural marketing","name":"FPOs","own":true,"cards":[{"k":"define","q":"What is meant by FPOs?","text":"Collectives of farmers, usually registered as producer companies or cooperatives, that pool inputs and produce to gain scale and bargaining power."},{"k":"for","q":"Why are FPOs important?","rows":[{"l":"Pools fragmented harvests ([[86%]] farmers own <[[2]] ha) to gain bulk bargaining power and higher farm-gate prices","t":"e.g. Sahyadri Farms, Maharashtra"},{"l":"Cuts input costs by [[15–20%]] via bulk buying of seeds, fertilizers, and shared machinery","t":"e.g. Custom Hiring Centres"},{"l":"Captures more of the consumer rupee through sorting, grading, processing, and branding","t":"e.g. branded organic pulses and spices"},{"l":"Connects farmers directly to institutional and digital buyers, bypassing middlemen","t":"e.g. FPOs trading on e-NAM and ONDC"},{"l":"Unlocks formal bank credit and government subsidies that individual smallholders cannot access","t":"e.g. NABARD and SFAC schemes"}],"cue":"Exam-hall trigger: Think \"Aggregation creates scale\" — pooling small farms lowers input costs, attracts big buyers, and captures retail margins."},{"k":"against","q":"What holds FPOs back?","rows":[{"l":"Thin equity and working capital shortages stop FPOs from buying crops upfront, pushing farmers back to traders (most hold under [[₹5 lakh]] capital)","t":""},{"l":"Lack of professional managers and business skills causes weak governance, poor record-keeping, and dormant units","t":""},{"l":"Weak buyer linkages and lack of assured off-take leave most FPOs commercially unviable (only [[≈30%]] turn profitable)","t":""},{"l":"Missing local storage, grading, and cold-chain facilities force raw sales instead of value addition","t":""},{"l":"Heavy company-law compliance (audits, ROC filings) drains funds, while women and marginal farmers remain underrepresented","t":""}],"cue":"Exam-hall trigger: Think \"Small capital, big compliance\" — thin equity, missing managers, and heavy company rules stall commercial growth."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Provide collateral-free working capital and matching equity grants for upfront crop buying","t":"e.g. Credit Guarantee Fund under the [[10,000]] FPOs scheme"},{"l":"Fund professional CEOs and multi-year handholding through Cluster-Based Business Organizations (CBBOs via SFAC and NABARD)","t":""},{"l":"Build assured off-take by linking FPOs directly with corporate buyers, e-NAM, and ONDC","t":"e.g. ITC and Mother Dairy tie-ups"},{"l":"Channel subsidized loans to FPOs for building local warehouses and grading units","t":"e.g. Agriculture Infrastructure Fund"},{"l":"Ease company-law compliance for small FPOs and mandate women and small-farmer representation on boards","t":"e.g. Mann Deshi women FPOs"}],"cue":"Exam-hall trigger: Think \"Capital, capacity & market connect\" — infuse working capital, hire professional managers, and lock in institutional buyers."},{"k":"data","q":"Which platforms and recommendations support FPOs?","title":"Data","rows":[{"l":"ONDC","t":"connects buyer apps (Paytm, Meesho), logistics providers (Delhivery) and seller apps (GoFrugal); about 5,000 FPOs have joined"},{"l":"Economic Survey 2025-26 recommends","t":"FPOs as the main channel for extension services; APMC problems to be fixed; downstream infrastructure through NMP 2.0, e-NAM and PLI for food processing (notebook)"}]}]},{"id":"GS34-cobweb-model","line":"GS3.4","part":"Agricultural marketing","name":"Cobweb model","own":true,"cards":[{"k":"define","text":"Explains why farm prices swing year to year: farmers plant on last season’s price, so supply overreacts and price and quantity spiral around equilibrium.","q":"What does the cobweb model explain?","ed":true},{"k":"list","q":"How does the cobweb cycle work, and how do APMCs feed it?","rows":[{"l":"Boom","t":"a high price (say [[₹100]]/kg of rice) brings more sowing, so supply rises and the price falls"},{"l":"Bust","t":"next season fewer farmers plant, supply falls and the price rises again"},{"l":"APMCs feed it","t":"entry barriers, opaque price discovery, and planning on delayed, local mandi data instead of a wider market view"}]}]},{"id":"GS34-supply-chain-bottlenecks","line":"GS3.4","part":"Agricultural marketing","name":"Supply-chain bottlenecks","own":true,"cards":[{"k":"define","q":"What are the upstream and downstream parts of the farm supply chain?","text":"Upstream: inputs, production, R&D and harvest. Downstream: processing, distribution and sale.","ed":true},{"k":"for","q":"What are the gains from Supply-chain bottlenecks?","rows":[{"l":"Raises farmers' share in the final consumer rupee by cutting multi-tier middleman margins (currently just [[28–74%]] for perishables, RBI)","t":""},{"l":"Curbs post-harvest spoilage of perishables through timely processing and cold storage","t":"e.g. Operation Greens for tomato, onion, and potato"},{"l":"Smooths seasonal gluts and shortages, keeping food inflation under control","t":""},{"l":"Boosts agri-exports by meeting global sanitary and residue standards (avoiding rejections like basmati rice over tricyclazole residue)","t":""},{"l":"Creates rural non-farm jobs in sorting, grading, packaging, and food processing","t":"e.g. Mega Food Parks"}],"cue":"Connecting farms directly to processors and organised retail cuts waste, stabilizes food prices, and raises farmer income."},{"k":"against","q":"What are the problems with Supply-chain bottlenecks?","rows":[{"l":"Severe infrastructure gap","t":"only [[≈10%]] of markets have cold storage, and only [[≈10%]] of produce is processed (against [[23%]] in China and [[70%]] in Brazil), worsened by high tolls and poor rural roads."},{"l":"Fragmented stakeholder links and arhtiya cartels in APMCs leave farmers with just [[28–74%]] of the consumer price for perishables (RBI), while e-NAM carries only [[≈15%]] of trades","t":""},{"l":"Fear of abrupt Essential Commodities Act stock limits, complex licensing, and inter-state trade rules deter private investment","t":""},{"l":"Unorganised, unregistered enterprises employ [[≈70%]] of workers, limiting modern processing machinery,scale, and skilled labour","t":""},{"l":"Lack of uniform grading and quality-testing standards hurts domestic value and triggers export rejections","t":"e.g. tricyclazole residue in rice"}],"cue":"Weak infrastructure, fragmented markets, and regulatory fear trap produce in unorganised channels and depress farmer returns."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Expand cold storage, assaying labs, and processing hubs near farms using the [[₹1 lakh crore]] Agriculture Infrastructure Fund and PM Kisan SAMPADA Yojana","t":""},{"l":"Integrate mandis onto e-NAM with unified inter-state licenses and link FPOs directly to organised retail and ONDC","t":"e.g. Safal / Mother Dairy direct sourcing"},{"l":"Ensure predictable Essential Commodities Act stock-limit rules and simplify inter-state licensing to de-risk private storage capex","t":""},{"l":"Formalize small food-processing units and train workers in modern machinery and quality testing","t":"e.g. PMFME scheme"},{"l":"Enforce uniform AGMARK/FSSAI grading and farm-gate residue testing to meet global export norms","t":"e.g. APEDA traceability systems"}],"cue":"Build shared farm-gate infrastructure, digitize market linkages, and keep trade rules predictable to attract private capital."},{"k":"list","rows":[{"l":"Finance","t":"the Essential Commodities Act (stock limits) deters private investment for fear of misuse"},{"l":"People and skills","t":"unorganised, unregistered enterprises employ [[≈70%]] of workers (see GS3.6)"},{"l":"Infrastructure","t":"only [[≈10%]] of markets have cold storage; processing [[≈10%]] of produce against [[23%]] in China and [[70%]] in Brazil; high tolls and poor rural roads (see Numbers)"},{"l":"Markets","t":"cartels of arhtiyas in APMCs; fragmented stakeholder links; e-NAM carries only [[≈15%]] of trades"},{"l":"Technology","t":"no uniform standards and grading (e.g. tricyclazole residue in rice)"},{"l":"Rules and institutions","t":"complex licensing, permits and inter-state trade rules"},{"l":"Equity and sustainability","t":"farmers get only [[28–74%]] of the consumer price for perishables (RBI)"}],"title":"Across the chain","q":"What bottlenecks run through the farm supply chain?","cue":"Money → people → cold storage → markets → standards → rules → farmer’s share."},{"k":"list","title":"Transport constraints (2020 Q3)","rows":[{"l":"Rural roads","t":"no all-weather roads, so produce, especially vegetables, cannot reach mandis in the monsoon (see Examples)"},{"l":"Few reefers","t":"only [[≈4%]] of fruits move in reefer trucks; reefer shortfall [[≈85%]] (NCCD)"},{"l":"Road-heavy and costly","t":"[[≈97%]] of fruits and vegetables go by road, [[1.9%]] by rail; the farmgate-to-mandi haul is expensive"},{"l":"Losses","t":"transport causes [[≈30–40%]] of post-harvest loss; [[≈₹92,000 crore]] lost a year"},{"l":"Weak multimodal logistics","t":"rural logistics underdeveloped; main freight arteries congested"},{"l":"Permits","t":"reefer vans get 5-year permits with limited inter-state validity"}],"q":"What transport constraints hurt farm supply chains?","cue":"Roads → reefers → road-heavy → losses → no multimodal → permits."},{"k":"list","q":"What does the downstream of the farm supply chain need?","rows":[{"l":"Needs","t":"modern processing machinery, quality testing of finished products, organised retail, skilled workers"},{"l":"PYQs","t":"2022 Q13, 2020 Q3, 2025 Q4"}]},{"k":"data","rows":[{"l":"Cold chain","t":"only [[≈10%]] of perishables reach market through cold storage; [[≈30–40%]] of fruits and vegetables are lost after harvest (notebook) (see GS3.6 → Numbers)"},{"l":"Farmers’ share of the consumer price","t":"[[49–76%]] for non-perishables (RBI)"},{"l":"Farmers’ share of the consumer rupee (RBI, 2024)","t":"tomato [[33%]], onion [[36%]], potato [[37%]]; banana [[31%]], grapes [[35%]], mango [[43%]]; pulses [[65–75%]]; milk [[70%]]; wheat [[67%]]"},{"l":"Thinking framework (perishables)","t":"frictions come from cold chain, post-harvest handling, infrastructure gaps, credit lines, and policy"},{"l":"Agriculture Infrastructure Fund (AIF)","t":"[[₹1 lakh crore]] for post-harvest infrastructure, with [[3%]] interest subvention; implemented through NABARD; BHARAT campaign (Banks Heralding Accelerated Rural and Agriculture Transformation, 15 July–15 August 2023, target [[₹7,200 crore]]) made banks compete to lend under AIF"}],"q":"What data and schemes address supply-chain gaps?"},{"k":"data","rows":[{"l":"Operation Greens","t":"(Budget 2018-19, [[₹500 crore]], MoFPI, on the lines of Operation Flood): tomato, onion and potato value chains; extended in June 2020 from TOP to TOTAL (41 notified fruits and vegetables); [[50%]] subsidy on transport and on hiring storage during gluts (PIB)"},{"l":"Cold Chain Scheme (MoFPI, since 2008)","t":"395 integrated cold-chain projects approved, 291 operational (June 2025, PIB)"},{"l":"Ranchi, June 2025","t":"waterlogged roads caused long transport delays (notebook)"},{"l":"Anantapur (Andhra Pradesh), July 2025","t":"rain delayed transport, tomato supply fell and the price rose from [[₹45]] to [[₹60]] a kg (notebook)"}],"q":"What data and schemes address supply-chain gaps?"}]},{"id":"GS34-transport-constraints-agri-logistics","line":"GS3.4","part":"E-technology for farmers","name":"Transport Constraints (Agri-Logistics)","own":true,"cards":[{"k":"define","q":"What is agri-logistics, and what constrains it?","text":"Moving produce from farmgate to mandis, processors and consumers; heavily road-dependent, with severe cold-chain and rural connectivity gaps.","ed":true},{"k":"for","q":"What are the gains from Transport Constraints (Agri-Logistics)?","rows":[{"l":"Cuts perishable spoilage during transit, directly saving farm output and rural incomes","t":""},{"l":"Connects surplus producing states to distant urban hubs, preventing local price crashes","t":"e.g. Kisan Rail moving Maharashtra produce to eastern India"},{"l":"Lowers freight costs per tonne-km by shifting bulk movement from expensive road trucks to rail and coastal shipping","t":""},{"l":"Preserves shelf life and quality of high-value horticulture, dairy, and marine produce through unbroken cold chains","t":""},{"l":"Unlocks export markets for landlocked farming regions via dedicated air and rail cargo links","t":"e.g. Krishi UDAN"}],"cue":"Fast, temperature-controlled, multimodal transport preserves perishable value and links surplus farms to distant deficit markets."},{"k":"against","q":"What are the problems with Transport Constraints (Agri-Logistics)?","rows":[{"l":"Transport bottlenecks cause [[≈30–40%]] of post-harvest loss, wasting [[≈₹92,000 crore]] a year","t":""},{"l":"Acute cold-chain deficit","t":"only [[≈4%]] of fruits move in reefer trucks, leaving an [[≈85%]] reefer shortfall (NCCD)."},{"l":"Over-dependence on costly road haulage ([[≈97%]] of fruits and vegetables go by road vs just [[1.9%]] by rail),making the farmgate-to-mandi haul expensive","t":""},{"l":"Lack of all-weather rural roads blocks produce","t":"especially vegetables—from reaching mandis during the monsoon."},{"l":"Congested main freight arteries, weak rural multimodal logistics, and 5-year reefer van permits with limited inter-state validity slow transit","t":""}],"cue":"Over-reliance on congested roads, missing rural connectivity, and a sharp shortage of refrigerated trucks cause heavy transit losses."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Build last-mile, all-weather rural roads linking villages to mandis and rural haats under PM Gram Sadak Yojana (PMGSY)","t":""},{"l":"Bridge the [[≈85%]] reefer shortfall with capital subsidies and credit support under MIDH and the Agriculture Infrastructure Fund","t":""},{"l":"Scale dedicated perishable rail and air cargo routes like Kisan Rail and Krishi UDAN to cut road congestion and freight costs","t":""},{"l":"Replace restrictive 5-year permits with seamless all-India national permits for reefer vans to speed up inter-state movement","t":""},{"l":"Develop multimodal agri-logistics parks and rail-side cold storages along Dedicated Freight Corridorsunder PM Gati Shakti","t":""}],"cue":"Connect villages with all-weather roads, subsidize refrigerated fleets, and shift long-haul freight onto rail and multimodal corridors."}]},{"id":"GS34-data-marketing-of-agricul","line":"GS3.4","part":"Agricultural marketing","name":"Agricultural marketing: key data","own":true,"cards":[{"k":"data","title":"Numbers","q":"What are the key numbers?","rows":[{"l":"Agri exports","t":"India is the 2nd-largest agricultural producer by value but has only [[2.2%]] of global agri exports (ES 2025-26); agri exports fell [[≈8%]] in 2023-24, to [[≈$48.9 bn]] (Commerce Department)"}]},{"k":"data","title":"Government steps and committees","q":"Which government steps and committees apply?","rows":[{"l":"Credit Guarantee Scheme for e-NWR based pledge","t":"financing (Dec 2024, [[₹1,000 crore]] corpus): loans against electronic negotiable warehouse receipts from WDRA-registered warehouses, so farmers store and borrow instead of selling in distress; [[80–85%]] cover for small and marginal farmers; e-Kisan Upaj Nidhi portal (WDRA)"},{"l":"GI for agricultural products, Geographical Indications of","t":"Goods (Registration and Protection) Act, 1999: application → scrutiny → hearing → acceptance → publication in the GI Journal → opposition (within 3 months) → registration certificate (notebook)"}]}]},{"id":"GS34-e-nam","line":"GS3.4","part":"E-technology for farmers","name":"e-NAM","own":true,"cards":[{"k":"define","q":"What is meant by e-NAM?","text":"An online trading platform linking physical mandis for transparent price discovery."},{"k":"for","q":"What does e-NAM offer farmers?","rows":[{"l":"Connects farmers to pan-India buyers across [[1,522]] mandis ([[1.8 crore]] farmers, Dec 2025), ending local trader monopolies","t":""},{"l":"Ensures transparent price discovery through open online bidding and quality-based auctions","t":"e.g. turmeric and chilli trade in Telangana"},{"l":"Cuts middleman commissions and delays through direct online bank payments to farmers","t":"e.g. RTGS/NEFT and BHIM integration"},{"l":"Enables [[4,698]] FPOs (Dec 2025) to pool produce and trade at bulk scale directly from farm-gate collection centres","t":""},{"l":"Curbs distress sales by linking electronic warehouse receipts for post-harvest pledge loans","t":"e.g. e-NWR integration via WDRA"}],"cue":"Linking local mandis into one digital market breaks trader monopolies, widens buyer reach, and ensures fair, fast payments."},{"k":"against","q":"Why is e-NAM underused?","rows":[{"l":"Most deals remain local offline trades merely billed on the portal","t":"only [[≈15%]] of transactions are truly online."},{"l":"Missing quality-assaying labs, grading units, and e-connectivity at mandis stop distant buyers from bidding sight-unseen","t":"e.g. lack of rapid moisture/residue testing"},{"l":"Weak transport and cold-chain logistics make shipping produce to far-off buyers costly and risky (especially for perishables)","t":""},{"l":"Varying state APMC rules","t":"marketing being a State subject—block uniform single-point licenses and inter-state trade (e.g., differing state mandi levies)."},{"l":"Low digital literacy among farmers and resistance from traditional arhtiyas slow real online adoption","t":""}],"cue":"Without trusted quality checks, cold-chain logistics, and uniform state rules, online trading stays trapped inside local mandis."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Install automated quality-assaying and grading labs across mandis to build buyer trust (funded via the Agriculture Infrastructure Fund)","t":""},{"l":"Harmonize state APMC rules for single unified trading licenses and one-point mandi fees (per Model APLM Act 2017)","t":""},{"l":"Link FPO collection centres, rural haats (GrAMs), and ONDC directly to e-NAM for farm-gate institutional off-take","t":""},{"l":"Connect surplus and deficit mandis with dedicated cold-chain and rail freight links","t":"e.g. Kisan Rail and reefer subsidies"},{"l":"Run local-language digital helpdesks at mandis to transition farmers and traders from offline billing to live online bidding","t":""}],"cue":"Build trusted grading at mandis, align state licensing rules, and connect logistics so distant buyers can actually trade."},{"k":"data","q":"What schemes, data and examples back up e-NAM?","title":"Data","rows":[{"l":"ITC e-Choupal","t":"connects about [[4 million]] farmers (Agriculture notes)"}]},{"k":"data","q":"How far does e-NAM reach?","rows":[{"l":"Coverage (Dec 2025)","t":"[[1,522]] mandis, [[1.8 crore]] farmers and [[4,698]] FPOs"}]}]},{"id":"GS34-precision-agriculture","line":"GS3.4","part":"E-technology for farmers","name":"Precision Agriculture","own":true,"cards":[{"k":"define","q":"What is meant by precision agriculture?","text":"Using sensors, satellites, drones, AI/ML, and GIS to apply the right input at the right place and time—covering soil pH and nutrient-load mapping, crop monitoring, spraying, and forecasting."},{"k":"for","q":"What are the benefits of precision agriculture?","rows":[{"l":"Boosts crop yields and water efficiency through AI-assisted management (e.g., Baramati ‘Farm of the Future’","t":"ADT Baramati + Microsoft + Oxford—yielded [[104–150]] t/acre sugarcane, [[≈40%]] more yield with [[≈30%]] less water)."},{"l":"Cuts costs by [[≈40%]] and chemical use by [[30–60%]], while lifting yields [[20–30%]] and cutting the carbon footprint by [[≈25%]] via drones (adoption projected at [[6–7 lakh]] by 2030–31)","t":""},{"l":"Improves weather forecasts and crop advisories to cut farm losses","t":"e.g. Bharat-VISTAAR in Budget 2026-27 linking AgriStack, Bhashini, and ICAR; FASAL for space and ground-based output forecasts"},{"l":"Curbs fertilizer overuse and restores soil health via GIS mapping of soil pH and nutrient loads","t":"e.g. Soil Health Card integration"},{"l":"Speeds up crop insurance assessment and protects farmers from toxic manual spraying","t":"e.g. KISAN project using space tech and geo-information"}],"cue":"Targeted, data-driven farming boosts yields and farmer income while slashing water, chemical, and carbon waste."},{"k":"against","q":"What limits precision agriculture in India?","rows":[{"l":"Small, fragmented landholdings ([[86%]] of farmers own <[[2]] ha) make capital-heavy drones and sensors uneconomic for individual farmers","t":""},{"l":"High upfront purchase, maintenance, and repair costs of drones and sensors strain thin farm margins","t":""},{"l":"Low digital readiness and lack of technical training among farmers slow ground-level adoption","t":""},{"l":"Rural internet gaps hinder real-time data use, alongside unresolved data ownership and privacy risks under AgriStack","t":""},{"l":"Strict airspace rules, short drone battery life, and imported sensor costs limit local scaling","t":"e.g. DGCA drone certification norms"}],"cue":"Small farm sizes, high hardware costs, and weak rural digital infrastructure make precision tools unviable for individual smallholders."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Scale shared pay-per-use Custom Hiring Centres and women collectives to overcome small plot sizes","t":"e.g. Namo Drone Didi giving women’s SHGs [[80%]] subsidy up to [[₹8 lakh]], balance via AIF loans with [[3%]] interest subvention"},{"l":"Back agri-tech startups and low-cost indigenous hardware R&D to cut equipment costs","t":"e.g. [[₹750 crore]] AgriSURE fund"},{"l":"Expand multilingual AI advisories and Krishi Vigyan Kendra (KVK) field demos to bridge the skill gap","t":"e.g. Bharat-VISTAAR with Bhashini voice support"},{"l":"Strengthen rural broadband connectivity and enforce clear data-privacy safeguards for farmer records under AgriStack","t":""},{"l":"Simplify drone pilot licensing and link satellite-GIS data directly with crop insurance payouts","t":"e.g. KISAN and PMFBY integration"}],"cue":"Shared service models, targeted subsidies, and strong rural digital infrastructure make precision tech affordable for small farms."},{"k":"diagram","q":"Draw the diagram for Precision agriculture","g":{"dir":"LR","nodes":[["D","Drones and sensors"],["S","Soil and crop data"],["A","AgriStack and decision support"],["V","Advice - seed, water, fertiliser"],["Y","Lower cost, higher yield"]],"edges":[["D","S",""],["S","A",""],["A","V",""],["V","Y",""]]}},{"k":"data","q":"Which digital platforms support farmers?","title":"Data","rows":[{"l":"Agri-extension through social media","t":"farmers increasingly learn through micro-learning formats such as Instagram reels and YouTube shorts; a low-cost complement to KVKs and Kisan Call Centres (Notebook 2)"},{"l":"Krishi Integrated Command and Control Centre (Ministry of Agriculture)","t":"a central hub for agricultural data and decision support (named in notebook; details not traced)"},{"l":"Meghdoot app","t":"location-, crop- and weather-based farm advice"},{"l":"Digital Agriculture Mission (Cabinet, 2 Sept 2024)","t":"[[₹2,817 crore]] (Centre [[₹1,940 crore]]); AgriStack (farmer, land and crop registries), Krishi Decision Support System, soil profile mapping, Digital Crop Survey. The target of [[11 crore]] Farmer IDs was reached on 23 Oct 2026, five months before the March 2027 deadline (Ministry of Agriculture)"}]}]},{"id":"GS34-nanotechnology-in-agriculture","line":"GS3.4","part":"E-technology for farmers","name":"Nanotechnology in Agriculture","own":true,"cards":[{"k":"define","q":"What is meant by nanotechnology in agriculture?","text":"Use of materials at the [[1–100]] nanometre scale in farming—including nano fertilisers (IFFCO’s nano urea, 2021 in [[500]] ml bottles; nano DAP), nano pesticides, nanosensors, and nano packaging."},{"k":"for","q":"What are the claimed benefits of nano fertilisers and nanotech?","rows":[{"l":"Cuts bulky fertiliser use and the subsidy bill","t":"one [[500]] ml bottle can replace a urea bag, potentially cutting subsidised urea use by [[50%]] (Parliamentary Standing Committee, March 2023)."},{"l":"Boosts nutrient uptake and cuts soil and water runoff via targeted foliar delivery and real-time nanosensors","t":"e.g. IFFCO nano urea and nano DAP"},{"l":"Slashes storage and transport costs since a [[500]] ml bottle is far easier to move than a heavy urea bag","t":""},{"l":"Extends shelf life and cuts post-harvest losses using antimicrobial nano coatings and smart packaging","t":""},{"l":"Backed by ready domestic manufacturing across six nano urea plants with a capacity of [[26.6 crore]] bottles a year (Rajya Sabha, July 2024)","t":""}],"cue":"Ultra-small particles deliver nutrients and protection directly to plants, slashing fertiliser subsidies, freight costs, and runoff."},{"k":"against","q":"Why is nano urea contested?","rows":[{"l":"Contested yield and nutrition results","t":"two-season PAU trials found [[50%]] soil nitrogen plus nano urea sprays cut wheat yields by [[≈21.6%]] and paddy by [[≈13%]], with grain nitrogen (protein) down up to [[17%]]."},{"l":"Weak regulatory vetting","t":"approvals leaned on manufacturer data, lacking independent multi-season trials and biosafety studies of nano nitrogen."},{"l":"Unknown long-term risks of nanoparticles accumulating in soil, water, and human health","t":""},{"l":"Higher net cost for farmers, as two bottles per spray plus hired labour can cost more than the granular urea saved","t":""},{"l":"Coercive market practices, with cooperatives forcing farmers to buy nano bottles alongside subsidised urea (Down To Earth ground reports)","t":""}],"cue":"Contested field yields, higher spraying costs, and missing long-term biosafety checks raise doubts over premature mass rollout."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Run independent, multi-season, multi-location trials on yield and grain protein before recommending fertiliser cuts (via ICAR and state agricultural universities)","t":""},{"l":"Strictly enforce biosafety, toxicity, and residue testing across soil, water, and food (under DBT’s 2020 Guidelines for Nano-Based Agri-Inputs)","t":""},{"l":"Ban forced tagging or bundling of nano bottles with subsidised urea at cooperatives and retail outlets","t":""},{"l":"Cut foliar spraying labour costs by linking nano inputs with shared drone services","t":"e.g. Namo Drone Didi and Custom Hiring Centres"},{"l":"Train farmers via Krishi Vigyan Kendras (KVKs) on correct dosage and balanced soil-plus-foliar nutrition","t":""}],"cue":"Mandate independent multi-season testing, stop forced bundling, and lower spraying costs before scaling adoption."}]},{"id":"GS35-food-inflation","line":"GS3.5","part":"Farm subsidies","name":"Food inflation","own":true,"cards":[{"k":"define","text":"A sustained rise in food prices; because food carries a large weight in the CPI basket, food shocks move headline inflation. Any shock to cropping patterns or supply feeds into inflation.","q":"What is food inflation, and why does it matter so much in India?"},{"k":"list","rows":[{"l":"Rain dependence","t":"[[≈52%]] of net sown area depends on rainfall (notebook)"},{"l":"Narrow food basket","t":"rice and wheat make up [[≈78%]] of foodgrain output (ES 2022-23, notebook); pulses and edible oils depend on imports"},{"l":"Post-harvest losses","t":"[[≈30–40%]] of fruits and vegetables lost after harvest (see GS3.4 → Marketing)"},{"l":"Fragmented supply chain","t":"many intermediaries and weak cold chains magnify supply shocks"},{"l":"Fuel and transport costs","t":"diesel runs trucks and pumps, so fuel hikes pass into food prices; in June 2026 the RBI raised its FY27 inflation projection from [[4.6%]] to [[5.1%]], citing pass-through of higher energy prices"},{"l":"MSP and rural wages","t":"MSP sets a price floor; employment schemes (MGNREGA, now VB-G RAM G) push up farm wages"},{"l":"Rising incomes and urbanisation","t":"demand shifts to pulses, vegetables, dairy and meat"}],"q":"What drives food inflation in India?","cue":"Rain → narrow basket → losses → middlemen → fuel → MSP and wages → richer diets: supply is fragile and demand is shifting.","title":"PYQ 2024 Q2"}]},{"id":"GS35-rbi-inflation-control","line":"GS3.5","part":"Farm subsidies","name":"RBI and food inflation","own":true,"cards":[{"k":"list","rows":[{"l":"Target","t":"CPI [[4%]] ± [[2%]]; the RBI usually looks through supply-driven food shocks and acts only to stop them spilling into core inflation"},{"l":"Limits of monetary policy","t":"food carries a high weight in CPI, so monetary policy cannot fix a supply shortfall"},{"l":"Prices outside RBI control","t":"MSP increases, procurement and stocking decisions, and import policy move food prices"}],"q":"Why can’t the RBI control food inflation on its own?","cue":"Look through the shock → can’t grow food with rates → the government sets the food levers.","title":"PYQ 2024 Q2"}]},{"id":"GS35-farm-credit-pacs-ardbs","line":"GS3.5","part":"Farm subsidies","name":"Farm credit (PACS, ARDBs)","own":true,"cards":[{"k":"define","text":"Institutional credit for farmers. PACS (Primary Agricultural Credit Societies) are village-level cooperatives giving short-term loans; ARDBs (Agriculture and Rural Development Banks) give long-term investment credit.","q":"What are PACS and ARDBs?"},{"k":"for","rows":[{"l":"Rising flow of credit","t":"ground-level credit rose from [[≈₹8.5 lakh crore]] (FY15) to [[₹28.7 lakh crore]] (FY25) (ES 2025-26)"},{"l":"Cooperative reach","t":"cooperative banks provide [[≈30–40%]] of rural credit, with PACS as the village-level outlet"},{"l":"Cheaper than informal credit","t":"institutional loans reduce dependence on moneylenders"},{"l":"PACS model","t":"one member, one vote; no profit motive; credit, storage and marketing under one roof; PACS are being computerised"},{"l":"ARDBs","t":"long-term investment credit; the first was set up in Punjab in 1920"}],"q":"How has institutional farm credit improved?","cue":"More credit → cooperative reach → cheaper than moneylenders → PACS as hubs → ARDBs for the long term."},{"k":"against","rows":[{"l":"Access","t":"bank penetration is only [[≈30%]] (RBI); only [[≈40%]] of farmers have access to formal credit (NABARD)","fix":"Kisan Credit Card (collateral-free limit [[₹2 lakh]], RBI 2025); Modified Interest Subvention Scheme (loan limit [[₹5 lakh]])","h":"Finance"},{"l":"Risk and NPAs","t":"agricultural GNPA [[≈6.2%]], the highest of any sector (others [[≈1.2%]]); loan waivers ([[≈₹2.5 lakh crore]] announced between 2014 and March 2022) weaken repayment discipline","h":"Finance"},{"l":"Lender’s risk","t":"monsoon dependence, pests and price swings; small holdings give little collateral; informal tenants have no papers","h":"Finance"},{"l":"Capacity and social capital","t":"PACS need training and capacity building to work as accountable village institutions; they are also being given godowns (see Buffer stock)","h":"People and skills"},{"l":"Technology","t":"digital delivery and records are needed to reach rural clients at low cost (see E-technology, GS3.4)","h":"Technology"},{"l":"Low productivity","t":"average crop yield ≈2.7 t/ha in India against 5.9 in China and 7.2 in the USA (notebook)","h":"Technology"},{"l":"Low digital use","t":"only [[≈37%]] use online banking (NSSO survey, notebook)","h":"Technology"},{"l":"Governance","t":"cooperatives need stronger oversight and professional management","h":"Rules and institutions"},{"l":"ARDB weakness","t":"poor recovery ([[≈40%]], notebook), under-capitalisation, governance problems","h":"Rules and institutions"},{"l":"Indebtedness","t":"about half of agricultural households have debt of [[₹15,000]] or more","h":"Equity and sustainability"}],"q":"Why does farm credit still fall short?","cue":"Access → Risk and NPAs → Lender’s risk → Capacity and social capital → Technology → Low productivity → Low digital use → Governance → ARDB weakness → Indebtedness."}]},{"id":"GS35-farm-subsidies","line":"GS3.5","part":"Farm subsidies","name":"Farm Subsidies","own":true,"cards":[{"k":"define","q":"How do direct and indirect farm subsidies differ?","text":"Direct support puts cash in farmers’ hands (PM-KISAN, state schemes); indirect support lowers input costs (fertiliser, power, seeds, credit). The core reform goal is replacing price subsidies with direct benefit transfer (DBT)."},{"k":"for","q":"Why are farm subsidies needed?","rows":[{"l":"Ensures national food security","t":"cheap inputs built self-sufficiency in rice and wheat after the Green Revolution."},{"l":"Supplements small-farmer income directly without distorting prices","t":"e.g. PM-KISAN pays [[₹6,000]]/year; states add top-up schemes"},{"l":"Cushions farmers against weather and crop-loss shocks","t":"e.g. PMFBY has paid claims above [[₹2.1 lakh crore]], PIB Aug 2026"},{"l":"Speeds up technology and HYV seed adoption","t":"e.g. rice and wheat seeds subsidised at [[50%]] or [[₹10]]/kg, whichever is lower"},{"l":"Cuts middleman diversion by sending cash straight to farmer bank accounts via DBT","t":""}],"cue":"Subsidies lower farming costs, shield farmers from crop and income shocks, and secure national food supply."},{"k":"against","q":"What are the costs of farm subsidies?","rows":[{"l":"Heavy fiscal burden crowds out farm investment","t":"Budget 2026-27 allocates [[₹2,27,629 crore]] for food and [[₹1,70,805 crore]] for fertiliser subsidies (BE), while Punjab’s power subsidy costs [[≈₹20,000 crore]]/year(PSPCL spent [[≈₹1.2 lakh crore]] over the years)."},{"l":"Severe ecological damage","t":"Punjab extracts [[≈165%]] of its groundwater recharge, India causes [[≈17%]] of global aquatic nitrogen pollution, and ranks among the top [[3]] agrifood-system emitters."},{"l":"Distorts cropping patterns","t":"cheap power, fertiliser, and assured procurement over-incentivise water-guzzling paddy and wheat over pulses and oilseeds."},{"l":"Skews fertiliser use","t":"urea MRP frozen at [[₹242]]/45-kg bag since 2018 pushes use to [[≈141 kg]]/ha away from the ideal [[4]]:[[2]]:[[1]] NPK ratio, dropping irrigated fertiliser response from [[13.4 kg]] grain/kg NPK (1970) to [[3.7 kg]] (2005) (Lok Sabha)."},{"l":"Unequal benefits and persistent distress","t":"subsidies favour large farmers and states like Punjab over Bihar, [[≈6 lakh]] farmers faced PM-KISAN DBT exclusion, [[11,290]] farm-sector suicides occurred in 2022 ([[5,207]] farmers, [[6,083]] labourers; NCRB), and India ranked [[105]]/127 in the Global Hunger Index 2024."}],"cue":"Open-ended input subsidies drain public funds, degrade soil and groundwater, and lock farmers into rice-wheat monoculture."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Redirect funds from input subsidies into public capital expenditure (irrigation, storage, rural roads) to raise the investment-to-subsidy ratio","t":""},{"l":"Replace price subsidies with targeted per-hectare DBT to stop leakage and input overuse, while widening state cover for excluded farmers","t":""},{"l":"Raise agricultural R&D spending","t":"every [[₹1]] invested returns [[≈₹13]], far outperforming input subsidies."},{"l":"Curb urea overuse through nutrient-based pricing (N, P, K, S), neem-coated, nano, and sulphur-coated (Urea Gold) urea, and Aadhaar-linked PoS checks (iFMS)","t":""},{"l":"Build food processing, quality standards, and assured markets for crops beyond wheat and rice to encourage diversification","t":""}],"cue":"Shift spending from distorting input subsidies to public infrastructure, R&D, and direct cash transfers."},{"k":"data","rows":[{"l":"Crop insurance","t":"insurers’ premium income has exceeded claims paid by more than [[₹10,000 crore]] every year since 2019 (Rural Voice, PMFBY data)"},{"l":"PMFBY (crop insurance, Feb 2016)","t":"farmer premium [[2%]] for kharif, [[1.5%]] for rabi, [[5%]] for commercial and horticulture crops; the rest is shared Centre–state 50:50 (90:10 for NE and Himalayan states). Kharif 2016 to Rabi 2025-26: [[92.5 crore]] farmer applications insured (PIB, Aug 2026)"},{"l":"RKVY (Rashtriya Krishi Vikas Yojana)","t":"encourages states to raise public investment in agriculture; projects are approved by a State-Level Sanctioning Committee; also supports agri-entrepreneurs – now PM-RKVY: [[₹57,075 crore]] within the [[₹1,01,322 crore]] PM-RKVY and Krishonnati Yojana umbrella (Cabinet, 3 Oct 2024)"},{"l":"State income-support schemes","t":"Andhra Pradesh Annadata Sukhibhava ([[₹20,000]] a year, including PM-KISAN) replaced YSR Rythu Bharosa ([[₹13,500]] a year); Telangana Rythu Bharosa ([[₹6,000]]/acre per season) replaced Rythu Bandhu ([[₹5,000]]/acre per season); Odisha KALIA (income support, including for landless households); Chhattisgarh Rajiv Gandhi Kisan Nyay Yojana (input assistance); West Bengal Krishak Bandhu ([[₹10,000]]/acre a year, pro-rata, minimum [[₹4,000,]] plus a death benefit); Madhya Pradesh Bhavantar Bhugtan Yojana (price-deficiency payment); Haryana Bhavantar Bharpai Yojana (pays the gap when mandi prices of notified vegetables, fruits and bajra fall below a protected price; [[₹600]]/quintal for bajra in 2021); Karnataka Raitha Siri ([[₹10,000]]/ha for millets); Maharashtra Krishi Sanjivani (climate-resilient farming); Punjab: Paani Bachao Paisa Kamao, crop residue management, solar tube wells"}],"q":"Which schemes and data back up farm subsidies?"},{"k":"data","q":"How should farm subsidies be reformed?","title":"Data","rows":[{"l":"More R&D","t":"every [[₹1]] returns [[≈₹13]] (notebook)"}]}]},{"id":"GS35-wto-agreement-on-agriculture-and-farm-su","line":"GS3.5","part":"Farm subsidies","name":"WTO Agreement on Agriculture and Farm Subsidies","own":true,"cards":[{"k":"define","q":"How does the WTO Agreement on Agriculture classify farm subsidies?","text":"The Agreement on Agriculture (1995) sorts farm support into Amber (trade-distorting, capped at [[10%]] for developing countries), Blue (production-limiting) and Green (minimally distorting, uncapped) boxes.","ed":true},{"k":"for","q":"How does India defend its farm support at the WTO?","rows":[{"l":"Protects national food security by allowing public stockholding to feed free grain to [[≈81 crore]] beneficiaries under NFSA","t":"e.g. PMGKAY distribution"},{"l":"Safeguards smallholders via Article [[6.2]], which exempts input and investment subsidies for low-income,resource-poor farmers ([[86%]] of India’s farmers are small and marginal)","t":""},{"l":"Uses a flawed 1986–88 external reference price that ignores decades of inflation, artificially inflating India’s measured market price support","t":""},{"l":"Offsets historic asymmetry","t":"countries with high 1986–88 subsidies kept permanent above-cap entitlements, while India with low or negative base-period support took none (e.g., US and EU AMS headroom)."},{"l":"Remains non-trade-distorting because procured grain is used for domestic welfare rather than dumped onto global markets (protected by the 2013 Bali Peace Clause)","t":""}],"cue":"Public stockholding and input subsidies are essential food-security and livelihood lifelines, not trade distortions, and look inflated only due to outdated 1986–88 WTO rules."},{"k":"against","q":"What challenges does India face at the WTO on farm support?","rows":[{"l":"Rice support hit [[≈$7.6 billion]] in 2024–25 ([[≈11.8%]] of production value against the [[10%]] cap), forcing India to invoke the Peace Clause for the seventh time since 2020 (India’s WTO notification, April 2026)","t":""},{"l":"Repeated multilateral deadlock","t":"MC14 (Yaoundé, March 2026) ended without a permanent solution on public stockholding, leaving India reliant on an interim Peace Clause."},{"l":"The Peace Clause covers only pre-2013 programmes and traditional staples, imposes heavy notification burdens, and bars export disruptions","t":""},{"l":"Developed exporters (US, Australia, and others) have filed counter-notifications accusing India of under-reporting rice and wheat price support, which India rejects","t":""},{"l":"Non-tariff disputes persist","t":"the US alleges India blocks dairy imports by refusing products from animals fed GM feed (alongside wider WTO subsidy clashes, such as India’s [[≈$35]]/fisher support vs up to [[≈$76,000]] in Europe, Dec 2024)."}],"cue":"Breaching the 10% subsidy ceiling, strict Peace Clause limits, and repeated multilateral deadlock leave India’s farm programmes vulnerable to trade disputes."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Secure a permanent solution for public stockholding that excludes food-security procurement from Amber Box limits, or index the 1986–88 reference price to inflation","t":""},{"l":"Set fair farm subsidy caps measured per farmer rather than per country to end the structural gap between developing smallholders and rich nations","t":""},{"l":"Adopt a Special Safeguard Mechanism (SSM) letting developing countries temporarily raise tariffs against sudden import surges and price crashes","t":""},{"l":"Restore a fully functional two-tier WTO dispute-settlement system and preserve inclusive, consensus-based decision-making","t":""},{"l":"Frame balanced rules for digital trade (preserving developing-country policy space on customs duties)alongside equitable fisheries rules","t":"e.g. a 25-year moratorium on distant-water fishing subsidies"}],"cue":"Update outdated subsidy math, exempt food-security stocks permanently, and rebalance WTO rules toward per-farmer equity and consensus."},{"k":"diagram","q":"Draw the diagram for WTO Agreement on Agriculture","g":{"dir":"TD","nodes":[["W","WTO Agreement on Agriculture"],["A","Amber box - trade-distorting, 10% de minimis"],["B","Blue box - production-limiting"],["G","Green box - minimal distortion"],["P","Peace clause for food stocks, Bali 2013"]],"edges":[["W","A",""],["W","B",""],["W","G",""],["A","P",""]]}}]},{"id":"GS35-msp","line":"GS3.5","part":"MSP","name":"MSP (Minimum Support Price)","own":true,"cards":[{"k":"define","q":"What is meant by MSP?","text":"The floor price at which the government stands ready to buy a crop, recommended by CACP and approved by CCEA.","ed":true},{"k":"list","q":"Which crops does MSP cover?","rows":[{"l":"Mandated crops","t":"[[22]]: [[7]] cereals, [[5]] pulses, [[7]] oilseeds, [[3]] commercial crops (cotton, jute, copra)"},{"l":"Plus sugarcane","t":"Fair and Remunerative Price (FRP), making [[23]] in all"}]},{"k":"for","q":"Why is MSP important?","rows":[{"l":"Lowers price risk and lifts farm incomes, helping farmers escape the low-income, low-investment trap (payouts hit [[₹3.3 lakh crore]] for [[1.8 crore]] farmers in 2024–25, PIB)","t":""},{"l":"Stocks the PDS for [[≈81 crore]] NFSA beneficiaries and builds national buffers (wheat [[≈26.6 MMT]] in RMS 2024–25 and rice [[≈52.5 MMT]] in KMS 2023–24, [[≈79 MMT]] combined)","t":""},{"l":"Nudges crop diversification when backed by active buying of pulses and oilseeds","t":"e.g. [[100%]] procurement of tur, urad, and masur under PM-AASHA"},{"l":"Sets a benchmark price floor in mandis that prevents distress sales even without full government purchase","t":""},{"l":"Stabilises consumer food prices by letting the government release buffer stocks during inflation spikes","t":"e.g. Bharat Atta and Bharat Dal sales"}],"cue":"An assured floor price removes market uncertainty, raises farm incomes, and secures food stocks for public welfare."},{"k":"against","q":"What are the problems with MSP?","rows":[{"l":"Narrow crop and regional bias","t":"[[≈85%]] of procurement is wheat and rice, while Punjab and Haryana supply >[[60%]] of central wheat despite producing only [[≈30%]], leaving smallholders mostly uncovered (unlike decoupled income payments abroad)."},{"l":"Locks farmers into water-guzzling paddy and wheat (the cobweb effect), blocking diversification and depleting groundwater","t":""},{"l":"Heavy fiscal and storage burden","t":"open-ended buying piles up FCI buffer stocks beyond norms, causing high carrying costs and grain spoilage (making a blanket legal MSP fiscally risky)."},{"l":"Input costs rise faster than MSP hikes, alongside ongoing demands to calculate MSP on comprehensive C2+[[50%]] costs rather than A2+FL (Swaminathan formula)","t":""},{"l":"Breaches WTO Amber Box subsidy caps","t":"especially for rice—exposing India to international trade disputes."}],"cue":"Open-ended procurement for just two crops drains public funds, skews cropping patterns, and leaves most smallholders out."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Scale Price Deficiency Payment Schemes (PDPS) under PM-AASHA to pay the gap between market price and MSP via DBT without costly physical storage (modeled on MP’s Bhavantar Bhugtan Yojana)","t":""},{"l":"Expand active procurement and guaranteed off-take for pulses, oilseeds, and millets to break the rice-wheat lock-in","t":"e.g. NAFED and NCCF buying under PSS"},{"l":"Decentralise procurement to eastern and central states by building local warehouses and mandi centres (Shanta Kumar Committee recommendation)","t":""},{"l":"Pair MSP with decoupled direct income transfers (like PM-KISAN) so small and marginal farmers benefit regardless of marketable surplus","t":""},{"l":"Address the Parliamentary Standing Committee’s legal MSP recommendation by strengthening rural mandis, FPOs, and cold chains first so market prices stay above MSP naturally","t":""}],"cue":"Shift from physical grain buying to direct price-deficiency payments, diversified procurement, and stronger market infrastructure."},{"k":"diagram","q":"Draw the low-income trap diagram (MSP)","g":{"dir":"LR","nodes":[["I","Low income"],["S","Low savings"],["V","Low investment"],["P","Low productivity and returns"],["M","MSP - assured price"]],"edges":[["I","S",""],["S","V",""],["V","P",""],["P","I",""],["M","I",""]]}},{"k":"diagram","q":"Draw the diagram for MSP","g":{"dir":"LR","nodes":[["C","CACP - cost A2+FL, C2"],["R","Recommends MSP"],["G","CCEA approves"],["P","Procurement - FCI, states, PM-AASHA"],["F","Farmer income and central pool"]],"edges":[["C","R",""],["R","G",""],["G","P",""],["P","F",""]]}},{"k":"data","q":"How is MSP fixed, and what do committees say?","title":"Data","rows":[{"l":"Procurement share","t":"[[≈65%]] of wheat and rice produced is procured by FCI (notebook, not traced)"},{"l":"MSP formula","t":"since the 2018-19 Budget, at least [[1.5 times]] the A2+FL cost (paid-out costs plus family labour); the Swaminathan Commission (National Commission on Farmers, 2006) asked for at least [[50%]] over cost, which farm unions read as C2 (adds rent and interest on owned land and capital) + [[50%]]. CACP recommends; it is advisory"},{"l":"PM-AASHA (2018; continued Sept 2024, [[₹35,000 crore]] to 2025-26)","t":"Price Support Scheme (procurement of notified pulses, oilseeds and copra up to [[25%]] of national production), Price Deficit Payment Scheme for oilseeds ([[40%]] of state production), Price Stabilisation Fund, Market Intervention Scheme (PIB)"},{"l":"Shanta Kumar Committee (2015)","t":"only [[≈6%]] of farmers sold at MSP to procurement agencies (NSSO 2012-13 data; critics say it undercounts); see PDS → Government steps"},{"l":"Other countries","t":"US: Price Loss Coverage pays farmers when market prices fall below an ‘effective reference price’. EU: the Common Agricultural Policy (CAP) gives direct income payments. Both are income-support and decoupled payments that mostly benefit large commercial farms"},{"l":"From the diagram","t":"CCEA approves"}]}]},{"id":"GS35-pds","line":"GS3.5","part":"PDS","name":"PDS","own":true,"cards":[{"k":"define","q":"What is the PDS?","text":"Public Distribution System: fair-price shops distribute subsidised foodgrain procured by the Food Corporation of India (FCI) to eligible households."},{"k":"for","q":"What has the PDS achieved?","rows":[{"l":"Reaches [[≈70%]] of households in 2022–23 (up from [[≈49%]] in 2011–12), giving free grain to [[≈81 crore]] people (under NFSA/PMGKAY)","t":""},{"l":"Cuts extreme poverty","t":"without the PDS, the poverty gap would be [[18–20%]] wider."},{"l":"Improves child nutrition","t":"NFSA prevented [[≈1.8 million]] cases of child stunting, stunting fell from [[48%]] (NFHS-3, 2005–06) to [[35.5%]] (NFHS-5, 2019–21), and undernourishment fell to [[≈60 million]] (2000–2019)."},{"l":"Slashed grain leakage from [[42%]] (2011–12) to [[22%]] (2022–23), with sharp drops in Bihar ([[≈69%]] → [[≈19%]]) and West Bengal ([[≈69%]] → [[9%]])","t":""},{"l":"Digitised last-mile delivery","t":"e-POS machines cover [[≈100%]] of fair-price shops, with [[≈95%]] of transactions Aadhaar-authenticated."}],"cue":"Guaranteed subsidised foodgrains shield poor households from hunger and poverty, with digitisation sharply cutting historic leakages."},{"k":"against","q":"What are the limitations of the PDS?","rows":[{"l":"Persistent leakage and diversion","t":"still [[≈22%]] in 2022–23 (losing [[≈₹69,000 crore]] a year; ICRIER, Gulati 2024),with Tamil Nadu rising from [[12%]] to [[25%]] (2023), Uttar Pradesh highest in absolute terms (ICRIER), and [[≈20]],000malpractice cases against fair-price shop dealers."},{"l":"Heavy fiscal burden","t":"the true economic cost is [[≈$45 billion]] against [[≈$16 billion]] shown in the budget (due to off-budget FCI borrowings and carrying costs)."},{"l":"Exclusion of [[≈10 crore]] eligible people because the Census is delayed and NFSA coverage still uses the 2011 population","t":""},{"l":"Nutrition gap","t":"a grain-based (rice and wheat) basket fails to end malnutrition and micronutrient deficiencies on its own."},{"l":"Storage and transport inefficiency","t":"[[≈90%]] of handling facilities are non-mechanised, worsened by weak depot monitoring and inefficient routes."}],"cue":"High fiscal costs, persistent diversion, outdated population lists, and a cereal-only basket limit efficiency and nutrition."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Curb transit diversion via SMART-PDS (end-to-end digital tracking with GPS and SMS alerts, now integrated under SARTHAK-PDS) and One Nation One Ration Card for inter-state portability","t":""},{"l":"Update beneficiary rolls using current population projections (until the delayed Census is completed) to cover the [[≈10 crore]] left-out poor and weed out ghost cards","t":""},{"l":"Modernise storage and logistics through Depot Darpan (real-time monitoring and composite rating of storage depots), mechanised silos, and route-optimisation algorithms (IIT-Delhi and the UN World Food Programme's Anna Chakra)","t":""},{"l":"Bridge the nutrition gap by scaling fortified rice, pulses, and millets in the PDS alongside PM POSHAN (mid-day meals) and Mission POSHAN [[2.0]]","t":""},{"l":"Bring off-budget food costs onto the budget and pilot Direct Benefit Transfer (DBT) cash options in urban areas with strong banking and market access (Shanta Kumar Committee recommendation)","t":""}],"cue":"End-to-end digital tracking, mechanised storage, updated beneficiary lists, and fortified baskets plug leaks and improve health."},{"k":"diagram","q":"Draw the diagram for PDS","g":{"dir":"LR","nodes":[["F","FCI and state procurement"],["C","Central pool"],["S","States lift grain"],["D","Fair price shops"],["B","Ration card holders - ONORC"]],"edges":[["F","C",""],["C","S",""],["S","D",""],["D","B",""]]}},{"k":"data","q":"How has the PDS evolved, and how should it be revamped?","title":"Data","rows":[{"l":"Suggestion","t":"narrow subsidised coverage from [[≈53%]] to the poorest [[≈15%]] (notebook)"},{"l":"PDS timeline","t":"Revamped PDS (1992) for tribal and hilly areas; Targeted PDS (1997) with APL and BPL categories; Antyodaya Anna Yojana (2000): [[35 kg]] per household per month for the poorest"},{"l":"NFSA 2013","t":"covers [[75%]] of the rural and [[50%]] of the urban population; includes maternity benefits for pregnant and lactating women; grain was priced at [[₹3]]/[[₹2]]/[[₹1]] per kg; free since January 2024 (PMGKAY, extended to 2028); the eldest woman (18+) is head of household on the ration card"},{"l":"PMGKAY","t":"extra [[5 kg]] of free grain during Covid; since 2023 merged with the free NFSA entitlement (Agriculture notes)"},{"l":"Jan Poshan Kendras","t":"fair-price shops turned into nutrition hubs selling more food items and offering other services (pilot, 2024); a millet-for-rice switch in PDS could save [[≈$1.4 bn]] (notebook)"},{"l":"Shanta Kumar Committee","t":"(High-Level Committee on restructuring FCI, Jan 2015): cut NFSA coverage from [[67%]] to [[≈40%]] of the population; move to cash transfers; let FCI procure fully only in states weak in procurement; end state bonuses on MSP; outsource storage; negotiable warehouse receipts with bank loans of up to [[80%]] of MSP value"},{"l":"From the diagram","t":"Ration card holders - ONORC"}]}]},{"id":"GS35-buffer-stock","line":"GS3.5","part":"Buffer stock","name":"Buffer stock","own":true,"cards":[{"k":"define","q":"What is the buffer stock?","text":"Foodgrain held by the FCI above the operational stock norm so the PDS can run uninterrupted and market prices can be stabilised (dating from the Fourth Five-Year Plan, 1969–74)."},{"k":"for","q":"Why does India keep a buffer stock?","rows":[{"l":"Keeps PDS and NFSA entitlements supplied even in a bad crop year","t":"e.g. FCI moved over [[3 million]] tonnes for PMGKAY during the Covid lockdown"},{"l":"Stabilises domestic prices through Open Market Sale Scheme (OMSS) interventions","t":"e.g. FCI sold [[34.8 lakh]] tonnes of wheat in 2022–23, and doubled the 2026–27 rice sale target to [[50]] LMT"},{"l":"Protects consumers from food inflation spikes","t":"e.g. open-market sales cut CPI wheat inflation from [[≈25%]] to [[≈6.5%]] by May 2024"},{"l":"Shields India from global grain price spikes without forcing panic imports","t":"e.g. during global supply disruptions"},{"l":"Anchors MSP procurement by absorbing post-harvest surpluses from farmers (preventing distress sales in surplus states)","t":""}],"cue":"Holding strategic grain reserves protects poor households from hunger and shields consumers and the economy from sudden price shocks."},{"k":"against","q":"What are the problems with India’s buffer stock?","rows":[{"l":"Heavy fiscal cost","t":"carrying excess grain inflates FCI’s economic cost and the national food subsidy ([[₹2,27,629 crore]], BE 2026–27)."},{"l":"Chronic excess stocks","t":"on [[1]] July 2026 the central pool held [[925.9]] LMT of wheat and rice against a [[411.2]] LMT norm, with rice at [[403.1]] LMT against [[135.4]] LMT (≈3x; government data, Business Today)."},{"l":"High storage wastage","t":"[[≈87,000 tonnes]] were lost in FCI godowns in 2010–11 (Down To Earth), over [[40,000 tonnes]] rotted in 2014–20, and rodents eat [[≈2.4–2.6 MT]] of stored grain a year (IGMRI)."},{"l":"Regionally skewed and unmechanised storage","t":"Punjab has [[611]] godowns (full after a record rice crop)versus [[≈30]] in West Bengal, with non-mechanised handling."},{"l":"Poor stock rotation","t":"ignoring first-in-first-out (FIFO) rules in outdated warehouses causes older grain to rot and raises pilferage."}],"cue":"Holding stocks far above norms drains public money, overloads uneven storage, and causes heavy grain wastage."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Build decentralised godowns at Primary Agricultural Credit Societies (PACS) under the World’s Largest Grain Storage Plan to bridge regional gaps","t":""},{"l":"Adopt an automatic liquidation rule to sell stocks above buffer norms early via OMSS, exports, or ethanol diversion (Shanta Kumar Committee)","t":""},{"l":"Phase out open Covered and Plinth (CAP) storage and build mechanised steel silos via public-private partnerships","t":""},{"l":"Enforce strict first-in-first-out (FIFO) rotation and real-time depot monitoring (through Depot Darpan and SMART-PDS)","t":""},{"l":"Decentralise procurement to eastern and central states so grain is stored and distributed locally rather than hauled from Punjab","t":""}],"cue":"Decentralise modern storage, offload excess grain early, and enforce digital stock rotation to cut costs and waste."},{"k":"diagram","q":"Draw the diagram for Buffer stock","g":{"dir":"TD","nodes":[["C","Central pool"],["O","Operational stock - PDS, welfare"],["R","Strategic reserve"],["E","Excess over buffer norm"],["M","OMSS sales, exports, ethanol"]],"edges":[["C","O",""],["C","R",""],["C","E",""],["E","M",""]]}},{"k":"data","q":"How is storage being expanded and stock released?","title":"Data","rows":[{"l":"World’s Largest Grain Storage Plan in the","t":"Cooperative Sector (pilot from 31 May 2023): godowns at PACS; by July 2026, 313 PACS had finished godowns with more than [[1.8 LMT]] of capacity, and 1,012 PACS had been identified (PIB, Sept 2026)"}]}]},{"id":"GS35-agricultural-revolutions","line":"GS3.5","part":"Technology missions","name":"Agricultural revolutions","own":true,"cards":[{"k":"define","q":"What is meant by an agricultural revolution?","text":"Mission-mode drives that sharply lifted output of one product group.","ed":true},{"k":"list","q":"Name India’s agricultural revolutions.","rows":[{"l":"Green","t":"high-yielding wheat and rice from the mid-1960s; M.S. Swaminathan"},{"l":"White","t":"milk; Operation Flood from 1970; Verghese Kurien, NDDB"},{"l":"Blue","t":"fish; Neeli Kranti, now PMMSY"},{"l":"Yellow","t":"oilseeds; Technology Mission on Oilseeds, 1986"},{"l":"Golden","t":"horticulture"},{"l":"Silver","t":"eggs"},{"l":"Pink","t":"meat and poultry"},{"l":"Round","t":"potato"}]},{"k":"for","q":"What did the agricultural revolutions achieve?","rows":[{"l":"Ended famine risk and secured national food supply","t":"foodgrain output of [[357.7 million]] tonnes in 2024–25 backs NFSA cover for [[≈80 crore]] people (PIB)."},{"l":"Improved protein and micronutrient nutrition","t":"milk reached [[247.9 MT]] in 2024–25 (world’s largest),raising daily availability from [[319]] g to [[485]] g per person since 2014–15 (BAHS 2025)."},{"l":"Diversified farm incomes and cushioned crop shocks","t":"livestock now makes up [[≈31%]] of agricultural GVA (alongside Golden and Blue Revolution gains in horticulture and fisheries)."},{"l":"Empowered rural women with regular cash income, as dairy cooperatives and livestock rearing employ mostly women","t":"e.g. Amul and state dairy federations"},{"l":"Turned India into a major agri-exporter across rice, marine products, and horticulture","t":"e.g. shrimp exports boosted under Blue Revolution / PMMSY"}],"cue":"Targeted technology, credit, and market drives turned chronic food deficits into surpluses, lifting rural incomes and nutrition."},{"k":"against","q":"What were their downsides?","rows":[{"l":"Distorted cropping patterns","t":"MSP-backed rice and wheat crowded out pulses and oilseeds, pushing pulses imports to a record high in 2024–25 (alongside heavy edible oil imports)."},{"l":"Depleted groundwater and degraded soil due to water-guzzling paddy-wheat monoculture and heavy chemical fertiliser use","t":"e.g. falling water tables in Punjab and Haryana"},{"l":"Widened regional inequality, as Green Revolution gains stayed concentrated in Punjab, Haryana, and western UP while leaving eastern and rainfed states behind","t":""},{"l":"Favoured larger farmers who could afford tubewells, HYV seeds, and machinery, leaving small and marginal holders behind","t":""},{"l":"Eroded native crop biodiversity and nutrition by replacing climate-resilient millets (Shri Anna) and local varieties with a few high-yielding hybrids","t":""}],"cue":"Single-crop focus, input-heavy farming, and uneven regional rollout caused ecological damage, import dependence, and inequality."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Boost domestic oilseeds and pulses through targeted cluster missions","t":"NMEO-Oilseeds (2024), NMEO-Oil Palm (2021), and Mission for Aatmanirbharta in Pulses (2025)—backed by assured PM-AASHAprocurement."},{"l":"Transition to an Evergreen Revolution (M.S. Swaminathan) using micro-irrigation (PMKSY), Soil Health Cards, and natural farming to restore groundwater and soil","t":""},{"l":"Expand productivity drives to eastern and rainfed India with region-specific seeds and irrigation (e.g., Bringing Green Revolution to Eastern India","t":"BGREI)."},{"l":"Scale allied-sector missions in fisheries, livestock, and horticulture","t":"(e.g., PMMSY, Rashtriya Gokul Mission, and MIDH) so smallholders earn steady non-crop income."},{"l":"Aggregate small and marginal farmers via FPOs and women-led cooperatives to share machinery, cold chains, and direct market access","t":""}],"cue":"Shift from single-crop, input-heavy drives to a sustainable, region-wide \"Evergreen Revolution\" focused on deficit crops and smallholders."},{"k":"diagram","q":"Draw the diagram for Agricultural revolutions","g":{"dir":"TD","nodes":[["R","Agricultural revolutions"],["G","Green - foodgrains"],["W","White - milk"],["B","Blue - fish"],["Y","Yellow - oilseeds"],["P","Pink - meat"],["O","Golden - horticulture"]],"edges":[["R","G",""],["R","W",""],["R","B",""],["R","Y",""],["R","P",""],["R","O",""]]}},{"k":"data","q":"Which current missions continue them?","title":"Data","rows":[{"l":"National Food Security Mission","t":"(rice, wheat, pul
