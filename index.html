anised manufacturing workers (ASI) and contributing to [[≈9 million]] formal-sector jobs lost between 2011–12 and 2017–18","t":""},{"l":"Global outsourcing chains drive large firms and [[≈120]] MNCs to procure from small informal suppliers and subcontract work to unrecorded home-based workers to slash overheads","t":""},{"l":"Open trade accelerates the adoption of imported machinery and automation that displace routine formal-sector roles","t":"e.g. TCS layoffs and automated factory assembly lines"},{"l":"Rigid labour laws, such as the old 100-worker retrenchment permission threshold, deterred formal expansion under global competition and pushed firms to stay small or hire through contractors","t":"e.g. Industrial Disputes Act, 1947"},{"l":"Fluctuating global demand and cross-border digital platforms favour on-demand, piece-rate hiring over permanent payrolls","t":"e.g. seasonal apparel exports and app-based gig work"}],"cue":"Globalisation compels firms to cut fixed labour costs, adopt labour-saving technology, and outsource production to survive intense international price competition."},{"k":"against","q":"Is informalisation always harmful?","rows":[{"l":"Absence of social security, written contracts, and job protection leaves workers vulnerable to income shocks and discourages employer investment in skilling","t":"e.g. PLFS data showing over half of regular wage workers lack social security"},{"l":"Fragmented informal units lack economies of scale, formal credit, and technology adoption, dragging down overall labour productivity and formal-sector growth","t":"e.g. Economic Survey critique of \"dwarf firms\""},{"l":"Unrecorded informal activity narrows the direct and indirect tax base, constraining public investment in infrastructure and welfare","t":"e.g. India's low direct tax-to-GDP ratio"},{"l":"Low and volatile informal wages suppress household purchasing power and widen inequality, weakening consumption-led economic growth","t":"e.g. World Inequality Lab reports"},{"l":"Although staffing firms argue contract jobs offer a flexible entry route onto formal payrolls for first-time workers, weak upward mobility often locks workers into permanent precarity","t":"e.g. repeated contract renewals without benefit parity"}],"cue":"Informalisation undermines long-term development by trapping workers in low-productivity, insecure jobs and eroding public revenues, despite offering a temporary entry route for new entrants."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Implement the four Labour Codes to simplify compliance, raise retrenchment thresholds to [[300]] workers,and mandate written appointment letters and minimum wages across sectors","t":""},{"l":"Register unorganised, migrant, and gig workers on national platforms to deliver portable health, insurance,and pension benefits","t":"e.g. e-Shram portal and PM Shram Yogi Maan-dhan"},{"l":"Subsidise employer social-security contributions and link fiscal incentives directly to verified formal payroll expansion","t":"e.g. PM Viksit Bharat Rozgar Yojana and Aatmanirbhar Bharat Rojgar Yojana"},{"l":"Integrate small informal suppliers into formal value chains through digital registration, collateral-free credit,and enforceable payment timelines","t":"e.g. Udyam portal, TReDS, and ONDC"},{"l":"Align vocational skilling and paid apprenticeships with industry demand so workers transition into higher-productivity formal roles","t":"e.g. PMKVY [[4.0]] and National Apprenticeship Promotion Scheme"}],"cue":"Reversing informalisation requires simplifying labour regulations to encourage formal hiring while extending portable social security and credit to unorganised workers."}]},{"id":"GS38-premature-deindustrialisation","line":"GS3.8","part":"Effects of liberalisation","name":"Premature deindustrialisation","own":true,"cards":[{"k":"define","q":"What is premature deindustrialisation?","text":"When manufacturing’s share of output and jobs peaks at a much lower income level than it did in today’s rich countries (Dani Rodrik).","ed":true},{"k":"for","q":"Why did services grow faster than industry in India?","rows":[{"l":"Telecom and IT reforms after 1991 and the 1999 telecom policy expanded phone connections from [[≈10 million]] to over [[1 billion]], creating the digital backbone for service-led growth","t":""},{"l":"A skilled, English-speaking workforce allowed IT and business services to grow [[≈30%]] a year after 1991 as global firms set up offshore centres","t":"e.g. Global Capability Centres"},{"l":"Services exports required minimal physical infrastructure like ports or highways, letting efficient firms scale without waiting for economy-wide logistics upgrades","t":"e.g. software exports via satellite and fibre links"},{"l":"Unresolved bottlenecks in land acquisition, rigid labour laws, high power costs, and logistics kept domestic manufacturing uncompetitive","t":"e.g. inverted duty structures and high freight costs"},{"l":"Eased FDI limits in telecom and insurance, alongside private banks, fintech, and SEBI reforms, deepened capital access primarily for modern services","t":"e.g. Narasimham Committee banking reforms"}],"cue":"Early liberalisation of telecom and finance, paired with a skilled English-speaking workforce, enabled low-infrastructure services to surge while rigid factor markets held manufacturing back."},{"k":"against","q":"Can India develop without industry?","rows":[{"l":"Services generate [[≈56%]] of GVA but only [[≈30%]] of jobs, leaving India unable to absorb millions of low- and semi-skilled workers exiting agriculture","t":"e.g. persistent disguised unemployment in farming"},{"l":"Weak backward and forward linkages in high-end services limit broad-based economic spillovers, keeping semi-skilled youth underemployed","t":"e.g. high-tech services, online training, and the global freelance market absorbing mainly educated workers"},{"l":"Merchandise trade deficits cannot be sustainably offset by services alone, as rising goods imports require competitive domestic goods exports to safeguard external stability","t":"e.g. electronics and crude oil import bills"},{"l":"Skipping labour-intensive industrialisation widens regional and income inequality by concentrating growth in urban service hubs over rural hinterlands","t":"e.g. Bengaluru and Hyderabad outpacing eastern states"},{"l":"As a counter-view, manufacturing’s real share has actually held steady at [[≈17–18%]] of GVA, meaning its apparent nominal decline reflects a relative price effect rather than true contraction (ES 2025-26)","t":""}],"cue":"Services cannot absorb India’s massive semi-skilled workforce or offset merchandise import bills, though real output data suggests manufacturing has stagnated rather than shrunk."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Lower manufacturing costs by reforming land, labour, and logistics bottlenecks to make Indian factories globally competitive","t":"e.g. four Labour Codes, PM Gati Shakti, and National Logistics Policy"},{"l":"Scale up labour-intensive manufacturing and domestic supply chains to absorb semi-skilled workers and cut import dependence","t":"e.g. Production Linked Incentive schemes for textiles, electronics, and leather"},{"l":"Accelerate agricultural transformation and rural agro-processing to bridge the gap between farm exits and urban jobs","t":"e.g. PM Formalisation of Micro Food Processing Enterprises and Mega Food Parks"},{"l":"Align vocational education and apprenticeships with modern factory needs to raise worker productivity","t":"e.g. PMKVY [[4.0]] and National Apprenticeship Promotion Scheme"},{"l":"Leverage India’s digital public infrastructure and global service strengths to boost manufacturing value addition via R&D and design","t":"e.g. India Semiconductor Mission and Anusandhan National Research Foundation"}],"cue":"India must pair labour-intensive manufacturing reforms with agro-processing and skill upgrades so industry and services grow as twin engines of employment."},{"k":"diagram","q":"Draw the diagram for Premature deindustrialisation","g":{"dir":"LR","nodes":[["A","Agriculture"],["I","Industry - mass jobs"],["S","Services"],["S2","India - jump to services, weak industrial base"]],"edges":[["A","I",""],["I","S",""],["A","S2",""]]}},{"k":"data","q":"What data show the services-led pattern?","title":"Data","rows":[{"l":"Apparel exports","t":"India’s have stagnated at [[≈$14.5 bn]] (notebook), while Bangladesh’s grew rapidly. Causes: Bangladesh’s LDC duty-free access, scale, and India’s fibre-neutrality issues (Notebook 2)"},{"l":"Services concentration","t":"Karnataka, Maharashtra, Tamil Nadu and Telangana together produce [[≈40%]] of services output (ES 2025-26)"},{"l":"Services can’t force state modernisation","t":"Services alone can’t force state modernisation: services exports are firm-selective, not system-forcing. They need little physical infrastructure and ship nothing physical, so a firm doesn’t care about potholes; they also employ fewer people per dollar earned (ES 2025-26)"}]},{"k":"data","q":"How does India show premature deindustrialisation?","rows":[{"l":"Agriculture","t":"[[≈29%]] of GDP in 1991 to [[≈15%]] by the 2010s"},{"l":"Services","t":"[[≈30%]] to [[55%]]+ of GDP, growing [[≈7.5%]] a year: India jumped to services, bypassing mass manufacturing (GS3 2014 Q1)"}]}]},{"id":"GS38-protectionism-and-currency-pressures","line":"GS3.8","part":"Effects of liberalisation","name":"Protectionism and currency pressures","own":true,"cards":[{"k":"define","q":"What are protectionism and currency pressures?","text":"Protectionism uses tariffs, quotas, subsidies, and non-tariff barriers to shield domestic industry, while currency manipulation deliberately depresses exchange rates for an export edge."},{"k":"for","q":"What are the gains from Protectionism and currency pressures?","rows":[{"l":"Shields strategic and infant domestic industries from unfair foreign subsidies and predatory dumping during capacity-building phases","t":"e.g. domestic solar manufacturing and PLI sectors"},{"l":"Enhances the price competitiveness of Indian merchandise and services exports when the rupee depreciates in real terms, supported by a decade-low REER (RBI)","t":""},{"l":"Corrects bilateral trade imbalances and preserves domestic manufacturing jobs by raising the landed cost of non-essential imports","t":"e.g. customs duty hikes on electronics components and toys"},{"l":"Incentivises foreign firms to bypass tariff walls by setting up local production facilities inside India","t":"e.g. smartphone assembly under the Phased Manufacturing Programme"},{"l":"Provides temporary macroeconomic adjustment space during global trade shocks without triggering formal currency-manipulation sanctions","t":"e.g. India remaining off the US Treasury Monitoring List in January 2026"}],"cue":"Tariff shields and a weaker currency can temporarily protect infant domestic industries from predatory imports while boosting export price competitiveness."},{"k":"against","q":"What challenges do protectionism and currency pressures create for India?","rows":[{"l":"Escalating US tariffs erode Indian export competitiveness","t":"tariffs peaked at [[50%]] on most Indian goods (Aug 2025), an unsigned February 2026 framework set [[18%]], and most goods now pay normal duty plus [[10%]] under Section [[301]] (since July 2026)."},{"l":"Sharp rupee depreciation fuels imported inflation and raises external debt servicing costs, as the rupee fell [[≈9%]] in a year ([[≈₹87.5]] to [[≈₹95.4]] per dollar by mid-2026) alongside a decade-low REER (RBI)","t":""},{"l":"Widening merchandise deficits and volatile foreign capital outflows strain the Balance of Payments, with the trade deficit hitting [[$333.6 bn]] and net FPI outflows reaching [[$16.5 bn]] in FY26 (RBI)","t":""},{"l":"Trade diversion and predatory dumping threaten domestic producers as excess goods shut out of the US market are redirected into India","t":"e.g. steel, chemicals, and electronics inflows"},{"l":"Weakening multilateralism leaves developing economies exposed to unilateral trade coercion as the WTO dispute system remains stalled and mega-regional or bilateral deals set the rules","t":"e.g. WTO Appellate Body paralysis"}],"cue":"Global tariff walls, volatile capital outflows, and sharp rupee depreciation squeeze export earnings, widen external deficits, and stoke imported inflation."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Strengthen supply-side competitiveness by scaling domestic manufacturing, cutting logistics bottlenecks,and lowering the cost of capital","t":"e.g. PLI schemes and PM Gati Shakti"},{"l":"Diversify export markets and secure preferential tariff access through new Free Trade Agreements with the UAE, Australia, EFTA, UK, and EU","t":""},{"l":"Deploy macroeconomic buffers and alternative payment mechanisms to absorb currency shocks, backed by forex reserves of about [[$700 bn]] and trade settlement in rupees","t":""},{"l":"Cushion exporters against tariff and liquidity pressures through targeted credit and market-access support","t":"e.g. Export Promotion Mission and Credit Guarantee Scheme for Exporters"},{"l":"Protect domestic industry from predatory trade diversion through timely WTO-compliant trade remedies,including anti-dumping and safeguard duties","t":"e.g. DGTR investigations"}],"cue":"India must cushion external shocks through forex buffers and bilateral trade deals while lowering domestic logistics and capital costs to boost export competitiveness."},{"k":"data","rows":[{"l":"Export support","t":"Export Promotion Mission ([[₹25,060 crore]], FY26 to FY31; Niryat Protsahan and Niryat Disha) and Credit Guarantee Scheme for Exporters ([[₹20,000 crore]], [[100%]] NCGTC guarantee) (Cabinet, Nov 2025); Trade Connect e-Platform (ES 2025-26)"},{"l":"India–US framework for an Interim Agreement (6 Feb 2026)","t":"removed the extra [[25%]] ‘Russian oil’ tariff; the [[18%]] rate awaits a signed agreement"}],"q":"What data and examples back up Protectionism and currency pressures?"},{"k":"diagram","q":"Draw the diagram for Protectionism and currency pressures","g":{"dir":"LR","nodes":[["T","Tariffs and protectionism abroad"],["E","Exports fall"],["C","Current account deficit widens"],["R","Rupee under pressure"],["F","RBI sells forex, imported inflation"]],"edges":[["T","E",""],["E","C",""],["C","R",""],["R","F",""]]}}]},{"id":"GS38-quality-control-orders","line":"GS3.8","part":"Industrial policy","name":"Quality Control Orders","own":true,"cards":[{"k":"define","q":"What are Quality Control Orders?","text":"Mandatory regulations issued under the Bureau of Indian Standards (BIS) Act, 2016 requiring specified goods—made in India or imported—to meet Indian quality standards before sale."},{"k":"for","q":"Why use Quality Control Orders?","rows":[{"l":"Protects consumer health, safety, and the environment by keeping hazardous and sub-standard goods out of the market","t":"e.g. electrical appliances, pressure cookers, and toys"},{"l":"Curbs predatory dumping of cheap, low-grade imports","t":"mainly from China—giving domestic manufacturers space to scale (e.g., toy imports falling [[52%]] and exports surging [[239%]] between FY15 and FY23, ES 2025-26)."},{"l":"Builds \"Brand India\" by enforcing common quality benchmarks that lift the global reputation and export acceptability of Indian goods","t":"e.g. steel, footwear, and engineering products"},{"l":"Pushes domestic firms to upgrade shop-floor technology, quality control, and testing infrastructure to meet formal benchmarks","t":"e.g. adoption of BIS ISI certification"},{"l":"Reduces information asymmetry for buyers, lowering verification costs and preventing a race to the bottom on product quality","t":"e.g. cement and construction materials"}],"cue":"Enforcing mandatory quality standards protects consumers from hazardous goods, curbs predatory low-grade imports, and upgrades domestic manufacturing for global competitiveness."},{"k":"against","q":"What are the problems with Quality Control Orders?","rows":[{"l":"Indiscriminate QCOs on intermediate inputs raise costs and cut supply for downstream user industries,prompting the review and revocation of [[46]] QCOs covering [[51]] products in 2025–26 (Survey 2025; ES 2025-26)","t":"e.g. upstream chemicals, polymers, and polyester yarns"},{"l":"Heavy BIS certification, factory inspection, and lab-testing costs for each product strain MSMEs and push smaller units toward closure","t":"e.g. multi-product compliance fees and testing delays"},{"l":"Trading partners treat sudden QCOs as disguised non-tariff barriers, inviting WTO disputes, retaliatory curbs, and friction in FTA negotiations","t":"e.g. EU and ASEAN objections over mandatory certifications"},{"l":"Limited domestic accredited testing labs and foreign-plant inspection backlogs create customs clearance bottlenecks and input shortages","t":"e.g. port delays for specialised industrial raw materials"},{"l":"Restricting cheaper imported components erodes the price competitiveness of Indian finished exports in global value chains","t":"e.g. textiles, footwear, and auto components"}],"cue":"Blanket quality mandates on intermediate inputs raise production costs, burden small firms with compliance hurdles, and trigger trade friction."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Restrict QCOs primarily to finished consumer goods involving health, safety, or environmental risks while exempting critical upstream inputs","t":"e.g. ES 2025-26 value-chain framework"},{"l":"Grant targeted QCO exemptions, longer transition windows, and testing subsidies to micro and small enterprises to prevent compliance-driven closures","t":"e.g. February 2026 MSME QCO exemptions for Udyam units and Transition Facilitation Order, 2026"},{"l":"Expand accredited private and cluster-level testing laboratories alongside mutual recognition agreements with global standard bodies to eliminate certification delays","t":"e.g. NABL-accredited testing clusters"},{"l":"Conduct mandatory regulatory impact assessments and consultations with downstream user industries before notifying new QCOs","t":"e.g. DPIIT and BIS pre-notification reviews"},{"l":"Exempt inputs imported strictly for R&D or re-export manufacturing under advance authorisation so export competitiveness remains intact","t":"e.g. February 2026 Furniture QCO export and R&D exemptions"}],"cue":"Smart quality regulation requires targeting finished consumer goods rather than upstream inputs, subsidising MSME testing, and streamlining certification timelines."}]},{"id":"GS38-industrial-policy","line":"GS3.8","part":"Industrial policy","name":"Industrial policy","own":true,"cards":[{"k":"define","q":"What is meant by industrial policy?","text":"The state’s choice of which sectors it reserves, licenses, protects or promotes.","ed":true},{"k":"for","q":"Can recent changes raise industrial growth?","rows":[{"l":"Scales domestic manufacturing and exports via Production Linked Incentives (PLI), generating [[≈₹2.6 lakh crore]] in investment, [[≈₹24 lakh crore]] in output, [[≈₹15.5 lakh crore]] in exports, and [[≈14.6 lakh]] jobs across [[14]] sectors (DPIIT, June 2026)","t":""},{"l":"Lowers freight and supply-chain costs through Multimodal Logistics Parks (introduced in 2017 for freight aggregation, intermodal transfer, and mechanised warehousing), PM Gati Shakti, industrial corridors, and record public capex","t":""},{"l":"Replaces criminal penalties with trust-based governance, as the Jan Vishwas Act 2026 decriminalised [[717]] provisions in [[79]] Acts (after [[183]] in 2023), building on the Companies (Amendment) Act, 2017 (wider related-party definition, size-scaled penalties, and removing government approval for managerial pay above [[11%]] of profits)","t":""},{"l":"Enhances firm scalability and hiring flexibility under the four Labour Codes (in force [[21]] Nov 2025) by raising the lay-off permission threshold from [[100]] to [[300]] workers","t":""},{"l":"Unlocks private capital and cleans up industrial balance sheets by opening nuclear energy under the SHANTI Act (2025) and enabling RBI-directed insolvency cases against large defaulters via the Banking Regulation (Amendment) Act, 2017","t":""}],"cue":"Deregulation, targeted production incentives, labour flexibility, and logistics modernisation lower compliance costs and crowd in private manufacturing investment."},{"k":"against","q":"What still limits industrial policy?","rows":[{"l":"Slow fiscal execution dampens investor confidence, with only [[≈₹37,000 crore]] disbursed out of [[₹1.9 lakh crore]] allocated under PLI schemes by June 2026","t":""},{"l":"High structural costs of land acquisition, industrial power cross-subsidies, and cost of capital erode factory price competitiveness","t":"e.g. industrial power tariffs subsidising agricultural and domestic users"},{"l":"Protective tariff hikes and indiscriminate Quality Control Orders (QCOs) raise input prices and hurt downstream user industries","t":"e.g. upstream chemicals, polymers, and steel"},{"l":"Uneven state-level implementation of concurrent land and labour laws fragments the single market and delays clearances","t":"e.g. staggered state rule notifications for the Labour Codes"},{"l":"Heavy focus on large-scale assembly subsidies leaves MSME technology upgrades, domestic R&D, and deep component localisation under-supported","t":"e.g. import-dependent electronics assembly"}],"cue":"Slow incentive disbursals, high factor costs, protective input tariffs, and uneven state-level execution prevent Indian manufacturing from achieving global scale."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Accelerate PLI claim verification and milestone-based disbursals while operationalising the National Manufacturing Mission (Budget 2025–26) for clean-tech and MSME ecosystems","t":"e.g. time-bound digital disbursal portals"},{"l":"Rationalise industrial power tariffs by phasing out cross-subsidies and lowering long-term borrowing costs via development finance institutions","t":"e.g. NaBFID and green energy open-access rules"},{"l":"Calibrate customs duties and restrict QCOs to finished consumer goods so user industries access globally priced intermediate inputs","t":"e.g. ES 2025–26 value-chain framework"},{"l":"Incentivise states to standardise land banks, single-window clearances, and Labour Code rules through competitive federalism benchmarks","t":"e.g. Business Reform Action Plan and India Industrial Land Bank"},{"l":"Shift gradually from assembly subsidies toward domestic R&D, design-linked incentives, and cluster-based skilling to deepen value addition","t":"e.g. Anusandhan National Research Foundation and PMKVY [[4.0]]"}],"cue":"Sustaining industrial momentum requires faster incentive payouts, competitive power and land markets, calibrated input tariffs, and coordinated Centre–state execution."},{"k":"list","rows":[{"l":"Multimodal logistics parks","t":"freight aggregation, intermodal transfer and mechanised warehouses to cut logistics cost"},{"l":"Companies (Amendment) Act, 2017","t":"wider ‘related party’ definition; penalties scaled to company size; no government approval needed for managerial pay above [[11%]] of profits"},{"l":"IBC put to work","t":"Banking Regulation (Amendment) Act, 2017 lets the RBI direct banks to start insolvency cases against large defaulters"}],"title":"Changes in 2017 (2017 Q12)","q":"What industrial-policy changes came in 2017?"},{"k":"list","q":"How has India’s industrial policy evolved?","rows":[{"l":"1948 and 1956","t":"state-led licensing (Industrial Policy Resolutions)"},{"l":"1991","t":"delicensing, MRTP removal, automatic FDI, PSU reservation narrowed to atomic energy and railway operations"},{"l":"Post-2014","t":"Make in India (2014), PLI (2020), National Manufacturing Mission (Budget 2025–26), four Labour Codes (in force [[21]] Nov 2025), Jan Vishwas Acts (2023 and 2026), SHANTI Act (2025) (GS3 2017 Q12)"}]},{"k":"diagram","q":"Draw the diagram for Industrial policy","g":{"dir":"LR","nodes":[["A","1948 and 1956 - state-led, licensing"],["B","1991 - delicensing, FDI"],["C","2014 - Make in India"],["D","2020 - PLI, Atmanirbhar Bharat"]],"edges":[["A","B",""],["B","C",""],["C","D",""]]}},{"k":"data","q":"Which reforms does the Survey highlight?","title":"Data","rows":[{"l":"Reforms the Survey highlights (2025)","t":"GST rationalisation; notification of the four labour codes (details: Labour codes keyword in this part); opening nuclear power to private players (SHANTI Act, 2025); [[100%]] FDI in insurance; MoEFCC relaxed green-cover norms for industry, linking them to polluting potential instead of a uniform [[33%]] mandate"},{"l":"From the diagram","t":"1991 - delicensing, FDI; 2020 - PLI, Atmanirbhar Bharat"}]}]},{"id":"GS38-labour-codes","line":"GS3.8","part":"Industrial policy","name":"Labour codes","own":true,"cards":[{"k":"define","text":"Four Codes (Wages; Industrial Relations; Social Security; Occupational Safety, Health and Working Conditions) consolidating 29 central labour laws, in force from 21 November 2025.","q":"What are the four labour codes?","ed":true},{"k":"list","title":"Code","rows":[{"l":"Code on Wages, 2019","t":"Main objective: Wage protection; Key provisions: Universal minimum wages, floor wage, timely payment, equal remuneration"},{"l":"Industrial Relations Code, 2020","t":"Main objective: Regulating industrial relations; Key provisions: Trade unions, collective bargaining, dispute resolution, fixed-term employment"},{"l":"Code on Social Security, 2020","t":"Main objective: Social protection; Key provisions: EPF, ESI, gratuity, maternity benefits, gig and platform workers"},{"l":"OSH and Working Conditions Code, 2020","t":"Main objective: Workplace protection; Key provisions: Safety standards, health check-ups, appointment letters, migrant worker welfare"}],"q":"What does each labour code do?","cue":"Wages → relations → security → safety."},{"k":"for","rows":[{"l":"Economies of Scale","t":"Larger and Competitive Factories: Greater workforce flexibility encourages firms to expand beyond the erstwhile 100-worker threshold."},{"l":"Regulatory Simplification","t":"Ease of Doing Business: Consolidation of 29 laws into 4 codes reduces regulatory complexity, multiple registrations and compliance costs."},{"l":"Wage Security","t":"Universal Wage Protection: Statutory minimum wages and timely payment provisions extend protection across employments."},{"l":"Labour Formalisation","t":"Formalisation of Employment: Mandatory appointment letters and improved employment records encourage formal hiring and accountability."},{"l":"Inclusive Social Security","t":"Wider Social Security: Gig and platform workers are recognised, with provisions for insurance, healthcare, maternity and old-age protection through notified schemes."}],"q":"What are the benefits of the labour codes?","cue":"Bigger factories → simpler rules → wage security → formal jobs → gig cover."},{"k":"against","rows":[{"l":"Labour Flexibility vs Job Security","t":"Job-Security Concerns: Firms employing 100–299 workers no longer require prior government permission under the special provisions for retrenchment and lay-offs, raising insecurity."},{"l":"Industrial Relations Imbalance","t":"Weakening Collective Bargaining: Mandatory 14-day prior notice for strikes across industrial establishments may constrain workers' bargaining power."},{"l":"Precarious Employment","t":"Social Security Deficit: Gig workers' recognition does not automatically confer regular employee status or guarantee conventional PF and ESI benefits."},{"l":"Cooperative Federalism Deficit","t":"Uneven Implementation: Labour is a Concurrent List subject; differences in state rules and enforcement can create regulatory uncertainty."},{"l":"Employment-Elastic Growth Deficit","t":"Jobless Growth Persists: Labour reforms alone cannot generate employment without adequate demand, labour-intensive manufacturing and skill development."}],"q":"What are the concerns about the labour codes?","cue":"Job insecurity → weaker unions → precarious gig work → uneven states → still jobless growth."},{"k":"value","rows":[{"l":"Regulatory Convergence","t":"Uniform Implementation: Harmonise Centre-State rules through cooperative federalism and strengthen labour administration."},{"l":"Flexicurity","t":"Balance Flexibility with Security: Ensure transparent retrenchment procedures, adequate compensation and effective implementation of the Worker Re-skilling Fund, which provides [[15 days]]' last-drawn wages to retrenched workers."},{"l":"Portable Social Protection","t":"Universal Social Security: Strengthen e-Shram registration, portable benefits and effective implementation of aggregator contributions for gig workers."},{"l":"Ease of Formalisation","t":"MSME Formalisation: Provide digital compliance assistance, easier registrations and institutional credit to bring small enterprises into the formal sector."},{"l":"Employment-Elastic Growth","t":"Employment-Oriented Growth: Complement labour reforms with labour-intensive manufacturing, apprenticeships, skill development and women-friendly workplaces."},{"l":"Conclusion","t":"the success of labour reforms must be measured not merely by the flexibility they give employers, but by their ability to convert growth into formal, productive and socially secure employment"},{"l":"Factual distinction","t":"the 300 threshold does not free smaller employers from all obligations: notice, compensation and retrenchment safeguards still apply; gig-worker social security is a framework for notified schemes, not every conventional employee benefit"}],"q":"What is the way forward on the labour codes?","cue":"Converge rules → flexicurity → portable protection → formalise MSMEs → job-rich growth."},{"k":"data","rows":[{"l":"Labour codes","t":"wages (basic + DA) must be at least [[50%]] of pay (CTC) under the Code on Wages; 33 states/UTs had pre-published draft rules; a proposed phased roll-out: FY26 firms with 500+ workers, FY27 100–500, FY28 under 100 (notebook)"}],"q":"What do the codes require on wages, and how far have states adopted them?"}]},{"id":"GS38-manufacturing-and-make-in-india","line":"GS3.8","part":"Industrial growth","name":"Manufacturing and Make in India","own":true,"cards":[{"k":"define","q":"What is Make in India?","text":"A 2014 initiative to make India a global manufacturing hub by raising manufacturing’s share of the economy.","ed":true},{"k":"for","q":"What supports India’s manufacturing push?","rows":[{"l":"Absorbs millions of low- and semi-skilled workers exiting agriculture into productive formal jobs","t":"e.g. labour-intensive textiles, food processing, and electronics assembly"},{"l":"Sustains strong expansion momentum, with industrial GVA growing [[7%]] in H1 FY26 (ES 2025–26) and manufacturing PMI staying above [[50]] since mid-2021 (hitting [[58.4]] in June 2025)","t":""},{"l":"Drives factory capex and global value chain integration through coordinated reforms across PLI schemes,the National Manufacturing Mission, ANRF, and PM Gati Shakti (ES 2025–26)","t":""},{"l":"Builds on established domestic production scale in core sectors like steel, cement, autos, generic pharma,electronics, and textiles","t":"e.g. India ranking as the world's second-largest steel producer"},{"l":"Holds a steady real share of [[≈17–18%]] of GVA, proving that its lower [[≈14%]] nominal share reflects relative price effects rather than structural contraction (ES 2025–26)","t":""}],"cue":"Manufacturing is essential to absorb surplus farm labour, and recent policy pushes have sustained strong factory momentum and real output resilience."},{"k":"against","q":"Why does Indian manufacturing remain small?","rows":[{"l":"Land acquisition and logistics bottlenecks inflate production costs","t":"[[≈70%]] of delays across the [[11]] corridors of the National Industrial Corridor Programme stem from land acquisition (despite operational nodes at Dholera and Shendra–Bidkin, and the [[2]],158-acre PM MITRA Park foundation laid at Bhainsola,Dhar on [[17]] Sept 2025), while logistics cost [[≈8%]] of GDP (DPIIT–NCAER, FY24; older estimates [[13–14%]] vs [[8–10%]] in China, with India spending [[≈$7]] where Bangladesh spends [[≈$3]])."},{"l":"Legacy small-scale industry reservations, rigid labour laws, and skill mismatches keep factories subscale,leaving an average Indian factory with [[≈240]] workers versus [[800]]+ in China and preventing garments and leather from reaching global scale","t":""},{"l":"Weak global competitiveness keeps manufacturing at [[≈17–18%]] of real GVA ([[≈14%]] nominal), capturing just [[2.9%]] of world manufacturing GVA and [[1.8%]] of world merchandise exports (ES 2025–26), with labour-intensive apparel exports stagnating while Bangladesh’s surged","t":""},{"l":"High cost of capital","t":"driven by a persistent Current Account Deficit requiring foreign savings and a risk premium—alongside a long-term finance gap after DFIs like ICICI and IDBI became banks deters heavy industrial investment."},{"l":"Chronic underinvestment in innovation limits high-value manufacturing, with Gross Expenditure on R&D (GERD) at [[≈0.6%]] of GDP against [[≈2.4%]] in China and [[3.5%]] in the US","t":""}],"cue":"High land and logistics costs, subscale factories, expensive capital, and low R&D spending prevent Indian manufacturing from capturing global market share."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Accelerate plug-and-play industrial corridors, operationalise all seven PM MITRA textile parks, and cut freight costs through multimodal logistics and state land banks","t":"e.g. PM Gati Shakti, National Logistics Policy, and India Industrial Land Bank"},{"l":"Implement the four Labour Codes across states to let factories scale while aligning vocational training with shop-floor demand","t":"e.g. 300-worker lay-off threshold, PMKVY [[4.0]], and National Apprenticeship Promotion Scheme"},{"l":"Deepen global value chain integration via targeted Free Trade Agreements while rationalising inverted customs duties on intermediate inputs","t":"e.g. FTAs with UAE, Australia, EFTA, UK, and EU alongside the National Manufacturing Mission"},{"l":"Boost private-sector innovation and close the technology gap through long-term concessional research financing and industry-academia grants","t":"e.g. [[₹1 lakh crore]] Research, Development and Innovation (RDI) Fund and ANRF"},{"l":"Bridge the post-DFI long-term project finance gap and help MSMEs scale up through dedicated development finance institutions and cluster credit guarantees","t":"e.g. NaBFID, SIDBI cluster funds, and Credit Guarantee Scheme for MSMEs"}],"cue":"Unlocking manufacturing scale requires plug-and-play industrial land, flexible labour and skilling, global value chain integration, and long-term R&D and project finance."},{"k":"data","q":"What data back up the manufacturing story?","title":"Data","rows":[{"l":"Sector strengths","t":"(Survey): Steel: 2nd-largest crude steel producer. Cement: 2nd-largest producer; plants sit near raw materials, with [[≈85%]] of the industry in Rajasthan, Andhra Pradesh, Tamil Nadu, Madhya Pradesh, Gujarat and others; per-capita consumption [[290 kg]] against a [[540 kg]] global average. Autos: 3rd-largest vehicle market. Pharma: 3rd-largest by volume, [[≈20%]] of global generics; import dependence cut for bulk drugs such as Penicillin G (notebook). Electronics: 7th-largest export in FY22 to 3rd in FY25; India is the 2nd-largest mobile phone maker, [[325 million]]+ phones (notebook); India made [[≈44%]] of smartphones imported into the US in Q2 2025, up from [[13%]], led by Apple’s shift from China (Canalys); [[≈1.2 lakh]] direct jobs (notebook). Textiles: a [[$179 bn]] industry, [[≈2%]] of GDP, [[≈11%]] of manufacturing GVA"},{"l":"Innovation","t":"India ranks 3rd in scientific publications, 4th in trademarks and 6th in patents (ES 2025-26). Global Innovation Index: 38th of 139 in both 2025 and 2026; first among lower-middle-income economies"},{"l":"Manufacturing share","t":"Manufacturing [[≈16–17%]] of GVA (Notebook 2); slipped to [[≈16%]] of GDP (notebook)"},{"l":"Autos","t":"[[≈7.1%]] of GDP; EV gaps: charging points, imported batteries, weak grid → National Electric Mobility Mission Plan 2020 (notebook)"},{"l":"Pharma","t":"turnover [[≈₹4 lakh crore]]; [[≈40%]] of US generic demand; dependence on imported APIs and key starting materials, low R and D, regulatory hurdles (notebook)"},{"l":"Steel","t":"capex [[≈₹1 lakh crore]]; construction and infrastructure use [[≈68%]] of steel; cheap imports (FY25), imported coking coal, green-steel (green hydrogen) transition → National Steel Policy 2017 ([[300 MT]] target), Steel Scrap Recycling Policy (notebook)"},{"l":"Five cross-cutting challenges","t":"for Indian industry: finance (informal credit), scale and productivity, informality and compliance, market access and GVC links, infrastructure and skills (notebook)"},{"l":"Make in India (2014)","t":"targets of manufacturing at [[25%]] of GDP and [[100 million]] jobs; four pillars: new processes, new infrastructure, new sectors, new mindset. Atmanirbhar Bharat (2020). National Manufacturing Mission (Budget 2025-26): an empowered body, sector clusters, ease of doing business, a future-ready workforce, MSME support, technology adoption. NITI Aayog’s goal: manufacturing at [[25%]] of GDP by 2035"},{"l":"Textiles","t":"6th-largest exporter; 5th-largest technical-textiles market; employs many women; cotton-heavy rather than man-made fibre; MSME-dominated; faces [[≈9–14%]] tariffs in the EU and US → PM MITRA ([[7]] parks), PLI for textiles, National Technical Textiles Mission (notebook)"}]}]},{"id":"GS38-pli","line":"GS3.8","part":"Industrial growth","name":"PLI","own":true,"cards":[{"k":"define","q":"What is the PLI scheme?","text":"Production Linked Incentive (PLI) offers a cash incentive on incremental sales of goods made in India across [[14]] sectors to build scale and offset cost disadvantages against imports."},{"k":"for","q":"What is the rationale for PLI?","rows":[{"l":"Enables firms to reach efficient global scale and lower unit costs by directly rewarding incremental output over a base year","t":"e.g. mobile phone and bulk drug clusters"},{"l":"Drives massive capital formation and employment","t":"attracting [[≈₹2.6 lakh crore]] investment, [[≈₹24 lakh crore]] production and sales, and [[≈14.6 lakh]] jobs (DPIIT, [[30]] June 2026), led by solar PV modules, pharma,and autos (Auto PLI drew ≈US$[[8.8 bn]]; electronics PLI targets [[≈91,000]] jobs from ≈US$[[2.7 bn]])."},{"l":"Accelerates export growth and import substitution in strategic sectors, with PLI exports growing [[≈10.6%]] annually during FY21–FY25 (ES 2025–26) to reach [[≈₹15.5 lakh crore]] (DPIIT, [[30]] June 2026)","t":""},{"l":"Draws in leading global and domestic manufacturers along with advanced production technology","t":"e.g. Apple’s supply chain and Samsung’s expansion in mobile manufacturing"},{"l":"Ensures fiscal accountability by disbursing budget funds only after verified production and sales targets are met rather than giving upfront subsidies","t":"e.g. audited annual incremental sales claims"}],"cue":"Rewarding verified incremental output allows domestic and global firms to achieve economies of scale, boost exports, and build strategic manufacturing capacity."},{"k":"against","q":"What are the limits of PLI, and how can it improve?","rows":[{"l":"Risks trapping manufacturing in low-value assembly rather than deep localisation, as critical inputs like mobile processors and displays remain imported","t":""},{"l":"Suffers from sluggish payout execution alongside recurring budgetary strain, with only [[≈₹37,000 crore]] disbursed out of [[₹1.9 lakh crore]] approved (June 2026)","t":""},{"l":"Leaves foundational cost disabilities in industrial power, logistics, and cost of capital untouched, risking competitiveness once subsidies end","t":"e.g. high power cross-subsidies and freight costs"},{"l":"Exhibits a big-firm bias due to high investment thresholds, leaving MSMEs and smaller component makers with fewer direct gains","t":"e.g. large-scale electronics and auto eligibility rules"},{"l":"Shows uneven sectoral progress with persistent execution and technology gaps in high-efficiency solar modules and Advanced Chemistry Cell (ACC) batteries","t":""}],"cue":"Shallow assembly-level value addition, slow disbursals, big-firm bias, and unaddressed infrastructure costs limit long-term industrial transformation."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Move beyond final assembly to subsidise the entire upstream component and semiconductor value chain","t":"e.g. India Semiconductor Mission [[2.0]] and the Electronics Components Manufacturing Scheme (ECMS) with outlay raised to [[₹40,000 crore]]"},{"l":"Simplify approval processes and digitise claim audits to speed up disbursals while expanding focus on labour-intensive sectors","t":"e.g. committee recommendations on streamlined verification"},{"l":"Integrate MSMEs and tier-2 suppliers into PLI value chains through lower thresholds, vendor-linking mandates, and cluster support","t":"e.g. textiles, food processing, and SIDBI cluster funds"},{"l":"Lower structural production costs in power, logistics, and long-term finance so factories stay globally competitive post-PLI","t":"e.g. PM Gati Shakti, National Logistics Policy, and NaBFID"},{"l":"Enforce strict sunset clauses and link future incentives to domestic R&D, phased localisation targets, and verified job creation","t":"e.g. Anusandhan National Research Foundation"}],"cue":"Upgrading PLI requires shifting support toward upstream components and R&D, simplifying disbursals, including MSMEs, and fixing structural infrastructure bottlenecks."},{"k":"diagram","q":"Draw the diagram for PLI","g":{"dir":"LR","nodes":[["S","Incremental sales over base year"],["I","Incentive - a share of extra sales"],["C","Scale and lower unit cost"],["E","Exports and import substitution"]],"edges":[["S","I",""],["I","C",""],["C","E",""]]}}]},{"id":"GS38-msmes","line":"GS3.8","part":"Industrial growth","name":"MSMEs","own":false,"cards":[{"k":"define","text":"Micro, small and medium enterprises, classified by investment and turnover: India’s largest non-farm employer across manufacturing and services.","q":"What are MSMEs?","ed":true},{"k":"data","q":"How are MSMEs classified, and what is their make-up?","rows":[{"l":"Limits since 1 April 2025","t":"investment / turnover: micro [[₹2.5]] / [[₹10 crore]]; small [[₹25]] / [[₹100 crore]]; medium [[₹125]] / [[₹500 crore]], so firms can grow without losing MSME benefits"},{"l":"Make-up","t":"[[97%]] micro, [[2.7%]] small, [[0.3%]] medium, yet medium firms give [[≈40%]] of MSME exports, small [[23%]], micro [[17%]] (notebook)"},{"l":"Intro line","t":"“India has [[over 6 crore]] MSMEs spread across rural and urban India; they are its largest job creators, yet just [[≈10%]] have formal credit, so reform is urgent.” (notebook)"}]},{"k":"for","rows":[{"l":"Output and exports","t":"[[31.1%]] of GDP, [[35.4%]] of manufacturing output and [[48.6%]] of exports (ES 2025-26)"},{"l":"Employment","t":"the largest non-farm employer, [[≈11 crore]] jobs; women own [[≈20.5%]] of Udyam-registered units (notebook)"},{"l":"Supply-chain base","t":"feed large firms and exporters as component suppliers"},{"l":"Regional spread","t":"take industry beyond the metros"}],"q":"Why do MSMEs matter?","cue":"Output and exports → jobs → supply chains → regional spread."},{"k":"against","rows":[{"l":"Finance","t":"only [[≈10%]] get formal credit (notebook); the credit gap is [[≈24%]] (SIDBI); schemes favour existing borrowers","fix":"Emergency Credit Line Guarantee Scheme (ECLGS, examiner keyword); PM MUDRA; ‘Champion SMEs’ (Budget 2026-27): [[₹10,000 crore]] SME Growth Fund (equity), [[₹2,000 crore]] top-up to the Self-Reliant India Fund, liquidity support","h":"Finance"},{"l":"Delayed payments","t":"delayed payments to MSMEs, including by government and PSUs, run to [[≈₹10.7 lakh crore]] (notebook)","fix":"TReDS (Trade Receivables Discounting System) now mandatory for CPSE purchases from MSMEs: MSMEs get early payment because banks and financiers discount their receivables; credit guarantee support also provided","h":"Finance"},{"l":"Market access","fix":"GeM, the public procurement marketplace; ONDC for e-commerce","h":"Markets","t":""},{"l":"Technology and clusters","t":"only [[≈6%]] sell on e-commerce, though [[≈45%]] use some AI (notebook)","fix":"Credit Linked Capital Subsidy for technology upgradation; revival of 200 legacy industrial clusters through infrastructure and technology upgrades (Budget 2026-27)","h":"Technology"},{"l":"Compliance","t":"rules and compliance costs weigh most on the smallest firms","h":"Rules and institutions"},{"l":"Informality","t":"outside the formal net, MSMEs miss credit and schemes","fix":"Udyam registration (examiner keyword): simple online registration that opens the door to schemes and credit (notebook)","h":"Equity and sustainability"}],"q":"What constrains MSMEs?","cue":"Credit, delayed payments, market access, technology, compliance, informality."},{"k":"value","rows":[{"l":"Way forward: NITI Aayog for medium firms","t":"turnover-linked working capital, Industry 4.0, R and D, cluster technology upgrades, advanced skills, one digital portal (Udyam); U.K. Sinha Committee – Account Aggregator data, cash-flow-based lending, a Vyapar credit card, a stronger SIDBI ([[₹5,000–10,000 crore]]) (notebook)."},{"l":"Conclusion: MSMEs are bonsai trees","t":"huge potential, stunted by finance, technology and connectivity (notebook)."}],"q":"What is the way forward for MSMEs?"}]},{"id":"GS38-labour-intensive-vs-capital-intensive-ex","line":"GS3.8","part":"Industrial growth","name":"Labour-Intensive vs Capital-Intensive Exports","own":true,"cards":[{"k":"define","q":"What is India’s export structure?","text":"India’s exports lean toward capital- and skill-intensive goods (refined petroleum, pharma, engineering,electronics) rather than mass-employment goods (garments, footwear, toys, food processing)."},{"k":"for","q":"Why did India’s labour-intensive exports fail?","rows":[{"l":"Absorbs millions of low- and semi-skilled workers leaving agriculture into mass formal employment, unlike automated capital-heavy industries","t":"e.g. garments, footwear, toys, and food processing"},{"l":"Generates higher export earnings per unit of scarce capital with lower import intensity than assembly-heavy sectors","t":"e.g. domestic cotton textiles versus import-dependent electronics"},{"l":"Promotes geographically dispersed industrial growth across tier-2 and tier-3 towns while boosting female workforce participation","t":"e.g. Tiruppur knitwear and Agra footwear clusters"},{"l":"Captures global supply-chain diversification (\"China+[[1]]\") in mass consumer goods by leveraging preferential market access","t":"e.g. duty-free entry under the UK and EU FTAs"},{"l":"Complements India’s established comparative advantage in capital- and skill-intensive sectors","t":"refined petroleum, generic pharma, engineering, and electronics—to make trade expansion broad-based (e.g., medium- and high-tech industries accounting for [[46%]] of manufacturing value added, ES 2025–26)."}],"cue":"Prioritising labour-intensive exports alongside existing skill-intensive strengths is vital to absorb surplus farm labour, conserve scarce capital, and decentralise industrial growth."},{"k":"against","q":"What measures support labour-intensive exports?","rows":[{"l":"Rigid labour rules like the old 100-worker retrenchment threshold trapped Indian firms as subscale \"dwarf\" units, whereas rivals like Bangladesh and Vietnam built mega-factories","t":"e.g. average Indian factory employing [[≈240]] workers versus [[800]]+ in China"},{"l":"High structural costs of industrial power cross-subsidies, freight logistics, and expensive capital erode export price competitiveness","t":"e.g. DPIIT–NCAER logistics cost at [[≈8%]] of GDP"},{"l":"Tariff disadvantages in Western markets undercut Indian exporters for years, as Bangladesh enjoyed LDC duty-free access to the EU while India faced higher duties until the UK and EU FTAs","t":""},{"l":"Lack of fibre-neutrality and inverted duty structures made man-made fibre inputs costlier than finished garments, locking India out of the largest global apparel segment","t":"e.g. man-made polyester yarn duties exceeding finished fabric tariffs"},{"l":"Early industrial policy and fiscal incentives such as PLI flowed primarily to capital-heavy sectors, leaving labour-intensive MSMEs under-supported","t":"e.g. mobile electronics, solar PV, and autos capturing initial PLI outlays"}],"cue":"Subscale factories, high factor costs, tariff disadvantages, inverted fibre duties, and capital-biased incentives prevented India’s labour-intensive exports from achieving global scale."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Implement the four Labour Codes across states so factories can scale without prior lay-off permission up to [[300]] workers","t":"e.g. Industrial Relations Code"},{"l":"Build integrated, plug-and-play manufacturing ecosystems through the [[7]] PM MITRA textile parks to cut logistics, power, and compliance costs","t":"e.g. [[2]],158-acre PM MITRA Park at Dhar, Madhya Pradesh"},{"l":"Maximise duty-free export opportunities in garments and footwear by helping MSMEs meet rules-of-origin and quality standards under the UK and EU FTAs","t":"e.g. UK–India CETA granting duty-free access for [[99%]] of Indian exports"},{"l":"Channel affordable trade finance, credit guarantees, and market-access support directly to MSMEs and labour-intensive sectors via the Export Promotion Mission","t":"e.g. Credit Guarantee Scheme for Exporters"},{"l":"Offset formal payroll costs and eliminate inverted duties on man-made fibres through job-linked subsidies and tax rationalisation","t":"e.g. PM Viksit Bharat Rozgar Yojana and GST [[2.0]] inverted duty corrections"}],"cue":"Reviving labour-intensive exports requires factory-scale flexibility, plug-and-play textile parks, FTA market access, targeted MSME export credit, and job-linked incentives."},{"k":"data","q":"What data and examples show the problem?","title":"Data","rows":[{"l":"Why energy is expensive for industry","t":"Why is energy expensive for industry? Cross-subsidy: industry pays above cost so that farmers and households can pay below cost; bulk industrial users get no discount. A rushed net-zero transition could worsen this, because it needs huge capital (ES 2025-26). Also under GS3.9 → Energy"},{"l":"Tirupur knitwear cluster","t":"shifting to man-made fibres, aiming to double turnover to [[≈$10 bn]] (notebook)"}]}]},{"id":"GS38-semiconductors","line":"GS3.8","part":"Industrial growth","name":"Semiconductors","own":true,"cards":[{"k":"define","q":"What is the India Semiconductor Mission?","text":"The India Semiconductor Mission (2021) offers [[≈₹76,000 crore]] ([[≈$10 bn]]) in incentives to build chip fabs, packaging and design capacity in India.","ed":true},{"k":"for","q":"Why do semiconductors matter for India?","rows":[{"l":"Secures strategic autonomy and national security by reducing dependence on a handful of East Asian chip suppliers during geopolitical shocks","t":"e.g. Taiwan Strait risks and global supply disruptions"},{"l":"Feeds foundational technology into critical domestic sectors, including consumer electronics, electric vehicles, defence hardware, and energy-saving systems","t":"e.g. power management ICs and microcontrollers"},{"l":"Anchors India’s booming electronics manufacturing ecosystem","t":"where production surged from [[≈₹1.9 lakh crore]] (2015) to [[≈₹9.5 lakh crore]] (FY24)—by localising its highest-value input."},{"l":"Cuts long-term import bills and strengthens the Balance of Payments as domestic chip demand scales toward [[$100–110 billion]] by 2030","t":""},{"l":"Leverages India’s large chip-design talent pool to move up the value chain from R&D services into full-stack intellectual property and high-tech manufacturing","t":"e.g. Global Capability Centres of major fabless firms"}],"cue":"Building domestic chip fabrication secures strategic autonomy, anchors downstream electronics growth, and captures high-value global supply chains."},{"k":"against","q":"What are the challenges in building a chip industry?","rows":[{"l":"Requires billions of dollars in upfront capital expenditure with slow payback periods and rapid technological obsolescence, making private entry unviable without heavy state subsidies","t":"e.g. Tata Electronics’ Dholera fab requiring [[≈₹91,526 crore]] investment"},{"l":"Lacks any Indian firm at the manufacturing frontier, while key tools are monopolised","t":"such as ASML of the Netherlands in lithography—forcing the state to step in."},{"l":"Suffers from near-total import dependence across silicon wafers, specialty chemicals, gases, and fabrication machinery","t":"e.g. upstream inputs concentrated in Japan, South Korea, and Taiwan"},{"l":"Demands uninterrupted power and millions of litres of ultrapure water daily, straining local utilities and environmental clearances","t":"e.g. zero-fluctuation grid stability for [[24]]/7 fab cleanrooms"},{"l":"Faces a shortage of specialised foundry engineers, cleanroom technicians, and high-volume domestic anchor buyers needed to sustain commercial scale","t":"e.g. domestic talent skewed toward design over fabrication"}],"cue":"Extreme capital intensity, monopolised frontier technology, resource-heavy infrastructure needs, and near-total import dependence create steep entry barriers."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Roll out India Semiconductor Mission [[2.0]] (Semicon [[2.0]], approved July 2026 with a [[₹1,27,500 crore]] outlay across six pillars) to expand beyond fabs into domestic semiconductor equipment, materials, and R&D","t":""},{"l":"Forge strategic technology-transfer partnerships and joint ventures with global foundry and equipment leaders to bridge process gaps","t":"e.g. Tata Electronics partnering with Taiwan’s PSMC and ASML"},{"l":"Develop plug-and-play semiconductor parks with dedicated renewable power corridors, water recycling plants, and multimodal logistics","t":"e.g. Dholera Special Investment Region infrastructure"},{"l":"Nurture domestic fabless startups and indigenous chip IP through R&D grants, venture backing, and component manufacturing incentives","t":"e.g. Design Linked Incentive scheme and Electronics Components Manufacturing Scheme"},{"l":"Build a foundry-ready talent pipeline through industry-led training centres and national Electronic Design Automation (EDA) tool access","t":"e.g. Chips to Startup programme training [[70,000]] students"}],"cue":"Sustaining India's chip ambitions requires full-stack ecosystem subsidies, global technology alliances, dedicated green utilities, and specialised workforce training."}]},{"id":"GS38-skill-india","line":"GS3.8","part":"Industrial growth","name":"Skill India","own":false,"cards":[{"k":"define","text":"Skill India Mission (2015), restructured in 2025 into one scheme combining short-term training, apprenticeships and vocational training for non-literates.","q":"What is Skill India?","ed":true},{"k":"list","q":"What are Skill India’s components?","rows":[{"l":"PMKVY 4.0","t":"short-term, outcome-based training, now including AI, robotics and IoT"},{"l":"NAPS","t":"National Apprenticeship Promotion Scheme"},{"l":"Jan Shikshan Sansthan","t":"vocational training for non-literates"},{"l":"2015 Q8","t":"Make in India needs Skill India"}]},{"k":"for","rows":[{"l":"Scale","t":"PMKVY has trained [[≈1.6 crore]]; [[≈54 lakh]] apprentices engaged since 2016 (PIB, July 2026)"},{"l":"Apprenticeships","t":"the government shares the stipend (see GS3.1 → Employment)","fix":"Government steps)"},{"l":"New-age skills","t":"courses in AI, robotics and IoT"},{"l":"Reaching the excluded","t":"JSS trains non-literates in their own communities"}],"q":"What has Skill India achieved?","cue":"Scale → apprenticeships → new-age skills → reaching the excluded."},{"k":"against","rows":[{"l":"People and skills","t":"only [[≈5%]] of workers have formal vocational training, against [[≈60%]] in Germany (PLFS 2023-24, notebook)","h":"People and skills"},{"l":"Markets","t":"low placement rates; courses do not match what industry wants","h":"Markets"},{"l":"Rules and institutions","t":"poor training quality and weak monitoring","fix":"Sharada Prasad Committee: count placements, design courses with industry, a National Labour Market Information System (see GS3.1 → Employment → Government steps)","h":"Rules and institutions"}],"q":"Why does Skill India fall short?","cue":"Few formally trained, low placement, poor quality."},{"k":"value","rows":[{"l":"Conclusion","t":"Skill India is the bridge between India’s demographic potential and its economic destiny (notebook)"}],"q":"What is the takeaway on Skill India?"}]},{"id":"GS38-creative-economy","line":"GS3.8","part":"Industrial growth","name":"Creative economy","own":true,"cards":[{"k":"define","q":"What is the creative (orange) economy?","text":"The knowledge-based ‘orange’ economy built on intellectual property, technology-driven innovation, and cultural monetisation—spanning films, music, design, crafts, and AVGC-XR—with creative occupations estimated at [[≈20%]] of GVA."},{"k":"for","q":"Why promote the creative economy?","rows":[{"l":"Generates labour-intensive, inclusive employment across tourism, crafts, performing arts, and creative work, absorbing youth and rural artisans","t":"e.g. AVGC sector projected to need nearly [[2 million]] professionals by 2030"},{"l":"Drives high-value service and merchandise exports as Indian films, music, design, and crafts reach global markets","t":"e.g. Indian Media and Entertainment sector reaching [[≈$30 billion]] in 2024"},{"l":"Strengthens India’s global soft power and cultural diplomacy while revitalising traditional heritage and Geographical Indication (GI) clusters","t":"e.g. yoga, Ayurveda, and GI-tagged handicrafts"},{"l":"Democratises entrepreneurship across tier-2, tier-3, and rural regions through low-cost smartphones, affordable data, and OTT platforms","t":"e.g. regional-language creators on YouTube and MyWAVES"},{"l":"Promotes environmentally sustainable, low-carbon economic growth driven by human imagination rather than resource-intensive heavy industry","t":"e.g. digital design, animation, and gaming studios"}],"cue":"Monetising India’s rich cultural heritage and digital talent creates labour-intensive jobs, boosts high-value service exports, and strengthens global soft power without heavy resource extraction."},{"k":"against","q":"What holds the creative economy back?","rows":[{"l":"Banks and traditional lenders avoid funding creative ventures because intangible intellectual property lacks physical collateral","t":"e.g. independent filmmakers, gaming studios, and folk artisans facing working-capital gaps"},{"l":"Slow disposal of IPR applications, weak copyright enforcement, and digital piracy erode creator revenues and deter innovation","t":"e.g. prolonged trademark and patent examination queues"},{"l":"India remains largely a low-margin backend outsourcing hub for foreign studios rather than an owner of globally monetisable original IP","t":"e.g. outsourced VFX and animation post-production work"},{"l":"Multiple local permissions, high compliance costs, and poor physical infrastructure constrain live entertainment and cultural events","t":"e.g. [[10–15]] separate clearances required to stage live music festivals"},{"l":"High informality, lack of formal industry status in several states, and weak digital-creative skilling trap grassroots artists in precarious, low-wage work","t":"e.g. unorganised handloom weavers and street performers"}],"cue":"Intangible IP assets struggle to secure formal bank credit, while slow IPR disposal, regulatory red tape, and low original IP creation hold back scale."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Streamline and digitise IPR administration for faster disposal and stronger anti-piracy enforcement under the National IPR Policy (2016)","t":"e.g. Cell for IPR Promotion and Management (CIPAM) and expedited examination"},{"l":"Expand alternative and institutional financing","t":"including crowdfunding for culture, IP-backed collateral loans, and venture funds—to bridge the credit gap (e.g., WAVES Bazaar B2B marketplace and WaveX startup incubation)."},{"l":"Build creative districts, cultural hubs, and global city partnerships to cluster talent, infrastructure, and cultural tourism","t":"e.g. UNESCO Creative Cities Network across Jaipur, Varanasi, Chennai, Mumbai, Hyderabad, Srinagar, Gwalior, and Kozhikode"},{"l":"Scale structured creative and AI-native skilling from school to higher education to build an original-IP workforce","t":"e.g. Indian Institute of Creative Technologies (IICT) Mumbai and Budget 2026–27 AVGC Content Creator Labs in [[15,000]] schools and [[500]] colleges"},{"l":"Simplify live-event clearances through single-window portals and extend formal MSME benefits to registered artisans and digital creators","t":"e.g. Live Entertainment Development Cell and Udyam registration"}],"cue":"Unlocking the orange economy requires alternative and IP-backed financing, faster IPR governance under the National IPR Policy (2016), creative hubs, and industry-aligned skilling."},{"k":"data","q":"What data back up the creative economy?","title":"Data","rows":[{"l":"Patents (IPR applications)","t":"disposal takes ≈59 months in India, against ≈30 in China and ≈21 in the USA (notebook)"}]}]},{"id":"GS38-data-effects-on-industria","line":"GS3.8","part":"Industrial growth","name":"Industrial growth: key data","own":true,"cards":[{"k":"data","title":"Numbers","q":"What are the key numbers?","rows":[{"l":"Startups","t":"3rd-largest ecosystem; [[2.2 lakh]] DPIIT-recognised startups (31 Mar 2026); ≈120–130 unicorns"}]},{"k":"data","title":"Lines","q":"Which lines can you quote?","rows":[{"l":"CII 20th Global Sustainability Summit (2–3 Sept 2025) theme","t":"‘Reimagining Sustainability: Resilient. Regenerative. Responsible.’ (Notebook 2)"}]},{"k":"data","title":"Government steps and committees","q":"Which government steps and committees apply?","rows":[{"l":"Startup India","t":"self-certification under labour and environment laws; Fund of Funds 2.0 ([[₹10,000 crore]], April 2026)"},{"l":"Biopharma SHAKTI","t":"[[₹10,000 crore]] [[over 5 years]] to make India a hub for biologics and biosimilars; includes 3 new NIPERs (Budget 2026-27)"},{"l":"Dedicated rare-earth corridors","t":"Odisha, Kerala, Andhra Pradesh, Tamil Nadu (Budget 2026-27)","unlikely":true}]}]},{"id":"GS38-fdi","line":"GS3.8","part":"FDI and SEZs","name":"FDI","own":false,"cards":[{"k":"define","text":"Foreign direct investment: a foreign investor takes a lasting stake and control in an Indian business.","q":"What is meant by FDI?"},{"k":"list","q":"How is net FDI calculated?","rows":[{"l":"Net FDI","t":"gross inflows − repatriation/disinvestment − outward FDI by Indian firms"}]},{"k":"for","rows":[{"l":"Record gross inflows","t":"[[$81 bn]] (FY25) → [[$94.5 bn]] (FY26), an all-time high; India 2nd in greenfield FDI announcements after the US (RBI, FY26); [[₹6.2 lakh crore]] in FY25; cumulative inflows have crossed [[$1 trillion]]; 8th-largest FDI destination (UNCTAD World Investment Report 2023) (notebook)"},{"l":"Sector reach","t":"services is the largest recipient ([[≈16–19%]] of cumulative inflows), followed by computer software and hardware ([[≈15%]]) (DPIIT)"},{"l":"Returns and internationalisation","t":"average return on inward FDI [[≈7.3%]] (ES 2025-26); outward FDI lowers net FDI but supports the internationalisation of Indian firms"},{"l":"Technology and GVCs","t":"brings capital, know-how and access to global value chains (Samsung’s Noida plant, the world’s largest mobile factory)"},{"l":"Jobs","t":"FDI rose [[≈26%]] in H1 FY25, linked to [[≈1 lakh]] new jobs (notebook)"},{"l":"Infrastructure and exports","t":"Brookfield’s [[≈$25 bn]] in infrastructure; greenfield export units; import substitution; a signal of policy credibility (notebook)"}],"q":"Why does India need FDI?","cue":"Record inflows → wide sectors → good returns → technology → jobs → infrastructure."},{"k":"against","rows":[{"l":"Thin net FDI","t":"[[$10 bn]] (FY24) → [[≈$0.35 bn]] (FY25; RBI later revised it to [[≈$1 bn]]) → [[$7.7 bn]] (FY26) (RBI)","h":"Finance"},{"l":"Repatriation","t":"[[$53.6 bn]] in FY26, a multi-year high (IPO exits and stake sales)","h":"Finance"},{"l":"Outward FDI","t":"[[$23.6 bn]] in FY25, up from [[$14.4 bn]] (ES 2025-26); [[$33.3 bn]] in FY26 (RBI)","h":"Finance"},{"l":"MoU–FDI gap (2016 Q5)","t":"land acquisition, approvals, contract enforcement and policy unpredictability (the retrospective tax, ended in 2021)","fix":"National Single Window System (≈76,000 applications, but delays persist, notebook); [[≈90%]] of FDI already uses the automatic route, so extend it towards [[100%]]; Model BIT review","h":"Rules and institutions"},{"l":"Treaty protection","t":"after adopting the 2016 Model BIT, India terminated 44 BITs (notebook)","fix":"Budget 2025-26 announced a review of the Model BIT; new BITs (UAE, UK and others) are being signed","h":"Rules and institutions"}],"q":"Why is net FDI weak even though gross inflows are at a record?","cue":"Thin net → exits → outward FDI → MoU gap → treaty protection."},{"k":"value","rows":[{"l":"Defence (2014 Q9)","t":"[[74%]] through the automatic route, above that through the government route (2020)"},{"l":"Defence production","t":"[[≈₹46,000 crore]] (2014-15) → [[≈₹1.5 lakh crore]] (FY25); exports [[≈₹23,600 crore]] ([[≈$2.8 bn]]) in FY25 (Ministry of Defence); iDEX start-ups bring technology spin-offs"},{"l":"Multi-brand retail (2013 Q9)","t":"[[51%]] through the government route with conditions (2012); food products made in India: [[100%]] (see GS3.6)"},{"l":"Short vs long run (2014 Q9)","t":"short run: capital, quick technology, fewer imports, investor sentiment; long run – industrial integration, competitiveness, exports, technology spillovers (notebook)"},{"l":"Way forward (2016 Q5)","t":"consistent policy and treaties; a predictable tax regime; multimodal logistics parks and freight corridors; easier land and finance (bank debt-to-equity); facilitation cells (project completion up [[30–50%]]); link FDI to skilling (notebook)"}],"title":"Sector rules and PYQ points","q":"What are the sector rules and PYQ points on FDI?"},{"k":"data","rows":[{"l":"Source countries (equity)","t":"FY25 Singapore [[$14.9 bn]], Mauritius [[$8.3 bn]], US [[$5.5 bn]], Netherlands [[$4.6 bn]], UAE [[$4.3 bn]]; cumulative since 2000: Singapore [[≈$195 bn]], Mauritius [[≈$187 bn]], US [[≈$82 bn]] (DPIIT, March 2026)"},{"l":"GCCs","t":"≈1,700 global capability centres, the world’s largest concentration; projected [[≈$105 bn]] by 2030 (notebook)"},{"l":"Two readings of FY25","t":"RBI view: a sign of a mature market where investors can exit smoothly. Concern: profit repatriation, weaker fresh commitment and investor-confidence questions (Notebook 2)"},{"l":"Sabka Bima Sabki Raksha","t":"(Amendment of Insurance Laws) Act, 2025 raised the insurance FDI limit to [[100%]] (ES 2025-26)"},{"l":"FEMA","t":"(Mode of Payment and Reporting of Non-Debt Instruments) Regulations (2019, amended 2024): how foreign investors pay for and report investments in India (notebook)"},{"l":"From the diagram","t":"FPI - below 10%, portfolio"}],"q":"What data and rules back up FDI?"},{"k":"diagram","q":"Draw the diagram for FDI","g":{"dir":"TD","nodes":[["F","Foreign investment"],["D","FDI - 10% or more stake, long term"],["P","FPI - below 10%, portfolio"],["A","Automatic route"],["G","Government route"]],"edges":[["F","D",""],["F","P",""],["D","A",""],["D","G",""]]}}]},{"id":"GS38-sezs","line":"GS3.8","part":"FDI and SEZs","name":"SEZs","own":false,"cards":[{"k":"define","text":"Duty-free enclaves treated as foreign territory for trade and duties, meant to promote exports, investment and jobs (SEZ Act, 2005).","q":"What are SEZs?","ed":true},{"k":"data","q":"What are the SEZ numbers?","rows":[{"l":"Origins","t":"India’s first EPZ: Kandla (1965); SEZ Act, 2005"},{"l":"Scale","t":"368 notified SEZs (Feb 2026); [[≈32 lakh]] jobs (March 2024)"},{"l":"Exports","t":"[[₹11.7 lakh crore]] in April–December 2025, up [[32%]] (Commerce Ministry); [[≈$157 bn]] in FY24 (notebook)"}]},{"k":"for","rows":[{"l":"Export and investment hubs","t":"concessional taxes and single-window rules attract export-oriented investment"},{"l":"Employment","t":"zones create jobs close to ports and industrial corridors"},{"l":"Ease of doing business","t":"single-window clearances and ready infrastructure"},{"l":"Reform test bed","t":"trial ground for labour and land reforms"}],"q":"What were SEZs meant to achieve?","cue":"Exports → jobs → ease of business → reform test bed."},{"k":"against","rows":[{"l":"Taxation","t":"MAT and DDT imposed on SEZs (2011) and the income-tax holiday ended for units starting after March 2020, eroding the advantage; MAT on book profits is now [[15%]] (cut from [[18.5%]] in Sept 2019); overlapping levies, e.g. a GIDC estate taxed by both the municipality and GIDC (notebook)","h":"Finance"},{"l":"Enclave, weak jobs link","fix":"convert SEZs into ‘Employment and Economic Enclaves’ (Baba Kalyani Committee)","h":"People and skills","t":""},{"l":"Idle zones","t":"95 of 372 notified SEZs are non-operational (Parliament, Aug 2026)","h":"Infrastructure"},{"l":"Weak links","t":"little connection with the domestic economy; sudden policy reversals (MAT, DDT)","h":"Markets"},{"l":"Administration","t":"the single window fails on inter-agency coordination","h":"Rules and institutions"},{"l":"One-size rule-book","fix":"Baba Kalyani Committee (2018): separate rules for manufacturing and services SEZs","h":"Rules and institutions","t":""},{"l":"Governing law","t":"DESH Bill (2022) proposed to replace the SEZ Act with development hubs; not passed; an SEZ (Amendment) Bill, 2024 is awaited (notebook)","h":"Rules and institutions"},{"l":"WTO compatibility","fix":"make SEZ incentives WTO-compatible (Baba Kalyani Committee)","h":"Rules and institutions","t":""}],"q":"What plagues SEZs?","cue":"Taxation → Enclave, weak jobs link → Idle zones → Weak links → Administration → One-size rule-book → Governing law → WTO compatibility."},{"k":"value","rows":[{"l":"Reforms and way forward (2015 Q10)","t":"let units sell into the domestic tariff area with duty on inputs, not finished goods; relax the net-foreign-exchange rule; rupee payments; sector-wise land norms (see Government steps) and work from home for IT units; abolish MAT for SEZs; harmonise GST and SEZ rules; WTO-compatible support (infrastructure, not export-linked tax breaks); better infrastructure; simpler administration (notebook)"},{"l":"SEZ Rules amended (June 2025)","t":"semiconductor and electronics-component SEZs need [[10 ha]] instead of [[50 ha]]"}],"q":"How should SEZs be reformed?"}]},{"id":"GS38-data-fdi-sezs-liberalisat","line":"GS3.8","part":"FDI and SEZs","name":"FDI and SEZs: key data","own":true,"cards":[{"k":"data","title":"Numbers","q":"What are the key numbers?","rows":[{"l":"Cross-border payments","t":"a [[≈$206 bn]] market; Project Nexus (instant cross-border payments) and the proposed BRICS Bridge (notebook)"}]},{"k":"data","title":"Lines","q":"Which lines can you quote?","rows":[{"l":"Tax justice","t":"countries lose [[≈$492 bn]] a year to tax abuse, the Global South most (State of Tax Justice 2024, notebook)"}]}]},{"id":"GS39-energy-transition","line":"GS3.9","part":"Energy","name":"Energy transition","own":true,"cards":[{"k":"define","q":"What is the energy transition?","text":"The shift from fossil fuels to renewable and low-carbon sources while keeping power reliable and affordable."},{"k":"for","q":"What progress has India made in the energy transition?","rows":[{"l":"Achieves rapid clean capacity expansion","t":"reaching [[51.9%]] non-fossil capacity (Dec 2025 ES 2025–26) and [[54%]] of [[552 GW]] by July 2026 (MNRE), meeting the [[50%]] 2030 target five years early toward [[500 GW]] by 2030 and [[60%]] by 2035 (MNRE)."},{"l":"Drives massive solar growth from [[2.8 GW]] (2014) to [[≈165 GW]] (2026), adding a record [[55 GW]] of non-fossil capacity in FY26 with [[45 GW]] from solar alone (MNRE)","t":""},{"l":"Diversifies clean energy supply through strong wind ([[≈58 GW]], 4th globally) and bio-energy ([[≈12 GW]]) capacity additions alongside utility-scale parks (MNRE)","t":""},{"l":"Insulates the economy from volatile global fuel prices and narrows long-term trade deficits by replacing imported fossil fuels with domestic renewables","t":"e.g. lowering thermal coal and crude import bills"},{"l":"Decentralises electricity generation and creates green jobs across manufacturing, installation, and rural solarisation","t":"e.g. PM Surya Ghar rooftop solar and PM-KUSUM solar pumps"}],"cue":"Scaling clean power capacity rapidly reduces long-term fossil import vulnerability, cuts emissions, and decentralises energy generation across India."},{"k":"against","q":"What holds back India’s energy transition?","rows":[{"l":"Entrenches structural coal dependence because capacity is not generation","t":"non-fossil sources form [[51.9%]] of capacity (ES 2025–26) but only [[≈29%]] of generation (FY26), while coal generates [[69.7%]] (down from [[≈73%]] in FY25; CEA) and provides [[55%]] of the energy mix (Survey; 5th-largest reserves, 2nd-largest producer, consumer, and importer) due to [[≈15–25%]] renewable PLF versus [[≈55–65%]] for 24x7 coal."},{"l":"Faces a massive financing gap of [[₹150 lakh crore]] between 2024 and 2030 for the green transition (ES 2025–26), compounded by a modest greenium and high domestic capital costs","t":"e.g. limited yield discounts on sovereign green bonds"},{"l":"Suffers from weak DISCOM finances with accumulated losses of [[≈₹6.5–7 lakh crore]], [[≈15%]] AT&C losses (FY23), and rigid long-term power purchase agreements locking utilities into costly power","t":"despite posting a maiden positive PAT of [[₹2,701 crore]] in FY25 under RDSS (ES 2025–26)."},{"l":"Remains acutely vulnerable to external energy shocks as crude oil import dependence rose to [[≈89%]] in FY26 from [[88.3%]] in FY25 (PPAC, Rajya Sabha reply, July 2026), backed by strategic reserves of just [[5.3 MMT]] covering [[≈9 days]]","t":""},{"l":"Constrains clean power absorption through inadequate grid transmission, storage deficits, and cross-subsidised industrial power tariffs that raise manufacturing costs and cause peak-hour solar curtailment","t":"e.g. [[300]] GWh renewable power curtailed in Q1 2026 due to grid bottlenecks"}],"cue":"Baseload coal reliance, a massive financing gap, financially weak DISCOMs, crude import dependence, and storage deficits slow down reliable clean power delivery."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Turn around DISCOM finances and grid coordination through RDSS (building on IPDS and SAUBHAGYA), replicating Gujarat’s model (cutting AT&C losses from [[≈20%]] to [[≈13%]] in 2025 while adding [[≈12 GW]] renewables), and deploying the India Energy Stack (a DPI offering unique IDs, real-time data,and open APIs to shift from ‘energy access’ to ‘energy agency’)","t":""},{"l":"Scale up grid-stabilising storage and evacuation infrastructure via Viability Gap Funding for [[4,000]] MWh Battery Energy Storage Systems (BESS), pumped hydro, and dedicated transmission networks","t":"e.g. Green Energy Corridor Phase-III approved in Sept 2026 for [[135 GW]] evacuation and [[50]] GWh BESS"},{"l":"Decarbonise transport and hard-to-abate sectors through the National Electric Mobility Mission Plan 2020 (2013), FAME I & II, PM E-DRIVE (2024), and PLI schemes for Auto and ACC batteries","t":"e.g. paired with the National Green Hydrogen Mission"},{"l":"Strengthen fossil-fuel energy security during the transition by expanding Strategic Petroleum Reserves beyond [[5.3 MMT]] and accelerating deep-water domestic exploration","t":"e.g. targeting a Guyana-like hydrocarbon find off the Andaman Islands"},{"l":"Mobilise the [[₹150 lakh crore]] transition capital through blended finance, sovereign green bonds, and rationalising cross-subsidised industrial tariffs","t":"e.g. Green Energy Open Access rules for commercial and industrial users"}],"cue":"Delivering reliable, affordable clean power requires fixing DISCOM finances via digital public infrastructure, scaling storage and green grids, electrifying transport, and expanding domestic energy buffers."},{"k":"diagram","q":"Draw the diagram for Energy transition","g":{"dir":"LR","nodes":[["C","Coal - baseload"],["G","Grid"],["R","Solar and wind - variable"],["S","Storage - BESS, pumped hydro"],["T","Green energy corridors"],["D","Reliable clean power"]],"edges":[["C","G",""],["R","G",""],["S","G",""],["T","G",""],["G","D",""]]}},{"k":"data","q":"What do the capacity and emissions numbers show?","title":"Data","rows":[{"l":"Per-capita GHG emissions","t":"≈2.9 t, against a world average of ≈6.7 t (ES 2025-26)"},{"l":"Renewables (ES 2025-26)","t":"Renewables, ES 2025-26 pinned values: total RE [[254 GW]] (Nov 2025); solar [[135.8 GW]] (Dec 2025), [[≈48x]] since 2014, 3rd in the world; wind [[≈54 GW]], 4th; bio-energy [[11.6 GW]] (MNRE)"},{"l":"China’s renewable capacity","t":"China’s installed renewable capacity [[≈1,228 GW]] (notebook)"},{"l":"Entropy effect","t":"Rapid decarbonisation without institutional readiness creates an ‘entropy effect’ (more systemic volatility unless there are buffers and redundancy) (Survey)"},{"l":"Capacity","t":"[[509.7 GW]] installed, renewables [[49.8%]] (Nov 2025) (ES 2025-26). Latest: non-fossil [[300 GW]]: hydro [[≈57 GW]] (MNRE, July 2026)"},{"l":"National Green Hydrogen Mission (Jan 2023)","t":"[[5 MMT]] of green hydrogen a year by 2030"}]}]},{"id":"GS39-nuclear-energy","line":"GS3.9","part":"Energy","name":"Nuclear energy","own":true,"cards":[{"k":"define","q":"What role does nuclear energy play?","text":"Power generated from controlled nuclear fission reactions, providing reliable, low-carbon baseload electricity to complement variable renewables.","ed":true},{"k":"for","q":"Why expand nuclear energy?","rows":[{"l":"Provides steady, 24x7 low-carbon baseload power that stabilises the grid and complements intermittent solar and wind toward net-zero goals","t":"e.g. plant load factors above [[80%]] versus [[≈15–25%]] for renewables"},{"l":"Unlocks massive capacity expansion and private entry","t":"scaling from [[8.8 GW]] ([[24]] reactors, [[≈3%]] of generation) to [[≈22 GW]] by 2031–32 and [[100 GW]] by 2047 (Nuclear Energy Mission, Budget 2025–26)—enabled by the SHANTI Act, 2025 which replaced the Atomic Energy Act, 1962 and the nuclear liability law of 2010."},{"l":"Advances India’s indigenous three-stage programme (PHWR → fast breeder → thorium) into Stage II, as the [[500]] MWe Prototype Fast Breeder Reactor (PFBR) at Kalpakkam attained first criticality on [[6]] April 2026 to unlock domestic thorium reserves","t":""},{"l":"Accelerates deployment speed and industrial decarbonisation through [[₹20,000 crore]] allocated for indigenous Small Modular Reactors (BSMR-200, SMR-55), targeting at least five reactors by 2033","t":"e.g. factory-built units suitable for repurposing retiring coal plants"},{"l":"Reduces long-term
