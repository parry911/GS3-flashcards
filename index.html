 from cereals and millets;"},{"l":"Export Potential","t":"Value-added millet products offer opportunities for agricultural exports and food processing;"},{"l":"Employment Generation","t":"Processing, packaging and millet-based enterprises create rural non-farm employment."}],"q":"Why promote millets?","cue":"Climate → income → nutrition → exports → jobs."},{"k":"against","rows":[{"l":"Post-Harvest Constraints","t":"Inadequate storage, processing, grading and value-chain infrastructure;","h":"Infrastructure"},{"l":"Weak Market and Procurement Ecosystem","t":"Limited assured procurement and MSP support compared with rice and wheat discourages cultivation","h":"Markets"},{"l":"Demand Constraints","t":"Changing consumption preferences and limited consumer awareness restrict market expansion;","h":"Markets"},{"l":"Weak Seed Infrastructure","t":"Limited availability of high-yielding, climate-resilient seeds and inadequate R&D constrain productivity;","h":"Technology"},{"l":"Paddy-Wheat Lock-in","t":"Assured procurement, input subsidies and established marketing networks favour rice and wheat;","h":"Rules and institutions"},{"l":"Regional and Agro-Climatic Differences","t":"Crop suitability, soil conditions and rainfall patterns vary, requiring region-specific promotion.","h":"Equity and sustainability"}],"q":"What holds millets back?","cue":"Post-Harvest Constraints → Weak Market and Procurement Ecosystem → Demand Constraints → Weak Seed Infrastructure → Paddy-Wheat Lock-in → Regional and Agro-Climatic Differences."},{"k":"value","rows":[{"l":"Assured Market and Procurement Support","t":"Expand decentralised procurement and integrate millets into PDS, ICDS and PM-POSHAN"},{"l":"Seed and R&D Infrastructure","t":"Develop high-yielding varieties, strengthen ICAR-IIMR research and improve seed distribution;"},{"l":"Value Addition","t":"Promote millet-based ready-to-eat foods, processing units, FPOs and startups through PMFME;"},{"l":"Market Development","t":"Strengthen branding under Shree Anna, e-commerce linkages and APEDA-led export promotion;"},{"l":"Crop Diversification Incentives","t":"Encourage millets in water-stressed regions through region-specific incentives and diversification away from paddy."},{"l":"Mains takeaway","t":"Millets offer a triple dividend of farmer resilience, nutritional security and climate sustainability; the priority is to transform them from traditional coarse cereals into commercially viable nutri-cereals."},{"l":"Added from notebook","t":"low glycaemic index; short growing duration; [[≈60–70%]] less water than paddy."}],"q":"How can millets be mainstreamed?","cue":"Buy them → breed them → process them → brand them → pay to switch."},{"k":"data","rows":[{"l":"Millets","t":"the government procures only [[≈3%]]; market [[≈₹1,000 crore]] against [[≈₹60,000 crore]] for wheat and rice; millets need [[70–80%]] less pesticide than rice (Agriculture notes)"},{"l":"From the diagram","t":"Policy - PDS, mid-day meals, IYM 2023"}],"q":"What data and examples back up Millets (Shree Anna)?"},{"k":"diagram","q":"Draw the diagram for Millets (Shree Anna)","g":{"dir":"TD","nodes":[["M","Millets"],["N","Nutrition - iron, fibre"],["C","Climate - less water, rainfed"],["F","Farmer income - low input cost"],["P","Policy - PDS, mid-day meals, IYM 2023"]],"edges":[["M","N",""],["M","C",""],["M","F",""],["M","P",""]]}}]},{"id":"GS34-gm-crops","line":"GS3.4","part":"Cropping pattern","name":"GM crops","own":true,"cards":[{"k":"define","text":"Agricultural plants whose DNA is deliberately altered using genetic engineering to introduce or modify desirable traits such as pest resistance, herbicide tolerance, drought resilience and improved nutritional content.","q":"What is meant by GM crops?"},{"k":"list","rows":[{"l":"Transgenic GM crops","t":"Introduce foreign DNA/genes from another organism (e.g. Bt cotton)."},{"l":"Gene-edited crops","t":"Make precise changes to existing DNA without retaining foreign DNA (e.g. DRR Rice 100 – Kamala)."},{"l":"India's context","t":""},{"l":"Commercial approval","t":"Bt cotton (2002) remains the only transgenic GM crop approved for commercial cultivation in India. HTBt cotton is not approved. Press Information Bureau+1"},{"l":"GM maize","t":"GEAC has permitted confined field trials of herbicide-tolerant maize (NK603) at PAU, Ludhiana; this is not commercial approval. Final MoM-155th GEAC Meeting dt 26.06.2025.docx"},{"l":"GM mustard (DMH-11)","t":"Received conditional environmental-release approval in October 2022. Supreme Court's split verdict in Gene Campaign v. Union of India (2024 INSC 545) referred the issue to a larger bench. The case was heard by a three-judge bench in September 2026. Science API+1"},{"l":"Genome Editing","t":"India released its first genome-edited rice varieties in May 2025 – DRR Rice 100 (Kamala) and Pusa DST Rice 1. SDN-1/SDN-2 plants free of exogenous DNA are exempt from Rules 7–11 of the 1989 Rules. Digital Sansad+1"}],"q":"What is the status of GM and gene-edited crops in India?"},{"k":"for","rows":[{"l":"Agricultural Productivity, Lower Input Costs","t":"Bt cotton reduces bollworm infestation and insecticide use (ICAR study: applications reduced from 8 to 4)"},{"l":"Import Substitution","t":"GM oilseed varieties could help reduce edible oil import dependence ([[56.25%]] in FY24)"},{"l":"Climate Resilience","t":"Potential to develop drought-, salinity- and pest-resistant crops"},{"l":"Nutrition Security","t":"Genetic modification can enable biofortification to address micronutrient deficiencies"},{"l":"Farmer Income","t":"Lower crop losses and improved productivity can raise farm profitability."}],"q":"What are the arguments for GM crops?","cue":"Yield → fewer imports → resilience → nutrition → income."},{"k":"against","rows":[{"l":"Seed Sovereignty","t":"Patented seeds and dependence on multinational corporations may increase input costs and reduce farmers' control over seeds;","h":"Markets"},{"l":"Pest Resistance","t":"Pink bollworm has developed resistance to Bollgard-II cotton, highlighting the limitations of excessive dependence on a single technology;","h":"Technology"},{"l":"Regulatory Uncertainty","t":"DMH-11 litigation, delayed approvals and absence of a settled national policy create uncertainty for agricultural R&D;","h":"Rules and institutions"},{"l":"Biosafety and Ecological Risks","t":"Gene flow and cross-pollination can threaten indigenous varieties, biodiversity and non-GM export markets","h":"Equity and sustainability"},{"l":"Social Acceptance","t":"Farmer organisations and consumer groups raise concerns over biosafety, corporate control and farmers' rights.","h":"Equity and sustainability"}],"q":"What are the arguments against GM crops?","cue":"Seed Sovereignty → Pest Resistance → Regulatory Uncertainty → Biosafety and Ecological Risks → Social Acceptance."},{"k":"value","rows":[{"l":"Science-Based Regulatory Framework","t":"Implement the Supreme Court's direction in Gene Campaign (2024) for a comprehensive National GM Policy, transparent biosafety assessment and disclosure of expert conflicts of interest"},{"l":"Public-Sector R&D","t":"Strengthen ICAR and State Agricultural Universities to develop affordable, locally adapted GM and gene-edited varieties;"},{"l":"Resistance Management","t":"Enforce Refuge-in-a-Bag (RIB), integrated pest management and post-release monitoring to prevent pest resistance;"},{"l":"Farmer Seed Sovereignty","t":"Protect farmers' rights under Section 39 of the PPV&FR Act, 2001 and promote affordable seed access;"},{"l":"Traceability and Labelling","t":"Strengthen FSSAI safety standards, labelling and identity-preserved supply chains to protect consumer choice and non-GM exports."},{"l":"Mains takeaway","t":"GM technology can enhance agricultural productivity and climate resilience, but its adoption must balance scientific innovation with biosafety, ecological sustainability and farmers' seed sovereignty."}],"q":"How should India regulate and use GM crops?","cue":"Science-based rules → public R&D → manage resistance → protect farmers’ seeds → trace and label."}]},{"id":"GS34-intercropping-and-relay-cropping","line":"GS3.4","part":"Cropping pattern","name":"Intercropping and relay cropping","own":true,"cards":[{"k":"define","text":"Intercropping: growing two or more crops at the same time on one field in a set row pattern. Relay cropping: sowing the next crop before the standing one is harvested.","q":"What is meant by intercropping and relay cropping?"},{"k":"for","rows":[{"l":"Higher Land-Equivalent Productivity by increasing cropping intensity","t":""},{"l":"Biological Weed Suppression & Input Savings","t":"Multi-tier canopies, root competition and allelopathy suppress weeds by [[70–91%]]; sugarcane–soybean intercropping cuts weeds by [[≈30%]], reducing herbicide and manual-weeding costs."},{"l":"Breaking Herbicide-Resistant Weed Cycles","t":"intercropping cereals with legumes and oilseeds disrupts the ecological niche of persistent wheat weeds such as wild oats, Phalaris minor, and lambsquarters"},{"l":"Ecological Pest Control via Push-Pull Systems","t":"Companion planting such as maize + Desmodium uncinatum (‘push-pull’ intercropping) suppresses the Striga weed"},{"l":"Income Stabilization & Risk Hedging","t":""},{"l":"Custom Hiring Centres","t":"27,554 CHCs (up to 2025-26) improve smallholder access to multi-crop implements"}],"q":"Why practise intercropping and relay cropping?","cue":"More from the same land → fewer weeds → broken weed cycles → natural pest control → steadier income → machines to hire."},{"k":"against","rows":[{"l":"Working capital","t":"managing multiple crops at once raises upfront working-capital needs","h":"Finance"},{"l":"Information asymmetry","h":"People and skills","t":""},{"l":"No downstream infrastructure","h":"Infrastructure","t":""},{"l":"Markets","t":"asymmetric price assurance: open-ended public procurement favours staple cereal monoculture","h":"Markets"},{"l":"Machinery mismatch","t":"combine harvesters and seed drills are calibrated for uniform monocrop rows","h":"Technology"}],"q":"Why don’t more farmers intercrop?","cue":"Money, information, infrastructure, prices and machines all favour one crop."},{"k":"value","rows":[{"l":"Rebalance price and procurement incentives","t":""},{"l":"Custom hiring centres","t":"equipped with adjustable row planters and inter-row weeders"},{"l":"Composite credit","t":"revise scales of finance to offer composite working-capital credit for intercropped holdings"},{"l":"Multi-crop insurance design","t":""},{"l":"Extension and bio-inputs","t":"train frontline extension workers; set up village-level bio-input hubs supplying quality seeds of smother crops"},{"l":"FPO aggregation","t":"channel diversified secondary harvests through FPOs for collective cleaning, grading and direct linkage with food processors"}],"q":"How can intercropping be scaled up?","cue":"Fix prices → hire machines → lend for the mix → insure the mix → teach and supply → sell together."}]},{"id":"GS34-crop-diversification-and-emerging-techno","line":"GS3.4","part":"Cropping pattern","name":"Crop diversification and emerging technology","own":true,"cards":[{"k":"define","text":"Shifting area from a few staples (paddy, wheat) to a wider mix of high-value crops, pulses, millets, horticulture and allied activity, to raise income and cut risk and water use.","q":"What is crop diversification?"},{"k":"list","rows":[{"l":"Precision tools","t":"GIS-based soil maps guide the shift from paddy to maize or millets under drip irrigation (Punjab); smart pump controllers such as Nano Ganesh allow remote pump operation from a basic phone, saving labour and timing irrigation (see Precision agriculture, E-technology)"},{"l":"Climate-resilient varieties and biotech","t":"high-yielding millet, pulse and oilseed varieties, spread by ICAR and IIRR; NICRA promotes resilient varieties with alternative farming techniques; climate-smart practices are zero tillage, crop diversification and integrated nutrient management"},{"l":"AI and digital advice","t":"weather, satellite and soil-health-card data feed smart crop planning that combines GIS, weather and price forecasts to suggest crop choices; e-Sagu and Digital Green carry advice to farmers (video-based farmer-to-farmer learning)"},{"l":"Markets","t":"e-Choupal and e-NAM link farmers to buyers for millets, flour and organic produce (see E-technology)"},{"l":"Protected cultivation","t":"greenhouses, polyhouses, hydroponics and vertical farming give year-round production and open bell peppers, strawberries, orchids and herbs"},{"l":"Public systems","t":"FASAL (crop output forecasts) and KISAN (space-based crop insurance), drones (see Precision agriculture)"}],"q":"Which technologies support crop diversification?","cue":"Map soil → better seed → smart advice → markets → protected farms → public systems."},{"k":"against","rows":[{"l":"Finance","t":"high technology cost; financial constraints"},{"l":"People and skills","t":"knowledge gaps; low digital literacy: only [[≈25%]] of farmers comfortable with digital tools (notebook, attributed to Census/REAP; not traced)"},{"l":"Infrastructure","t":"diversified crops are perishable and need cold storage; land fragmentation"},{"l":"Markets","t":"cropping choices are steered by MSP (see Diagram: paddy lock-in and crop diversification)"},{"l":"Rules and institutions","t":"weak policy support"},{"l":"Equity and sustainability","t":"cultural inertia: direct-seeded rice is held back by perceived uncertainty"}],"q":"What holds back crop diversification?","cue":"Money, skills, cold chain, MSP pull, weak policy, cultural habit."},{"k":"value","rows":[{"l":"National Mission on Natural Farming (2024)","t":"[[≈₹2,481 crore]] shared by Centre and states; targets 15,000 clusters in gram panchayats; [[1 crore]] farmers on [[≈7.5 lakh]] ha; 30,000 Krishi Sakhis; 10,000 Bio-input Resource Centres; 2,000 demonstration farms at KVKs and agricultural universities. KVKs were recommended by the Mohan Singh Mehta Committee (1973); the first KVK opened in 1974 at Puducherry. Implemented by the Ministry of Agriculture and Farmers’ Welfare, state agriculture departments, extension agencies, research institutes, NGOs and farmer groups"},{"l":"PM-PRANAM","t":"incentivises states to cut chemical fertiliser use; promotes soil restoration and biofertilisers. PM-PRANAM returns [[50%]] of the fertiliser subsidy a state saves as a grant (CCEA, June 2023)"},{"l":"Paramparagat Krishi Vikas Yojana","t":"end-to-end support for organic farmers. Crop diversification and traditional varieties open premium niche markets and benefit small farmers and women ; PKVY covers [[18.9 lakh]] ha and [[33.6 lakh]] farmers (PIB, Aug 2026)"},{"l":"Centre of Excellence, Uttar Pradesh","t":"Centre of Excellence in Uttar Pradesh, backed by Indo-Israeli and Dutch technology: helps growers of dragon fruit, dates, citrus, honey and flowers"},{"l":"OUAT and WFP pilot, Odisha","t":"OUAT and WFP pilot in Odisha (notebook: [[₹70 lakh]]): weather stations and a mobile advisory app in 29 villages; 7,000 farmers adopted sustainable practices and incomes rose (not traced online)"}],"q":"Which schemes and examples support diversification?"}]},{"id":"GS34-climate-change-and-cropping-patterns","line":"GS3.4","part":"Cropping pattern","name":"Climate change and cropping patterns","own":true,"cards":[{"k":"define","text":"Changes in temperature, rainfall and extreme weather shift which crops are grown where, when they are sown and how much they yield.","q":"How does climate change affect cropping patterns?"},{"k":"list","rows":[{"l":"Rice, millet and maize zones shift across South Asia and southern Africa","t":""},{"l":"Coffee and spices move to higher altitudes and poleward","t":""},{"l":"Rainfed kharif turns into irrigated kharif","t":""},{"l":"Water-intensive cereals move to wetter regions","t":""},{"l":"Paddy moves to submergence-tolerant varieties","t":"see Climate-resilient varieties in Crop diversification and emerging technology"},{"l":"Impact","t":"a [[10–40%]] loss in crop production by 2080–2100; every 1°C rise could cut wheat output by [[4–5 million]] tonnes (ICAR network project)"}],"q":"How is climate change shifting cropping patterns?","cue":"Crops move across zones, uphill and poleward, from rain to irrigation, towards water, to flood-tolerant seed; the cost is 10–40% of output."},{"k":"value","rows":[{"l":"Climate","t":"a 2°C rise could cut farm output by [[8–12%]] (Agriculture notes, not traced)"}],"q":"What schemes, data and examples back up Climate change and cropping patterns?"}]},{"id":"GS34-integrated-farming","line":"GS3.4","part":"Cropping pattern","name":"Integrated farming","own":true,"cards":[{"k":"define","text":"Crops, livestock, fisheries and allied enterprises on one farm, where the waste of one component becomes the input of another.","q":"What is an Integrated Farming System?"},{"k":"data","q":"What gains does integrated farming show?","rows":[{"l":"Returns and jobs","t":"combining coconut, banana, dairy and horticulture gives [[≈2x]] returns and [[2x]] employment"},{"l":"Horticulture","t":"raised average farmer income from [[₹0.73 lakh]] to [[₹1.3 lakh]] a year (PIB)"}]},{"k":"for","rows":[{"l":"Higher productivity","t":"coastal Karnataka: coconut, banana, dairy and horticulture together gave [[≈2x]] the returns"},{"l":"Income stability","t":"[[≈1.5–2x]] more stable income (ICAR); several enterprises mean several income streams"},{"l":"Resource efficiency and lower cost","t":"waste from one component becomes input for another; waste recycling cut cultivation cost by [[≈24%]] (IFS review, Plant Archives)"},{"l":"Employment","t":"the Karnataka IFS model gave [[≈2x]] the days of work"},{"l":"Climate resilience","t":"diversified operations spread risk (see Diagram)"}],"q":"What are the benefits of integrated farming?","cue":"Produce more → earn steadily → waste nothing → work more days → resist climate."},{"k":"against","rows":[{"l":"Finance","t":"high initial investment; only a few subsidies (mainly NMSA)","h":"Finance"},{"l":"People and skills","t":"needs knowledge across several disciplines; more labour","h":"People and skills"},{"l":"Infrastructure","t":"land is a constraint: difficult for small and marginal farmers ([[under 2 ha]])","h":"Infrastructure"},{"l":"Markets","t":"each product needs its own marketing channel","h":"Markets"},{"l":"Rules and institutions","t":"complex farm management","h":"Rules and institutions"}],"q":"What limits integrated farming?","cue":"Costly, knowledge-heavy, land-hungry, many markets, complex to run."},{"k":"value","rows":[{"l":"‘Waste is only misplaced wealth’","t":"(Dr A.P.J. Abdul Kalam): the idea behind integrated farming"},{"l":"National Mission for Sustainable Agriculture","t":"(Integrated Farming Systems, [[50%]] of input cost, max [[2 ha]] a farmer): crop + livestock up to [[₹40,000]]/ha; crop + fisheries or poultry up to [[₹25,000]]/ha; horticulture-based up to [[₹25,000]]/ha; green manuring up to [[₹2,000]]/ha (NMSA cost norms). NMSA components: rainfed area development, on-farm water management, soil health management, climate-resilient agriculture (notebook)"}],"q":"What backs up integrated farming?"},{"k":"diagram","q":"Draw the integrated farming system diagram (Integrated farming)","g":{"dir":"TD","nodes":[["I","IFS"],["C","Crops - plantation, fruit, mushroom"],["A","Animal husbandry - dairy, poultry, piggery"],["F","Fishery"],["S","Soil health - nutrient recycling"],["W","Waste management - vermicompost, apiary"],["R","Diverse models - risk mitigation, climate resilience"]],"edges":[["I","C",""],["I","A",""],["A","F",""],["F","S",""],["I","W",""],["I","R",""]]}}]},{"id":"GS34-allelopathy","line":"GS3.4","part":"Cropping pattern","name":"Allelopathy","own":false,"cards":[{"k":"define","text":"The release of chemicals (allelochemicals) by plants, microbes or fungi that affect the germination, growth or survival of neighbouring organisms.","q":"What is meant by allelopathy?"},{"k":"list","rows":[{"l":"Rice","t":"allelopathic lines such as PI 312777 have denser roots and suppress barnyard grass, cutting weed biomass and competition without herbicides, so yields stay higher"},{"l":"Wheat","t":"intercropping with white clover reduces weeds such as wild oats, ryegrass, cocklebur and lambsquarters"},{"l":"Sugarcane","t":"intercropping with cowpea or soybean cuts weeds by [[≈70–90%]]"},{"l":"Maize","t":"Desmodium uncinatum suppresses Striga and adds nitrogen to the soil"},{"l":"Fallow periods","t":"rye, sunflower, mustard or cowpea as cover or relay crops suppress weeds"}],"q":"Which crops use allelopathy to suppress weeds?"},{"k":"list","q":"How is allelopathy used in farming?","rows":[{"l":"Acts at the roots","t":"suppresses weed seedling growth and root elongation"},{"l":"Pest and weed control","t":"volatile allelochemicals from marigold or Desmodium repel pests or suppress parasitic weeds"},{"l":"Main use","t":"fewer weeds and less weedicide; a base for bio-herbicides"},{"l":"Limit","t":"only [[3–5%]] of plants show a strong allelopathic effect"}]},{"k":"for","rows":[{"l":"Lower input cost","t":"ecologically sustainable; fits integrated weed management"}],"q":"Why use allelopathy?"},{"k":"against","rows":[{"l":"Technology","t":"the effect is weak in most plants (only [[3–5%]] show it strongly)","h":"Technology"},{"l":"Technology","t":"efficacy varies with soil pH, water regime and soil microbes.","h":"Technology"}],"q":"What limits allelopathy?","cue":"Technology → Technology."}]},{"id":"GS34-high-value-crops","line":"GS3.4","part":"Cropping pattern","name":"High-value crops","own":true,"cards":[{"k":"define","text":"Crops that generate relatively higher income per unit of land compared to traditional staples, such as fruits, vegetables, spices, flowers and medicinal plants.","q":"What is meant by high-value crops?"},{"k":"data","q":"Where does India stand in high-value crops?","rows":[{"l":"Rank","t":"largest producer of dry onions; 2nd in vegetables, fruits and potatoes (ES 2025-26)"}]},{"k":"value","rows":[{"l":"Budget 2026-27, high-value crops","t":"sandalwood, plus dedicated programmes for cashew and cocoa","unlikely":true}],"q":"What schemes, data and examples back up High-value crops?"}]},{"id":"GS34-cropping-pattern","line":"GS3.4","part":"Cropping pattern","name":"Cropping pattern","own":true,"cards":[{"k":"define","text":"The proportion of agricultural land allocated to different crops in a particular region during a given period or agricultural season.","q":"What is meant by cropping pattern?"}]},{"id":"GS34-agroforestry","line":"GS3.4","part":"Cropping pattern","name":"Agroforestry","own":true,"cards":[{"k":"define","text":"Growing trees together with crops or livestock on farmland.","q":"What is meant by agroforestry?"},{"k":"data","q":"Why does agroforestry matter, and where is it practised?","rows":[{"l":"Carbon","t":"stores [[≈30%]] more carbon"},{"l":"Tree cover","t":"helps meet the [[33%]] forest/tree cover target (National Forest Policy, 1988)"},{"l":"Imports","t":"India imported [[≈$2.7 bn]] of wood-based products"},{"l":"Traditional systems","t":"Khejri (arid Rajasthan), Taungya (Kerala, West Bengal, Odisha, Karnataka, North-East), Itteri (Tamil Nadu)"}]},{"k":"value","rows":[{"l":"Agroforestry","t":"National Agroforestry Policy (2014; India was the first country to adopt one); Sub-Mission on Agroforestry under the National Mission for Sustainable Agriculture; GROW initiative (NITI Aayog, 2024) to green wastelands through agroforestry"}],"q":"What schemes, data and examples back up Agroforestry?"}]},{"id":"GS34-irrigation","line":"GS3.4","part":"Irrigation","name":"Irrigation","own":true,"cards":[{"k":"define","text":"The artificial supply of water to agricultural land through canals, wells, pumps and sprinklers to support crop growth.","q":"What is irrigation?"},{"k":"for","rows":[{"l":"Steady expansion of irrigated acreage","t":"[[41.7%]] (2001-02) to [[55.8%]] (2022-23)"},{"l":"Climate-resilient agriculture","t":"expanding irrigation ensures it"},{"l":"Scaling precision micro-irrigation","t":"[[over 115 lakh]] ha under drip and sprinkler through PMKSY’s Per Drop More Crop"},{"l":"Aquifer recharge via watershed restoration","t":""},{"l":"Decentralised community water governance","t":"Odisha’s 39,000 Pani Panchayats"}],"q":"What has India achieved in irrigation?","cue":"More area → resilience → precision → recharge → community control."},{"k":"against","rows":[{"l":"Poor irrigation efficiency","t":"[[688 billion]] cubic metres of water consumed by the farm sector"},{"l":"Over-exploited groundwater","t":"[[60%]] of Punjab’s districts face over-extraction"},{"l":"Regional disparities","t":"NE states [[28%]] of area irrigated vs [[95%]] in northern states"},{"l":"Delays in project completion","t":"Sardar Sarovar conceived in the 1940s, completed only in 2017"},{"l":"Waterlogging","t":"soil degradation affects [[147 million]] hectares"},{"l":"Power-irrigation nexus","t":"subsidised electricity drives excessive groundwater extraction"}],"q":"What are the challenges in India’s irrigation system?","cue":"Wasteful → over-pumped → unequal → delayed → waterlogged → powered by free electricity."},{"k":"value","rows":[{"l":"PMKSY Convergence","t":"Coordinate Har Khet Ko Pani, Per Drop More Crop and WDC-PMKSY across relevant ministries"},{"l":"WDC-PMKSY 2.0","t":"(2021–26) targeted [[49.5 lakh]] hectares with [[₹8,134 crore]] central outlay"},{"l":"Water-Use Efficiency","t":"Adopt pressurised closed-conveyance pipelines, SCADA-based distribution and farm-level drip/sprinkler systems (Mihir Shah Committee);"},{"l":"Aquifer Governance","t":"Implement the Mihir Shah Committee's proposed National Water Commission (merging CWC and CGWB), delink groundwater access from land ownership and promote community aquifer budgeting through Atal Bhujal Yojana;"},{"l":"Participatory Irrigation Management","t":"Replicate Odisha's Pani Panchayats and Punjab's Warabandi, empowering Water User Associations in canal maintenance and water-charge collection;"},{"l":"Crop Diversification","t":"Shift from paddy/sugarcane to millets, pulses and oilseeds in over-exploited blocks through targeted procurement, solarised agricultural feeders under PM-KUSUM and DBT-linked power subsidies"}],"q":"How can India’s irrigation be reformed?","cue":"Converge PMKSY → use water efficiently → govern aquifers → let farmers manage → diversify crops."},{"k":"data","rows":[{"l":"Coverage","t":"gross irrigated area is [[55.8%]] of gross cropped area (2022-23), up from [[41.7%]] in 2001-02 (ES 2025-26). Use gross cropped area, not net sown area"},{"l":"Conclusion anchor","t":"‘Har Khet Ko Pani’ and ‘Per Drop More Crop’ (PMKSY), with the National Water Mission goal of [[20%]] higher water-use efficiency"},{"l":"PM Krishi Sinchayee Yojana (PMKSY), ‘Har Khet Ko Pani’","t":"ministries involved are Jal Shakti, Agriculture and Farmers’ Welfare, and the Department of Land Resources (Rural Development), under a National Steering Committee. Aim: improve physical access to water and expand the irrigated area. Watershed Development Component: 2009-2020 projects raised the groundwater table by ≈3 m and cultivable area by [[≈30%]]; WDC-PMKSY 2.0 (approved 15 Dec 2021, for 2021-26): [[49.5 lakh]] ha target, [[₹8,134 crore]] central share (DoLR)"},{"l":"Sardar Sarovar","t":"conceived in the 1940s, completed only in 2017 (delays in major irrigation projects)"},{"l":"Odisha","t":"more than 39,000 Pani Panchayats (farmers’ water-user associations) (ES 2025-26)"}],"q":"What data and schemes back up irrigation?"}]},{"id":"GS34-water-storage","line":"GS3.4","part":"Irrigation","name":"Water storage (traditional and farm-level)","own":true,"cards":[{"k":"list","rows":[{"l":"Farm ponds","t":"e.g. Andhra Pradesh’s Bandhlapaur: 103 farm ponds stored [[27 lakh]] m³ of water; UP’s Har Khet Talab: [[37k]] farm ponds built"},{"l":"Tank and cascade systems","t":"networks of surface reservoirs fed by monsoon flows and arranged in cascades; capture runoff and regulate seasonal flow (Mission Kakatiya in Telangana a huge success)"},{"l":"Johads (north-west)","t":"earthen check dams that capture runoff"},{"l":"Ahar-pynes (south Bihar)","t":""}],"q":"Which water-storage systems can you cite, with examples?"},{"k":"list","q":"What makes water storage work, and what goes wrong?","rows":[{"l":"What works","t":"captures runoff and rain, recharges groundwater, is community-owned, needs little maintenance, distributes water equitably and builds resilience to climate variability"},{"l":"What goes wrong","t":"no science-based site selection, silt traps, and plastic lining that prevents recharge"}]}]},{"id":"GS34-micro-irrigation","line":"GS3.4","part":"Irrigation","name":"Micro-irrigation","own":true,"cards":[{"k":"define","text":"A water-efficient irrigation method that delivers small, controlled quantities of water directly to the plant root zone minimising water wastage. eg. drip, sprinkler, sub-surface","q":"What is meant by micro-irrigation?"},{"k":"for","rows":[{"l":"Water-use efficiency","t":"efficiency [[75–95%]] against [[≈ 35–40%]] for flood irrigation; saves [[20–25%]] water"},{"l":"Energy and input savings","t":"saves [[10–30%]] electricity; uses [[28%]] less fertiliser"},{"l":"Allows preuse mixing of fertilizers in water","t":"direct application to root zone; leading to less fertz consumption"},{"l":"Higher yields","t":"raises yields by [[20–80%]]"},{"l":"Groundwater relief","t":"groundwater supplies [[≈60–65%]] of irrigation, and [[≈60%]] of Punjab’s blocks are over-exploited"}],"q":"Why expand micro-irrigation?","cue":"Save water → save power and fertiliser → feed the root → raise yields → spare groundwater."},{"k":"against","rows":[{"l":"Capital cost","t":"setting up costs [[≈₹1 lakh]]/ha in Assam, with maintenance of [[10–20%]] of that cost each year","fix":"Micro Irrigation Fund ([[₹5,000 crore]] with NABARD)","h":"Finance"},{"l":"Maintenance gaps","t":"clogging and servicing need trained support ([[10-20%]] of intial cost each year (pew market research))","h":"People and skills"},{"l":"Inadequate promotion","t":"e.g. adoption lagged in Karnataka’s Chikkaballapur district because farmers had limited tech support","h":"People and skills"},{"l":"Small and fragmented holdings","t":"raise the per-farmer cost of installation","h":"Infrastructure"},{"l":"Poor integration with existing farm systems","h":"Technology","t":""},{"l":"Free power disincentivises saving water","h":"Rules and institutions","t":""}],"q":"Why is micro-irrigation adoption slow?","cue":"Capital cost → Maintenance gaps → Inadequate promotion → Small and fragmented holdings → Poor integration with existing farm systems → Free power disincentivises saving water."},{"k":"value","rows":[{"l":"Micro-irrigation","t":"[[over 115 lakh]] ha under Per Drop More Crop (July 2026), [[≈8%]] of net sown area (PIB)"}],"q":"How much land is under micro-irrigation?"},{"k":"diagram","q":"Draw the diagram for Micro-irrigation","g":{"dir":"TD","nodes":[["I","Irrigation"],["S","Surface - canals, tanks"],["G","Groundwater - wells, tubewells"],["M","Micro - drip, sprinkler"],["E","Water-use efficiency 75 to 95%"]],"edges":[["I","S",""],["I","G",""],["I","M",""],["M","E",""]]}}]},{"id":"GS34-water-use-efficiency","line":"GS3.4","part":"Irrigation","name":"Water-use efficiency","own":true,"cards":[{"k":"define","text":"The amount of agricultural output (crop yield) produced per unit of water used, reflecting how effectively water resources are utilised. (more crop per drop)","q":"What is meant by water-use efficiency?"},{"k":"for","rows":[{"l":"Finance","t":"PMKSY ‘Per Drop More Crop’ and the Micro Irrigation Fund pay for drip and sprinkler"},{"l":"Infrastructure","t":"modernising old canal projects and command area development could raise overall irrigation efficiency by [[≈20–21%]] (National Water Mission) and On-Farm Micro-Storage & Watershed Recharge"},{"l":"Markets","t":"crop choice: millets and pulses need far less water than paddy (see Millets, Cropping pattern)"},{"l":"Technology","t":"Precision Micro-Irrigation Adoption: Shifting from conventional flood irrigation ([[≈25–40%]] efficiency) to drip ([[≈85–90%]]) and sprinkler ([[≈75–85%]]) systems under Per Drop More Crop (PDMC)"},{"l":"Integrated Fertigation Practices","t":"Dissolving water-soluble nutrients directly into micro-irrigation"},{"l":"Agronomic Water-Saving Protocols","t":"Adopting Alternate Wetting and Drying (AWD) in paddy, Direct-Seeded Rice (DSR), laser land leveling, and zero-tillag"},{"l":"Rules and institutions","t":"water pricing and differential entitlements (the route the National Water Mission names); rotational sharing such as Warabandi (see Government steps)"}],"q":"How can India raise agricultural water-use efficiency?"},{"k":"against","rows":[{"l":"Finance","t":"High upfront capital expenditure for drip/sprinkler hardware"},{"l":"People and skills","t":"Weak grassroots agronomic extension leaves cultivators reliant on traditional flood-irrigation habits"},{"l":"Infrastructure","t":"old, unlined canals lose water before it reaches the field (irrigation efficiency depressed at [[30–38%]])"},{"l":"Markets","t":"assured MSP procurement keeps water-hungry paddy and wheat attractive"},{"l":"Rules and institutions","t":"water and irrigation are State subjects, so pricing reform depends on each state"},{"l":"Equity and sustainability","t":"groundwater supplies [[≈60–65%]] of irrigation and [[≈60%]] of Punjab’s blocks are over-exploited (see Micro-irrigation)"}],"q":"What keeps water-use efficiency low?","cue":"Costly kit, weak extension, leaky canals, MSP for paddy, State-subject politics, groundwater stress."},{"k":"value","rows":[{"l":"Piped Irrigation & SCADA (Mihir Shah Committee)","t":"Replace open canals with pressurised pipelines, SCADA flow meters and drip/sprinkler systems to reduce seepage and achieve [[20%]] higher water-use efficiency (National Water Mission)"},{"l":"Volumetric Pricing & Solarisation","t":"Ashok Dalwai Committee / PM-KUSUM"},{"l":"Agro-Climatic Crop Realignment","t":""},{"l":"AI & IoT Precision Irrigation","t":"Digital Agriculture Mission"},{"l":"Community Aquifer Management (Atal Bhujal Yojana)","t":""}],"q":"Which reforms and committees improve water-use efficiency?","cue":"Pipe it → price it → realign crops → automate → let communities manage aquifers."},{"k":"data","rows":[{"l":"Atal Bhujal Yojana","t":"improves groundwater management through community participation"}],"q":"What examples back up water-use efficiency?"}]},{"id":"GS34-watershed-development","line":"GS3.4","part":"Irrigation","name":"Watershed development","own":true,"cards":[{"k":"define","text":"Treating an entire watershed (the area draining to a common point) as one planning unit for integrated soil, water and land management, from ridge to valley.","q":"What is meant by watershed development?"},{"k":"list","q":"How has watershed development evolved?","rows":[{"l":"Early programmes","t":"DPAP + DDP + IWDP"},{"l":"IWMP","t":"2009–10"},{"l":"WDC-PMKSY","t":"2015–16; WDC-PMKSY 2.0 (2021–26) under the Department of Land Resources"},{"l":"Ridge to valley","t":"treat upper slopes first → slow runoff → recharge groundwater → harvest water → raise farm productivity in the valley"}]},{"k":"for","rows":[{"l":"Groundwater Recharge","t":"Check dams, bunding and farm ponds improve infiltration and replenish aquifers."},{"l":"Rainfed Productivity","t":"Moisture conservation and protective irrigation stabilise output; [[76%]] of India's oilseed area is rainfed (NITI Aayog, 2024)."},{"l":"Cropping Intensity","t":"Better water availability enables multiple cropping and high-value horticulture."},{"l":"Rural Employment","t":"Construction of ponds, trenches and bunds generates jobs and community assets."},{"l":"Ecological Restoration","t":"Afforestation and soil conservation reduce erosion and desertification."},{"l":"Climate Resilience","t":"Improved soil moisture protects smallholders against droughts and erratic monsoons."},{"l":"Livelihood Diversification","t":"Dairy, fisheries, poultry and livestock reduce seasonal income dependence and distress migration."},{"l":"Latest evidence: WDC-PMKSY 2.0 (1 September 2026)","t":"1,220 projects covering [[52.9 lakh]] hectares; [[28.5 lakh]] farmers benefited and [[2.9 crore]] person-days of employment generated."}],"q":"What are the benefits of watershed development?","cue":"Recharge → stabilise rainfed farms → crop more → employ → restore → resist drought → diversify."},{"k":"against","rows":[{"l":"Maintenance Deficit","t":"Watershed assets deteriorate due to inactive committees and inadequate post-project maintenance.","h":"Infrastructure"},{"l":"Fragmented Infrastructure","t":"Isolated structures without ridge-to-valley planning reduce effectiveness and increase siltation.","h":"Infrastructure"},{"l":"Institutional Silos","t":"Poor inter-departmental coordination delays project implementation and convergence.","h":"Rules and institutions"},{"l":"Equity Deficit","t":"Landowners benefit disproportionately from private-land investments, while landless households depend on common resources.","h":"Equity and sustainability"},{"l":"Negative Externality","t":"Unregulated upstream water harvesting reduces downstream water availability, triggering conflicts.","h":"Equity and sustainability"}],"q":"Why do watershed projects underperform?","cue":"Assets decay, structures are isolated, departments work in silos, landowners gain most, upstream takes downstream’s water."},{"k":"value","rows":[{"l":"Asset Sustainability","t":"Strengthen the Watershed Development Fund through community contributions, user charges and common-asset income; reserve [[50%]] for maintenance and [[50%]] as a revolving fund."},{"l":"Institutional Convergence","t":"Converge WDC-PMKSY with MGNREGS for soil and water conservation works; empower Watershed Committees within Gram Panchayats, as recommended by the Parthasarathy Committee (2006)."},{"l":"Inclusive Growth","t":"Allocate [[15%]] of project outlay to landless and assetless households through poultry, fisheries, goat-rearing and micro-enterprises; protect their rights over common resources."},{"l":"Technology-led Governance","t":"Use GIS, satellite mapping and geo-tagging of assets for scientific planning, transparency and monitoring."},{"l":"Conjunctive Water Management","t":"Conduct participatory water budgeting and regulate groundwater extraction, crop choices and water sharing to prevent aquifer depletion and inter-village conflicts."},{"l":"Mountain Water Security","t":"Scale up springshed development by protecting spring catchments and aquifer recharge zones, particularly in Himalayan states."},{"l":"Integrated Landscape Planning","t":"Adopt ridge-to-valley planning, integrating upper-catchment treatment, drainage management, groundwater recharge and downstream crop-water planning."},{"l":"Core takeaway","t":"Watershed development must move beyond constructing water-harvesting structures towards community-managed, equitable and sustainable landscape restoration."}],"q":"How can watershed development work better?","cue":"Fund upkeep → converge with MGNREGS → include the landless → map with GIS → budget water → protect springs → plan ridge to valley."},{"k":"data","rows":[{"l":"Srikakulam (Andhra Pradesh)","t":"watershed projects raised maize yields by [[≈25%]] and rice by [[≈21%]], by linking soil and moisture conservation with cropping patterns (ICAR study)"}],"q":"What data and examples back up Watershed development?"},{"k":"diagram","q":"Draw the diagram for Watershed development","g":{"dir":"LR","nodes":[["R","Ridge - trenches, plantation"],["D","Drainage line - check dams"],["H","Valley - ponds, recharge"],["G","Groundwater up"],["Y","Yields and jobs"]],"edges":[["R","D",""],["D","H",""],["H","G",""],["G","Y",""]]}}]},{"id":"GS34-jal-shakti-abhiyan","line":"GS3.4","part":"Irrigation","name":"Jal Shakti Abhiyan","own":true,"cards":[{"k":"define","text":"A mission-mode water conservation campaign (Ministry of Jal Shakti, 2019; nationwide as ‘Catch the Rain’ in 2021) for rainwater harvesting and groundwater recharge through community participation.","q":"What is meant by Jal Shakti Abhiyan?"},{"k":"list","q":"How has the Jal Shakti Abhiyan evolved?","rows":[{"l":"2019","t":"JSA in 256 water-stressed districts"},{"l":"2021","t":"JSA: Catch the Rain, nationwide"},{"l":"2024","t":"Jal Sanchay Jan Bhagidari"},{"l":"2026","t":"JSJB: Catch the Rain integration"}]},{"k":"for","rows":[{"l":"Administrative Convergence","t":"Fiscal Convergence – Pools MGNREGS, PMKSY, AMRUT and Finance Commission grants without a separate dedicated campaign budget."},{"l":"Groundwater Recharge","t":"Rainwater harvesting, recharge shafts and revival of defunct borewells replenish shallow aquifers supporting well and tube-well irrigation."},{"l":"Climate-Resilient Agriculture","t":"Improved groundwater availability provides protective irrigation and reduces crop vulnerability to dry spells and erratic monsoons."},{"l":"Social Capital","t":"Jan Bhagidari – Jal Sanchay Jan Bhagidari (launched September 2024) mobilises communities, CSR and women’s collectives through the 3Cs: Community, CSR and Cost. The 2024 campaign theme was Nari Shakti se Jal Shakti."},{"l":"District-Level Planning","t":"712 Jal Shakti Kendras and 640 District Water Conservation Plans strengthen local technical support and decentralised water planning."},{"l":"Revival of Traditional Commons","t":"Desilting stepwells (baolis), village tanks and community ponds restores decentralised water storage."},{"l":"[[1.6 crore]]+ artificial groundwater recharge structures","t":"constructed under Jal Sanchay Jan Bhagidari. In June 2026, JSJB was integrated with JSA: Catch the Rain as JSJB: CTR."}],"q":"What has the Jal Shakti Abhiyan achieved?","cue":"Converge funds → recharge → protect farms → mobilise people → plan by district → revive commons."},{"k":"against","rows":[{"l":"Fiscal Constraints","t":"Absence of a dedicated fund","h":"Finance"},{"l":"Maintenance Deficit","t":"Recharge shafts, check dams and ponds suffer from siltation","h":"Infrastructure"},{"l":"Hydrogeological Mismatch","t":"Uniform civil-work templates without local aquifer mapping can result in recharge structures being built in low-permeability zones.","h":"Technology"},{"l":"Input-Output-Outcome Mismatch","t":"prioritisation of the number of structures rather than actual groundwater-level improvement","h":"Rules and institutions"},{"l":"Incentive Distortion","t":"Free agricultural electricity makes groundwater pumping cheap, encouraging over-extraction and undermining recharge efforts.","h":"Rules and institutions"}],"q":"What are the limits of the Jal Shakti Abhiyan?","cue":"No own fund → assets silt up → one design for all aquifers → counting structures, not water → free power."},{"k":"value","rows":[{"l":"Conjunctive Water Management","t":"Outcome-Based Monitoring – Shift from counting structures to measuring groundwater recovery through piezometers, Digital Water Level Recorders (DWLRs) and Gram Panchayat-level water budgets. Replicate Atal Bhujal Yojana's community-led water budgeting model."},{"l":"Dedicated Maintenance Financing","t":"Leverage Finance Commission grants to PRIs and MGNREGS for recurring pre-monsoon desilting, repairs and maintenance of community water assets."},{"l":"Incentive Rationalisation","t":"Demand-Side Reforms – Introduce rational irrigation-water pricing and DBT-based water subsidies, alongside separation of agricultural power feeders, as suggested by the Ashok Dalwai Committee. Complement these with PM-KUSUM and groundwater budgeting."},{"l":"Evidence-Based Planning","t":"Scientific Aquifer Mapping – Integrate CGWB's NAQUIM 2.0 high-resolution aquifer maps into District Water Conservation Plans to identify suitable recharge zones and improve groundwater management."},{"l":"Participatory Water Management","t":"Women-Led Water Governance – Empower village-level Pani Samitis and women SHGs with formal maintenance responsibilities and community rights over rejuvenated ponds."},{"l":"Integrated Water Governance","t":"Adopt basin-level surface and groundwater planning; the Mihir Shah Committee (2016) proposed integrating CWC and CGWB into a unified National Water Commission to improve holistic water-resource management."},{"l":"Core takeaway","t":"JSA must evolve from a structure-construction campaign into an outcome-oriented, community-managed water conservation movement, combining groundwater recharge with demand-side management."}],"q":"How should the Jal Shakti Abhiyan evolve?","cue":"Measure outcomes → fund upkeep → price water → map aquifers → let women lead → plan by basin."}]},{"id":"GS34-pm-kusum","line":"GS3.4","part":"Irrigation","name":"PM-KUSUM","own":true,"cards":[{"k":"define","text":"PM Kisan Urja Suraksha evam Utthaan Mahabhiyan: solar pumps and solarised farm feeders, so irrigation gets cheaper, cleaner power and farmers can sell surplus power to the grid.","q":"What is meant by PM-KUSUM?"},{"k":"for","rows":[{"l":"Water and energy efficiency","t":"solar pumps paired with micro-irrigation; decentralised power at the farm"},{"l":"Cost saving","t":"no diesel or electricity bill for irrigation"},{"l":"Extra income","t":"surplus solar power sold to the grid"},{"l":"Crop diversification","t":"Chandrapur case: farmers moved from paddy to vegetables (your notes)"}],"q":"Why is PM-KUSUM useful?","cue":"Efficient → free to run → earns income → lets farmers diversify."},{"k":"against","rows":[{"l":"Finance","t":"high initial cost for small farmers","h":"Finance"},{"l":"Technology","t":"no efficient, affordable energy storage","h":"Technology"},{"l":"Equity and sustainability","t":"near-free daytime power can encourage over-pumping of groundwater unless paired with micro-irrigation and metering","h":"Equity and sustainability"}],"q":"What are the problems with PM-KUSUM?","cue":"Costly to start → no storage → may drain groundwater."},{"k":"value","rows":[{"l":"PM-KUSUM","t":"solar pumps and solarised feeders (see Keywords → PM-KUSUM)"}],"q":"What schemes, data and examples back up PM-KUSUM?"},{"k":"data","q":"What data goes with PM-KUSUM?","title":"Data","rows":[{"l":"PM-KUSUM (2019)","t":"solar pumps and feeder solarisation; [[₹34,422 crore]] of central support for [[34.8 GW]], but only [[≈13 GW]] installed by March 2026 with some projects given until March 2027 (MNRE)"}]}]},{"id":"GS34-saving-water-in-a-depleting-scenario","line":"GS3.4","part":"Irrigation","name":"Saving water in a depleting scenario","own":true,"cards":[{"k":"list","rows":[{"l":"Rainwater harvesting","t":"India receives ≈1,180 mm of rain a year but harvests only [[≈8%]] of it; rainwater projects in Bundelkhand (Parasi-Sindh) raised groundwater by [[≈10%]]"},{"l":"Watershed management","t":"e.g. the Mid-Himalayan Watershed Development Project treated [[≈1 lakh]] ha (see Watershed development)"},{"l":"Micro-irrigation plus mulching","t":"mulch cuts evaporation from the soil"},{"l":"Drought-tolerant crops","t":"millets and pulses"},{"l":"Sub-surface dykes","t":"underground barriers that slow groundwater flow and hold it near wells"},{"l":"Water schedules","t":"Warabandi in Punjab (turn-by-turn sharing)"},{"l":"Water audit","t":"Maharashtra audits its irrigation water use (since 2003)"},{"l":"Water pricing","t":"volumetric pricing in Andhra Pradesh"}],"q":"How can India save water in agriculture as groundwater depletes?","cue":"Catch rain → treat watersheds → drip and mulch → grow hardy crops → hold groundwater → share by turn → audit → price."},{"k":"value","rows":[{"l":"Soil and water","t":"soil degradation affects ≈147 Mha (ICAR). India gets ≈1,180 mm of rainfall a year but harvests only [[≈8%]] of it"},{"l":"Warabandi","t":"rotational water-sharing system in Punjab (Agriculture notes)"}],"q":"What data and examples back up water saving?"}]},{"id":"GS34-surface-manual-irrigation","line":"GS3.4","part":"Irrigation","name":"Surface (manual) irrigation","own":true,"cards":[{"k":"define","text":"Surface irrigation: letting water flow over the soil surface by gravity (e.g. flood, furrow and basin irrigation). Manual irrigation: applying water by hand with buckets, watering cans or hoses.","q":"What is meant by surface (manual) irrigation?"}]},{"id":"GS34-sprinkler-irrigation","line":"GS3.4","part":"Irrigation","name":"Sprinkler irrigation","own":true,"cards":[{"k":"define","text":"Spraying water over crops through pipes and sprinklers, simulating rainfall.","q":"What is meant by sprinkler irrigation?"}]},{"id":"GS34-sub-surface-irrigation","line":"GS3.4","part":"Irrigation","name":"Sub-surface irrigation","own":true,"cards":[{"k":"define","text":"Supplying water directly to the root zone through underground pipes or buried drip lines.","q":"What is meant by sub-surface irrigation?"}]},{"id":"GS34-automated-precision-irrigation","line":"GS3.4","part":"Irrigation","name":"Automated (precision) irrigation","own":true,"cards":[{"k":"define","text":"Using sensors, timers and automated systems to deliver precise quantities of water according to crop requirements and soil moisture.","q":"What is meant by automated (precision) irrigation?"}]},{"id":"GS34-jevons-paradox-rebound-effect","line":"GS3.4","part":"Irrigation","name":"Jevons paradox (rebound effect)","own":true,"cards":[{"k":"define","text":"A situation where improvements in resource-use efficiency reduce the cost of using a resource, encouraging greater consumption and thereby offsetting the expected resource savings.","q":"What is meant by Jevons paradox (rebound effect)?"}]},{"id":"GS34-apmc-and-the-2020-farm-laws","line":"GS3.4","part":"Agricultural marketing","name":"APMC","own":true,"cards":[{"k":"define","q":"How do APMC mandis work?","text":"APMC mandis are state-regulated market yards where notified agricultural produce is traded through licensed commission agents (arhtiyas). Statutory fees and commissions add [[≈15%]] to intermediation costs."},{"k":"for","q":"Why reform APMCs (the case behind the 2020 farm laws)?","rows":[{"l":"Prevents distress sales by mandating transparent, competitive open-auction price discovery","t":""},{"l":"Anchors reliable MSP procurement and public stockholding","t":"e.g. Punjab and Haryana mandis supply >[[70%]] of FCI wheat and rice"},{"l":"Guarantees timely payment and standardized weighment, protecting smallholders from trader fraud","t":""},{"l":"Generates state revenue via mandi fees to fund rural roads and market infrastructure","t":"e.g. Punjab's Rural Development Fund"},{"l":"Provides a centralized physical hub where buyers and sellers aggregate, lowering search costs","t":""}],"cue":"Exam-hall trigger: Think \"Institutional safety net\" — regulated yards prevent distress sales, guarantee payment, and anchor state procurement."},{"k":"against","q":"Why did the 2020 farm laws fail, and what is wrong with APMCs?","rows":[{"l":"Arhtiya (commission agent) cartels rig auctions and trap indebted farmers in single mandis via informal credit, depressing farm-gate prices","t":""},{"l":"Cascading mandi taxes, rural development cesses, and commissions add [[≈15%]] to costs (historically up to [[8.5%]] in Punjab), deterring private buyers","t":""},{"l":"Severe infrastructure deficit","t":"fewer than [[20%]] of mandis have scientific sorting, grading, cold storage, or assaying labs, driving post-harvest losses."},{"l":"Fragmented state rules restrict seamless interstate trade, locking farmers out of national price arbitrage","t":""},{"l":"Low digital literacy and price asymmetry leave smallholders reliant on local traders rather than real-time market rates","t":""}],"cue":"Exam-hall trigger: Think \"Monopsony & rent-seeking\" — tying farmers to a single market creates middleman cartels, high levies, and poor infrastructure."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Integrate mandis onto e-NAM with unified single-point licenses and electronic assaying labs ([[1,389]]+ mandis integrated)","t":""},{"l":"Cap statutory mandi fees and commissions","t":"(e.g., Model APLM Act 2017 recommends a [[1–2%]] cap) to make regulated markets cost-competitive."},{"l":"Upgrade [[22,000]] Gramin Agricultural Markets (GrAMs) as farm-gate feeder hubs within a [[5 km]] radius(Dalwai Committee benchmark)","t":""},{"l":"Deploy the [[₹1 lakh crore]] Agriculture Infrastructure Fund (AIF) to build cold chains, grading, and warehousing inside mandi yards","t":""},{"l":"Decontrol perishables (fruits and vegetables) from mandatory mandi routing so farmers can sell directly without middlemen","t":""}],"cue":"Exam-hall trigger: Think \"Modernize & decongest\" — digitize existing mandis, cap fees, and build rural feeder markets."},{"k":"diagram","q":"Draw the diagram for APMC and the 2020 farm laws","g":{"dir":"LR","nodes":[["F","Farmer"],["A","APMC mandi - commission agent"],["W","Wholesaler"],["R","Retailer"],["C","Consumer"],["P","FPO, e-NAM, processor - shorter chain"]],"edges":[["F","A",""],["A","W",""],["W","R",""],["R","C",""],["F","P",""],["P","R",""]]}},{"k":"data","q":"What did commentators say about the private sector in farm markets?","title":"Data","rows":[{"l":"Private sector and agriculture (Sansad TV perspective)","t":"with the right tools, corporate–farm linkages (contract farming, FPO–agritech tie-ups) could drive modernisation; the safeguards are under Contract farming, GS3.6"}]}]},{"id":"GS34-the-2020-farm-laws","line":"GS3.4","part":"E-technology for farmers","name":"The 2020 Farm Laws","own":true,"cards":[{"k":"define","q":"What is The 2020 Farm Laws?","text":"Three central acts passed in September 2020 to create tax-free parallel trade areas outside APMCs, permit contract farming, and deregulate stock limits; repealed in November 2021 following sustained protests."},{"k":"for","q":"What are the gains from The 2020 Farm Laws?","rows":[{"l":"Allows farmers to sell directly to third parties outside notified mandis for better price discovery","t":"e.g. Model APLM Act 2017 allowed private markets and direct marketing"},{"l":"Boosts net farm income by [[13.5–17.1%]] through competitive bidding across multiple channels (Ashok Dalwai Committee estimates)","t":""},{"l":"Cuts [[≈15%]] intermediation costs by bypassing multi-tier arhtiya commissions and mandi levies","t":"e.g. Safal / Mother Dairy direct-sourcing model"},{"l":"Attracts private capex into cold chains, logistics, and processing, curbing India's [[₹1.5 lakh crore]] annual post-harvest losses (NABCONS study)","t":""},{"l":"Encourages crop diversification into perishables and oilseeds via assured corporate off-take","t":"e.g. ITC e-Choupal linkages"}],"cue":"Exam-hall trigger: Think \"Competition breaks monopsony\" — parallel buyers cut middleman margins, unlock private capex, and raise farmer realization."},{"k":"against","q":"What are the problems with The 2020 Farm Laws?","rows":[{"l":"Triggered existential fear that tax-free private markets would starve APMCs of revenue, collapsing procurement and de facto ending MSP (especially in Punjab and Haryana)","t":""},{"l":"Violated cooperative federalism by encroaching on State List subjects","t":"Entry [[28]] (Markets and fairs) and Entry [[14]] (Agriculture)—provoking state counter-bills (e.g., Punjab and Rajasthan)."},{"l":"Suffered a legitimacy deficit due to the COVID-era ordinance route (June 2020) without Parliamentary Standing Committee scrutiny or farmer consultation","t":""},{"l":"Left smallholders ([[86%]] of farmers, <[[2]] ha) vulnerable to corporate asymmetry in contract farming by barring civil court jurisdiction in favor of executive boards (SDM/ADM)","t":""},{"l":"Risked repeating the Bihar precedent, where repealing the APMC Act in 2006 without alternative infrastructure led to lower farm-gate prices and weak procurement","t":""}],"cue":"Exam-hall trigger: Think \"Trust deficit + Federal bypass\" — deregulating markets without MSP guarantees or state consultation triggered existential fears."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Build consensus via a GST Council-style federal body and incentive grants instead of unilateral central laws, letting states adopt the Model APLM Act 2017","t":""},{"l":"Aggregate smallholders through the [[10,000]] FPOs scheme to give them collective bargaining power against large corporate buyers","t":"e.g. Sahyadri Farms, Maharashtra"},{"l":"Upgrade existing APMCs and link [[22,000]] rural haats (GrAMs) to e-NAM rather than letting regulated mandis atrophy","t":""},{"l":"Enact balanced state contract-farming laws (Model APLCS Act 2018) with civil court recourse and mandatory crop insurance linkage","t":""},{"l":"Strengthen MSP procurement and expand PM-AASHA price-deficiency payments to non-cereal crops to de-risk market transitions","t":""}],"cue":"Exam-hall trigger: Think \"Consensus, aggregation & price assurance\" — build federal consensus, empower smallholders via FPOs, and safeguard MSP."}]},{"id":"GS34-fpos","line":"GS3.4","part":"Agricultural marketing","name":"FPOs","own":true,"cards":[{"k":"define","q":"What is meant by FPOs?","text":"Collectives of farmers, usually registered as producer companies or cooperatives, that pool inputs and produce to gain scale and bargaining power."},{"k":"for","q":"Why are FPOs important?","rows":[{"l":"Pools fragmented harvests ([[86%]] farmers own <[[2]] ha) to gain bulk bargaining power and higher farm-gate prices","t":"e.g. Sahyadri Farms, Maharashtra"},{"l":"Cuts input costs by [[15–20%]] via bulk buying of seeds, fertilizers, and shared machinery","t":"e.g. Custom Hiring Centres"},{"l":"Captures more of the consumer rupee through sorting, grading, processing, and branding","t":"e.g. branded organic pulses and spices"},{"l":"Connects farmers directly to institutional and digital buyers, bypassing middlemen","t":"e.g. FPOs trading on e-NAM and ONDC"},{"l":"Unlocks formal bank credit and government subsidies that individual smallholders cannot access","t":"e.g. NABARD and SFAC schemes"}],"cue":"Exam-hall trigger: Think \"Aggregation creates scale\" — pooling small farms lowers input costs, attracts big buyers, and captures retail margins."},{"k":"against","q":"What holds FPOs back?","rows":[{"l":"Thin equity and working capital shortages stop FPOs from buying crops upfront, pushing farmers back to traders (most hold under [[₹5 lakh]] capital)","t":""},{"l":"Lack of professional managers and business skills causes weak governance, poor record-keeping, and dormant units","t":""},{"l":"Weak buyer linkages and lack of assured off-take leave most FPOs commercially unviable (only [[≈30%]] turn profitable)","t":""},{"l":"Missing local storage, grading, and cold-chain facilities force raw sales instead of value addition","t":""},{"l":"Heavy company-law compliance (audits, ROC filings) drains funds, while women and marginal farmers remain underrepresented","t":""}],"cue":"Exam-hall trigger: Think \"Small capital, big compliance\" — thin equity, missing managers, and heavy company rules stall commercial growth."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Provide collateral-free working capital and matching equity grants for upfront crop buying","t":"e.g. Credit Guarantee Fund under the [[10,000]] FPOs scheme"},{"l":"Fund professional CEOs and multi-year handholding through Cluster-Based Business Organizations (CBBOs via SFAC and NABARD)","t":""},{"l":"Build assured off-take by linking FPOs directly with corporate buyers, e-NAM, and ONDC","t":"e.g. ITC and Mother Dairy tie-ups"},{"l":"Channel subsidized loans to FPOs for building local warehouses and grading units","t":"e.g. Agriculture Infrastructure Fund"},{"l":"Ease company-law compliance for small FPOs and mandate women and small-farmer representation on boards","t":"e.g. Mann Deshi women FPOs"}],"cue":"Exam-hall trigger: Think \"Capital, capacity & market connect\" — infuse working capital, hire professional managers, and lock in institutional buyers."},{"k":"data","q":"Which platforms and recommendations support FPOs?","title":"Data","rows":[{"l":"ONDC","t":"connects buyer apps (Paytm, Meesho), logistics providers (Delhivery) and seller apps (GoFrugal); about 5,000 FPOs have joined"},{"l":"Economic Survey 2025-26 recommends","t":"FPOs as the main channel for extension services; APMC problems to be fixed; downstream infrastructure through NMP 2.0, e-NAM and PLI for food processing (notebook)"}]}]},{"id":"GS34-cobweb-model","line":"GS3.4","part":"Agricultural marketing","name":"Cobweb model","own":true,"cards":[{"k":"define","text":"Explains why farm prices swing year to year: farmers plant on last season’s price, so supply overreacts and price and quantity spiral around equilibrium.","q":"What does the cobweb model explain?"},{"k":"list","q":"How does the cobweb cycle work, and how do APMCs feed it?","rows":[{"l":"Boom","t":"a high price (say [[₹100]]/kg of rice) brings more sowing, so supply rises and the price falls"},{"l":"Bust","t":"next season fewer farmers plant, supply falls and the price rises again"},{"l":"APMCs feed it","t":"entry barriers, opaque price discovery, and planning on delayed, local mandi data instead of a wider market view"}]}]},{"id":"GS34-supply-chain-bottlenecks","line":"GS3.4","part":"Agricultural marketing","name":"Supply-chain bottlenecks","own":true,"cards":[{"k":"define","q":"What are the upstream and downstream parts of the farm supply chain?","text":"Upstream: inputs, production, R&D and harvest. Downstream: processing, distribution and sale."},{"k":"for","q":"What are the gains from Supply-chain bottlenecks?","rows":[{"l":"Raises farmers' share in the final consumer rupee by cutting multi-tier middleman margins (currently just [[28–74%]] for perishables, RBI)","t":""},{"l":"Curbs post-harvest spoilage of perishables through timely processing and cold storage","t":"e.g. Operation Greens for tomato, onion, and potato"},{"l":"Smooths seasonal gluts and shortages, keeping food inflation under control","t":""},{"l":"Boosts agri-exports by meeting global sanitary and residue standards (avoiding rejections like basmati rice over tricyclazole residue)","t":""},{"l":"Creates rural non-farm jobs in sorting, grading, packaging, and food processing","t":"e.g. Mega Food Parks"}],"cue":"Connecting farms directly to processors and organised retail cuts waste, stabilizes food prices, and raises farmer income."},{"k":"against","q":"What are the problems with Supply-chain bottlenecks?","rows":[{"l":"Severe infrastructure gap","t":"only [[≈10%]] of markets have cold storage, and only [[≈10%]] of produce is processed (against [[23%]] in China and [[70%]] in Brazil), worsened by high tolls and poor rural roads."},{"l":"Fragmented stakeholder links and arhtiya cartels in APMCs leave farmers with just [[28–74%]] of the consumer price for perishables (RBI), while e-NAM carries only [[≈15%]] of trades","t":""},{"l":"Fear of abrupt Essential Commodities Act stock limits, complex licensing, and inter-state trade rules deter private investment","t":""},{"l":"Unorganised, unregistered enterprises employ [[≈70%]] of workers, limiting modern processing machinery,scale, and skilled labour","t":""},{"l":"Lack of uniform grading and quality-testing standards hurts domestic value and triggers export rejections","t":"e.g. tricyclazole residue in rice"}],"cue":"Weak infrastructure, fragmented markets, and regulatory fear trap produce in unorganised channels and depress farmer returns."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Expand cold storage, assaying labs, and processing hubs near farms using the [[₹1 lakh crore]] Agriculture Infrastructure Fund and PM Kisan SAMPADA Yojana","t":""},{"l":"Integrate mandis onto e-NAM with unified inter-state licenses and link FPOs directly to organised retail and ONDC","t":"e.g. Safal / Mother Dairy direct sourcing"},{"l":"Ensure predictable Essential Commodities Act stock-limit rules and simplify inter-state licensing to de-risk private storage capex","t":""},{"l":"Formalize small food-processing units and train workers in modern machinery and quality testing","t":"e.g. PMFME scheme"},{"l":"Enforce uniform AGMARK/FSSAI grading and farm-gate residue testing to meet global export norms","t":"e.g. APEDA traceability systems"}],"cue":"Build shared farm-gate infrastructure, digitize market linkages, and keep trade rules predictable to attract private capital."},{"k":"list","rows":[{"l":"Finance","t":"the Essential Commodities Act (stock limits) deters private investment for fear of misuse"},{"l":"People and skills","t":"unorganised, unregistered enterprises employ [[≈70%]] of workers (see GS3.6)"},{"l":"Infrastructure","t":"only [[≈10%]] of markets have cold storage; processing [[≈10%]] of produce against [[23%]] in China and [[70%]] in Brazil; high tolls and poor rural roads (see Numbers)"},{"l":"Markets","t":"cartels of arhtiyas in APMCs; fragmented stakeholder links; e-NAM carries only [[≈15%]] of trades"},{"l":"Technology","t":"no uniform standards and grading (e.g. tricyclazole residue in rice)"},{"l":"Rules and institutions","t":"complex licensing, permits and inter-state trade rules"},{"l":"Equity and sustainability","t":"farmers get only [[28–74%]] of the consumer price for perishables (RBI)"}],"title":"Across the chain","q":"What bottlenecks run through the farm supply chain?","cue":"Money → people → cold storage → markets → standards → rules → farmer’s share."},{"k":"list","title":"Transport constraints (2020 Q3)","rows":[{"l":"Rural roads","t":"no all-weather roads, so produce, especially vegetables, cannot reach mandis in the monsoon (see Examples)"},{"l":"Few reefers","t":"only [[≈4%]] of fruits move in reefer trucks; reefer shortfall [[≈85%]] (NCCD)"},{"l":"Road-heavy and costly","t":"[[≈97%]] of fruits and vegetables go by road, [[1.9%]] by rail; the farmgate-to-mandi haul is expensive"},{"l":"Losses","t":"transport causes [[≈30–40%]] of post-harvest loss; [[≈₹92,000 crore]] lost a year"},{"l":"Weak multimodal logistics","t":"rural logistics underdeveloped; main freight arteries congested"},{"l":"Permits","t":"reefer vans get 5-year permits with limited inter-state validity"}],"q":"What transport constraints hurt farm supply chains?","cue":"Roads → reefers → road-heavy → losses → no multimodal → permits."},{"k":"list","q":"What does the downstream of the farm supply chain need?","rows":[{"l":"Needs","t":"modern processing machinery, quality testing of finished products, organised retail, skilled workers"},{"l":"PYQs","t":"2022 Q13, 2020 Q3, 2025 Q4"}]},{"k":"data","rows":[{"l":"Cold chain","t":"only [[≈10%]] of perishables reach market through cold storage; [[≈30–40%]] of fruits and vegetables are lost after harvest (notebook) (see GS3.6 → Numbers)"},{"l":"Farmers’ share of the consumer price","t":"[[49–76%]] for non-perishables (RBI)"},{"l":"Farmers’ share of the consumer rupee (RBI, 2024)","t":"tomato [[33%]], onion [[36%]], potato [[37%]]; banana [[31%]], grapes [[35%]], mango [[43%]]; pulses [[65–75%]]; milk [[70%]]; wheat [[67%]]"},{"l":"Thinking framework (perishables)","t":"frictions come from cold chain, post-harvest handling, infrastructure gaps, credit lines, and policy"},{"l":"Agriculture Infrastructure Fund (AIF)","t":"[[₹1 lakh crore]] for post-harvest infrastructure, with [[3%]] interest subvention; implemented through NABARD; BHARAT campaign (Banks Heralding Accelerated Rural and Agriculture Transformation, 15 July–15 August 2023, target [[₹7,200 crore]]) made banks compete to lend under AIF"}],"q":"What data and schemes address supply-chain gaps?"},{"k":"data","rows":[{"l":"Operation Greens","t":"(Budget 2018-19, [[₹500 crore]], MoFPI, on the lines of Operation Flood): tomato, onion and potato value chains; extended in June 2020 from TOP to TOTAL (41 notified fruits and vegetables); [[50%]] subsidy on transport and on hiring storage during gluts (PIB)"},{"l":"Cold Chain Scheme (MoFPI, since 2008)","t":"395 integrated cold-chain projects approved, 291 operational (June 2025, PIB)"},{"l":"Ranchi, June 2025","t":"waterlogged roads caused long transport delays (notebook)"},{"l":"Anantapur (Andhra Pradesh), July 2025","t":"rain delayed transport, tomato supply fell and the price rose from [[₹45]] to [[₹60]] a kg (notebook)"}],"q":"What data and schemes address supply-chain gaps?"}]},{"id":"GS34-transport-constraints-agri-logistics","line":"GS3.4","part":"E-technology for farmers","name":"Transport Constraints (Agri-Logistics)","own":true,"cards":[{"k":"define","q":"What is agri-logistics, and what constrains it?","text":"Moving produce from farmgate to mandis, processors and consumers; heavily road-dependent, with severe cold-chain and rural connectivity gaps."},{"k":"for","q":"What are the gains from Transport Constraints (Agri-Logistics)?","rows":[{"l":"Cuts perishable spoilage during transit, directly saving farm output and rural incomes","t":""},{"l":"Connects surplus producing states to distant urban hubs, preventing local price crashes","t":"e.g. Kisan Rail moving Maharashtra produce to eastern India"},{"l":"Lowers freight costs per tonne-km by shifting bulk movement from expensive road trucks to rail and coastal shipping","t":""},{"l":"Preserves shelf life and quality of high-value horticulture, dairy, and marine produce through unbroken cold chains","t":""},{"l":"Unlocks export markets for landlocked farming regions via dedicated air and rail cargo links","t":"e.g. Krishi UDAN"}],"cue":"Fast, temperature-controlled, multimodal transport preserves perishable value and links surplus farms to distant deficit markets."},{"k":"against","q":"What are the problems with Transport Constraints (Agri-Logistics)?","rows":[{"l":"Transport bottlenecks cause [[≈30–40%]] of post-harvest loss, wasting [[≈₹92,000 crore]] a year","t":""},{"l":"Acute cold-chain deficit","t":"only [[≈4%]] of fruits move in reefer trucks, leaving an [[≈85%]] reefer shortfall (NCCD)."},{"l":"Over-dependence on costly road haulage ([[≈97%]] of fruits and vegetables go by road vs just [[1.9%]] by rail),making the farmgate-to-mandi haul expensive","t":""},{"l":"Lack of all-weather rural roads blocks produce","t":"especially vegetables—from reaching mandis during the monsoon."},{"l":"Congested main freight arteries, weak rural multimodal logistics, and 5-year reefer van permits with limited inter-state validity slow transit","t":""}],"cue":"Over-reliance on congested roads, missing rural connectivity, and a sharp shortage of refrigerated trucks cause heavy transit losses."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Build last-mile, all-weather rural roads linking villages to mandis and rural haats under PM Gram Sadak Yojana (PMGSY)","t":""},{"l":"Bridge the [[≈85%]] reefer shortfall with capital subsidies and credit support under MIDH and the Agriculture Infrastructure Fund","t":""},{"l":"Scale dedicated perishable rail and air cargo routes like Kisan Rail and Krishi UDAN to cut road congestion and freight costs","t":""},{"l":"Replace restrictive 5-year permits with seamless all-India national permits for reefer vans to speed up inter-state movement","t":""},{"l":"Develop multimodal agri-logistics parks and rail-side cold storages along Dedicated Freight Corridorsunder PM Gati Shakti","t":""}],"cue":"Connect villages with all-weather roads, subsidize refrigerated fleets, and shift long-haul freight onto rail and multimodal corridors."}]},{"id":"GS34-data-marketing-of-agricul","line":"GS3.4","part":"Agricultural marketing","name":"Agricultural marketing: key data","own":true,"cards":[{"k":"data","title":"Numbers","q":"What are the key numbers?","rows":[{"l":"Agri exports","t":"India is the 2nd-largest agricultural producer by value but has only [[2.2%]] of global agri exports (ES 2025-26); agri exports fell [[≈8%]] in 2023-24, to [[≈$48.9 bn]] (Commerce Department)"}]},{"k":"data","title":"Government steps and committees","q":"Which government steps and committees apply?","rows":[{"l":"Credit Guarantee Scheme for e-NWR based pledge","t":"financing (Dec 2024, [[₹1,000 crore]] corpus): loans against electronic negotiable warehouse receipts from WDRA-registered warehouses, so farmers store and borrow instead of selling in distress; [[80–85%]] cover for small and marginal farmers; e-Kisan Upaj Nidhi portal (WDRA)"},{"l":"GI for agricultural products, Geographical Indications of","t":"Goods (Registration and Protection) Act, 1999: application → scrutiny → hearing → acceptance → publication in the GI Journal → opposition (within 3 months) → registration certificate (notebook)"}]}]},{"id":"GS34-e-nam","line":"GS3.4","part":"E-technology for farmers","name":"e-NAM","own":true,"cards":[{"k":"define","q":"What is meant by e-NAM?","text":"An online trading platform linking physical mandis for transparent price discovery."},{"k":"for","q":"What does e-NAM offer farmers?","rows":[{"l":"Connects farmers to pan-India buyers across [[1,522]] mandis ([[1.8 crore]] farmers, Dec 2025), ending local trader monopolies","t":""},{"l":"Ensures transparent price discovery through open online bidding and quality-based auctions","t":"e.g. turmeric and chilli trade in Telangana"},{"l":"Cuts middleman commissions and delays through direct online bank payments to farmers","t":"e.g. RTGS/NEFT and BHIM integration"},{"l":"Enables [[4,698]] FPOs (Dec 2025) to pool produce and trade at bulk scale directly from farm-gate collection centres","t":""},{"l":"Curbs distress sales by linking electronic warehouse receipts for post-harvest pledge loans","t":"e.g. e-NWR integration via WDRA"}],"cue":"Linking local mandis into one digital market breaks trader monopolies, widens buyer reach, and ensures fair, fast payments."},{"k":"against","q":"Why is e-NAM underused?","rows":[{"l":"Most deals remain local offline trades merely billed on the portal","t":"only [[≈15%]] of transactions are truly online."},{"l":"Missing quality-assaying labs, grading units, and e-connectivity at mandis stop distant buyers from bidding sight-unseen","t":"e.g. lack of rapid moisture/residue testing"},{"l":"Weak transport and cold-chain logistics make shipping produce to far-off buyers costly and risky (especially for perishables)","t":""},{"l":"Varying state APMC rules","t":"marketing being a State subject—block uniform single-point licenses and inter-state trade (e.g., differing state mandi levies)."},{"l":"Low digital literacy among farmers and resistance from traditional arhtiyas slow real online adoption","t":""}],"cue":"Without trusted quality checks, cold-chain logistics, and uniform state rules, online trading stays trapped inside local mandis."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Install automated quality-assaying and grading labs across mandis to build buyer trust (funded via the Agriculture Infrastructure Fund)","t":""},{"l":"Harmonize state APMC rules for single unified trading licenses and one-point mandi fees (per Model APLM Act 2017)","t":""},{"l":"Link FPO collection centres, rural haats (GrAMs), and ONDC directly to e-NAM for farm-gate institutional off-take","t":""},{"l":"Connect surplus and deficit mandis with dedicated cold-chain and rail freight links","t":"e.g. Kisan Rail and reefer subsidies"},{"l":"Run local-language digital helpdesks at mandis to transition farmers and traders from offline billing to live online bidding","t":""}],"cue":"Build trusted grading at mandis, align state licensing rules, and connect logistics so distant buyers can actually trade."},{"k":"data","q":"What schemes, data and examples back up e-NAM?","title":"Data","rows":[{"l":"ITC e-Choupal","t":"connects about [[4 million]] farmers (Agriculture notes)"}]},{"k":"data","q":"How far does e-NAM reach?","rows":[{"l":"Coverage (Dec 2025)","t":"[[1,522]] mandis, [[1.8 crore]] farmers and [[4,698]] FPOs"}]}]},{"id":"GS34-precision-agriculture","line":"GS3.4","part":"E-technology for farmers","name":"Precision Agriculture","own":true,"cards":[{"k":"define","q":"What is meant by precision agriculture?","text":"Using sensors, satellites, drones, AI/ML, and GIS to apply the right input at the right place and time—covering soil pH and nutrient-load mapping, crop monitoring, spraying, and forecasting."},{"k":"for","q":"What are the benefits of precision agriculture?","rows":[{"l":"Boosts crop yields and water efficiency through AI-assisted management (e.g., Baramati ‘Farm of the Future’","t":"ADT Baramati + Microsoft + Oxford—yielded [[104–150]] t/acre sugarcane, [[≈40%]] more yield with [[≈30%]] less water)."},{"l":"Cuts costs by [[≈40%]] and chemical use by [[30–60%]], while lifting yields [[20–30%]] and cutting the carbon footprint by [[≈25%]] via drones (adoption projected at [[6–7 lakh]] by 2030–31)","t":""},{"l":"Improves weather forecasts and crop advisories to cut farm losses","t":"e.g. Bharat-VISTAAR in Budget 2026-27 linking AgriStack, Bhashini, and ICAR; FASAL for space and ground-based output forecasts"},{"l":"Curbs fertilizer overuse and restores soil health via GIS mapping of soil pH and nutrient loads","t":"e.g. Soil Health Card integration"},{"l":"Speeds up crop insurance assessment and protects farmers from toxic manual spraying","t":"e.g. KISAN project using space tech and geo-information"}],"cue":"Targeted, data-driven farming boosts yields and farmer income while slashing water, chemical, and carbon waste."},{"k":"against","q":"What limits precision agriculture in India?","rows":[{"l":"Small, fragmented landholdings ([[86%]] of farmers own <[[2]] ha) make capital-heavy drones and sensors uneconomic for individual farmers","t":""},{"l":"High upfront purchase, maintenance, and repair costs of drones and sensors strain thin farm margins","t":""},{"l":"Low digital readiness and lack of technical training among farmers slow ground-level adoption","t":""},{"l":"Rural internet gaps hinder real-time data use, alongside unresolved data ownership and privacy risks under AgriStack","t":""},{"l":"Strict airspace rules, short drone battery life, and imported sensor costs limit local scaling","t":"e.g. DGCA drone certification norms"}],"cue":"Small farm sizes, high hardware costs, and weak rural digital infrastructure make precision tools unviable for individual smallholders."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Scale shared pay-per-use Custom Hiring Centres and women collectives to overcome small plot sizes","t":"e.g. Namo Drone Didi giving women’s SHGs [[80%]] subsidy up to [[₹8 lakh]], balance via AIF loans with [[3%]] interest subvention"},{"l":"Back agri-tech startups and low-cost indigenous hardware R&D to cut equipment costs","t":"e.g. [[₹750 crore]] AgriSURE fund"},{"l":"Expand multilingual AI advisories and Krishi Vigyan Kendra (KVK) field demos to bridge the skill gap","t":"e.g. Bharat-VISTAAR with Bhashini voice support"},{"l":"Strengthen rural broadband connectivity and enforce clear data-privacy safeguards for farmer records under AgriStack","t":""},{"l":"Simplify drone pilot licensing and link satellite-GIS data directly with crop insurance payouts","t":"e.g. KISAN and PMFBY integration"}],"cue":"Shared service models, targeted subsidies, and strong rural digital infrastructure make precision tech affordable for small farms."},{"k":"diagram","q":"Draw the diagram for Precision agriculture","g":{"dir":"LR","nodes":[["D","Drones and sensors"],["S","Soil and crop data"],["A","AgriStack and decision support"],["V","Advice - seed, water, fertiliser"],["Y","Lower cost, higher yield"]],"edges":[["D","S",""],["S","A",""],["A","V",""],["V","Y",""]]}},{"k":"data","q":"Which digital platforms support farmers?","t
