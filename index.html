rms (Income Effect),creating a U-shaped participation curve.","h":"Rules and institutions"},{"l":"Unpaid care & domestic burden","t":"nearly one-third of women in domestic duties are willing to work (NSSO 68th round), while care and domestic responsibilities hold back >[[55%]] of girls (ES [[2025–26]]).","h":"Equity and sustainability"}],"title":"Hurdles","cue":"STEM & skill deficit → Safety & mobility \"Pink Tax\" → Job-rich, wage-poor growth → The \"Missing Middle\" anomaly → Unpaid care & domestic burden."},{"k":"value","q":"How can female LFPR be raised?","rows":[{"l":"Scale the Lakhpati Didi framework","t":"Leverage the massive DAY-NRLM ecosystem (covering [[≈10 crore]] women)."},{"l":"Professionalise nursing and care work","src":"ES 2025-26","t":""},{"l":"Replicate the Kudumbashree model","t":""},{"l":"Gender-inclusive urban infrastructure","t":"Invest heavily in safe, subsidised and well-lit public transit systems."},{"l":"Break occupational segregation","t":"Targeted state scholarships and corporate hiring incentives to funnel young women into high-growth sectors: green energy, deep tech and advanced manufacturing."}],"title":"Your solutions"}]},{"id":"GS31-sm","line":"GS3.1","part":"Employment","name":"Skilling","own":true,"cards":[{"k":"define","q":"What is the skilling gap?","text":"The mismatch between the skills workers have and those employers need, leaving graduates jobless despite vacancies: a driver of structural unemployment.","ed":true},{"k":"list","q":"What are the core skilling schemes?","rows":[{"l":"PMKVY 4.0"},{"l":"NAPS 2.0 and NATS 2.0","t":"government reimburses [[25%]] of the apprentice stipend, up to [[₹1,500]] a month"},{"l":"PM Internship Scheme"},{"l":"PM Vishwakarma"},{"l":"ITI Upgradation"},{"l":"Jan Shikshan Sansthan"},{"l":"DAY-NRLM"},{"l":"Skill India Digital Hub"},{"l":"NEP 2020","t":"National Credit Framework, multiple entry-exit, SWAYAM Plus"}]},{"k":"against","q":"What holds skilling back?","rows":[{"h":"People and skills","l":"Skill mismatch, low employability","t":"youth are [[≈83%]] of the unemployed, [[65.7%]] of them educated; rote curricula; trainers lack industry exposure","src":"ILO–IHD 2024"},{"h":"Infrastructure","l":"Outdated ITIs","t":"obsolete machinery, weak digital labs, poor workshop upkeep"},{"h":"Markets","l":"Supply-driven training","t":"little employer co-design, MSME reluctance on apprenticeships, poor placement and wages"},{"h":"Rules and institutions","l":"Fragmented governance","t":"overlapping ministries, no unified labour market information system, weak oversight of Sector Skill Councils","src":"Sharada Prasad Committee, 2016"},{"h":"Equity and sustainability","l":"Stigma and AI divides","t":"vocational tracks carry less prestige; rural youth and women face access gaps; AI makes routine skills obsolete","src":"ES 2025-26"}],"cue":"Skill mismatch, low employability → Outdated ITIs → Supply-driven training → Fragmented governance → Stigma and AI divides."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Sharada Prasad Committee (2016) reforms","t":"fund on verified placement and wages; a real-time national LMIS; restructure NSDC and Sector Skill Councils"},{"l":"Two-track model, upgrade ITIs","t":"China’s two-track system through NEP 2020 and the National Credit Framework; hub-and-spoke ITI upgrades"},{"l":"Industry-led apprenticeships","t":"expand NAPS 2.0, NATS 2.0 and the PM Internship Scheme; co-fund MSME stipends"},{"l":"AI-resilient and green skills","t":"align PMKVY 4.0, SWAYAM Plus and SIDH with GenAI, semiconductors, renewables and care roles"},{"l":"Grassroots skilling","t":"link PM Vishwakarma, Jan Shikshan Sansthan and DAY-NRLM with credit and mobility for rural youth and women"}]},{"k":"data","q":"What are the skilling numbers?","title":"Numbers","rows":[{"l":"Educated unemployed","t":"Youth with secondary education or more were [[35.2%]] of the unemployed in 2000.","src":"ILO–IHD 2024"},{"l":"Skills","t":"[[21.2%]] of youth (15–29) informally trained; only [[≈1%]] of 14–18-year-olds institutionally skilled; e-Shram [[31 crore+]] registrations.","src":"ES 2025-26"}]}]},{"id":"GS31-lpe","line":"GS3.1","part":"Employment","name":"Low-productivity equilibrium","own":false,"cards":[{"k":"define","q":"What is a low-productivity equilibrium?","text":"A state where a firm or economy works harder but value added stays flat (Economic Survey, AI chapter).","ed":true},{"k":"list","q":"Why can AI lead to a low-productivity equilibrium?","rows":[{"l":"Verification cost","t":"checking AI output often takes more time than it saves"},{"l":"Content flood","t":"AI drives the cost of generating content near zero, flooding work with output that has to be checked"},{"l":"J-curve","t":"productivity often dips before it rises, e.g. bolting AI onto 20-year-old systems"}]}]},{"id":"GS31-emn","line":"GS3.1","part":"Employment","name":"Education–migration nexus","own":false,"cards":[{"k":"define","q":"What is the education–migration nexus?","text":"Students go abroad to study and stay to work, so part of the demographic dividend leaks away as brain drain (‘demographic dividend leakage’).","ed":true},{"k":"list","q":"What is the upside of the education–migration nexus?","rows":[{"l":"Remittances","t":"remittances shift from the Gulf to advanced economies, reflecting high-skilled migration (ES 2025-26)"}]}]},{"id":"GS31-meas","line":"GS3.1","part":"Employment","name":"Measurement of unemployment","own":true,"cards":[{"k":"define","q":"What is unemployment?","text":"Unemployment: a person of working age ([[15–59 years]]) who is willing and actively seeking work at the prevailing wage but cannot find gainful employment.","ed":true},{"k":"list","q":"How does the PLFS measure unemployment?","rows":[{"l":"Usual status","t":"principal + subsidiary activity over the past [[365 days]]"},{"l":"Current weekly status","t":"activity in the last week"},{"l":"Method","t":"sampling design → computer-assisted interviews → activities coded as per the national classification of occupations → weighted estimates"}]},{"k":"for","q":"Why are India's unemployment metrics useful?","rows":[{"l":"Captures the informal sector","t":""},{"l":"ILO-standard benchmarking","t":"CWS follows International Labour Organization guidelines."},{"l":"Distinguishes types of joblessness","t":""},{"l":"High-frequency indicator","t":"CWS catches sudden job losses; usual status averages them over a year."},{"l":"Targeted welfare interventions","t":""}],"title":"Why these metrics are useful","cue":"Two lenses on an ILO standard: they catch informal work, separate the types of joblessness, and flag shocks early for targeted welfare."},{"k":"against","q":"What are the flaws in how unemployment is measured?","rows":[{"l":"Statistical illusion of employment","t":"Under CWS, a person who works for just one hour in a whole week is officially counted as employed (e.g. the USA uses the working population ratio) (the USA uses the worker-population ratio)."},{"l":"Time, not income","t":"Measures hours worked, not earnings: job-rich, wage-poor."},{"l":"Unpaid family labour exaggeration","t":"Women in family work are classified as employed; NSSO: [[33%]] of women engaged in domestic duties are willing to work."},{"l":"Memory and recall bias","t":""},{"l":"Blind to job quality","t":"[[81%]] casual in India vs [[94%]] formal in the USA."}],"title":"Flaws in measurement","cue":"It counts hours, not lives: the bar is too low, income is ignored, unpaid work is counted, recall is shaky, and quality is invisible."},{"k":"value","q":"How can unemployment measurement improve, and what data goes with it?","rows":[{"l":"Income-elastic employment metrics","t":"Arvind Panagariya: cross-check time worked with minimum-wage thresholds."},{"l":"CMIE method","t":"Record activity status on the day before the interview."},{"l":"Merge PLFS with payroll data","t":"Instead of relying purely on household surveys, merge PLFS data with high-frequency payroll data (EPFO, ESIC)."},{"l":"Time-use surveys","t":"The Ministry of Statistics should regularly run time-use surveys (TUS) alongside PLFS to measure how much time women spend in unpaid care work."},{"l":"Quarterly tracking for rural areas","t":"PLFS gives quarterly data only for urban areas."},{"l":"CWS vs usual status (data)","t":"CWS gives a higher unemployment rate than usual status; PLFS also publishes monthly CWS estimates from 2025.","src":"ES 2025-26"}],"title":"Your solutions and data"}]},{"id":"GS31-puf","line":"GS3.1","part":"Employment","name":"Persistent unemployment factors","own":true,"cards":[{"k":"list","q":"Why does unemployment persist in India?","rows":[{"l":"Underdeveloped manufacturing","t":"Growth is not employment-elastic."},{"l":"Large informal, low-productivity sectors","t":"[[90%]] of the labour force informal; agriculture employs [[46%]]."},{"l":"Low unemployment, high underemployment","t":"Skill mismatch: only [[4.9%]] of youth have vocational training."},{"l":"Slow structural shift","t":"Services are [[55%]] of GDP but only [[30%]] of jobs."},{"l":"Low-productivity self-employment","t":"[[50%]] self-employed, earning under [[₹13k]] a month vs [[₹19k]] for regular salaried workers."},{"l":"Youth unemployment","t":""},{"l":"Slow urbanisation and poor job creation","t":""},{"l":"Digital economy creates few jobs","t":"Only [[14 million]] workers (2022-23)."}],"title":"Factors","cue":"Growth skipped the factory floor, so workers stay informal, underused, farm-bound, self-employed, young and jobless, and even the digital economy adds few jobs.","hook":"Factories · Informal · Under-used · Shift · Self-employed · Youth · Towns · Digital"},{"k":"value","q":"What data goes with persistent unemployment?","rows":[{"l":"Farm workforce share","t":"Expected to fall from [[45.8%]] (2022-23) to [[25%]] by 2047.","src":"ES 2023-24"},{"l":"Digital economy","t":"India is the third most digitalised economy, yet few jobs relative to output (State of India’s Digital Economy 2024).","src":"ICRIER/MeitY 2024"}],"title":"Data"}]},{"id":"GS31-jg","line":"GS3.1","part":"Employment","name":"Jobless growth and employment elasticity","own":false,"cards":[{"k":"define","q":"What are jobless growth and employment elasticity?","text":"Jobless growth: GDP rises without a matching rise in good jobs. Employment elasticity = % change in employment ÷ % change in output; the lower it is, the fewer jobs each point of growth creates. Employment-elastic growth = growth led by labour-intensive sectors."},{"k":"for","q":"Why has India's growth been jobless?","rows":[{"l":"Capital-intensive growth","t":"Total employment fell by [[≈9 million]] between 2011-12 and 2017-18.","src":"Mehrotra and Parida","fix":"PM Viksit Bharat Rozgar Yojana"},{"l":"Skill mismatch","t":"Youth are [[≈83%]] of the unemployed; [[65.7%]] of them are educated.","src":"ILO–IHD 2024","fix":"PMKVY 4.0, NAPS 2.0, Sharada Prasad Committee"},{"l":"Missing manufacturing","t":"A jump from farm to services: services [[≈55%]] of GDP but [[≈30%]] of jobs.","fix":"Labour-intensive manufacturing: textiles, leather, food processing, toys"},{"l":"Automation and AI","t":"The labour intensity of output is falling.","src":"ES 2025-26","fix":"Human-centric jobs: care, nursing, physiotherapy"},{"l":"Restrictive labour laws","t":"The old [[100-worker]] permission threshold kept firms small ('dwarf firms').","src":"ES 2018-19","fix":"Four Labour Codes raise it to [[300]]"},{"l":"Informalisation","t":"[[≈90%]] of workers informal; self-employed earn [[≈₹13–14k]] a month vs [[≈₹20–21k]] for salaried.","src":"PLFS"}],"title":"Growth has been jobless: causes","cue":"Growth went to machines and services instead of factories, workers lacked skills, and old laws kept firms small, so jobs stayed few and informal."},{"k":"against","q":"What shows growth is creating jobs?","rows":[{"l":"Rising job count","t":"[[47.5 crore]] (2017-18) → [[64.3 crore]] (2023-24).","src":"RBI KLEMS"},{"l":"Falling unemployment","t":"[[6.0%]] (2017-18) → [[3.2%]] (2023-24).","src":"PLFS"},{"l":"Higher female LFPR","t":"[[23.3%]] → [[41.7%]]."},{"l":"Platform jobs","t":"Gig workers [[7.7 million]] → [[≈2.4 crore]] by 2029-30.","src":"NITI Aayog"},{"l":"Formalisation signals","t":"Rising EPFO payroll additions."},{"l":"Balanced line","t":"Growth is not jobless but job-rich, wage-poor (see Job-rich, wage-poor growth)."}],"title":"Growth is creating jobs","cue":"More jobs, less unemployment, more women working, more gig work, more formal payrolls. Balanced line: growth is not jobless but job-rich, wage-poor."},{"k":"value","q":"Which data and schemes go with jobless growth?","rows":[{"l":"PLFS Annual Report 2025 (usual status, age 15+)","t":"LFPR [[59.3%]] (men [[79.1%]], women [[40.0%]]); unemployment rate [[3.1%]]; youth unemployment [[9.9%]]."},{"l":"Jobs added","t":"[[≈4.7 crore]] in 2023-24 alone: jobs are being added; the debate is about their quality.","src":"RBI KLEMS"},{"l":"Tourism and jobs","t":"Travel and tourism [[5.2%]] of GDP in FY24 (ES 2025-26), [[≈6.8%]] including indirect effects (WTTC). Budget 2026-27, tourism as a jobs driver (the ‘orange’ or creative economy): National Institute of Hospitality; upskilling 10,000 guides at 20 iconic sites; 15 archaeological sites to become experiential cultural destinations (e.g. Lothal, Dholavira, Rakhigarhi).","unlikely":true}],"title":"Data and schemes"},{"k":"diagram","q":"Draw the diagram for Jobless growth and employment elasticity","g":{"dir":"TD","nodes":[["C1","Capital-intensive growth"],["J","Low employment elasticity"],["C2","Restrictive labour laws"],["C3","Skill mismatch"],["C4","Low female LFPR"],["O","Job-poor growth"]],"edges":[["C1","J",""],["C2","J",""],["C3","J",""],["C4","J",""],["J","O",""]]}}]},{"id":"GS32-cash-transfers-conditional-vs-unconditio","line":"GS3.2","part":"","name":"Cash transfers (conditional vs unconditional)","own":true,"cards":[{"k":"define","text":"Conditional cash transfers pay households only when they meet conditions such as school attendance and immunisation (Brazil’s Bolsa Família); unconditional transfers pay without conditions.","q":"How do conditional and unconditional cash transfers differ?"},{"k":"data","q":"What does the Economic Survey say about cash transfers?","rows":[{"l":"ES 2025-26","t":"states’ reliance on unconditional cash transfers is a concern; the opportunity lies in rural employment programmes"}]}]},{"id":"GS32-regional-inequalities","line":"GS3.2","part":"","name":"Regional inequalities","own":true,"cards":[{"k":"define","text":"Uneven distribution of financial, political and human resources across states and regions, resulting in unequal access to economic opportunities.","q":"What is meant by regional inequalities?"},{"k":"list","q":"Why do regional disparities exist?","rows":[{"l":"Spatial concentration of growth"},{"l":"Unequal irrigation and infrastructure coverage"},{"l":"Fiscal capacity and devolution"}]}]},{"id":"GS32-careless-manpower","line":"GS3.2","part":"","name":"Careless manpower","own":true,"cards":[{"k":"define","text":"Manpower that is poorly utilised, resulting in low productivity, weak work culture and lack of accountability. Useless manpower: People who remain unemployed, underemployed or unemployable due to inadequate education and skills.","q":"What is meant by careless manpower?"}]},{"id":"GS32-market-economy","line":"GS3.2","part":"","name":"Market economy","own":true,"cards":[{"k":"define","text":"A market economy is an economic system in which the production, pricing and distribution of goods and services are primarily determined by the forces of demand and supply, rather than direct government control.","q":"What is meant by market economy?"},{"k":"list","rows":[{"l":"Private enterprise","t":"operates through market forces"},{"l":"Public sector","t":"government runs public-sector enterprises"},{"l":"State intervention","t":"government regulates markets and intervenes through taxation, subsidies, welfare schemes and public investment"}],"q":"How do the market and the state share roles in India’s economy?"},{"k":"list","q":"What kind of economy does India follow?","rows":[{"l":"Mixed economy","t":"private enterprises operate through market forces; the government runs public-sector enterprises; it regulates markets and intervenes through taxation, subsidies, welfare schemes and public investment"}]}]},{"id":"GS32-monetized-eco","line":"GS3.2","part":"","name":"Monetised economy","own":true,"cards":[{"k":"define","text":"The part of the economy where goods, services and labour are exchanged for money, so the activity is priced, paid and counted in GDP.","q":"What is meant by monetised economy?","ed":true}]},{"id":"GS32-life-expectancy","line":"GS3.2","part":"","name":"Life expectancy","own":true,"cards":[{"k":"define","text":"The average number of years a person is expected to live, based on current mortality rates and demographic conditions.","q":"What is meant by life expectancy?"}]},{"id":"GS32-subsistence-economy","line":"GS3.2","part":"","name":"Subsistence economy","own":true,"cards":[{"k":"define","text":"An economy where production is primarily for one's own consumption rather than sale.","q":"What is meant by subsistence economy?"}]},{"id":"GS32-platform-economy","line":"GS3.2","part":"","name":"Platform economy","own":true,"cards":[{"k":"define","text":"Economic activities facilitated through digital platforms connecting buyers and sellers or workers.","q":"What is meant by platform economy?"}]},{"id":"GS32-shadow-economy","line":"GS3.2","part":"","name":"Shadow economy","own":true,"cards":[{"k":"define","text":"Economic activities deliberately concealed from authorities to avoid taxes, regulations or legal obligations.","q":"What is meant by shadow economy?"}]},{"id":"GS32-cash-economy","line":"GS3.2","part":"","name":"Cash economy","own":true,"cards":[{"k":"define","text":"Economic activities in which payments are predominantly made using physical currency.","q":"What is meant by cash economy?"}]},{"id":"GS32-parallel-economy","line":"GS3.2","part":"","name":"Parallel economy","own":true,"cards":[{"k":"define","text":"Economic activities operating outside or alongside the officially recorded economy; often associated with black money.","q":"What is meant by parallel economy?"}]},{"id":"GS32-command-economy","line":"GS3.2","part":"","name":"Command economy","own":true,"cards":[{"k":"define","text":"An economy in which the government centrally controls major production and resource allocation decisions.","q":"What is meant by command economy?"}]},{"id":"GS32-post-industrial-economy","line":"GS3.2","part":"","name":"Post-industrial economy","own":true,"cards":[{"k":"define","text":"An economy in which services, information and knowledge activities dominate over manufacturing.","q":"What is meant by post-industrial economy?"}]},{"id":"GS32-inclusive-growth","line":"GS3.2","part":"","name":"Inclusive growth","own":true,"cards":[{"k":"define","text":"Economic growth that is distributed fairly across society, creating opportunities for all while systematically reducing poverty, inequality, and regional disparities.","q":"What is inclusive growth?"},{"k":"list","q":"How has India pursued inclusive growth?","rows":[{"l":"Historical","t":"Green Revolution"},{"l":"Geographical","t":"PM Gram Sadak Yojana"},{"l":"Political","t":"Nari Shakti Vandan Adhiniyam"},{"l":"Governance","t":"National e-Governance Plan"},{"l":"Social justice","t":"VB-G RAM G"},{"l":"Economic","t":"equal market access via PM Mudra loans and PM Jan Dhan Yojana; agriculture as a pro-poor engine of growth"},{"l":"Environmental","t":"EIA: growth without environmental harm"}]},{"k":"for","rows":[{"l":"Virtuous cycle of demand-led growth","t":"when growth includes all, demand is multiplied (consumption-led aggregate demand)"},{"l":"Multidimensional poverty alleviation","t":"strategic welfare has cut extreme poverty to [[5.3%]] (World Bank 2025); NITI Aayog MPI fell sharply to [[11.3%]] by 2022-23"},{"l":"Demographic dividend realisation","t":"access to health and education turns a massive population into a skilled workforce"},{"l":"Socio-economic equilibrium","t":"bridging disparities prevents friction and keeps a stable environment that crowds in long-term foreign and domestic investment"},{"l":"Women-led development","t":"e.g. SHE-Marts"}],"q":"Why does inclusive growth matter for India?","cue":"Demand multiplies → poverty falls → people become workforce → society stays stable → women lead."},{"k":"against","rows":[{"l":"Access barriers","t":"financial, market access, knowledge, education","h":"Finance"},{"l":"Human capital gaps","t":"India ranks 130th out of 193 countries in the Human Development Index (HDI), with an HDI value of 0.685","h":"People and skills"},{"l":"Jobless growth","h":"Markets","t":""},{"l":"Wealth concentration paradox","t":"despite high GDP growth, structural inequality is widening: the World Inequality Report 2026 flags a ‘Billionaire Raj’, with the top [[1%]] holding [[≈40%]] of national wealth; this also blocks trickle-down","h":"Equity and sustainability"},{"l":"Agrarian distress","t":"low value fuels the urban-rural divide (spatial inequality)","h":"Equity and sustainability"},{"l":"Social exclusion","t":"caste-based: 55,685 crimes against Scheduled Castes registered in 2024 (NCRB)","h":"Equity and sustainability"}],"q":"What stands in the way of inclusive growth?","cue":"Access barriers → Human capital gaps → Jobless growth → Wealth concentration paradox → Agrarian distress → Social exclusion."},{"k":"value","rows":[{"l":"Expanding the universal safety net","t":"beyond food security; social-sector spending India [[2.8%]] vs Finland [[31%]]"},{"l":"Technology-led democratisation","t":"e-Sanjeevani (crossed [[50 crore]] teleconsultations in 2026) and DIKSHA democratise access to elite healthcare"},{"l":"Universal basic services","t":"Capability Approach – Amartya Sen"},{"l":"Inclusive-by-design infrastructure","t":"equitable policies and their implementation; progressive, inclusive institutional design and fair taxation (taxes like Ram Rajya)"},{"l":"Progressive fiscal devolution","t":"to overcome the [[30%]] loss in India’s Inequality-adjusted HDI (IHDI), ring-fencing funds to meet the [[6%]] education and [[2.5%]] health GDP mandates"},{"l":"Nobel 2024 (Acemoglu, Johnson, Robinson)","t":"inclusive institutions secure property rights, rule of law and broad opportunity; extractive institutions concentrate power and rents in a narrow elite and stifle innovation"}],"q":"How can India make growth inclusive?","cue":"Safety net → technology → basic services → design → devolution: protect, reach, provide, build, fund."},{"k":"data","rows":[{"l":"Social services expenditure","t":"[[7.9%]] of GDP (FY26 BE, ES 2025-26)"},{"l":"States carry most social spending","t":"social-sector expenditure [[8.2%]] of GDP, [[≈47%]] of their total spending (RBI, state budgets 2025-26 BE)"},{"l":"Spending against targets","t":"education [[≈4.1%]] of GDP; government health [[≈1.8–1.9%]] of GDP (Notebook 2)"},{"l":"World Inequality Report 2026","t":"top [[10%]] hold [[≈65%]] of national wealth; top [[10%]] earn [[58%]] of national income, top [[1%]] [[≈22.6%]], bottom [[50%]] [[≈15%]]; inequality at or above British Raj-era levels (‘Billionaire Raj’) (Notebook 2)"}],"q":"What data show how inclusive India’s growth is?"},{"k":"data","rows":[{"l":"SDG 5","t":"gender inequality and SDG 10 : Reduce inequality"},{"l":"Rural development","t":"PMAY-G target [[5.0 crore]] pucca houses; SMILE (rehabilitation for transgender persons and beggars); DAY-NRLM; PMGSY (ES 2025-26)"},{"l":"From the diagram","t":"Companies CSR"}],"q":"What data show how inclusive India’s growth is?"},{"k":"diagram","q":"Draw the diagram for Inclusive growth","g":{"dir":"TD","nodes":[["G","Inclusive growth"],["J","Jobs and wages"],["H","Human capital - health, education"],["F","Financial inclusion"],["S","Social protection"],["R","Regional balance"],["C","Companies CSR"]],"edges":[["G","J",""],["G","H",""],["G","F",""],["G","S",""],["G","R",""],["G","C",""]]}}]},{"id":"GS32-financial-inclusion","line":"GS3.2","part":"","name":"Financial inclusion","own":true,"cards":[{"k":"define","text":"Affordable access for all, especially the poor, rural households and women, to formal financial services: accounts, credit, insurance, pensions and payments.","q":"What is meant by financial inclusion?","ed":true},{"k":"for","rows":[{"l":"Breaking the poverty trap","t":""},{"l":"Domestic Resource Mobilization","t":"Jan Dhan accounts ([[59.1 crore]] by Aug 2026) brought [[₹3.2 lakh crore]] of idle cash into the formal banking system,"},{"l":"Targeted Welfare Delivery via DBT and is anti-leakage mechanism","t":""},{"l":"Credit Democratization","t":"Schemes like PM SVANidhi and PM MUDRA provide microfinance to women ([[95%]]) and to rural borrowers ([[80%]]) (ES 2025-26)"},{"l":"Risk cover","t":"PMJJBY, PMSBY, Sampoorna Bima Gram Yojana (India Post rural postal life insurance); financial shock-absorber for low-income families, preventing them from falling back into extreme poverty"},{"l":"Leak-proof welfare","t":"accounts let DBT reach beneficiaries directly"},{"l":"Women’s agency","t":"own accounts and credit raise bargaining power so Women-Led Development"}],"q":"Why does financial inclusion matter?","cue":"Escape poverty → mobilise savings → deliver welfare → democratise credit → insure risk → stop leaks → empower women."},{"k":"against","rows":[{"l":"Over-indebtedness","t":"easy micro-credit to women and rural borrowers can turn into debt traps","h":"Finance"},{"l":"Credit asymmetry (missing middle)","t":"banks lend readily to large corporates or micro-borrowers, but growing MSMEs struggle with stringent collateral for expansion loans","h":"Finance"},{"l":"Literacy gaps","t":"low financial and digital literacy among the newly included","h":"People and skills"},{"l":"Last-mile connectivity","t":"thin branch and network presence in remote areas","h":"Infrastructure"},{"l":"Account dormancy","t":"despite high account penetration ([[89%]] of adults by 2021), millions of Jan Dhan accounts remain dormant","h":"Markets"},{"l":"Digital divide and cyber-fraud","t":"exclusion of those without phones, and the risk of online fraud","h":"Technology"},{"l":"Workers and women left out","t":"credit-linked livelihoods without enterprise ownership; also women lack collateral required for big loans","h":"Equity and sustainability"}],"q":"What limits financial inclusion?","cue":"Over-indebtedness → Credit asymmetry → Literacy gaps → Last-mile connectivity → Account dormancy → Digital divide and cyber-fraud → Workers and women left out."},{"k":"value","rows":[{"l":"Strengthening Last-Mile Banking","t":""},{"l":"Deep financial integration","t":"policy must shift from merely opening accounts to promoting active use of credit"},{"l":"Cash-Flow-Based Lending","t":"Use consent-based digital transaction records, including UPI and GST data, to assess the repayment capacity of small businesses lacking conventional collateral."},{"l":"Strengthening the Bank Mitra Framework","t":"Upgrade Business Correspondents with better commissions, portable biometric devices, and micro-ATMs to execute seamless, fraud-proof banking in completely unbanked villages."},{"l":"Expanding Micro-Insurance Penetration","t":"Aggressively promote and bundle the Sampoorna Bima Gram Yojana (India Post)"},{"l":"Promoting Women's Enterprise Ownership","t":"Leverage Budget 2026-27 frameworks like SHE-Marts (Self-Help Entrepreneur Marts) to help female SHG member"},{"l":"5A framework","t":"Available, Accessible, Affordable, Awareness-driven and Appropriate"}],"q":"How can financial inclusion go deeper?","cue":"Reach the last mile → use the account → lend on cash flow → pay the Bank Mitra → insure → let women own."},{"k":"data","rows":[{"l":"RBI Financial Inclusion Index","t":"67 (March 2025), up from 53.9 (2017) (Notebook 2)"},{"l":"Budget 2026-27, gender","t":"SHE-Marts (Self-Help Entrepreneur Marts): community-owned retail outlets that help women in SHGs move from credit-linked livelihoods to owning enterprises; builds on Lakhpati Didi"}],"q":"What data and examples back up Financial inclusion?"},{"k":"diagram","q":"Draw the diagram for Financial inclusion","g":{"dir":"LR","nodes":[["J","Jan Dhan account"],["A","Aadhaar link"],["M","Mobile"],["D","DBT"],["C","Credit, insurance, pension"]],"edges":[["J","A",""],["A","M",""],["M","D",""],["D","C",""]]}}]},{"id":"GS32-care-economy","line":"GS3.2","part":"","name":"Care economy","own":true,"cards":[{"k":"define","text":"The economic activities involving paid and unpaid care work, such as childcare, elderly care, healthcare and domestic work, that sustain households and society.","q":"What is meant by care economy?"},{"k":"for","rows":[{"l":"Unlocking female workforce","t":""},{"l":"Massive job creation engine","t":"investing [[2%]] of GDP → [[11 million]] jobs (ILO)"},{"l":"Macroeconomic expansion","t":"potential to add [[60%]] to GDP"},{"l":"Silver economy–care economy linkage","t":"[[≈347 million]] elderly by 2050"}],"q":"Why should India invest in the care economy?","cue":"Free women’s time → create jobs → expand GDP → serve the ageing."},{"k":"against","rows":[{"l":"Fiscal neglect","t":"India spends less than [[1%]] of GDP on the care economy","h":"Finance"},{"l":"ASHA reliance","t":"heavy reliance on ASHA workers, but no fixed pay","h":"Rules and institutions"},{"l":"Invisible and unpaid labour","t":"Time Use Survey: women spend 3.5 hours more on unpaid work","h":"Equity and sustainability"},{"l":"The care penalty","t":"women often sacrifice education, career progression and paid working hours to fulfil family-care responsibilities","h":"Equity and sustainability"}],"q":"Why is care work undervalued in India?","cue":"Fiscal neglect → ASHA reliance → Invisible and unpaid labour → The care penalty."},{"k":"value","rows":[{"l":"ILO’s 5 R","t":"Recognise, Reduce and Redistribute unpaid work; Reward and Represent paid care workers"},{"l":"Caregiver training (Budget 2026-27)","t":"train [[1.5 lakh]] multiskilled caregivers to formalise care work and boost women’s employment"},{"l":"Stiglitz-Sen-Fitoussi Commission","t":"include unpaid work in statistics using Time Use Survey data"},{"l":"Democratised care","t":"hybrid care infrastructure: private workplace crèches + public rural care centres"},{"l":"Rebalancing the care diamond","t":"gender-neutral care policies: paternity leave and carers’ allowances redistribute unpaid care among men, markets and the State"}],"q":"How can India build its care economy?","cue":"5 R frame → train carers → count unpaid work → build crèches → share care."},{"k":"data","rows":[{"l":"Digital inclusion","t":"e-Sanjeevani (telemedicine on India’s digital public infrastructure)"},{"l":"From the diagram","t":"Low female LFPR"}],"q":"What data and examples back up Care economy?"},{"k":"diagram","q":"Draw the care economy cycle diagram (Care economy)","g":{"dir":"LR","nodes":[["U","Unpaid care burden"],["L","Low female LFPR"],["G","Lost output"],["I","Invest in care - creches, care workers"],["W","More women in paid work"]],"edges":[["U","L",""],["L","G",""],["G","I",""],["I","W",""]]}}]},{"id":"GS32-silver-economy","line":"GS3.2","part":"","name":"Silver economy","own":true,"cards":[{"k":"define","text":"The production and consumption of goods and services catering to the needs of the elderly (60+), including healthcare, housing, leisure and financial services.","q":"What is meant by silver economy?"},{"k":"for","rows":[{"l":"Second Demographic Dividend","t":"Unlocking Experience: Retired professionals can contribute through consultancy, mentoring and part-time work."},{"l":"Emerging Consumer Market","t":"New Consumer Market: Elderly demand for healthcare, wellness, assisted living and insurance creates new business opportunities."},{"l":"Labour-Intensive Growth","t":"Care-Sector Employment: Rising demand for elderly care creates jobs for nurses, caregivers and healthcare professionals."},{"l":"Financial Deepening","t":"Financial Sector Expansion: Greater demand for pensions, annuities, health insurance and reverse mortgages deepens financial markets."},{"l":"Silver Innovation","t":"Age-Tech Innovation: Ageing-related needs encourage innovation in medical devices, wearables, assistive technology and smart homes."}],"q":"How can an ageing India become an economic opportunity?","cue":"Experience → demand → jobs → finance → innovation."},{"k":"against","rows":[{"l":"Old-Age Income Insecurity","t":"Pension Insecurity: Informal workers often retire without pensions or provident fund savings, limiting their purchasing power.","h":"Finance"},{"l":"Skill Deficit","t":"Caregiver Shortage: India lacks sufficient trained geriatric doctors, nurses and professional caregivers.","h":"People and skills"},{"l":"Universal Accessibility Gap","t":"Inaccessible Infrastructure: Poorly designed footpaths, public transport and buildings restrict elderly mobility.","h":"Infrastructure"},{"l":"Digital Divide","t":"Digital Exclusion: Online banking, telemedicine and digital government services exclude elderly citizens with low digital literacy.","h":"Technology"},{"l":"Gendered Poverty","t":"Feminisation of Old-Age Poverty: Widows often face greater financial insecurity due to lower lifetime earnings, limited asset ownership and inadequate pensions.","h":"Equity and sustainability"}],"q":"What holds back India’s silver economy?","cue":"No pension → no carers → no access → no digital → widows poorest."},{"k":"value","rows":[{"l":"SAGE Initiative","t":"Scale the Ministry of Social Justice's Seniorcare Ageing Growth Engine to support startups developing elderly-care products and services."},{"l":"Reverse Mortgages","t":"Enable asset-rich but income-poor elderly homeowners to convert property value into regular income without selling their homes."},{"l":"Integrated Geriatric Healthcare","t":"Expand dedicated elderly-care services under the National Programme for Health Care of the Elderly (NPHCE)."},{"l":"Silver Gig Economy","t":"Create flexible consultancy and mentoring opportunities for retired professionals to utilise their experience."},{"l":"Universal Design","t":"Enforce elderly-friendly accessibility in public transport, housing and urban infrastructure."},{"l":"Mains-ready line","t":"India must transform population ageing from a welfare burden into an economic opportunity by building a pension-secure, accessible and employment-generating Silver Economy."}],"q":"How can India build its silver economy?"}]},{"id":"GS32-hdi-and-ihdi","line":"GS3.2","part":"","name":"HDI and IHDI","own":true,"cards":[{"k":"define","text":"HDI (UNDP) measures average achievement in health, education and income; IHDI adjusts it for inequality, so the gap between them shows the loss to inequality.","q":"What do HDI and IHDI measure?","ed":true},{"k":"list","q":"What indicators make up the HDI?","rows":[{"l":"Health","t":"life expectancy at birth"},{"l":"Education","t":"mean and expected years of schooling"},{"l":"Income","t":"GNI per capita (PPP)"}]},{"k":"for","rows":[{"l":"Multidimensional equity","t":"captures inequality in health, education and income, unlike the income-only Gini"},{"l":"Captures distribution","t":"India’s HDI 0.685 falls to 0.475 ([[30.7%]] loss, UNDP HDR 2025)"},{"l":"Shows where the loss sits","t":"dimension-wise loss tells whether health, education or income is most unequal, so schemes can be targeted"},{"l":"Comprehensive policy","t":"supports comprehensive, stakeholder-inclusive policy"},{"l":"Matches the idea of inclusiveness","t":"growth counts only if gains are shared"}],"q":"Why is IHDI a better measure than HDI?","cue":"Multidimensional equity → Captures distribution → Shows where the loss sits → Comprehensive policy → Matches the idea of inclusiveness."},{"k":"against","rows":[{"l":"Data gaps","t":"relies on household surveys that miss top incomes and wealth"},{"l":"Blind to gender (quality blindness)","t":"needs GDI and GII alongside"},{"l":"Blind to sustainability","t":"needs the planetary pressures-adjusted HDI"},{"l":"No regional or caste detail","fix":"State-level HDI and NITI Aayog MPI","t":""},{"l":"Ecological Blindness","t":""}],"q":"What do HDI and IHDI miss?","cue":"Missing data, gender, planet, region and ecology: each blind spot has a companion index."},{"k":"value","rows":[{"l":"Why the 30% drop","t":"spending misses the standards of [[6%]] of GDP on education and [[2.5%]] of GDP on public health"},{"l":"Metric Triangulation","t":"Combine IHDI with MPI to capture deprivations in sanitation, housing, electricity and nutrition."},{"l":"Sustainable Human Development","t":"Use PHDI to adjust human development for planetary pressures and environmental costs."},{"l":"Outcome-Based Measurement","t":"Adjust education and health indicators using PARAKH learning outcomes and healthcare quality indicators."},{"l":"High-Frequency Data Integration","t":"Use DPI and administrative datasets to improve timely, disaggregated inequality measurement."},{"l":"Human Capital Ring-Fencing","t":"Prioritise health and education spending in backward regions to reduce the [[30.7%]] inequality-related development loss."}],"q":"How can India measure human development better?"},{"k":"data","rows":[{"l":"Higher education institutions","t":"≈51.5K (2014-15) to 70K (2025) (ES 2025-26)"},{"l":"Human capital (ES 2025-26)","t":"expected years of schooling 13.0 (NEP target 15); HDI education index 0.372; higher-education GER 29.5; MMR down [[86%]] since 1990 (world [[48%]]); under-5 mortality down [[78%]] (1990-2023); [[24%]] of women and [[23%]] of men overweight or obese"},{"l":"Education platforms","t":"NEP, PM POSHAN, PARAKH, DIKSHA (digital knowledge-sharing infrastructure), Atal Tinkering Labs, PM SHRI, ULLAS, Bhashini (ES 2025-26)"},{"l":"Budget 2026-27, education","t":"Ministry of Education allocation up [[≈8.3%]] to [[₹1.4 lakh crore]]; 5 university townships near major industrial and logistics corridors (each hosting several universities, research institutes, skill centres and housing); PM Research Chair (PMRC) [[₹200 crore]] to bring back researchers of Indian origin working abroad","unlikely":true}],"q":"What data show India’s human capital?"}]},{"id":"GS32-intra-and-inter-generational-equity","line":"GS3.2","part":"","name":"Intra- and inter-generational equity","own":true,"cards":[{"k":"list","rows":[{"l":"Intra-Generational Equity","t":"Fair distribution of resources and opportunities among present generations (across income, gender, caste and regions)."},{"l":"Inter-Generational Equity","t":"Meeting present needs without compromising future generations' ability to meet theirs (Brundtland Report, 1987)."}],"q":"What do intra- and inter-generational equity mean?"},{"k":"for","rows":[{"l":"The poor depend on natural capital","t":"forests, fisheries and groundwater; protecting them is pro-poor and also formalisaing people reduces their tendency to adopt exploitative sustainble practices"},{"l":"Education for climate action","t":"inclusive education links SDG 4 (quality education) with SDG 13 (climate action): an informed citizenry adopts green technologies and sustainable practices"},{"l":"Green jobs","t":"renewables, recycling and restoration are labour-intensive"},{"l":"Clean cooking and health","t":"PM Ujjwala cuts indoor pollution for women and pressure on forests"},{"l":"Decentralized Resource Autonomy","t":"Schemes like PM-KUSUM (solar pumps) provide immediate, inclusive energy and income security to current remote farmers"},{"l":"Climate justice","t":"CBDR-RC: those who emitted most should pay most"},{"l":"Lifestyle change","t":"Mission LiFE"}],"q":"How can inclusive growth and sustainability go together?","cue":"Nature feeds the poor → green work is job-rich → clean cooking heals → solar pumps pay → polluters pay → lifestyles change."},{"k":"against","rows":[{"l":"Fiscal burden on the future","t":"subsidies and borrowing today become debt tomorrow (Green Premium)"},{"l":"Coal jobs vs emissions","t":"energy access and coal-belt livelihoods vs climate goals","fix":"needs just transition (Just Transition Friction)"},{"l":"Infrastructure vs ecology","t":"rapidly building the physical infrastructure for present-day inclusive growth (PMAY-G housing, PMGSY rural roads) causes severe ecological destruction and deforestation in the short term"},{"l":"Technological apartheid","t":"developing nations need cheap, accessible technologies to industrialise and create jobs, but clean-tech is heavily patented"},{"l":"Equity vs sustainability","t":"denying industrial growth to poor nations to save the climate makes them pay for rich countries’ actions (common but differentiated responsibilities)"}],"q":"Why do inclusive growth and sustainability not always go together?","cue":"Debt for tomorrow → coal jobs today → concrete vs forest → patented clean-tech → poor pay for the rich."},{"k":"value","rows":[{"l":"Natural capital accounting","t":"the Ministry of Statistics must fully integrate ‘Green GDP’"},{"l":"Financing the just transition","t":"reskill workers displaced from the fossil-fuel economy into the renewable sector"},{"l":"Aggressive circular economy adoption","t":""},{"l":"Climate finance and technology transfer","t":"at the UNFCCC, India must push for actual climate finance and technology transfers"},{"l":"Targeted subsidies for the green premium","t":""}],"q":"How can India reconcile equity today with equity tomorrow?"}]},{"id":"GS32-csr","line":"GS3.2","part":"","name":"CSR","own":true,"cards":[{"k":"define","text":"A legal requirement under Section 135 of the Companies Act, 2013, for eligible companies to spend at least [[2%]] of their average net profits on social development activities.","q":"What is the CSR mandate?"},{"k":"for","rows":[{"l":"Developmental Resource Mobilisation","t":"Mobilising Private Capital: Generated approximately [[₹34,900 crore]] in CSR spending in FY24, supplementing public welfare expenditure."},{"l":"Private Sector Efficiency","t":"Faster Welfare Delivery: Corporate expertise and project management improve the execution of schools, hospitals and local infrastructure."},{"l":"Capital Ring-Fencing","t":"Preventing Fund Diversion: Unspent CSR funds must be transferred to designated accounts or Schedule VII funds, preventing companies from retaining them as ordinary profits."},{"l":"Responsible Corporate Governance","t":"ESG Integration: Encourages companies to consider social and environmental responsibilities alongside profits."},{"l":"Public-Private Development Partnership","t":"Supplementing State Capacity: Funds local development projects without placing the entire burden on government budgets."}],"q":"How does mandatory CSR help development?","cue":"Money → efficiency → ring-fencing → governance → partnership."},{"k":"against","rows":[{"l":"Capital Fragmentation","t":"Fragmented Spending: Small, isolated projects replace long-term investment in schools, healthcare and infrastructure.","h":"Finance"},{"l":"Implementation Gap","t":"Developmental Capacity Deficit: Companies often lack grassroots expertise to identify and address complex social problems.","h":"People and skills"},{"l":"Tick-Box Compliance","t":"Compliance over Commitment: Companies may treat CSR as a mandatory accounting exercise rather than genuine social responsibility.","h":"Rules and institutions"},{"l":"Institutional Opacity","t":"Conflict of Interest: Funding through promoter-linked trusts and organisations can create risks of favouritism and weak accountability.","h":"Rules and institutions"},{"l":"Spatial Asymmetry","t":"Regional Inequality: CSR funds concentrate around industrial and corporate hubs, leaving backward districts relatively underserved.","h":"Equity and sustainability"}],"q":"Where does CSR fall short?","cue":"Capital Fragmentation → Implementation Gap → Tick-Box Compliance → Institutional Opacity → Spatial Asymmetry."},{"k":"value","rows":[{"l":"Spatial Equity","t":"Aspirational District Prioritisation: Incentivise greater CSR investment in backward districts to correct regional funding disparities."},{"l":"Economies of Scale","t":"CSR Fund Pooling: Combine corporate funds for large-scale hospitals, schools and skill centres instead of scattered micro-projects."},{"l":"Outcome-Based Accountability","t":"Social Impact Audits: Measure actual improvements in literacy, healthcare and livelihoods rather than merely checking money spent."},{"l":"Fund Traceability","t":"National CSR Dashboard: Digitally track company spending, implementing agencies and project outcomes to prevent fund diversion."},{"l":"Developmental Convergence","t":"National Priority Alignment: Link CSR projects with local development needs and national goals under NEP, public health and skill development."},{"l":"Mains-ready line","t":"CSR must evolve from mandatory corporate expenditure into measurable social investment that complements government capacity and promotes geographically balanced development."}],"q":"How can CSR become real social investment?"},{"k":"data","rows":[{"l":"CSR","t":"≈27,000 companies spent in FY24; Maharashtra alone [[≈17%]], so CSR follows company headquarters rather than need; ≈5,700 companies spent less than prescribed (National CSR Portal, MCA)"}],"q":"What data and examples back up CSR?"},{"k":"data","q":"Which companies must spend on CSR?","rows":[{"l":"Applicability","t":"net worth [[₹500 crore]]+, turnover [[₹1,000 crore]]+ or net profit [[₹5 crore]]+"}]}]},{"id":"GS32-gini-coefficient","line":"GS3.2","part":"","name":"Gini coefficient","own":true,"cards":[{"k":"define","text":"A statistical indicator derived from the Lorenz Curve that mathematically quantifies economic inequality within a population, ranging from 0 (representing perfect equality) to 1 (representing absolute inequality where one person holds all wealth).","q":"What is meant by Gini coefficient?"},{"k":"for","rows":[{"l":"Comparative Benchmarking","t":"Single Inequality Benchmark: Converts complex income distribution into one number, allowing comparison across countries and over time."},{"l":"Fiscal Progressivity","t":"Auditing Welfare Impact: Comparing Gini before and after taxes and transfers helps assess whether government policies reduce inequality."},{"l":"Distributional Monitoring","t":"Tracking Inequality: Helps identify whether economic growth is benefiting all sections or concentrating gains among the rich."},{"l":"Disparity Mapping","t":"Multidimensional Economic Tracking: Separate income, wealth and consumption Ginis reveal where inequality is concentrated."},{"l":"Targeted Redistribution","t":"Evidence-Based Policymaking: State-wise and rural-urban Gini estimates help identify regions requiring greater welfare intervention."}],"q":"Why is the Gini coefficient useful?","cue":"Compare → audit taxes → monitor growth → map disparities → target."},{"k":"against","rows":[{"l":"Relative vs Absolute Inequality","t":"Absolute Poverty Blindspot: A country where everyone is equally poor can have a Gini of zero despite widespread poverty."},{"l":"Statistical Undercoverage","t":"Missing Rich: Household surveys may underreport the income and wealth of the ultra-rich, understating inequality."},{"l":"Asset Inequality","t":"Consumption-Wealth Disconnect: Consumption inequality can fall while wealth remains concentrated; India's top [[1%]] held [[40.1%]] of national wealth (2024 estimate). WID - World Inequality Database+1."},{"l":"Statistical Aggregation","t":"Distributional Blindspot: Two countries can have the same Gini despite very different income distributions."},{"l":"Multidimensional Blindness","t":"Quality and Social Exclusion: Does not capture inequalities in healthcare quality, education access, caste or gender discrimination."}],"q":"What does the Gini coefficient miss?","cue":"Equal poverty scores zero, the rich are missing, wealth hides, shapes differ, quality is invisible."},{"k":"value","rows":[{"l":"Tail-End Inequality","t":"Palma Ratio: Supplement Gini with the income share of the top [[10%]] divided by the bottom [[40%]] to expose extreme inequality."},{"l":"Theil index","t":"decomposes inequality between and within groups"},{"l":"Statistical Triangulation","t":"Survey-Tax Data Integration: Combine household surveys with CBDT tax data and national accounts to better capture top incomes."},{"l":"Asset-Based Inequality Tracking","t":"Separate Wealth Measurement: Develop stronger household asset surveys to capture wealth concentration beyond consumption inequality."},{"l":"Disaggregated Data","t":"Social Group Disaggregation: Publish state-wise, gender-wise and caste-wise inequality estimates to identify excluded populations."},{"l":"Outcome-Based Fiscal Evaluation","t":"Pre- and Post-Welfare Assessment: Compare inequality before and after taxation, subsidies and transfers, alongside poverty and MPI indicators."},{"l":"Important data for Mains","t":"MoSPI's HCES 2023–24 reported consumption Gini of 0.237 (rural) and 0.284 (urban), down from 0.266 and 0.314 respectively in 2022–23."},{"l":"Remember","t":"A falling Consumption Gini does not necessarily mean wealth inequality has fallen."}],"q":"How can inequality be measured better?"},{"k":"data","rows":[{"l":"Consumption Gini (World Bank)","t":"28.8 (2011-12) → 25.5 (2022-23); the government’s counter-argument, but consumption data understates inequality compared with income or wealth (Notebook 2)"}],"q":"What do India’s Gini numbers show?"}]},{"id":"GS32-poverty","line":"GS3.2","part":"","name":"Poverty and its measurement","own":true,"cards":[{"k":"define","q":"How is poverty measured?","text":"By a money line (consumption per head below a set level) or by multidimensional deprivation (NITI Aayog MPI: health, education, living standards)."},{"k":"for","q":"What shows poverty has fallen?","rows":[{"l":"Extreme poverty down","t":"World Bank (June 2025, new $3/day line at 2021 PPP): [[27.1%]] in 2011-12; [[≈75.2 million]] people in 2022-23; [[2.3%]] at the old $2.15 line","src":"Notebook 2"},{"l":"Consumption up","t":"average MPCE (HCES 2023-24): rural [[₹4,122]], urban [[₹6,996]]","src":"Notebook 2"},{"l":"State models","t":"Kerala’s poverty-eradication model","src":"ES 2025-26"}],"cue":"Extreme poverty down → Consumption up → State models."},{"k":"against","q":"How do the numbers hide deprivation?","rows":[{"l":"Measurement paradox","t":"‘Poverty lies in the eyes of the beholder’: [[≈81 crore]] people, about two-thirds of the population, get free foodgrains under NFSA/PMGKAY, yet official extreme poverty is in single digits"},{"l":"Hunger","t":"Global Hunger Index 2026: score [[24.1]] (‘serious’); child wasting [[≈19%]], the highest in South Asia; the government disputes the method"},{"l":"Informality and vulnerability","t":"high informal employment leaves millions just above the $3/day line, exposed to health or inflation shocks"}],"cue":"Measurement paradox → Hunger → Informality and vulnerability."}]},{"id":"GS32-capitalism","line":"GS3.2","part":"","name":"Capitalism (Marx’s critique)","own":true,"cards":[{"k":"define","text":"An economic system in which productive assets are privately owned, workers earn wages, and goods are produced mainly for profit.","q":"What is capitalism?","ed":true},{"k":"for","rows":[{"l":"Concentration of Economic Power","t":"Ownership of Production: A small capitalist class controls factories, machinery and other means of production, while workers depend on selling their labour to survive."},{"l":"Surplus Value Theory","t":"Surplus Value / Exploitation: Workers create more value than they receive as wages; capitalists appropriate the surplus as profit."},{"l":"Capital Accumulation","t":"Wealth Concentration: Profits are reinvested to expand private ownership, allowing capital to accumulate in fewer hands."},{"l":"Crisis of Overproduction","t":"Overproduction Crisis: Capitalists produce for profit, not solely for public needs; goods may remain unsold even when people lack purchasing power."},{"l":"Bourgeoisie vs Proletariat","t":"Class Conflict: The capitalist seeks higher profits while workers seek better wages and conditions, creating an inherent conflict of interests."}],"q":"What is Marx’s critique of capitalism?","cue":"Few own → workers create surplus → profits pile up → too much is made → classes clash."},{"k":"against","rows":[{"l":"Welfare Capitalism","t":"Adaptability of Capitalism: Labour laws, trade unions, social security and welfare states have helped capitalism address several of its historical contradictions."},{"l":"Creative Destruction","t":"Innovation and Productivity: Private profit motivates entrepreneurship, technological innovation and investment, which Marxist analysis may understate."},{"l":"The Transformation Problem","t":"Contested Labour Theory of Value: Market prices are influenced by demand, scarcity and other factors; labour alone remains a contested explanation of value."},{"l":"Systemic Resilience","t":"Collapse Not Inevitable: Despite recurring crises, capitalism has repeatedly adapted through regulation, welfare policies and institutional reforms."},{"l":"Historical Contingency","t":"Agency vs Determinism: Economic contradictions do not automatically produce communism; political organisation, class consciousness and historical circumstances matter."}],"q":"What are the counter-arguments to Marx’s critique?","cue":"Welfare tamed it → innovation drives it → value isn’t just labour → it adapts → history isn’t fixed."},{"k":"value","rows":[{"l":"Decent Work","t":"Strengthening Labour Rights: Ensure fair wages, collective bargaining and workplace security to balance employer-worker power."},{"l":"Distributive Justice","t":"Progressive Redistribution: Use progressive taxation and targeted transfers to reduce excessive wealth concentration."},{"l":"Social Protection Floor","t":"Universal Social Security: Provide healthcare, pensions and unemployment protection to reduce workers' economic vulnerability."},{"l":"Economic Democracy","t":"Democratising Ownership: Promote cooperatives, employee ownership and worker participation in management."},{"l":"Competitive Markets","t":"Regulating Market Concentration: Strengthen competition laws and prevent monopolies from exploiting workers and consumers."},{"l":"Conclusion","t":"Marx’s critique remains relevant for understanding inequality, labour exploitation and economic crises; however, the transition to communism is not an established historical inevitability"}],"q":"What is the way forward on capitalism’s problems?"}]},{"id":"GS32-data-x","line":"GS3.2","part":"","name":"Inclusive growth: key data","own":true,"cards":[{"k":"data","title":"Numbers","q":"What are the key numbers?","rows":[{"l":"Mental health","t":"treatment gap of [[70–92%]] (National Mental Health Survey, cited in ES 2025-26)","unlikely":true}]},{"k":"data","title":"Lines","q":"Which lines can you quote?","rows":[{"l":"Suicide rates are lower where in-person social connectedness is higher","t":"ES 2025-26","unlikely":true}]},{"k":"data","title":"Government steps and committees","q":"Which government steps and committees apply?","rows":[{"l":"Budget 2026-27, mental health","t":"the institutes at Ranchi and Tezpur to be upgraded to Regional Apex Institutions","unlikely":true}]}]},{"id":"GS33-capex","line":"GS3.3","part":"","name":"Government capex","own":true,"cards":[{"k":"define","text":"Government expenditure that creates durable physical or financial assets (infrastructure, machinery, equity investments) or reduces long-term macro-liabilities.","q":"What is government capital expenditure?"},{"k":"for","rows":[{"l":"Fiscal multiplier effect","t":"every [[₹1]] spent generates exponential output downstream: the prime engine for employment-elastic growth"},{"l":"Improving capital efficiency","t":"lowering ICOR"},{"l":"De-risking the private sector","t":""},{"l":"Core sector catalyst","t":"cement, steel, heavy electricals"},{"l":"Twin balance sheet advantage","t":"synergises with healthy bank and corporate balance sheets to wake up private investment"}],"q":"How does government capex crowd in private investment?","cue":"Multiply output → use capital better → take risk off firms → feed core sectors → ride clean balance sheets."},{"k":"against","rows":[{"l":"Crowding-out effect","t":"to finance massive infrastructure spending, the government borrows heavily by issuing G-Secs. This uses up a large share of domestic savings, leaving fewer funds for private businesses and pushing up borrowing costs, thereby discouraging private investment","h":"Finance"},{"l":"Consumption, not concrete, drives private capex","t":"if the budget skews to capex at the expense of revenue spending (welfare, rural transfers), rural consumption slumps; firms with idle capacity will not expand","h":"Markets"},{"l":"Import leakage","t":"high-tech capex (semiconductor parks, modern railways, solar) relies heavily on imported capital goods","h":"Technology"},{"l":"Regulatory cholesterol and execution lag","h":"Rules and institutions","t":""}],"q":"Why can government capex crowd out, or fail to crowd in, private investment?","cue":"Crowding-out effect → Consumption, not concrete, drives private capex → Import leakage → Regulatory cholesterol and execution lag."},{"k":"value","rows":[{"l":"Capex (Budget 2026-27)","t":"[[₹12.2 lakh crore]] (FY27 BE, [[≈3.1%]] of GDP), up [[11.5%]]; effective capex [[≈₹17.2 lakh crore]] ([[4.4%]] of GDP); roads, railways and defence take nearly two-thirds. Centre’s effective capex [[≈4%]] of GDP in FY25 against [[2.7%]] before the pandemic (ES 2025-26)"}],"q":"How big is the capex push?"}]},{"id":"GS33-output-based-budget","line":"GS3.3","part":"","name":"Output-outcome budgeting","own":true,"cards":[{"k":"define","text":"A budgeting approach that links government spending (outlays) to measurable physical deliverables (outputs) and actual developmental improvements (outcomes), ensuring that public expenditure is judged by results rather than merely money spent.","q":"What is output-outcome budgeting?"},{"k":"list","rows":[{"l":"Outlay","t":"money spent (₹)"},{"l":"Output","t":"e.g. school building constructed"},{"l":"Outcome","t":"e.g. improvement in students’ learning levels"},{"l":"India’s framework","t":"Output-Outcome Monitoring Framework (OOMF) 2026-27 covers 172 major Central Sector and Centrally Sponsored Schemes (outlay [[₹500 crore]] or more each); it replaces the earlier Outcome Budget nomenclature from FY 2026-27"}],"q":"How do outlay, output and outcome differ, and what is OOMF?","cue":"Money → thing built → life changed."},{"k":"for","rows":[{"l":"Results-oriented governance, greater accountability","t":"OOMF is presented alongside the Union Budget in Parliament, allowing scrutiny"},{"l":"Data-driven resource allocation","t":""},{"l":"Implementation efficiency","t":""},{"l":"Competitive federalism","t":"benchmarking pushes states and districts to improve delivery; e.g. the Aspirational Districts Programme uses convergence, collaboration and competition across 49 KPIs in five themes"}],"q":"Why budget for outcomes?","cue":"Account → allocate → implement → compete."},{"k":"against","rows":[{"l":"Capacity constraints","t":"shortages of trained staff, delayed fund releases and weak monitoring","h":"People and skills"},{"l":"Many factors drive outcomes","t":"developmental outcomes depend on multiple factors","h":"Rules and institutions"},{"l":"Poor data quality","h":"Rules and institutions","t":""},{"l":"Goodhart’s law","t":"focus on numerical targets rather than better service quality","h":"Rules and institutions"},{"l":"Coordination","t":"malnutrition and poverty need several ministries to work together","h":"Rules and institutions"}],"q":"What limits outcome budgeting?","cue":"Capacity constraints → Many factors drive outcomes → Poor data quality → Goodhart’s law → Coordination."},{"k":"value","rows":[{"l":"Third-party verification","t":"impact assessments and social audits through Gram Sabhas check departmental claims against ground reality"},{"l":"Better statistics","t":"Centre-State coordination, district-level data and interoperability (Rangarajan Commission: strengthen India’s statistical system)"},{"l":"Qualitative indicators","t":"combine numerical targets with indicators that capture gains for vulnerable sections"},{"l":"Scale the ADP model","t":"district dashboards that integrate schemes and fix responsibility on implementing agencies"},{"l":"Performance-based budget reallocation","t":""},{"l":"Mains takeaway","t":"output-outcome budgeting shifts public spending from a culture of fund utilisation to one of measurable developmental impact"}],"q":"How can outcome budgeting be made to work?","cue":"Verify → measure better → add quality → scale ADP → reward performance."}]},{"id":"GS33-frbm","line":"GS3.3","part":"","name":"FRBM","own":true,"cards":[{"k":"define","text":"A law that limits government borrowing and deficits to maintain fiscal discipline, control public debt and protect future generations from excessive debt.","q":"What is the FRBM framework?"},{"k":"for","rows":[{"l":"Fiscal Discipline","t":"Fiscal Consolidation: Central fiscal deficit fell from [[9.2%]] of GDP (FY21) to [[4.8%]] (FY25.)"},{"l":"Sovereign Creditworthiness","t":"Investor Confidence: S&P upgraded India's sovereign rating to BBB in August 2025, its first upgrade in [[18 years]]."},{"l":"Crowding-In","t":"Reducing Crowding Out: Lower government borrowing can leave more financial resources available for private investment."},{"l":"Debt Sustainability","t":"Intergenerational Equity: Prevents excessive borrowing today from becoming an unsustainable debt burden for future generations."},{"l":"Fiscal-Monetary Coordination","t":"Macroeconomic Stability: Fiscal discipline reduces inflationary pressure and supports monetary policy effectiveness."}],"q":"Why does fiscal discipline under FRBM matter?","cue":"Discipline → credit rating → crowding-in → sustainable debt → monetary help."},{"k":"against","rows":[{"l":"Debt Overhang","t":"High Public Debt: India's general government debt remains around [[81%]] of GDP (FY25), creating a substantial interest burden. International Monetary Fund.","h":"Finance"},{"l":"Pro-Cyclical Fiscal Policy","t":"Capex Compression: Rigid deficit targets can force expenditure cuts during downturns, affecting infrastructure investment.","h":"Infrastructure"},{"l":"Fiscal Opacity","t":"Off-Budget Borrowing: Borrowing through PSUs and government agencies can hide the actual fiscal burden.","h":"Rules and institutions"},{"l":"Limited Counter-Cyclical Space","t":"Rigid Fiscal Targets: Fixed deficit limits may restrict the government's ability to respond to recessions, pandemics and other economic shocks.","h":"Rules and institutions"},{"l":"Development-Fiscal Trade-off","t":"Welfare Expenditure Squeeze: Excessive consolidation can constrain spending on health, education and social protection.","h":"Equity and sustainability"}],"q":"What are the problems with rigid FRBM targets?","cue":"Debt Overhang → Pro-Cyclical Fiscal Policy → Fiscal Opacity → Limited Counter-Cyclical Space → Development-Fiscal Trade-off."},{"k":"value","rows":[{"l":"Fiscal Transparency","t":"Independent Fiscal Council: Implement the N.K. Singh Committee recommendation for independent auditing of fiscal projections, budget assumptions and off-budget liabilities."},{"l":"Debt Sustainability","t":"Debt-Anchored Framework: Follow Budget 2026–27's target of reducing Central Government debt to 50±[[1%]] of GDP by FY31 (from [[56.1%]] in FY26 RE.)"},{"l":"Counter-Cyclical Flexibility","t":"Escape Clause: Allow temporary fiscal relaxation during exceptional shocks while maintaining a credible medium-term consolidation path."},{"l":"Productive Borrowing","t":"Quality of Expenditure: Prioritise capital expenditure over unproductive revenue expenditure to make borrowing growth-generating."},{"l":"Fiscal Accountability","t":"Off-Budget Transparency: Bring PSU borrowings, government guarantees and contingent liabilities into comprehensive fiscal reporting."},{"l":"Mains-ready line","t":"Fiscal discipline must not mean indiscriminate expenditure cuts; it must ensure that public borrowing finances productive growth while keeping debt sustainable."},{"l":"Factual distinction","t":"The 50±[[1%]] debt target is the current Budget 2026–27 fiscal glide path, not the original statutory FRBM target. The N.K. Singh Committee's earlier recommendation was [[60%]] combined government debt ([[40%]] Centre + [[20%]] States)."}],"q":"How should India’s fiscal rules evolve?","cue":"Fiscal council → debt anchor → escape clause → capex first → off-budget in the open."},{"k":"data","title":"Centre’s deficits (% of GDP)","rows":[{"l":"Fiscal deficit","t":"FY25 (actual) 4.8; FY26 (RE) 4.4; FY27 (BE) 4.3"},{"l":"Revenue deficit","t":"FY25 1.7; FY26 1.5; FY27 1.5"},{"l":"Primary deficit","t":"FY25 1.4; FY26 0.8; FY27 0.7"},{"l":"Effective capex","t":"FY25 ≈4.0; FY26 3.9; FY27 4.4"}],"q":"What are the Centre’s deficit numbers for FY25–FY27?"},{"k":"data","rows":[{"l":"Rising public debt","t":"Union Government's public debt increased from [[₹119 lakh crore]] in FY22 ([[50.4%]] of GDP) to [[₹180.3 lakh crore]] in FY26 ([[52.1%]] of GDP, provisional)"},{"l":"Interest payments","t":"[[₹14.0 lakh crore]] (FY27 BE): [[≈ 40%]] of revenue receipts and [[26%]] of total expenditure; [[≈65%]] of revenue receipts go to committed spending – salaries, pensions and interest (PRS, Union Budget 2026-27 analysis)"},{"l":"N.K. Singh FRBM Review Committee (2017)","t":"debt-to-GDP as the primary anchor; fiscal deficit [[3%]] as the operational target; escape clause only for war, national security, national calamity, agricultural collapse or major structural reform, with deviation limited to [[0.5%]] of GDP; an independent Fiscal Council (Notebook 2)"},{"l":"From the diagram","t":"Anchor - debt 50 ± 1% of GDP by 2031"}],"q":"What do the debt and interest numbers show?"},{"k":"diagram","q":"Draw the diagram for FRBM","g":{"dir":"LR","nodes":[["D","Fiscal deficit"],["B","Borrowing"],["S","Debt stock"],["I","Interest burden"],["C","Less room for capex"],["A","Anchor - debt 50 ± 1% of GDP by 2031"]],"edges":[["D","B",""],["B","S",""],["S","I",""],["I","C",""],["S","A",""]]}}]},{"id":"GS33-state-finances","line":"GS3.3","part":"","name":"State finances","own":true,"cards":[{"k":"define","text":"State finances refer to the revenue receipts, expenditure, borrowing and debt management of State governments, determining their fiscal capacity to deliver public services, invest in infrastructure and promote inclusive development.","q":"What is meant by state finances?"},{"k":"list","rows":[{"l":"Fiscal deficit","t":"[[3.3%]] of GDP in FY25 (RBI, all States/UTs)"},{"l":"Outstanding liabilities","t":"[[28.1%]] of GDP (March 2024)"},{"l":"Borrowing limit","t":"normal net borrowing ceiling of [[3%]] of GSDP, plus [[0.5%]] linked to power-sector reforms"}],"q":"Where do state finances stand?"},{"k":"for","rows":[{"l":"Fiscal discipline","t":"states’ fiscal deficit stayed within the Centre’s prescribed borrowing ceiling"},{"l":"Central support for capex","t":"SASCI gives 50-year interest-free loans, supporting state capital expenditure ([[≈2.4%]] of GDP in FY25, ES 2025-26)"},{"l":"Peer benchmarking","t":"NITI Aayog’s Fiscal Health Index 2025 encourages competitive fiscal management"},{"l":"Buoyant shared tax base","t":"states receive [[41%]] of the divisible pool of Central taxes under the 16th Finance Commission (2026-31)"}],"q":"What is going right in state finances?","cue":"Within limits → Centre funds capex → peers compare → the tax pool is shared."},{"k":"against","rows":[{"l":"Revenue Expenditure, Weak Fiscal Quality","t":"ICRA's analysis of 17 states shows revenue deficit nearly doubled from [[₹1.1 lakh crore]] ([[0.4%]] of GSDP) in FY24 to [[₹2.1 lakh crore]] ([[0.7%]]) in FY25","h":"Finance"},{"l":"Fiscal Rigidity","t":"Salaries, pensions, interest payments and unconditional cash transfers constrain development expenditure.","h":"Finance"},{"l":"Capex Under-delivery","t":"Growth in capital expenditure slowed to around [[10%]] in FY25, reaching [[₹7.4 lakh crore]] (ICRA, 17 states)","h":"Infrastructure"},{"l":"Market Borrowing Dependence","t":"Greater reliance on market borrowings increases exposure to interest-rate fluctuations and debt-servicing costs","h":"Markets"},{"l":"Back-loaded Spending","t":"Delayed approvals, tendering and fund releases concentrate expenditure towards year-end","h":"Rules and institutions"},{"l":"States ‘need to buck up’","t":"their heavy borrowing raises the sovereign’s cost of borrowing (ES 2025-26) (avaible pool of finance is taken up); also Economic Survey 2025–26 flags that rising unconditional cash transfers and committed revenue expenditure are increasing states' revenue deficits and borrowing requirements, reducing fiscal space for productive capital investment. Further, central loans under SASCI, while protecting capital expenditure, may encourage states to reallocate their own resources towards revenue expenditure."}],"q":"What is weak in state finances?","cue":"Revenue Expenditure, Weak Fiscal Quality → Fiscal Rigidity → Capex Under-delivery → Market Borrowing Dependence → Back-loaded Spending → States ‘need to buck up’."},{"k":"value","rows":[{"l":"States’ finances (ICRA, 17 states, FY25)","t":"combined fiscal deficit [[₹9.5 lakh crore]] ([[3.2%]] of GSDP), up from [[₹7.8 lakh crore]] ([[2.9%]]); capex back-loaded – March 2025 alone [[₹2.2 lakh crore]] (+[[42%]] YoY), [[≈30%]] of the year’s capex; SASCI funded [[over 40%]] of incremental capex. FY26 (Crisil, 17 states): fiscal deficit [[3.2%]] of GSDP, revenue deficit [[0.8%]], capex [[2.2%]] of GSDP against [[2.9%]] budgeted; only 3 states met capex targets (Notebook 2)"},{"l":"States’ outstanding debt","t":"[[≈28%]] of GDP; market borrowings now finance [[≈75–80%]] of states’ fiscal deficit, up from [[≈17%]] in the mid-2000s (Notebook 2)"},{"l":"States’ heavy borrowing crowds out","t":"India’s 10-year yield is [[6.7%]] against Indonesia’s [[6.3%]] despite similar ratings (ES 2025-26)"},{"l":"16th Finance Commission (chair Arvind Panagariya; 2026-31)","t":"Cesses and surcharges sit outside the divisible pool, so states’ effective share of the Centre’s gross tax revenue is only [[≈30–33%]]. Grants to local bodies [[₹7.9 lakh crore]] for 2026-31; rural local bodies get [[₹4.4 lakh crore]] against [[₹2.4 lakh crore]] under the 15th FC (an [[84%]] increase). 15th FC grants for FY26: [[₹1,47,827 crore]] under Article 275 (ES 2025-26)"}],"q":"What data show strain in state finances?"}]},{"id":"GS33-revenue-vs-capital-budget","line":"GS3.3","part":"","name":"Revenue vs capital budget","own":true,"cards":[{"k":"define","text":"The Union Budget has two accounts. Revenue account: revenue receipts (tax and non-tax) and revenue expenditure (interest, salaries, subsidies). Capital account: capital receipts (borrowing, disinvestment) and capital expenditure (capex, loans).","q":"How is the Union Budget split into revenue and capital accounts?"},{"k":"diagram","q":"Draw the diagram for Revenue vs capital budget","g":{"dir":"TD","nodes":[["B","Union Budget"],["R","Revenue account"],["C","Capital account"],["R1","Rev Receipts - tax, non-tax"],["R2","Rev Expenditure - interest, salaries, subsidies"],["C1","Capital Receipts - borrowing, disinvestment"],["C2","Capex - capex, loans"]],"edges":[["B","R",""],["B","C",""],["R","R1",""],["R","R2",""],["C","C1",""],["C","C2",""]]}}]},{"id":"GS33-fiscal-health-index","line":"GS3.3","part":"","name":"Fiscal Health Index","own":true,"cards":[{"k":"define","text":"A composite index developed by NITI Aayog to assess and compare the fiscal health of States based on revenue mobilisation, expenditure quality, fiscal prudence and debt sustainability.","q":"What is meant by Fiscal Health Index?"},{"k":"list","rows":[{"l":"Quality of expenditure","t":""},{"l":"Revenue mobilisation","t":""},{"l":"Fiscal prudence","t":""},{"l":"Debt index","t":""},{"l":"Debt sustainability","t":""},{"l":"Ranking","t":"Odisha first (67.8); Punjab last (10.7)"}],"q":"What five sub-indices make up the Fiscal Health Index, and who ranks where?","cue":"Spend well, raise revenue, be prudent, owe little, sustain it."},{"k":"for","rows":[{"l":"Benchmarking, competitive federalism","t":"peer comparison creates pressure for better fiscal management; Odisha tops at 67.8"},{"l":"Quality of expenditure","t":"rewards capital outlay and developmental spending rather than merely higher spending"},{"l":"Early warning mechanism","t":"flags fiscal stress in Punjab, West Bengal, Kerala and Andhra Pradesh"},{"l":"Policy guidance","t":"helps states find weaknesses and adopt better practices; launched by the Chairman of the 16th Finance Commission"}],"q":"Why is the Fiscal Health Index useful?","cue":"Compare → reward quality → warn early → guide."},{"k":"against","rows":[{"l":"Lagged Data","t":"First edition uses FY23 data, limiting its usefulness for assessing current fiscal conditions"},{"l":"Structural Bias","t":"Mineral-rich States like Odisha and Chhattisgarh benefit from mining royalties and non-tax revenue"},{"l":"Measurement Blind Spots","t":"Off-budget borrowings, guarantees and contingent liabilities may not be fully captured in conventional budgetary indicators"},{"l":"Limited Incentive Mechanism","t":"Ranking creates peer pressure but carries no automatic financial reward or penalty."}],"q":"What are the limits of the Fiscal Health Index?","cue":"Old data, mineral bias, hidden debt, no carrot or stick."},{"k":"value","rows":[{"l":"Link Performance with Fiscal Incentives","t":"Consider linking verified fiscal improvements with SASCI loans and Finance Commission grants"},{"l":"Real-Time Fiscal Monitoring","t":"Update the index annually using timely CAG data"},{"l":"Comprehensive Debt Assessment","t":"Include off-budget borrowings, guarantees and contingent liabilities"},{"l":"Context-Sensitive Benchmarking","t":"Account for differences in resource endowments and economic structures across States"},{"l":"Outcome-Based Fiscal Governance","t":"Combine fiscal indicators with service-delivery and developmental outcomes."},{"l":"Mains takeaway","t":"The Fiscal Health Index promotes competitive federalism through fiscal benchmarking, but must evolve from a ranking exercise into an incentive-backed mechanism for sustainable State finances."},{"l":"Current-affairs update","t":"The second edition, FHI 2026, has since expanded coverage to include the 10 North-Eastern and Himalayan States, assessed separately from the 18 major States. Its analysis uses FY 2023–24 data."}],"q":"How can the Fiscal Health Index be improved?","cue":"Incentivise → update yearly → count hidden debt → adjust for context → add outcomes."},{"k":"data","rows":[{"l":"NITI Aayog Fiscal Health Index 2025","t":"Achievers: Odisha, Chhattisgarh, Goa, Jharkhand, Gujarat (high capital outlay, revenue surplus, low interest)"}],"q":"What data and examples back up Fiscal Health Index?"}]},{"id":"GS33-gender-budgeting","line":"GS3.3","part":"","name":"Gender budgeting","own":true,"cards":[{"k":"define","text":"A fiscal policy tool that examines government revenue and expenditure through a gender lens to address structural inequalities.","q":"What is meant by gender budgeting?"},{"k":"data","q":"What does the Gender Budget Statement 2026-27 show?","rows":[{"l":"Size","t":"[[₹5.0 lakh crore]], [[9.4%]] of the Union Budget, up [[11.6%]] over 2025-26"},{"l":"Coverage","t":"53 Ministries/Departments and 5 UTs report allocations"}]},{"k":"list","rows":[{"l":"Part A","t":"[[100%]] women-specific schemes – [[21.5%]]. (PIB)"},{"l":"Part B","t":"[[30–99%]] allocation for women – [[72.5%]]. (PIB)"},{"l":"Part C","t":"Below [[30%]] allocation for women – [[6.0%]]. (PIB)"}],"q":"How is the Gender Budget Statement split into Parts A, B and C?","cue":"A = all for women (21.5%), B = partly for women (72.5%), C = a little for women (6%)."},{"k":"for","rows":[{"l":"Women-Led Development, Human Capital Formation","t":""},{"l":"Care Economy","t":"Crèches (Palna) (childcare centres or day care), clean cooking fuel (Ujjwala) and piped water (JJM) reduce unpaid work and time poverty"},{"l":"Financial Inclusion","t":"SHGs and PM mudra promote women entrepreneurship (about [[60%]] of PMMY loan accounts belonged to women in FY 2024–25)"},{"l":"Fiscal Transparency","t":"Gender-wise allocation tracking enables parliamentary scrutiny and accountability."}],"q":"Why does gender budgeting matter?","cue":"Women lead → care load falls → credit flows → spending is tracked."},{"k":"against","rows":[{"l":"Weak Targeting and Measurement","t":"[[72.5%]] of GBS allocations fall under Part B, making it difficult to isolate actual benefits accruing to women","h":"Finance"},{"l":"Weak Institutional Capacity","t":"Gender Budgeting Cells lack adequate technical capacity and outcome-monitoring mechanisms","h":"People and skills"},{"l":"Gender-Neutral Infrastructure","t":"Insufficient attention to safe transport, street lighting and workplace sanitation","h":"Infrastructure"},{"l":"Ex-post Accounting","t":"Often treated as an accounting exercise rather than an ex-ante planning tool","h":"Rules and institutions"},{"l":"Uniform allocations overlook regional and socio-economic differences","h":"Equity and sustainability","t":""}],"q":"What weakens gender budgeting in India?","cue":"Weak Targeting and Measurement → Weak Institutional Capacity → Gender-Neutral Infrastructure → Ex-post Accounting → Uniform allocations overlook regional and socio-economic differences."},{"k":"value","rows":[{"l":"Ex-Ante Gender Impact Assessment","t":"Assess gender implications before finalising budget estimates"},{"l":"Benefit Incidence Analysis","t":"replace arbitrary Part B allocations with evidence-based expenditure tracking"},{"l":"Outcome-Based Accountability","t":"Integrate GBS with OOMF and track outcomes such as female employment, asset ownership and access to services"},{"l":"Strengthen Data Architecture","t":"Regular Time-Use Surveys, sex-disaggregated beneficiary data and stronger Gender Budgeting Cells"},{"l":"Fiscal Decentralisation","t":"Extend gender budgeting to states, municipalities and Panchayats"},{"l":"Gender-Responsive Infrastructure","t":"Prioritise safe urban mobility, childcare facilities, sanitation and women-led green enterprises."},{"l":"Mains takeaway","t":"Gender Budgeting transforms women from passive beneficiaries of welfare expenditure into active participants in economic growth and women-led development."}],"q":"How can gender budgeting be strengthened?","cue":"Assess before → track benefit → link outcomes → collect data → go local → build for women."},{"k":"diagram","q":"Draw the diagram for Gender budgeting","g":{"dir":"TD","nodes":[["G","Gender budget statement"],["A","Part A - 100% for women, ≈21.5%"],["B","Part B - 30 to 99% for women, ≈72.5%"],["C","Part C - under 30% for women"]],"edges":[["G","A",""],["G","B",""],["G","C",""]]}}]},{"id":"GS33-gst","line":"GS3.3","part":"","name":"GST","own":true,"cards":[{"k":"define","text":"A destination-based indirect tax levied on the supply of goods and services at each stage of the supply chain, with Input Tax Credit (ITC) on taxes paid on inputs, ensuring taxation primarily on value addition.","q":"What is meant by GST?"},{"k":"list","rows":[{"l":"Introduced","t":"1 July 2017 (101st Constitutional Amendment Act, 2016)."},{"l":"Constitutional Provision","t":"Article 279A – GST Council."},{"l":"GST 2.0 (September 2025)","t":"Rationalised the principal rate structure into [[5%]] and [[18%]] slabs, with a special [[40%]] rate for specified luxury and demerit goods. Press Information Bureau+1"},{"l":"Tax F
