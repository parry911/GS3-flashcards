s before renewal."},{"id":"s-67","topic":"GS33-output-based-budget","plain":"Once a target becomes the goal, it stops measuring well.","term":"Goodhart's law","meaning":"When a measure becomes a target, it stops being a good measure.","exam":"<b>Goodhart’s law</b> – outcome budgeting chases numerical targets rather than better service quality."},{"id":"s-68","topic":"GS33-gender-budgeting","plain":"Relabelling existing spending as gender spending.","term":"Ex-post accounting","meaning":"Counting existing spending after the fact instead of planning ahead.","exam":"<b>Ex-post accounting</b> – gender budgeting treated as an accounting exercise, not an ex-ante planning tool."},{"id":"s-69","topic":"GS33-gst","plain":"GST refunds stuck, so firms run short of cash.","term":"Working capital blockage","meaning":"Business cash locked up in delayed refunds and credits.","exam":"<b>Working capital blockage</b> – inverted duty structures and delayed ITC and export refunds under GST."},{"id":"s-70","topic":"GS33-tax-expenditure","plain":"Value lost because a tax distorts choices.","term":"Deadweight loss","meaning":"Value lost because a tax or incentive changes behaviour inefficiently.","exam":"<b>Deadweight loss</b> – revenue forgone even for investment that would have happened anyway."},{"id":"s-71","topic":"GS33-tax-expenditure","plain":"Tax breaks that help the rich more.","term":"Regressive benefits","meaning":"Benefits that go disproportionately to the better-off.","exam":"<b>Regressive benefits</b> – income-tax deductions favour higher-income taxpayers."},{"id":"s-72","topic":"GS33-ltcg-and-ddt","plain":"Investors hold assets to avoid tax on selling.","term":"Lock-in effect","meaning":"Investors hold assets to postpone tax on selling.","exam":"<b>Lock-in effect</b> – capital gains tax delays sales and reduces market liquidity."},{"id":"s-73","topic":"GS33-share-buyback-tax-budget-2026-27","plain":"Routing payouts the lowest-taxed way.","term":"Tax arbitrage","meaning":"Exploiting differences in tax rates to pay less.","exam":"<b>Tax arbitrage</b> – the Budget 2026-27 promoter levy stops promoters using buybacks to extract reserves cheaply."},{"id":"s-74","topic":"GS33-frbm","plain":"Keeping deficits within limits.","term":"Fiscal discipline","meaning":"Keeping deficits and debt within agreed limits.","exam":"<b>Fiscal discipline</b> – Centre’s fiscal deficit fell from [[9.2%]] of GDP (FY21) to [[4.8%]] (FY25)."},{"id":"s-75","topic":"GS33-frbm","plain":"The government being open about its accounts.","term":"Fiscal transparency","meaning":"Openness about public accounts and fiscal risks.","exam":"<b>Fiscal transparency</b> – independent fiscal council (N.K. Singh Committee)."},{"id":"s-76","topic":"GS34-millets-shree-anna","plain":"Farmers are stuck growing paddy and wheat.","term":"Paddy–wheat lock-in","meaning":"Farmers stuck with paddy and wheat because of assured procurement.","exam":"<b>Paddy–wheat lock-in</b> – FCI procured [[63.4 MT]] of wheat-rice in 2023-24 vs only [[1–3%]] of millets."},{"id":"s-77","topic":"GS34-watershed-development","plain":"Using canal water and groundwater together.","term":"Conjunctive water management","meaning":"Joint planning of surface water and groundwater.","exam":"<b>Conjunctive water management</b> – participatory water budgeting; regulate groundwater extraction."},{"id":"s-78","topic":"GS34-jevons-paradox-rebound-effect","plain":"Efficient irrigation ends up increasing water use.","term":"Jevons paradox (rebound effect)","meaning":"Efficiency gains raise total use by making a resource cheaper to use.","exam":"<b>Jevons paradox (rebound effect)</b> – cheaper water from efficient irrigation can encourage greater consumption and offset savings."},{"id":"s-79","topic":"GS34-gm-crops","plain":"Farmers' right to save and reuse their own seed.","term":"Seed sovereignty","meaning":"The rights of farmers to save, use and sell their own seed.","exam":"<b>Seed sovereignty</b> – patented GM seeds raise input costs → protect farmers’ rights under Section 39 of the PPV&FR Act, 2001."},{"id":"s-80","topic":"GS34-watershed-development","plain":"How many crops a year the same land grows.","term":"Cropping intensity","meaning":"How many crops are grown on the same land in a year.","exam":"<b>Cropping intensity</b> – watershed development enables multiple cropping and horticulture."},{"id":"s-81","topic":"GS34-intercropping-and-relay-cropping","plain":"Sowing the next crop before the current one is harvested.","term":"Relay cropping","meaning":"Sowing the next crop into a standing crop before harvest.","exam":"<b>Relay cropping</b> – raises land-equivalent productivity; 27,554 Custom Hiring Centres improve access to multi-crop implements."},{"id":"s-82","topic":"GS34-problems-of-agri-sector","plain":"Shifting to fruit, vegetables and livestock.","term":"High-value diversification","meaning":"Moving to horticulture, fisheries, poultry and allied activities.","exam":"<b>High-value diversification</b> – Ashok Dalwai Committee: shift to horticulture, fisheries, poultry, beekeeping and agroforestry."},{"id":"s-83","topic":"GS34-problems-of-agri-sector","plain":"Farmers getting a fair price.","term":"Remunerative price realisation","meaning":"Farmers getting a fair, rewarding price for produce.","exam":"<b>Remunerative price realisation</b> – Ashok Dalwai Committee: FPOs, e-NAM, warehousing and cold chains improve bargaining power."},{"id":"s-84","topic":"GS34-irrigation","plain":"Communities managing their groundwater.","term":"Aquifer governance","meaning":"Managing aquifers as shared, regulated resources.","exam":"<b>Aquifer governance</b> – Mihir Shah Committee: National Water Commission; delink groundwater access from land ownership."},{"id":"s-85","topic":"GS34-irrigation","plain":"Farmers running their own canal systems.","term":"Participatory irrigation management","meaning":"Farmers and water-user groups managing irrigation.","exam":"<b>Participatory irrigation management</b> – Odisha’s 39,000 Pani Panchayats; Punjab’s Warabandi."},{"id":"s-86","topic":"GS34-jal-shakti-abhiyan","plain":"Free power encourages over-pumping.","term":"Incentive distortion","meaning":"Incentives that push behaviour the wrong way.","exam":"<b>Incentive distortion</b> – free farm electricity makes groundwater pumping cheap and encourages over-extraction."},{"id":"s-87","topic":"GS34-jal-shakti-abhiyan","plain":"Structures built where the ground can't recharge.","term":"Hydrogeological mismatch","meaning":"Structures built without matching local aquifer conditions.","exam":"<b>Hydrogeological mismatch</b> – uniform templates without aquifer mapping → CGWB’s NAQUIM 2.0."},{"id":"s-88","topic":"GS34-jal-shakti-abhiyan","plain":"Trust and networks inside a village.","term":"Social capital","meaning":"Networks of trust and cooperation that enable collective action.","exam":"<b>Social capital</b> – Jal Sanchay Jan Bhagidari (September 2024) mobilises communities for water conservation."},{"id":"s-89","topic":"GS34-apmc-and-the-2020-farm-laws","plain":"Fewer middlemen between farmer and buyer.","term":"Lower intermediation cost","meaning":"Lower costs of middlemen between farmer and buyer.","exam":"<b>Lower intermediation cost</b> – APMC charges and commissions add [[≈15%]] to costs."},{"id":"s-90","topic":"GS34-apmc-and-the-2020-farm-laws","plain":"The market finding a fair price.","term":"Price discovery","meaning":"The market process that sets a fair price through competition.","exam":"<b>Price discovery</b> – e-NAM’s open online bidding; selling outside the mandi to the best bidder."},{"id":"s-91","topic":"GS34-apmc-and-the-2020-farm-laws","plain":"Centre legislating on a State subject (farm laws).","term":"Federal friction","meaning":"Tension between the Centre and states over powers.","exam":"<b>Federal friction</b> – ‘markets and fairs’ is a State subject (Entry 28, List II), so central farm laws were seen as overreach."},{"id":"s-92","topic":"GS35-farm-subsidies","plain":"Subsidies pull inputs to the wrong use.","term":"Inefficient resource allocation","meaning":"Subsidies pull resources into the wrong crops and uses.","exam":"<b>Inefficient resource allocation</b> – cheap power, fertiliser and assured procurement tilt cropping towards paddy and wheat."},{"id":"s-93","topic":"GS35-farm-subsidies","plain":"Too much urea, too little P and K.","term":"Skewed fertiliser use (NPK imbalance)","meaning":"Overuse of nitrogen relative to phosphorus and potassium.","exam":"<b>Skewed fertiliser use (NPK imbalance)</b> – [[≈141 kg]]/ha average; urea MRP fixed at [[₹242]] per 45-kg bag."},{"id":"s-94","topic":"GS35-pds","plain":"Eligible people left out.","term":"Exclusion error","meaning":"Eligible people wrongly left out of a scheme.","exam":"<b>Exclusion error</b> – [[≈10 crore]] people left out of NFSA because the Census is delayed."},{"id":"s-95","topic":"GS35-pds","plain":"Ration grain sold off in the open market.","term":"Leakage and diversion","meaning":"Subsidised grain leaking out of the system before reaching beneficiaries.","exam":"<b>Leakage and diversion</b> – PDS leakage fell from [[42%]] (2011-12) to [[22%]] (2022-23)."},{"id":"s-96","topic":"GS35-msp","plain":"MSP as a minimum price.","term":"Price floor","meaning":"A minimum price below which the state buys the crop.","exam":"<b>Price floor</b> – MSP lowers price risk; at least 1.5 times A2+FL cost since 2018-19."},{"id":"s-97","topic":"GS35-buffer-stock","plain":"FCI holding far more grain than it needs.","term":"Excess stock","meaning":"Stocks far above what the buffer norm requires.","exam":"<b>Excess stock</b> – central pool [[925.9 LMT]] (1 July 2026) against a norm of [[411.2 LMT]]."},{"id":"s-98","topic":"GS35-wto-agreement-on-agriculture-and-farm-su","plain":"WTO measures support against 1986-88 prices.","term":"Outdated benchmark (external reference price)","meaning":"WTO measures support against outdated 1986-88 prices.","exam":"<b>Outdated benchmark (external reference price)</b> – ignores inflation and inflates India’s measured support."},{"id":"s-99","topic":"GS35-wto-agreement-on-agriculture-and-farm-su","plain":"Support allowed without limit: 10% of production value.","term":"De minimis","meaning":"Support allowed without reduction up to a small share of output value.","exam":"<b>De minimis</b> – 10% of production value for developing countries; India’s rice support hit [[≈11.9%]] in 2024-25."},{"id":"s-100","topic":"GS35-wto-agreement-on-agriculture-and-farm-su","plain":"WTO protection for India's food stockholding.","term":"Peace clause","meaning":"A WTO shield against disputes over food-security stockholding.","exam":"<b>Peace clause</b> – India invoked it for rice; it covers only programmes existing in 2013."},{"id":"s-101","topic":"GS35-wto-agreement-on-agriculture-and-farm-su","plain":"Trade-distorting farm support that is capped.","term":"Amber box","meaning":"Trade-distorting farm support that is capped under WTO rules.","exam":"<b>Amber box</b> – rice support breaches the cap; MSP-based procurement counts here."},{"id":"s-102","topic":"GS35-wto-agreement-on-agriculture-and-farm-su","plain":"Non-distorting support allowed freely.","term":"Green box","meaning":"Minimally trade-distorting support, allowed without limits.","exam":"<b>Green box</b> – minimally distorting support with no ceiling: research, extension, infrastructure, decoupled income support."},{"id":"s-103","topic":"GS36-supermarkets","plain":"Big buyers dictate terms to small farmers.","term":"Buyer power (power imbalance)","meaning":"The power of large buyers to dictate prices and terms.","exam":"<b>Buyer power (power imbalance)</b> – large retailers squeeze suppliers on price and payment terms."},{"id":"s-104","topic":"GS36-location-of-food-processing-industries","plain":"Units sited near the farms.","term":"Raw-material-oriented location","meaning":"Units located near their raw material because it is perishable or bulky.","exam":"<b>Raw-material-oriented location</b> – sugar mills in cane belts of UP and Maharashtra; rice mills in Punjab and Haryana."},{"id":"s-105","topic":"GS36-location-of-food-processing-industries","plain":"Units sited near the consumers.","term":"Market-oriented location","meaning":"Units located near consumers because products are bulky, fragile or sold quickly.","exam":"<b>Market-oriented location</b> – bakeries, beverages and dairy products near large cities."},{"id":"s-106","topic":"GS36-micro-food-processing-units","plain":"Leaving the village because there is no work.","term":"Distress migration","meaning":"Migration forced by the absence of local livelihoods.","exam":"<b>Distress migration</b> – micro food processing creates non-farm work in the village."},{"id":"s-107","topic":"GS37-land-titling","plain":"Land records only presume ownership; they don't guarantee it.","term":"Presumptive (not conclusive) titles","meaning":"Records that presume ownership but do not guarantee it.","exam":"<b>Presumptive (not conclusive) titles</b> – records show who pays revenue; NITI Aayog draft model law moves to conclusive titling (Torrens principles)."},{"id":"s-108","topic":"GS37-land-ceiling","plain":"Owners who neither live on nor farm their land.","term":"Absentee landlordism","meaning":"Owners who earn rent from land they neither live on nor cultivate.","exam":"<b>Absentee landlordism</b> – land ceilings reward cultivation over rent-seeking."},{"id":"s-109","topic":"GS37-land-reforms","plain":"The smallest farm a family can live on.","term":"Economic farm size","meaning":"A farm large enough to support a family.","exam":"<b>Economic farm size</b> – NABARD puts the income threshold at [[≈1.7 ha]]."},{"id":"s-110","topic":"GS37-land-leasing-and-tenancy-reform","plain":"All the land a farmer actually cultivates, owned or leased.","term":"Operational holding","meaning":"All land a farmer actually operates, owned or leased.","exam":"<b>Operational holding</b> – leasing moves land to active cultivators; [[≈13%]] of area leased in (NSS 77th round, 2019)."},{"id":"s-111","topic":"GS37-land-ceiling","plain":"Land held in someone else's name.","term":"Benami transfer","meaning":"Property held in another person’s name to evade the law.","exam":"<b>Benami transfer</b> – a key loophole in land ceilings, with family partitions and exemptions."},{"id":"s-112","topic":"GS37-land-reforms","plain":"Land kept back as \"personal cultivation\" to dodge the ceiling.","term":"Khudkasht","meaning":"Land kept as ‘personal cultivation’ to escape tenancy and ceiling laws.","exam":"<b>Khudkasht</b> – zamindars kept land as personal cultivation, a loophole in land reform."},{"id":"s-113","topic":"GS37-larr-act-2013","plain":"Studying how a project affects local people before acquiring land.","term":"Social impact assessment","meaning":"Assessing a project’s effects on people before acquiring land.","exam":"<b>Social impact assessment</b> – mandatory under the LARR Act, 2013, with a public hearing."},{"id":"s-114","topic":"GS38-labour-codes","plain":"Flexible hiring, with security for workers.","term":"Flexicurity","meaning":"Flexibility for employers combined with security for workers.","exam":"<b>Flexicurity</b> – Worker Re-skilling Fund pays 15 days’ last-drawn wages to retrenched workers."},{"id":"s-115","topic":"GS38-labour-codes","plain":"Benefits that move with the worker from job to job.","term":"Portable social protection","meaning":"Benefits that move with the worker across jobs.","exam":"<b>Portable social protection</b> – e-Shram registration and aggregator contributions for gig workers."},{"id":"s-116","topic":"GS38-labour-codes","plain":"Insecure, unprotected jobs.","term":"Precarious employment","meaning":"Insecure work without stable contracts or benefits.","exam":"<b>Precarious employment</b> – gig recognition does not guarantee PF and ESI benefits."},{"id":"s-117","topic":"GS38-ftas","plain":"FTAs paving the way for WTO-level deals.","term":"Building blocks for multilateralism","meaning":"Regional deals that pave the way for wider liberalisation.","exam":"<b>Building blocks for multilateralism</b> – deeper regional and bilateral liberalisation can lead to WTO-level deals."},{"id":"s-118","topic":"GS38-ftas","plain":"Plugging into global production chains.","term":"GVC integration","meaning":"Plugging domestic firms into global production chains.","exam":"<b>GVC integration</b> – lower input tariffs and assured markets; India’s share of world exports only [[1.8%]]."},{"id":"s-119","topic":"GS38-ftas","plain":"FTA preferences undermining equal treatment for all.","term":"Erosion of MFN status","meaning":"Preferential deals diluting equal treatment of all WTO members.","exam":"<b>Erosion of MFN status</b> – FTA preferences undercut the WTO’s non-discrimination rule."},{"id":"s-120","topic":"GS38-globalisation-and-informalisation","plain":"Technology that rewards capital and skilled workers.","term":"Capital- and skill-biased technology","meaning":"Technology that favours capital and skilled labour over routine work.","exam":"<b>Capital- and skill-biased technology</b> – imported machinery and automation replace routine jobs."},{"id":"s-121","topic":"GS38-premature-deindustrialisation","plain":"The services boom didn't spread to other sectors.","term":"Limited spillovers","meaning":"Growth that does not spread to the rest of the economy.","exam":"<b>Limited spillovers</b> – services link less to other sectors, so semi-skilled workers stay jobless."},{"id":"s-122","topic":"GS38-labour-intensive-vs-capital-intensive-ex","plain":"Inputs taxed more than finished goods.","term":"Inverted duty structure","meaning":"Inputs taxed at a higher rate than the finished product.","exam":"<b>Inverted duty structure</b> – man-made fibre inputs costlier than finished garments; locks up GST refunds."},{"id":"s-123","topic":"GS38-protectionism-and-currency-pressures","plain":"Anti-dumping and safeguard duties.","term":"Trade remedies","meaning":"Legal tools to counter dumping and import surges.","exam":"<b>Trade remedies</b> – anti-dumping and safeguard duties against goods diverted from the US."},{"id":"s-124","topic":"GS38-semiconductors","plain":"Freedom to choose our own path in technology and defence.","term":"Strategic autonomy","meaning":"Freedom from dependence on a few foreign suppliers.","exam":"<b>Strategic autonomy</b> – India Semiconductor Mission reduces dependence on imported chips."},{"id":"s-125","topic":"GS38-fdi","plain":"FDI comes in, but nearly as much goes out.","term":"Thin net FDI","meaning":"Gross inflows high but net inflows small.","exam":"<b>Thin net FDI</b> – [[$10 bn]] (FY24) → [[≈$0.4 bn]] (FY25) → [[$7.7 bn]] (FY26) (RBI)."},{"id":"s-126","topic":"GS38-fdi","plain":"Foreign firms taking profits home.","term":"Repatriation","meaning":"Foreign investors taking money back home.","exam":"<b>Repatriation</b> – [[$53.6 bn]] in FY26, a multi-year high (IPO exits and stake sales)."},{"id":"s-127","topic":"GS38-sezs","plain":"SEZs cut off from the local economy.","term":"Enclave (weak jobs link)","meaning":"A zone isolated from the surrounding economy.","exam":"<b>Enclave (weak jobs link)</b> – Baba Kalyani Committee: convert SEZs into Employment and Economic Enclaves."},{"id":"s-128","topic":"GS38-pli","plain":"Schemes that favour large firms.","term":"Big-firm bias","meaning":"Policy benefits that go mostly to large firms.","exam":"<b>Big-firm bias</b> – PLI gains less for MSMEs → Electronics Components Manufacturing Scheme (₹40,000 crore)."},{"id":"s-129","topic":"GS38-pli","plain":"Mostly assembling imported parts.","term":"Shallow value addition","meaning":"Mostly assembly of imported parts, with little domestic value.","exam":"<b>Shallow value addition</b> – mobiles: processors and displays imported → ISM 2.0 targets the whole value chain."},{"id":"s-130","topic":"GS38-industrial-policy","plain":"The state controlling key industries; permits for everything.","term":"Commanding heights · Licence raj","meaning":"State control of key sectors, with licences needed for private industry.","exam":"<b>Commanding heights · Licence raj</b> – 1948 and 1956 resolutions; the 1991 New Industrial Policy abolished licensing for all but a few items."},{"id":"s-131","topic":"GS39-nuclear-energy","plain":"Clean power available round the clock.","term":"Low-carbon baseload","meaning":"Steady, round-the-clock clean power.","exam":"<b>Low-carbon baseload</b> – nuclear complements solar and wind; [[8.8 GW]] today."},{"id":"s-132","topic":"GS39-solar-energy","plain":"Solar and wind come and go.","term":"Intermittency","meaning":"Output that varies with sun and wind.","exam":"<b>Intermittency</b> – needs storage and flexible grids → VGF for battery storage; pumped storage."},{"id":"s-133","topic":"GS39-solar-energy","plain":"Renewable power wasted because the grid can't take it.","term":"Curtailment","meaning":"Renewable power wasted because the grid cannot absorb it.","exam":"<b>Curtailment</b> – transmission lags generation → Green Energy Corridor."},{"id":"s-134","topic":"GS39-solar-energy","plain":"Plants that lose their value before the end of their life.","term":"Stranded assets","meaning":"Assets that lose value before the end of their life.","exam":"<b>Stranded assets</b> – thermal plants face falling load factors as solar grows (2015 Q9)."},{"id":"s-135","topic":"GS39-energy-transition","plain":"Power lost to theft and unpaid bills.","term":"AT&C losses","meaning":"Power lost through theft, inefficiency and unpaid bills.","exam":"<b>AT&C losses</b> – weak DISCOM finances: accumulated losses [[≈₹6.5–7 lakh crore]]."},{"id":"s-136","topic":"GS39-port-led-development","plain":"Indian cargo routed through Colombo or Singapore.","term":"Transhipment dependence","meaning":"Relying on foreign ports to tranship Indian cargo.","exam":"<b>Transhipment dependence</b> – [[≈75%]] of India’s transhipped cargo moves through Colombo and Singapore."},{"id":"s-137","topic":"GS39-airport-privatisation","plain":"Two airlines dominating the market.","term":"Airline duopoly","meaning":"Two firms dominating a market.","exam":"<b>Airline duopoly</b> – IndiGo [[≈64%]] of the domestic market; IndiGo and Air India [[≈90%]] of capacity."},{"id":"s-138","topic":"GS39-urban-transport-moving-people","plain":"Building dense housing and offices around metro stations.","term":"Transit-oriented development","meaning":"Dense development planned around transit stations.","exam":"<b>Transit-oriented development</b> – Metro Rail Policy 2017 requires a comprehensive mobility plan."},{"id":"s-139","topic":"GS39-smart-cities","plain":"Limits on how much floor area can be built on a plot.","term":"Floor Space Index (FSI)","meaning":"The ratio of built floor area to plot area.","exam":"<b>Floor Space Index (FSI)</b> – restrictive FSI makes cities sprawl outward rather than grow vertically."},{"id":"s-140","topic":"GS310-ppp","plain":"PPP costs the government will have to pay later.","term":"Hidden long-term (contingent) liabilities","meaning":"Guarantees and annuities that create future obligations for the state.","exam":"<b>Hidden long-term (contingent) liabilities</b> – PPP guarantees and annuities can pass unsustainable debt to later generations."},{"id":"s-141","topic":"GS310-ppp","plain":"Projects that lenders won't fund.","term":"Bankability gap","meaning":"Projects that lenders will not finance.","exam":"<b>Bankability gap</b> – Viability Gap Funding makes desirable but unviable PPPs bankable."},{"id":"s-142","topic":"GS310-concession-agreement","plain":"Giving each risk to the side that can best manage it.","term":"Risk allocation","meaning":"Assigning each risk to the party best able to manage it.","exam":"<b>Risk allocation</b> – construction risk to the developer; land and clearances to the government."},{"id":"s-143","topic":"GS310-ppp","plain":"The risk that tolls or users fall short.","term":"Traffic and revenue risk","meaning":"The risk that traffic or revenue falls short of projections.","exam":"<b>Traffic and revenue risk</b> – Hybrid Annuity Model shields developers; EPC keeps it with the state."},{"id":"s-144","topic":"GS310-ppp","plain":"Officials avoid decisions for fear of probes.","term":"Fear of the investigator","meaning":"Officials avoiding decisions for fear of vigilance probes.","exam":"<b>Fear of the investigator</b> – officials avoid renegotiating stressed PPP contracts."},{"id":"s-145","topic":"GS310-concession-agreement","plain":"Events beyond anyone's control release the parties.","term":"Force majeure (change in law)","meaning":"Events beyond the parties’ control that change obligations.","exam":"<b>Force majeure (change in law)</b> – the concession agreement must say who pays if policy or nature changes the project."},{"id":"s-146","topic":"GS310-ppp","plain":"Money stuck in finished projects that could fund new ones.","term":"Locked-in capital","meaning":"Public money tied up in completed assets.","exam":"<b>Locked-in capital</b> – InvITs and asset monetisation release it; InvIT assets [[≈₹6.3 lakh crore]] (FY25)."},{"id":"s-147","topic":"GS310-vgf-viability-gap-funding","plain":"A grant that makes a needed but unprofitable project bankable.","term":"Viability gap funding","meaning":"A grant that makes a needed but unprofitable project viable.","exam":"<b>Viability gap funding</b> – up to [[20%]] Centre plus [[20%]] state (VGF scheme, 2005, revamped 2020)."}]};

<script>
(function(){
"use strict";
const KEY="gs3deck.v2";
const $=s=>document.querySelector(s);
const LABEL={define:"Define",for:"FOR",against:"AGAINST",value:"Value addition",list:"Points",data:"Data and examples",diagram:"Draw it"};
const CLS={define:"define",for:"for",against:"against",value:"value",list:"value",data:"data",diagram:"draw"};
const LSHORT={}; DECK.lines.forEach(l=>LSHORT[l.id]=l.short);

/* ---------- build cards ---------- */
const cards={}, groups=[];
DECK.topics.forEach(t=>{
  const where=t.line+" · "+(t.part||LSHORT[t.line]);
  const g={key:t.id,line:t.line,part:t.part,where,topic:[],say:[]};
  const n={};
  t.cards.forEach(c=>{
    n[c.k]=(n[c.k]||0); const id=t.id+":"+c.k+n[c.k]; n[c.k]++;
    const cnt=c.rows?c.rows.length:0;
    cards[id]={id,kind:"topic",k:c.k,cls:CLS[c.k],label:LABEL[c.k],count:cnt,topic:t,payload:c,where};
    g.topic.push(id);
  });
  groups.push(g);
});
const gmap={}; groups.forEach(g=>gmap[g.key]=g);
DECK.say.forEach(s=>{
  const g=gmap[s.topic]; if(!g) return;
  cards[s.id]={id:s.id,kind:"say",cls:"say",label:"You want to say",payload:s,where:g.where,topic:DECK.topics.find(t=>t.id===s.topic)};
  g.say.push(s.id);
});

/* ---------- state ---------- */
let S=load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.v===2) return s;}catch(e){}
  return {v:2,type:"all",line:"all",part:"all",mode:"order",missed:false,queue:null,pos:0,st:{},back:false};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const isMissed=id=>S.st[id]&&S.st[id].s==="m";
function idsOf(g,type){let ids=[]; if(type!=="say") ids=ids.concat(g.topic); if(type!=="topic") ids=ids.concat(g.say); return ids;}
function scopeGroups(){
  return groups.filter(g=>(S.line==="all"||g.line===S.line)&&(S.part==="all"||g.part===S.part));
}
function filteredGroups(){
  return scopeGroups().map(g=>{let ids=idsOf(g,S.type); if(S.missed) ids=ids.filter(isMissed); return {key:g.key,ids};}).filter(g=>g.ids.length);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildQueue(){
  let gs=filteredGroups(), q;
  if(S.mode==="order"){ q=gs.flatMap(g=>g.ids); }
  else if(S.mode==="topics"){
    gs=shuffle(gs); const miss=gs.filter(g=>g.ids.some(isMissed)), rest=gs.filter(g=>!g.ids.some(isMissed));
    q=miss.concat(rest).flatMap(g=>g.ids);
  } else {
    const all=shuffle(gs.flatMap(g=>g.ids)); q=all.filter(isMissed).concat(all.filter(i=>!isMissed(i)));
  }
  S.queue=q; S.round=1; S.pos=0; S.back=false; save();
}
function validQueue(){return Array.isArray(S.queue)&&S.queue.every(id=>cards[id]);}
if(Array.isArray(S.queue)&&S.queue.length&&!validQueue()){ /* cards removed in a deck update: skip them, keep your place */
  const gone=S.queue.slice(0,S.pos).filter(id=>!cards[id]).length;
  S.queue=S.queue.filter(id=>cards[id]); S.pos=Math.max(0,Math.min(S.pos-gone,S.queue.length));
}
if(!validQueue()||!S.queue.length) buildQueue();
else{ /* drop repeat copies left by the old "show missed card again" behaviour */
  const head=[...new Set(S.queue.slice(0,S.pos))], seen=new Set(head);
  const tail=[...new Set(S.queue.slice(S.pos))].filter(id=>!seen.has(id));
  S.queue=head.concat(tail); S.pos=head.length; save();
}

/* ---------- reveal state ---------- */
let R=null;
function rowMax(r){return (r.t||r.src||r.fix||r.note)?2:1;}
function resetReveal(c){
  if(c&&c.kind==="topic"&&c.payload.rows){const rows=c.payload.rows;R={steps:rows.map(()=>0),max:rows.map(rowMax)};}
  else R=null;
}
const allDone=()=>!R||!R.steps||R.steps.every((s,i)=>s>=R.max[i]);

/* ---------- render ---------- */
const fmt=s=>(s||"").replace(/\[\[(.+?)\]\]/g,'<span class="fig">$1</span>');
function counts(ids){let k=0,m=0; ids.forEach(id=>{const s=S.st[id]; if(s&&s.s==="k")k++; else if(s&&s.s==="m")m++;}); return {k,m,n:ids.length-k-m,t:ids.length};}
function render(){
  $("#title").textContent=DECK.title; $("#subtitle").textContent=DECK.subtitle;
  document.querySelectorAll("#typeSeg button").forEach(b=>b.classList.toggle("on",b.dataset.v===S.type));
  document.querySelectorAll("#modeSeg button").forEach(b=>b.classList.toggle("on",b.dataset.v===S.mode));
  const ls=$("#lineSel"); ls.innerHTML='<option value="all">All lines</option>'+DECK.lines.map(l=>`<option value="${l.id}">${l.id} ${l.short}</option>`).join(""); ls.value=S.line;
  const parts=S.line==="all"?[]:[...new Set(groups.filter(g=>g.line===S.line).map(g=>g.part).filter(Boolean))];
  const ps=$("#partSel"); ps.innerHTML='<option value="all">All parts</option>'+parts.map(p=>`<option>${p}</option>`).join(""); ps.value=S.part; ps.disabled=parts.length<2; ps.style.display=parts.length<2?"none":"";
  const scopeIds=scopeGroups().flatMap(g=>idsOf(g,S.type)); const c0=counts(scopeIds);
  $("#nk").textContent=c0.k;$("#nm").textContent=c0.m;$("#nn").textContent=c0.n;
  $("#pk").style.width=(c0.t?c0.k/c0.t*100:0)+"%"; $("#pm").style.width=(c0.t?c0.m/c0.t*100:0)+"%";
  const mt=$("#missTgl"); mt.classList.toggle("on",S.missed); mt.textContent=S.missed?"Missed only ✓":"Missed only"; mt.disabled=!S.missed&&c0.m===0;
  const stage=$("#stage");
  if(!S.queue.length){ stage.innerHTML=`<div class="card"><div class="done"><h2>No cards here</h2><p>${S.missed?"Nothing is marked missed in this selection.":"Pick another line or card type."}</p></div></div>`; actions([]); return; }
  if(S.pos>=S.queue.length){ renderDone(stage); return; }
  const c=cards[S.queue[S.pos]];
  if(!R||R.id!==c.id){resetReveal(c); if(R)R.id=c.id; else R={id:c.id,none:true};}
  const kick=`<div class="kicker"><span>${c.where}</span><span>${S.pos+1} / ${S.queue.length}</span></div>`;
  if(!S.back){
    stage.innerHTML=`<div class="card"><div class="front" id="front">${kick}${frontHTML(c)}
      <div class="hint"><span>Recall it first, then tap</span><span>Space</span></div></div></div>`;
    $("#front").onclick=flip;
    actions([["ghost","‹","prev"],["primary","Show answer","flip"],["ghost","›","next"]]);
  } else {
    stage.innerHTML=`<div class="card back" id="backcard">${kick}${backHTML(c)}<div class="fliphint">Tap the card to flip back and try again</div></div>`;
    requestAnimationFrame(drawEdges);
    bindRows();
    $("#backcard").onclick=e=>{ if(e.target.closest(".rw.s0,.rw.s1")) return; unflip(); };
    const done=allDone();
    actions([["ghost","‹","prev"]].concat(R.steps&&!done?[["ghost","Show all","all"]]:[]).concat([["miss","Missed <kbd>1</kbd>","miss"],["got","Got it <kbd>2</kbd>","got"],["ghost","›","next"]]));
  }
}
function chip(c){const ch=`<span class="chip ${c.cls}">${c.label}${c.count?` <span class="ct">· ${c.count}</span>`:""}</span>`;
  return (c.payload&&c.payload.ed)?`<span class="chiprow">${ch}<span class="draft" title="Wording differs from your Notion page">edited</span></span>`:ch;}
function frontHTML(c){
  if(c.kind==="say") return `<span class="chip say">You want to say</span><div class="plain">${fmt(c.payload.plain)}</div>`;
  const t=c.topic, q=c.payload.q||t.name;
  return chip(c)+`<div class="topicname">${t.name}${t.own?"":' <span class="draft">draft</span>'}</div><div class="ttl q">${q}</div>`+(c.k==="diagram"?`<div class="drawhint">Sketch it on paper first: boxes and arrows.</div>`:"");
}
function backHTML(c){
  if(c.kind==="say"){const s=c.payload;
    return `<span class="chip say">The exam term</span><div class="term">${s.term}</div><div class="meaning">${fmt(s.meaning)}</div>
    <div class="exam"><div class="k">In your answer</div><div class="t">${fmt(s.exam)}</div></div>`;}
  const t=c.topic,p=c.payload;
  const sub=p.title?`<div class="ktitle">${p.title}</div>`:"";
  const head=`<div class="backhead">${chip(c)}<div class="topicname">${t.name}</div><div class="ttl">${p.q||t.name}</div>${sub}</div>`;
  if(c.k==="define") return head+`<div class="deftext">${fmt(p.text)}</div>`;
  if(c.k==="diagram") return head+diagramHTML(p.g);
  const rows=p.rows.map((r,i)=>rowHTML(r,i)).join("");
  const cue=(allDone()&&(p.cue||p.hook))?`<div class="cue"><div class="k">Learning cue</div>${p.cue?`<div class="t">${fmt(p.cue)}</div>`:""}${p.hook?`<div class="h">${p.hook}</div>`:""}</div>`:"";
  const hint=allDone()?"":`<div class="recall">Say each point aloud, then tap to check. First tap: label. Second tap: line and figures.</div>`;
  return head+hint+`<div class="rows">${rows}</div>`+cue;
}
/* ---------- diagrams ---------- */
function levels(g){
  const ids=g.nodes.map(n=>n[0]), out={}, indeg={}; ids.forEach(i=>{out[i]=[];indeg[i]=0;});
  g.edges.forEach(([a,b])=>{out[a].push(b);});
  // drop back edges (cycles) by DFS
  const state={}, fwd=[]; 
  function dfs(u){state[u]=1; out[u].forEach(v=>{ if(state[v]===1) return; fwd.push([u,v]); if(!state[v]) dfs(v);}); state[u]=2;}
  g.edges.forEach(([a,b])=>indeg[b]++);
  ids.filter(i=>indeg[i]===0).forEach(i=>{if(!state[i])dfs(i);}); ids.forEach(i=>{if(!state[i])dfs(i);});
  const lv={}; ids.forEach(i=>lv[i]=0);
  for(let k=0;k<ids.length;k++) fwd.forEach(([a,b])=>{ if(lv[b]<lv[a]+1) lv[b]=lv[a]+1; });
  return lv;
}
function diagramHTML(g){
  const lv=levels(g), max=Math.max(...Object.values(lv)), rows=[], pos={};
  const parents={}; g.nodes.forEach(n=>parents[n[0]]=[]); g.edges.forEach(([a,b])=>{ if(lv[a]<lv[b]) parents[b].push(a); });
  for(let k=0;k<=max;k++){
    let r=g.nodes.filter(n=>lv[n[0]]===k);
    if(k>0){ const bc=n=>{const ps=parents[n[0]].filter(p=>p in pos); return ps.length? ps.reduce((s,p)=>s+pos[p],0)/ps.length : 999;};
      r=r.map((n,i)=>[n,bc(n),i]).sort((x,y)=>x[1]-y[1]||x[2]-y[2]).map(x=>x[0]); }
    r.forEach((n,i)=>pos[n[0]]=i); rows.push(r);
  }
  const h=rows.map(r=>{ const ps=new Set(r.flatMap(n=>parents[n[0]])); const cls=r.length===1?"one":(r.length>2&&ps.size>1?"many":"");
    return `<div class="lv ${cls}">${r.map(([i,l])=>`<div class="nd" data-n="${i}">${fmt(l)}</div>`).join("")}</div>`;}).join("");
  return `<div class="dg" data-g='${JSON.stringify(g.edges).replace(/'/g,"&#39;")}'>${h}<svg></svg></div>`;
}
function drawEdges(){
  document.querySelectorAll(".dg").forEach(dg=>{
    const edges=JSON.parse(dg.dataset.g), svg=dg.querySelector("svg"), base=dg.getBoundingClientRect();
    const box=i=>{const el=dg.querySelector('.nd[data-n="'+i+'"]'); if(!el) return null; const r=el.getBoundingClientRect(); return {x:r.left-base.left,y:r.top-base.top,w:r.width,h:r.height};};
    let html='<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink3);stroke:none"/></marker></defs>';
    edges.forEach(([a,b,lab])=>{
      const A=box(a),B=box(b); if(!A||!B) return;
      let d,mx,my;
      if(B.y>A.y+A.h-2){ const x1=A.x+A.w/2,y1=A.y+A.h,x2=B.x+B.w/2,y2=B.y-2; const c=(y2-y1)/2; d=`M${x1},${y1} C${x1},${y1+c} ${x2},${y2-c} ${x2},${y2}`; mx=(x1+x2)/2; my=(y1+y2)/2; }
      else { const x1=A.x+A.w,y1=A.y+A.h/2,x2=B.x+B.w,y2=B.y+B.h/2, bx=Math.max(x1,x2)+26; d=`M${x1},${y1} C${bx},${y1} ${bx},${y2} ${x2+2},${y2}`; mx=bx-4; my=(y1+y2)/2; }
      html+=`<path d="${d}" marker-end="url(#ah)"/>`;
      if(lab) html+=`<text x="${mx+4}" y="${my}">${lab}</text>`;
    });
    svg.innerHTML=html;
  });
}
window.addEventListener("resize",()=>drawEdges());
function rowHTML(r,i){
  const st=R.steps[i], mx=R.max[i];
  const firstHidden=R.steps.findIndex((s,j)=>s<R.max[j]);
  const hd=(r.h&&r.h!==r.l)?`<div class="hd">${r.h}</div>`:"";
  if(st===0) return r.h?`<div class="rw s0 ${i===firstHidden?"next":""}" data-i="${i}"><div class="n">${i+1}</div><div class="body hb"><div class="hd">${r.h}</div></div></div>`:`<div class="rw s0 ${i===firstHidden?"next":""}" data-i="${i}"><div class="n">${i+1}</div><div class="body" style="--w:${45+((i*37)%40)}%"></div></div>`;
  let h=hd+`<div class="lbl">${fmt(r.l)}</div>`;
  if(st===1&&mx===2) return `<div class="rw s1" data-i="${i}"><div class="n">${i+1}</div><div class="body">${h}<div class="more"></div></div></div>`;
  if(st>=2){
    if(r.t) h+=`<div class="ln">${fmt(r.t)}</div>`;
    if(r.fix) h+=`<div class="fix">${fmt(r.fix)}</div>`;
    const meta=[]; if(r.src) meta.push(`<span class="src">${r.src}</span>`); if(r.unlikely) meta.push(`<span class="unl">unlikely</span>`);
    if(meta.length) h+=`<div class="meta">${meta.join("")}</div>`;
    if(r.note) h+=`<div class="note">${r.note}</div>`;
  }
  return `<div class="rw s2" data-i="${i}"><div class="n">${i+1}</div><div class="body">${h}</div></div>`;
}
function bindRows(){document.querySelectorAll(".rw.s0,.rw.s1").forEach(el=>el.onclick=()=>{step(+el.dataset.i);});}
function step(i){ if(!R.steps)return; if(R.steps[i]<R.max[i]){R.steps[i]++; render();
  const target=allDone()?document.querySelector('.cue')||document.querySelector('.rw[data-i="'+i+'"]'):document.querySelector('.rw[data-i="'+i+'"]');
  if(target) target.scrollIntoView({block:'nearest',behavior:'smooth'}); } }
function nextStep(){ if(!R.steps) return false; const i=R.steps.findIndex((s,j)=>s<R.max[j]); if(i<0) return false; step(i); return true; }
function showAll(){ if(!R.steps)return; R.steps=R.max.slice(); render(); }
function renderDone(stage){
  const missed=[...new Set(S.queue)].filter(isMissed), rn=S.round||1, tot=new Set(S.queue).size;
  stage.innerHTML=`<div class="card"><div class="done"><div class="kicker" style="justify-content:center"><span>Round ${rn} complete</span></div>
    <h2>${missed.length?missed.length+" of "+tot+" card"+(tot>1?"s":"")+" still missed":"Every card known"}</h2>
    <p>${missed.length?"Go through only the missed cards now, or start a new round.":"Start a new round, or shuffle to test recall out of order."}</p>
    <div class="row">${missed.length?'<button class="btn miss" style="flex:0 0 auto" id="revMiss">Review missed</button>':""}<button class="btn" id="newRound">New round</button></div></div></div>`;
  if(missed.length) $("#revMiss").onclick=()=>{S.queue=shuffle(missed.slice()); S.round=rn+1; S.pos=0; S.back=false; save(); render();};
  $("#newRound").onclick=()=>{buildQueue(); render();};
  actions([]);
}
function actions(list){
  const el=$("#actions"); el.innerHTML=list.map(([cls,txt,act])=>`<button class="btn ${cls}" data-a="${act}">${txt}</button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>act(b.dataset.a));
  const p=el.querySelector('[data-a="prev"]'); if(p) p.disabled=S.pos===0;
}
function act(a){({flip,prev,next,all:showAll,miss:()=>grade("m"),got:()=>grade("k")})[a]();}
function unflip(){const card=document.querySelector(".card"); if(card) card.classList.add("flipping"); setTimeout(()=>{S.back=false; R=null; save(); render();},120);}
function next(){ if(S.pos<S.queue.length){S.pos++; S.back=false; R=null; save(); render(); window.scrollTo(0,0);} }
function flip(){const card=document.querySelector(".card"); if(card) card.classList.add("flipping"); setTimeout(()=>{S.back=true; save(); render();},120);}
function prev(){ if(S.pos>0){S.pos--; S.back=false; R=null; save(); render(); window.scrollTo(0,0);} }
function grade(s){
  const id=S.queue[S.pos], o=S.st[id]||{seen:0,miss:0};
  o.seen++; o.s=s; if(s==="m") o.miss++;
  S.st[id]=o; S.pos++; S.back=false; R=null; save(); render(); window.scrollTo(0,0);
}
/* ---------- progress sheet ---------- */
function progressSheet(){
  const rows=DECK.lines.map(l=>{const ids=groups.filter(g=>g.line===l.id).flatMap(g=>idsOf(g,"all")); return {l,c:counts(ids)};});
  const all=counts(groups.flatMap(g=>idsOf(g,"all")));
  const bar=c=>`<div class="bar"><i class="k" style="width:${c.t?c.k/c.t*100:0}%"></i><i class="m" style="width:${c.t?c.m/c.t*100:0}%"></i></div>`;
  $("#pbox").innerHTML=`<h3>Progress by line</h3>
   <div class="pl" data-l="all"><div class="nm">All lines<small>${all.t} cards</small></div><div class="ct">${all.k} known · ${all.m} missed</div>${bar(all)}</div>`+
   rows.map(({l,c})=>`<div class="pl" data-l="${l.id}"><div class="nm">${l.id} ${l.short}<small>${c.t} cards</small></div><div class="ct">${c.k} known · ${c.m} missed</div>${bar(c)}</div>`).join("")+
   `<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn ghost" id="pClose">Close</button></div>`;
  $("#pmodal").classList.add("on");
  $("#pClose").onclick=()=>$("#pmodal").classList.remove("on");
  document.querySelectorAll("#pbox .pl").forEach(el=>el.onclick=()=>{S.line=el.dataset.l; S.part="all"; buildQueue(); R=null; $("#pmodal").classList.remove("on"); render(); toast(S.line==="all"?"All lines":S.line+" "+LSHORT[S.line]);});
}
/* ---------- controls ---------- */
function rebuild(msg){buildQueue(); R=null; render(); if(msg) toast(msg);}
document.querySelectorAll("#typeSeg button").forEach(b=>b.onclick=()=>{ if(S.type===b.dataset.v)return; S.type=b.dataset.v; rebuild("New round");});
document.querySelectorAll("#modeSeg button").forEach(b=>b.onclick=()=>{ S.mode=b.dataset.v;
  rebuild(S.mode==="order"?"In page order":S.mode==="topics"?"Topics shuffled · each topic's cards stay together":"Every card shuffled");});
$("#lineSel").onchange=e=>{S.line=e.target.value; S.part="all"; rebuild("New round");};
$("#partSel").onchange=e=>{S.part=e.target.value; rebuild("New round");};
$("#missTgl").onclick=()=>{S.missed=!S.missed; rebuild(S.missed?"Only cards you missed":"All cards");};
$("#progBtn").onclick=progressSheet;
$("#pmodal").onclick=e=>{if(e.target.id==="pmodal") $("#pmodal").classList.remove("on");};
$("#resetBtn").onclick=()=>$("#modal").classList.add("on");
$("#mCancel").onclick=()=>$("#modal").classList.remove("on");
$("#mOk").onclick=()=>{const keep={type:S.type,line:S.line,part:S.part,mode:S.mode}; S={v:2,...keep,missed:false,queue:null,pos:0,st:{},back:false}; buildQueue(); R=null; $("#modal").classList.remove("on"); render(); toast("Progress reset");};
let tt; function toast(m){const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),1600);}
document.addEventListener("keydown",e=>{
  if($("#modal").classList.contains("on")||$("#pmodal").classList.contains("on")) return;
  if(e.target.tagName==="SELECT") return;
  if(!S.queue.length||S.pos>=S.queue.length) return;
  if(e.key===" "||e.key==="Enter"){e.preventDefault(); if(!S.back) flip(); else if(!nextStep()) unflip(); }
  else if(S.back&&(e.key==="1"||e.key==="m")) grade("m");
  else if(S.back&&(e.key==="2"||e.key==="g")) grade("k");
  else if(S.back&&e.key==="a") showAll();
  else if(e.key==="ArrowLeft") prev();
  else if(e.key==="ArrowRight") next();
});
render();
})();
</script>
</body>
</html>
