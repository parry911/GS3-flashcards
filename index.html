-midh-and-horticulture","line":"GS3.5","part":"Technology missions","name":"MIDH and horticulture","own":true,"cards":[{"k":"define","q":"What is MIDH?","text":"Mission for Integrated Development of Horticulture (MIDH): Centrally sponsored scheme (since 2014–15)covering fruits, vegetables, spices, flowers, plantation crops, and mushrooms."},{"k":"for","q":"What has horticulture achieved under MIDH?","rows":[{"l":"Beats foodgrains","t":"Horticulture output reached about [[370 MT]] in 2024-25."},{"l":"MIDH gains","t":"Area rose about 9% and output about [[14%]]."},{"l":"Higher income","t":"Household income rose from ₹0.7 lakh to [[₹1.3 lakh]] a year."},{"l":"Planting material","t":"[[58]] Centres of Excellence supply quality planting material."},{"l":"Forecasting","t":"CHAMAN uses remote sensing to estimate horticulture output."},{"l":"Nutrition and jobs","t":"It adds micronutrients and labour-intensive jobs in grading and packing."}],"cue":"Output → MIDH gains → income → planting material → forecasting → jobs."},{"k":"against","q":"What holds horticulture back?","rows":[{"l":"Post-harvest losses","t":"About [[30–40%]] of fruits and vegetables spoil."},{"l":"Glut crashes","t":"Few processing units mean tomato and onion price crashes."},{"l":"Smallholder access","t":"Small farms cannot afford polyhouses, drip or cold stores."},{"l":"Weak credit","t":"Farmers lack working capital for costly horticulture inputs."},{"l":"Uneven states","t":"Eastern and rainfed states lag in uptake."}],"cue":"Spoilage → gluts → small farms → credit → uneven states."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Farm-gate cold chains","t":"Combine MIDH with the AIF for pack-houses and cold storage."},{"l":"Processing","t":"Use Operation Greens and PM Kisan SAMPADA to absorb gluts."},{"l":"Clusters and FPOs","t":"Group smallholders into clusters selling on e-NAM and ONDC."},{"l":"Credit and insurance","t":"Extend KCC and weather-based insurance to high-value crops."},{"l":"Better execution","t":"Link grants to performance and supply disease-free plants."}],"cue":"Cold chains → processing → clusters → credit → execution."},{"k":"data","q":"Which programmes and examples back up MIDH?","title":"Data","rows":[{"l":"Mega cluster","t":"Above 15,000 ha, up to [[₹100 crore]]."},{"l":"Midi cluster","t":"5,000–15,000 ha, up to [[₹50 crore]]."},{"l":"Mini cluster","t":"Up to 5,000 ha, up to [[₹25 crore]]."},{"l":"UP date palm","t":"A [[40%]] subsidy is reported, but your notes mark it unlikely."}]}]},{"id":"GS35-livestock-economics","line":"GS3.5","part":"Animal rearing","name":"Livestock economics","own":true,"cards":[{"k":"define","q":"What is meant by livestock economics?","text":"Rearing of animals for milk, meat, and other produce, providing a steady source of rural income beyond crops."},{"k":"for","q":"Why does livestock matter for the rural economy?","rows":[{"l":"High growth","t":"It is about [[31%]] of agricultural GVA, growing 12.8% a year."},{"l":"Share of economy","t":"Livestock is about [[5.5%]] of total GVA."},{"l":"Women's jobs","t":"Women are about [[70%]] of its 20 million workers."},{"l":"Farmers supported","t":"Livestock supports about [[8 crore]] farmers."},{"l":"Climate buffer","t":"It steadies income when crops fail."},{"l":"Exports","t":"Buffalo meat exports reached about [[₹34,000 crore]] in FY25."},{"l":"Circular farming","t":"Dung feeds manure and biogas, as in GOBARdhan."}],"cue":"Growth → share of economy → women's jobs → 8 crore farmers → climate buffer → exports → circular use."},{"k":"against","q":"What holds back India’s livestock sector?","rows":[{"l":"Low yields","t":"Milk yield is about [[1,800 kg]] an animal, against 2,700 kg globally."},{"l":"Disease","t":"Foot-and-mouth and lumpy skin cut output, with weak vet services."},{"l":"Unorganised markets","t":"Marketing costs take [[15–20%]] of the sale price."},{"l":"Fodder shortage","t":"Only about [[5%]] of land grows fodder."},{"l":"Emissions","t":"Livestock cause about [[15%]] of global greenhouse emissions."},{"l":"Little insurance","t":"Only about [[16%]] of animals are insured, and 1% under NLM."}],"cue":"Low yields → disease → middlemen → fodder → emissions → insurance."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Better breeds","t":"Rashtriya Gokul Mission gives a [[35%]] subsidy for heifer-rearing centres."},{"l":"Disease control","t":"NADCP and mobile vet units vaccinate and treat at the doorstep."},{"l":"Fodder and sensors","t":"Grow local fodder and track animals with precision livestock farming."},{"l":"Integrated farming","t":"An Uttarakhand mixed farm earns about [[₹6.4 lakh]] a year."},{"l":"Organised markets","t":"Use Amul-style cooperatives and e-Gopala to reach buyers."}],"cue":"Breeds → disease control → fodder → integrated farms → markets."},{"k":"data","rows":[{"l":"Milk output","t":"[[248 MT]] in 2024-25, about 25% of world output."},{"l":"Milk per person","t":"[[485 g]] a person a day."},{"l":"Milk's share","t":"Milk is about [[82%]] of livestock GVA."}],"q":"What do the milk numbers show?"},{"k":"diagram","q":"Draw the diagram for Livestock economics","g":{"dir":"LR","nodes":[["B","Breed and feed"],["A","Animal health"],["O","Output - milk, meat, eggs"],["C","Cooperative - Amul model"],["M","Market and exports"]],"edges":[["B","A",""],["A","O",""],["O","C",""],["C","M",""]]}}]},{"id":"GS35-national-livestock-mission","line":"GS3.5","part":"Animal rearing","name":"National Livestock Mission","own":true,"cards":[{"k":"define","q":"What is the National Livestock Mission?","text":"A centrally sponsored mission (2014–15, re-aligned 2021–22) for sustainable livestock growth through better breeds, fodder supply and rural entrepreneurship."},{"k":"list","q":"What are the National Livestock Mission’s sub-missions?","rows":[{"l":"Breed development","t":"Better breeds of livestock and poultry."},{"l":"Feed and fodder","t":"More and better fodder."},{"l":"Innovation and extension","t":"Research and outreach to farmers."},{"l":"Partner scheme","t":"It works alongside the Rashtriya Gokul Mission for native cattle."}]},{"k":"for","q":"What does the National Livestock Mission offer?","rows":[{"l":"Landless and women","t":"Sheep, goats, pigs and backyard poultry help landless families."},{"l":"Entrepreneurship","t":"A [[50%]] capital subsidy up to ₹50 lakh for small-animal units."},{"l":"Uptake","t":"About [[3,300]] projects sanctioned with ₹1,100 crore subsidy."},{"l":"Fodder","t":"Subsidised fodder seed, hay and silage, as in Fodder Plus FPOs."},{"l":"Productivity","t":"Breeding, extension and insurance raise herd output."}],"cue":"Landless → entrepreneurs → uptake → fodder → productivity."},{"k":"against","q":"What are its limits?","rows":[{"l":"Back-ended subsidy","t":"A bank loan is needed upfront, shutting out the landless."},{"l":"Little insurance","t":"Only about [[1%]] of livestock is insured under the mission."},{"l":"Fodder and vets","t":"Thin fodder land and weak vet services limit output."},{"l":"Middlemen","t":"Weak processing of goat, sheep and pig meat leaves breeders to middlemen."},{"l":"Complex DPRs","t":"Complex proposals favour larger entrepreneurs."}],"cue":"Loan upfront → insurance → fodder and vets → middlemen → complex DPRs."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"No collateral","t":"Lend through SHGs and FPOs with credit guarantees."},{"l":"Bundle insurance","t":"Attach insurance to every NLM loan."},{"l":"Pastures","t":"Build community pastures and silage banks with MGNREGA."},{"l":"Market links","t":"Link small-animal produce to processing and ONDC through AHIDF."},{"l":"Simple applications","t":"Allow local-language online DPRs and add mobile vet units."}],"cue":"No collateral → insurance → pastures → markets → simple applications."}]},{"id":"GS35-pink-revolution","line":"GS3.5","part":"Animal rearing","name":"Pink revolution","own":true,"cards":[{"k":"define","q":"What is the pink revolution?","text":"Modernising meat and poultry production and processing (the term is also used for onions and prawns)through organised abattoirs, cold chains, processing, and exports."},{"k":"for","q":"What is the case for the pink revolution?","rows":[{"l":"Cheap protein","t":"Egg output hit [[149 billion]], second in the world."},{"l":"Scale","t":"Meat output reached [[10.5 MT]], about half of it poultry."},{"l":"Exports","t":"Buffalo meat exports reached about [[₹34,000 crore]] in FY25."},{"l":"Fast income","t":"Poultry needs little land and pays quickly, as in Tamil Nadu."},{"l":"Value addition","t":"Processing adds by-products like leather and gelatin."}],"cue":"Protein → scale → exports → fast income → value addition."},{"k":"against","q":"What holds the pink revolution back?","rows":[{"l":"Unorganised slaughter","t":"Poor hygiene and cold chains cause spoilage and export rejections."},{"l":"Uneven laws","t":"State slaughter laws and FSSAI enforcement vary."},{"l":"Low demand","t":"Meat availability is only [[7.5 kg]] a person a year."},{"l":"Disease and AMR","t":"Bird flu and antibiotic overuse raise health risks."},{"l":"Pollution and feed costs","t":"Slaughter waste pollutes water, and feed prices squeeze margins."}],"cue":"Unorganised slaughter → uneven laws → low demand → disease → pollution."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Modern abattoirs","t":"Build abattoirs and cold chains through AHIDF."},{"l":"Food safety","t":"Enforce FSSAI hygiene, traceability and export certification."},{"l":"Disease control","t":"Control disease and curb poultry antibiotics under One Health."},{"l":"Credit and feed","t":"Give small farmers KCC credit and stable feed through FPOs."},{"l":"Waste to energy","t":"Turn slaughter waste into biogas, as in GOBARdhan."}],"cue":"Abattoirs → food safety → disease control → credit → waste to energy."}]},{"id":"GS35-mariculture","line":"GS3.5","part":"Animal rearing","name":"Mariculture and fisheries","own":true,"cards":[{"k":"define","text":"Farming of fish, shellfish and seaweed in the sea or in coastal saltwater.","q":"What is mariculture?"},{"k":"value","rows":[{"l":"Fisheries rank","t":"India is the second-largest producer, with about [[8%]] of world output."},{"l":"Output","t":"Production rose from 96 to [[198 lakh]] tonnes, FY14 to FY25."},{"l":"PMMSY","t":"[[₹20,050 crore]] Blue Revolution 2.0, run with NABARD."},{"l":"PMMSY target","t":"Fish output of 22 MMT, with [[19.8 MMT]] achieved in FY25."},{"l":"Neeli Kranti","t":"The 2015-16 Blue Revolution scheme that preceded PMMSY."},{"l":"Budget 2026-27","t":"Fisheries in [[500]] reservoirs and Amrit Sarovars."}],"q":"What are the key fisheries numbers and schemes?"}]},{"id":"GS35-biofloc-technology","line":"GS3.5","part":"Animal rearing","name":"Biofloc technology","own":true,"cards":[{"k":"define","text":"Fish farming in tanks where beneficial microbes turn fish waste into protein-rich floc that the fish eat, allowing dense stocking with little water exchange.","q":"What is meant by biofloc technology?"}]},{"id":"GS36-contract-farming","line":"GS3.6","part":"","name":"Contract farming","own":true,"cards":[{"k":"define","text":"An agreement between farmers and a buyer (processor or retailer) to grow a crop at an agreed price and quality, often with inputs and technical support.","q":"What is contract farming?"},{"k":"list","title":"Contract farming vs corporate farming (2015 Q3)","rows":[{"l":"Land owner","t":"The farmer in contract farming, the company in corporate farming."},{"l":"Management","t":"The farmer runs the farm, against the company running everything."},{"l":"Risk","t":"Shared in contract farming, borne by the company in corporate farming."},{"l":"Aim","t":"Assured quality produce, against large industrial-scale output."},{"l":"Farmer's status","t":"An independent producer, against usually a wage labourer."}],"q":"How does contract farming differ from corporate farming?","cue":"Who owns, who runs, who bears risk, what is the aim, what is the farmer?"},{"k":"for","rows":[{"l":"Higher yields","t":"Yields rose [[29%]] under contract farming in a Benin and Ghana survey."},{"l":"Higher incomes","t":"Incomes rise about [[23–54%]]."},{"l":"Assured market","t":"It lowers price and market risk for small farmers."},{"l":"Steady supply","t":"Processors get a regular supply of the right quality."},{"l":"Technology access","t":"Buyers bring seed, machines and know-how."},{"l":"Scale without selling land","t":"Pooled plots justify machines while farmers keep ownership."}],"q":"What are the benefits of contract farming?","cue":"Higher yields → higher incomes → assured market → steady supply → technology → scale without selling land."},{"k":"against","rows":[{"l":"Debt and land risk","t":"Indebted farm households owe about [[$1,500]] each, so failed contracts risk land."},{"l":"Exploitation","t":"One survey found [[94%]] faced exploitation and only 6% benefited."},{"l":"Power imbalance","t":"A few dominant buyers can put profit before farmers."},{"l":"Weak safeguards","t":"Farmers need price floors, dispute resolution and land-title protection."},{"l":"Unequal benefits","t":"Richer farmers gain most."}],"q":"What are the risks of contract farming?","cue":"Debt → exploitation → power imbalance → weak safeguards → unequal gains."},{"k":"value","title":"Laws and cases","rows":[{"l":"Model Act, 2018","t":"A written pre-sowing contract, outside APMC, with a state dispute authority."},{"l":"Tamil Nadu","t":"First state to pass a law on the model, in 2019."},{"l":"2020 farm law","t":"It set a central price-contract framework, repealed in 2021."},{"l":"PepsiCo case (2019)","t":"PepsiCo sued Gujarat farmers over its FL-2027 potato, then withdrew."},{"l":"Seed-rights lesson","t":"Its variety registration was revoked in 2021, showing buyer power."},{"l":"Note","t":"The 94% figure comes from one weak survey, so prefer PepsiCo."}],"q":"Which laws and cases shape contract farming in India?"}]},{"id":"GS36-supermarkets","line":"GS3.6","part":"","name":"Supermarkets","own":true,"cards":[{"k":"define","text":"Organised modern retail (supermarkets, hypermarkets, online grocery) that buys produce through its own supply chains, bypassing the mandi chain of intermediaries.","q":"What is organised retail (supermarkets)?"},{"k":"list","q":"Which mandi chain do supermarkets bypass, and who does it?","rows":[{"l":"The mandi chain","t":"Merchants, transporters, graders, arhtiyas, brokers and speculators each take a cut."},{"l":"Examples","t":"Reliance Retail, and ITC e-Choupal linking farmers digitally."}]},{"k":"for","rows":[{"l":"Shorter chain","t":"Buying direct from farmers and FPOs raises the farmer's share."},{"l":"Low margin, high volume","t":"They can pay farmers more and still sell cheaper."},{"l":"Supply-chain investment","t":"Cold storage, grading and logistics cut wastage."},{"l":"Demand for processing","t":"They create steady demand for graded, branded products."}],"q":"How can supermarkets help farmers and consumers?","cue":"Shorter chain → low margins → better infrastructure → demand for processing."},{"k":"against","rows":[{"l":"Limited reach","t":"Organised retail is mostly urban, so rural demand stays unbranded."},{"l":"Thin procurement investment","t":"Many chains spend little on collection, and strict standards waste food."},{"l":"Buyer power","t":"Big retailers squeeze suppliers on price and payment terms."},{"l":"Small farmers left out","t":"Volume and quality standards favour larger suppliers."}],"q":"What are the downsides of supermarket-led supply chains?","cue":"Limited reach → thin investment → buyer power → small farmers left out."}]},{"id":"GS36-food-processing-industry","line":"GS3.6","part":"","name":"Food processing industry","own":true,"cards":[{"k":"define","q":"What is the food processing industry?","text":"Turning raw farm, livestock, and fishery produce into longer-lasting, higher-value products—spanning primary(cleaning, grading, milling), secondary (canning, freezing, pulping), and tertiary (ready-to-eat, branded)stages. Bridges agriculture and manufacturing under the Ministry of Food Processing Industries (MoFPI)."},{"k":"for","q":"Why is food processing important for India?","rows":[{"l":"Farmer incomes","t":"A second buyer cuts distress sales, helped by an [[₹800 crore]] millet PLI."},{"l":"Jobs","t":"It is the largest organised manufacturing employer, with [[12.8%]] of jobs."},{"l":"Less waste","t":"It curbs the [[30–40%]] post-harvest loss and absorbs gluts."},{"l":"Exports","t":"Processed food rose from 14.9% to [[23.4%]] of agri-food exports."},{"l":"New channels","t":"ONDC lets over [[5,000]] FPOs sell nationally, alongside D2C and quick commerce."}],"cue":"Farmer income → jobs → less waste → exports → new channels."},{"k":"against","q":"What constraints does the food processing industry face?","rows":[{"l":"Cold-chain gap","t":"Logistics cost [[14–18%]] of price, against about 8% globally."},{"l":"Cold storage need","t":"India needs about [[61 MT]] of cold storage."},{"l":"Low processing","t":"Only 4.5% of fruits and [[2.7%]] of vegetables are processed."},{"l":"Heavy compliance","t":"Many licences, FSSAI rules and APMC limits burden small units."},{"l":"Quality checks","t":"Pesticide residues like tricyclazole hurt rice exports."},{"l":"Costly credit","t":"Banks avoid seasonal, perishable raw material, and workers lack skills."},{"l":"Concentration and waste","t":"Capacity sits in a few states, and packaging adds plastic waste."}],"cue":"Cold chain → storage need → low processing → compliance → residues → credit → concentration."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Cold chains","t":"Use PMKSY cold chains, irradiation units and the AIF."},{"l":"Formalise micro units","t":"PMFME subsidies and PLI upgrade old machinery."},{"l":"Demand and branding","t":"GST 2.0 moved most processed food to [[5%]]."},{"l":"Simpler rules","t":"Single-window FSSAI clearance and farm-gate buying outside APMCs."},{"l":"Skills and packaging","t":"More NIFTEM institutes, including Bihar, and sustainable packaging."}],"cue":"Cold chains → formalise → branding → simpler rules → skills."},{"k":"data","rows":[{"l":"GVA","t":"Rose from ₹1.3 to [[₹2.2 lakh crore]], 2014-15 to 2023-24."},{"l":"Growth","t":"About [[7.3%]] a year."},{"l":"Shares","t":"About [[8%]] of agricultural GVA and of manufacturing GVA."},{"l":"Registered jobs","t":"Rose from 17 lakh to [[20 lakh]] in FY22."},{"l":"Informal work","t":"About [[70%]] of its workers are in unorganised units."},{"l":"Exports","t":"About [[13%]] of India's total exports."},{"l":"FDI","t":"About [[$7.3 bn]] of FDI equity, 2014 to 2025."},{"l":"Processing level","t":"Under [[10%]] overall, against about 70% in Brazil."},{"l":"By product","t":"Milk 21%, fish 15% and meat [[34%]] are processed."},{"l":"Rural demand","t":"Only about [[9%]] of rural demand is for processed food."},{"l":"Unbranded market","t":"About [[80%]] of the market is unbranded."},{"l":"Market size","t":"To double from $307 bn (2023) to about [[$700 bn]] by 2030, marked unlikely."},{"l":"Packaging market","t":"India is third-largest, growing from $2.8 bn to [[$6.4 bn]] by 2029."}],"q":"What data and schemes back up food processing?"},{"k":"data","rows":[{"l":"PLISFPI","t":"[[₹10,900 crore]] for 2021-22 to 2026-27, backing sales and brands abroad."},{"l":"PLISFPI jobs","t":"About [[3.4 lakh]] jobs against a 2.5 lakh target."},{"l":"FDI","t":"[[100%]] through the automatic route."},{"l":"GST 2.0","t":"UHT milk, paneer and Indian breads went to nil GST."},{"l":"World Food India 2025","t":"26 MoUs worth about [[₹1,02,000 crore]], with over 64,000 jobs expected."},{"l":"Amul","t":"The world's strongest dairy brand (BSI 91/100), with the largest curd plant in Kolkata."}],"q":"What data and schemes back up food processing?"},{"k":"diagram","q":"Draw the diagram for Food processing industry","g":{"dir":"TD","nodes":[["F","Food processing"],["P","Primary - cleaning, grading, milling"],["S","Secondary - canning, freezing, pulping"],["T","Tertiary - ready-to-eat, branded"],["E","Value addition and exports"]],"edges":[["F","P",""],["F","S",""],["F","T",""],["T","E",""]]}}]},{"id":"GS36-location-of-food-processing-industries","line":"GS3.6","part":"","name":"Location of Food Processing Industries","own":true,"cards":[{"k":"define","q":"What decides where a food processing unit locates?","text":"Where a unit locates sets its cost of raw material, transport, and access to buyers. Perishable or weight-losing raw material pulls units toward farms; bulky, fragile, or quickly sold final goods pull them toward cities."},{"k":"for","q":"What patterns explain the location of food processing industries?","rows":[{"l":"Raw-material pull","t":"Perishable or weight-losing crops pull units to farms, like sugar mills."},{"l":"Market pull","t":"Bulky or fragile goods like bakery and dairy locate near cities."},{"l":"Ports and power","t":"Export units cluster near ports like Kochi."},{"l":"Policy clusters","t":"Mega Food Parks and One District One Product draw units together."},{"l":"New eastern hubs","t":"Bihar's Makhana Board and new NIFTEM open eastern hubs."}],"cue":"Farms → cities → ports → clusters → eastern hubs."},{"k":"against","q":"What keeps food processing away from lagging regions?","rows":[{"l":"Weak infrastructure","t":"Poor power, roads and cold chains keep units out of the east."},{"l":"Distant buyers","t":"Thin local demand raises freight and spoilage costs."},{"l":"Clustering","t":"Investment piles into Maharashtra, Gujarat and Andhra Pradesh."},{"l":"Subsidy shopping","t":"Differing state incentives make units chase subsidies, not raw material."},{"l":"Land, credit, skills","t":"Land-conversion hurdles, costly credit and skill gaps favour cities."}],"cue":"Weak infrastructure → distant buyers → clustering → subsidy shopping → land and skills."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Shared rural infrastructure","t":"Build processing centres and cold chains in the east through PMKSY clusters."},{"l":"Freight links","t":"Link farm hubs to cities and ports through Kisan Rail and Gati Shakti."},{"l":"Local crop strengths","t":"Anchor units to local crops through One District One Product."},{"l":"Plug-and-play sheds","t":"Ease land conversion and offer ready sheds with single-window clearance."},{"l":"Local skills","t":"Set up food-technology institutes near farm belts, like NIFTEM Bihar."}],"cue":"Shared infrastructure → freight links → local crops → ready sheds → local skills."},{"k":"data","q":"Which examples show location choices?","title":"Data","rows":[{"l":"Patanjali, Haridwar","t":"A food park creating rural jobs and farmer links."},{"l":"Mithila makhana","t":"Bihar grows about [[80%]] of India's makhana, with a GI tag since 2022."},{"l":"Makhana Board","t":"Budget 2025-26 set it up for processing and marketing through FPOs."},{"l":"Makhana yields","t":"Traditional methods give 1.7–1.9 t/ha, against [[3–3.5 t/ha]] with improved seeds."}]}]},{"id":"GS36-upstream-and-downstream-requirements-and","line":"GS3.6","part":"","name":"Upstream and downstream supply chain (food processing)","own":false,"cards":[{"k":"define","text":"Upstream: everything before the factory gate (inputs, farming, aggregation, storage, transport of raw produce). Downstream: everything after processing (packaging, branding, distribution, retail, exports).","q":"What are the upstream and downstream requirements of food processing?"},{"k":"for","rows":[{"l":"Assured raw material","t":"Contract farming and FPOs supply the right variety and quality."},{"l":"Storage and finance","t":"Warehouses and loans against e-NWRs."},{"l":"Cold chain","t":"PMKSY funds cold chains and [[50]] irradiation units."},{"l":"Food safety","t":"[[100]] NABL food testing labs and FSSAI standards."},{"l":"Market access","t":"ONDC and [[100%]] FDI for e-commerce in Indian-made food."},{"l":"Exports","t":"PLISFPI supports Indian brands abroad."}],"q":"What strengthens the food processing supply chain?","cue":"Raw material → storage and finance → cold chain → testing → market access → exports."},{"k":"against","rows":[{"l":"Finance","t":"Small units cannot afford cold storage or carry stock."},{"l":"Skills","t":"Farmers lack training in grading and hygiene."},{"l":"Road dependence","t":"About [[97%]] of fruits and vegetables travel by road."},{"l":"Few reefers","t":"Only about [[4%]] of fruits move in refrigerated trucks."},{"l":"Middlemen","t":"Farmers get about a third of the consumer rupee for tomato, onion and potato."},{"l":"Traceability","t":"Small traders keep weak digital records."},{"l":"Rules","t":"APMC rules and stock limits deter bulk buying."},{"l":"Losses","t":"About [[30–40%]] of fruits and vegetables are lost after harvest."}],"q":"Where does the food processing supply chain break down?","cue":"No money → no training → road-only → few reefers → middlemen → no traceability → APMC limits → losses."},{"k":"value","rows":[{"l":"Loss estimate","t":"ICAR-CIPHET put harvest losses at about [[₹93,000 crore]] a year."},{"l":"Thinking framework","t":"Plant products need regulation, animal products also need health and environment."},{"l":"Conclusion anchor","t":"SDG 12.3 aims to halve food waste by 2030."},{"l":"PMKSY","t":"About [[₹6,500 crore]] for 2021-26, including irradiation units and testing labs."},{"l":"PMKSY parts","t":"Cold chains, agro-processing clusters, linkages and food safety."},{"l":"Cold storage built","t":"About [[10.3 lakh]] MT by 2023."},{"l":"NABARD fund","t":"A [[$263 mn]] Food Processing Fund lends to Mega Food Parks."}],"q":"Which schemes and data address supply-chain gaps?"},{"k":"diagram","q":"Draw the diagram for Upstream and downstream supply chain (food processing)","g":{"dir":"LR","nodes":[["I","Inputs and farm"],["A","Aggregation - FPOs, contract farming"],["S","Storage and cold chain"],["P","Processing unit"],["D","Packaging and branding"],["M","Retail, e-commerce, exports"]],"edges":[["I","A",""],["A","S",""],["S","P",""],["P","D",""],["D","M",""]]}}]},{"id":"GS36-micro-food-processing-units","line":"GS3.6","part":"","name":"Micro food processing units","own":true,"cards":[{"k":"define","q":"What are micro food processing units?","text":"Small, mostly unregistered, largely rural and family-run units such as flour and oil mills, pickles, papad, jaggery and sweets."},{"k":"for","q":"Why do micro food processing units matter?","rows":[{"l":"Local margins","t":"Profits stay with farmers, SHGs and FPOs, encouraging diversification."},{"l":"Women entrepreneurs","t":"[[44%]] of PMFME beneficiaries are women."},{"l":"Less wastage","t":"Processing near the farm saves perishables."},{"l":"Less migration","t":"Steady village work curbs distress migration."},{"l":"Collective scale","t":"SHGs and FPOs share facilities in ODOP clusters."}],"cue":"Local margins → women → less waste → less migration → collective scale."},{"k":"against","q":"What holds micro food processing units back?","rows":[{"l":"Costly credit","t":"Collateral demands and complex procedures block loans."},{"l":"Small scale","t":"No brands, small volumes and seasonal inputs limit competition."},{"l":"Old machinery","t":"Outdated machines, erratic power and no common facilities."},{"l":"Compliance","t":"FSSAI and GST rules burden informal units with little training."},{"l":"Uneven uptake","t":"Uptake is concentrated in a few states, led by Bihar."}],"cue":"Credit → scale → machinery → compliance → uneven uptake."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Credit subsidy","t":"PMFME gives a [[35%]] credit-linked subsidy up to ₹10 lakh."},{"l":"Seed capital","t":"[[₹40,000]] per SHG member."},{"l":"Shared hubs","t":"[[108]] common facilities sanctioned, 59 working by December 2025."},{"l":"Branding","t":"PMFME pays [[50%]] of branding and marketing costs."},{"l":"Formalisation","t":"About [[59,000]] units formalised under PMFME by December 2025."},{"l":"Training","t":"About [[1.8 lakh]] trained, 77% of them women."}],"cue":"Credit → seed capital → shared hubs → branding → formalise → train."},{"k":"diagram","q":"Draw the diagram for Micro food processing units","g":{"dir":"TD","nodes":[["P","PMFME"],["C","35% credit-linked subsidy"],["S","Seed capital for SHGs"],["O","One District One Product"],["I","Common infrastructure"],["B","Branding and marketing"]],"edges":[["P","C",""],["P","S",""],["P","O",""],["P","I",""],["P","B",""]]}},{"k":"data","q":"How does PMFME support micro units?","title":"Data","rows":[{"l":"PMFME","t":"A [[₹10,000 crore]] scheme from 2020, built on One District One Product."},{"l":"Target crossed","t":"[[2 lakh]] units reached in July 2026, creating about 11 lakh jobs."},{"l":"Budget","t":"About [[₹2,000 crore]] for PMFME and ₹1,400 crore for PLISFPI."}]},{"k":"data","q":"What is the scale of micro food processing?","rows":[{"l":"Units and jobs","t":"About [[25 lakh]] units give 74% of the sector's jobs."},{"l":"Profile","t":"[[66%]] are rural and 80% family-run."},{"l":"Under-resourced","t":"They get [[3%]] of credit but make 12% of output."}]}]},{"id":"GS36-data-x","line":"GS3.6","part":"","name":"Food processing: key data","own":true,"cards":[{"k":"data","title":"Lines","q":"Which lines can you quote?","rows":[{"l":"Nutraceuticals","t":"Foods made for specific dietary needs. (ES 2025-26)"}]}]},{"id":"GS37-land-titling","line":"GS3.7","part":"","name":"Land Titling","own":true,"cards":[{"k":"define","q":"What is land titling?","text":"A legal guarantee of ownership of a parcel of land, backed by accurate records and maps."},{"k":"for","q":"Why does India need conclusive land titles?","rows":[{"l":"Credit","t":"Clear titles can be pledged for bank loans."},{"l":"Fewer court cases","t":"Land cases are about [[66%]] of civil litigation."},{"l":"Safe leasing","t":"Owners can lease without fear of losing land."},{"l":"Faster acquisition","t":"Clear owners make compensation quick and fair."},{"l":"Better targeting","t":"Verified plots link to PM-KISAN and insurance through AgriStack."}],"cue":"Credit → fewer cases → safe leasing → faster acquisition → better targeting."},{"k":"against","q":"What stands in the way of clear land titles?","rows":[{"l":"Presumptive titles","t":"Records show who pays revenue, not guaranteed ownership."},{"l":"Unintegrated records","t":"[[99.8%]] of records and 97% of maps are digital, but only 84% integrated."},{"l":"Unmapped homesteads","t":"Village homes (abadi) lack legal records."},{"l":"Tiny holdings","t":"[[86%]] of farmers own under 2 ha, so titles alone don't help."},{"l":"Unrecorded changes","t":"Oral tenancies, late mutations and high stamp duty."}],"cue":"Presumptive titles → unintegrated maps → unmapped homes → tiny plots → unrecorded changes."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Conclusive titling","t":"State-guaranteed titles on Torrens lines, per NITI Aayog's draft law."},{"l":"Unique plot IDs","t":"Bhu-Aadhaar covers about [[41 crore]] parcels."},{"l":"Drone mapping","t":"SVAMITVA has prepared about [[3.2 crore]] property cards."},{"l":"Leasing laws","t":"Protect owners and tenants, as the 2016 model Act does."},{"l":"Automatic mutations","t":"Update records automatically after sale and lower stamp duty."}],"cue":"Conclusive titles → plot IDs → drone maps → leasing laws → automatic mutations."},{"k":"data","q":"Which schemes and data back up land titling?","title":"Data","rows":[{"l":"Holdings","t":"Small and marginal holdings are [[86%]] of holdings but 47% of area."},{"l":"DILRMP 3.0","t":"About [[₹565 crore]] for 2026-31, giving every parcel a Bhu-Aadhaar."},{"l":"Accuracy push","t":"The Standing Committee wants records accurate and legally valid, not just digital."},{"l":"SVAMITVA loans","t":"Property cards have backed loans of about [[₹1,700 crore]]."},{"l":"Earlier schemes","t":"Revenue administration scheme (1987-88) and NLRMP (2008), merged into DILRMP."}]}]},{"id":"GS37-land-reforms","line":"GS3.7","part":"","name":"Land reforms","own":true,"cards":[{"k":"define","q":"What are land reforms?","text":"Changes in who owns and who tills land, meant to end feudal relations, give land to the tiller, and raise productivity."},{"k":"list","q":"What is the constitutional basis of land reforms?","rows":[{"l":"State subject","t":"Land is Entry [[18]] of the State List."},{"l":"First Amendment (1951)","t":"It added Articles 31A, 31B and the Ninth Schedule."},{"l":"Guiding principle","t":"Article [[39]](b) and (c)."}]},{"k":"list","q":"What were the main land reform measures?","rows":[{"l":"Zamindari abolition","t":"Intermediaries were removed in the early 1950s."},{"l":"Tenancy reform","t":"Fair rent, secure tenure and ownership for tenants."},{"l":"Ceiling","t":"Surplus land above the limit is redistributed."},{"l":"Consolidation","t":"Scattered plots are joined, as in Punjab and Haryana."},{"l":"Bhoodan","t":"Vinoba Bhave's 1951 land-gift movement."},{"l":"Land records","t":"Updating and digitising records."}],"cue":"Abolish zamindars → reform tenancy → impose ceilings → consolidate → Bhoodan → records."},{"k":"for","q":"What did land reforms achieve?","rows":[{"l":"Redistribution","t":"About [[2 million]] ha of surplus land went to 57 lakh beneficiaries."},{"l":"West Bengal poverty","t":"Rural poverty fell about [[56%]] from 1972-73 to 1999-2000."},{"l":"Higher productivity","t":"Operation Barga raised rice yields about [[20%]]."},{"l":"Barga's share of growth","t":"It explains about [[28%]] of productivity growth and 36% of farm growth."},{"l":"Dignity","t":"Registered tenants escaped forced labour and gained a panchayat voice."},{"l":"Credit","t":"Recorded rights unlock bank loans instead of moneylenders."},{"l":"Viable farms","t":"Consolidation in Punjab and Haryana created viable family farms."}],"cue":"Redistribution → poverty → productivity → Barga's share → dignity → credit → viable farms."},{"k":"against","q":"Why did land reforms fall short in most states?","rows":[{"l":"Loopholes","t":"Benami transfers, khudkasht claims and exemptions let landlords keep land."},{"l":"Hidden tenancy","t":"About [[17%]] of holdings lease land, mostly orally."},{"l":"Poor records","t":"Old records and fear of eviction kept sharecroppers unregistered."},{"l":"Women and Dalits","t":"They were often left out of redistribution."},{"l":"Shrinking farms","t":"Average holding fell from 1.1 to [[0.7 ha]], 2015-16 to 2021-22."},{"l":"Costs","t":"Compensation and surveys strained state budgets."}],"cue":"Loopholes → hidden tenancy → poor records → women and Dalits → shrinking farms → costs."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Political will","t":"Heritable tenant rights plus peasant mobilisation, as in Kerala and West Bengal."},{"l":"Village drives","t":"Register tenants in village camps, like Operation Barga."},{"l":"Legal leasing","t":"Follow NITI Aayog's 2016 model leasing Act."},{"l":"Inputs with land","t":"Give credit, seeds and irrigation alongside land rights."},{"l":"Stop fragmentation","t":"Joint family titles, FPO pooling and voluntary consolidation."}],"cue":"Political will → village drives → legal leasing → inputs → stop fragmentation."},{"k":"data","rows":[{"l":"West Bengal titles","t":"Distributed [[6.7%]] of farmland, against a 1.35% national average."},{"l":"Land inequality","t":"The top 10% own about [[45%]] of farmland."},{"l":"Tenancy reform","t":"About [[11 million]] tenants got ownership."},{"l":"West Bengal Gini","t":"Land Gini fell from 0.67 to [[0.60]], 1970 to 1990."},{"l":"West Bengal ownership","t":"Marginal ownership rose about [[84%]]."},{"l":"Kerala","t":"About 1.5 million became owners, and rural poverty fell from 69% to [[29%]] (not traced)."},{"l":"Andhra Pradesh","t":"Beneficiaries are about [[24%]] more likely to attend village meetings."}],"q":"What data and examples show the effect of land reforms?"},{"k":"data","rows":[{"l":"Land to the tiller","t":"The core slogan of tenancy reform."},{"l":"Conclusion anchors","t":"Article 39(b) and (c), and SDG 1.4 on secure land rights."},{"l":"Conclusion","t":"Gains depend on how well land reform is implemented."},{"l":"UP Act, 1950","t":"The first major law abolishing intermediaries."},{"l":"Operation Barga (1978)","t":"Over [[65%]] of 2.3 million sharecroppers, about 1.5 million, recorded by 1993."},{"l":"Barga and poverty","t":"Rural poverty fell from 64% (1983) to 41% (1993-94) and [[29%]] (2004-05)."},{"l":"Taiwan (1949–53)","t":"Tenant-farmed land fell from 41% to [[16%]]."},{"l":"Land records","t":"DILRMP and SVAMITVA modernise records."}],"q":"What data and examples show the effect of land reforms?"},{"k":"diagram","q":"Draw the diagram for Land reforms","g":{"dir":"TD","nodes":[["L","Land reforms"],["Z","Abolition of intermediaries - zamindari"],["T","Tenancy reform - Operation Barga"],["C","Ceiling and redistribution"],["K","Consolidation of holdings"],["R","Land records - DILRMP, SVAMITVA"]],"edges":[["L","Z",""],["L","T",""],["L","C",""],["L","K",""],["L","R",""]]}},{"k":"data","q":"What made land reforms work where they succeeded?","title":"Data","rows":[{"l":"Local institutions","t":"Panchayats helped identify beneficiaries in West Bengal."},{"l":"Top-down plus bottom-up","t":"Officials identified beneficiaries while peasant groups mobilised them."}]}]},{"id":"GS37-land-ceiling","line":"GS3.7","part":"","name":"Land Ceiling","own":true,"cards":[{"k":"define","q":"What is a land ceiling?","text":"A legal maximum on the land a family may hold; land above it is taken as surplus and given to the landless."},{"k":"for","q":"Why impose land ceilings?","rows":[{"l":"Small farms more productive","t":"Small holdings give over [[3x]] the output per hectare of large ones."},{"l":"Idle land used","t":"Landless, labour-rich households farm land large owners leave idle."},{"l":"No absentee landlords","t":"It rewards cultivation over rent-seeking."},{"l":"Wider demand","t":"Income spreads across more households."},{"l":"No new estates","t":"It stops land concentration and hoarding."}],"cue":"Small farms → idle land used → no absentee landlords → wider demand → no new estates."},{"k":"against","q":"What are the problems with land ceilings?","rows":[{"l":"Little land caught","t":"Declared surplus was only about [[1%]] of cultivable land."},{"l":"Evasion","t":"Benami deals, family partitions and exemptions dodged ceilings."},{"l":"Unviable farms","t":"NABARD puts the viable size at about [[1.65 ha]]."},{"l":"Deters investment","t":"It raises the cost of assembling land for industry."},{"l":"Poor land given","t":"Surplus land was often barren, and allottees lacked inputs."}],"cue":"Little caught → evasion → unviable farms → deters investment → poor land."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Legal leasing","t":"Let farmers lease beyond [[1.65 ha]] without breaching ceilings."},{"l":"FPO pooling","t":"[[10,000]] FPOs give scale without concentrating ownership."},{"l":"Digital records","t":"Bhu-Aadhaar plot tags plug evasion."},{"l":"Support allottees","t":"Give redistributed land credit, irrigation and soil repair."},{"l":"Land banks","t":"Transparent land banks supply industry without displacing smallholders."}],"cue":"Leasing → FPOs → digital records → support allottees → land banks."},{"k":"data","q":"What are the ceiling norms and numbers?","title":"Data","rows":[{"l":"Ceiling surplus","t":"About [[68 lakh]] acres were declared surplus."},{"l":"Bhoodan","t":"About 39 lakh acres donated and [[22 lakh]] distributed."},{"l":"USA holding","t":"The average farm is about [[187 ha]]."},{"l":"J&K Big Landed Estates Act, 1950","t":"Surplus land went to tillers without compensation."}]},{"k":"data","q":"What were the 1972 land ceiling guidelines?","rows":[{"l":"Before 1972","t":"Ceilings applied to individuals, so owners split land among relatives."},{"l":"1972 guidelines","t":"A family of five could hold [[10–18]] acres of double-crop irrigated land."},{"l":"Other land","t":"27 acres of single-crop land, up to [[54]] acres of dry land."}]}]},{"id":"GS37-land-leasing-and-tenancy-reform","line":"GS3.7","part":"","name":"Land Leasing and Tenancy Reform","own":true,"cards":[{"k":"define","q":"What is legalised land leasing?","text":"Legalised leasing lets owners rent out farmland while retaining ownership title, ending unrecorded oral deals (concealed tenancy)."},{"k":"for","q":"What are the benefits of legalising land leasing?","rows":[{"l":"Consolidation","t":"Leasing pools fragmented plots and revives fallow land."},{"l":"Tenant access","t":"Recorded tenants get KCC loans and PMFBY insurance."},{"l":"Owners free to move","t":"Owners can take non-farm jobs without losing land."},{"l":"Contract farming scale","t":"Larger operated areas suit FPOs and contract farming."},{"l":"Women's collectives","t":"Groups like Kudumbashree lease and farm land jointly."}],"cue":"Consolidate → tenant access → owners move → contract scale → women's collectives."},{"k":"against","q":"What holds back leasing reform?","rows":[{"l":"Restrictive laws","t":"Kerala, J&K and Manipur ban leasing outright."},{"l":"Owner fear","t":"Land-to-the-tiller laws make owners fear losing title."},{"l":"Tenants excluded","t":"Unrecorded tenants miss PM-KISAN, subsidies and credit."},{"l":"Weak bargaining","t":"Tenants face high rents, eviction and short-term farming."},{"l":"Slow adoption","t":"Only UP, Uttarakhand and MP have acted on the model law."}],"cue":"Restrictive laws → owner fear → tenants excluded → weak bargaining → slow adoption."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Model law","t":"Adopt the 2016 model Act, with land returned when the lease ends."},{"l":"Lease registry","t":"Record leases separately, conferring no title."},{"l":"Delink benefits","t":"Give loans and insurance on registered leases, like AP's eligibility cards."},{"l":"Group leasing","t":"Scale women's SHG and FPO leasing, as in Kudumbashree."},{"l":"Quick disputes","t":"Settle disputes in village tribunals, not civil courts."}],"cue":"Model law → lease registry → delink benefits → group leasing → quick disputes."},{"k":"data","q":"What do the model law and data say?","title":"Data","rows":[{"l":"Tenancy","t":"About [[13%]] of area was leased in 2019, up from 10%."},{"l":"Model Act, 2016","t":"Tenants get credit and insurance while owners keep full title."},{"l":"Disputes","t":"A special land tribunal settles them."},{"l":"Adoption","t":"Only Uttar Pradesh, Uttarakhand and Madhya Pradesh have acted."}]}]},{"id":"GS37-larr-act-2013","line":"GS3.7","part":"","name":"LARR Act, 2013","own":true,"cards":[{"k":"define","q":"What is the LARR Act, 2013?","text":"Governs land acquisition by the state, with fair compensation, social impact assessment, consent for private and PPP projects, and rehabilitation and resettlement; replaced the Land Acquisition Act, 1894."},{"k":"for","q":"What does the LARR Act, 2013 get right?","rows":[{"l":"Fair compensation","t":"Up to four times market value in rural areas, against [[1.3]] times before."},{"l":"Consent","t":"[[80%]] of owners must agree for private projects and 70% for PPPs."},{"l":"Social Impact Assessment","t":"Public hearings before acquisition cut protests."},{"l":"R&R for all","t":"Landless labourers and tenants also get rehabilitation."},{"l":"SC/ST safeguards","t":"Land for land and a one-time [[₹50,000]] grant."},{"l":"Food security","t":"Irrigated multi-crop land is protected, and unused land returns after five years."}],"cue":"Fair price → consent → SIA → R&R for all → SC/ST → food security."},{"k":"against","q":"What are the criticisms of the LARR Act, 2013?","rows":[{"l":"Delays","t":"Acquisition time rose from about 6 months to [[4.5]] years."},{"l":"High costs","t":"Fourfold rural compensation makes projects unviable."},{"l":"State dilutions","t":"States like Gujarat and Tamil Nadu diluted consent under Article 254(2)."},{"l":"Undervaluation","t":"A CAG review found nearby sale prices were ignored."},{"l":"Farmland still lost","t":"Conversion continues through state routes and land pooling."}],"cue":"Delays → high costs → state dilutions → undervaluation → farmland lost."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Land pooling","t":"Make farmers equity partners, as in Gujarat's town planning schemes."},{"l":"Land banks","t":"Use barren and PSU land before fertile farms."},{"l":"Time-bound SIA","t":"Fix SIA deadlines and use transparent circle rates."},{"l":"Annuities","t":"Pay annuities, not lump sums, as Haryana does."},{"l":"LARR Authorities","t":"Time-bound authorities settle valuation and R&R disputes."}],"cue":"Land pooling → land banks → time-bound SIA → annuities → LARR Authorities."},{"k":"diagram","q":"Draw the diagram for LARR Act, 2013","g":{"dir":"LR","nodes":[["S","Social Impact Assessment"],["C","Consent - 70% PPP, 80% private"],["P","Compensation - up to 4x rural, 2x urban"],["R","Rehabilitation and resettlement"]],"edges":[["S","C",""],["C","P",""],["P","R",""]]}},{"k":"data","q":"What example shows the cost of delay?","title":"Data","rows":[{"l":"Sardar Sarovar","t":"Delays cost about [[$200 mn]] a year."}]},{"k":"data","q":"When did the LARR Act take effect, and under which list?","rows":[{"l":"Full name","t":"Right to Fair Compensation and Transparency in Land Acquisition, Rehabilitation and Resettlement Act."},{"l":"In force","t":"From [[1]] January 2014."},{"l":"Constitutional basis","t":"Concurrent List, Entry [[42]]."}]}]},{"id":"GS38-liberalisation","line":"GS3.8","part":"Effects of liberalisation","name":"Liberalisation","own":true,"cards":[{"k":"define","text":"Reducing state control over trade, investment and industry so that private and foreign firms can compete.","q":"What is meant by liberalisation?"}]},{"id":"GS38-friendshoring-and-nearshoring","line":"GS3.8","part":"Effects of liberalisation","name":"Friendshoring and nearshoring","own":true,"cards":[{"k":"define","text":"Friendshoring: moving supply chains to allied countries. Nearshoring: relocating processes or manufacturing to a nearby country to cut transport cost and delivery time.","q":"What is meant by friendshoring and nearshoring?"},{"k":"value","rows":[{"l":"Survey trend","t":"Friendshoring, nearshoring and trade concentration are all rising. (ES 2025-26)"}],"q":"What schemes, data and examples back up Friendshoring and nearshoring?"}]},{"id":"GS38-economic-statecraft","line":"GS3.8","part":"Effects of liberalisation","name":"Economic statecraft","own":true,"cards":[{"k":"define","text":"Using economic tools (trade, finance, supply chains) to achieve political and strategic goals.","q":"What is meant by economic statecraft?"},{"k":"value","rows":[{"l":"Survey prologue","t":"Policy must secure supply, build buffers and diversify routes and payments. (ES 2025-26)"},{"l":"Key line","t":"Credibility and predictability become strategic assets, not mere virtues. (ES 2025-26)"},{"l":"Kautilya","t":"The Arthashastra is an early Indian example."},{"l":"Roman grain reserve","t":"Rome's grain-provisioning system worked like a strategic grain reserve."}],"q":"What schemes, data and examples back up Economic statecraft?"}]},{"id":"GS38-trade-diversion","line":"GS3.8","part":"Effects of liberalisation","name":"Trade diversion","own":true,"cards":[{"k":"define","text":"Shift of imports from a lower-cost non-member to a higher-cost FTA partner purely because of preferential tariffs; the opposite of trade creation.","q":"What is meant by trade diversion?"}]},{"id":"GS38-mfn-status","line":"GS3.8","part":"Effects of liberalisation","name":"MFN status","own":true,"cards":[{"k":"define","text":"Most Favoured Nation: the WTO rule that a tariff concession given to one member must be extended to all members.","q":"What is meant by MFN status?"}]},{"id":"GS38-ftas","line":"GS3.8","part":"Effects of liberalisation","name":"FTAs","own":true,"cards":[{"k":"define","text":"Agreements in which partners cut tariffs on most trade between them.","q":"What are FTAs?"},{"k":"data","q":"Where does India stand on FTAs?","rows":[{"l":"RCEP exit","t":"India left RCEP in 2019 over Chinese dumping and farm concerns."},{"l":"New FTAs","t":"India has since signed bilateral deals, from the UAE to the EU."}]},{"k":"for","rows":[{"l":"Export market access","t":"India's share of world merchandise exports is only [[1.8%]]."},{"l":"Cost of staying out","t":"Joining RCEP could have added up to [[$60 bn]] by 2030."},{"l":"Building blocks","t":"Regional deals can pave the way when WTO talks stall."},{"l":"GVC integration","t":"Cheaper inputs and assured markets help firms join global value chains."},{"l":"Supply-chain diversification","t":"More partners reduce dependence on one dominant supplier."},{"l":"FDI and technology","t":"Assured market access draws foreign investment."},{"l":"Services strength","t":"India's share of world services exports rose from 2% to [[4.3%]] since 2005."}],"q":"Why should India sign FTAs?","cue":"Markets → cost of staying out → building blocks → GVCs → diversification → FDI → services."},{"k":"against","rows":[{"l":"Supply side unfixed","t":"Gains need cheaper capital, better logistics and quality norms first."},{"l":"Trade diversion","t":"Imports shift to costlier partners because of preferential tariffs."},{"l":"Sensitive sectors","t":"Dairy and farming are exposed, and dumping can route through partners."},{"l":"MFN erosion","t":"Preferences for partners dilute equal treatment of all WTO members."},{"l":"Uneven benefits","t":"Large firms and services gain faster than small producers."}],"q":"What are the risks of FTAs?","cue":"Supply side unfixed → diversion → sensitive sectors → MFN eroded → big firms gain."},{"k":"value","rows":[{"l":"Services gain","t":"FTAs like the one with the UK boost services. (ES 2025-26)"},{"l":"Foreign Trade Policy 2023","t":"The target is [[$2 trillion]] in exports by 2030."}],"q":"What data and targets back up India’s trade strategy?"}]},{"id":"GS38-some-terms-definition","line":"GS3.8","part":"Effects of liberalisation","name":"Key terms: globalisation and liberalisation","own":true,"cards":[{"k":"list","rows":[{"l":"Globalisation","t":"Countries integrating through free flow of goods, services, capital, technology and people."},{"l":"Liberalisation","t":"Removing government restrictions to promote private enterprise and competition."},{"l":"Privatisation","t":"Transferring ownership or management of public enterprises to private hands."},{"l":"Economic integration","t":"Countries cutting trade and investment barriers to connect their markets."},{"l":"Deglobalisation","t":"Reversing integration through less cross-border trade, investment and supply-chain dependence."},{"l":"Protectionism","t":"Restricting imports through tariffs and quotas to protect domestic industry."},{"l":"Technological displacement","t":"Job losses from automation, imported technology and global competition."},{"l":"Excess labour supply","t":"More workers than available jobs."}],"q":"Define the key terms of globalisation and liberalisation."}]},{"id":"GS38-lpg-reforms-of-1991","line":"GS3.8","part":"Effects of liberalisation","name":"LPG reforms of 1991","own":true,"cards":[{"k":"define","q":"What were the LPG reforms of 1991?","text":"Liberalisation, privatisation and globalisation: reforms launched after the 1991 balance-of-payments crisis to open India’s economy to markets and the world."},{"k":"list","q":"What did the 1991 reforms do?","rows":[{"l":"Trigger","t":"Forex reserves covered only about [[3 weeks]] of imports."},{"l":"Measures","t":"Delicensing, automatic FDI, devaluation, tariff cuts and fewer PSU-reserved sectors."},{"l":"Outcome","t":"Growth rose past the [[3.5%]] Hindu rate of growth."}],"cue":"Crisis → measures → outcome."},{"k":"for","q":"What were the positive effects of the 1991 reforms?","rows":[{"l":"Faster growth","t":"Average growth doubled from about 3.5% to [[6–7%]]."},{"l":"BoP resilience","t":"Forex reserves rose from 3 weeks of imports to over [[$700 bn]]."},{"l":"Trade integration","t":"India now has [[4.3%]] of world services exports."},{"l":"Global Indian firms","t":"Indian firms went global, for example Tata buying JLR in 2008."},{"l":"Modern finance","t":"Bank reforms and a statutory SEBI modernised banking and capital markets."}],"cue":"Growth → forex → trade → global firms → finance."},{"k":"against","q":"What were the negative effects of the 1991 reforms?","rows":[{"l":"Agriculture bypassed","t":"Rural livelihoods gained little, widening sectoral and regional gaps."},{"l":"Informal jobs","t":"Contract workers are [[42%]] of organised manufacturing workers."},{"l":"Premature deindustrialisation","t":"Manufacturing stagnated at about [[15–17%]] of GDP."},{"l":"Rising inequality","t":"Income and wealth concentrated at the top, with oligopolies in key sectors."},{"l":"Lost brands","t":"Foreign MNCs bought leading Indian brands, like Thums Up in 1993."}],"cue":"Farms left out → informal jobs → deindustrialisation → inequality → lost brands."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Agricultural reform","t":"Extend reforms to farm markets, cold chains and agro-processing."},{"l":"Labour-intensive manufacturing","t":"Use PLI to build factories and cut import dependence."},{"l":"Formal jobs","t":"Simplify labour codes and reward formal hiring."},{"l":"Competition and R&D","t":"Strong antitrust and R&D support help Indian firms scale."},{"l":"Factor-market reform","t":"Reform land, power and logistics, for example through PM Gati Shakti."}],"cue":"Farms → factories → formal jobs → competition → factor markets."},{"k":"diagram","q":"Draw the diagram for LPG reforms of 1991","g":{"dir":"TD","nodes":[["C","1991 BoP crisis"],["L","Liberalisation - delicensing"],["P","Privatisation - disinvestment"],["G","Globalisation - tariffs cut, FDI opened"],["O","Competition, MNC entry, Indian firms go global"]],"edges":[["C","L",""],["C","P",""],["C","G",""],["L","O",""],["P","O",""],["G","O",""]]}},{"k":"data","q":"How have Indian firms competed with MNCs?","title":"Data","rows":[{"l":"Indian firms vs MNCs","t":"TCS, Infosys and Wipro rank among the world's largest IT firms."},{"l":"MNCs still lead","t":"FMCG is still led by MNCs like HUL."}]}]},{"id":"GS38-globalisation-and-informalisation","line":"GS3.8","part":"Effects of liberalisation","name":"Globalisation and Informalisation","own":true,"cards":[{"k":"define","q":"What is informalisation?","text":"Informalisation is the rising share of work without a written contract, social security, or job security, including contract workers inside formal firms."},{"k":"for","q":"How did globalisation reduce formal jobs?","rows":[{"l":"Price competition","t":"Contract workers rose from 20% to [[42%]] of organised manufacturing workers."},{"l":"Outsourcing chains","t":"Large firms subcontract to small informal suppliers and home workers."},{"l":"Automation","t":"Imported machinery displaces routine formal jobs."},{"l":"Rigid labour laws","t":"The old 100-worker rule pushed firms to stay small or use contractors."},{"l":"Volatile demand","t":"Global swings and platforms favour piece-rate, on-demand hiring."},{"l":"Formal jobs lost","t":"About [[9 million]] formal jobs were lost between 2011-12 and 2017-18."}],"cue":"Price pressure → outsourcing → automation → rigid laws → volatile demand → formal jobs lost."},{"k":"against","q":"Is informalisation always harmful?","rows":[{"l":"No social security","t":"Over half of regular wage workers lack social security."},{"l":"Low productivity","t":"Small informal units lack scale, credit and technology."},{"l":"Narrow tax base","t":"Unrecorded activity shrinks the revenue for public investment."},{"l":"Weak demand","t":"Low, volatile wages suppress spending and widen inequality."},{"l":"Entry route, but a trap","t":"Contract jobs offer entry but rarely lead to permanent work."}],"cue":"No security → low productivity → narrow tax base → weak demand → trap."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Labour Codes","t":"Raise the layoff threshold to [[300]] and mandate appointment letters."},{"l":"Portable benefits","t":"Register informal and gig workers on e-Shram for portable benefits."},{"l":"Reward formal hiring","t":"Subsidise employer contributions, as PM Viksit Bharat Rozgar Yojana does."},{"l":"Formal supply chains","t":"Link small suppliers to credit and payment platforms like TReDS."},{"l":"Industry-aligned skilling","t":"Align apprenticeships with industry demand."}],"cue":"Labour Codes → portable benefits → reward hiring → formal supply chains → skills."}]},{"id":"GS38-premature-deindustrialisation","line":"GS3.8","part":"Effects of liberalisation","name":"Premature deindustrialisation","own":true,"cards":[{"k":"define","q":"What is premature deindustrialisation?","text":"When manufacturing’s share of output and jobs peaks at a much lower income level than it did in today’s rich countries (Dani Rodrik)."},{"k":"for","q":"Why did services grow faster than industry in India?","rows":[{"l":"Telecom reforms","t":"Phone connections grew from 10 million to over [[1 billion]]."},{"l":"English-speaking workforce","t":"IT services grew about [[30%]] a year after 1991."},{"l":"Little infrastructure needed","t":"Services exports need no ports or highways."},{"l":"Factories held back","t":"Land, labour, power and logistics bottlenecks kept factories uncompetitive."},{"l":"Capital for services","t":"Easier FDI and financial reforms mostly helped modern services."}],"cue":"Telecom → English skills → no ports needed → factories blocked → capital to services."},{"k":"against","q":"Can India develop without industry?","rows":[{"l":"Too few jobs","t":"Services give [[56%]] of GVA but only 30% of jobs."},{"l":"Weak linkages","t":"High-end services absorb mainly educated workers."},{"l":"Goods deficit","t":"Services alone cannot pay for growing goods imports."},{"l":"Regional inequality","t":"Growth concentrates in service hubs like Bengaluru."},{"l":"Counter-view","t":"Manufacturing's real share has held at about [[17–18%]] of GVA. (ES 2025-26)"}],"cue":"Few jobs → weak linkages → goods deficit → regional gaps → counter-view."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Cut factory costs","t":"Reform land, labour and logistics to make factories competitive."},{"l":"Labour-intensive manufacturing","t":"Use PLI in textiles, electronics and leather."},{"l":"Agro-processing","t":"Rural food processing bridges farm exits and urban jobs."},{"l":"Factory skills","t":"Align apprenticeships with modern factory needs."},{"l":"R&D and design","t":"Use India's service strengths to add design value to manufacturing."}],"cue":"Costs → labour-intensive factories → agro-processing → skills → R&D."},{"k":"diagram","q":"Draw the diagram for Premature deindustrialisation","g":{"dir":"LR","nodes":[["A","Agriculture"],["I","Industry - mass jobs"],["S","Services"],["S2","India - jump to services, weak industrial base"]],"edges":[["A","I",""],["I","S",""],["A","S2",""]]}},{"k":"data","q":"What data show the services-led pattern?","title":"Data","rows":[{"l":"Apparel exports","t":"India's stagnated at about [[$14.5 bn]] while Bangladesh's grew fast."},{"l":"Services concentration","t":"Four states produce about [[40%]] of services output. (ES 2025-26)"},{"l":"Not system-forcing","t":"Services exports ignore potholes, so they don't force state modernisation. (ES 2025-26)"}]},{"k":"data","q":"How does India show premature deindustrialisation?","rows":[{"l":"Agriculture","t":"Its share fell from 29% of GDP in 1991 to about [[15%]]."},{"l":"Services","t":"Its share rose from 30% to over [[55%]] of GDP."}]}]},{"id":"GS38-protectionism-and-currency-pressures","line":"GS3.8","part":"Effects of liberalisation","name":"Protectionism and currency pressures","own":true,"cards":[{"k":"define","q":"What are protectionism and currency pressures?","text":"Protectionism uses tariffs, quotas, subsidies, and non-tariff barriers to shield domestic industry, while currency manipulation deliberately depresses exchange rates for an export edge."},{"k":"for","q":"What are the gains from protection and a weaker rupee?","rows":[{"l":"Infant industry","t":"Tariffs shield new industries like solar from dumping."},{"l":"Export competitiveness","t":"A weaker rupee and decade-low REER make exports cheaper."},{"l":"Trade balance","t":"Duties on non-essential imports protect domestic jobs."},{"l":"Tariff-jumping FDI","t":"Foreign firms set up local plants, like smartphone assembly."},{"l":"Adjustment space","t":"India stayed off the US currency monitoring list in January 2026."}],"cue":"Shield infants → cheaper exports → trade balance → local plants → adjustment space."},{"k":"against","q":"What challenges do protectionism and currency pressures create for India?","rows":[{"l":"US tariffs","t":"Tariffs peaked at 50% in 2025, and most goods now pay an extra [[10%]]."},{"l":"Imported inflation","t":"The rupee fell about [[9%]] in a year, from ₹87.5 to ₹95.4."},{"l":"BoP strain","t":"The trade deficit hit [[$333.6 bn]] in FY26."},{"l":"Dumping","t":"Goods shut out of the US get diverted into India."},{"l":"Weak multilateralism","t":"The stalled WTO dispute system leaves developing nations exposed."}],"cue":"US tariffs → weak rupee → BoP strain → dumping → weak WTO."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Supply-side competitiveness","t":"Scale manufacturing and cut logistics and capital costs."},{"l":"Diversify markets","t":"Use new FTAs to secure preferential access."},{"l":"Macro buffers","t":"Forex reserves of about [[$700 bn]] and rupee trade absorb shocks."},{"l":"Support exporters","t":"Give targeted credit through the Export Promotion Mission."},{"l":"Trade remedies","t":"Use WTO-compliant anti-dumping duties against diverted goods."}],"cue":"Competitiveness → new markets → buffers → exporter support → trade remedies."},{"k":"data","rows":[{"l":"Export Promotion Mission","t":"It has [[₹25,060 crore]] for FY26 to FY31."},{"l":"Exporter credit guarantee","t":"A [[₹20,000 crore]] scheme with full guarantee cover."},{"l":"India–US interim framework","t":"It removed the extra [[25%]] Russian-oil tariff in February 2026."}],"q":"What data and examples back up Protectionism and currency pressures?"},{"k":"diagram","q":"Draw the diagram for Protectionism and currency pressures","g":{"dir":"LR","nodes":[["T","Tariffs and protectionism abroad"],["E","Exports fall"],["C","Current account deficit widens"],["R","Rupee under pressure"],["F","RBI sells forex, imported inflation"]],"edges":[["T","E",""],["E","C",""],["C","R",""],["R","F",""]]}}]},{"id":"GS38-quality-control-orders","line":"GS3.8","part":"Industrial policy","name":"Quality Control Orders","own":true,"cards":[{"k":"define","q":"What are Quality Control Orders?","text":"Mandatory regulations issued under the Bureau of Indian Standards (BIS) Act, 2016 requiring specified goods—made in India or imported—to meet Indian quality standards before sale."},{"k":"for","q":"Why use Quality Control Orders?","rows":[{"l":"Consumer safety","t":"It keeps hazardous goods like faulty pressure cookers off the market."},{"l":"Curbs cheap imports","t":"Toy imports fell [[52%]] between FY15 and FY23. (ES 2025-26)"},{"l":"Brand India","t":"Common standards lift the reputation of Indian exports."},{"l":"Quality upgrade","t":"Firms upgrade testing and quality control to meet BIS norms."},{"l":"Buyer trust","t":"Buyers can trust quality without costly checks."}],"cue":"Safety → curb cheap imports → Brand India → upgrade → buyer trust."},{"k":"against","q":"What are the problems with Quality Control Orders?","rows":[{"l":"Costlier inputs","t":"[[46]] QCOs on inputs were revoked in 2025-26 after raising costs. (ES 2025-26)"},{"l":"MSME burden","t":"Certification and testing costs push small units toward closure."},{"l":"Trade friction","t":"Partners see sudden QCOs as hidden non-tariff barriers."},{"l":"Testing bottlenecks","t":"Too few labs cause customs delays and input shortages."},{"l":"Export competitiveness","t":"Costlier components make finished exports less competitive."}],"cue":"Input costs → MSME burden → trade friction → testing delays → export hit."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Finished goods only","t":"Limit QCOs to consumer goods with safety risks, not inputs. (ES 2025-26)"},{"l":"MSME relief","t":"Give small firms exemptions, longer transitions and testing subsidies."},{"l":"More testing labs","t":"Expand accredited labs and mutual recognition agreements."},{"l":"Consult first","t":"Consult user industries before notifying new QCOs."},{"l":"Exempt export inputs","t":"Exempt inputs used for R&D or re-export manufacturing."}],"cue":"Finished goods only → MSME relief → more labs → consult first → exempt export inputs."}]},{"id":"GS38-industrial-policy","line":"GS3.8","part":"Industrial policy","name":"Industrial policy","own":true,"cards":[{"k":"define","q":"What is meant by industrial policy?","text":"The state’s choice of which sectors it reserves, licenses, protects or promotes."},{"k":"for","q":"Can recent changes raise industrial growth?","rows":[{"l":"PLI scale","t":"PLI has drawn about [[₹2.6 lakh crore]] of investment."},{"l":"Logistics","t":"Multimodal parks and PM Gati Shakti lower freight costs."},{"l":"Trust-based governance","t":"Jan Vishwas 2026 decriminalised [[717]] provisions in 79 Acts, after 183 in 2023."},{"l":"Labour flexibility","t":"The Labour Codes raised the layoff permission threshold to [[300]] workers."},{"l":"Private capital","t":"The SHANTI Act opened nuclear energy to private players."}],"cue":"PLI → logistics → decriminalise → labour flexibility → private capital."},{"k":"against","q":"What still limits industrial policy?","rows":[{"l":"Slow PLI payouts","t":"Only about [[₹37,000 crore]] of ₹1.9 lakh crore was paid by June 2026."},{"l":"High factor costs","t":"Land, power cross-subsidies and capital costs hurt factories."},{"l":"Costly inputs","t":"Tariff hikes and QCOs raise input prices for user industries."},{"l":"Uneven states","t":"States notify land and labour rules at different speeds."},{"l":"Big-firm bias","t":"Assembly subsidies leave MSMEs, R&D and components under-supported."}],"cue":"Slow payouts → factor costs → costly inputs → uneven states → big-firm bias."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Faster disbursal","t":"Speed up PLI claims and run the National Manufacturing Mission."},{"l":"Cheaper power and capital","t":"End industrial cross-subsidies and lower long-term borrowing costs."},{"l":"Calibrated tariffs","t":"Restrict QCOs to finished goods so inputs stay globally priced. (ES 2025-26)"},{"l":"State competition","t":"Benchmark states on land banks and single-window clearances."},{"l":"From assembly to R&D","t":"Shift incentives from assembly to research and design."}],"cue":"Faster payouts → cheaper power → calibrated tariffs → state competition → R&D."},{"k":"list","rows":[{"l":"Multimodal logistics parks","t":"They aggregate freight and mechanise warehousing to cut logistics costs."},{"l":"Companies Amendment 2017","t":"It widened related-party rules and scaled penalties to company size."},{"l":"Insolvency push","t":"The RBI can direct banks to start insolvency against large defaulters."}],"title":"Changes in 2017 (2017 Q12)","q":"What industrial-policy changes came in 2017?"},{"k":"list","q":"How has India’s industrial policy evolved?","rows":[{"l":"1948 and 1956","t":"State-led licensing under the Industrial Policy Resolutions."},{"l":"1991","t":"Delicensing, automatic FDI and PSU reservation cut to two sectors."},{"l":"Post-2014","t":"Make in India, then PLI in 2020 and the Labour Codes."}],"cue":"Licence Raj → 1991 opening → Make in India era."},{"k":"diagram","q":"Draw the diagram for Industrial policy","g":{"dir":"LR","nodes":[["A","1948 and 1956 - state-led, licensing"],["B","1991 - delicensing, FDI"],["C","2014 - Make in India"],["D","2020 - PLI, Atmanirbhar Bharat"]],"edges":[["A","B",""],["B","C",""],["C","D",""]]}},{"k":"data","q":"Which reforms does the Survey highlight?","title":"Data","rows":[{"l":"Survey's reforms","t":"GST rationalisation, Labour Codes, private nuclear power and [[100%]] insurance FDI."},{"l":"Green-cover norms","t":"Industry's green cover now depends on pollution potential, not a flat [[33%]]."}]}]},{"id":"GS38-labour-codes","line":"GS3.8","part":"Industrial policy","name":"Labour codes","own":true,"cards":[{"k":"define","text":"Four Codes (Wages; Industrial Relations; Social Security; Occupational Safety, Health and Working Conditions) consolidating 29 central labour laws, in force from 21 November 2025.","q":"What are the four labour codes?"},{"k":"list","title":"Code","rows":[{"l":"Code on Wages","t":"Universal minimum wage, floor wage, timely pay and equal pay."},{"l":"Industrial Relations Code","t":"Unions, collective bargaining, disputes and fixed-term jobs."},{"l":"Social Security Code","t":"EPF, ESI, gratuity, maternity and gig workers."},{"l":"OSH Code","t":"Safety standards, health check-ups and appointment letters."}],"q":"What does each labour code do?","cue":"Wages → relations → security → safety."},{"k":"for","rows":[{"l":"Economies of scale","t":"Firms can grow beyond the old 100-worker threshold."},{"l":"Simpler rules","t":"[[29]] laws merged into 4 codes cut compliance costs."},{"l":"Wage security","t":"Minimum wages and timely pay now cover all employment."},{"l":"Formalisation","t":"Mandatory appointment letters push formal hiring."},{"l":"Gig worker cover","t":"Gig and platform workers are recognised for social security."}],"q":"What are the benefits of the labour codes?","cue":"Bigger factories → simpler rules → wage security → formal jobs → gig cover."},{"k":"against","rows":[{"l":"Job insecurity","t":"Firms with 100–299 workers can now lay off without permission."},{"l":"Weaker unions","t":"A 14-day strike notice limits workers' bargaining power."},{"l":"Gig precarity","t":"Recognition does not give gig workers PF or ESI."},{"l":"Uneven states","t":"Labour is a concurrent subject, so state rules differ."},{"l":"Still jobless growth","t":"Reforms alone cannot create jobs without demand and skills."}],"q":"What are the concerns about the labour codes?","cue":"Job insecurity → weaker unions → precarious gig work → uneven states → still jobless growth."},{"k":"value","rows":[{"l":"Uniform rules","t":"Harmonise Centre and state rules."},{"l":"Flexicurity","t":"Retrenched workers get [[15 days]]' wages from a re-skilling fund."},{"l":"Portable protection","t":"Strengthen e-Shram and aggregator contributions for gig workers."},{"l":"Formalise MSMEs","t":"Offer digital compliance help and easier credit."},{"l":"Job-rich growth","t":"Pair the codes with labour-intensive manufacturing and skilling."},{"l":"Conclusion","t":"Judge the codes by formal, secure jobs, not just employer flexibility."},{"l":"Remember","t":"Below 300 workers, notice and compensation rules still apply."}],"q":"What is the way forward on the labour codes?","cue":"Converge rules → flexicurity → portable protection → formalise MSMEs → job-rich growth."},{"k":"data","rows":[{"l":"Wage definition","t":"Basic pay plus DA must be at least [[50%]] of CTC."},{"l":"State rules","t":"[[33]] states and UTs pre-published draft rules."}],"q":"What do the codes require on wages, and how far have states adopted them?"}]},{"id":"GS38-manufacturing-and-make-in-india","line":"GS3.8","part":"Industrial growth","name":"Manufacturing and Make in India","own":true,"cards":[{"k":"define","q":"What is Make in India?","text":"A 2014 initiative to make India a global manufacturing hub by raising manufacturing’s share of the economy."},{"k":"for","q":"What supports India’s manufacturing push?","rows":[{"l":"Absorbs farm labour","t":"Factories absorb workers leaving agriculture."},{"l":"Strong momentum","t":"Industrial GVA grew [[7%]] in H1 FY26. (ES 2025-26)"},{"l":"Coordinated push","t":"PLI, the National Manufacturing Mission and Gati Shakti drive factory capex. (ES 2025-26)"},{"l":"Existing scale","t":"India is the world's second-largest steel producer."},{"l":"Steady real share","t":"Manufacturing holds about [[17–18%]] of real GVA. (ES 2025-26)"},{"l":"Factory PMI","t":"Manufacturing PMI has stayed above 50 since mid-2021, hitting [[58.4]]."}],"cue":"Farm labour → momentum → coordinated push → existing scale → steady share → PMI."},{"k":"against","q":"Why does Indian manufacturing remain small?","rows":[{"l":"Land and logistics","t":"Land causes about [[70%]] of industrial corridor delays."},{"l":"Subscale factories","t":"An average factory has about [[240]] workers against 800 in China."},{"l":"Small global share","t":"India has only [[2.9%]] of world manufacturing value added. (ES 2025-26)"},{"l":"Costly capital","t":"A persistent CAD and missing DFIs make long-term finance expensive."},{"l":"Low R&D","t":"R&D is [[0.64%]] of GDP, against 2.4% in China and 3.5% in the US."}],"cue":"Land → small factories → small share → costly capital → low R&D."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Plug-and-play parks","t":"Build industrial corridors and all seven PM MITRA textile parks."},{"l":"Labour Codes and skills","t":"Let factories scale and align training with shop-floor needs."},{"l":"GVC integration","t":"Use FTAs and fix inverted duties on inputs."},{"l":"R&D finance","t":"Use the [[₹1 lakh crore]] RDI Fund for private innovation."},{"l":"Long-term finance","t":"Fill the DFI gap through NaBFID and cluster credit guarantees."}],"cue":"Parks → codes → GVCs → R&D fund → long-term finance."},{"k":"data","q":"What data back up the manufacturing story?","title":"Data","rows":[{"l":"Steel","t":"India is the second-largest crude steel producer."},{"l":"Steel target","t":"The 2017 National Steel Policy targets [[300 MT]]."},{"l":"Cement","t":"Per-capita use is [[290 kg]] against a 540 kg world average."},{"l":"Autos","t":"India is the third-largest vehicle market."},{"l":"Pharma","t":"India makes about [[20%]] of the world's generics."},{"l":"Electronics","t":"India made about [[44%]] of smartphones imported into the US in Q2 2025."},{"l":"Textiles","t":"A [[$179 bn]] industry, about 2% of GDP."},{"l":"Innovation","t":"India ranks [[38th]] on the Global Innovation Index."},{"l":"Make in India targets","t":"Manufacturing at [[25%]] of GDP and 100 million jobs."},{"l":"Five challenges","t":"Finance, scale, informality, market access, and infrastructure with skills."},{"l":"Mobile phones","t":"India is the second-largest phone maker, with over [[325 million]] phones."},{"l":"Manufacturing share","t":"Manufacturing is about [[16–17%]] of GVA."}]}]},{"id":"GS38-pli","line":"GS3.8","part":"Industrial growth","name":"PLI","own":true,"cards":[{"k":"define","q":"What is the PLI scheme?","text":"Production Linked Incentive (PLI) offers a cash incentive on incremental sales of goods made in India across [[14]] sectors to build scale and offset cost disadvantages against imports."},{"k":"for","q":"What is the rationale for PLI?","rows":[{"l":"Scale economies","t":"Paying for extra output helps firms reach global scale."},{"l":"Jobs","t":"PLI has created about [[14.6 lakh]] jobs."},{"l":"Exports","t":"PLI exports reached ₹15.5 lakh crore, growing about [[10.6%]] a year. (ES 2025-26)"},{"l":"Global firms","t":"It drew in Apple's supply chain and Samsung's expansion."},{"l":"Pay after results","t":"Money is paid only after verified output, not upfront."},{"l":"Output","t":"PLI production reached about [[₹24 lakh crore]], and Auto PLI drew $8.8 bn."}],"cue":"Scale → jobs → exports → global firms → pay after results → output."},{"k":"against","q":"What are the limits of PLI?","rows":[{"l":"Assembly trap","t":"Key inputs like processors and displays are still imported."},{"l":"Slow payouts","t":"Only about [[₹37,000 crore]] of ₹1.9 lakh crore was paid."},{"l":"Costs untouched","t":"Power, logistics and capital stay costly once subsidies end."},{"l":"Big-firm bias","t":"High thresholds leave MSMEs with few gains."},{"l":"Uneven sectors","t":"Advanced batteries and high-efficiency solar lag behind."}],"cue":"Assembly → slow payouts → costs untouched → big firms → uneven sectors."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Upstream components","t":"Fund components through ECMS with [[₹40,000 crore]]."},{"l":"Faster disbursal","t":"Digitise claim audits and favour labour-intensive sectors."},{"l":"Include MSMEs","t":"Lower thresholds and link vendors to PLI firms."},{"l":"Lower base costs","t":"Cut power, logistics and finance costs so factories survive after PLI."},{"l":"Sunset and R&D","t":"Set sunset clauses and tie incentives to R&D and localisation."}],"cue":"Components → faster payouts → MSMEs → base costs → sunset and R&D."},{"k":"diagram","q":"Draw the diagram for PLI","g":{"dir":"LR","nodes":[["S","Incremental sales over base year"],["I","Incentive - a share of extra sales"],["C","Scale and lower unit cost"],["E","Exports and import substitution"]],"edges":[["S","I",""],["I","C",""],["C","E",""]]}}]},{"id":"GS38-msmes","line":"GS3.8","part":"Industrial growth","name":"MSMEs","own":true,"cards":[{"k":"define","text":"Micro, small and medium enterprises, classified by investment and turnover: India’s largest non-farm employer across manufacturing and services.","q":"What are MSMEs?"},{"k":"data","q":"How are MSMEs classified (since April 2025), and what is their make-up?","rows":[{"l":"Micro","t":"Investment up to ₹2.5 crore and turnover up to [[₹10 crore]]."},{"l":"Small","t":"Investment up to ₹25 crore and turnover up to [[₹100 crore]]."},{"l":"Medium","t":"Investment up to ₹125 crore and turnover up to [[₹500 crore]]."},{"l":"Make-up","t":"[[97%]] are micro, yet medium firms give 40% of MSME exports."},{"l":"Intro line","t":"Over 6 crore MSMEs, yet only about [[10%]] have formal credit."}],"cue":"Micro 2.5/10 → small 25/100 → medium 125/500."},{"k":"for","rows":[{"l":"Output and exports","t":"MSMEs give 31.1% of GDP, [[35.4%]] of manufacturing and 48.6% of exports. (ES 2025-26)"},{"l":"Employment","t":"The largest non-farm employer, with about [[11 crore]] jobs."},{"l":"Supply-chain base","t":"They supply components to large firms and exporters."},{"l":"Regional spread","t":"They take industry beyond the metros."},{"l":"Women owners","t":"Women own about [[20.5%]] of Udyam-registered units."}],"q":"Why do MSMEs matter?","cue":"Output and exports → jobs → supply chains → regional spread → women owners."},{"k":"against","rows":[{"l":"Finance","t":"Only about [[10%]] get formal credit."},{"l":"Delayed payments","t":"Dues to MSMEs run to about [[₹10.7 lakh crore]]."},{"l":"Market access","t":"Small firms struggle to reach wider markets."},{"l":"Technology","t":"Only about 6% sell on e-commerce, though [[45%]] use some AI."},{"l":"Compliance","t":"Compliance costs weigh most on the smallest firms."},{"l":"Informality","t":"Informal MSMEs miss out on credit and schemes."}],"q":"What constrains MSMEs?","cue":"Credit → delayed payments → markets → technology → compliance → informality."},{"k":"value","rows":[{"l":"NITI for medium firms","t":"Turnover-linked working capital, Industry 4.0 and cluster upgrades."},{"l":"Cash-flow lending","t":"The U.K. Sinha Committee backs cash-flow lending and a stronger SIDBI."},{"l":"Bonsai trees","t":"MSMEs have huge potential but are stunted by finance and technology."}],"q":"What is the way forward for MS
