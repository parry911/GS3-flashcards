and digital branding help micro units scale and compete."},{"k":"diagram","q":"Draw the diagram for Micro food processing units","g":{"dir":"TD","nodes":[["P","PMFME"],["C","35% credit-linked subsidy"],["S","Seed capital for SHGs"],["O","One District One Product"],["I","Common infrastructure"],["B","Branding and marketing"]],"edges":[["P","C",""],["P","S",""],["P","O",""],["P","I",""],["P","B",""]]}},{"k":"data","q":"How does PMFME support micro units?","title":"Data","rows":[{"l":"PMFME","t":"(29 June 2020, Atmanirbhar Bharat, centrally sponsored, [[₹10,000 crore]]): One District One Product. Its target of [[2 lakh]] units was crossed on 11 July 2026: [[≈₹20,300 crore]] investment, [[≈11 lakh]] jobs (MoFPI)"},{"l":"Budget allocations","t":"PMFME [[≈₹2,000 crore]]; PLISFPI [[≈₹1,400 crore]] (notebook)"}]},{"k":"data","q":"What is the scale of micro food processing?","rows":[{"l":"Units and jobs","t":"about [[25 lakh]] units provide [[74%]] of the sector’s jobs; [[66%]] rural, [[80%]] family-run (MoFPI)"},{"l":"Under-resourced","t":"just [[7%]] of plant investment and [[3%]] of credit, yet [[12%]] of output (PMFME guidelines)"}]}]},{"id":"GS36-data-x","line":"GS3.6","part":"","name":"Food processing: key data","own":true,"cards":[{"k":"data","title":"Lines","q":"Which lines can you quote?","rows":[{"l":"Nutraceuticals","t":"preparations designed for specific dietary needs (ES 2025-26)","unlikely":true}]}]},{"id":"GS37-land-titling","line":"GS3.7","part":"","name":"Land Titling","own":true,"cards":[{"k":"define","q":"What is land titling?","text":"A legal guarantee of ownership of a parcel of land, backed by accurate records and maps."},{"k":"for","q":"Why does India need conclusive land titles?","rows":[{"l":"Unlocks institutional credit and farm investment by letting owners pledge clear titles as bank collateral","t":"e.g. Kisan Credit Card and long-term loans"},{"l":"Cuts civil court congestion and property litigation through dispute-free, guaranteed ownership (land cases form [[≈66%]] of civil litigation, DAKSH)","t":""},{"l":"Enables safe land leasing and operational consolidation without fear of losing ownership","t":"e.g. Model Agricultural Land Leasing Act, 2016"},{"l":"Speeds up public infrastructure and fair land acquisition by clearly identifying rightful owners for compensation","t":""},{"l":"Improves governance, transparency, and welfare targeting by linking verified plots to schemes","t":"e.g. PM-KISAN and crop insurance via AgriStack"}],"cue":"Clear, legally guaranteed ownership unlocks bank credit, cuts court disputes, and makes land leasing and governance safe."},{"k":"against","q":"What stands in the way of clear land titles?","rows":[{"l":"Presumptive rather than conclusive titles","t":"current records only show who pays land revenue, not guaranteed ownership, so disputes persist despite digitisation."},{"l":"Outdated, fragmented records with incomplete spatial integration","t":"while [[99.8%]] of Records of Rights are computerised and [[≈97%]] of maps digitised, text and maps are integrated in only [[≈84%]] of villages (Standing Committee, Jan 2026)."},{"l":"Missing formal records for rural residential areas (abadi) leave village homesteads without legal proof or mortgage value","t":""},{"l":"Tiny, fragmented holdings","t":"a clear title alone cannot make uneconomic small plots viable without leasing or consolidation ([[86%]] of farmers own <[[2]] ha)."},{"l":"Unrecorded oral tenancies, delayed inheritance mutations, and high stamp duties discourage people from updating land records","t":""}],"cue":"Presumptive records, unintegrated maps, unmapped village homes, and tiny plot sizes limit the real-world gains of titling."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Transition from presumptive to conclusive titling with state-guaranteed ownership and indemnity","t":"e.g. NITI Aayog draft model law based on Torrens principles"},{"l":"Complete text-and-map integration and unique plot tagging under DILRMP (already [[99.8%]] Records of Rights computerised, [[≈97%]] maps digitised, [[≈84%]] villages integrated; Bhu-Aadhaar / ULPIN given to [[40.6 crore]] parcels, DoLR Aug 2026)","t":""},{"l":"Formalise village homestead ownership through drone surveys under SVAMITVA ([[3.3 lakh]] villages surveyed and [[3.2 crore]] property cards prepared, 2026)","t":""},{"l":"Enact transparent leasing laws to protect both landowners and tenants without affecting ownership titles","t":"e.g. Model Agricultural Land Leasing Act, 2016"},{"l":"Automate post-sale mutations, lower stamp duties, and link land registries with civil courts and AgriStackto prevent fraud","t":""}],"cue":"Move to state-guaranteed conclusive titles, finish spatial digitisation and drone mapping, and legalise land leasing."},{"k":"data","q":"Which schemes and data back up land titling?","title":"Data","rows":[{"l":"Holdings","t":"small and marginal holdings are [[86.1%]] of all holdings but operate only [[46.9%]] of the area (Agriculture Census 2015-16; the 2021-22 results are awaited)"},{"l":"DILRMP 3.0 (2026-31, [[₹565.5 crore]], fully centrally funded)","t":"a GIS land stack, Bhu-Aadhaar for every parcel, computerised revenue courts (RCCMS) and registration linked to mutation. The Standing Committee (2026) asked it to shift from digitising records to making them accurate and legally valid"},{"l":"SVAMITVA","t":"(Ministry of Panchayati Raj, 24 April 2020; drone surveys by Survey of India): property cards have backed loans of [[₹1,713 crore]] in 11,147 cases (PIB, Aug 2026)"},{"l":"Land records schemes","t":"Strengthening Revenue Administration and Updating Land Records (centrally sponsored, 1987-88); NLRMP (2008), later merged into DILRMP"}]}]},{"id":"GS37-land-reforms","line":"GS3.7","part":"","name":"Land reforms","own":true,"cards":[{"k":"define","q":"What are land reforms?","text":"Changes in who owns and who tills land, meant to end feudal relations, give land to the tiller, and raise productivity."},{"k":"list","q":"What is the constitutional basis of land reforms?","rows":[{"l":"State subject","t":"Entry [[18]], List II"},{"l":"First Amendment (1951)","t":"added Articles 31A, 31B and the Ninth Schedule to shield land laws"},{"l":"Guiding principle","t":"Article [[39]](b) and (c)"}]},{"k":"list","q":"What were the main land reform measures?","rows":[{"l":"Zamindari abolition","t":"intermediaries removed, early 1950s"},{"l":"Tenancy reform","t":"fair rent, tenure security, ownership"},{"l":"Ceiling on holdings","t":"surplus redistributed"},{"l":"Consolidation","t":"of fragmented plots (Punjab, Haryana, western UP)"},{"l":"Bhoodan","t":"Vinoba Bhave, 1951"},{"l":"Land records","t":"updating and digitising"}]},{"k":"for","q":"What did land reforms achieve?","rows":[{"l":"Cuts rural poverty and inequality by redistributing land","t":"[[≈2 million]] hectares of ceiling-surplus land went to [[≈57 lakh]] beneficiaries, about half SC/ST (MoRD, 2015), helping reduce West Bengal’s rural poverty headcount by [[≈56%]] (1972–73 to 1999–2000, World Bank)."},{"l":"Raises farm productivity because secure tenure spurs investment","t":"Operation Barga raised rice yields by [[≈20%]] (Banerjee, Gertler, and Ghatak, 2002), explaining [[≈28%]] of West Bengal’s farm productivity growth (1979–93) and [[≈36%]] of its overall farm growth (1972–90)."},{"l":"Ends forced labour and rent extraction, giving registered tenants social dignity and political voice in panchayats","t":""},{"l":"Unlocks formal bank credit against recorded titles or tenancy rights, cutting dependence on moneylenders","t":""},{"l":"Creates viable family farms through plot consolidation","t":"(e.g., Punjab, Haryana, western UP) and boosts rural demand via wider income spread."}],"cue":"Giving secure land rights to the actual tiller ends feudal exploitation, unlocks investment and credit, and lifts rural equity and output."},{"k":"against","q":"Why did land reforms fall short in most states?","rows":[{"l":"Legal loopholes let zamindars keep land as khudkasht (personal cultivation), make benami or fictitious transfers, and exploit exemptions (plantations, religious trusts, orchards) and court delays, aided by landed elites in legislatures and varying state laws","t":""},{"l":"Restrictive tenancy laws drove leasing underground into oral leases","t":"[[≈17%]] of holdings had leased-in land (NSS 2019)—leaving tenants without legal protection or institutional credit."},{"l":"Outdated land records, decades without surveys, and tenant illiteracy or fear of eviction kept unorganised sharecroppers from registering","t":""},{"l":"Women and Dalits were often left out, while inheritance keeps fragmenting farms","t":"average holding fell from [[≈1.1]] ha (2015–16) to [[≈0.7]] ha (2021–22) (NABARD NAFIS)."},{"l":"High compensation to intermediaries and heavy survey costs strained state budgets","t":""}],"cue":"Legal loopholes, weak land records, elite resistance, and ongoing inheritance division stalled redistribution and pushed tenancy underground."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Pair strong political will and clear legal protection (heritable, perpetual rights as in Kerala, West Bengal, and Jammu & Kashmir) with peasant mobilisation","t":"(e.g., Kisan Sabha, Tebhaga legacy) and panchayat-led beneficiary identification."},{"l":"Take registration to villages through proactive administrative drives (like Operation Barga camps) and complete modern record digitisation","t":"e.g. DILRMP, Bhu-Aadhaar/ULPIN, SVAMITVA, and Kerala’s Ente Bhoomi portal"},{"l":"Legalise and formalise land leasing so owners can lease out safely and tenants get institutional credit and insurance","t":"e.g. NITI Aayog’s Model Agricultural Land Leasing Act, 2016"},{"l":"Supply complementary inputs","t":"credit, seeds, and irrigation—alongside land rights so new owners and smallholders can invest productively."},{"l":"Curb further farm fragmentation and empower women and Dalits through joint family titling, cooperative/FPO pooling, and voluntary land consolidation","t":""}],"cue":"Combine strong political will, village-level tenant mobilisation, transparent leasing laws, and modern digital records with farm inputs."},{"k":"data","rows":[{"l":"West Bengal titles","t":"West Bengal distributed [[6.7%]] of its agricultural land as titles to the poor by the early 1990s, against a national average of [[1.4%]] (Appu, 1996)"},{"l":"Land inequality","t":"the top [[10%]] own [[≈45%]] of farmland (notebook; World Inequality Lab, 2026)"},{"l":"Tenancy reform","t":"[[≈11 million]] tenants got ownership rights (notebook)"},{"l":"West Bengal","t":"marginal ownership up [[≈84%]]; land Gini 0.67 (1970) → 0.60 (1990) (notebook)"},{"l":"Kerala","t":"[[≈1.5 million]] households became owners; rural poverty [[≈69%]] (1970) → [[≈29%]] (1994) (notebook, not traced); land security let families diversify into allied activities (notebook)"},{"l":"Andhra Pradesh","t":"land-reform beneficiaries are [[≈24%]] more likely to attend village meetings (M.K. Narayana study, notebook)"}],"q":"What data and examples show the effect of land reforms?"},{"k":"data","rows":[{"l":"‘Land to the tiller’","t":"the core slogan of tenancy reform (Agriculture notes)"},{"l":"Conclusion anchors","t":"Article 39(b) and (c) (distribution of material resources to serve the common good); SDG 1.4 (equal rights to land and secure tenure)"},{"l":"Conclusion","t":"land reform must be well designed, because its productivity gains depend on implementation (notebook)"},{"l":"UP Zamindari Abolition and Land Reforms Act, 1950","t":"the first major law abolishing intermediaries"},{"l":"West Bengal, Operation Barga (1978)","t":"[[≈1.5 million]] sharecroppers recorded, more than [[65%]] of an estimated [[2.3 million]] by 1993; rice yields rose by [[≈20%]] (Banerjee, Gertler and Ghatak, 2002); rural poverty fell from [[≈64%]] (1983) to [[≈41%]] (1993-94) and [[≈29%]] (2004-05) (NSSO, cited by D. Bandyopadhyay, who ran the programme)"},{"l":"Taiwan’s ‘land to the tiller’ (1950s)","t":"tenancy fell from [[≈41%]] to [[≈16%]], giving an equitable distribution of land"},{"l":"From the diagram","t":"Land records - DILRMP, SVAMITVA"}],"q":"What data and examples show the effect of land reforms?"},{"k":"diagram","q":"Draw the diagram for Land reforms","g":{"dir":"TD","nodes":[["L","Land reforms"],["Z","Abolition of intermediaries - zamindari"],["T","Tenancy reform - Operation Barga"],["C","Ceiling and redistribution"],["K","Consolidation of holdings"],["R","Land records - DILRMP, SVAMITVA"]],"edges":[["L","Z",""],["L","T",""],["L","C",""],["L","K",""],["L","R",""]]}},{"k":"data","q":"What made land reforms work where they succeeded?","title":"Data","rows":[{"l":"Local institutions","t":"panchayats involved in identifying beneficiaries (West Bengal)"},{"l":"Top-down plus bottom-up","t":"officials identified beneficiaries while peasant groups mobilised them"}]}]},{"id":"GS37-land-ceiling","line":"GS3.7","part":"","name":"Land Ceiling","own":true,"cards":[{"k":"define","q":"What is a land ceiling?","text":"A legal maximum on the land a family may hold; land above it is taken as surplus and given to the landless."},{"k":"for","q":"Why impose land ceilings?","rows":[{"l":"Keeps farm output high because marginal farms remain more productive per hectare (NABARD, NAFIS 2021–22), with small holdings giving over 3x the output per hectare of large ones (Farm Management Studies)","t":""},{"l":"Puts idle land of large owners into the hands of labour-rich landless households, lifting overall land and labour use","t":""},{"l":"Ends absentee landlordism and rewards actual cultivation over rent-seeking","t":"e.g. prioritising SC/ST landless tillers"},{"l":"Spreads rural income across more households, widening local consumption demand","t":""},{"l":"Prevents extreme land concentration and semi-feudal estates from re-emerging","t":"e.g. curbing speculative land hoarding"}],"cue":"Capping large holdings shifts idle land to landless tillers, raising per-hectare productivity, rural equity, and local demand."},{"k":"against","q":"What are the problems with land ceilings?","rows":[{"l":"Very little land was caught","t":"surplus declared was only [[≈1%]] of cultivable land (MoRD, 1986), far below the Committee on State Agrarian Relations’ (2009) estimate."},{"l":"Widespread evasion through benami transfers, family partitions, broad exemptions","t":"(e.g., plantations, religious trusts, orchards), and long court cases."},{"l":"Tiny farms cannot support a family","t":"NABARD puts the viable income threshold at [[≈1.6]] ha, making consolidation and leasing matter more now."},{"l":"Deters large-scale private investment in farming and raises the cost of assembling land for industry and infrastructure","t":""},{"l":"Redistributed surplus land was often barren or degraded, and poor allottees lacked credit and inputs to farm it","t":"e.g. uncultivated allotted plots"}],"cue":"Massive evasion, tiny unviable plot sizes, and barriers to commercial land assembly limit the relevance of rigid ceilings today."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Legalise land leasing so farmers can operationally scale holdings above [[≈1.6]] ha without losing ownership or breaching ceilings","t":"e.g. Model Agricultural Land Leasing Act, 2016"},{"l":"Aggregate smallholders via FPOs and cooperatives to gain economies of scale without concentrating land ownership","t":"e.g. [[10,000]] FPOs scheme"},{"l":"Plug evasion and clear court backlogs by digitising records and tagging plots with Bhu-Aadhaar (ULPIN)(under DILRMP)","t":""},{"l":"Pair any redistributed surplus or government wasteland with credit, irrigation, and soil reclamation so allottees can farm profitably","t":""},{"l":"Use transparent state land banks and calibrated leasing rules to assemble land for industry and agro-processing without displacing smallholders","t":""}],"cue":"Shift focus from rigid ownership caps to legal land leasing, FPO pooling, digital records, and transparent industrial land banks."},{"k":"data","q":"What are the ceiling norms and numbers?","title":"Data","rows":[{"l":"Ceiling surplus","t":"[[68.5 lakh]] acres declared surplus (MoRD, Lok Sabha, Feb 2015). Bhoodan: [[39.2 lakh]] acres donated, [[21.75 lakh]] acres distributed (MoRD)"},{"l":"Average holding in the USA","t":"[[≈187 ha]] (Agriculture notes)"},{"l":"Jammu and Kashmir Big Landed Estates Abolition Act, 1950","t":"land above the ceiling went to tillers without compensation (the Act)"}]},{"k":"data","q":"What were the 1972 land ceiling guidelines?","rows":[{"l":"Before 1972","t":"ceilings applied to individuals, letting owners split land among relatives"},{"l":"1972 guidelines","t":"family of five as the unit: [[10–18]] acres for land irrigated for two crops, [[27]] acres for one crop, up to [[54]] acres for dry land"}]}]},{"id":"GS37-land-leasing-and-tenancy-reform","line":"GS3.7","part":"","name":"Land Leasing and Tenancy Reform","own":true,"cards":[{"k":"define","q":"What is legalised land leasing?","text":"Legalised leasing lets owners rent out farmland while retaining ownership title, ending unrecorded oral deals (concealed tenancy)."},{"k":"for","q":"What are the benefits of legalising land leasing?","rows":[{"l":"Consolidates fragmented operational holdings and brings fallow land of absentee or migrant owners under active cultivation","t":"e.g. [[86%]] small and marginal holdings, Agriculture Census"},{"l":"Enables recorded tenants to access institutional crop loans, crop insurance, and disaster relief without landowner consent","t":"e.g. Kisan Credit Card and PMFBY"},{"l":"Lets landowners take non-farm jobs without fearing loss of land, accelerating rural economic diversification","t":"e.g. Economic Survey on structural transformation"},{"l":"Creates larger contiguous operated areas for buyers and Farmer Producer Organisations (FPOs) to execute contract farming (GS3 2015 Q3)","t":""},{"l":"Empowers landless women’s collectives to lease land and farm jointly for scale, as seen under Kudumbashree (Kerala) and the AP Mahila Samatha Society","t":""}],"cue":"Formalising land leasing unlocks dormant farmland, consolidates fragmented plots for scale, and brings invisible tenants into the institutional credit and welfare net."},{"k":"against","q":"What holds back leasing reform?","rows":[{"l":"Restrictive state laws push tenancy into unrecorded oral deals, as Kerala, Jammu and Kashmir, and Manipur ban leasing while others allow it only for widows, minors, the disabled, or soldiers (NITI Aayog)","t":""},{"l":"Deep-seated owner fear of losing title under old \"land to the tiller\" laws deters formal registration even where permitted","t":"e.g. post-independence tenancy abolition acts"},{"l":"Unrecorded tenants remain excluded from direct cash transfers, subsidies, and credit tied strictly to land ownership records, such as PM-KISAN","t":""},{"l":"Weak bargaining power exposes landless tenants to high rent burdens, arbitrary eviction, and short-term farming that degrades soil health","t":"e.g. NSSO Situational Assessment Survey"},{"l":"Sluggish state-level adoption stalls reform, with only Uttar Pradesh and Uttarakhand amending their laws and Madhya Pradesh passing a new one (2016)","t":""}],"cue":"Restrictive tenancy laws and owner fears of losing title push leasing underground, leaving landless cultivators vulnerable and excluded from state support."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Adopt state tenancy laws aligned with the Model Agricultural Land Leasing Act, 2016 guaranteeing automatic land resumption to owners upon lease expiry","t":"e.g. Ashok Dalwai Committee recommendations"},{"l":"Digitise land records and maintain a separate, non-title-conferring registry of lease deeds and actual cultivators","t":"e.g. Digital India Land Records Modernization Programme"},{"l":"Delink crop loans, insurance, and cash transfers from ownership titles by recognising registered lease agreements","t":"e.g. Andhra Pradesh Loan Eligibility Cards and Joint Liability Groups"},{"l":"Scale up group leasing through women’s self-help groups and FPOs to strengthen tenant bargaining power, replicating Kudumbashree (Kerala)","t":""},{"l":"Create fast-track, village-level dispute resolution mechanisms outside civil courts to build mutual trust","t":"e.g. Gram Nyayalayas and local revenue tribunals"}],"cue":"Effective reform requires delinking ownership from cultivation rights through uniform state laws, digitised cultivator registries, and lease-backed credit."},{"k":"data","q":"What do the model law and data say?","title":"Data","rows":[{"l":"Tenancy","t":"[[≈13%]] of area was leased in (NSS 77th round, 2019), up from [[≈10%]] of area in 2012-13 (NSS 70th round)"},{"l":"Model Agricultural Land Leasing Act, 2016 (NITI Aayog model law)","t":"legalises and regulates leasing of farmland so that tenants can access credit, insurance and disaster relief while the landowner’s title stays fully protected; disputes go to a special land tribunal (PRS summary of the model Act). Adopted only in part: Uttar Pradesh and Uttarakhand amended their laws; Madhya Pradesh passed a new leasing law in 2016 (Lok Sabha reply) (NITI Aayog; T. Haque Committee)"}]}]},{"id":"GS37-larr-act-2013","line":"GS3.7","part":"","name":"LARR Act, 2013","own":true,"cards":[{"k":"define","q":"What is the LARR Act, 2013?","text":"Governs land acquisition by the state, with fair compensation, social impact assessment, consent for private and PPP projects, and rehabilitation and resettlement; replaced the Land Acquisition Act, 1894."},{"k":"for","q":"What does the LARR Act, 2013 get right?","rows":[{"l":"Ensures fair compensation of up to four times market value in rural areas and twice in urban areas,against [[1.3]] times under the [[1894]] Act (PRS), fulfilling the 17th Amendment (1964) proviso to Article 31A","t":""},{"l":"Mandates prior consent from [[80%]] of landowners for private projects and [[70%]] for PPP projects alongside a Social Impact Assessment (SIA) with public hearings, reducing protests and project stoppages","t":""},{"l":"Extends Rehabilitation and Resettlement (R&R) benefits to all livelihood losers, including landless labourers and tenants, beyond just title-holding landowners","t":""},{"l":"Protects vulnerable communities through special SC/ST safeguards under the Second Schedule,including land-for-land, a one-time [[₹50,000]] grant, and free community land","t":""},{"l":"Safeguards food security by restricting acquisition of irrigated multi-cropped land and mandating the return of land left unused for five years","t":""}],"cue":"Replacing colonial eminent domain with participatory consent, fair market pricing, and livelihood rehabilitation prevents forced displacement and reduces project-stalling protests."},{"k":"against","q":"What are the criticisms of the LARR Act, 2013?","rows":[{"l":"Stretches acquisition timelines from roughly [[6]] months to [[4.5]] years due to mandatory SIA and consent rules, delaying critical infrastructure and industrial corridors","t":""},{"l":"Escalates capital expenditure and makes industrial or infrastructure ventures unviable due to fourfold rural compensation multipliers","t":"e.g. stalled highway and industrial park land purchases"},{"l":"Fragments uniform national protection after the December 2014 central ordinance lapsed on [[31]] August 2015 prompting states like Tamil Nadu, Gujarat, Telangana, Jharkhand, Maharashtra (under Article [[254]]([[2]])), and Assam (2023) to dilute consent and SIA rules","t":""},{"l":"Leaves farmers undercompensated despite high multipliers due to flawed valuation practices, as a CAG review of six acquisitions found adjoining village sale prices were ignored","t":""},{"l":"Fails to halt farmland loss as conversion continues via state routes and land pooling, while SIA steers projects away from dense farm zones and fragments remaining holdings","t":""}],"cue":"High acquisition costs, multi-year procedural delays, and state-level dilutions under Article 254(2) undermine both infrastructure speed and uniform farmer protection."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Adopt voluntary land pooling and land-readjustment models that make farmers equity partners in urban and industrial development rather than displaced sellers","t":"e.g. Amaravati capital region and Gujarat Town Planning Schemes"},{"l":"Create state-level land banks using unutilised government, barren, and PSU land to minimise acquisition of fertile agricultural holdings","t":"e.g. India Industrial Land Bank portal"},{"l":"Time-bind Social Impact Assessments and digitise land records with transparent circle-rate benchmarks to prevent both multi-year delays and undervaluation","t":"e.g. NITI Aayog land reform recommendations"},{"l":"Offer structured annuity payments, inflation-indexed bonds, or long-term lease rentals instead of one-time lump-sum cash payouts to ensure sustained rural livelihoods","t":"e.g. Haryana and Uttar Pradesh annuity policies"},{"l":"Operationalise dedicated, time-bound LARR Authorities to resolve valuation and R&R disputes rapidly outside regular civil courts","t":"e.g. Section [[51]] of the LARR Act, 2013"}],"cue":"Balancing rapid infrastructure development with landowner equity requires alternative acquisition models like land pooling, fast-tracked assessments, and transparent valuation."},{"k":"diagram","q":"Draw the diagram for LARR Act, 2013","g":{"dir":"LR","nodes":[["S","Social Impact Assessment"],["C","Consent - 70% PPP, 80% private"],["P","Compensation - up to 4x rural, 2x urban"],["R","Rehabilitation and resettlement"]],"edges":[["S","C",""],["C","P",""],["P","R",""]]}},{"k":"data","q":"What example shows the cost of delay?","title":"Data","rows":[{"l":"Sardar Sarovar","t":"delays cost [[≈$200]] mn a year (World Bank assessment, notebook, not traced)"}]},{"k":"data","q":"When did the LARR Act take effect, and under which list?","rows":[{"l":"Full name","t":"Right to Fair Compensation and Transparency in Land Acquisition, Rehabilitation and Resettlement Act, 2013"},{"l":"In force","t":"[[1]] January 2014"},{"l":"Constitutional basis","t":"Concurrent List (Entry [[42]], List III)"}]}]},{"id":"GS38-liberalisation","line":"GS3.8","part":"Effects of liberalisation","name":"Liberalisation","own":true,"cards":[{"k":"define","text":"Reducing state control over trade, investment and industry so that private and foreign firms can compete.","q":"What is meant by liberalisation?"}]},{"id":"GS38-friendshoring-and-nearshoring","line":"GS3.8","part":"Effects of liberalisation","name":"Friendshoring and nearshoring","own":true,"cards":[{"k":"define","text":"Friendshoring: moving supply chains to allied countries. Nearshoring: relocating processes or manufacturing to a nearby country to cut transport cost and delivery time.","q":"What is meant by friendshoring and nearshoring?"},{"k":"value","rows":[{"l":"Survey trend","t":"Friendshoring, nearshoring and trade concentration are all rising. (ES 2025-26)"}],"q":"What schemes, data and examples back up Friendshoring and nearshoring?"}]},{"id":"GS38-economic-statecraft","line":"GS3.8","part":"Effects of liberalisation","name":"Economic statecraft","own":true,"cards":[{"k":"define","text":"Using economic tools (trade, finance, supply chains) to achieve political and strategic goals.","q":"What is meant by economic statecraft?"},{"k":"value","rows":[{"l":"Survey prologue","t":"Policy must secure supply, build buffers and diversify routes and payments. (ES 2025-26)"},{"l":"Key line","t":"Credibility and predictability become strategic assets, not mere virtues. (ES 2025-26)"},{"l":"Kautilya","t":"The Arthashastra is an early Indian example."},{"l":"Roman grain reserve","t":"Rome's grain-provisioning system worked like a strategic grain reserve."}],"q":"What schemes, data and examples back up Economic statecraft?"}]},{"id":"GS38-trade-diversion","line":"GS3.8","part":"Effects of liberalisation","name":"Trade diversion","own":true,"cards":[{"k":"define","text":"Shift of imports from a lower-cost non-member to a higher-cost FTA partner purely because of preferential tariffs; the opposite of trade creation.","q":"What is meant by trade diversion?"}]},{"id":"GS38-mfn-status","line":"GS3.8","part":"Effects of liberalisation","name":"MFN status","own":true,"cards":[{"k":"define","text":"Most Favoured Nation: the WTO rule that a tariff concession given to one member must be extended to all members.","q":"What is meant by MFN status?"}]},{"id":"GS38-ftas","line":"GS3.8","part":"Effects of liberalisation","name":"FTAs","own":true,"cards":[{"k":"define","text":"Agreements in which partners cut tariffs on most trade between them.","q":"What are FTAs?"},{"k":"data","q":"Where does India stand on FTAs?","rows":[{"l":"RCEP exit","t":"India left RCEP in 2019 over Chinese dumping and farm concerns."},{"l":"New FTAs","t":"India has since signed bilateral deals, from the UAE to the EU."}]},{"k":"for","rows":[{"l":"Export market access","t":"India's share of world merchandise exports is only [[1.8%]]."},{"l":"Cost of staying out","t":"Joining RCEP could have added up to [[$60 bn]] by 2030."},{"l":"Building blocks","t":"Regional deals can pave the way when WTO talks stall."},{"l":"GVC integration","t":"Cheaper inputs and assured markets help firms join global value chains."},{"l":"Supply-chain diversification","t":"More partners reduce dependence on one dominant supplier."},{"l":"FDI and technology","t":"Assured market access draws foreign investment."}],"q":"Why should India sign FTAs?","cue":"Markets → cost of staying out → building blocks → GVCs → diversification → FDI."},{"k":"against","rows":[{"l":"Supply side unfixed","t":"Gains need cheaper capital, better logistics and quality norms first."},{"l":"Trade diversion","t":"Imports shift to costlier partners because of preferential tariffs."},{"l":"Sensitive sectors","t":"Dairy and farming are exposed, and dumping can route through partners."},{"l":"MFN erosion","t":"Preferences for partners dilute equal treatment of all WTO members."},{"l":"Uneven benefits","t":"Large firms and services gain faster than small producers."}],"q":"What are the risks of FTAs?","cue":"Supply side unfixed → diversion → sensitive sectors → MFN eroded → big firms gain."},{"k":"value","rows":[{"l":"Services gain","t":"FTAs like the one with the UK boost services. (ES 2025-26)"},{"l":"Foreign Trade Policy 2023","t":"The target is [[$2 trillion]] in exports by 2030."}],"q":"What data and targets back up India’s trade strategy?"}]},{"id":"GS38-some-terms-definition","line":"GS3.8","part":"Effects of liberalisation","name":"Key terms: globalisation and liberalisation","own":true,"cards":[{"k":"list","rows":[{"l":"Globalisation","t":"Countries integrating through free flow of goods, services, capital, technology and people."},{"l":"Liberalisation","t":"Removing government restrictions to promote private enterprise and competition."},{"l":"Privatisation","t":"Transferring ownership or management of public enterprises to private hands."},{"l":"Economic integration","t":"Countries cutting trade and investment barriers to connect their markets."},{"l":"Deglobalisation","t":"Reversing integration through less cross-border trade, investment and supply-chain dependence."},{"l":"Protectionism","t":"Restricting imports through tariffs and quotas to protect domestic industry."},{"l":"Technological displacement","t":"Job losses from automation, imported technology and global competition."},{"l":"Excess labour supply","t":"More workers than available jobs."}],"q":"Define the key terms of globalisation and liberalisation."}]},{"id":"GS38-lpg-reforms-of-1991","line":"GS3.8","part":"Effects of liberalisation","name":"LPG reforms of 1991","own":true,"cards":[{"k":"define","q":"What were the LPG reforms of 1991?","text":"Liberalisation, privatisation and globalisation: reforms launched after the 1991 balance-of-payments crisis to open India’s economy to markets and the world."},{"k":"list","q":"What did the 1991 reforms do?","rows":[{"l":"Trigger","t":"Forex reserves covered only about [[3 weeks]] of imports."},{"l":"Measures","t":"Delicensing, automatic FDI, devaluation, tariff cuts and fewer PSU-reserved sectors."},{"l":"Outcome","t":"Growth rose past the [[3.5%]] Hindu rate of growth."}],"cue":"Crisis → measures → outcome."},{"k":"for","q":"What were the positive effects of the 1991 reforms?","rows":[{"l":"Faster growth","t":"Average growth doubled from about 3.5% to [[6–7%]]."},{"l":"BoP resilience","t":"Forex reserves rose from 3 weeks of imports to over [[$700 bn]]."},{"l":"Trade integration","t":"India now has [[4.3%]] of world services exports."},{"l":"Global Indian firms","t":"Indian firms went global, for example Tata buying JLR in 2008."},{"l":"Modern finance","t":"Bank reforms and a statutory SEBI modernised banking and capital markets."}],"cue":"Growth → forex → trade → global firms → finance."},{"k":"against","q":"What were the negative effects of the 1991 reforms?","rows":[{"l":"Agriculture bypassed","t":"Rural livelihoods gained little, widening sectoral and regional gaps."},{"l":"Informal jobs","t":"Contract workers are [[42%]] of organised manufacturing workers."},{"l":"Premature deindustrialisation","t":"Manufacturing stagnated at about [[15–17%]] of GDP."},{"l":"Rising inequality","t":"Income and wealth concentrated at the top, with oligopolies in key sectors."},{"l":"Lost brands","t":"Foreign MNCs bought leading Indian brands, like Thums Up in 1993."}],"cue":"Farms left out → informal jobs → deindustrialisation → inequality → lost brands."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Agricultural reform","t":"Extend reforms to farm markets, cold chains and agro-processing."},{"l":"Labour-intensive manufacturing","t":"Use PLI to build factories and cut import dependence."},{"l":"Formal jobs","t":"Simplify labour codes and reward formal hiring."},{"l":"Competition and R&D","t":"Strong antitrust and R&D support help Indian firms scale."},{"l":"Factor-market reform","t":"Reform land, power and logistics, for example through PM Gati Shakti."}],"cue":"Farms → factories → formal jobs → competition → factor markets."},{"k":"diagram","q":"Draw the diagram for LPG reforms of 1991","g":{"dir":"TD","nodes":[["C","1991 BoP crisis"],["L","Liberalisation - delicensing"],["P","Privatisation - disinvestment"],["G","Globalisation - tariffs cut, FDI opened"],["O","Competition, MNC entry, Indian firms go global"]],"edges":[["C","L",""],["C","P",""],["C","G",""],["L","O",""],["P","O",""],["G","O",""]]}},{"k":"data","q":"How have Indian firms competed with MNCs?","title":"Data","rows":[{"l":"Indian firms vs MNCs","t":"TCS, Infosys and Wipro rank among the world's largest IT firms."},{"l":"MNCs still lead","t":"FMCG is still led by MNCs like HUL."}]}]},{"id":"GS38-globalisation-and-informalisation","line":"GS3.8","part":"Effects of liberalisation","name":"Globalisation and Informalisation","own":true,"cards":[{"k":"define","q":"What is informalisation?","text":"Informalisation is the rising share of work without a written contract, social security, or job security, including contract workers inside formal firms."},{"k":"for","q":"How did globalisation reduce formal jobs?","rows":[{"l":"Price competition","t":"Contract workers rose from 20% to [[42%]] of organised manufacturing workers."},{"l":"Outsourcing chains","t":"Large firms subcontract to small informal suppliers and home workers."},{"l":"Automation","t":"Imported machinery displaces routine formal jobs."},{"l":"Rigid labour laws","t":"The old 100-worker rule pushed firms to stay small or use contractors."},{"l":"Volatile demand","t":"Global swings and platforms favour piece-rate, on-demand hiring."}],"cue":"Price pressure → outsourcing → automation → rigid laws → volatile demand."},{"k":"against","q":"Is informalisation always harmful?","rows":[{"l":"No social security","t":"Over half of regular wage workers lack social security."},{"l":"Low productivity","t":"Small informal units lack scale, credit and technology."},{"l":"Narrow tax base","t":"Unrecorded activity shrinks the revenue for public investment."},{"l":"Weak demand","t":"Low, volatile wages suppress spending and widen inequality."},{"l":"Entry route, but a trap","t":"Contract jobs offer entry but rarely lead to permanent work."}],"cue":"No security → low productivity → narrow tax base → weak demand → trap."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Labour Codes","t":"Raise the layoff threshold to [[300]] and mandate appointment letters."},{"l":"Portable benefits","t":"Register informal and gig workers on e-Shram for portable benefits."},{"l":"Reward formal hiring","t":"Subsidise employer contributions, as PM Viksit Bharat Rozgar Yojana does."},{"l":"Formal supply chains","t":"Link small suppliers to credit and payment platforms like TReDS."},{"l":"Industry-aligned skilling","t":"Align apprenticeships with industry demand."}],"cue":"Labour Codes → portable benefits → reward hiring → formal supply chains → skills."}]},{"id":"GS38-premature-deindustrialisation","line":"GS3.8","part":"Effects of liberalisation","name":"Premature deindustrialisation","own":true,"cards":[{"k":"define","q":"What is premature deindustrialisation?","text":"When manufacturing’s share of output and jobs peaks at a much lower income level than it did in today’s rich countries (Dani Rodrik)."},{"k":"for","q":"Why did services grow faster than industry in India?","rows":[{"l":"Telecom reforms","t":"Phone connections grew from 10 million to over [[1 billion]]."},{"l":"English-speaking workforce","t":"IT services grew about [[30%]] a year after 1991."},{"l":"Little infrastructure needed","t":"Services exports need no ports or highways."},{"l":"Factories held back","t":"Land, labour, power and logistics bottlenecks kept factories uncompetitive."},{"l":"Capital for services","t":"Easier FDI and financial reforms mostly helped modern services."}],"cue":"Telecom → English skills → no ports needed → factories blocked → capital to services."},{"k":"against","q":"Can India develop without industry?","rows":[{"l":"Too few jobs","t":"Services give [[56%]] of GVA but only 30% of jobs."},{"l":"Weak linkages","t":"High-end services absorb mainly educated workers."},{"l":"Goods deficit","t":"Services alone cannot pay for growing goods imports."},{"l":"Regional inequality","t":"Growth concentrates in service hubs like Bengaluru."},{"l":"Counter-view","t":"Manufacturing's real share has held at about [[17–18%]] of GVA. (ES 2025-26)"}],"cue":"Few jobs → weak linkages → goods deficit → regional gaps → counter-view."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Cut factory costs","t":"Reform land, labour and logistics to make factories competitive."},{"l":"Labour-intensive manufacturing","t":"Use PLI in textiles, electronics and leather."},{"l":"Agro-processing","t":"Rural food processing bridges farm exits and urban jobs."},{"l":"Factory skills","t":"Align apprenticeships with modern factory needs."},{"l":"R&D and design","t":"Use India's service strengths to add design value to manufacturing."}],"cue":"Costs → labour-intensive factories → agro-processing → skills → R&D."},{"k":"diagram","q":"Draw the diagram for Premature deindustrialisation","g":{"dir":"LR","nodes":[["A","Agriculture"],["I","Industry - mass jobs"],["S","Services"],["S2","India - jump to services, weak industrial base"]],"edges":[["A","I",""],["I","S",""],["A","S2",""]]}},{"k":"data","q":"What data show the services-led pattern?","title":"Data","rows":[{"l":"Apparel exports","t":"India's stagnated at about [[$14.5 bn]] while Bangladesh's grew fast."},{"l":"Services concentration","t":"Four states produce about [[40%]] of services output. (ES 2025-26)"},{"l":"Not system-forcing","t":"Services exports ignore potholes, so they don't force state modernisation. (ES 2025-26)"}]},{"k":"data","q":"How does India show premature deindustrialisation?","rows":[{"l":"Agriculture","t":"Its share fell from 29% of GDP in 1991 to about [[15%]]."},{"l":"Services","t":"Its share rose from 30% to over [[55%]] of GDP."}]}]},{"id":"GS38-protectionism-and-currency-pressures","line":"GS3.8","part":"Effects of liberalisation","name":"Protectionism and currency pressures","own":true,"cards":[{"k":"define","q":"What are protectionism and currency pressures?","text":"Protectionism uses tariffs, quotas, subsidies, and non-tariff barriers to shield domestic industry, while currency manipulation deliberately depresses exchange rates for an export edge."},{"k":"for","q":"What are the gains from protection and a weaker rupee?","rows":[{"l":"Infant industry","t":"Tariffs shield new industries like solar from dumping."},{"l":"Export competitiveness","t":"A weaker rupee and decade-low REER make exports cheaper."},{"l":"Trade balance","t":"Duties on non-essential imports protect domestic jobs."},{"l":"Tariff-jumping FDI","t":"Foreign firms set up local plants, like smartphone assembly."},{"l":"Adjustment space","t":"India stayed off the US currency monitoring list in January 2026."}],"cue":"Shield infants → cheaper exports → trade balance → local plants → adjustment space."},{"k":"against","q":"What challenges do protectionism and currency pressures create for India?","rows":[{"l":"US tariffs","t":"Tariffs peaked at 50% in 2025, and most goods now pay an extra [[10%]]."},{"l":"Imported inflation","t":"The rupee fell about [[9%]] in a year to ₹95 per dollar."},{"l":"BoP strain","t":"The trade deficit hit [[$333.6 bn]] in FY26."},{"l":"Dumping","t":"Goods shut out of the US get diverted into India."},{"l":"Weak multilateralism","t":"The stalled WTO dispute system leaves developing nations exposed."}],"cue":"US tariffs → weak rupee → BoP strain → dumping → weak WTO."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Supply-side competitiveness","t":"Scale manufacturing and cut logistics and capital costs."},{"l":"Diversify markets","t":"Use new FTAs to secure preferential access."},{"l":"Macro buffers","t":"Forex reserves of about [[$700 bn]] and rupee trade absorb shocks."},{"l":"Support exporters","t":"Give targeted credit through the Export Promotion Mission."},{"l":"Trade remedies","t":"Use WTO-compliant anti-dumping duties against diverted goods."}],"cue":"Competitiveness → new markets → buffers → exporter support → trade remedies."},{"k":"data","rows":[{"l":"Export Promotion Mission","t":"It has [[₹25,060 crore]] for FY26 to FY31."},{"l":"Exporter credit guarantee","t":"A [[₹20,000 crore]] scheme with full guarantee cover."},{"l":"India–US interim framework","t":"It removed the extra [[25%]] Russian-oil tariff in February 2026."}],"q":"What data and examples back up Protectionism and currency pressures?"},{"k":"diagram","q":"Draw the diagram for Protectionism and currency pressures","g":{"dir":"LR","nodes":[["T","Tariffs and protectionism abroad"],["E","Exports fall"],["C","Current account deficit widens"],["R","Rupee under pressure"],["F","RBI sells forex, imported inflation"]],"edges":[["T","E",""],["E","C",""],["C","R",""],["R","F",""]]}}]},{"id":"GS38-quality-control-orders","line":"GS3.8","part":"Industrial policy","name":"Quality Control Orders","own":true,"cards":[{"k":"define","q":"What are Quality Control Orders?","text":"Mandatory regulations issued under the Bureau of Indian Standards (BIS) Act, 2016 requiring specified goods—made in India or imported—to meet Indian quality standards before sale."},{"k":"for","q":"Why use Quality Control Orders?","rows":[{"l":"Consumer safety","t":"It keeps hazardous goods like faulty pressure cookers off the market."},{"l":"Curbs cheap imports","t":"Toy imports fell [[52%]] between FY15 and FY23. (ES 2025-26)"},{"l":"Brand India","t":"Common standards lift the reputation of Indian exports."},{"l":"Quality upgrade","t":"Firms upgrade testing and quality control to meet BIS norms."},{"l":"Buyer trust","t":"Buyers can trust quality without costly checks."}],"cue":"Safety → curb cheap imports → Brand India → upgrade → buyer trust."},{"k":"against","q":"What are the problems with Quality Control Orders?","rows":[{"l":"Costlier inputs","t":"[[46]] QCOs on inputs were revoked in 2025-26 after raising costs. (ES 2025-26)"},{"l":"MSME burden","t":"Certification and testing costs push small units toward closure."},{"l":"Trade friction","t":"Partners see sudden QCOs as hidden non-tariff barriers."},{"l":"Testing bottlenecks","t":"Too few labs cause customs delays and input shortages."},{"l":"Export competitiveness","t":"Costlier components make finished exports less competitive."}],"cue":"Input costs → MSME burden → trade friction → testing delays → export hit."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Finished goods only","t":"Limit QCOs to consumer goods with safety risks, not inputs. (ES 2025-26)"},{"l":"MSME relief","t":"Give small firms exemptions, longer transitions and testing subsidies."},{"l":"More testing labs","t":"Expand accredited labs and mutual recognition agreements."},{"l":"Consult first","t":"Consult user industries before notifying new QCOs."},{"l":"Exempt export inputs","t":"Exempt inputs used for R&D or re-export manufacturing."}],"cue":"Finished goods only → MSME relief → more labs → consult first → exempt export inputs."}]},{"id":"GS38-industrial-policy","line":"GS3.8","part":"Industrial policy","name":"Industrial policy","own":true,"cards":[{"k":"define","q":"What is meant by industrial policy?","text":"The state’s choice of which sectors it reserves, licenses, protects or promotes."},{"k":"for","q":"Can recent changes raise industrial growth?","rows":[{"l":"PLI scale","t":"PLI has drawn about [[₹2.6 lakh crore]] of investment."},{"l":"Logistics","t":"Multimodal parks and PM Gati Shakti lower freight costs."},{"l":"Trust-based governance","t":"The Jan Vishwas Act 2026 decriminalised [[717]] provisions."},{"l":"Labour flexibility","t":"The Labour Codes raised the layoff permission threshold to [[300]] workers."},{"l":"Private capital","t":"The SHANTI Act opened nuclear energy to private players."}],"cue":"PLI → logistics → decriminalise → labour flexibility → private capital."},{"k":"against","q":"What still limits industrial policy?","rows":[{"l":"Slow PLI payouts","t":"Only about [[₹37,000 crore]] of ₹1.9 lakh crore was paid by June 2026."},{"l":"High factor costs","t":"Land, power cross-subsidies and capital costs hurt factories."},{"l":"Costly inputs","t":"Tariff hikes and QCOs raise input prices for user industries."},{"l":"Uneven states","t":"States notify land and labour rules at different speeds."},{"l":"Big-firm bias","t":"Assembly subsidies leave MSMEs, R&D and components under-supported."}],"cue":"Slow payouts → factor costs → costly inputs → uneven states → big-firm bias."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Faster disbursal","t":"Speed up PLI claims and run the National Manufacturing Mission."},{"l":"Cheaper power and capital","t":"End industrial cross-subsidies and lower long-term borrowing costs."},{"l":"Calibrated tariffs","t":"Restrict QCOs to finished goods so inputs stay globally priced. (ES 2025-26)"},{"l":"State competition","t":"Benchmark states on land banks and single-window clearances."},{"l":"From assembly to R&D","t":"Shift incentives from assembly to research and design."}],"cue":"Faster payouts → cheaper power → calibrated tariffs → state competition → R&D."},{"k":"list","rows":[{"l":"Multimodal logistics parks","t":"They aggregate freight and mechanise warehousing to cut logistics costs."},{"l":"Companies Amendment 2017","t":"It widened related-party rules and scaled penalties to company size."},{"l":"Insolvency push","t":"The RBI can direct banks to start insolvency against large defaulters."}],"title":"Changes in 2017 (2017 Q12)","q":"What industrial-policy changes came in 2017?"},{"k":"list","q":"How has India’s industrial policy evolved?","rows":[{"l":"1948 and 1956","t":"State-led licensing under the Industrial Policy Resolutions."},{"l":"1991","t":"Delicensing, automatic FDI and PSU reservation cut to two sectors."},{"l":"Post-2014","t":"Make in India, then PLI in 2020 and the Labour Codes."}],"cue":"Licence Raj → 1991 opening → Make in India era."},{"k":"diagram","q":"Draw the diagram for Industrial policy","g":{"dir":"LR","nodes":[["A","1948 and 1956 - state-led, licensing"],["B","1991 - delicensing, FDI"],["C","2014 - Make in India"],["D","2020 - PLI, Atmanirbhar Bharat"]],"edges":[["A","B",""],["B","C",""],["C","D",""]]}},{"k":"data","q":"Which reforms does the Survey highlight?","title":"Data","rows":[{"l":"Survey's reforms","t":"GST rationalisation, Labour Codes, private nuclear power and [[100%]] insurance FDI."},{"l":"Green-cover norms","t":"Industry's green cover now depends on pollution potential, not a flat [[33%]]."}]}]},{"id":"GS38-labour-codes","line":"GS3.8","part":"Industrial policy","name":"Labour codes","own":true,"cards":[{"k":"define","text":"Four Codes (Wages; Industrial Relations; Social Security; Occupational Safety, Health and Working Conditions) consolidating 29 central labour laws, in force from 21 November 2025.","q":"What are the four labour codes?"},{"k":"list","title":"Code","rows":[{"l":"Code on Wages","t":"Universal minimum wage, floor wage, timely pay and equal pay."},{"l":"Industrial Relations Code","t":"Unions, collective bargaining, disputes and fixed-term jobs."},{"l":"Social Security Code","t":"EPF, ESI, gratuity, maternity and gig workers."},{"l":"OSH Code","t":"Safety standards, health check-ups and appointment letters."}],"q":"What does each labour code do?","cue":"Wages → relations → security → safety."},{"k":"for","rows":[{"l":"Economies of scale","t":"Firms can grow beyond the old 100-worker threshold."},{"l":"Simpler rules","t":"[[29]] laws merged into 4 codes cut compliance costs."},{"l":"Wage security","t":"Minimum wages and timely pay now cover all employment."},{"l":"Formalisation","t":"Mandatory appointment letters push formal hiring."},{"l":"Gig worker cover","t":"Gig and platform workers are recognised for social security."}],"q":"What are the benefits of the labour codes?","cue":"Bigger factories → simpler rules → wage security → formal jobs → gig cover."},{"k":"against","rows":[{"l":"Job insecurity","t":"Firms with 100–299 workers can now lay off without permission."},{"l":"Weaker unions","t":"A 14-day strike notice limits workers' bargaining power."},{"l":"Gig precarity","t":"Recognition does not give gig workers PF or ESI."},{"l":"Uneven states","t":"Labour is a concurrent subject, so state rules differ."},{"l":"Still jobless growth","t":"Reforms alone cannot create jobs without demand and skills."}],"q":"What are the concerns about the labour codes?","cue":"Job insecurity → weaker unions → precarious gig work → uneven states → still jobless growth."},{"k":"value","rows":[{"l":"Uniform rules","t":"Harmonise Centre and state rules."},{"l":"Flexicurity","t":"Retrenched workers get [[15 days]]' wages from a re-skilling fund."},{"l":"Portable protection","t":"Strengthen e-Shram and aggregator contributions for gig workers."},{"l":"Formalise MSMEs","t":"Offer digital compliance help and easier credit."},{"l":"Job-rich growth","t":"Pair the codes with labour-intensive manufacturing and skilling."},{"l":"Conclusion","t":"Judge the codes by formal, secure jobs, not just employer flexibility."},{"l":"Remember","t":"Below 300 workers, notice and compensation rules still apply."}],"q":"What is the way forward on the labour codes?","cue":"Converge rules → flexicurity → portable protection → formalise MSMEs → job-rich growth."},{"k":"data","rows":[{"l":"Wage definition","t":"Basic pay plus DA must be at least [[50%]] of CTC."},{"l":"State rules","t":"[[33]] states and UTs pre-published draft rules."}],"q":"What do the codes require on wages, and how far have states adopted them?"}]},{"id":"GS38-manufacturing-and-make-in-india","line":"GS3.8","part":"Industrial growth","name":"Manufacturing and Make in India","own":true,"cards":[{"k":"define","q":"What is Make in India?","text":"A 2014 initiative to make India a global manufacturing hub by raising manufacturing’s share of the economy."},{"k":"for","q":"What supports India’s manufacturing push?","rows":[{"l":"Absorbs farm labour","t":"Factories absorb workers leaving agriculture."},{"l":"Strong momentum","t":"Industrial GVA grew [[7%]] in H1 FY26. (ES 2025-26)"},{"l":"Coordinated push","t":"PLI, the National Manufacturing Mission and Gati Shakti drive factory capex. (ES 2025-26)"},{"l":"Existing scale","t":"India is the world's second-largest steel producer."},{"l":"Steady real share","t":"Manufacturing holds about [[17–18%]] of real GVA. (ES 2025-26)"}],"cue":"Farm labour → momentum → coordinated push → existing scale → steady share."},{"k":"against","q":"Why does Indian manufacturing remain small?","rows":[{"l":"Land and logistics","t":"Land causes about [[70%]] of industrial corridor delays."},{"l":"Subscale factories","t":"An average factory has about [[240]] workers against 800 in China."},{"l":"Small global share","t":"India has only [[2.9%]] of world manufacturing value added. (ES 2025-26)"},{"l":"Costly capital","t":"A persistent CAD and missing DFIs make long-term finance expensive."},{"l":"Low R&D","t":"India spends only [[0.64%]] of GDP on R&D, against 2.4% in China."}],"cue":"Land → small factories → small share → costly capital → low R&D."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Plug-and-play parks","t":"Build industrial corridors and all seven PM MITRA textile parks."},{"l":"Labour Codes and skills","t":"Let factories scale and align training with shop-floor needs."},{"l":"GVC integration","t":"Use FTAs and fix inverted duties on inputs."},{"l":"R&D finance","t":"Use the [[₹1 lakh crore]] RDI Fund for private innovation."},{"l":"Long-term finance","t":"Fill the DFI gap through NaBFID and cluster credit guarantees."}],"cue":"Parks → codes → GVCs → R&D fund → long-term finance."},{"k":"data","q":"What data back up the manufacturing story?","title":"Data","rows":[{"l":"Steel","t":"India is the second-largest crude steel producer."},{"l":"Steel target","t":"The 2017 National Steel Policy targets [[300 MT]]."},{"l":"Cement","t":"Per-capita use is [[290 kg]] against a 540 kg world average."},{"l":"Autos","t":"India is the third-largest vehicle market."},{"l":"Pharma","t":"India makes about [[20%]] of the world's generics."},{"l":"Electronics","t":"India made about [[44%]] of smartphones imported into the US in Q2 2025."},{"l":"Textiles","t":"A [[$179 bn]] industry, about 2% of GDP."},{"l":"Innovation","t":"India ranks [[38th]] on the Global Innovation Index."},{"l":"Make in India targets","t":"Manufacturing at [[25%]] of GDP and 100 million jobs."},{"l":"Five challenges","t":"Finance, scale, informality, market access, and infrastructure with skills."}]}]},{"id":"GS38-pli","line":"GS3.8","part":"Industrial growth","name":"PLI","own":true,"cards":[{"k":"define","q":"What is the PLI scheme?","text":"Production Linked Incentive (PLI) offers a cash incentive on incremental sales of goods made in India across [[14]] sectors to build scale and offset cost disadvantages against imports."},{"k":"for","q":"What is the rationale for PLI?","rows":[{"l":"Scale economies","t":"Paying for extra output helps firms reach global scale."},{"l":"Jobs","t":"PLI has created about [[14.6 lakh]] jobs."},{"l":"Exports","t":"PLI exports reached about [[₹15.5 lakh crore]] by June 2026."},{"l":"Global firms","t":"It drew in Apple's supply chain and Samsung's expansion."},{"l":"Pay after results","t":"Money is paid only after verified output, not upfront."}],"cue":"Scale → jobs → exports → global firms → pay after results."},{"k":"against","q":"What are the limits of PLI?","rows":[{"l":"Assembly trap","t":"Key inputs like processors and displays are still imported."},{"l":"Slow payouts","t":"Only about [[₹37,000 crore]] of ₹1.9 lakh crore was paid."},{"l":"Costs untouched","t":"Power, logistics and capital stay costly once subsidies end."},{"l":"Big-firm bias","t":"High thresholds leave MSMEs with few gains."},{"l":"Uneven sectors","t":"Advanced batteries and high-efficiency solar lag behind."}],"cue":"Assembly → slow payouts → costs untouched → big firms → uneven sectors."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Upstream components","t":"Fund components through ECMS with [[₹40,000 crore]]."},{"l":"Faster disbursal","t":"Digitise claim audits and favour labour-intensive sectors."},{"l":"Include MSMEs","t":"Lower thresholds and link vendors to PLI firms."},{"l":"Lower base costs","t":"Cut power, logistics and finance costs so factories survive after PLI."},{"l":"Sunset and R&D","t":"Set sunset clauses and tie incentives to R&D and localisation."}],"cue":"Components → faster payouts → MSMEs → base costs → sunset and R&D."},{"k":"diagram","q":"Draw the diagram for PLI","g":{"dir":"LR","nodes":[["S","Incremental sales over base year"],["I","Incentive - a share of extra sales"],["C","Scale and lower unit cost"],["E","Exports and import substitution"]],"edges":[["S","I",""],["I","C",""],["C","E",""]]}}]},{"id":"GS38-msmes","line":"GS3.8","part":"Industrial growth","name":"MSMEs","own":true,"cards":[{"k":"define","text":"Micro, small and medium enterprises, classified by investment and turnover: India’s largest non-farm employer across manufacturing and services.","q":"What are MSMEs?"},{"k":"data","q":"How are MSMEs classified (since April 2025), and what is their make-up?","rows":[{"l":"Micro","t":"Investment up to ₹2.5 crore and turnover up to [[₹10 crore]]."},{"l":"Small","t":"Investment up to ₹25 crore and turnover up to [[₹100 crore]]."},{"l":"Medium","t":"Investment up to ₹125 crore and turnover up to [[₹500 crore]]."},{"l":"Make-up","t":"[[97%]] are micro, yet medium firms give 40% of MSME exports."},{"l":"Intro line","t":"Over 6 crore MSMEs, yet only about [[10%]] have formal credit."}],"cue":"Micro 2.5/10 → small 25/100 → medium 125/500."},{"k":"for","rows":[{"l":"Output and exports","t":"MSMEs give [[31.1%]] of GDP and nearly half of exports. (ES 2025-26)"},{"l":"Employment","t":"The largest non-farm employer, with about [[11 crore]] jobs."},{"l":"Supply-chain base","t":"They supply components to large firms and exporters."},{"l":"Regional spread","t":"They take industry beyond the metros."}],"q":"Why do MSMEs matter?","cue":"Output and exports → jobs → supply chains → regional spread."},{"k":"against","rows":[{"l":"Finance","t":"Only about [[10%]] get formal credit."},{"l":"Delayed payments","t":"Dues to MSMEs run to about [[₹10.7 lakh crore]]."},{"l":"Market access","t":"Small firms struggle to reach wider markets."},{"l":"Technology","t":"Only about [[6%]] sell on e-commerce."},{"l":"Compliance","t":"Compliance costs weigh most on the smallest firms."},{"l":"Informality","t":"Informal MSMEs miss out on credit and schemes."}],"q":"What constrains MSMEs?","cue":"Credit → delayed payments → markets → technology → compliance → informality."},{"k":"value","rows":[{"l":"NITI for medium firms","t":"Turnover-linked working capital, Industry 4.0 and cluster upgrades."},{"l":"Cash-flow lending","t":"The U.K. Sinha Committee backs cash-flow lending and a stronger SIDBI."},{"l":"Bonsai trees","t":"MSMEs have huge potential but are stunted by finance and technology."}],"q":"What is the way forward for MSMEs?","cue":"Medium firms → cash-flow credit → bonsai conclusion."}]},{"id":"GS38-labour-intensive-vs-capital-intensive-ex","line":"GS3.8","part":"Industrial growth","name":"Labour-Intensive vs Capital-Intensive Exports","own":true,"cards":[{"k":"define","q":"What is India’s export structure?","text":"India’s exports lean toward capital- and skill-intensive goods (refined petroleum, pharma, engineering,electronics) rather than mass-employment goods (garments, footwear, toys, food processing)."},{"k":"for","q":"Why do labour-intensive exports matter for India?","rows":[{"l":"Mass jobs","t":"Garments and footwear absorb workers leaving farms."},{"l":"Capital-light earnings","t":"They earn more exports per unit of scarce capital."},{"l":"Dispersed growth","t":"Clusters like Tiruppur spread jobs and employ women."},{"l":"China plus one","t":"FTAs help capture supply chains moving out of China."},{"l":"Complements strengths","t":"They add to existing strength in pharma, petroleum and engineering."}],"cue":"Mass jobs → less capital → dispersed growth → China+1 → complements."},{"k":"against","q":"Why did India's labour-intensive exports fail?","rows":[{"l":"Dwarf factories","t":"The old 100-worker rule kept firms small, unlike Bangladesh's mega-factories."},{"l":"High factor costs","t":"Power, freight and capital costs erode price competitiveness."},{"l":"Tariff disadvantage","t":"Bangladesh had duty-free EU access while India faced duties."},{"l":"No fibre neutrality","t":"Man-made fibre inputs cost more than finished garments."},{"l":"Capital-biased incentives","t":"Early PLI went mostly to capital-heavy sectors."}],"cue":"Dwarf factories → factor costs → tariffs → fibre duties → capital bias."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Scale freely","t":"Labour Codes let factories grow to [[300]] workers without layoff permission."},{"l":"PM MITRA parks","t":"Seven plug-and-play textile parks cut logistics and compliance costs."},{"l":"Use the FTAs","t":"The UK deal gives duty-free access to [[99%]] of Indian exports."},{"l":"Export credit","t":"Channel trade finance to MSMEs via the Export Promotion Mission."},{"l":"Fix fibre duties","t":"Remove inverted duties on man-made fibres and subsidise formal jobs."}],"cue":"Scale → parks → FTAs → credit → fibre duties."},{"k":"data","q":"What data and examples show the problem?","title":"Data","rows":[{"l":"Costly industrial power","t":"Industry pays above cost to subsidise farmers and households. (ES 2025-26)"},{"l":"Tiruppur","t":"The knitwear cluster aims to double turnover to about [[$10 bn]]."}]}]},{"id":"GS38-semiconductors","line":"GS3.8","part":"Industrial growth","name":"Semiconductors","own":true,"cards":[{"k":"define","q":"What is the India Semiconductor Mission?","text":"The India Semiconductor Mission (2021) offers [[≈₹76,000 crore]] ([[≈$10 bn]]) in incentives to build chip fabs, packaging and design capacity in India."},{"k":"for","q":"Why do semiconductors matter for India?","rows":[{"l":"Strategic autonomy","t":"It cuts dependence on a few East Asian chip suppliers."},{"l":"Foundational tech","t":"Chips power electronics, EVs, defence and energy systems."},{"l":"Electronics anchor","t":"Electronics output rose to about [[₹9.5 lakh crore]] by FY24."},{"l":"Lower import bill","t":"Chip demand may reach [[$100–110 bn]] by 2030."},{"l":"Design talent","t":"India's chip-design talent can move into owning IP."}],"cue":"Autonomy → foundational tech → electronics → imports → design talent."},{"k":"against","q":"What are the challenges in building a chip industry?","rows":[{"l":"Huge capital","t":"Tata's Dholera fab needs about [[₹91,526 crore]]."},{"l":"No frontier firm","t":"Key tools are monopolised, like ASML in lithography."},{"l":"Import dependence","t":"Wafers, chemicals, gases and machines are all imported."},{"l":"Power and water","t":"Fabs need uninterrupted power and huge amounts of ultrapure water."},{"l":"Talent gap","t":"India has designers but few fab engineers and technicians."}],"cue":"Capital → frontier gap → imports → power and water → talent."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Semicon 2.0","t":"Approved in July 2026 with [[₹1,27,500 crore]] to go beyond fabs."},{"l":"Global partnerships","t":"Partner with foundry leaders, like Tata with Taiwan's PSMC."},{"l":"Semiconductor parks","t":"Build parks with dedicated green power and water recycling."},{"l":"Fabless startups","t":"Back chip-design startups through the Design Linked Incentive scheme."},{"l":"Talent pipeline","t":"Chips to Startup trains about [[70,000]] students."}],"cue":"Semicon 2.0 → partners → parks → fabless → talent."}]},{"id":"GS38-skill-india","line":"GS3.8","part":"Industrial growth","name":"Skill India","own":true,"cards":[{"k":"define","text":"Skill India Mission (2015), restructured in 2025 into one scheme combining short-term training, apprenticeships and vocational training for non-literates.","q":"What is Skill India?"},{"k":"list","q":"What are Skill India’s components?","rows":[{"l":"PMKVY 4.0","t":"Short-term outcome-based training, now including AI and robotics."},{"l":"NAPS","t":"The National Apprenticeship Promotion Scheme."},{"l":"Jan Shikshan Sansthan","t":"Vocational training for non-literates."},{"l":"2015 PYQ","t":"Make in India needs Skill India."}]},{"k":"for","rows":[{"l":"Scale","t":"PMKVY has trained about [[1.6 crore]] people."},{"l":"Apprenticeships","t":"About 54 lakh apprentices since 2016, with stipends shared by government."},{"l":"New-age skills","t":"Courses now cover AI, robotics and IoT."},{"l":"Reaching the excluded","t":"JSS trains non-literates in their own communities."}],"q":"What has Skill India achieved?","cue":"Scale → apprenticeships → new-age skills → reaching the excluded."},{"k":"against","rows":[{"l":"Few formally trained","t":"Only about [[5%]] of workers have formal training, against 60% in Germany."},{"l":"Low placement","t":"Courses don't match what industry wants."},{"l":"Poor quality","t":"Training quality and monitoring are weak."}],"q":"Why does Skill India fall short?","cue":"Few trained → low placement → poor quality."},{"k":"value","rows":[{"l":"Conclusion","t":"Skill India bridges India's demographic potential and its economic destiny."}],"q":"What is the takeaway on Skill India?"}]},{"id":"GS38-creative-economy","line":"GS3.8","part":"Industrial growth","name":"Creative economy","own":true,"cards":[{"k":"define","q":"What is the creative (orange) economy?","text":"The knowledge-based ‘orange’ economy built on intellectual property, technology-driven innovation, and cultural monetisation—spanning films, music, design, crafts, and AVGC-XR—with creative occupations estimated at [[≈20%]] of GVA."},{"k":"for","q":"Why promote the creative economy?","rows":[{"l":"Inclusive jobs","t":"AVGC may need nearly [[2 million]] professionals by 2030."},{"l":"Exports","t":"Media and entertainment reached about [[$30 bn]] in 2024."},{"l":"Soft power","t":"Yoga, Ayurveda and GI crafts build cultural diplomacy."},{"l":"Small-town creators","t":"Cheap data and OTT let small-town creators reach audiences."},{"l":"Low-carbon growth","t":"Creativity grows the economy without heavy resource use."}],"cue":"Jobs → exports → soft power → small-town creators → low carbon."},{"k":"against","q":"What holds the creative economy back?","rows":[{"l":"No collateral","t":"Banks avoid lending against intangible IP."},{"l":"Weak IPR","t":"Slow IPR disposal and piracy cut creators' income."},{"l":"Outsourcing hub","t":"India mostly does backend work instead of owning original IP."},{"l":"Red tape","t":"Live events need [[10–15]] separate clearances."},{"l":"Informality","t":"Grassroots artists stay in precarious, low-wage work."}],"cue":"No collateral → weak IPR → outsourcing → red tape → informality."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Faster IPR","t":"Digitise IPR offices under the National IPR Policy 2016."},{"l":"New financing","t":"Use IP-backed loans, crowdfunding and venture funds."},{"l":"Creative hubs","t":"Build creative districts, like UNESCO Creative Cities."},{"l":"Creative skilling","t":"AVGC labs in [[15,000]] schools build an original-IP workforce. (Budget 2026-27)"},{"l":"Single-window events","t":"Simplify live-event clearances and give artisans MSME benefits."}],"cue":"Faster IPR → finance → hubs → skilling → single window."},{"k":"data","q":"What data back up the creative economy?","title":"Data","rows":[{"l":"Patent disposal","t":"It takes about [[59 months]] in India against 21 in the US."}]}]},{"id":"GS38-data-effects-on-industria","line":"GS3.8","part":"Industrial growth","name":"Industrial growth: key data","own":true,"cards":[{"k":"data","title":"Numbers","q":"What are the key numbers?","rows":[{"l":"Startups","t":"India has [[2.2 lakh]] recognised startups, the third-largest ecosystem."}]},{"k":"data","title":"Lines","q":"Which lines can you quote?","rows":[{"l":"CII summit theme","t":"Reimagining Sustainability. Resilient, Regenerative, Responsible."}]},{"k":"data","title":"Government steps and committees","q":"Which government steps and committees apply?","rows":[{"l":"Startup India","t":"A [[₹10,000 crore]] Fund of Funds 2.0 came in April 2026."},{"l":"Biopharma SHAKTI","t":"₹10,000 crore over 5 years for biologics and biosimilars. (Budget 2026-27)"},{"l":"Rare-earth corridors","t":"Four coastal states get dedicated corridors. (Budget 2026-27)"}]}]},{"id":"GS38-fdi","line":"GS3.8","part":"FDI and SEZs","name":"FDI","own":true,"cards":[{"k":"define","text":"A foreign investor takes a lasting stake ([[10%]] or more) and management control in an Indian business, via the automatic or government route.","q":"What is meant by FDI?"},{"k":"list","q":"How is net FDI calculated?","rows":[{"l":"Net FDI","t":"Gross inflows minus repatriation and outward FDI by Indian firms."}]},{"k":"for","rows":[{"l":"Non-debt capital","t":"Gross inflows hit a record [[$94.5 bn]] in FY26."},{"l":"Value chains","t":"FDI brings know-how, like Samsung's Noida plant."},{"l":"Services and infrastructure","t":"Services draw the largest share of inflows."},{"l":"Jobs and spillovers","t":"It creates formal jobs, exports and technology spillovers."},{"l":"Self-reliance","t":"Defence allows [[74%]] FDI through the automatic route."}],"q":"Why does India need FDI?","cue":"Capital → value chains → services → jobs → self-reliance."},{"k":"against","rows":[{"l":"Thin net FDI","t":"Net FDI was just [[$7.7 bn]] in FY26."},{"l":"Repatriation","t":"Exits through IPOs and stake sales are at a multi-year high."},{"l":"Outward FDI","t":"Indian firms invested [[$33.3 bn]] abroad in FY26."},{"l":"MoU–FDI gap","t":"Land, approvals and tax uncertainty stall promised investment."},{"l":"Treaty uncertainty","t":"India ended [[44]] BITs after the 2016 Model BIT."}],"q":"Why is net FDI weak even though gross inflows are at a record?","cue":"Thin net → exits → outward FDI → MoU gap → treaty protection."},{"k":"value","rows":[{"l":"Defence","t":"[[74%]] through the automatic route, more through the government route."},{"l":"Defence production","t":"It rose to about [[₹1.5 lakh crore]] in FY25."},{"l":"Multi-brand retail","t":"[[51%]] through the government route, with conditions."},{"l":"Short vs long run","t":"Short run brings capital, long run brings competitiveness and spillovers."},{"l":"Way forward","t":"Stable treaties, predictable taxes, easier land and facilitation cells."}],"title":"Sector rules and PYQ points","q":"What are the sector rules and PYQ points on FDI?"},{"k":"data","rows":[{"l":"Top source","t":"Singapore gave [[$14.9 bn]] in FY25, ahead of Mauritius."},{"l":"GCCs","t":"About [[1,700]] GCCs, the world's largest concentration."},{"l":"Two readings","t":"The RBI sees mature exits, while critics see weaker fresh commitment."},{"l":"Insurance","t":"The 2025 Act raised the insurance FDI limit to [[100%]]. (ES 2025-26)"},{"l":"FEMA rules","t":"They govern how foreign investors pay for and report investments."},{"l":"FDI vs FPI","t":"FPI is a portfolio stake below 10%."}],"q":"What data and rules back up FDI?"},{"k":"diagram","q":"Draw the diagram for FDI","g":{"dir":"TD","nodes":[["F","Foreign investment"],["D","FDI - 10% or more stake, long term"],["P","FPI - below 10%, portfolio"],["A","Automatic route"],["G","Government route"]],"edges":[["F","D",""],["F","P",""],["D","A",""],["D","G",""]]}}]},{"id":"GS38-sezs","line":"GS3.8","part":"FDI and SEZs","name":"SEZs","own":true,"cards":[{"k":"define","text":"Duty-free enclaves treated as foreign territory for trade and duties, meant to promote exports, investment and jobs (SEZ Act, 2005).","q":"What are SEZs?"},{"k":"data","q":"What are the SEZ numbers?","rows":[{"l":"Origins","t":"Kandla was India's first EPZ in 1965, and the SEZ Act came in 2005."},{"l":"Scale","t":"SEZs employ about [[32 lakh]] people."},{"l":"Exports","t":"SEZ exports rose [[32%]] in April–December 2025."}]},{"k":"for","rows":[{"l":"Export hubs","t":"Tax breaks and single-window rules attract export investment."},{"l":"Employment","t":"Zones create jobs near ports and industrial corridors."},{"l":"Ease of business","t":"Single-window clearances and ready infrastructure."},{"l":"Reform test bed","t":"A trial ground for labour and land reforms."}],"q":"What were SEZs meant to achieve?","cue":"Exports → jobs → ease of business → reform test bed."},{"k":"against","rows":[{"l":"Taxation","t":"MAT and the end of tax holidays eroded the SEZ advantage."},{"l":"Weak jobs link","t":"Zones stay enclaves with weak job creation."},{"l":"Idle zones","t":"[[95]] of 372 notified SEZs are non-operational."},{"l":"Weak domestic links","t":"Little link with the domestic economy, and sudden policy reversals."},{"l":"Poor administration","t":"The single window fails on inter-agency coordination."},{"l":"One-size rules","t":"The same rule-book applies to very different zones."},{"l":"Governing law","t":"The DESH Bill to replace the SEZ Act never passed."},{"l":"WTO compatibility","t":"Export-linked tax breaks clash with WTO rules."}],"q":"What plagues SEZs?","cue":"Taxes → enclave → idle zones → weak links → administration → one size → law → WTO."},{"k":"value","rows":[{"l":"Domestic sales","t":"Let units sell at home with duty on inputs, not final goods."},{"l":"Abolish MAT","t":"Remove MAT for SEZs and harmonise GST rules."},{"l":"WTO-compatible support","t":"Support infrastructure, not export-linked tax breaks."},{"l":"Land norms","t":"Semiconductor SEZs now need [[10 ha]] instead of 50."}],"q":"How should SEZs be reformed?","cue":"Domestic sales → no MAT → WTO-compatible → land norms."}]},{"id":"GS38-data-fdi-sezs-liberalisat","line":"GS3.8","part":"FDI and SEZs","name":"FDI and SEZs: key data","own":true,"cards":[{"k":"data","title":"Numbers","q":"What are the key numbers?","rows":[{"l":"Cross-border payments","t":"A [[$206 bn]] market, with Project Nexus for instant payments."}]},{"k":"data","title":"Lines","q":"Which lines can you quote?","rows":[{"l":"Tax justice","t":"Countries lose about [[$492 bn]] a year to tax abuse."}]}]},{"id":"GS39-energy-transition","line":"GS3.9","part":"Energy","name":"Energy transition","own":true,"cards":[{"k":"define","q":"What is the energy transition?","text":"The shift from fossil fuels to renewable and low-carbon sources while keeping power reliable and affordable."},{"k":"for","q":"What progress has India made in the energy transition?","rows":[{"l":"2030 target met early","t":"Non-fossil sources reached [[54%]] of capacity by July 2026."},{"l":"Solar boom","t":"Solar grew from 2.8 GW in 2014 to about [[165 GW]]."},{"l":"Wind and bio-energy","t":"Wind is about [[58 GW]], fourth in the world."},{"l":"Energy security","t":"Domestic renewables replace imported fuel and narrow trade deficits."},{"l":"Decentralised green jobs","t":"Rooftop solar and solar pumps spread jobs, like PM Surya Ghar."}],"cue":"Target met → solar boom → wind → energy security → green jobs."},{"k":"against","q":"What holds back India’s energy transition?","rows":[{"l":"Capacity is not generation","t":"Non-fossil is half of capacity but only about [[29%]] of generation."},{"l":"Financing gap","t":"The transition needs [[₹150 lakh crore]] between 2024 and 2030. (ES 2025-26)"},{"l":"Weak DISCOMs","t":"DISCOMs carry accumulated losses of about [[₹6.5–7 lakh crore]]."},{"l":"Crude dependence","t":"About [[89%]] of crude oil is imported."},{"l":"Grid and storage gaps","t":"Weak transmission and storage force solar curtailment."}],"cue":"Capacity ≠ generation → money gap → weak DISCOMs → crude imports → grid gaps."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Fix DISCOMs","t":"Use RDSS and Gujarat's model, which cut AT&C losses to about [[13%]]."},{"l":"Storage and evacuation","t":"Fund battery storage through VGF and build green corridors."},{"l":"Clean transport","t":"Push EVs through PM E-DRIVE and the Green Hydrogen Mission."},{"l":"Energy buffers","t":"Expand strategic petroleum reserves beyond [[5.3 MMT]]."},{"l":"Green finance","t":"Raise transition capital through blended finance and green bonds."}],"cue":"DISCOMs → storage → clean transport → buffers → green finance."},{"k":"diagram","q":"Draw the diagram for Energy transition","g":{"dir":"LR","nodes":[["C","Coal - baseload"],["G","Grid"],["R","Solar and wind - variable"],["S","Storage - BESS, pumped hydro"],["T","Green energy corridors"],["D","Reliable clean power"]],"edges":[["C","G",""],["R","G",""],["S","G",""],["T","G",""],["G","D",""]]}},{"k":"data","q":"What do the capacity and emissions numbers show?","title":"Data","rows":[{"l":"Per-capita emissions","t":"About [[2.9 t]], against a world average of 6.7 t. (ES 2025-26)"},{"l":"Installed capacity","t":"[[509.7 GW]] in Nov 2025, about half from renewables. (ES 2025-26)"},{"l":"Solar capacity","t":"[[135.8 GW]] in Dec 2025, third in the world. (ES 2025-26)"},{"l":"China comparison","t":"China has about [[1,228 GW]] of renewables."},{"l":"Entropy effect","t":"The Survey warns fast decarbonisation without buffers adds volatility."},{"l":"Green Hydrogen Mission","t":"[[5 MMT]] of green hydrogen a year by 2030."}]}]},{"id":"GS39-nuclear-energy","line":"GS3.9","part":"Energy","name":"Nuclear energy","own":true,"cards":[{"k":"define","q":"What role does nuclear energy play?","text":"Power generated from controlled nuclear fission reactions, providing reliable, low-carbon baseload electricity to complement variable renewables."},{"k":"for","q":"Why expand nuclear energy?","rows":[{"l":"Clean baseload","t":"Plants run above [[80%]] load factor, unlike 15–25% for renewables."},{"l":"Big expansion","t":"Capacity is to grow from 8.8 GW to [[100 GW]] by 2047."},{"l":"Three-stage programme","t":"The Kalpakkam PFBR reached criticality in April 2026, opening Stage II."},{"l":"Small Modular Reactors","t":"[[₹20,000 crore]] for indigenous SMRs, with five by 2033."},{"l":"Energy independence","t":"Nuclear cuts fuel imports and needs little land per megawatt."}],"cue":"Baseload → 100 GW → Stage II → SMRs → independence."},{"k":"against","q":"What holds nuclear energy back?","rows":[{"l":"High cost, long delays","t":"The PFBR took over two decades to reach criticality."},{"l":"Imported uranium","t":"Slow progress on the three stages keeps uranium imports necessary."},{"l":"Safety and waste","t":"Waste and safety fears fuel protests, as at Kudankulam."},{"l":"Liability concerns","t":"The SHANTI Act repealed the 2010 supplier-liability law, raising compensation worries."},{"l":"Water and siting","t":"Cooling needs limit sites in water-stressed regions."}],"cue":"Cost and delay → imported uranium → safety → liability → water."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Cheaper imports","t":"Customs exemption on nuclear-project imports now runs to 2035. (Budget 2026-27)"},{"l":"Fast-track SMRs","t":"Build BSMR-200 and SMR-55 at sites like Tarapur."},{"l":"Independent regulator","t":"Give the AERB real statutory independence under the SHANTI Act."},{"l":"Fuel security","t":"Rep
