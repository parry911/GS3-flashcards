 fossil fuel import dependence and insulates the economy from global energy shocks while requiring minimal land per megawatt","t":"e.g. cutting thermal coal import bills"}],"cue":"Nuclear power delivers round-the-clock clean baseload electricity, scales rapidly through private capital and modular reactors, and unlocks long-term energy independence via India’s three-stage thorium programme."},{"k":"against","q":"What holds nuclear energy back?","rows":[{"l":"Demands heavy upfront capital expenditure and suffers from multi-year gestation lags and cost overruns that raise levelised tariffs","t":"e.g. PFBR taking over two decades to achieve criticality in 2026"},{"l":"Remains dependent on imported uranium and foreign reactor components in the near term due to the slow roll-out of the indigenous three-stage programme","t":"e.g. Stage II PFBR reaching criticality only in 2026"},{"l":"Triggers persistent safety, high-level radioactive waste disposal, and environmental concerns that weaken public acceptance","t":"e.g. post-Fukushima protests delaying projects at Kudankulam and Jaitapur"},{"l":"Faces public scrutiny and investor caution around civil nuclear liability and regulatory independence following the repeal of the 2010 supplier-liability law under the SHANTI Act, 2025","t":"e.g. community concerns over accident compensation caps"},{"l":"Requires large volumes of cooling water and strict security perimeters, limiting siting options in water-stressed inland regions","t":"e.g. competition with agricultural water demand"}],"cue":"High upfront capital costs, long gestation timelines, imported uranium dependence, and unresolved waste, safety, and liability concerns constrain rapid nuclear expansion."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Lower upfront capital and import costs through targeted fiscal relief, building on Budget 2026–27’s extension of customs duty exemptions on nuclear-project imports to 2035 across all plants regardless of capacity and cutting duty on control, protection, and burnable absorber rods from [[7.5%]] to zero","t":""},{"l":"Fast-track commercial deployment of indigenous Small Modular Reactors (BSMR-200 and SMR-55) via public-private partnerships and brownfield coal-plant sites","t":"e.g. Tarapur sites approved for BSMR-200 and SMR-55"},{"l":"Operationalise the SHANTI Act, 2025 with clear rules for private joint ventures while safeguarding statutory independence and strict enforcement powers for the Atomic Energy Regulatory Board (AERB)","t":""},{"l":"Scale up Stage II fast breeder replication and Stage III thorium fuel-cycle R&D while securing long-term bilateral uranium contracts to ensure uninterrupted fuel supply","t":"e.g. supply agreements with Kazakhstan, Canada, and Australia"},{"l":"Invest in closed-loop fuel reprocessing, deep geological waste repositories, and transparent local benefit-sharing and emergency drills to build public confidence","t":"e.g. CSR-funded local infrastructure around nuclear parks"}],"cue":"Realising the 100 GW target requires lowering capital and import costs, fast-tracking SMRs and Stage II/III reactors, empowering independent safety regulators, and building local community trust."},{"k":"diagram","q":"Draw the three-stage programme diagram (Nuclear energy)","g":{"dir":"LR","nodes":[["A","Stage 1 - PHWR, natural uranium"],["B","Stage 2 - fast breeders, plutonium - PFBR"],["C","Stage 3 - thorium reactors"]],"edges":[["A","B",""],["B","C",""]]}}]},{"id":"GS39-greenium","line":"GS3.9","part":"Energy","name":"Greenium","own":true,"cards":[{"k":"define","text":"The yield advantage of green bonds over ordinary bonds, i.e. how much cheaper green issuers borrow. In India it is modest, [[0–6 bps]].","q":"What is meant by greenium?"}]},{"id":"GS39-solar-energy","line":"GS3.9","part":"Energy","name":"Solar energy","own":true,"cards":[{"k":"define","q":"What is solar energy?","text":"Electricity generated from sunlight through photovoltaic cells or solar thermal plants, offering clean, zero-fuel power at utility and decentralised scales."},{"k":"for","q":"Why is solar central to India’s energy future?","rows":[{"l":"Strengthens energy security and saves foreign exchange by generating power with zero fuel costs and no coal or gas imports","t":"e.g. curbing thermal coal import bills and insulating against global fuel shocks"},{"l":"Delivers the cheapest new electricity in India, with auction tariffs falling to about [[₹2.4–2.5]] per unit (2018 onward), well below new coal plants","t":""},{"l":"Democratises power generation through distributed rooftops and farm pumps, with PM Surya Ghar reaching [[≈50 lakh]] homes ([[≈15 GW]]) of its [[1 crore]] target and PM-KUSUM solarising [[≈28 lakh]] pumps (2026)","t":""},{"l":"Builds domestic manufacturing scale and green employment, backed by [[≈170 GW]] of module-making capacity and PLI for high-efficiency modules","t":""},{"l":"Deploys in months rather than years with zero local air pollution or operational water consumption","t":"e.g. [[2,245 MW]] Bhadla Solar Park developed in arid Rajasthan"}],"cue":"Solar power delivers cheap, zero-fuel domestic electricity that scales rapidly from utility parks to household rooftops while cutting fossil import bills."},{"k":"against","q":"What are the limits of solar energy?","rows":[{"l":"Suffers from daytime intermittency and seasonal variability, requiring costly storage and flexible grids to ensure round-the-clock power","t":"e.g. evening peak-demand mismatches"},{"l":"Faces transmission bottlenecks and power curtailment as evacuation lines lag behind rapid generation additions","t":"e.g. [[300]] GWh renewable power curtailed in Q1 2026"},{"l":"Strains thermal power plants (GS3 2015 Q9) and weak DISCOM finances, causing falling thermal load factors, stranded assets, the need to run coal plants flexibly as back-up, and delayed payments to solar generators","t":""},{"l":"Requires [[≈4–5]] acres per MW, triggering land acquisition delays and conflicts over fertile farmland and wildlife habitats","t":"e.g. Great Indian Bustard habitat litigation in Rajasthan and Gujarat"},{"l":"Remains heavily dependent on China for upstream cells, wafers, and polysilicon despite large domestic module assembly","t":"e.g. domestic solar-cell manufacturing costing nearly [[40%]] more than Chinese output"}],"cue":"Daytime intermittency, lagging grid evacuation, land-use conflicts, upstream Chinese supply dependence, and DISCOM stress limit solar power's reliability."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Scale grid-stabilising storage and flexible grid management through Viability Gap Funding (VGF) for battery storage and pumped storage hydro projects","t":"e.g. [[2.7 GW]] / [[7.8]] GWh BESS added in 2026"},{"l":"Fast-track high-voltage evacuation infrastructure to eliminate curtailment and integrate solar parks","t":"e.g. Green Energy Corridor and [[12,139]] circuit km transmission lines added in FY25–[[26]]"},{"l":"Deepen upstream domestic manufacturing of solar cells, wafers, and polysilicon through PLI schemes and mandatory Approved List of Models and Manufacturers (ALMM) norms","t":"e.g. ALMM extended to solar cells in June 2026 and wafers from June 2028"},{"l":"Minimise land-use conflicts by prioritising rooftop, canal-top, floating solar, and agrivoltaics on degraded or dual-use land","t":"e.g. PM Surya Ghar and [[5,000 MW]] PM Surya Sarovar Yojana for floating solar"},{"l":"Restore DISCOM financial health and enforce payment security mechanisms to prevent delayed dues to solar generators","t":"e.g. Revamped Distribution Sector Scheme (RDSS) and Late Payment Surcharge rules"}],"cue":"Reliable solar expansion requires grid-scale storage, green transmission corridors, upstream manufacturing self-reliance, dual-use land models, and financially healthy DISCOMs."},{"k":"data","q":"Which schemes push solar?","title":"Data","rows":[{"l":"PM Surya Ghar","t":"Muft Bijli Yojana (Feb 2024, [[₹75,021 crore]]): rooftop solar, up to 300 free units a month"},{"l":"PM-KUSUM (2019)","t":"solar pumps and feeder solarisation"}]}]},{"id":"GS39-green-energy-corridor-and-grid-integrati","line":"GS3.9","part":"Energy","name":"Green energy corridor and grid integration","own":true,"cards":[{"k":"define","q":"What is the Green Energy Corridor?","text":"Dedicated high-voltage transmission lines, substations, and storage networks built to evacuate variable renewable power from resource-rich states to demand centres and integrate it into the national grid."},{"k":"for","q":"What has the Green Energy Corridor achieved?","rows":[{"l":"Expands national clean-energy evacuation capacity","t":"Phase I commissioned [[3,200]] ckm of inter-state lines (March 2020) and [[9,700]] ckm of intra-state lines (approved 2015; completed in Gujarat, Rajasthan, Tamil Nadu, and Andhra Pradesh with MNRE support), while Phase II added [[10,750]] ckm and [[27,500]] MVA across [[7]] states (Jan 2022)."},{"l":"Unlocks remote, high-potential renewable hubs by building dedicated inter-state transmission paired with utility-scale storage, including a line for [[13 GW]] of renewables plus [[12]] GWh of storage in Ladakh","t":""},{"l":"Stabilises the grid and cuts transmission losses by integrating intermittent solar and wind generation through real-time forecasting and smart substations","t":"e.g. Renewable Energy Management Centres (REMCs)"},{"l":"Scales up next-generation grid storage and state-level evacuation capacity to absorb [[500 GW]] of non-fossil power by 2030","t":"e.g. Green Energy Corridor Phase-III approved in September 2026 with a [[₹1.9 lakh crore]] outlay for [[135 GW]] evacuation and [[50]] GWh BESS"},{"l":"Extends clean grid connectivity across borders under One Sun One World One Grid (OSOWOG)","t":"floated by India at the first ISA Assembly (Oct 2018) and launched with the UK as the Green Grids Initiative–OSOWOG at COP26,Glasgow (Nov 2021)—so solar power flows where the sun is not shining."}],"cue":"Dedicated green transmission corridors evacuate distant clean power reliably, stabilise the national grid against solar and wind variability, and enable cross-border energy trade."},{"k":"against","q":"What are the challenges in grid integration?","rows":[{"l":"Mismatched execution timelines leave new solar and wind parks stranded without evacuation lines, as transmission projects face severe delays from land acquisition, right-of-way disputes, and forest clearances (Ministry of Power)","t":""},{"l":"Acute grid-scale storage deficits mean that even with new transmission lines, midday solar surpluses face heavy curtailment and frequency instability without batteries or pumped hydro","t":"e.g. around [[6,900]] GWh of clean electricity curtailed in FY26 due to grid congestion"},{"l":"Massive capital requirements and weak state DISCOM finances slow down intra-state grid upgrades and inflate transmission charges","t":"e.g. CEA estimating [[₹9.2 lakh crore]] needed for grid expansion by 2032"},{"l":"Cross-border grid initiatives like OSOWOG face steep geopolitical trust deficits, regulatory divergence, and huge upfront financing hurdles across nations","t":"e.g. regional security and tariff-harmonisation barriers in South Asia"},{"l":"High import dependence for grid-scale battery storage minerals and high-voltage equipment exposes grid integration to global supply shocks","t":"e.g. near-total import reliance on processed lithium, nickel, and cobalt"}],"cue":"Transmission delays, grid-scale storage shortages, weak state utility finances, and geopolitical trust deficits slow down seamless renewable integration."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Pair every new transmission corridor with mandatory utility-scale Battery Energy Storage Systems (BESS) and pumped hydro to eliminate midday curtailment","t":"e.g. GEC-III's [[50]] GWh BESS outlay and Viability Gap Funding for BESS"},{"l":"Fast-track land, forest, and right-of-way approvals through unified digital portals, standardised landowner compensation norms, and parallel clearances","t":"e.g. PM Gati Shakti National Master Plan and Ministry of Power RoW guidelines"},{"l":"Deploy smart grid management, real-time renewable forecasting, and tariff-based competitive bidding to balance grid frequency and lower transmission costs","t":"e.g. Renewable Energy Management Centres and TBCB execution"},{"l":"Strengthen state transmission utilities and DISCOM finances through central grants and open-access reforms so intra-state grids keep pace with generation","t":"e.g. [[₹54,082 crore]] Central Financial Support under GEC-III and RDSS"},{"l":"Operationalise bilateral cross-border interconnections with trusted neighbours first as practical building blocks toward wider OSOWOG regional grids","t":"e.g. India–Nepal, India–Bhutan, and proposed India–Sri Lanka subsea links"}],"cue":"Reliable grid integration requires pairing transmission expansion with utility-scale storage, fast-tracked clearances, smart grid forecasting, and regional power treaties."}]},{"id":"GS39-energy-access-and-sdg-7","line":"GS3.9","part":"Energy","name":"Energy access and SDG 7","own":true,"cards":[{"k":"define","q":"What does SDG 7 require?","text":"SDG [[7]] aims to ensure universal access to affordable, reliable, sustainable, and modern energy for all by 2030."},{"k":"for","q":"What has India achieved on energy access?","rows":[{"l":"Achieved near-universal electricity access by electrifying all villages (April 2018) and connecting households via Saubhagya, lifting rural supply hours (from [[12.5]] hours in FY14 to [[22.6]] hours in FY25), cutting power shortages from [[4.2%]] to [[0.1%]] (FY25), and raising per-capita consumption by [[≈26%]]","t":""},{"l":"Expanded clean cooking fuel access to poor rural households through PM Ujjwala Yojana LPG connections, reducing indoor air pollution and women's firewood collection drudgery","t":"e.g. over [[10.3 crore]] active PMUY connections"},{"l":"Built a clean energy capacity base to make universal access sustainable, with over half of installed capacity coming from non-fossil sources ([[51.9%]], ES 2025–26)","t":""},{"l":"Improved energy efficiency and lowered household electricity bills at scale through UJALA (Jan 2015),distributing [[36.9 crore]] LED bulbs nationwide (PIB)","t":""},{"l":"Empowered rural livelihoods, healthcare cold chains, and digital financial inclusion by extending reliable power and decentralised solar to remote habitations","t":"e.g. PM-KUSUM solar pumps and PM-JANMAN tribal electrification"}],"cue":"Universal grid electrification, clean cooking subsidies, LED efficiency drives, and expanding non-fossil capacity have rapidly broadened modern energy access across India."},{"k":"against","q":"Where does India fall short on SDG 7?","rows":[{"l":"Suffers from last-mile reliability gaps, as rural areas still face frequent power outages, voltage fluctuations,and transformer failures due to financially weak DISCOMs","t":"e.g. accumulated DISCOM losses of [[₹6.5–7 lakh crore]] and [[≈15%]] AT&C losses"},{"l":"Faces persistent clean-cooking affordability barriers, as LPG refills drop sharply after the first free cylinder and push poor households back to polluting firewood and biomass","t":"e.g. PMUY average consumption remaining around [[4.4]] cylinders per year against [[7–8]] needed"},{"l":"Lacks environmental sustainability in actual power generation because coal still dominates electricity supply despite high renewable capacity","t":"e.g. coal generating [[≈70%]] of electricity in FY26"},{"l":"Excludes unrecorded tenants, remote forest hamlets, and urban informal settlements from formal metering and uninterrupted lifeline power","t":"e.g. last-mile distribution gaps in remote hilly and tribal regions"},{"l":"Leaves agricultural and industrial users burdened by skewed cross-subsidies, poor power quality, and high per-capita energy inequality","t":"e.g. India's per-capita electricity use remaining roughly one-third of the global average"}],"cue":"Last-mile voltage instability, weak DISCOM finances, low LPG refill affordability, and heavy coal reliance prevent universal access from becoming truly reliable and sustainable."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Strengthen DISCOM finances and rural distribution infrastructure to ensure 24x7 voltage-stable power through smart metering, feeder segregation, and loss reduction","t":"e.g. Revamped Distribution Sector Scheme (RDSS)"},{"l":"Make clean cooking permanently affordable by continuing targeted refill subsidies, introducing smaller 5-kg cylinders, and scaling piped gas and biogas","t":"e.g. [[₹300]]/cylinder PMUY targeted subsidy, City Gas Distribution, and GOBARdhan"},{"l":"Expand decentralised renewable energy and microgrids for remote villages, rooftops, and farms to cut transmission losses and coal dependence","t":"e.g. PM Surya Ghar: Muft Bijli Yojana and PM-KUSUM"},{"l":"Scale demand-side energy efficiency across appliances, buildings, and MSMEs to meet growing power demand sustainably","t":"e.g. BEE Star Labelling, Perform Achieve and Trade (PAT) scheme, and Street Lighting National Programme"},{"l":"Pair rural electrification with productive livelihood appliances and digital billing transparency so energy access translates into higher rural incomes","t":"e.g. solar-powered cold storages, micro-enterprises, and India Energy Stack"}],"cue":"Achieving SDG 7 by 2030 requires strengthening rural distribution grids, targeting cooking subsidies and clean alternatives, decentralising renewables, and scaling energy efficiency."}]},{"id":"GS39-run-of-river-hydro","line":"GS3.9","part":"Energy","name":"Run-of-river hydro","own":true,"cards":[{"k":"define","q":"What is run-of-river hydro?","text":"A hydroelectric plant that uses a river’s natural flow and elevation drop with little or no reservoir (only small pondage), unlike storage dams that hold water for months."},{"k":"for","q":"Why prefer run-of-river hydro?","rows":[{"l":"Avoids massive forest submergence, ecological loss, and human displacement by eliminating large storage reservoirs","t":"e.g. [[1,500 MW]] Nathpa Jhakri project on the Sutlej"},{"l":"Requires lower capital expenditure and shorter construction timelines than storage dams, accelerating clean capacity addition","t":"e.g. Small Hydro Power Development Scheme, 2026 targeting [[1,500 MW]] with a [[₹2,584.6 crore]] outlay"},{"l":"Suits the steep gradients and perennial snow-melt flows of Himalayan and North-Eastern rivers, unlocking India’s largest untapped hydro potential","t":"e.g. Arunachal Pradesh and Uttarakhand basins"},{"l":"Provides fast-ramping peaking power via small pondage to balance intermittent solar and wind generation on the grid","t":"e.g. evening peak-demand support"},{"l":"Delivers decentralised, zero-emission electricity to remote hilly and border communities while reducing transmission losses","t":"e.g. micro and mini hydro plants up to [[25 MW]]"}],"cue":"Harnessing natural river gradients generates clean, rapid-ramping electricity with far lower land submergence, human displacement, and upfront capital cost than mega-dams."},{"k":"against","q":"What are the risks of run-of-river hydro?","rows":[{"l":"Generates erratic seasonal power","t":"surging in the monsoon and dropping sharply in lean winter months—while offering zero flood-control or irrigation storage (e.g., [[16.3%]] fall in national hydro output during weak rains in FY24)."},{"l":"Exposes infrastructure and downstream settlements to extreme Himalayan climate hazards, as seen when the 2021 Chamoli flood wrecked the Rishiganga and Tapovan run-of-river projects","t":""},{"l":"Dries up long river stretches between diversion dams and powerhouses through headrace tunnelling,fragmenting aquatic habitats and downstream livelihoods","t":"e.g. Teesta and Alaknanda river basins"},{"l":"Destabilises fragile young fold mountains through heavy blasting, muck dumping, and tightly spaced cascade projects that trigger landslides","t":"e.g. Joshimath land subsidence and Bhagirathi valley cascades"},{"l":"Suffers from heavy Himalayan siltation that abrades turbine blades, reduces pondage capacity, and drives up maintenance outages","t":"e.g. high sediment loads in Sutlej and Brahmaputra tributaries"}],"cue":"Dependence on seasonal river flows eliminates flood and irrigation storage while intensive tunnelling and cascade dams destabilise fragile Himalayan geology and river ecology."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Enforce basin-wide cumulative impact assessments and minimum distance norms between projects to prevent ecological overload","t":"e.g. MoEFCC carrying-capacity studies for Himalayan basins"},{"l":"Mandate strict year-round environmental flows (e-flows) with real-time telemetry monitoring so diverted river stretches sustain aquatic life","t":"e.g. Central Water Commission e-flow norms for the Ganga basin"},{"l":"Upgrade geological risk mapping, silt-flushing tunnels, and automated Glacial Lake Outburst Flood (GLOF) early warning systems before project clearance","t":"e.g. NDMA GLOF monitoring guidelines"},{"l":"Pair seasonal run-of-river plants with pumped storage hydro and battery systems to convert monsoon surpluses into reliable year-round power","t":"e.g. [[1,000 MW]] Tehri Pumped Storage Plant commissioned in April 2026"},{"l":"Prioritise low-impact small hydro and canal-based projects with local community benefit-sharing and strict muck-disposal audits","t":"e.g. Small Hydro Power Development Scheme, 2026"}],"cue":"Sustainable run-of-river deployment requires basin-wide carrying-capacity limits, mandatory environmental flows, disaster-resilient engineering, and grid storage pairing."}]},{"id":"GS39-port-led-development","line":"GS3.9","part":"Ports","name":"Port-led development","own":true,"cards":[{"k":"define","q":"What is port-led development?","text":"Using ports, shipping, coastal and inland waterways to cut logistics costs and drive coastal industrialisation under Sagarmala (2015).","ed":true},{"k":"for","q":"What has port-led development achieved?","rows":[{"l":"Expands cargo capacity and operational efficiency","t":"raising port capacity from [[≈1,400]] to [[≈2,760]] MTPA in a decade, handling a record [[915 MT]] at major ports in FY26 (+[[7%]]), and cutting vessel turnaround time from [[43]] to [[30]] hours (e.g., Sagarmala port modernisation and mechanisation)."},{"l":"Builds world-class mega-ports and deep-water hubs to handle ultra-large vessels directly, led by Vadhavan ([[≈₹76,000 crore]], to be among the top [[10]] container ports), Vizhinjam (India’s first deep-water transhipment port), and planned Galathea Bay","t":""},{"l":"Boosts domestic shipbuilding and maritime financing through a [[₹69,725 crore]] package","t":"comprising the [[₹25,000 crore]] Maritime Development Fund and [[≈₹20,000 crore]] Shipbuilding Development Scheme—to place India among the top five shipbuilders by 2047."},{"l":"Replaces colonial regulations with modern governance via three 2025 laws: the Indian Ports Act (replacing the 1908 Act), Merchant Shipping Act, and Coastal Shipping Act","t":"e.g. streamlining Centre–state port coordination and ease of doing business"},{"l":"Lowers freight costs and industrialises coastal regions by shifting bulk cargo from congested roads and rail to coastal shipping and inland waterways alongside port-proximate manufacturing clusters","t":"e.g. Sagarmala’s five pillars and Coastal Economic Zones"}],"cue":"Modernising ports, building deep-water hubs, incentivising domestic shipbuilding, and overhauling maritime laws slash logistics costs and anchor export-led coastal industrialisation."},{"k":"against","q":"What holds port-led development back?","rows":[{"l":"Suffers from weak hinterland links, as inadequate last-mile road and rail connectivity raises dwell times and erodes port efficiency gains","t":"e.g. incomplete port-rail and dedicated freight links"},{"l":"Loses substantial foreign exchange to foreign transhipment hubs, with [[≈75%]] of India’s transhipped cargo moving through ports like Colombo and Singapore at an annual cost of [[≈$200–250]] mn","t":""},{"l":"Faces severe under-utilisation and procedural congestion, with major-port capacity utilisation at only [[≈49%]] due to bottlenecks like truck entry, [[≈30%]] of major-port berths run by private operators, and [[≈8–9 days]] of dwell time at JNPT","t":""},{"l":"Triggers ecological damage and livelihood displacement from dredging, land reclamation, and coastal erosion, sparking local opposition","t":"e.g. fishing community protests against the Vadhavan port project"},{"l":"Remains vulnerable to fragmented Centre–state port coordination across major and non-major ports as well as rising sea levels and cyclonic weather","t":"e.g. climate-resilience gaps along coastal ports"}],"cue":"Weak hinterland connectivity, foreign transhipment dependence, procedural port congestion, and fragile coastal ecosystems prevent Indian ports from matching global efficiency."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Accelerate last-mile multimodal road, rail, and inland waterway connectivity to eliminate hinterland bottlenecks under Sagarmala [[2.0]] (supported with [[₹85,482 crore]]) and PM Gati Shakti","t":"e.g. Dedicated Freight Corridors and National Waterways"},{"l":"Operationalise domestic deep-water transhipment hubs at Vizhinjam, Vadhavan, and Galathea Bay (Great Nicobar) to recapture the [[≈$200–250]] mn lost annually to Colombo and Singapore","t":""},{"l":"Raise capacity utilisation beyond [[≈49%]] and slash JNPT’s [[≈8–9]] day dwell time by digitising customs and truck gates, expanding PPP berths, and standardising port processes","t":"e.g. One Nation One Port Process (ONOP)"},{"l":"Safeguard coastal ecology and fishing livelihoods through sustainable dredging, green port transitions, and targeted harbour-and-skill support","t":"e.g. Harit Sagar Green Port Guidelines, Green Tug Transition Programme, and Sagarmala coastal community projects"},{"l":"Promote port-led industrialisation and coastal shipping through Coastal Economic Zones, Smart Industrial Port Cities, and dedicated coastal berths to shift bulk cargo off roads","t":"e.g. Kandla, Paradip, and Ennore industrial clusters"}],"cue":"Unlocking true port-led growth requires seamless multimodal hinterland integration, domestic transhipment hubs, digitised port clearances, and green, community-inclusive coastal planning."},{"k":"data","rows":[{"l":"Vessel turnaround time","t":"cut from 43 to 30 hours (ES 2025-26)"},{"l":"Inland waterways","t":"32 National Waterways covering [[5,155 km]] operational (Nov 2025) (ES 2025-26)"},{"l":"Sagarmala (2015)","t":"five pillars – port modernisation (new ports, ship repair), port connectivity (road, rail, pipeline), port-led industrialisation, coastal communities (skills, fisheries jetties), coastal shipping and inland waterways (Ro-Ro, Ro-Pax, cruise tourism); funded through SPVs and budget support; National Sagarmala Apex Committee; Sagarmala young professionals scheme (notebook)"},{"l":"Jal Marg Vikas Project","t":"capacity on NW-1 (Ganga, Haldia–Varanasi) with Ro-Ro and multimodal terminals; NW-2 is the Brahmaputra, NW-3 the West Coast Canal (Kollam–Kottapuram) (notebook)"},{"l":"National Logistics Portal (Marine)","t":"single window for end-to-end logistics; Sagar Setu app (notebook)"}],"q":"Which schemes and data back up port-led development?"},{"k":"data","rows":[{"l":"Cruise Bharat Mission","t":"double cruise traffic by 2029; [[≈4 lakh]] jobs; [[15 lakh]] river-cruise passengers (notebook)"},{"l":"Green Tug Transition Programme (Amrit Kaal Vision 2047)","t":"green tugs to cut port emissions by 2030; nodal body: National Centre of Excellence in Green Port and Shipping (notebook)"},{"l":"Maritime India Vision","t":"2030 (150+ initiatives) and Maritime Amrit Kaal Vision 2047 ([[≈₹80 lakh crore]] of investment)"},{"l":"Scheme for Container Manufacturing (Budget 2026-27)","t":"[[₹10,000 crore]] [[over 5 years]]","unlikely":true},{"l":"Tuticorin container terminal","t":"Tuticorin international container terminal: [[≈6 lakh]] TEU a year, takes ships up to 10,000 TEU, so India can handle bigger vessels (notebook)"}],"q":"Which schemes and data back up port-led development?"},{"k":"data","q":"What is the scale of India’s ports?","rows":[{"l":"Coast and ports","t":"[[≈7,500 km]] coastline, [[12]] major ports"},{"l":"Cargo","t":"[[≈1.4 bn]] tonnes: about [[95%]] of India’s trade by volume and [[70%]] by value"}]},{"k":"diagram","q":"Draw the Sagarmala diagram (Port-led development)","g":{"dir":"TD","nodes":[["S","Sagarmala"],["M","Port modernisation"],["C","Port connectivity"],["I","Port-led industrialisation"],["K","Coastal communities"],["W","Coastal shipping and inland waterways"]],"edges":[["S","M",""],["S","C",""],["S","I",""],["S","K",""],["S","W",""]]}}]},{"id":"GS39-inland-waterways-and-cruise-tourism","line":"GS3.9","part":"Infrastructure","name":"Inland waterways and cruise tourism","own":true,"cards":[{"k":"define","q":"What are inland waterways?","text":"Moving cargo and people on rivers and canals: cheaper and cleaner than road.","ed":true},{"k":"data","q":"How many National Waterways does India have?","rows":[{"l":"National Waterways","t":"[[111]] declared, [[32]] operational (March 2026)"},{"l":"Institutions","t":"developed by the Inland Waterways Authority of India (IWAI) under the National Waterways Act, 2016"}]},{"k":"for","q":"What are the gains from Inland waterways and cruise tourism?","rows":[{"l":"Cuts freight costs and carbon emissions significantly compared to road and rail, lifting waterway cargo to [[218 MMT]] in FY26 and surpassing the [[200 MMT]] Maritime India Vision 2030 target early","t":"e.g. waterway transport cutting fuel use and emissions per tonne-km while raising modal share toward [[5%]]"},{"l":"Expands river transport capacity and multimodal logistics through the Jal Marg Vikas Project on NW-1 (Ganga, Haldia–Varanasi) with Ro-Ro and multimodal terminals, alongside NW-2 (Brahmaputra) and NW-3 (West Coast Canal, Kollam–Kottapuram)","t":"e.g. operational multimodal terminals at Varanasi, Sahibganj, and Haldia"},{"l":"Boosts high-value tourism and employment under the Cruise Bharat Mission, which aims to double cruise traffic by 2029 create [[≈4 lakh]] jobs, and carry [[15 lakh]] river-cruise passengers","t":"e.g. [[51]] river cruise circuits and [[100]]+ river terminals planned nationwide"},{"l":"Provides vital trade transit and passenger connectivity for landlocked states and the North-East, bypassing congested narrow land corridors","t":"e.g. Indo-Bangladesh Protocol Route linking Kolkata with Assam"},{"l":"Decongests highways and railways while stimulating local riverside commerce and rural livelihoods","t":"e.g. [[66]] operational community jetties along NW-1 under Arth Ganga serving [[≈1.2 lakh]] daily users"}],"cue":"Shifting bulk freight and leisure travel onto rivers slashes logistics costs and carbon emissions while unlocking employment across riverine corridors."},{"k":"against","q":"What are the problems with Inland waterways and cruise tourism?","rows":[{"l":"Suffers from shallow drafts, heavy monsoon siltation, and lean-season water drops that restrict year-round navigation for large vessels","t":"e.g. maintaining [[2.2–3.0]] metre assured depth on NW-1 requiring continuous dredging"},{"l":"Loses cost competitiveness on short and medium hauls due to high first- and last-mile road/rail transfer and terminal handling charges","t":"e.g. overall inland waterway freight share remaining near [[≈2%]]"},{"l":"Leaves most of the declared network underutilised, with only [[32]] of [[111]] National Waterways operational as of March 2026 due to slow infrastructure rollout","t":""},{"l":"Faces physical navigation barriers from low-clearance bridges, dams, barrages, and inadequate night-navigation aids","t":"e.g. lock bottlenecks at Farakka Barrage on NW-1"},{"l":"Threatens fragile riverine biodiversity and local fisherfolk livelihoods through capital dredging, riverbank erosion, and cruise vessel pollution","t":"e.g. acoustic and habitat disturbance to Gangetic river dolphins"}],"cue":"Seasonal water fluctuations, heavy siltation, costly first- and last-mile links, infrastructure bottlenecks, and ecological risks limit commercial scale."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Ensure year-round assured fairway depth, night-navigation aids, and multimodal road-rail linkages while operationalising [[20]] new National Waterways over five years as announced in Budget 2026–27","t":"e.g. digital river information systems and CAR-D cargo tracking"},{"l":"Incentivise cargo owners to switch from roads to rivers by subsidising waterway operating costs and first/last-mile multimodal transfers","t":"e.g. Jalvahak Cargo Promotion Scheme reimbursing up to [[35%]] of operating costs alongside the Coastal Cargo Promotion Scheme"},{"l":"Operationalise the Cruise Bharat Mission in phases by building dedicated cruise terminals, marinas, and heritage circuits while simplifying passenger clearances","t":"e.g. [[51]] river cruise circuits and [[₹1,500 crore]] Puri International Cruise Terminal"},{"l":"Standardise vessel registration, safety norms, and interstate navigation rules while building specialised maritime skills","t":"e.g. enforcing the Inland Vessels Act, 2021 and setting up Regional Centres of Excellence"},{"l":"Mandate eco-friendly dredging, zero-discharge norms, and green fuel transitions to protect river ecology and aquatic species","t":"e.g. Harit Nauka Guidelines targeting [[30%]] carbon-intensity cut by 2030 and [[100%]] green vessels by 2047"}],"cue":"Scaling waterways and cruise tourism requires assured fairway depth, multimodal hub integration, modal-shift subsidies, uniform safety rules, and green vessel standards."}]},{"id":"GS39-road-infrastructure","line":"GS3.9","part":"Roads","name":"Road infrastructure","own":false,"cards":[{"k":"for","rows":[{"l":"Network growth","t":"national highways [[91,287 km]] (FY14) → [[≈1.5 lakh]] km (+[[60%]]); high-speed corridors [[≈10x]] to [[5,364 km]] (ES 2025-26); four-lane-plus length up [[≈2.5x]] since 2014; construction pace [[≈12 km]] a day (FY14) → [[≈34 km]] a day (FY24) (notebook)"},{"l":"Density","t":"road density [[≈1.6 km]] per sq km against ≈0.68 in the US (notebook)"},{"l":"Lower logistics cost","t":"[[8.8%]] of GDP (FY23) → [[8.0%]] (FY24), below [[8%]] for the first time (DPIIT–NCAER); World Bank Logistics Performance Index 2023: India 38th of 139 (44th in 2018) and 22nd in international shipments"},{"l":"Rural connectivity","t":"PMGSY has connected [[99.7%]] of eligible habitations"},{"l":"Financing innovation","t":"InvITs and Toll-Operate-Transfer (asset monetisation)"}],"q":"What has road infrastructure achieved?","cue":"Longer network → dense → cheaper logistics → rural links → new financing."},{"k":"against","rows":[{"l":"NHAI debt","t":"cut from [[≈₹3.3 lakh crore]] to [[≈₹2.4 lakh crore]] (−[[27%]]) through asset monetisation and InvITs (notebook)","h":"Finance"},{"l":"Slowing pace","t":"construction fell from [[37 km]] a day (FY21) to [[≈25–27 km]] a day (FY26) as awards dropped (rating agencies)","h":"Infrastructure"},{"l":"Land and clearances","t":"acquisition cost and delays (see LARR Act, GS3.7)","h":"Rules and institutions"},{"l":"Quality","t":"the L1 (lowest-bidder) system invites poor construction; [[≈75%]] of highways are two-lane and [[≈40%]] of roads are dirt roads (notebook)","h":"Rules and institutions"},{"l":"Road safety","t":"India has among the highest road deaths in the world","fix":"the 4 Es: education, engineering, enforcement, emergency care; Good Samaritan protection for people who help victims (notebook)","h":"Equity and sustainability"}],"q":"What problems remain in road infrastructure?","cue":"Debt, slowing pace, land, quality, safety."},{"k":"data","rows":[{"l":"Share of effective capex","t":"Roads and railways take more than half of effective capex (ES 2025-26)"},{"l":"PMGSY (2000)","t":"all-weather rural roads; PMGSY-IV (2024-29): [[62,500 km]] to connect 25,000 habitations, [[₹70,125 crore]]"},{"l":"Bharatmala Pariyojana (2017)","t":"[[34,800 km]] of highways and economic corridors in Phase I – economic corridors, feeder routes, border and international links, greenfield expressways; NHAI implements under MoRTH; funded by the Central Road and Infrastructure Fund cess, budget, borrowing and PPP; Bhoomi Rashi portal for land acquisition; [[over 20,000 km]] built, e.g. the Delhi–Mumbai, Amritsar–Jamnagar and Ganga expressways (notebook)"},{"l":"Char Dham Mahamarg Vikas Pariyojana (Uttarakhand)","t":"[[≈70%]] done by 2024 (notebook)"},{"l":"Multimodal logistics parks at Chennai, Indore, Nagpur","t":"Jalna, Jogighopa and Bengaluru: small truckloads are pooled into large ones (notebook)"}],"q":"Which schemes back up road infrastructure?"},{"k":"data","rows":[{"l":"PM Gati Shakti (2021) and National Logistics Policy (2022)","t":"aim to cut logistics cost to [[≈8–9%]] of GDP; sectoral plans for coal, cement, fertiliser, steel and pharma; Unified Logistics Interface Platform; the coal logistics plan moves coal from mine to rail directly, saving [[≈1 lakh]] tonnes of CO2 a year (notebook)"},{"l":"Setu Bharatam","t":"road over-bridges replace level crossings on national highways; INAM-PRO: web marketplace for infrastructure materials (notebook)"},{"l":"National Highway Maintenance Policy","t":"performance-based maintenance contracts ([[5–7 years]]) and short-term contracts (notebook)"},{"l":"Vehicle Scrapping Policy","t":"82 registered scrapping facilities, [[≈1.6 lakh]] vehicles scrapped; buyers of a new vehicle get [[≈4–6%]] of the ex-showroom price as incentive (notebook)"},{"l":"From the diagram","t":"Rail - DFCs; Ports - Sagarmala; Airports - UDAN"}],"q":"Which schemes back up road infrastructure?"},{"k":"data","q":"How big is India’s road network?","rows":[{"l":"Network","t":"2nd-largest in the world ([[≈63 lakh]] km, notebook)"},{"l":"National highways","t":"[[≈2%]] of the network but [[≈40%]] of road traffic"},{"l":"Freight","t":"roads carry about two-thirds of freight"}]},{"k":"diagram","q":"Draw the PM Gati Shakti diagram (Road infrastructure)","g":{"dir":"TD","nodes":[["G","PM Gati Shakti - GIS master plan"],["R","Roads - Bharatmala"],["L","Rail - DFCs"],["P","Ports - Sagarmala"],["A","Airports - UDAN"],["W","Waterways"]],"edges":[["G","R",""],["G","L",""],["G","P",""],["G","A",""],["G","W",""]]}}]},{"id":"GS39-udan","line":"GS3.9","part":"Aviation","name":"UDAN","own":true,"cards":[{"k":"define","q":"What is meant by UDAN?","text":"UDAN (Ude Desh ka Aam Nagrik): the Regional Connectivity Scheme under the National Civil Aviation Policy 2016, connecting underserved regional airports.","ed":true},{"k":"for","q":"Why does regional air connectivity matter?","rows":[{"l":"Connects underserved regions at scale, carrying [[1.7 crore]] passengers under the scheme (MoCA, Oct 2026)","t":""},{"l":"Bridges India’s low airport density","t":"just [[0.1]] per million people (ES 2025–26)—by reviving unserved regional airstrips."},{"l":"Integrates remote border regions like the Northeast, where [[90]] priority routes are operational (2026)","t":""},{"l":"Stimulates tier-2 and tier-3 tourism, trade, and employment","t":"e.g. civil aviation jobs reaching [[7.7 million]] in 2026"},{"l":"Makes flying affordable for ordinary citizens through airfare caps and state tax concessions","t":"e.g. capped fares on 1-hour regional flights"}],"cue":"Subsidising regional routes and reviving small airstrips democratises air travel, integrates remote regions, and unlocks economic growth in smaller cities."},{"k":"against","q":"Why do many UDAN routes fail?","rows":[{"l":"Suffers from high route mortality once subsidies expire, with [[≈123]] routes shutting before completing their 3-year VGF period","t":""},{"l":"Lacks essential airside infrastructure like Instrument Landing Systems at small airports, restricting operations to daylight-only flying","t":""},{"l":"Faces broader sector bottlenecks as major hub airports run over capacity alongside a shortage of air traffic controllers","t":"e.g. slot congestion at Delhi and Mumbai hubs"},{"l":"Inflates airline operating costs through high aviation fuel taxes and an unorganised domestic Maintenance, Repair, and Overhaul (MRO) sector","t":"e.g. steep state VAT on ATF"},{"l":"Weakens passenger convenience and route viability due to thin regional demand and poor last-mile road or rail links to remote airports","t":""}],"cue":"High post-subsidy route failures, basic airside infrastructure gaps, hub congestion, steep fuel taxes, and poor last-mile links threaten long-term route sustainability."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Roll out Modified UDAN (2026–36) with a [[₹28,840 crore]] budgetary outlay","t":"extending VGF to [[5]] years and replacing the trunk-route levy."},{"l":"Link new and upgraded regional airports to PM Gati Shakti to build seamless last-mile road and rail connectivity","t":"e.g. integrating regional aerodromes with Bharatmala corridors"},{"l":"Equip small airports with Instrument Landing Systems (ILS) for all-weather night operations while expanding hub capacity and recruiting air traffic controllers","t":""},{"l":"Lower airline operating expenses by bringing Aviation Turbine Fuel (ATF) under GST and building a competitive domestic MRO ecosystem","t":"e.g. aircraft leasing and MRO incentives at GIFT City IFSC"},{"l":"Improve passenger throughput and remote-terrain fleet availability through digital boarding and indigenous small aircraft","t":"e.g. Digi Yatra for paperless, face-based entry"},{"l":"Way forward","t":"Digi Yatra (paperless, face-based entry); Modified UDAN (2026-36): VGF extended to [[5]] years, budget support instead of a trunk-route levy; link new airports to PM Gati Shakti (road and rail to the airport)"}],"cue":"Making regional aviation self-sustaining requires extended budgetary VGF, multimodal PM Gati Shakti links, night-landing upgrades, and lower fuel and MRO taxes."},{"k":"data","rows":[{"l":"Market size","t":"India is the 3rd-largest domestic aviation market (MoCA); [[≈21 crore]] passengers (2024), [[≈3.8 crore]] of them international; fleet ≈800 aircraft; cargo [[≈3.7 MT]] ([[≈2 MT]] international); [[≈3 lakh]] direct and [[≈77 lakh]] indirect jobs (notebook)"},{"l":"UDAN versions","t":"5.0 removed the [[500 km]] cap and prioritised ready airports; 5.1 helicopters with VGF; 5.2 small aircraft; 5.3 and 5.4 revive discontinued routes (notebook)"},{"l":"Modified UDAN (Cabinet, March 2026; launched 4 July 2026)","t":"FY27–FY36, [[₹28,840 crore]] of budget support; 100 new airports from unused airstrips, 200 helipads, 120 new destinations, [[4 crore]] more passengers; airports built in challenge mode"},{"l":"Routes that survived","t":"Jalgaon, Agra and Hindon kept drawing passengers after the UDAN subsidy ended, while other routes closed (2026)"},{"l":"From the diagram","t":"VGF and concessions"},{"l":"UDAN success stories","t":"traffic at Agra, Hindon and Tezpur grew 7–10x and at Jalgaon, Bhuj and Diu [[3]]–5x, against [[1]].2x for all Indian air traffic (Business Today, April 2026)"}],"q":"How has UDAN evolved?"},{"k":"diagram","q":"Draw the diagram for UDAN","g":{"dir":"LR","nodes":[["V","VGF and concessions"],["R","Regional routes, capped fares"],["P","Passengers from small towns"],["D","Routes viable - or die when VGF ends"]],"edges":[["V","R",""],["R","P",""],["P","D",""]]}},{"k":"data","q":"What has UDAN achieved?","title":"Data","rows":[{"l":"Airport boom","t":"operational airports 74 (2014) → 165 (July 2026) (PIB)"}]},{"k":"data","q":"How is UDAN run and funded?","rows":[{"l":"Run by","t":"MoCA; implemented by AAI"},{"l":"Funded by","t":"a Regional Connectivity Fund levy plus Viability Gap Funding (VGF)"}]}]},{"id":"GS39-airport-privatisation","line":"GS3.9","part":"Aviation","name":"Airport privatisation","own":true,"cards":[{"k":"define","q":"How are Indian airports privatised?","text":"Airports are leased to private operators under Public–Private Partnership (PPP) concessions where the Airports Authority of India (AAI) retains ownership and receives the assets back upon expiry."},{"k":"for","q":"How has airport privatisation progressed, and what has it gained?","rows":[{"l":"Modernises hub infrastructure into world-class terminals while recycling capital for AAI, beginning with Delhi (GMR) and Mumbai (GVK) where AAI retains [[26%]] equity under the 2006 OMDA","t":""},{"l":"Accelerates greenfield airport construction through PPP models without straining the Union Budget","t":"e.g. Bengaluru and Hyderabad international airports"},{"l":"Expands private operational efficiency to tier-2 hubs under the second wave (2019), awarding Lucknow,Ahmedabad, Jaipur, Mangaluru, Thiruvananthapuram, and Guwahati to Adani on 50-year concessions","t":""},{"l":"Unlocks value from smaller regional assets by bundling big and small airports together","t":"covering [[11]] AAI airports under the National Monetisation Pipeline (2026)."},{"l":"Boosts non-aeronautical commercial revenues from retail, parking, and real estate to cross-subsidise aeronautical charges and upgrade passenger experience","t":"e.g. duty-free and terminal retail expansion"}],"cue":"Leasing brownfield and greenfield airports to private operators mobilises capital, upgrades passenger infrastructure, and frees AAI funds to expand regional connectivity."},{"k":"against","q":"What are the concerns with airport privatisation?","rows":[{"l":"Creates severe airport market concentration, with GMR handling [[≈43.5%]] of passenger traffic at major private airports (followed closely by Adani)","t":""},{"l":"Exposes airports and flyers to a domestic airline duopoly","t":"where IndiGo and Air India control [[≈90%]] of capacity—as demonstrated by the IndiGo cancellation crisis."},{"l":"Risks vertical conflicts of interest in slot and gate allocation if airport operators","t":"currently capped at a [[10%]] airline stake at Delhi and Mumbai—are allowed to own carriers following industry requests for relaxation."},{"l":"Suffers from flawed early concession designs featuring underestimated traffic projections and ambiguous clauses","t":"e.g. revenue-share and force-majeure disputes at Delhi and Mumbai"},{"l":"Drives up airfares via steep User Development Fees and risks uneven upkeep of smaller regional airports inside bundled concessions","t":"e.g. AERA tariff revisions at private hubs"}],"cue":"Heavy operator concentration, airline duopoly pressures, vertical cross-ownership risks, and flawed concession designs threaten fair competition and passenger affordability."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Prevent private airport monopolies by judging bids on national passenger traffic share rather than the mere number of airports awarded","t":"e.g. PPPAC bid-cap safeguards"},{"l":"Empower the Airports Economic Regulatory Authority (AERA) as an independent regulator with teeth to link tariffs directly to service-quality benchmarks","t":"e.g. penalties for long security and check-in queues"},{"l":"Retain strict vertical cross-ownership limits","t":"keeping the [[10%]] cap on airport operators owning airlines—alongside independent slot coordinators to ensure neutral carrier access."},{"l":"Standardise model concession agreements with realistic traffic forecasting, transparent per-passenger fee structures, and time-bound dispute resolution","t":"e.g. shifting from gross revenue-share to per-passenger yield bidding"},{"l":"Enforce strict minimum capital-expenditure and service-level milestones on smaller regional airports within bundled NMP packages so non-metro hubs are not neglected","t":"e.g. ring-fenced capex audits for regional bundles"}],"cue":"Sustaining fair and efficient airport privatisation requires traffic-share bid caps, an empowered tariff regulator, strict airline cross-ownership limits, and ring-fenced regional capex."},{"k":"data","q":"What new rules govern aviation?","title":"Data","rows":[{"l":"Bharatiya Vayuyan Adhiniyam, 2024","t":"replaced the Aircraft Act, 1934; one framework for aircraft design, manufacture, maintenance and operation; new definitions and stricter penalties; DGCA now issues radio telephone operator certificates (earlier DoT) (notebook)"},{"l":"After the Air India crash (2025)","t":"Aircraft (Demolition of Obstructions) Rules, 2025 let authorities act against buildings and trees above height limits near aerodromes; pilot training moving to the multi-crew pilot licence (simulator-based); regular safety reviews; a global code of conduct on pilot recruitment (notebook)"}]}]},{"id":"GS39-aviation-safety-and-regulation","line":"GS3.9","part":"Infrastructure","name":"Aviation safety and regulation","own":true,"cards":[{"k":"define","q":"What is Aviation safety and regulation?","text":"The statutory rules and regulatory oversight that keep flying safe, led by the Directorate General of Civil Aviation (DGCA) under the Bharatiya Vayuyan Adhiniyam, 2024 (which replaced the Aircraft Act, 1934)."},{"k":"for","q":"What are the gains from Aviation safety and regulation?","rows":[{"l":"Replaces the colonial Aircraft Act, 1934 with the Bharatiya Vayuyan Adhiniyam, 2024 establishing clearer definitions, stricter penalties, and one unified framework for aircraft design, manufacture, maintenance, and operation","t":""},{"l":"Eliminates regulatory overlap by empowering the DGCA to issue radio telephone operator certificates instead of the Department of Telecommunications (DoT)","t":""},{"l":"Empowers authorities to act against buildings and trees exceeding height limits near aerodromes under the Aircraft (Demolition of Obstructions) Rules, 2025 enacted after the 2025 Air India crash","t":""},{"l":"Upgrades crew preparedness and hiring ethics by shifting pilot training to the simulator-based multi-crew pilot licence alongside regular safety reviews and a global code of conduct on pilot recruitment","t":""},{"l":"Sustains international credibility and global airline market access by meeting international safety oversight benchmarks","t":"e.g. retaining US FAA Category [[1]] status and ICAO compliance"}],"cue":"Modernising aviation statutes, tightening aerodrome safety rules, and upgrading simulator-based pilot training align India’s safety oversight with global standards."},{"k":"against","q":"What are the problems with Aviation safety and regulation?","rows":[{"l":"Suffers from acute technical staffing shortages in the aviation regulator, with nearly [[40%]] of posts vacant in key safety wings of the DGCA","t":""},{"l":"Faces unsustainable pressure on runways, air traffic control, and ground equipment as rapid airline fleet expansion outpaces airport infrastructure growth","t":"e.g. Parliamentary panel warning on capacity imbalance"},{"l":"Lacks full institutional independence because the DGCA and Aircraft Accident Investigation Bureau (AAIB) function under the Ministry of Civil Aviation rather than as autonomous bodies","t":""},{"l":"Suffers from reactive safety audits and a punitive work culture that deter voluntary error reporting while commercial pressures push airlines to cut maintenance corners","t":"e.g. blurred runway markings and delayed maintenance updates"},{"l":"Experiences operational disruptions and pilot-shortage bottlenecks when stricter fatigue and rest rules are rolled out without adequate crew buffers","t":"e.g. flight cancellations during Flight Duty Time Limitation transitions"}],"cue":"Severe regulatory staffing shortages, rapid fleet growth outpacing infrastructure, punitive reporting cultures, and commercial scheduling pressures strain safety margins."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Grant full statutory, financial, and recruitment autonomy to the DGCA and AAIB while filling technical vacancies urgently","t":"e.g. Parliamentary Standing Committee recommendations on aviation safety"},{"l":"Shift from post-accident probes to preventive, risk-based surveillance and mandatory regular safety audits across scheduled and non-scheduled operators","t":"e.g. ICAO Safety Management Systems"},{"l":"Foster a non-punitive \"just culture\" with legal protection for whistleblowers and pilots reporting fatigue or maintenance lapses","t":"e.g. confidential voluntary safety reporting systems"},{"l":"Enforce strict obstacle-limitation zones, modernise air navigation aids, and align airline fleet induction with airport and ATC capacity","t":"e.g. National Capacity Alignment Plan and Bharatiya Vayuyan Niyam, 2026"},{"l":"Upgrade flight-school standards and simulator infrastructure while enforcing global pilot-recruitment ethics and fatigue rules smoothly","t":"e.g. DGCA’s 2026 Flying Training Organisation ranking system"}],"cue":"Preventive aviation safety requires granting statutory autonomy and full staffing to regulators, enforcing non-punitive safety reporting, and upgrading training and airport buffer zones."}]},{"id":"GS39-railway-reform","line":"GS3.9","part":"Railways","name":"Railway reform","own":true,"cards":[{"k":"list","q":"Why does railway reform matter?","rows":[{"l":"Freight backbone","t":"carries the bulk of India’s heavy freight"},{"l":"Passengers","t":"[[≈3 crore]] passengers a day"},{"l":"So","t":"network capacity, operational safety and internal finances must be reformed together"}]},{"k":"for","q":"What reforms are improving the Railways?","rows":[{"l":"Separates freight from congested passenger lines via the Dedicated Freight Corridor (DFC) network","t":"Western DFC (Dadri–JNPT, JICA-funded) and Eastern DFC (Ludhiana–Dankuni, World Bank-funded),built by DFCCIL and running [[≈241]] freight trains daily."},{"l":"Scales bulk cargo movement to lower national logistics costs, reaching a record [[1,670 million]] tonnes loaded in FY26 (Railway Ministry)","t":""},{"l":"Upgrades passenger travel speed and comfort through modern rolling stock, with [[162]] Vande Bharat trains operational alongside Vande Bharat Sleeper and Amrit Bharat services (2026)","t":""},{"l":"Strengthens operational safety and collision prevention, reducing consequential train accidents to [[11]] in 2025–26","t":""},{"l":"Accelerates green decarbonisation and cuts diesel imports by reaching [[99.1%]] broad-gauge electrification alongside solar power and hydrogen train trials","t":"e.g. Jind–Sonipat hydrogen trial, March 2026"}],"cue":"Dedicated freight corridors, record cargo loading, modern trains, electrification, and anti-collision tech are transforming network capacity, safety, and sustainability."},{"k":"against","q":"What still holds the Railways back?","rows":[{"l":"Suffers from chronic financial stress with an operating ratio of [[98.3%]] (FY25), leaving almost no internal surplus and keeping capital expenditure dependent on the Union Budget","t":""},{"l":"Loses freight market share to roads because high freight tariffs cross-subsidise low passenger fares,keeping rail’s modal freight share stuck near [[≈27%]]","t":""},{"l":"Operates on a severely saturated network where over half of high-density routes run at [[100%]] or more of capacity","t":"e.g. India lacking high-speed rail lines compared to China"},{"l":"Faces persistent safety vulnerabilities from track defects, signal failures","t":"e.g. Balasore, 2023), staff vacancies, and slow anti-collision rollout, with Kavach covering only [[≈3,100]] route km (PIB, April 2026"},{"l":"Experiences sluggish execution on passenger infrastructure upgrades, with only [[180]] of the selected Amrit Bharat stations completed by March 2026 (Parliament)","t":""}],"cue":"Near-zero internal financial surplus, freight cross-subsidisation, severe line congestion, safety vacancies, and slow station upgrades constrain long-term modernisation."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Restructure railway governance and separate commercial operations from social-service obligations by creating an independent rail regulator and decentralising powers","t":"e.g. Bibek Debroy Committee recommendations"},{"l":"Rationalise passenger fares gradually and align freight tariffs competitively to end cross-subsidisation and reclaim modal share","t":"e.g. National Rail Plan target of [[45%]] rail freight share by 2030"},{"l":"Accelerate network decongestion and first- and last-mile cargo connectivity through private terminal partnerships","t":"e.g. [[149]] Gati Shakti Cargo Terminals commissioned by August 2026"},{"l":"Fast-track network-wide Kavach [[4.0]] deployment alongside filling safety-critical vacancies and adopting AI-based predictive track maintenance","t":"e.g. saturating high-density golden quadrilateral routes"},{"l":"Monetise railway land and station real estate via Public–Private Partnerships while scaling green energy to boost non-fare revenue","t":"e.g. Amrit Bharat Station Scheme redevelopment and [[898 MW]] commissioned solar capacity"}],"cue":"Sustainable railway reform requires accounting separation, fare rationalisation, private multimodal cargo terminals, rapid Kavach deployment, and non-fare asset monetisation."},{"k":"data","rows":[{"l":"High-speed rail and risk guarantee","t":"7 high-speed rail corridors as ‘growth connectors’ (Budget 2026-27). The Infrastructure Risk Guarantee Fund is under GS3.1"},{"l":"Dedicated Freight Corridors (Eastern and Western)","t":"35 Gati Shakti Cargo Terminals in FY26"},{"l":"Kavach","t":"indigenous automatic train protection (version 4.0) – [[≈24,400 km]] under way (PIB, April 2026); stops a train that passes a red signal, using balises (track sensors), GPS, a train collision avoidance system and automatic block signalling (notebook)"},{"l":"Safety bodies","t":"Rashtriya Rail Sanraksha Kosh ([[₹1 lakh crore]] safety fund); Kakodkar Committee: a statutory Railway Safety Authority; Khanna Committee: track safety tolerances, i.e. how far alignment, level and gauge may vary safely (notebook)"},{"l":"Kisan Rail (farm produce to markets)","t":"Bharat Gaurav trains (heritage tourism under Dekho Apna Desh; Andhra Pradesh tourists [[≈7 lakh]] → [[25 lakh]] in 2023); Mumbai–Ahmedabad high-speed rail (Japan) (notebook)"},{"l":"China’s high-speed rail","t":"network raised average incomes along its routes (≈3,380 RMB, notebook)"},{"l":"From the diagram","t":"Eastern DFC 1,337 km; Western DFC 1,506 km"}],"q":"Which schemes and examples back up railway reform?"},{"k":"diagram","q":"Draw the dedicated freight corridors diagram (Railway reform)","g":{"dir":"LR","nodes":[["E","Eastern DFC 1,337 km"],["F","Freight moves off passenger lines"],["W","Western DFC 1,506 km"],["S","Faster freight, rail share up"],["P","More room for passenger trains"]],"edges":[["E","F",""],["W","F",""],["F","S",""],["F","P",""]]}},{"k":"data","q":"Which schemes and examples back up railway reform?","title":"Data","rows":[{"l":"Faster Kavach roll-out","t":""}]}]},{"id":"GS39-urban-transport-moving-people","line":"GS3.9","part":"Railways","name":"Urban transport: moving people","own":true,"cards":[{"k":"define","q":"What does the National Urban Transport Policy say?","text":"The National Urban Transport Policy (2006, revised 2014) says plan to move people, not vehicles: public transport, walking and cycling first.","ed":true},{"k":"for","q":"What has improved in urban transport?","rows":[{"l":"Expands rapid mass transit nationwide, growing India’s metro network to [[≈1,095 km]] (2025 incl. Delhi–Meerut RRTS)","t":"the third-largest globally (PIB, March 2026)."},{"l":"Modernises affordable surface transit in underserved cities by deploying [[10,000]] e-buses on a PPP model under PM e-Bus Sewa (Aug 2023)","t":""},{"l":"Enables seamless multimodal travel across metros, buses, suburban rail, and parking through the National Common Mobility Card (One Nation One Card)","t":"e.g. interoperable RuPay contactless transit payments"},{"l":"Integrates urban land use with mass transit by mandating Comprehensive Mobility Plans and Transit-Oriented Development (TOD) under the Metro Rail Policy 2017","t":"e.g. high-density mixed-use zones around stations"},{"l":"Reduces vehicular congestion, tailpipe pollution, and daily commute times for over [[1 crore]] daily metro passengers nationwide","t":"e.g. shifting commuters from private two-wheelers to electric rail"}],"cue":"Expanding high-capacity metros, electric buses, unified ticketing, and transit-oriented planning cuts congestion, lowers emissions, and boosts commuter productivity."},{"k":"against","q":"What is still wrong with urban transport?","rows":[{"l":"Neglects city bus systems","t":"the cheapest, highest-capacity mode of mass transport—leaving urban India with barely one-third of its required public bus fleet (e.g., capital budgets heavily skewed toward metros over buses)."},{"l":"Suffers from severe first- and last-mile connectivity gaps such as missing footpaths, cycle tracks, and feeder buses, keeping ridership under [[50%]] of initial projections in several new metro systems","t":""},{"l":"Remains locked into private motorisation outside a few megacities, with two-wheelers accounting for over [[70%]] of registered vehicles across Indian cities","t":""},{"l":"Splits urban mobility across municipal bodies, state transport undertakings, traffic police, and metro SPVs without unified planning","t":"e.g. overlapping road, bus, and parking jurisdictions delaying multimodal hubs"},{"l":"Excludes low-income informal workers through steep metro fare slabs and car-centric road widening that erodes pedestrian safety","t":"e.g. high minimum-to-maximum ticket prices relative to daily wages"}],"cue":"Chronic underfunding of city buses, missing last-mile links, private vehicle dominance, and fragmented city governance keep public transport ridership low."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Establish statutory Unified Metropolitan Transport Authorities (UMTAs) in all million-plus cities to integrate land use, route planning, and fare regulation","t":"e.g. Chennai Unified Metropolitan Transport Authority model"},{"l":"Scale city bus fleets rapidly by leveraging the [[₹20,000 crore]] central assistance under PM e-Bus Sewa alongside a Payment Security Mechanism to attract private operators","t":"e.g. dedicated bus priority lanes and gross-cost PPP contracts"},{"l":"Enforce National Urban Transport Policy (2006/2014) norms by building shaded footpaths, protected cycle tracks, and electric feeder networks within [[500]] metres of transit stations","t":"e.g. Complete Streets and non-motorised transport corridors"},{"l":"Monetise Transit-Oriented Development (TOD), higher Floor Space Index (FSI), and congestion pricing to cross-subsidise affordable public transit","t":"e.g. Metro Rail Policy 2017 land-value capture mechanisms"},{"l":"Universalise the National Common Mobility Card (One Nation One Card) and open-data journey planners across buses, metros, and e-rickshaws for seamless door-to-door trips","t":"e.g. ONDC-integrated multimodal ticketing in Kochi and Chennai"}],"cue":"Putting people before vehicles requires unified city transport authorities, ring-fenced bus financing, walkable station precincts, value-capture funding, and open digital mobility."},{"k":"data","q":"What data goes with Urban transport: moving people?","title":"Data","rows":[{"l":"Metro Rail Policy 2017","t":"(PPP component needed for central aid; MoHUA)"}]}]},{"id":"GS39-infrastructure-led-growth","line":"GS3.9","part":"Infrastructure","name":"Infrastructure-led growth","own":true,"cards":[{"k":"define","text":"Spending on roads, rail, power, ports and digital networks that lifts growth by cutting costs and drawing in private investment.","q":"What is infrastructure-led growth?"},{"k":"for","rows":[{"l":"Growth multiplier","t":"every [[₹1]] of infrastructure spending raises GDP by [[₹2.5]]–3.5 (ES 2025-26)"},{"l":"Competitiveness","t":"logistics cost fell from [[8.8%]] to [[8.0%]] of GDP (FY24) (DPIIT-NCAER report, Sept 2025); this replaces the old [[13–14%]] estimate"},{"l":"Inclusion","t":"roads, power and digital links reach lagging regions and spread growth"}],"q":"How does infrastructure drive growth?","cue":"Multiplier → competitiveness → inclusion."},{"k":"against","rows":[{"l":"Financing gap","fix":"National Infrastructure Pipeline ([[₹111 lakh crore]], FY20-25) says what to build and at what cost; asset monetisation and InvITs recycle capital (see GS3.1 → Mobilisation of resources, and GS3.1)","h":"Finance","t":""},{"l":"Risk allocation","fix":"Infrastructure Risk Guarantee Fund (see GS3.1)","h":"Finance","t":""},{"l":"Planning and coordination","fix":"PM Gati Shakti National Master Plan says where and how to build, through integrated, GIS-based multimodal planning","h":"Rules and institutions","t":""}],"q":"What are the gaps in infrastructure-led growth, and the fixes?","cue":"Financing gap → Risk allocation → Planning and coordination."},{"k":"value","rows":[{"l":"Data centres","t":"capacity [[≈1,280 MW]] (June 2025), projected at [[≈4 GW]] by 2030; Chapter 8 of the Survey quotes [[≈8 GW]] (a Nasscom estimate from a [[≈1.4 GW]] base in Q2 2025). The Survey carries both, so always name the source"},{"l":"Data centres (Budget 2026-27)","t":"Data centres, Budget 2026-27: a tax holiday until 2047 for foreign companies that use Indian data centres to provide cloud services to customers worldwide"},{"l":"Telecom vision (Survey)","t":"Samaveshit (inclusive, universal connectivity); Viksit (a developed India through perform, reform and transform); Tvarit (faster development); Surakshit (safe and secure)","unlikely":true}],"q":"What new infrastructure areas does the Survey highlight?"}]},{"id":"GS39-smart-cities","line":"GS3.9","part":"Infrastructure","name":"Smart cities","own":true,"cards":[{"k":"define","q":"What are smart cities?","text":"Cities using technology and integrated planning to improve services, mobility, sanitation and governance.","ed":true},{"k":"for","q":"Why does India need smart cities?","rows":[{"l":"Prepares cities for rapid urbanisation","t":"projected at [[≈40%]] by 2030—by turning them into engines of jobs and growth."},{"l":"Enhances real-time governance and emergency response via Integrated Command and Control Centres across all [[100]] mission cities","t":""},{"l":"Upgrades core mobility and public spaces through compact retrofitting","t":"e.g. over [[1,700 km]] of smart roads built"},{"l":"Builds civic order via ‘design as nudge’, credible enforcement of few rules, and the endowment effect","t":"e.g. Metro discipline"},{"l":"Advances circular sustainability through smart metering and wastewater recycling","t":"e.g. Surat’s industrial water reuse"}],"cue":"Integrated digital governance, compact infrastructure, and behavioural design prepare cities for rapid urbanisation while improving service delivery."},{"k":"against","q":"What problems do Indian cities face?","rows":[{"l":"Limited municipal fiscal autonomy leaves cities raising less than [[0.6%]] of GDP in own revenue","t":""},{"l":"Weak civic sense","t":"born from poor perceived value for taxes—fuels littering and public-space neglect."},{"l":"Physical infrastructure lags population growth, worsening congestion and leaving only [[28%]] of wastewater treated","t":""},{"l":"Messy governance splinters power across agencies, while restrictive Floor Space Index (FSI) forces peripheral sprawl","t":""},{"l":"Area-based enclaves neglect informal settlements, leaving slum dwellers vulnerable to demolition","t":"e.g. narrow ABD pockets"}],"cue":"Weak municipal finances, messy governance, infrastructure shortages, restrictive vertical planning, and informal settlement neglect limit inclusive urban growth."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Boost municipal revenue via property-tax digitisation, municipal bonds, and the [[₹1 lakh crore]] Urban Challenge Fund (2026)","t":""},{"l":"Instil civic discipline via ‘design as nudge’, credible enforcement of few clear rules, and the endowment effect","t":"e.g. Metro model"},{"l":"Scale digitised buses, congestion pricing (Singapore), [[8-80]] walkable superblocks (Barcelona), wastewater reuse (Jal Hi AMRIT), and community sanitation (Indore model)","t":""},{"l":"End fragmented governance by empowering mayors under the 74th Amendment and liberalising FSI along Transit-Oriented Development (TOD) corridors","t":""},{"l":"Formalise and upgrade informal settlements in situ rather than demolishing them","t":"e.g. PMAY-U [[2.0]] tenure security"}],"cue":"Building inclusive smart cities requires empowering municipal finances and mayors, liberalising vertical transit-oriented growth, recycling wastewater, and formalising slums."},{"k":"data","q":"What data and plans back up urban development?","title":"Data","rows":[{"l":"Urban planning","t":"[[≈₹70 lakh crore]] of urban infrastructure needed by 2036; [[65%]] of India’s 7,933 urban settlements have no master plan; only ≈4,000 sanctioned town-planner posts, [[42%]] of them vacant, against a need of over 12,000 (NITI Aayog, Reforms in Urban Planning Capacity, Sept 2021); municipal bonds have raised only [[≈₹3,000 crore]], from a handful of cities (World Bank, 2019) → NITI Aayog: more skilled planners, updated laws, citizen participation (notebook)"},{"l":"The urban paradox","t":"more people usually means an economic boom, but not in India, because population growth outpaces city infrastructure (ES 2025-26)"},{"l":"City Economic Regions (CERs), Budget 2026-27","t":"[[₹5,000 crore]] per CER [[over 5 years]], given in challenge mode (cities compete) through reform-cum-results-based financing. The focus is Tier-II and Tier-III cities and temple towns"}]},{"k":"data","q":"How fast is India urbanising?","rows":[{"l":"Urbanisation","t":"[[31%]] (Census 2011) to [[≈40%]] by 2030"}]}]},{"id":"GS39-smart-cities-mission-and-smart-villages","line":"GS3.9","part":"Infrastructure","name":"Smart Cities Mission and smart villages","own":false,"cards":[{"k":"define","text":"Smart Cities Mission (June 2015 – 31 March 2025): 100 cities, area-based development plus pan-city ICT solutions, run through special purpose vehicles (SPVs).","q":"What was the Smart Cities Mission?"},{"k":"for","rows":[{"l":"Projects done","t":"7,790 of 8,064 projects ([[97%]]), [[₹1.6]] of [[₹1.7 lakh crore]], by 31 March 2026 (MoHUA)"},{"l":"Command centres","t":"an Integrated Command and Control Centre in all 100 cities; [[≈1,700 km]] of smart roads; 83,000+ CCTV cameras"},{"l":"Money released","t":"[[99.4%]] of the [[₹47,652 crore]] Union outlay"}],"q":"What did the Smart Cities Mission achieve?","cue":"Projects done → command centres → money released."},{"k":"against","rows":[{"l":"Few finished","t":"only 18 of 100 cities had completed all projects when the mission closed (March 2025)","h":"Infrastructure"},{"l":"Uneven","t":"some SPVs wound up and handed projects to departments (Chandigarh, March 2025)","h":"Rules and institutions"},{"l":"Rural-urban gap (2016 Q4)","t":"money goes to 100 cities; villages left out","h":"Equity and sustainability"}],"q":"Where did the Smart Cities Mission fall short?","cue":"Few cities finished, uneven SPVs, villages left out."},{"k":"value","rows":[{"l":"PURA","t":"(idea of Dr A.P.J. Abdul Kalam) – Providing Urban Amenities in Rural Areas"},{"l":"Shyama Prasad Mukherji Rurban Mission","t":"(2016) – 300 rural clusters given urban facilities, so growth does not depend on migration ([[₹5,142 crore]], MoRD)"}],"title":"Smart villages","q":"What are the smart-village models?"}]},{"id":"GS310-ppp","line":"GS3.10","part":"","name":"PPP","own":true,"cards":[{"k":"define","q":"What is a PPP?","text":"A long-term contract (concession agreement) where the government and a private firm share the funding,risks, and rewards of an infrastructure project."},{"k":"for","q":"Why use PPPs for infrastructure?","rows":[{"l":"Mobilises private finance, project-management skills, and technology beyond what the Union Budget alone can fund","t":"e.g. greenfield airports and expressways"},{"l":"Scales national infrastructure creation rapidly, backed by a 3-year PPP pipeline worth over [[₹17 lakh crore]] (DEA, Jan 2026)","t":""},{"l":"Allocates construction, traffic, and operational risks to the party best equipped to manage them","t":"e.g. Build-Operate-Transfer and Toll-Operate-Transfer models"},{"l":"Accelerates brownfield asset modernisation and faster project execution","t":"e.g. airport and railway-station redevelopment"},{"l":"Unlocks locked-in developer equity and recycles capital for fresh infrastructure, with InvIT assets reaching [[≈₹6.2 lakh crore]] in FY25 (CareEdge)","t":""}],"cue":"Combining public oversight with private capital, risk sharing, and operational efficiency accelerates infrastructure delivery beyond budgetary limits."},{"k":"against","q":"Why do PPPs fail, and what fixes exist?","rows":[{"l":"Passes unsustainable hidden liabilities to future generations through long-term government guarantees and annuity commitments","t":"e.g. off-budget contingent liabilities"},{"l":"Leaves socially vital projects unviable due to bankability gaps, construction-stage credit risk, and locked-in developer capital","t":"e.g. long-gestation regional corridors"},{"l":"Exposes private developers and lenders to severe traffic and revenue risk when optimistic demand projections fail","t":"e.g. stalled BOT-toll highway projects"},{"l":"Suffers from rigid, one-size-fits-all concession agreements lacking flexible tariff, renegotiation, and dispute-resolution clauses","t":"e.g. prolonged arbitration backlogs"},{"l":"Paralyses timely contract renegotiation because officials fear investigation under the Prevention of Corruption Act, which fails to distinguish bona fide commercial errors from graft (Kelkar Committee)","t":""}],"cue":"Hidden fiscal liabilities, bankability and credit gaps, traffic-revenue uncertainty, rigid contracts, and bureaucratic fear of anti-corruption probes stall PPP execution."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Adopt project-specific risk allocation instead of one-size-fits-all contracts, alongside an Infrastructure PPP Project Review Committee and Adjudication Tribunal (Kelkar Committee, 2015)","t":""},{"l":"Bridge bankability and early credit risks through Viability Gap Funding (VGF) and the Infrastructure Risk Guarantee Fund ([[₹1,000 crore]] outlay, Budget 2026–27)","t":""},{"l":"Balance traffic risk and recycle locked-in capital using the Hybrid Annuity Model ([[40%]] government construction support), EPC contracts, InvITs, and Toll-Operate-Transfer (TOT)","t":""},{"l":"Establish independent sector regulators and protect bona fide commercial renegotiations from vigilance overreach","t":"e.g. Prevention of Corruption Act safeguards"},{"l":"Mandate transparent reporting of contingent liabilities in the Union Budget and avoid PPP structures for small-scale projects (Kelkar Committee recommendations)","t":""}],"cue":"Reviving PPPs requires tailored risk-sharing contracts, viability and credit guarantees, asset monetisation vehicles, independent regulators, and legal protection for honest decisions."},{"k":"data","rows":[{"l":"3-year PPP pipeline (FY26–28)","t":"Centre 232 projects ([[₹13.2 lakh crore]]), states 620 ([[₹3.8 lakh crore]]) (DEA, Jan 2026)"},{"l":"PPP is about service delivery","t":"PPP is about better service delivery to citizens, not a way for the government to escape that duty or just to find money off-budget (Kelkar Committee)"},{"l":"Infrastructure Risk Guarantee Fund","t":"(Budget 2026-27, announced with the 7 high-speed rail corridors): partial credit guarantees to lenders during the development and construction phase; [[₹1,000 crore]] provided for 2026-27"},{"l":"Kelkar Committee on Revisiting and Revitalising PPPs","t":"report 19 Nov 2015"},{"l":"3-year PPP project pipeline","t":"(announced Budget 2025-26, released Jan 2026)"}],"q":"What data, committees and examples back up PPPs?"},{"k":"data","rows":[{"l":"PPPAC","t":"apex body that appraises central PPP projects, chaired by the DEA Secretary (DEA)"},{"l":"India Infrastructure Project Development Fund (2022)","t":"pays for transaction advisers so projects are bankable"},{"l":"Rani Kamlapati (Habibganj) station, Bhopal","t":"India’s first railway station redeveloped under PPP, Nov 2021 (PMO) (2022 Q1)"},{"l":"Delhi and Mumbai airports","t":"revenue-share PPPs; see GS3.9 → Aviation → Airport privatisation (2017 Q3)"},{"l":"From the diagram","t":"BOT toll - private finances, collects tolls; TOT - private runs a built road for an upfront fee"}],"q":"What data, committees and examples back up PPPs?"},{"k":"diagram","q":"Draw the PPP models by who bears the risk diagram (PPP)","g":{"dir":"LR","nodes":[["E","EPC - government pays and owns"],["H","HAM - government pays 40% in construction, annuity later"],["B","BOT toll - private finances, collects tolls"],["T","TOT - private runs a built road for an upfront fee"]],"edges":[["E","H",""],["H","B",""],["B","T",""]]}}]},{"id":"GS310-bot-build-operate-transfer","line":"GS3.10","part":"","name":"BOT (Build-Operate-Transfer)","own":true,"cards":[{"k":"define","text":"The private developer builds and operates the asset for a concession period, recovers its cost from user charges such as tolls, then hands it over to the government.","q":"What is meant by BOT (Build-Operate-Transfer)?"}]},{"id":"GS310-epc-engineering-procurement-construction","line":"GS3.10","part":"","name":"EPC (Engineering-Procurement-Construction)","own":true,"cards":[{"k":"define","text":"The government pays a contractor to design and build; the government keeps the traffic and revenue risk.","q":"What is meant by EPC (Engineering-Procurement-Construction)?"}]},{"id":"GS310-ham-hybrid-annuity-model","line":"GS3.10","part":"","name":"HAM (Hybrid Annuity Model)","own":true,"cards":[{"k":"define","text":"A mix of EPC and BOT: the government pays part of the project cost during construction and the rest as fixed annuities over the operating period; the developer is not exposed to traffic risk.","q":"What is meant by HAM (Hybrid annuity Model)?"}]},{"id":"GS310-vgf-viability-gap-funding","line":"GS3.10","part":"","name":"VGF (Viability Gap Funding)","own":true,"cards":[{"k":"define","text":"A government grant that makes an economically desirable but financially unviable PPP project bankable.","q":"What is meant by VGF (Viability gap Funding)?"},{"k":"value","rows":[{"l":"VGF scheme (2005, revamped 2020)","t":"grant of up to [[20%]] Centre plus [[20%]] state; up to [[30%]] plus [[30%]] for social infrastructure; [[₹8,100 crore]] to 2024-25 (PIB, 11 Nov 2020)"}],"q":"What does the VGF scheme give?"}]},{"id":"GS310-invit-infrastructure-investment-trust","line":"GS3.10","part":"","name":"InvIT (Infrastructure Investment Trust)","own":true,"cards":[{"k":"define","text":"A trust that pools operating infrastructure assets and sells units to investors, so that the original owner can recycle capital into new projects.","q":"What is meant by InvIT (Infrastructure investment Trust)?"},{"k":"value","rows":[{"l":"InvIT assets","t":"[[≈₹7.25–7.5 lakh crore]] expected for FY26 (CareEdge)"},{"l":"Road InvITs","t":"[[≈₹3 lakh crore]] (March 2026) → [[≈₹3.9 lakh crore]] (March 2027) (Crisil)"}],"q":"How big are InvITs?"}]},{"id":"GS310-tot-toll-operate-transfer","line":"GS3.10","part":"","name":"TOT (Toll-Operate-Transfer)","own":false,"cards":[{"k":"define","text":"The government leases an already-built,
