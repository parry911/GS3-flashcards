ormalisation","t":"Registered taxpayers increased from around [[60 lakh]] (2017) to [[1.7 crore]] (September 2026); gross GST collections reached [[₹2.0 lakh crore]] in September 2026 ([[14.7%]] YoY growth)."}],"q":"What are the basic facts of GST?"},{"k":"for","rows":[{"l":"Eliminating tax-on-tax, lowering production costs","t":"ITC prevents cascading taxation and reduces the overall tax burden"},{"l":"Tax Formalisation","t":"E-invoicing, e-way bills and digital return matching expand the tax base ([[1.7 crore]] registered taxpayers)"},{"l":"Single National Market","t":"Removes inter-state tax barriers and improves logistics and movement of goods"},{"l":"Rate Rationalisation (GST 2.0)","t":"Simplified principal slabs of [[5%]] and [[18%]] improve tax predictability"},{"l":"Cooperative Federalism","t":"GST Council (Article 279A) provides a common platform for Centre-State decisions on indirect taxation."}],"q":"What has GST achieved?","cue":"No cascading → formal base → one market → simple slabs → shared decisions."},{"k":"against","rows":[{"l":"Working Capital Blockage","t":"Inverted duty structures and delayed ITC/export refunds lock up business funds","h":"Finance"},{"l":"ITC Reconciliation","t":"Supplier non-compliance and invoice mismatches disrupt credit flow","h":"Markets"},{"l":"Incomplete Tax Base","t":"Petroleum products, electricity and alcohol for human consumption remain outside GST, restricting seamless ITC","h":"Rules and institutions"},{"l":"MSME Compliance Burden","t":"Frequent returns, invoice reconciliation and complex classifications create disproportionate compliance costs","h":"Rules and institutions"},{"l":"State Fiscal Autonomy","t":"Subsumption of major indirect taxes limits independent rate-setting flexibility, increasing dependence on GST Council consensus.","h":"Rules and institutions"}],"q":"What are GST’s problems?","cue":"Working Capital Blockage → ITC Reconciliation → Incomplete Tax Base → MSME Compliance Burden → State Fiscal Autonomy."},{"k":"value","rows":[{"l":"Simplification and Tax Base Integration","t":"Gradually bring petroleum products and electricity under GST through Centre-State consensus and a calibrated revenue-sharing mechanism"},{"l":"Strengthening GSTAT","t":"Improve staffing, hearings and disposal across the Principal Bench and 31 State Benches for faster dispute resolution"},{"l":"MSME-Friendly Compliance","t":"Introduce simplified returns, auto-populated invoices and an assist-correct-penalise approach"},{"l":"Time-Bound Refunds","t":"Use risk-based automated verification and provisional refunds to protect working capital"},{"l":"Cooperative Fiscal Federalism","t":"Strengthen GST Council consultation and ensure predictable revenue arrangements for States."},{"l":"Mains-ready line","t":"GST must evolve from a tax-unification reform into a simpler, predictable and efficient tax system that promotes formalisation without burdening MSMEs or weakening fiscal federalism."}],"q":"How should GST evolve?","cue":"Bring fuel in → fix the tribunal → ease MSMEs → refund on time → keep states on board."},{"k":"data","rows":[{"l":"Gross GST","t":"[[₹20.2 lakh crore]] (FY24), [[₹22.1 lakh crore]] (FY25), [[≈₹22.3 lakh crore]] (FY26) (Notebook 2); [[₹17.4 lakh crore]] in Apr–Dec 2025, up [[6.7%]] (ES 2025-26)"},{"l":"Taxation ethics (Kalidasa)","t":"Taxation ethics (for GST): Kalidasa, Raghuvamsha (1.18), on King Dilipa, an ancestor of Lord Rama: ‘Prajānām eva bhūtyarthaṁ sa tābhyo balim agrahīt; sahasra-guṇam utsraṣṭum ādatte hi rasaṁ raviḥ.’ The king collected taxes only for his people’s welfare, just as the sun draws up water from the earth only to return it a thousandfold as rain. This is the ‘Ram Rajya’ ideal of taxation: a light, fair burden returned as public goods (often loosely attributed to Lord Rama himself)"},{"l":"Arvind Subramanian Committee (2015), GST revenue-neutral rate","t":"RNR of [[15–15.5%]] (preferred [[15%]]), so the Centre and states collect the same revenue as before GST; standard rate of [[17–18%]]"},{"l":"GST compensation","t":"the GST (Compensation to States) Act, 2017 promised states [[14%]] annual revenue growth over the 2015-16 base for five years (to June 2022); the COVID shortfall was met by back-to-back loans of [[₹1.1 lakh crore]] (FY21) and [[₹1.6 lakh crore]] (FY22), [[₹2.7 lakh crore]] in all; the cess was extended to March 2026 to repay them; GST 2.0 (22 Sept 2025) abolished the compensation cess except on tobacco"}],"q":"What do GST collections and committees tell you?"}]},{"id":"GS33-tax-expenditure","line":"GS3.3","part":"","name":"Tax expenditure","own":true,"cards":[{"k":"define","text":"Government revenue forgone through tax exemptions, deductions, rebates, credits and concessional rates, which act as indirect subsidies to encourage selected economic activities instead of providing direct budgetary expenditure.","q":"What is meant by tax expenditure?"},{"k":"for","rows":[{"l":"Targeted incentives","t":"housing, exports, R&D, savings,"},{"l":"Easy to deliver","t":"no new scheme machinery"},{"l":"Crowds in private investment","t":"e.g. home ownership drives construction jobs. So, boosts private investment, construction and employment"},{"l":"Fast relief","t":"cuts the tax burden quickly in a slowdown, with no new spending scheme"},{"l":"Transparency","t":"Annual Budget disclosure of revenue forgone enables fiscal scrutiny."}],"q":"Why use tax expenditure?","cue":"Target → deliver easily → crowd in → relieve fast → disclose."},{"k":"against","rows":[{"l":"Revenue Loss","t":"Erodes government revenue and fiscal space","h":"Finance"},{"l":"Narrows the base","fix":"New tax regime with fewer exemptions; corporate tax cut to [[22%]] without exemptions (2019)","h":"Finance","t":""},{"l":"Deadweight Loss","t":"Revenue is forgone even for investments that would have occurred without incentives.","h":"Finance"},{"l":"Distorted Resource Allocation","t":"Favours selected sectors or choices, e.g. home ownership over rental housing","h":"Markets"},{"l":"Quasi-Hidden Spending","t":"Less visible than direct budgetary allocations, despite annual disclosure","h":"Rules and institutions"},{"l":"Regressive Benefits","t":"Income-tax deductions disproportionately benefit higher-income taxpayers with greater investment capacity","h":"Equity and sustainability"}],"q":"What is wrong with tax expenditure?","cue":"Revenue Loss → Narrows the base → Deadweight Loss → Distorted Resource Allocation → Quasi-Hidden Spending → Regressive Benefits."},{"k":"value","rows":[{"l":"Periodic cost-benefit evaluation","t":""},{"l":"Sunset clauses","t":"tax concessions time-bound"},{"l":"Remove redundant exemptions and broaden the tax base","t":"as attempted through the new tax regime and the 2019 corporate tax reform"},{"l":"Greater transparency","t":"disclose revenue forgone by sector and beneficiary category"},{"l":"Targeted direct support","t":"use direct subsidies or transfers where tax deductions fail to reach low-income households"}],"q":"How should tax expenditure be reformed?","cue":"Evaluate → expire → prune → disclose → pay directly."}]},{"id":"GS33-ltcg-and-ddt","line":"GS3.3","part":"","name":"LTCG and DDT","own":true,"cards":[{"k":"list","rows":[{"l":"LTCG","t":"Tax imposed on profits earned from selling capital assets held for a specified long-term period."},{"l":"DDT","t":"A tax earlier levied on companies on dividends distributed to shareholders; abolished in 2020–21, shifting tax liability to shareholders."},{"l":"India's tax evolution","t":""},{"l":"Budget 2018–19","t":"Reintroduced LTCG tax on listed equity at [[10%]] on gains exceeding [[₹1 lakh]]; gains up to 31 January 2018 were grandfathered."},{"l":"Budget 2020–21","t":"Abolished DDT; dividends became taxable in shareholders' hands at applicable slab rates from 1 April 2020."},{"l":"Budget 2024–25","t":"LTCG on specified listed equity investments increased to [[12.5%]] above [[₹1.25 lakh]]; STCG increased to [[20%]]. Listed equity holding period remains 12 months"}],"q":"What are LTCG and DDT, and how has their taxation changed?","cue":"2018: LTCG back at 10% → 2020: DDT gone → 2024: LTCG 12.5% above ₹1.25 lakh."},{"k":"for","rows":[{"l":"Tax Equity, Revenue Mobilisation","t":"Brings capital gains into the tax net and generates revenue as financial markets deepen"},{"l":"DDT Abolition","t":"Shifts taxation from companies to shareholders according to individual tax slabs, improving tax neutrality and enabling foreign investors to claim treaty benefits"},{"l":"Simplification","t":"Budget 2024 rationalised capital gains taxation through two broad holding periods (12 and 24 months) and more uniform rates."}],"q":"What are the arguments for taxing LTCG and abolishing DDT?","cue":"Equity → neutrality → simplicity."},{"k":"against","rows":[{"l":"DDT Abolition","t":"High-income shareholders may face higher tax on dividends under slab rates.","h":"Finance"},{"l":"Investment Disincentive","t":"Higher capital gains taxation reduces post-tax returns and may discourage long-term retail investment","h":"Markets"},{"l":"Lock-in Effect","t":"Investors may delay selling assets to defer tax, reducing market liquidity","h":"Markets"},{"l":"Complexity","t":"Grandfathering provisions and asset-specific tax treatment complicate compliance","h":"Rules and institutions"},{"l":"Policy Uncertainty","t":"Frequent changes in tax rates weaken investor confidence and predictability","h":"Rules and institutions"}],"q":"What are the arguments against the LTCG and DDT changes?","cue":"DDT Abolition → Investment Disincentive → Lock-in Effect → Complexity → Policy Uncertainty."}]},{"id":"GS33-share-buyback-tax-budget-2026-27","line":"GS3.3","part":"","name":"Share buyback tax (Budget 2026-27)","own":true,"cards":[{"k":"define","text":"A tax regime under which proceeds from company share buybacks are taxed as capital gains in shareholders' hands after deducting acquisition cost, with an additional tax on promoters to prevent tax arbitrage.","q":"How are share buybacks taxed from April 2026?"},{"k":"list","rows":[{"l":"Before October 2024","t":"company paid buyback tax; shareholder generally exempt"},{"l":"October 2024 – March 2026","t":"entire buyback proceeds treated as deemed dividend; acquisition cost allowed separately as capital loss"},{"l":"From April 2026 (Budget 2026-27)","t":"capital gains on net profit, plus an additional promoter tax"},{"l":"Non-promoters","t":"normal capital gains tax rates"},{"l":"Corporate promoters","t":"[[22%]] effective tax"},{"l":"Other promoters","t":"[[30%]] effective tax"},{"l":"Note","t":"acquisition cost is deducted while calculating capital gains; rates exclude surcharge and cess"}],"q":"How has buyback taxation changed since 2024?","cue":"Company paid → whole receipt as dividend → only the gain, with a promoter top-up."},{"k":"for","rows":[{"l":"Tax Equity, Protection of Minority Shareholders","t":"Only actual gains are taxed after deducting acquisition cost, preventing taxation of the entire buyback receipt even when shares are tendered at a loss"},{"l":"Curbing Tax Arbitrage","t":"Additional promoter levy discourages promoters from using buybacks to extract corporate reserves at lower tax rates than dividends"},{"l":"Corporate Capital Allocation","t":"Enables companies to return surplus cash when productive reinvestment opportunities are limited"},{"l":"Simplification","t":"Replaces the earlier deemed-dividend and separate capital-loss treatment with a unified capital gains computation."}],"q":"Why is the new buyback tax fairer?","cue":"Tax only gains → stop promoter arbitrage → return surplus cash → one simple computation."},{"k":"against","rows":[{"l":"Higher Tax Burden on Promoters","t":"Effective [[22%]]/30% taxation reduces post-tax returns and may discourage promoter participation in buybacks","h":"Finance"},{"l":"Distorted Payout Choices","t":"Companies may prefer dividends or retain surplus cash rather than undertake buybacks","h":"Markets"},{"l":"Compliance Complexity","t":"Multiple acquisition dates, bonus shares and ESOPs complicate cost-of-acquisition calculations","h":"Rules and institutions"},{"l":"Policy Uncertainty","t":"Frequent changes in 2019, 2024 and 2026 weaken long-term tax predictability","h":"Rules and institutions"},{"l":"Unequal Tax Treatment","t":"Similar economic gains may face different effective tax rates depending on whether the shareholder is a promoter.","h":"Equity and sustainability"}],"q":"What are the problems with the new buyback tax?","cue":"Promoters pay more → payouts distorted → cost hard to compute → rules keep changing → unequal rates."},{"k":"value","rows":[{"l":"Stable Tax Policy","t":"Ensure predictability in corporate payout taxation to strengthen investor confidence"},{"l":"Clear Promoter Definition","t":"Harmonise tax and SEBI definitions to minimise ambiguity and litigation"},{"l":"Automated Capital Gains Reporting","t":"Integrate NSDL/CDSL transaction data with AIS to simplify acquisition-cost calculations"},{"l":"Balanced Anti-Arbitrage Framework","t":"Discourage promoter tax avoidance without unnecessarily penalising genuine corporate restructuring"},{"l":"Periodic Impact Assessment","t":"Evaluate effects on minority shareholders, corporate buybacks, market liquidity and investment."},{"l":"Mains takeaway","t":"Share buyback taxation must balance protection of minority shareholders, prevention of promoter tax arbitrage and efficient corporate capital allocation."}],"q":"How should buyback taxation be handled?"}]},{"id":"GS33-inflation-management","line":"GS3.3","part":"","name":"Inflation management","own":true,"cards":[{"k":"data","q":"Where does inflation stand now?","rows":[{"l":"Retail (CPI) inflation","t":"[[6.1%]] in October 2026, food inflation [[8.9%]] (provisional)"},{"l":"Target","t":"[[4%]] ± [[2%]]"}]},{"k":"list","rows":[{"l":"RBI MPC","t":"monetary policy"},{"l":"Government fiscal policy","t":"spend less when demand is high, more when it is low"},{"l":"Supply-side measures","t":"agricultural policies for food inflation; infrastructure that raises or lowers supply"},{"l":"Exchange-rate management","t":"controls import prices (forex market intervention)"}],"q":"What tools manage inflation in India?","cue":"Money → budget → supply → rupee.","title":"Tools"},{"k":"against","rows":[{"l":"Tools don’t fix supply","t":"[[≈45%]] of CPI is supply-driven"},{"l":"Growth vs inflation trade-off","t":""},{"l":"Food","t":"small share but disproportionate impact"},{"l":"External deficiencies","t":"supply chains and oil"},{"l":"Track record","t":"the MPC missed 11 of 18 targets (January–September 2022)"}],"q":"Why is inflation hard to manage in India?","cue":"Supply shocks, growth trade-off, food weight, imported oil → missed targets."}]},{"id":"GS33-zero-based-budgeting-zbb","line":"GS3.3","part":"","name":"Zero-Based Budgeting (ZBB)","own":true,"cards":[{"k":"define","text":"A budgeting technique in which every departmental activity and expenditure must be justified afresh from a zero base during each budget cycle, rather than automatically carrying forward previous allocations.","q":"What is meant by Zero-Based Budgeting (ZBB)?"},{"k":"data","q":"What was India’s experience with zero-based budgeting?","rows":[{"l":"Introduced","t":"by the Ministry of Finance for the 1987–88 Budget"},{"l":"Result","t":"the 1990 Lal Committee found it had not generated significant savings"}]},{"k":"for","rows":[{"l":"Expenditure Rationalisation, Allocative Efficiency","t":"Eliminates obsolete, overlapping and low-priority schemes"},{"l":"Fiscal Headroom","t":"Trimming unproductive expenditure and poorly targeted subsidies frees resources for infrastructure and capital expenditure"},{"l":"End to Incremental Inertia","t":"Prevents automatic budget increases and wasteful March Rush spending"},{"l":"Accountability","t":"Departments must justify expenditure through cost-benefit analysis and ranked decision packages."}],"q":"Why adopt zero-based budgeting?","cue":"Prune → free space → end inertia → justify."},{"k":"against","rows":[{"l":"Fiscal Rigidity","t":"Committed expenditure (interest, salaries, pensions and statutory obligations) leaves limited discretionary resources","h":"Finance"},{"l":"Administrative and Data Burden","t":"Reviewing every activity annually requires extensive data, cost-accounting and trained personnel","h":"People and skills"},{"l":"Technology Constraints","t":"Fragmented expenditure data makes unit-cost comparisons and duplication checks difficult","h":"Technology"},{"l":"Institutional Resistance","t":"Bureaucratic resistance and departmental reluctance to surrender budgetary allocations undermine implementation","h":"Rules and institutions"},{"l":"Intergenerational Equity","t":"Short-term cost-benefit assessments may penalise long-gestation investments in education, preventive healthcare and ecological restoration.","h":"Equity and sustainability"}],"q":"Why is zero-based budgeting hard to implement?","cue":"Fiscal Rigidity → Administrative and Data Burden → Technology Constraints → Institutional Resistance → Intergenerational Equity."},{"k":"value","rows":[{"l":"Rolling / Cyclical ZBB","t":"Review selected schemes periodically instead of attempting an exhaustive annual review"},{"l":"Sunset Clauses","t":"Subject schemes to periodic independent evaluation before continuation or renewal"},{"l":"Integration with OOMF","t":"Combine ZBB's ex-ante expenditure justification with ex-post outcome monitoring"},{"l":"PFMS (Public Financial Management System)-based data analytics","t":"identify overlapping schemes and benchmark unit costs"},{"l":"Protect Core Investments","t":"Safeguard statutory welfare, human capital and green investments from narrow short-term cost-cutting."},{"l":"Mains takeaway","t":"ZBB promotes fiscal discipline by ensuring that public expenditure is justified by present needs and developmental priorities rather than historical allocations."}],"q":"How can zero-based budgeting be made practical?","cue":"Rolling reviews → sunset clauses → link to OOMF → PFMS analytics → protect core investment."}]},{"id":"GS33-government-borrowing-and-rollover-risk","line":"GS3.3","part":"","name":"Government borrowing and rollover risk","own":true,"cards":[{"k":"define","text":"The risk that maturing government debt must be repaid by borrowing afresh, possibly at higher rates.","q":"What is rollover risk?","ed":true},{"k":"list","q":"How does the government manage rollover risk?","rows":[{"l":"Longer maturity","t":"weighted average maturity (average time until debt matures) of [[≈19 years]] for fresh issuances; higher is better"},{"l":"Switches and buybacks","t":"bonds nearing maturity are swapped for longer-dated ones, pushing repayment out (ES 2025-26)"},{"l":"Instruments","t":"dated securities (long-term bonds) and T-bills (91, 182 and [[364 days]])"}]}]},{"id":"GS33-just-in-time-jit-fund-release","line":"GS3.3","part":"","name":"Just-in-Time (JIT) fund release","own":true,"cards":[{"k":"define","text":"Releasing funds only when expenditure is incurred, not in bulk (credit-push to debit-pull), to improve public spending efficiency.","q":"What is Just-in-Time fund release?","ed":true},{"k":"list","q":"How is Just-in-Time fund release implemented?","rows":[{"l":"Centrally Sponsored Schemes","t":"SNA-SPARSH"},{"l":"Central Sector schemes","t":"TSA / TSA-Hybrid (ES 2025-26)"}]}]},{"id":"GS33-nudge","line":"GS3.3","part":"","name":"NUDGE (Income Tax Department)","own":true,"cards":[{"k":"define","text":"The Income Tax Department’s data-analytics approach (Non-intrusive Usage of Data to Guide and Enable) of alerting taxpayers to mismatches in their returns so they correct them voluntarily, before penal action.","q":"What is meant by NUDGE (Income Tax Department)?","ed":true}]},{"id":"GS33-revenue-deficit","line":"GS3.3","part":"","name":"Revenue deficit","own":true,"cards":[{"k":"define","text":"The excess of government revenue expenditure over revenue receipts. Revenue Deficit = Revenue Expenditure - Revenue Receipts","q":"What is meant by revenue deficit?"}]},{"id":"GS33-fiscal-deficit","line":"GS3.3","part":"","name":"Fiscal deficit","own":true,"cards":[{"k":"define","text":"The excess of total government expenditure over total non-debt receipts. Fiscal Deficit = Total Expenditure - (revenue receipts + non debt creating capital receipts)","q":"What is meant by fiscal deficit?"}]},{"id":"GS33-primary-deficit","line":"GS3.3","part":"","name":"Primary deficit","own":true,"cards":[{"k":"define","text":"Fiscal deficit minus interest payments. Memory trick: revenue deficit = daily expenses; fiscal deficit = total borrowing; primary deficit = fresh borrowing burden excluding interest.","q":"What is meant by primary deficit?"}]},{"id":"GS33-inflation","line":"GS3.3","part":"","name":"Inflation","own":true,"cards":[{"k":"define","text":"A sustained increase in the general price level of goods and services in an economy, resulting in a decline in the purchasing power of money.","q":"What is meant by inflation?"}]},{"id":"GS33-budget-2026-27","line":"GS3.3","part":"","name":"Union Budget 2026-27","own":true,"cards":[{"k":"list","title":"Macro & Fiscal","q":"What did Budget 2026-27 announce on macro and fiscal?","rows":[{"l":"Presented","t":"1 February 2026"},{"l":"Capital Expenditure (Capex)","t":"[[₹12.2 lakh crore]] (FY27 BE), up [[11.5%]] from [[₹11.0 lakh crore]] (FY26 RE); Capex: [[3.1%]] of GDP; Effective Capex (including grants for capital asset creation): [[₹17.2 lakh crore]] ([[4.4%]] of GDP)"},{"l":"Largest allocations","t":"Roads & Highways – [[₹2.9 lakh crore]]; Railways – [[₹2.9 lakh crore]] (record); followed by Defence. Together, these account for nearly two-thirds of capex"},{"l":"Nominal GDP growth assumption","t":"[[10%]]"},{"l":"Fiscal deficit","t":"[[4.4%]] (FY26 RE) → [[4.3%]] (FY27 BE). Revenue deficit: [[1.5%]]"},{"l":"New debt anchor","t":"Centre's debt-to-GDP ratio targeted to decline to [[55.6%]] (FY27 BE)"},{"l":"RBI Surplus & Dividends","t":"[[₹2.7 lakh crore]] received in FY26; FY27 Budget estimated [[₹3.2 lakh crore]] from RBI and public-sector financial institutions, plus approximately [[₹75,000 crore]] in dividends from other PSUs; RBI subsequently paid a record surplus of [[₹2.9 lakh crore]] in May 2026"},{"l":"16th Finance Commission","t":"Grants to local bodies: [[₹7.9 lakh crore]] for 2026–31; Rural Local Bodies: [[₹4.4 lakh crore]], against [[₹2.4 lakh crore]] under the 15th FC ([[84%]] increase)"}]},{"k":"list","title":"Infrastructure","q":"What did Budget 2026-27 announce on infrastructure?","rows":[{"l":"City Economic Regions (CERs)","t":"[[₹5,000 crore]] per CER [[over 5 years]]; Challenge-mode selection through reform-cum-results-based financing; Focus on Tier-II/Tier-III cities and temple towns"},{"l":"High-Speed Rail","t":"7 corridors proposed as growth connectors"},{"l":"Infrastructure Risk Guarantee Fund","t":"To provide risk-mitigation support for infrastructure projects"},{"l":"Infrastructure multiplier (Economic Survey 2025–26)","t":"Every [[₹1]] invested in infrastructure generates [[₹2.5]]–3.5 in GDP"},{"l":"National Highways","t":"Network expanded by approximately [[60%]], from [[91,287 km]] (FY14) to [[1.5 lakh]] km"},{"l":"Nuclear Energy (following SHANTI Act, 2025)","t":"Customs duty exemption on nuclear-project imports extended until 2035 and expanded to all plants, irrespective of capacity; Customs duty on control and protection absorber rods and burnable absorber rods reduced from [[7.5%]] to zero"},{"l":"Data Centres","t":"Tax holiday until 2047 for foreign companies using Indian data centres to provide cloud services to global customers"}]},{"k":"list","title":"Manufacturing & MSMEs","q":"What did Budget 2026-27 announce on manufacturing and msmes?","rows":[{"l":"Electronics Components Manufacturing Scheme (ECMS)","t":"Outlay increased to [[₹40,000 crore]]; separate from earlier PLI schemes"},{"l":"Manufacturing contribution to GDP","t":"Approximately [[15–17%]] in India, compared with [[25–30%]] in South Korea"},{"l":"Legacy Industrial Clusters","t":"200 clusters to be revived through infrastructure and technology upgrades"},{"l":"Champion SMEs","t":"[[₹10,000 crore]] SME Growth Fund (equity support); [[₹2,000 crore]] top-up to the Self-Reliant India Fund; Additional liquidity support"},{"l":"TReDS (Trade Receivables Discounting System)","t":"Made mandatory for CPSE purchases from MSMEs; Enables MSMEs to receive early payments by discounting their invoices with banks and financiers; Credit guarantee support also provided"},{"l":"Biopharma SHAKTI","t":"[[₹10,000 crore]] [[over 5 years]] to establish India as a hub for biologics and biosimilars (complex biological drugs); Includes 3 new NIPERs"},{"l":"Corporate Bond Market","t":"Market-making framework with access to funds and derivatives on bond indices; Introduction of Total Return Swaps (TRS) on corporate bonds"},{"l":"TRS","t":"A financial contract through which Party A receives the total return on a bond (interest + price movement) without owning it, in exchange for paying Party B a fixed or floating rate"}]},{"k":"list","title":"Trade, Tariffs & Reforms","q":"What did Budget 2026-27 announce on trade, tariffs and reforms?","rows":[{"l":"Basic Customs Duty (BCD) reductions","t":"Targeted at textiles, footwear, marine products, electronics and aircraft components"},{"l":"Container Manufacturing Scheme","t":"[[₹10,000 crore]] [[over 5 years]] to develop domestic container manufacturing capacity"}]},{"k":"list","title":"Financial Markets & Taxation","q":"What did Budget 2026-27 announce on financial markets and taxation?","rows":[{"l":"Investment by Persons Resident Outside India in Listed Indian Equities","t":"Individual investment limit increased from [[5%]] to [[10%]]; Aggregate investment limit increased from [[10%]] to [[24%]]"},{"l":"Share Buybacks – Taxation Reform","t":"Earlier: The entire buyback amount was taxed as dividend income; Now: Only the gain is taxed as capital gains, improving tax treatment for investors"},{"l":"Securities Transaction Tax (STT)","t":"Increased on futures and options transactions"}]},{"k":"list","title":"Skills, Employment & Tourism","q":"What did Budget 2026-27 announce on skills, employment and tourism?","rows":[{"l":"Mental Health","t":"India's treatment gap estimated at [[70–92%]] (National Mental Health Survey)"},{"l":"NIMHANS-2","t":"New institution proposed in North India. NIMHANS Bengaluru is the apex institute for mental health and neuroscience; Institutes at Ranchi and Tezpur to be upgraded into Regional Apex Institutions"},{"l":"Tourism – Orange/Creative Economy as an Employment Generator","t":""},{"l":"National Institute of Hospitality","t":"To be established by upgrading NCHMCT"},{"l":"National Destination Digital Knowledge Grid","t":"Digital documentation of heritage sites"},{"l":"Guide Upskilling","t":"Pilot scheme to train 10,000 tourist guides across 20 iconic sites through a 12-week hybrid course with an IIM"},{"l":"Experiential Cultural Destinations","t":"15 archaeological sites to be developed, including Lothal, Dholavira, Rakhigarhi, Adichanallur, Sarnath, Hastinapur and Leh Palace"}]},{"k":"list","title":"New & Emerging Economy","q":"What did Budget 2026-27 announce on new and emerging economy?","rows":[{"l":"India Semiconductor Mission 2.0","t":"Moves beyond subsidising semiconductor fabrication plants (fabs) towards developing the entire semiconductor value chain"},{"l":"Dedicated Rare-Earth Corridors","t":"Proposed in Odisha, Kerala, Andhra Pradesh and Tamil Nadu"}]},{"k":"list","title":"Social Sector & Agriculture","q":"What did Budget 2026-27 announce on social sector and agriculture?","rows":[{"l":"University Townships","t":"5 townships near major industrial and logistics corridors, each hosting multiple universities, research institutes, skill centres and housing facilities"},{"l":"Ministry of Education","t":"Allocation increased by approximately [[8.3%]] to [[₹1.4 lakh crore]]"},{"l":"PM Research Chair (PMRC)","t":"[[₹200 crore]] to attract researchers of Indian origin working abroad back to India"},{"l":"Bharat-VISTAAR","t":"Multilingual AI-powered agricultural advisory platform integrating AgriStack, Bhashini and ICAR knowledge to provide farmers with information and advice"},{"l":"High-Value Agriculture","t":"Focus on sandalwood; Dedicated programmes for cashew and cocoa"},{"l":"SHE-Marts (Self-Help Entrepreneur Marts)","t":"Community-owned retail outlets to help women in Self-Help Groups (SHGs) transition from credit-linked livelihoods to enterprise ownership; Builds on the Lakhpati Didi initiative"}]}]},{"id":"GS33-data-x","line":"GS3.3","part":"","name":"Government budgeting: key data","own":true,"cards":[{"k":"data","title":"Numbers","q":"What are the key numbers?","rows":[{"l":"Nominal GDP growth assumed in the Budget","t":"[[10%]] (Budget 2026-27)"},{"l":"Direct taxes","t":"share of direct taxes in total taxes [[55.5%]] over FY22–FY25, reaching [[58.8%]] in FY25 (ES 2025-26)"}]},{"k":"data","title":"Lines","q":"Which lines can you quote?","rows":[{"l":"Conclusion phrase","t":"‘Arth Shakti, Srijan Shakti, Jeevan Shakti’ (economic power, creative power, life power)"}]}]},{"id":"GS34-problems-of-agri-sector","line":"GS3.4","part":"Agriculture sector","name":"Problems of the agriculture sector","own":true,"cards":[{"k":"list","rows":[{"l":"Small farm holdings","t":"[[86%]] are small and marginal farmers"},{"l":"High employment dependence","t":"[[46%]] vs [[1.2%]] in the USA"},{"l":"Poor access to credit and inputs","t":""},{"l":"Lower productivity","t":"climate vulnerability, soil degradation, non-optimal water management and information gaps; e.g. rice yield 3.0 vs China 7"},{"l":"Poor farmers","t":""},{"l":"Underdeveloped food processing","t":"less than [[10%]] vs [[60–70%]] in the USA"},{"l":"Global vulnerabilities","t":"climate change and CBAM"},{"l":"Low farm mechanisation","t":"[[47%]] vs [[95%]] in the USA"},{"l":"Inadequate storage","t":"reason for [[30%]] of post-harvest loss"},{"l":"Wheat-rice supremacy","t":"why: MSP, lower risk, better R&D (wheat HD-3385 yield potential above 7 t/ha; rice ‘Kamala’ (DRR Dhan 100), India’s first genome-edited rice (2025), higher yield, matures [[≈20 days]] earlier); oilseeds have lower yield per hectare and are [[72%]] rainfed"}],"q":"What are the structural problems of Indian agriculture?","cue":"Land → labour → money → yield → farmer → processing → climate → machines → storage → crop choice: small plots crowded with workers, short of credit, low-yielding, so farmers stay poor; little is processed or stored, few machines, exposed to climate, and locked into wheat-rice."},{"k":"value","rows":[{"l":"Yield gap","t":"Yield: rice ≈2.9 t/ha (milled) or 4.1 t/ha (paddy) in India vs ≈7 t/ha (paddy) in China (compare like with like)"},{"l":"Post-harvest losses","t":"[[≈30–40%]] of fruits and vegetables are lost after harvest (notebook); poor transport accounts for a large share"},{"l":"Seeds","t":"only [[≈20%]] of farmers use certified seed (Agriculture notes, not traced)"}],"q":"What data show agriculture’s weaknesses?"},{"k":"value","title":"Ashok Dalwai Committee (2018): doubling farmers’ income","q":"What strategy did the Ashok Dalwai Committee propose for doubling farmers’ income?","rows":[{"l":"Crop Productivity","t":"Promote quality seeds, mechanisation, precision farming and agricultural extension"},{"l":"Livestock Productivity","t":"Improve animal breeds, veterinary services, fodder availability and dairy infrastructure"},{"l":"Resource-Use Efficiency","t":"Expand micro-irrigation, soil testing, balanced fertilisation and efficient input utilisation to reduce cultivation costs"},{"l":"Cropping Intensity","t":"Expand irrigation, short-duration crops and multiple cropping to increase annual farm output"},{"l":"High-Value Diversification","t":"Shift towards horticulture, fisheries, poultry, beekeeping and agroforestry for higher returns"},{"l":"Remunerative Price Realisation","t":"Strengthen FPOs, e-NAM, warehousing, cold chains and food processing to improve farmers' bargaining power and reduce distress sales"},{"l":"Non-Farm Employment","t":"Shift surplus agricultural labour towards agro-processing, rural MSMEs and allied rural services"}],"cue":"Crops → livestock → efficiency → intensity → diversification → price → non-farm jobs."}]},{"id":"GS34-achievements","line":"GS3.4","part":"Agriculture sector","name":"Achievements of Indian agriculture","own":true,"cards":[{"k":"list","rows":[{"l":"High contribution to economy","t":""},{"l":"Record Foodgrain Output","t":"[[376.6 MMT]] in 2025–26"},{"l":"Global Commodity Leadership","t":"India surpassed China to become the world’s largest rice producer and 2nd in wheat and sugarcane"},{"l":"Structural diversification into high-value allied sectors","t":"horticulture [[≈33%]] of agri GVA (largest producer of dry onions; 2nd in vegetables, fruits and potatoes, ES 2025-26); White Revolution 2.0 (dairy and livestock) [[over 30%]] of agri GVA; Blue Revolution (fisheries), supported by the Pradhan Mantri Matsya Sampada Yojana (PMMSY)"},{"l":"Global export","t":"Agri-exports grew [[70.5%]] between 2014–15 and 2025–26 to reach ≈USD [[54 billion]]"},{"l":"Growth","t":"[[4.4%]] five-year average (the highest decadal growth, [[4.5%]] for FY16-FY25); livestock [[7.1%]], fishing and aquaculture [[8.8%]], crops [[3.5%]] (ES 2025-26)"},{"l":"Market Modernization, Infrastructure & Collectivization","t":"e-NAM, Agriculture Infrastructure Fund (AIF), 10,000 FPOs by February 2026"},{"l":"Income Security, Institutional Credit & Risk Mitigation","t":"Direct Income Support: PM-KISAN, Expanded MSP Procurement, [[7.7 crore]] operative Kisan Credit Cards (KCC)"},{"l":"Digital public infrastructure","t":"AgriStack (farmer registries, geo-referenced plots, digital crop surveys); SVAMITVA; Namo Drone Didi"},{"l":"Green Transition","t":"Clean Energy & Biofuels Under PM-KUSUM"}],"q":"What has Indian agriculture achieved?","cue":"Contribute → produce a record → lead the world → diversify → export → grow → modernise markets → secure incomes → go digital → go green."},{"k":"data","rows":[{"l":"Share of national income","t":"Agriculture is nearly one-fifth of national income (ES 2025-26)."},{"l":"Foodgrain production","t":"[[3,577 lakh]] tonnes (2024-25) (ES 2025-26)"},{"l":"Soybean","t":"Asia’s second-largest producer after China; Madhya Pradesh is the ‘Soya State’. Soybean yields are below 2 t/ha in many districts (ES 2025-26)","unlikely":true},{"l":"Cotton","t":"India has the world’s largest cotton area, [[124.7 lakh]] ha [[≈39%]] of world area (2023-24); 2nd in production ([[325.2 lakh]] bales, [[≈23%]] of world) and 2nd largest consumer (Ministry of Textiles). Yield is low: [[436 kg]]/ha in 2023-24 (provisional); India ranks 36th in yield at [[447 kg]]/ha (Parliamentary Standing Committee on Labour, Textiles and Skill Development, 2022-23 data)"}],"q":"What data and schemes show agriculture’s progress?"},{"k":"data","rows":[{"l":"Why diversify","t":"agriculture is central to Viksit Bharat, with growth coming from allied sectors (livestock, fisheries) (ES 2025-26)"},{"l":"Floriculture is called a ‘sunrise industry’","t":"Agriculture notes","unlikely":true},{"l":"Five F vision (textiles)","t":"Five F vision of the textile sector: Farm, Fibre, Factory, Fashion, Foreign (see Cotton, Numbers)"},{"l":"Interventions the Survey covers","t":"seeds ([[6.9 lakh]] seed villages; national mission on high-yielding seeds); soil (Soil Health Card; national soil mapping); mechanisation (custom hiring centres); sustainable farming (Paramparagat Krishi Vikas Yojana); markets (post-harvest infrastructure; Agriculture Infrastructure Fund; Integrated Scheme for Agricultural Marketing; ATMA, the state extension scheme; MSP for 22 crops) (ES 2025-26)"},{"l":"PM Dhan-Dhaanya Krishi Yojana (Cabinet, July 2025)","t":"[[₹24,000 crore]] a year for six years from 2025-26; 100 districts chosen for low productivity, low cropping intensity and low credit; [[≈1.7 crore]] farmers; modelled on the Aspirational Districts Programme; converges 36 schemes for productivity, diversification, storage, irrigation and credit"}],"q":"What data and schemes show agriculture’s progress?"}]},{"id":"GS34-factors-influencing-cropping-patterns","line":"GS3.4","part":"Cropping pattern","name":"Factors influencing cropping patterns","own":true,"cards":[{"k":"list","rows":[{"l":"Climate /soil types","t":"eg. wheat & rice alluvial and millets in laterite"},{"l":"Input availability","t":"wheat and rice seeds have better R&D (wheat HD-3385 yield potential above 7 t/ha; rice ‘Kamala’) vs poor millet seed supply chains"},{"l":"Post harvest facilities","t":""},{"l":"Government policy","t":"FCI procured [[63.4 MT]] of wheat-rice in 2023-24 vs only [[1–3%]] of millets"},{"l":"Labour availability","t":"paddy needs 200–400 labour hours (better pay) vs 120 for millets"},{"l":"Export","t":"basmati rice enjoys strong exports"},{"l":"Pest and disease risk","t":"millets are naturally pest-resistant; rice faces stem borers and rising pesticide use"},{"l":"Market conditions","t":""},{"l":"Consumption factors","t":"share of cereals and pulses fell from [[52.9%]] (2011-12) to [[47%]] (2023-24); ES 2023 highlighted diversification to protein and perishables; rural FMCG demand grew [[8.4%]]"},{"l":"Capital and entrepreneurship","t":""}],"q":"What factors shape a region’s cropping pattern?","cue":"Nature → inputs → storage → policy → labour → export → pests → markets → diets → capital.","hook":"Soil, seed, store, state, sweat, sell abroad, spray, sell at home, stomach, savings."},{"k":"value","rows":[{"l":"Punjab paddy despite diversification","t":"final area for 2025 was a record [[32.5 lakh]] ha ([[32.4 lakh]] ha in 2024). Paddy covers more than [[90%]] of Punjab’s kharif area; the diversification pilot ([[12,000 ha]] moved to maize) and DSR incentives made little difference"},{"l":"Rice exports","t":"[[≈20.2 MMT]] worth a record [[≈$12.5 bn]] ([[≈₹1.05 lakh crore]]) in FY25; the volume record is still [[22.35 MMT]] (2022-23)","src":"DGCIS; APEDA"},{"l":"Examples","t":"Punjab paddy (record area despite pilots); Karnataka millets vs cotton"}],"q":"What examples show policy shaping cropping patterns?"}]},{"id":"GS34-pulses-edible-oils","line":"GS3.4","part":"Cropping pattern","name":"Pulses and edible oils","own":true,"cards":[{"k":"define","q":"What is the pulses and edible-oil paradox?","text":"India is the largest producer of pulses, yet it imports pulses and relies on imports for much of its edible oil."},{"k":"for","q":"What is the push to self-reliance?","rows":[{"l":"Missions","t":"Mission for Aatmanirbharta in Pulses (2025) and the National Mission on Edible Oils–Oilseeds (2024); MSP and PM-AASHA procurement for pulses and oilseeds"}],"cue":"Missions."},{"k":"against","q":"Why do imports persist?","rows":[{"h":"Markets","l":"Import bill","t":"pulses imports hit a record [[7.3 MT]] ([[≈$5.5 bn]]) in 2024-25 against the previous record of [[6.6 MT]] ([[$4.2 bn]]) in 2016-17, and fell back in FY26; edible oil imports doubled in 11 years, from [[7.9 MT]] (2013-14) to [[16.4 MT]] (2024-25)"},{"h":"Technology","l":"Low yields","t":"soybean yields below [[2 t/ha]] in many districts; India is Asia’s second-largest soybean producer after China; Madhya Pradesh is the ‘Soya State’ (ES 2025-26)"},{"h":"Equity and sustainability","l":"Climate","t":"in 15 of the 27 El Niño years (1951-2024), pulse acreage fell [[2–9%]] (NITI Aayog, ES 2025-26)"}],"cue":"Import bill → Low yields → Climate."}]},{"id":"GS34-millets-shree-anna","line":"GS3.4","part":"Cropping pattern","name":"Millets (Shree Anna)","own":true,"cards":[{"k":"define","text":"Millets are nutrient-rich, climate-resilient coarse cereals that require relatively low water and external inputs, making them suitable for sustainable agriculture, food security and nutritional security.","q":"What is meant by Millets (Shree Anna)?"},{"k":"list","rows":[{"l":"Global Leadership","t":"India is the world's largest millet producer, contributing [[38.4%]] of global production (FAO, 2023); production reached [[180.2 lakh]] tonnes in 2024–25."},{"l":"Research Institution","t":"ICAR–Indian Institute of Millets Research (IIMR), Hyderabad."},{"l":"International Year of Millets","t":"2023, declared by the UN."}],"q":"What are the key facts on millets?"},{"k":"for","rows":[{"l":"Climate Resilience, Low Input Agriculture","t":"Millets require less water, fertiliser and pesticides and tolerate drought and poor soils"},{"l":"Farmer Income","t":"Lower cultivation costs and reduced dependence on external inputs improve farm profitability;"},{"l":"Nutrition Security","t":"Rich in fibre, iron and calcium; dietary diversification is important as cereals and pulses' share in food expenditure declined from [[52.9%]] (2011–12) to [[47%]] (2023–24); ICMR (2024) recommends deriving around [[45%]] of calories from cereals and millets;"},{"l":"Export Potential","t":"Value-added millet products offer opportunities for agricultural exports and food processing;"},{"l":"Employment Generation","t":"Processing, packaging and millet-based enterprises create rural non-farm employment."}],"q":"Why promote millets?","cue":"Climate → income → nutrition → exports → jobs."},{"k":"against","rows":[{"l":"Post-Harvest Constraints","t":"Inadequate storage, processing, grading and value-chain infrastructure;","h":"Infrastructure"},{"l":"Weak Market and Procurement Ecosystem","t":"Limited assured procurement and MSP support compared with rice and wheat discourages cultivation","h":"Markets"},{"l":"Demand Constraints","t":"Changing consumption preferences and limited consumer awareness restrict market expansion;","h":"Markets"},{"l":"Weak Seed Infrastructure","t":"Limited availability of high-yielding, climate-resilient seeds and inadequate R&D constrain productivity;","h":"Technology"},{"l":"Paddy-Wheat Lock-in","t":"Assured procurement, input subsidies and established marketing networks favour rice and wheat;","h":"Rules and institutions"},{"l":"Regional and Agro-Climatic Differences","t":"Crop suitability, soil conditions and rainfall patterns vary, requiring region-specific promotion.","h":"Equity and sustainability"}],"q":"What holds millets back?","cue":"Post-Harvest Constraints → Weak Market and Procurement Ecosystem → Demand Constraints → Weak Seed Infrastructure → Paddy-Wheat Lock-in → Regional and Agro-Climatic Differences."},{"k":"value","rows":[{"l":"Assured Market and Procurement Support","t":"Expand decentralised procurement and integrate millets into PDS, ICDS and PM-POSHAN"},{"l":"Seed and R&D Infrastructure","t":"Develop high-yielding varieties, strengthen ICAR-IIMR research and improve seed distribution;"},{"l":"Value Addition","t":"Promote millet-based ready-to-eat foods, processing units, FPOs and startups through PMFME;"},{"l":"Market Development","t":"Strengthen branding under Shree Anna, e-commerce linkages and APEDA-led export promotion;"},{"l":"Crop Diversification Incentives","t":"Encourage millets in water-stressed regions through region-specific incentives and diversification away from paddy."},{"l":"Mains takeaway","t":"Millets offer a triple dividend of farmer resilience, nutritional security and climate sustainability; the priority is to transform them from traditional coarse cereals into commercially viable nutri-cereals."},{"l":"Added from notebook","t":"low glycaemic index; short growing duration; [[≈60–70%]] less water than paddy."}],"q":"How can millets be mainstreamed?","cue":"Buy them → breed them → process them → brand them → pay to switch."},{"k":"data","rows":[{"l":"Millets","t":"the government procures only [[≈3%]]; market [[≈₹1,000 crore]] against [[≈₹60,000 crore]] for wheat and rice; millets need [[70–80%]] less pesticide than rice (Agriculture notes)"},{"l":"From the diagram","t":"Policy - PDS, mid-day meals, IYM 2023"}],"q":"What data and examples back up Millets (Shree Anna)?"},{"k":"diagram","q":"Draw the diagram for Millets (Shree Anna)","g":{"dir":"TD","nodes":[["M","Millets"],["N","Nutrition - iron, fibre"],["C","Climate - less water, rainfed"],["F","Farmer income - low input cost"],["P","Policy - PDS, mid-day meals, IYM 2023"]],"edges":[["M","N",""],["M","C",""],["M","F",""],["M","P",""]]}}]},{"id":"GS34-gm-crops","line":"GS3.4","part":"Cropping pattern","name":"GM crops","own":true,"cards":[{"k":"define","text":"Agricultural plants whose DNA is deliberately altered using genetic engineering to introduce or modify desirable traits such as pest resistance, herbicide tolerance, drought resilience and improved nutritional content.","q":"What is meant by GM crops?"},{"k":"list","rows":[{"l":"Transgenic GM crops","t":"Introduce foreign DNA/genes from another organism (e.g. Bt cotton)."},{"l":"Gene-edited crops","t":"Make precise changes to existing DNA without retaining foreign DNA (e.g. DRR Rice 100 – Kamala)."},{"l":"India's context","t":""},{"l":"Commercial approval","t":"Bt cotton (2002) remains the only transgenic GM crop approved for commercial cultivation in India. HTBt cotton is not approved. Press Information Bureau+1"},{"l":"GM maize","t":"GEAC has permitted confined field trials of herbicide-tolerant maize (NK603) at PAU, Ludhiana; this is not commercial approval. Final MoM-155th GEAC Meeting dt 26.06.2025.docx"},{"l":"GM mustard (DMH-11)","t":"Received conditional environmental-release approval in October 2022. Supreme Court's split verdict in Gene Campaign v. Union of India (2024 INSC 545) referred the issue to a larger bench. The case was heard by a three-judge bench in September 2026. Science API+1"},{"l":"Genome Editing","t":"India released its first genome-edited rice varieties in May 2025 – DRR Rice 100 (Kamala) and Pusa DST Rice 1. SDN-1/SDN-2 plants free of exogenous DNA are exempt from Rules 7–11 of the 1989 Rules. Digital Sansad+1"}],"q":"What is the status of GM and gene-edited crops in India?"},{"k":"for","rows":[{"l":"Agricultural Productivity, Lower Input Costs","t":"Bt cotton reduces bollworm infestation and insecticide use (ICAR study: applications reduced from 8 to 4)"},{"l":"Import Substitution","t":"GM oilseed varieties could help reduce edible oil import dependence ([[56.25%]] in FY24)"},{"l":"Climate Resilience","t":"Potential to develop drought-, salinity- and pest-resistant crops"},{"l":"Nutrition Security","t":"Genetic modification can enable biofortification to address micronutrient deficiencies"},{"l":"Farmer Income","t":"Lower crop losses and improved productivity can raise farm profitability."}],"q":"What are the arguments for GM crops?","cue":"Yield → fewer imports → resilience → nutrition → income."},{"k":"against","rows":[{"l":"Seed Sovereignty","t":"Patented seeds and dependence on multinational corporations may increase input costs and reduce farmers' control over seeds;","h":"Markets"},{"l":"Pest Resistance","t":"Pink bollworm has developed resistance to Bollgard-II cotton, highlighting the limitations of excessive dependence on a single technology;","h":"Technology"},{"l":"Regulatory Uncertainty","t":"DMH-11 litigation, delayed approvals and absence of a settled national policy create uncertainty for agricultural R&D;","h":"Rules and institutions"},{"l":"Biosafety and Ecological Risks","t":"Gene flow and cross-pollination can threaten indigenous varieties, biodiversity and non-GM export markets","h":"Equity and sustainability"},{"l":"Social Acceptance","t":"Farmer organisations and consumer groups raise concerns over biosafety, corporate control and farmers' rights.","h":"Equity and sustainability"}],"q":"What are the arguments against GM crops?","cue":"Seed Sovereignty → Pest Resistance → Regulatory Uncertainty → Biosafety and Ecological Risks → Social Acceptance."},{"k":"value","rows":[{"l":"Science-Based Regulatory Framework","t":"Implement the Supreme Court's direction in Gene Campaign (2024) for a comprehensive National GM Policy, transparent biosafety assessment and disclosure of expert conflicts of interest"},{"l":"Public-Sector R&D","t":"Strengthen ICAR and State Agricultural Universities to develop affordable, locally adapted GM and gene-edited varieties;"},{"l":"Resistance Management","t":"Enforce Refuge-in-a-Bag (RIB), integrated pest management and post-release monitoring to prevent pest resistance;"},{"l":"Farmer Seed Sovereignty","t":"Protect farmers' rights under Section 39 of the PPV&FR Act, 2001 and promote affordable seed access;"},{"l":"Traceability and Labelling","t":"Strengthen FSSAI safety standards, labelling and identity-preserved supply chains to protect consumer choice and non-GM exports."},{"l":"Mains takeaway","t":"GM technology can enhance agricultural productivity and climate resilience, but its adoption must balance scientific innovation with biosafety, ecological sustainability and farmers' seed sovereignty."}],"q":"How should India regulate and use GM crops?","cue":"Science-based rules → public R&D → manage resistance → protect farmers’ seeds → trace and label."}]},{"id":"GS34-intercropping-and-relay-cropping","line":"GS3.4","part":"Cropping pattern","name":"Intercropping and relay cropping","own":true,"cards":[{"k":"define","text":"Intercropping: growing two or more crops at the same time on one field in a set row pattern. Relay cropping: sowing the next crop before the standing one is harvested.","q":"What is meant by intercropping and relay cropping?","ed":true},{"k":"for","rows":[{"l":"Higher Land-Equivalent Productivity by increasing cropping intensity","t":""},{"l":"Biological Weed Suppression & Input Savings","t":"Multi-tier canopies, root competition and allelopathy suppress weeds by [[70–91%]]; sugarcane–soybean intercropping cuts weeds by [[≈30%]], reducing herbicide and manual-weeding costs."},{"l":"Breaking Herbicide-Resistant Weed Cycles","t":"intercropping cereals with legumes and oilseeds disrupts the ecological niche of persistent wheat weeds such as wild oats, Phalaris minor, and lambsquarters"},{"l":"Ecological Pest Control via Push-Pull Systems","t":"Companion planting such as maize + Desmodium uncinatum (‘push-pull’ intercropping) suppresses the Striga weed"},{"l":"Income Stabilization & Risk Hedging","t":""},{"l":"Custom Hiring Centres","t":"27,554 CHCs (up to 2025-26) improve smallholder access to multi-crop implements"}],"q":"Why practise intercropping and relay cropping?","cue":"More from the same land → fewer weeds → broken weed cycles → natural pest control → steadier income → machines to hire."},{"k":"against","rows":[{"l":"Working capital","t":"managing multiple crops at once raises upfront working-capital needs","h":"Finance"},{"l":"Information asymmetry","h":"People and skills","t":""},{"l":"No downstream infrastructure","h":"Infrastructure","t":""},{"l":"Markets","t":"asymmetric price assurance: open-ended public procurement favours staple cereal monoculture","h":"Markets"},{"l":"Machinery mismatch","t":"combine harvesters and seed drills are calibrated for uniform monocrop rows","h":"Technology"}],"q":"Why don’t more farmers intercrop?","cue":"Money, information, infrastructure, prices and machines all favour one crop."},{"k":"value","rows":[{"l":"Rebalance price and procurement incentives","t":""},{"l":"Custom hiring centres","t":"equipped with adjustable row planters and inter-row weeders"},{"l":"Composite credit","t":"revise scales of finance to offer composite working-capital credit for intercropped holdings"},{"l":"Multi-crop insurance design","t":""},{"l":"Extension and bio-inputs","t":"train frontline extension workers; set up village-level bio-input hubs supplying quality seeds of smother crops"},{"l":"FPO aggregation","t":"channel diversified secondary harvests through FPOs for collective cleaning, grading and direct linkage with food processors"}],"q":"How can intercropping be scaled up?","cue":"Fix prices → hire machines → lend for the mix → insure the mix → teach and supply → sell together."}]},{"id":"GS34-crop-diversification-and-emerging-techno","line":"GS3.4","part":"Cropping pattern","name":"Crop diversification and emerging technology","own":true,"cards":[{"k":"define","text":"Shifting area from a few staples (paddy, wheat) to a wider mix of high-value crops, pulses, millets, horticulture and allied activity, to raise income and cut risk and water use.","q":"What is crop diversification?"},{"k":"list","rows":[{"l":"Precision tools","t":"GIS-based soil maps guide the shift from paddy to maize or millets under drip irrigation (Punjab); smart pump controllers such as Nano Ganesh allow remote pump operation from a basic phone, saving labour and timing irrigation (see Precision agriculture, E-technology)"},{"l":"Climate-resilient varieties and biotech","t":"high-yielding millet, pulse and oilseed varieties, spread by ICAR and IIRR; NICRA promotes resilient varieties with alternative farming techniques; climate-smart practices are zero tillage, crop diversification and integrated nutrient management"},{"l":"AI and digital advice","t":"weather, satellite and soil-health-card data feed smart crop planning that combines GIS, weather and price forecasts to suggest crop choices; e-Sagu and Digital Green carry advice to farmers (video-based farmer-to-farmer learning)"},{"l":"Markets","t":"e-Choupal and e-NAM link farmers to buyers for millets, flour and organic produce (see E-technology)"},{"l":"Protected cultivation","t":"greenhouses, polyhouses, hydroponics and vertical farming give year-round production and open bell peppers, strawberries, orchids and herbs"},{"l":"Public systems","t":"FASAL (crop output forecasts) and KISAN (space-based crop insurance), drones (see Precision agriculture)"}],"q":"Which technologies support crop diversification?","cue":"Map soil → better seed → smart advice → markets → protected farms → public systems."},{"k":"against","rows":[{"l":"Finance","t":"high technology cost; financial constraints"},{"l":"People and skills","t":"knowledge gaps; low digital literacy: only [[≈25%]] of farmers comfortable with digital tools (notebook, attributed to Census/REAP; not traced)"},{"l":"Infrastructure","t":"diversified crops are perishable and need cold storage; land fragmentation"},{"l":"Markets","t":"cropping choices are steered by MSP (see Diagram: paddy lock-in and crop diversification)"},{"l":"Rules and institutions","t":"weak policy support"},{"l":"Equity and sustainability","t":"cultural inertia: direct-seeded rice is held back by perceived uncertainty"}],"q":"What holds back crop diversification?","cue":"Money, skills, cold chain, MSP pull, weak policy, cultural habit."},{"k":"value","rows":[{"l":"National Mission on Natural Farming (2024)","t":"[[≈₹2,481 crore]] shared by Centre and states; targets 15,000 clusters in gram panchayats; [[1 crore]] farmers on [[≈7.5 lakh]] ha; 30,000 Krishi Sakhis; 10,000 Bio-input Resource Centres; 2,000 demonstration farms at KVKs and agricultural universities. KVKs were recommended by the Mohan Singh Mehta Committee (1973); the first KVK opened in 1974 at Puducherry. Implemented by the Ministry of Agriculture and Farmers’ Welfare, state agriculture departments, extension agencies, research institutes, NGOs and farmer groups"},{"l":"PM-PRANAM","t":"incentivises states to cut chemical fertiliser use; promotes soil restoration and biofertilisers. PM-PRANAM returns [[50%]] of the fertiliser subsidy a state saves as a grant (CCEA, June 2023)"},{"l":"Paramparagat Krishi Vikas Yojana","t":"end-to-end support for organic farmers. Crop diversification and traditional varieties open premium niche markets and benefit small farmers and women ; PKVY covers [[18.9 lakh]] ha and [[33.6 lakh]] farmers (PIB, Aug 2026)"},{"l":"Centre of Excellence, Uttar Pradesh","t":"Centre of Excellence in Uttar Pradesh, backed by Indo-Israeli and Dutch technology: helps growers of dragon fruit, dates, citrus, honey and flowers"},{"l":"OUAT and WFP pilot, Odisha","t":"OUAT and WFP pilot in Odisha (notebook: [[₹70 lakh]]): weather stations and a mobile advisory app in 29 villages; 7,000 farmers adopted sustainable practices and incomes rose (not traced online)"}],"q":"Which schemes and examples support diversification?"}]},{"id":"GS34-climate-change-and-cropping-patterns","line":"GS3.4","part":"Cropping pattern","name":"Climate change and cropping patterns","own":true,"cards":[{"k":"define","text":"Changes in temperature, rainfall and extreme weather shift which crops are grown where, when they are sown and how much they yield.","q":"How does climate change affect cropping patterns?","ed":true},{"k":"list","rows":[{"l":"Rice, millet and maize zones shift across South Asia and southern Africa","t":""},{"l":"Coffee and spices move to higher altitudes and poleward","t":""},{"l":"Rainfed kharif turns into irrigated kharif","t":""},{"l":"Water-intensive cereals move to wetter regions","t":""},{"l":"Paddy moves to submergence-tolerant varieties","t":"see Climate-resilient varieties in Crop diversification and emerging technology"},{"l":"Impact","t":"a [[10–40%]] loss in crop production by 2080–2100; every 1°C rise could cut wheat output by [[4–5 million]] tonnes (ICAR network project)"}],"q":"How is climate change shifting cropping patterns?","cue":"Crops move across zones, uphill and poleward, from rain to irrigation, towards water, to flood-tolerant seed; the cost is 10–40% of output."},{"k":"value","rows":[{"l":"Climate","t":"a 2°C rise could cut farm output by [[8–12%]] (Agriculture notes, not traced)"}],"q":"What schemes, data and examples back up Climate change and cropping patterns?"}]},{"id":"GS34-integrated-farming","line":"GS3.4","part":"Cropping pattern","name":"Integrated farming","own":true,"cards":[{"k":"define","text":"Crops, livestock, fisheries and allied enterprises on one farm, where the waste of one component becomes the input of another.","q":"What is an Integrated Farming System?"},{"k":"data","q":"What gains does integrated farming show?","rows":[{"l":"Returns and jobs","t":"combining coconut, banana, dairy and horticulture gives [[≈2x]] returns and [[2x]] employment"},{"l":"Horticulture","t":"raised average farmer income from [[₹0.73 lakh]] to [[₹1.3 lakh]] a year (PIB)"}]},{"k":"for","rows":[{"l":"Higher productivity","t":"coastal Karnataka: coconut, banana, dairy and horticulture together gave [[≈2x]] the returns"},{"l":"Income stability","t":"[[≈1.5–2x]] more stable income (ICAR); several enterprises mean several income streams"},{"l":"Resource efficiency and lower cost","t":"waste from one component becomes input for another; waste recycling cut cultivation cost by [[≈24%]] (IFS review, Plant Archives)"},{"l":"Employment","t":"the Karnataka IFS model gave [[≈2x]] the days of work"},{"l":"Climate resilience","t":"diversified operations spread risk (see Diagram)"}],"q":"What are the benefits of integrated farming?","cue":"Produce more → earn steadily → waste nothing → work more days → resist climate."},{"k":"against","rows":[{"l":"Finance","t":"high initial investment; only a few subsidies (mainly NMSA)","h":"Finance"},{"l":"People and skills","t":"needs knowledge across several disciplines; more labour","h":"People and skills"},{"l":"Infrastructure","t":"land is a constraint: difficult for small and marginal farmers ([[under 2 ha]])","h":"Infrastructure"},{"l":"Markets","t":"each product needs its own marketing channel","h":"Markets"},{"l":"Rules and institutions","t":"complex farm management","h":"Rules and institutions"}],"q":"What limits integrated farming?","cue":"Costly, knowledge-heavy, land-hungry, many markets, complex to run."},{"k":"value","rows":[{"l":"‘Waste is only misplaced wealth’","t":"(Dr A.P.J. Abdul Kalam): the idea behind integrated farming"},{"l":"National Mission for Sustainable Agriculture","t":"(Integrated Farming Systems, [[50%]] of input cost, max [[2 ha]] a farmer): crop + livestock up to [[₹40,000]]/ha; crop + fisheries or poultry up to [[₹25,000]]/ha; horticulture-based up to [[₹25,000]]/ha; green manuring up to [[₹2,000]]/ha (NMSA cost norms). NMSA components: rainfed area development, on-farm water management, soil health management, climate-resilient agriculture (notebook)"}],"q":"What backs up integrated farming?"},{"k":"diagram","q":"Draw the integrated farming system diagram (Integrated farming)","g":{"dir":"TD","nodes":[["I","IFS"],["C","Crops - plantation, fruit, mushroom"],["A","Animal husbandry - dairy, poultry, piggery"],["F","Fishery"],["S","Soil health - nutrient recycling"],["W","Waste management - vermicompost, apiary"],["R","Diverse models - risk mitigation, climate resilience"]],"edges":[["I","C",""],["I","A",""],["A","F",""],["F","S",""],["I","W",""],["I","R",""]]}}]},{"id":"GS34-allelopathy","line":"GS3.4","part":"Cropping pattern","name":"Allelopathy","own":false,"cards":[{"k":"define","text":"The release of chemicals (allelochemicals) by plants, microbes or fungi that affect the germination, growth or survival of neighbouring organisms.","q":"What is meant by allelopathy?","ed":true},{"k":"list","rows":[{"l":"Rice","t":"allelopathic lines such as PI 312777 have denser roots and suppress barnyard grass, cutting weed biomass and competition without herbicides, so yields stay higher"},{"l":"Wheat","t":"intercropping with white clover reduces weeds such as wild oats, ryegrass, cocklebur and lambsquarters"},{"l":"Sugarcane","t":"intercropping with cowpea or soybean cuts weeds by [[≈70–90%]]"},{"l":"Maize","t":"Desmodium uncinatum suppresses Striga and adds nitrogen to the soil"},{"l":"Fallow periods","t":"rye, sunflower, mustard or cowpea as cover or relay crops suppress weeds"}],"q":"Which crops use allelopathy to suppress weeds?"},{"k":"list","q":"How is allelopathy used in farming?","rows":[{"l":"Acts at the roots","t":"suppresses weed seedling growth and root elongation"},{"l":"Pest and weed control","t":"volatile allelochemicals from marigold or Desmodium repel pests or suppress parasitic weeds"},{"l":"Main use","t":"fewer weeds and less weedicide; a base for bio-herbicides"},{"l":"Limit","t":"only [[3–5%]] of plants show a strong allelopathic effect"}]},{"k":"for","rows":[{"l":"Lower input cost","t":"ecologically sustainable; fits integrated weed management"}],"q":"Why use allelopathy?"},{"k":"against","rows":[{"l":"Technology","t":"the effect is weak in most plants (only [[3–5%]] show it strongly)","h":"Technology"},{"l":"Technology","t":"efficacy varies with soil pH, water regime and soil microbes.","h":"Technology"}],"q":"What limits allelopathy?","cue":"Technology → Technology."}]},{"id":"GS34-high-value-crops","line":"GS3.4","part":"Cropping pattern","name":"High-value crops","own":true,"cards":[{"k":"define","text":"Crops that generate relatively higher income per unit of land compared to traditional staples, such as fruits, vegetables, spices, flowers and medicinal plants.","q":"What is meant by high-value crops?"},{"k":"data","q":"Where does India stand in high-value crops?","rows":[{"l":"Rank","t":"largest producer of dry onions; 2nd in vegetables, fruits and potatoes (ES 2025-26)"}]},{"k":"value","rows":[{"l":"Budget 2026-27, high-value crops","t":"sandalwood, plus dedicated programmes for cashew and cocoa","unlikely":true}],"q":"What schemes, data and examples back up High-value crops?"}]},{"id":"GS34-cropping-pattern","line":"GS3.4","part":"Cropping pattern","name":"Cropping pattern","own":true,"cards":[{"k":"define","text":"The proportion of agricultural land allocated to different crops in a particular region during a given period or agricultural season.","q":"What is meant by cropping pattern?"}]},{"id":"GS34-agroforestry","line":"GS3.4","part":"Cropping pattern","name":"Agroforestry","own":true,"cards":[{"k":"define","text":"Growing trees together with crops or livestock on farmland.","q":"What is meant by agroforestry?"},{"k":"data","q":"Why does agroforestry matter, and where is it practised?","rows":[{"l":"Carbon","t":"stores [[≈30%]] more carbon"},{"l":"Tree cover","t":"helps meet the [[33%]] forest/tree cover target (National Forest Policy, 1988)"},{"l":"Imports","t":"India imported [[≈$2.7 bn]] of wood-based products"},{"l":"Traditional systems","t":"Khejri (arid Rajasthan), Taungya (Kerala, West Bengal, Odisha, Karnataka, North-East), Itteri (Tamil Nadu)"}]},{"k":"value","rows":[{"l":"Agroforestry","t":"National Agroforestry Policy (2014; India was the first country to adopt one); Sub-Mission on Agroforestry under the National Mission for Sustainable Agriculture; GROW initiative (NITI Aayog, 2024) to green wastelands through agroforestry"}],"q":"What schemes, data and examples back up Agroforestry?"}]},{"id":"GS34-irrigation","line":"GS3.4","part":"Irrigation","name":"Irrigation","own":true,"cards":[{"k":"define","text":"The artificial supply of water to agricultural land through canals, wells, pumps and sprinklers to support crop growth.","q":"What is irrigation?"},{"k":"for","rows":[{"l":"Steady expansion of irrigated acreage","t":"[[41.7%]] (2001-02) to [[55.8%]] (2022-23)"},{"l":"Climate-resilient agriculture","t":"expanding irrigation ensures it"},{"l":"Scaling precision micro-irrigation","t":"[[over 115 lakh]] ha under drip and sprinkler through PMKSY’s Per Drop More Crop"},{"l":"Aquifer recharge via watershed restoration","t":""},{"l":"Decentralised community water governance","t":"Odisha’s 39,000 Pani Panchayats"}],"q":"What has India achieved in irrigation?","cue":"More area → resilience → precision → recharge → community control."},{"k":"against","rows":[{"l":"Poor irrigation efficiency","t":"[[688 billion]] cubic metres of water consumed by the farm sector"},{"l":"Over-exploited groundwater","t":"[[60%]] of Punjab’s districts face over-extraction"},{"l":"Regional disparities","t":"NE states [[28%]] of area irrigated vs [[95%]] in northern states"},{"l":"Delays in project completion","t":"Sardar Sarovar conceived in the 1940s, completed only in 2017"},{"l":"Waterlogging","t":"soil degradation affects [[147 million]] hectares"},{"l":"Power-irrigation nexus","t":"subsidised electricity drives excessive groundwater extraction"}],"q":"What are the challenges in India’s irrigation system?","cue":"Wasteful → over-pumped → unequal → delayed → waterlogged → powered by free electricity."},{"k":"value","rows":[{"l":"PMKSY Convergence","t":"Coordinate Har Khet Ko Pani, Per Drop More Crop and WDC-PMKSY across relevant ministries"},{"l":"WDC-PMKSY 2.0","t":"(2021–26) targeted [[49.5 lakh]] hectares with [[₹8,134 crore]] central outlay"},{"l":"Water-Use Efficiency","t":"Adopt pressurised closed-conveyance pipelines, SCADA-based distribution and farm-level drip/sprinkler systems (Mihir Shah Committee);"},{"l":"Aquifer Governance","t":"Implement the Mihir Shah Committee's proposed National Water Commission (merging CWC and CGWB), delink groundwater access from land ownership and promote community aquifer budgeting through Atal Bhujal Yojana;"},{"l":"Participatory Irrigation Management","t":"Replicate Odisha's Pani Panchayats and Punjab's Warabandi, empowering Water User Associations in canal maintenance and water-charge collection;"},{"l":"Crop Diversification","t":"Shift from paddy/sugarcane to millets, pulses and oilseeds in over-exploited blocks through targeted procurement, solarised agricultural feeders under PM-KUSUM and DBT-linked power subsidies"}],"q":"How can India’s irrigation be reformed?","cue":"Converge PMKSY → use water efficiently → govern aquifers → let farmers manage → diversify crops."},{"k":"data","rows":[{"l":"Coverage","t":"gross irrigated area is [[55.8%]] of gross cropped area (2022-23), up from [[41.7%]] in 2001-02 (ES 2025-26). Use gross cropped area, not net sown area"},{"l":"Conclusion anchor","t":"‘Har Khet Ko Pani’ and ‘Per Drop More Crop’ (PMKSY), with the National Water Mission goal of [[20%]] higher water-use efficiency"},{"l":"PM Krishi Sinchayee Yojana (PMKSY), ‘Har Khet Ko Pani’","t":"ministries involved are Jal Shakti, Agriculture and Farmers’ Welfare, and the Department of Land Resources (Rural Development), under a National Steering Committee. Aim: improve physical access to water and expand the irrigated area. Watershed Development Component: 2009-2020 projects raised the groundwater table by ≈3 m and cultivable area by [[≈30%]]; WDC-PMKSY 2.0 (approved 15 Dec 2021, for 2021-26): [[49.5 lakh]] ha target, [[₹8,134 crore]] central share (DoLR)"},{"l":"Sardar Sarovar","t":"conceived in the 1940s, completed only in 2017 (delays in major irrigation projects)"},{"l":"Odisha","t":"more than 39,000 Pani Panchayats (farmers’ water-user associations) (ES 2025-26)"}],"q":"What data and schemes back up irrigation?"}]},{"id":"GS34-water-storage","line":"GS3.4","part":"Irrigation","name":"Water storage (traditional and farm-level)","own":true,"cards":[{"k":"list","rows":[{"l":"Farm ponds","t":"e.g. Andhra Pradesh’s Bandhlapaur: 103 farm ponds stored [[27 lakh]] m³ of water; UP’s Har Khet Talab: [[37k]] farm ponds built"},{"l":"Tank and cascade systems","t":"networks of surface reservoirs fed by monsoon flows and arranged in cascades; capture runoff and regulate seasonal flow (Mission Kakatiya in Telangana a huge success)"},{"l":"Johads (north-west)","t":"earthen check dams that capture runoff"},{"l":"Ahar-pynes (south Bihar)","t":""}],"q":"Which water-storage systems can you cite, with examples?"},{"k":"list","q":"What makes water storage work, and what goes wrong?","rows":[{"l":"What works","t":"captures runoff and rain, recharges groundwater, is community-owned, needs little maintenance, distributes water equitably and builds resilience to climate variability"},{"l":"What goes wrong","t":"no science-based site selection, silt traps, and plastic lining that prevents recharge"}]}]},{"id":"GS34-micro-irrigation","line":"GS3.4","part":"Irrigation","name":"Micro-irrigation","own":true,"cards":[{"k":"define","text":"A water-efficient irrigation method that delivers small, controlled quantities of water directly to the plant root zone minimising water wastage. eg. drip, sprinkler, sub-surface","q":"What is meant by micro-irrigation?"},{"k":"for","rows":[{"l":"Water-use efficiency","t":"efficiency [[75–95%]] against [[≈ 35–40%]] for flood irrigation; saves [[20–25%]] water"},{"l":"Energy and input savings","t":"saves [[10–30%]] electricity; uses [[28%]] less fertiliser"},{"l":"Allows preuse mixing of fertilizers in water","t":"direct application to root zone; leading to less fertz consumption"},{"l":"Higher yields","t":"raises yields by [[20–80%]]"},{"l":"Groundwater relief","t":"groundwater supplies [[≈60–65%]] of irrigation, and [[≈60%]] of Punjab’s blocks are over-exploited"}],"q":"Why expand micro-irrigation?","cue":"Save water → save power and fertiliser → feed the root → raise yields → spare groundwater."},{"k":"against","rows":[{"l":"Capital cost","t":"setting up costs [[≈₹1 lakh]]/ha in Assam, with maintenance of [[10–20%]] of that cost each year","fix":"Micro Irrigation Fund ([[₹5,000 crore]] with NABARD)","h":"Finance"},{"l":"Maintenance gaps","t":"clogging and servicing need trained support ([[10-20%]] of intial cost each year (pew market research))","h":"People and skills"},{"l":"Inadequate promotion","t":"e.g. adoption lagged in Karnataka’s Chikkaballapur district because farmers had limited tech support","h":"People and skills"},{"l":"Small and fragmented holdings","t":"raise the per-farmer cost of installation","h":"Infrastructure"},{"l":"Poor integration with existing farm systems","h":"Technology","t":""},{"l":"Free power disincentivises saving water","h":"Rules and institutions","t":""}],"q":"Why is micro-irrigation adoption slow?","cue":"Capital cost → Maintenance gaps → Inadequate promotion → Small and fragmented holdings → Poor integration with existing farm systems → Free power disincentivises saving water."},{"k":"value","rows":[{"l":"Micro-irrigation","t":"[[over 115 lakh]] ha under Per Drop More Crop (July 2026), [[≈8%]] of net sown area (PIB)"}],"q":"How much land is under micro-irrigation?"},{"k":"diagram","q":"Draw the diagram for Micro-irrigation","g":{"dir":"TD","nodes":[["I","Irrigation"],["S","Surface - canals, tanks"],["G","Groundwater - wells, tubewells"],["M","Micro - drip, sprinkler"],["E","Water-use efficiency 75 to 95%"]],"edges":[["I","S",""],["I","G",""],["I","M",""],["M","E",""]]}}]},{"id":"GS34-water-use-efficiency","line":"GS3.4","part":"Irrigation","name":"Water-use efficiency","own":true,"cards":[{"k":"define","text":"The amount of agricultural output (crop yield) produced per unit of water used, reflecting how effectively water resources are utilised. (more crop per drop)","q":"What is meant by water-use efficiency?"},{"k":"for","rows":[{"l":"Finance","t":"PMKSY ‘Per Drop More Crop’ and the Micro Irrigation Fund pay for drip and sprinkler"},{"l":"Infrastructure","t":"modernising old canal projects and command area development could raise overall irrigation efficiency by [[≈20–21%]] (National Water Mission) and On-Farm Micro-Storage & Watershed Recharge"},{"l":"Markets","t":"crop choice: millets and pulses need far less water than paddy (see Millets, Cropping pattern)"},{"l":"Technology","t":"Precision Micro-Irrigation Adoption: Shifting from conventional flood irrigation ([[≈25–40%]] efficiency) to drip ([[≈85–90%]]) and sprinkler ([[≈75–85%]]) systems under Per Drop More Crop (PDMC)"},{"l":"Integrated Fertigation Practices","t":"Dissolving water-soluble nutrients directly into micro-irrigation"},{"l":"Agronomic Water-Saving Protocols","t":"Adopting Alternate Wetting and Drying (AWD) in paddy, Direct-Seeded Rice (DSR), laser land leveling, and zero-tillag"},{"l":"Rules and institutions","t":"water pricing and differential entitlements (the route the National Water Mission names); rotational sharing such as Warabandi (see Government steps)"}],"q":"How can India raise agricultural water-use efficiency?"},{"k":"against","rows":[{"l":"Finance","t":"High upfront capital expenditure for drip/sprinkler hardware"},{"l":"People and skills","t":"Weak grassroots agronomic extension leaves cultivators reliant on traditional flood-irrigation habits"},{"l":"Infrastructure","t":"old, unlined canals lose water before it reaches the field (irrigation efficiency depressed at [[30–38%]])"},{"l":"Markets","t":"assured MSP procurement keeps water-hungry paddy and wheat attractive"},{"l":"Rules and institutions","t":"water and irrigation are State subjects, so pricing reform depends on each state"},{"l":"Equity and sustainability","t":"groundwater supplies [[≈60–65%]] of irrigation and [[≈60%]] of Punjab’s blocks are over-exploited (see Micro-irrigation)"}],"q":"What keeps water-use efficiency low?","cue":"Costly kit, weak extension, leaky canals, MSP for paddy, State-subject politics, groundwater stress."},{"k":"value","rows":[{"l":"Piped Irrigation & SCADA (Mihir Shah Committee)","t":"Replace open canals with pressurised pipelines, SCADA flow meters and drip/sprinkler systems to reduce seepage and achieve [[20%]] higher water-use efficiency (National Water Mission)"},{"l":"Volumetric Pricing & Solarisation","t":"Ashok Dalwai Committee / PM-KUSUM"},{"l":"Agro-Climatic Crop Realignment","t":""},{"l":"AI & IoT Precision Irrigation","t":"Digital Agriculture Mission"},{"l":"Community Aquifer Management (Atal Bhujal Yojana)","t":""}],"q":"Which reforms and committees improve water-use efficiency?","cue":"Pipe it → price it → realign crops → automate → let communities manage aquifers."},{"k":"data","rows":[{"l":"Atal Bhujal Yojana","t":"improves groundwater management through community participation"}],"q":"What examples back up water-use efficiency?"}]},{"id":"GS34-watershed-development","line":"GS3.4","part":"Irrigation","name":"Watershed development","own":true,"cards":[{"k":"define","text":"Treating an entire watershed (the area draining to a common point) as one planning unit for integrated soil, water and land management, from ridge to valley.","q":"What is meant by watershed development?","ed":true},{"k":"list","q":"How has watershed development evolved?","rows":[{"l":"Early programmes","t":"DPAP + DDP + IWDP"},{"l":"IWMP","t":"2009–10"},{"l":"WDC-PMKSY","t":"2015–16; WDC-PMKSY 2.0 (2021–26) under the Department of Land Resources"},{"l":"Ridge to valley","t":"treat upper slopes first → slow runoff → recharge groundwater → harvest water → raise farm productivity in the valley"}]},{"k":"for","rows":[{"l":"Groundwater Recharge","t":"Check dams, bunding and farm ponds improve infiltration and replenish aquifers."},{"l":"Rainfed Productivity","t":"Moisture conservation and protective irrigation stabilise output; [[76%]] of India's oilseed area is rainfed (NITI Aayog, 2024)."},{"l":"Cropping Intensity","t":"Better water availability enables multiple cropping and high-value horticulture."},{"l":"Rural Employment","t":"Construction of ponds, trenches and bunds generates jobs and community assets."},{"l":"Ecological Restoration","t":"Afforestation and soil conservation reduce erosion and desertification."},{"l":"Climate Resilience","t":"Improved soil moisture protects smallholders against droughts and erratic monsoons."},{"l":"Livelihood Diversification","t":"Dairy, fisheries, poultry and livestock reduce seasonal income dependence and distress migration."},{"l":"Latest evidence: WDC-PMKSY 2.0 (1 September 2026)","t":"1,220 projects covering [[52.9 lakh]] hectares; [[28.5 lakh]] farmers benefited and [[2.9 crore]] person-days of employment generated."}],"q":"What are the benefits of watershed development?","cue":"Recharge → stabilise rainfed farms → crop more → employ → restore → resist drought → diversify."},{"k":"against","rows":[{"l":"Maintenance Deficit","t":"Watershed assets deteriorate due to inactive committees and inadequate post-project maintenance.","h":"Infrastructure"},{"l":"Fragmented Infrastructure","t":"Isolated structures without ridge-to-valley planning reduce effectiveness and increase siltation.","h":"Infrastructure"},{"l":"Institutional Silos","t":"Poor inter-departmental coordination delays project implementation and convergence.","h":"Rules and institutions"},{"l":"Equity Deficit","t":"Landowners benefit disproportionately from private-land investments, while landless households depend on common resources.","h":"Equity and sustainability"},{"l":"Negative Externality","t":"Unregulated upstream water harvesting reduces downstream water availability, triggering conflicts.","h":"Equity and sustainability"}],"q":"Why do watershed projects underperform?","cue":"Assets decay, structures are isolated, departments work in silos, landowners gain most, upstream takes downstream’s water."},{"k":"value","rows":[{"l":"Asset Sustainability","t":"Strengthen the Watershed Development Fund through community contributions, user charges and common-asset income; reserve [[50%]] for maintenance and [[50%]] as a revolving fund."},{"l":"Institutional Convergence","t":"Converge WDC-PMKSY with MGNREGS for soil and water conservation works; empower Watershed Committees within Gram Panchayats, as recommended by the Parthasarathy Committee (2006)."},{"l":"Inclusive Growth","t":"Allocate [[15%]] of project outlay to landless and assetless households through poultry, fisheries, goat-rearing and micro-enterprises; protect their rights over common resources."},{"l":"Technology-led Governance","t":"Use GIS, satellite mapping and geo-tagging of assets for scientific planning, transparency and monitoring."},{"l":"Conjunctive Water Management","t":"Conduct participatory water budgeting and regulate groundwater extraction, crop choices and water sharing to prevent aquifer depletion and inter-village conflicts."},{"l":"Mountain Water Security","t":"Scale up springshed development by protecting spring catchments and aquifer recharge zones, particularly in Himalayan states."},{"l":"Integrated Landscape Planning","t":"Adopt ridge
