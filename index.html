 activity is priced, paid and counted in GDP.","q":"What is meant by monetised economy?"}]},{"id":"GS32-life-expectancy","line":"GS3.2","part":"","name":"Life expectancy","own":true,"cards":[{"k":"define","text":"The average number of years a person is expected to live, based on current mortality rates and demographic conditions.","q":"What is meant by life expectancy?"}]},{"id":"GS32-subsistence-economy","line":"GS3.2","part":"","name":"Subsistence economy","own":true,"cards":[{"k":"define","text":"An economy where production is primarily for one's own consumption rather than sale.","q":"What is meant by subsistence economy?"}]},{"id":"GS32-platform-economy","line":"GS3.2","part":"","name":"Platform economy","own":true,"cards":[{"k":"define","text":"Economic activities facilitated through digital platforms connecting buyers and sellers or workers.","q":"What is meant by platform economy?"}]},{"id":"GS32-shadow-economy","line":"GS3.2","part":"","name":"Shadow economy","own":true,"cards":[{"k":"define","text":"Economic activities deliberately concealed from authorities to avoid taxes, regulations or legal obligations.","q":"What is meant by shadow economy?"}]},{"id":"GS32-cash-economy","line":"GS3.2","part":"","name":"Cash economy","own":true,"cards":[{"k":"define","text":"Economic activities in which payments are predominantly made using physical currency.","q":"What is meant by cash economy?"}]},{"id":"GS32-parallel-economy","line":"GS3.2","part":"","name":"Parallel economy","own":true,"cards":[{"k":"define","text":"Economic activities operating outside or alongside the officially recorded economy; often associated with black money.","q":"What is meant by parallel economy?"}]},{"id":"GS32-command-economy","line":"GS3.2","part":"","name":"Command economy","own":true,"cards":[{"k":"define","text":"An economy in which the government centrally controls major production and resource allocation decisions.","q":"What is meant by command economy?"}]},{"id":"GS32-post-industrial-economy","line":"GS3.2","part":"","name":"Post-industrial economy","own":true,"cards":[{"k":"define","text":"An economy in which services, information and knowledge activities dominate over manufacturing.","q":"What is meant by post-industrial economy?"}]},{"id":"GS32-inclusive-growth","line":"GS3.2","part":"","name":"Inclusive growth","own":true,"cards":[{"k":"define","text":"Economic growth that is distributed fairly across society, creating opportunities for all while systematically reducing poverty, inequality, and regional disparities.","q":"What is inclusive growth?"},{"k":"list","q":"How has India pursued inclusive growth?","rows":[{"l":"Historical","t":"The Green Revolution."},{"l":"Geographical","t":"PM Gram Sadak Yojana for rural roads."},{"l":"Political","t":"Nari Shakti Vandan Adhiniyam for women's reservation."},{"l":"Governance","t":"The National e-Governance Plan."},{"l":"Social justice","t":"The VB-G RAM G rural job guarantee."},{"l":"Economic","t":"Equal market access, for example through PM Mudra loans."},{"l":"Environmental","t":"EIA keeps growth from harming the environment."}],"cue":"History → geography → politics → governance → justice → economy → environment."},{"k":"for","rows":[{"l":"Demand-led growth","t":"Shared growth multiplies consumption and demand."},{"l":"Poverty reduction","t":"Welfare has cut extreme poverty to [[5.3%]]."},{"l":"Demographic dividend","t":"Health and education turn a large population into a skilled workforce."},{"l":"Social stability","t":"Narrower gaps keep society stable and attract long-term investment."},{"l":"Women-led development","t":"Schemes like SHE-Marts help women own enterprises."}],"q":"Why does inclusive growth matter for India?","cue":"Demand → poverty → workforce → stability → women."},{"k":"against","rows":[{"l":"Access barriers","t":"The poor lack access to finance, markets, knowledge and education."},{"l":"Human capital gaps","t":"India ranks [[130th]] of 193 countries on the HDI."},{"l":"Jobless growth","t":"Growth creates too few good jobs."},{"l":"Wealth concentration","t":"The top 1% hold about [[40%]] of national wealth."},{"l":"Agrarian distress","t":"Low farm incomes widen the rural–urban divide."},{"l":"Social exclusion","t":"[[55,685]] crimes against Scheduled Castes were registered in 2024."}],"q":"What stands in the way of inclusive growth?","cue":"Access → human capital → jobs → wealth → farms → caste."},{"k":"value","rows":[{"l":"Universal safety net","t":"Social-sector spending is [[2.8%]] in India against 31% in Finland."},{"l":"Technology for access","t":"e-Sanjeevani crossed [[50 crore]] teleconsultations in 2026."},{"l":"Universal basic services","t":"Follow Amartya Sen's capability approach."},{"l":"Inclusive by design","t":"Build progressive institutions and fair taxes, the Ram Rajya ideal."},{"l":"Progressive devolution","t":"Ring-fence funds to reach [[6%]] of GDP on education and 2.5% on health."},{"l":"Inclusive institutions","t":"Nobel 2024 work shows inclusive institutions drive growth and extractive ones stifle it."}],"q":"How can India make growth inclusive?","cue":"Safety net → technology → basic services → design → devolution → institutions."},{"k":"data","rows":[{"l":"Social services spending","t":"It is [[7.9%]] of GDP in FY26. (ES 2025-26)"},{"l":"States carry it","t":"States spend [[8.2%]] of GDP on social sectors."},{"l":"Education and health","t":"Education gets about [[4.1%]] of GDP and health about 1.9%."},{"l":"Wealth at the top","t":"The top 10% hold about [[65%]] of national wealth."},{"l":"Billionaire Raj","t":"Inequality is at or above British Raj-era levels."}],"q":"What data show how inclusive India’s growth is?"},{"k":"data","rows":[{"l":"SDGs","t":"SDG 5 is gender equality and SDG 10 is reducing inequality."},{"l":"Rural housing","t":"PMAY-G targets [[4.95 crore]] pucca houses. (ES 2025-26)"},{"l":"CSR","t":"Company CSR spending is one more lever for inclusion."}],"q":"What data show how inclusive India’s growth is?"},{"k":"diagram","q":"Draw the diagram for Inclusive growth","g":{"dir":"TD","nodes":[["G","Inclusive growth"],["J","Jobs and wages"],["H","Human capital - health, education"],["F","Financial inclusion"],["S","Social protection"],["R","Regional balance"],["C","Companies CSR"]],"edges":[["G","J",""],["G","H",""],["G","F",""],["G","S",""],["G","R",""],["G","C",""]]}}]},{"id":"GS32-financial-inclusion","line":"GS3.2","part":"","name":"Financial inclusion","own":true,"cards":[{"k":"define","text":"Affordable access for all, especially the poor, rural households and women, to formal financial services: accounts, credit, insurance, pensions and payments.","q":"What is meant by financial inclusion?"},{"k":"for","rows":[{"l":"Poverty trap","t":"Savings and credit help the poor escape poverty."},{"l":"Resource mobilisation","t":"Jan Dhan accounts brought about [[₹3.2 lakh crore]] into banks."},{"l":"Leak-proof welfare","t":"DBT sends money straight into beneficiaries' accounts."},{"l":"Credit for all","t":"Schemes like PM Mudra bring micro-credit to women and rural borrowers. (ES 2025-26)"},{"l":"Risk cover","t":"Cheap insurance like PMJJBY stops one shock pushing families into poverty."},{"l":"Women's agency","t":"Own accounts and credit raise women's bargaining power."}],"q":"Why does financial inclusion matter?","cue":"Escape poverty → mobilise savings → stop leaks → credit for all → insure → empower women."},{"k":"against","rows":[{"l":"Over-indebtedness","t":"Easy micro-credit can become a debt trap."},{"l":"Missing middle","t":"Growing MSMEs struggle to get loans without collateral."},{"l":"Literacy gaps","t":"Many new account holders lack financial and digital literacy."},{"l":"Last-mile gaps","t":"Remote areas have few branches and weak networks."},{"l":"Dormant accounts","t":"Many Jan Dhan accounts lie unused despite [[89%]] adult coverage."},{"l":"Digital divide and fraud","t":"People without phones are left out, and online fraud is rising."},{"l":"Women left out","t":"Women lack the collateral needed for bigger loans."}],"q":"What limits financial inclusion?","cue":"Debt traps → missing middle → literacy → last mile → dormancy → fraud → women."},{"k":"value","rows":[{"l":"Last-mile banking","t":"Take banking services to every village."},{"l":"Active use","t":"Shift from opening accounts to actually using credit."},{"l":"Cash-flow lending","t":"Use UPI and GST data to judge borrowers without collateral."},{"l":"Stronger Bank Mitras","t":"Pay business correspondents better and equip them with micro-ATMs."},{"l":"Micro-insurance","t":"Push cheap rural insurance through India Post."},{"l":"Women's enterprise","t":"Use SHE-Marts to help women's SHGs own businesses. (Budget 2026-27)"},{"l":"5A framework","t":"Services must be available, accessible, affordable, awareness-driven and appropriate."}],"q":"How can financial inclusion go deeper?","cue":"Last mile → active use → cash-flow lending → Bank Mitras → insurance → women → 5A."},{"k":"data","rows":[{"l":"Financial Inclusion Index","t":"The RBI index rose to [[67]] in March 2025 from 54 in 2017."},{"l":"SHE-Marts","t":"Community-owned shops help women's SHGs move from credit to owning enterprises. (Budget 2026-27)"}],"q":"What data and examples back up Financial inclusion?"},{"k":"diagram","q":"Draw the diagram for Financial inclusion","g":{"dir":"LR","nodes":[["J","Jan Dhan account"],["A","Aadhaar link"],["M","Mobile"],["D","DBT"],["C","Credit, insurance, pension"]],"edges":[["J","A",""],["A","M",""],["M","D",""],["D","C",""]]}}]},{"id":"GS32-care-economy","line":"GS3.2","part":"","name":"Care economy","own":true,"cards":[{"k":"define","text":"The economic activities involving paid and unpaid care work, such as childcare, elderly care, healthcare and domestic work, that sustain households and society.","q":"What is meant by care economy?"},{"k":"for","rows":[{"l":"Women into work","t":"Shared care frees women's time for paid work."},{"l":"Job creation","t":"Investing 2% of GDP in care could create [[11 million]] jobs."},{"l":"Bigger GDP","t":"The care economy could add up to [[60%]] to GDP."},{"l":"Silver economy link","t":"India will have about [[347 million]] elderly by 2050."}],"q":"Why should India invest in the care economy?","cue":"Women's time → jobs → GDP → elderly."},{"k":"against","rows":[{"l":"Fiscal neglect","t":"India spends less than [[1%]] of GDP on care."},{"l":"ASHA reliance","t":"ASHA workers carry the load without fixed pay."},{"l":"Invisible unpaid work","t":"Women spend [[3.5 hours]] more than men on unpaid work."},{"l":"Care penalty","t":"Women give up education, careers and paid hours to care for family."}],"q":"Why is care work undervalued in India?","cue":"Low spending → unpaid ASHAs → invisible work → care penalty."},{"k":"value","rows":[{"l":"ILO 5 R","t":"Recognise, reduce and redistribute unpaid care, and reward and represent carers."},{"l":"Train caregivers","t":"Train [[1.5 lakh]] caregivers to formalise care work. (Budget 2026-27)"},{"l":"Count unpaid work","t":"Use Time Use Survey data to put unpaid work in statistics."},{"l":"Crèches everywhere","t":"Combine workplace crèches with public rural care centres."},{"l":"Share care","t":"Paternity leave and carers' allowances spread care beyond women."}],"q":"How can India build its care economy?","cue":"5 R → train → count → crèches → share."},{"k":"data","rows":[{"l":"Digital care","t":"e-Sanjeevani brings telemedicine through India's digital infrastructure."},{"l":"Low female LFPR","t":"Heavy care duties keep women out of the labour force."}],"q":"What data and examples back up Care economy?"},{"k":"diagram","q":"Draw the care economy cycle diagram (Care economy)","g":{"dir":"LR","nodes":[["U","Unpaid care burden"],["L","Low female LFPR"],["G","Lost output"],["I","Invest in care - creches, care workers"],["W","More women in paid work"]],"edges":[["U","L",""],["L","G",""],["G","I",""],["I","W",""]]}}]},{"id":"GS32-silver-economy","line":"GS3.2","part":"","name":"Silver economy","own":true,"cards":[{"k":"define","text":"The production and consumption of goods and services catering to the needs of the elderly (60+), including healthcare, housing, leisure and financial services.","q":"What is meant by silver economy?"},{"k":"for","rows":[{"l":"Second demographic dividend","t":"Retired professionals can consult, mentor and work part-time."},{"l":"New consumer market","t":"The elderly need healthcare, wellness, assisted living and insurance."},{"l":"Care jobs","t":"Elderly care creates jobs for nurses and caregivers."},{"l":"Financial deepening","t":"Demand grows for pensions, annuities and reverse mortgages."},{"l":"Age-tech","t":"Ageing drives innovation in medical devices, wearables and smart homes."}],"q":"How can an ageing India become an economic opportunity?","cue":"Experience → demand → care jobs → finance → age-tech."},{"k":"against","rows":[{"l":"Pension insecurity","t":"Most informal workers retire without a pension."},{"l":"Caregiver shortage","t":"India lacks trained geriatric doctors, nurses and caregivers."},{"l":"Inaccessible infrastructure","t":"Footpaths, transport and buildings are hard for the elderly to use."},{"l":"Digital exclusion","t":"Online banking and telemedicine leave out elderly people with low digital skills."},{"l":"Poorer widows","t":"Widows are poorest because of low lifetime earnings and few assets."}],"q":"What holds back India’s silver economy?","cue":"No pension → no carers → no access → no digital → widows poorest."},{"k":"value","rows":[{"l":"SAGE","t":"Fund elderly-care startups under the SAGE initiative."},{"l":"Reverse mortgages","t":"Let elderly owners draw income from homes without selling them."},{"l":"Geriatric healthcare","t":"Expand elderly care under the national programme, NPHCE."},{"l":"Silver gig work","t":"Create flexible mentoring roles for retired professionals."},{"l":"Universal design","t":"Make transport, housing and cities elderly-friendly."},{"l":"Mains line","t":"Turn ageing from a welfare burden into an economic opportunity."}],"q":"How can India build its silver economy?","cue":"Startups → reverse mortgages → geriatric care → silver gigs → universal design."}]},{"id":"GS32-hdi-and-ihdi","line":"GS3.2","part":"","name":"HDI and IHDI","own":true,"cards":[{"k":"define","text":"HDI (UNDP) measures average achievement in health, education and income; IHDI adjusts it for inequality, so the gap between them shows the loss to inequality.","q":"What do HDI and IHDI measure?"},{"k":"list","q":"What indicators make up the HDI?","rows":[{"l":"Health","t":"Life expectancy at birth."},{"l":"Education","t":"Mean and expected years of schooling."},{"l":"Income","t":"GNI per capita at PPP."}],"cue":"Health → education → income."},{"k":"for","rows":[{"l":"Multidimensional equity","t":"It covers inequality in health, education and income, unlike the Gini."},{"l":"Captures distribution","t":"India loses [[30.7%]] of its HDI to inequality."},{"l":"Shows where the loss is","t":"Dimension-wise losses show where to target schemes."},{"l":"Comprehensive policy","t":"It supports broad, stakeholder-inclusive policy."},{"l":"Inclusiveness","t":"Growth counts only when its gains are shared."}],"q":"Why is IHDI a better measure than HDI?","cue":"Three dimensions → distribution → where the loss is → policy → inclusiveness."},{"k":"against","rows":[{"l":"Data gaps","t":"Household surveys miss top incomes and wealth."},{"l":"Gender-blind","t":"It needs the GDI and GII alongside it."},{"l":"Planet-blind","t":"It ignores ecology and needs the planet-adjusted HDI."},{"l":"No regional or caste detail","t":"It gives no breakdown by region or caste."}],"q":"What do HDI and IHDI miss?","cue":"Data gaps → gender → planet → region and caste."},{"k":"value","rows":[{"l":"Why the 30% loss","t":"Spending misses [[6%]] of GDP on education and 2.5% on health."},{"l":"Combine with MPI","t":"Add the MPI to capture sanitation, housing, power and nutrition."},{"l":"Planet-adjusted HDI","t":"Use the PHDI to count environmental costs."},{"l":"Outcome measures","t":"Use PARAKH learning outcomes and healthcare quality data."},{"l":"Real-time data","t":"Use DPI and administrative data for timely local estimates."},{"l":"Ring-fence human capital","t":"Protect health and education spending in backward regions."}],"q":"How can India measure human development better?","cue":"Spending gap → MPI → PHDI → outcomes → data → ring-fence."},{"k":"data","rows":[{"l":"Higher education institutions","t":"Their number rose to about [[70,000]] in 2025. (ES 2025-26)"},{"l":"Expected schooling","t":"It is [[13]] years against the NEP target of 15. (ES 2025-26)"},{"l":"Higher-education GER","t":"The enrolment ratio is [[29.5]]. (ES 2025-26)"},{"l":"Maternal mortality","t":"MMR fell [[86%]] since 1990, against 48% worldwide. (ES 2025-26)"},{"l":"DIKSHA","t":"India's digital knowledge-sharing platform for schools. (ES 2025-26)"},{"l":"Education budget","t":"Allocation rose about [[8.3%]] to ₹1.4 lakh crore. (Budget 2026-27)"},{"l":"PM Research Chair","t":"[[₹200 crore]] to bring back researchers of Indian origin. (Budget 2026-27)"}],"q":"What data show India’s human capital?"}]},{"id":"GS32-intra-and-inter-generational-equity","line":"GS3.2","part":"","name":"Intra- and inter-generational equity","own":true,"cards":[{"k":"list","rows":[{"l":"Intra-generational equity","t":"Fair shares among people alive today, across income, gender, caste and region."},{"l":"Inter-generational equity","t":"Meeting today's needs without harming future generations, per the Brundtland Report."}],"q":"What do intra- and inter-generational equity mean?","cue":"Today among ourselves → today versus tomorrow."},{"k":"for","rows":[{"l":"Poor depend on nature","t":"Forests, fisheries and groundwater feed the poor, so protecting them is pro-poor."},{"l":"Climate education","t":"Educated citizens adopt green technology, linking SDG 4 with SDG 13."},{"l":"Green jobs","t":"Renewables, recycling and restoration are labour-intensive."},{"l":"Clean cooking","t":"PM Ujjwala cuts indoor pollution and pressure on forests."},{"l":"Decentralised energy","t":"PM-KUSUM solar pumps give remote farmers energy and income."},{"l":"Climate justice","t":"Under CBDR-RC, those who emitted most should pay most."},{"l":"Lifestyle change","t":"Mission LiFE promotes sustainable everyday choices."}],"q":"How can inclusive growth and sustainability go together?","cue":"Nature feeds the poor → education → green jobs → clean cooking → solar pumps → polluters pay → LiFE."},{"k":"against","rows":[{"l":"Debt for the future","t":"Subsidies and borrowing today become debt tomorrow."},{"l":"Coal jobs vs climate","t":"Coal-belt livelihoods and energy access clash with climate goals."},{"l":"Infrastructure vs ecology","t":"Rural roads and housing cause deforestation in the short term."},{"l":"Patented clean-tech","t":"Developing nations need cheap technology, but clean-tech is heavily patented."},{"l":"Unfair burden","t":"Denying poor nations industry makes them pay for rich nations' emissions."}],"q":"Why do inclusive growth and sustainability not always go together?","cue":"Debt tomorrow → coal jobs → concrete vs forest → patents → unfair burden."},{"k":"value","rows":[{"l":"Green GDP","t":"National statistics should fully count natural capital."},{"l":"Just transition","t":"Reskill fossil-fuel workers for renewable jobs."},{"l":"Circular economy","t":"Reuse and recycle resources on a large scale."},{"l":"Climate finance","t":"Push for real finance and technology transfer at the UNFCCC."},{"l":"Green premium subsidies","t":"Target subsidies to cover the extra cost of clean options."}],"q":"How can India reconcile equity today with equity tomorrow?","cue":"Green GDP → just transition → circular economy → climate finance → green subsidies."}]},{"id":"GS32-csr","line":"GS3.2","part":"","name":"CSR","own":true,"cards":[{"k":"define","text":"A legal requirement under Section 135 of the Companies Act, 2013, for eligible companies to spend at least [[2%]] of their average net profits on social development activities.","q":"What is the CSR mandate?"},{"k":"for","rows":[{"l":"Private capital","t":"CSR spending was about [[₹34,900 crore]] in FY24."},{"l":"Corporate efficiency","t":"Company project skills speed up schools, hospitals and local infrastructure."},{"l":"Ring-fenced funds","t":"Unspent CSR money must go to designated funds, not profits."},{"l":"ESG governance","t":"Firms weigh social and environmental duties alongside profit."},{"l":"Shares the state's load","t":"CSR funds local projects without burdening the budget."}],"q":"How does mandatory CSR help development?","cue":"Capital → efficiency → ring-fencing → ESG → shared load."},{"k":"against","rows":[{"l":"Fragmented spending","t":"Small scattered projects replace long-term investment."},{"l":"Capacity gap","t":"Companies lack grassroots expertise on social problems."},{"l":"Tick-box compliance","t":"Firms treat CSR as an accounting exercise."},{"l":"Conflict of interest","t":"Promoter-linked trusts risk favouritism and weak accountability."},{"l":"Regional skew","t":"Funds cluster near company hubs, leaving backward districts out."}],"q":"Where does CSR fall short?","cue":"Fragmented → no expertise → tick-box → conflict of interest → regional skew."},{"k":"value","rows":[{"l":"Backward districts first","t":"Reward CSR spending in aspirational districts."},{"l":"Pool funds","t":"Combine company funds for large hospitals, schools and skill centres."},{"l":"Social impact audits","t":"Measure real outcomes, not just money spent."},{"l":"CSR dashboard","t":"Track spending and outcomes digitally to stop diversion."},{"l":"National priorities","t":"Align CSR projects with local needs and national goals."},{"l":"Mains line","t":"CSR must move from mandatory spending to measurable social investment."}],"q":"How can CSR become real social investment?","cue":"Backward districts → pool → audit → dashboard → align."},{"k":"data","rows":[{"l":"Coverage","t":"About 27,000 companies spent on CSR in FY24."},{"l":"Follows headquarters","t":"Maharashtra alone gets about [[17%]] of CSR spending."},{"l":"Underspending","t":"About [[5,700]] companies spent less than required."}],"q":"What data and examples back up CSR?"},{"k":"data","q":"Which companies must spend on CSR? (any one test)","rows":[{"l":"Net worth","t":"Above [[₹500 crore]]."},{"l":"Turnover","t":"Above [[₹1,000 crore]]."},{"l":"Net profit","t":"Above [[₹5 crore]]."}],"cue":"Worth, turnover or profit: any one."}]},{"id":"GS32-gini-coefficient","line":"GS3.2","part":"","name":"Gini coefficient","own":true,"cards":[{"k":"define","text":"A statistical indicator derived from the Lorenz Curve that mathematically quantifies economic inequality within a population, ranging from 0 (representing perfect equality) to 1 (representing absolute inequality where one person holds all wealth).","q":"What is meant by Gini coefficient?"},{"k":"for","rows":[{"l":"Single benchmark","t":"One number compares inequality across countries and over time."},{"l":"Tests welfare impact","t":"Gini before and after taxes shows whether policy cuts inequality."},{"l":"Tracks growth's spread","t":"It shows whether growth benefits all or only the rich."},{"l":"Maps disparities","t":"Separate income, wealth and consumption Ginis show where inequality sits."},{"l":"Targets regions","t":"State and rural–urban Ginis show where welfare is needed."}],"q":"Why is the Gini coefficient useful?","cue":"Compare → test welfare → track growth → map → target."},{"k":"against","rows":[{"l":"Equal poverty scores zero","t":"A country where all are equally poor gets a Gini of zero."},{"l":"Missing rich","t":"Surveys underreport the income and wealth of the very rich."},{"l":"Hides wealth","t":"The top 1% hold [[40.1%]] of wealth even as consumption Gini falls."},{"l":"Same number, different shapes","t":"Very different distributions can give the same Gini."},{"l":"Blind to quality","t":"It ignores gaps in health, education, caste and gender."}],"q":"What does the Gini coefficient miss?","cue":"Equal poverty scores zero → rich missing → wealth hidden → shapes differ → quality invisible."},{"k":"value","rows":[{"l":"Palma ratio","t":"Divide the top 10% income share by the bottom 40%."},{"l":"Theil index","t":"It splits inequality into between-group and within-group parts."},{"l":"Use tax data","t":"Combine surveys with tax data to capture top incomes."},{"l":"Wealth surveys","t":"Measure asset concentration separately from consumption."},{"l":"Break down by group","t":"Publish inequality by state, gender and caste."},{"l":"Before and after welfare","t":"Compare inequality before and after taxes and transfers."},{"l":"HCES 2023-24","t":"Consumption Gini fell to [[0.237]] in rural and 0.284 in urban areas."},{"l":"Remember","t":"A falling consumption Gini does not mean wealth inequality fell."}],"q":"How can inequality be measured better?","cue":"Palma → Theil → tax data → wealth surveys → group data → before and after."},{"k":"data","rows":[{"l":"Consumption Gini","t":"It fell from 28.8 in 2011-12 to [[25.5]] in 2022-23."},{"l":"Caveat","t":"Consumption data understate inequality compared with income or wealth."}],"q":"What do India’s Gini numbers show?"}]},{"id":"GS32-poverty","line":"GS3.2","part":"","name":"Poverty and its measurement","own":true,"cards":[{"k":"define","q":"How is poverty measured?","text":"By a money line (consumption per head below a set level) or by multidimensional deprivation (NITI Aayog MPI: health, education, living standards)."},{"k":"for","q":"What shows poverty has fallen?","rows":[{"l":"Extreme poverty down","t":"About [[75 million]] people were extremely poor in 2022-23."},{"l":"Consumption up","t":"Average rural spending per person reached [[₹4,122]] a month in 2023-24."},{"l":"State models","t":"Kerala's poverty-eradication model shows what states can do."}],"cue":"Extreme poverty down → consumption up → state models."},{"k":"against","q":"How do the numbers hide deprivation?","rows":[{"l":"Measurement paradox","t":"About [[81 crore]] people get free grain, yet official poverty is single-digit."},{"l":"Hunger","t":"Child wasting is about [[19%]], the highest in South Asia."},{"l":"Vulnerability","t":"Millions just above the poverty line can fall back after one shock."}],"cue":"Free-grain paradox → hunger → vulnerability."}]},{"id":"GS32-capitalism","line":"GS3.2","part":"","name":"Capitalism (Marx’s critique)","own":true,"cards":[{"k":"define","text":"An economic system in which productive assets are privately owned, workers earn wages, and goods are produced mainly for profit.","q":"What is capitalism?"},{"k":"for","rows":[{"l":"Ownership of production","t":"A few capitalists own the means of production, and workers sell labour."},{"l":"Surplus value","t":"Workers create more value than their wages, and owners keep the surplus."},{"l":"Capital accumulation","t":"Reinvested profits concentrate wealth in fewer hands."},{"l":"Overproduction crisis","t":"Goods go unsold when workers cannot afford them."},{"l":"Class conflict","t":"Owners want profit and workers want wages, so their interests clash."}],"q":"What is Marx’s critique of capitalism?","cue":"Few own → surplus taken → wealth piles up → too much made → classes clash."},{"k":"against","rows":[{"l":"Welfare capitalism","t":"Labour laws, unions and welfare states eased its contradictions."},{"l":"Creative destruction","t":"Profit drives innovation and investment, which Marx understated."},{"l":"Value is not only labour","t":"Prices also depend on demand and scarcity."},{"l":"Resilience","t":"Capitalism has survived crises by adapting through regulation."},{"l":"History is not fixed","t":"Its contradictions do not automatically lead to communism."}],"q":"What are the counter-arguments to Marx’s critique?","cue":"Welfare tamed it → innovation → value isn't only labour → it adapts → history isn't fixed."},{"k":"value","rows":[{"l":"Decent work","t":"Ensure fair wages, collective bargaining and job security."},{"l":"Redistribution","t":"Use progressive taxes and targeted transfers."},{"l":"Social protection floor","t":"Give everyone healthcare, pensions and unemployment cover."},{"l":"Economic democracy","t":"Promote cooperatives and employee ownership."},{"l":"Competition law","t":"Stop monopolies from exploiting workers and consumers."},{"l":"Conclusion","t":"Marx explains inequality and crises well, but communism is not inevitable."}],"q":"What is the way forward on capitalism’s problems?","cue":"Decent work → redistribute → protect → share ownership → curb monopolies."}]},{"id":"GS32-data-x","line":"GS3.2","part":"","name":"Inclusive growth: key data","own":true,"cards":[{"k":"data","title":"Numbers","q":"What are the key numbers?","rows":[{"l":"Mental health treatment gap","t":"The gap is [[70–92%]]. (ES 2025-26)"}]},{"k":"data","title":"Lines","q":"Which lines can you quote?","rows":[{"l":"Social connection","t":"Suicide rates are lower where in-person social connection is higher. (ES 2025-26)"}]},{"k":"data","title":"Government steps and committees","q":"Which government steps and committees apply?","rows":[{"l":"Mental health institutes","t":"Ranchi and Tezpur become Regional Apex Institutions. (Budget 2026-27)"}]}]},{"id":"GS33-capex","line":"GS3.3","part":"","name":"Government capex","own":true,"cards":[{"k":"define","text":"Government expenditure that creates durable physical or financial assets (infrastructure, machinery, equity investments) or reduces long-term macro-liabilities.","q":"What is government capital expenditure?"},{"k":"for","rows":[{"l":"Fiscal multiplier","t":"Each rupee of capex generates more output downstream."},{"l":"Capital efficiency","t":"Infrastructure lowers the ICOR, so capital is used better."},{"l":"De-risking private firms","t":"Public investment takes early risk off private investors."},{"l":"Core sector demand","t":"Capex lifts cement, steel and heavy electricals."},{"l":"Twin balance sheet advantage","t":"Healthy banks and firms can now follow public investment."}],"q":"How does government capex crowd in private investment?","cue":"Multiplier → ICOR → de-risk → core sectors → clean balance sheets."},{"k":"against","rows":[{"l":"Crowding out","t":"Heavy government borrowing raises interest rates for private firms."},{"l":"Consumption drives capex","t":"Cutting welfare for capex weakens demand, so firms do not expand."},{"l":"Import leakage","t":"High-tech capex relies on imported capital goods."},{"l":"Execution lag","t":"Regulatory delays slow projects down."}],"q":"Why can government capex crowd out, or fail to crowd in, private investment?","cue":"Crowding out → weak demand → imports → delays."},{"k":"value","rows":[{"l":"Capex FY27","t":"Capex is [[₹12.2 lakh crore]], about 3.1% of GDP. (Budget 2026-27)"},{"l":"Effective capex","t":"Including capital grants, it is [[₹17.2 lakh crore]]. (Budget 2026-27)"},{"l":"Priorities","t":"Roads, railways and defence take nearly two-thirds. (Budget 2026-27)"},{"l":"Before the pandemic","t":"Effective capex rose to about [[4%]] of GDP in FY25 from 2.7%. (ES 2025-26)"}],"q":"How big is the capex push?"}]},{"id":"GS33-output-based-budget","line":"GS3.3","part":"","name":"Output-outcome budgeting","own":true,"cards":[{"k":"define","text":"A budgeting approach that links government spending (outlays) to measurable physical deliverables (outputs) and actual developmental improvements (outcomes), ensuring that public expenditure is judged by results rather than merely money spent.","q":"What is output-outcome budgeting?"},{"k":"list","rows":[{"l":"Outlay","t":"The money spent."},{"l":"Output","t":"What gets built, like a school."},{"l":"Outcome","t":"What changes, like better learning."},{"l":"OOMF","t":"It covers [[172]] major schemes from 2026-27, replacing the Outcome Budget."}],"q":"How do outlay, output and outcome differ, and what is OOMF?","cue":"Money → thing built → life changed."},{"k":"for","rows":[{"l":"Accountability","t":"The OOMF is placed before Parliament with the Budget."},{"l":"Data-driven allocation","t":"Money follows evidence of results."},{"l":"Implementation efficiency","t":"Tracking results improves delivery."},{"l":"Competitive federalism","t":"The Aspirational Districts Programme ranks districts on [[49]] indicators."}],"q":"Why budget for outcomes?","cue":"Account → allocate → implement → compete."},{"k":"against","rows":[{"l":"Capacity gaps","t":"Departments lack staff, timely funds and monitoring."},{"l":"Many causes","t":"Outcomes depend on many factors beyond one scheme."},{"l":"Poor data","t":"Weak data make outcomes hard to measure."},{"l":"Goodhart's law","t":"Chasing numbers replaces better service."},{"l":"Coordination","t":"Malnutrition and poverty need many ministries working together."}],"q":"What limits outcome budgeting?","cue":"Capacity → many causes → poor data → Goodhart → coordination."},{"k":"value","rows":[{"l":"Third-party checks","t":"Social audits by Gram Sabhas test official claims."},{"l":"Better statistics","t":"Build district-level, interoperable data."},{"l":"Quality indicators","t":"Add indicators that show gains for vulnerable groups."},{"l":"Scale the ADP model","t":"Use district dashboards that fix responsibility."},{"l":"Reward performance","t":"Shift budgets towards schemes that deliver."},{"l":"Mains line","t":"Move from spending money to showing results."}],"q":"How can outcome budgeting be made to work?","cue":"Verify → better data → quality → ADP → reward."}]},{"id":"GS33-frbm","line":"GS3.3","part":"","name":"FRBM","own":true,"cards":[{"k":"define","text":"A law that limits government borrowing and deficits to maintain fiscal discipline, control public debt and protect future generations from excessive debt.","q":"What is the FRBM framework?"},{"k":"for","rows":[{"l":"Fiscal consolidation","t":"The fiscal deficit fell from 9.2% in FY21 to [[4.8%]] in FY25."},{"l":"Credit rating","t":"S&P upgraded India to BBB in 2025, the first in [[18 years]]."},{"l":"Crowding in","t":"Less government borrowing leaves more savings for private investment."},{"l":"Intergenerational equity","t":"It stops today's borrowing from burdening future generations."},{"l":"Supports monetary policy","t":"Lower deficits ease inflation pressure."}],"q":"Why does fiscal discipline under FRBM matter?","cue":"Consolidation → rating → crowding in → future generations → monetary help."},{"k":"against","rows":[{"l":"Debt overhang","t":"General government debt is about [[81%]] of GDP."},{"l":"Pro-cyclical cuts","t":"Rigid targets force capex cuts in downturns."},{"l":"Off-budget borrowing","t":"Borrowing through PSUs hides the true burden."},{"l":"No room for shocks","t":"Fixed limits restrict the response to recessions and pandemics."},{"l":"Welfare squeeze","t":"Over-tight consolidation cuts health, education and social spending."}],"q":"What are the problems with rigid FRBM targets?","cue":"Debt → pro-cyclical → hidden borrowing → no room for shocks → welfare squeeze."},{"k":"value","rows":[{"l":"Fiscal council","t":"An independent council should audit forecasts, as the N.K. Singh Committee proposed."},{"l":"Debt anchor","t":"Cut central debt to about [[50%]] of GDP by FY31. (Budget 2026-27)"},{"l":"Escape clause","t":"Allow temporary relaxation in exceptional shocks."},{"l":"Quality spending","t":"Borrow for capex, not revenue spending."},{"l":"Off-budget transparency","t":"Report PSU borrowing and guarantees openly."},{"l":"Mains line","t":"Fiscal discipline means productive borrowing, not blind spending cuts."},{"l":"Old vs new target","t":"N.K. Singh proposed [[60%]] total debt, 40% Centre and 20% states."}],"q":"How should India’s fiscal rules evolve?","cue":"Council → debt anchor → escape clause → capex first → transparency."},{"k":"data","title":"Centre’s deficits (% of GDP)","rows":[{"l":"Fiscal deficit","t":"It falls from 4.8% of GDP in FY25 to [[4.3%]] in FY27."},{"l":"Revenue deficit","t":"It falls from 1.7% in FY25 to [[1.5%]] in FY27."},{"l":"Primary deficit","t":"It falls from 1.4% in FY25 to [[0.7%]] in FY27."},{"l":"Effective capex","t":"It rises from about 4% in FY25 to [[4.4%]] in FY27."}],"q":"What are the Centre's deficit numbers for FY25 to FY27 (% of GDP)?"},{"k":"data","rows":[{"l":"Public debt","t":"Union debt rose to [[₹180 lakh crore]], 52.1% of GDP, in FY26."},{"l":"Interest burden","t":"Interest takes about [[40%]] of revenue receipts."},{"l":"Committed spending","t":"About [[65%]] of revenue receipts go to salaries, pensions and interest."},{"l":"N.K. Singh Committee","t":"It made debt the anchor and a [[3%]] fiscal deficit the target."},{"l":"Escape clause limit","t":"Deviation was capped at [[0.5%]] of GDP for war or calamity."},{"l":"Current anchor","t":"The target is debt of [[50 ± 1%]] of GDP by 2031."}],"q":"What do the debt and interest numbers show?"},{"k":"diagram","q":"Draw the diagram for FRBM","g":{"dir":"LR","nodes":[["D","Fiscal deficit"],["B","Borrowing"],["S","Debt stock"],["I","Interest burden"],["C","Less room for capex"],["A","Anchor - debt 50 ± 1% of GDP by 2031"]],"edges":[["D","B",""],["B","S",""],["S","I",""],["I","C",""],["S","A",""]]}}]},{"id":"GS33-state-finances","line":"GS3.3","part":"","name":"State finances","own":true,"cards":[{"k":"define","text":"State finances refer to the revenue receipts, expenditure, borrowing and debt management of State governments, determining their fiscal capacity to deliver public services, invest in infrastructure and promote inclusive development.","q":"What is meant by state finances?"},{"k":"list","rows":[{"l":"Fiscal deficit","t":"States' deficit was [[3.3%]] of GDP in FY25."},{"l":"Debt","t":"States owe about [[28.1%]] of GDP."},{"l":"Borrowing limit","t":"States may borrow [[3%]] of GSDP, plus 0.5% for power reforms."}],"q":"Where do state finances stand?","cue":"Deficit → debt → limit."},{"k":"for","rows":[{"l":"Within limits","t":"States kept deficits within the Centre's borrowing ceiling."},{"l":"SASCI support","t":"50-year interest-free loans support state capex. (ES 2025-26)"},{"l":"Peer benchmarking","t":"NITI's Fiscal Health Index pushes states to compete."},{"l":"Bigger tax share","t":"States get [[41%]] of the divisible pool under the 16th FC."}],"q":"What is going right in state finances?","cue":"Within limits → SASCI → benchmarking → tax share."},{"k":"against","rows":[{"l":"Rising revenue deficit","t":"Revenue deficit nearly doubled to [[0.7%]] of GSDP in FY25."},{"l":"Fiscal rigidity","t":"Salaries, pensions, interest and cash transfers crowd out development."},{"l":"Slow capex","t":"Capex growth slowed to about [[10%]] in FY25."},{"l":"Market borrowing","t":"Heavy market borrowing raises interest-rate risk."},{"l":"Year-end rush","t":"Delays bunch spending into March."},{"l":"States must buck up","t":"Their borrowing raises the sovereign's cost of borrowing. (ES 2025-26)"},{"l":"Cash transfers","t":"Unconditional transfers swell revenue deficits and squeeze capex. (ES 2025-26)"}],"q":"What is weak in state finances?","cue":"Revenue deficit → rigidity → slow capex → market debt → March rush → costly borrowing → cash transfers."},{"k":"value","rows":[{"l":"Combined deficit","t":"17 major states ran a deficit of [[3.2%]] of GSDP in FY25."},{"l":"March rush","t":"March 2025 alone saw about [[30%]] of the year's capex."},{"l":"SASCI share","t":"SASCI funded over [[40%]] of the extra capex."},{"l":"FY26 shortfall","t":"Capex was [[2.2%]] of GSDP against 2.9% budgeted, and only 3 states met targets."},{"l":"Market borrowing","t":"It now funds about [[75–80%]] of states' deficits, up from 17%."},{"l":"Costlier borrowing","t":"India pays [[6.7%]] on 10-year bonds against Indonesia's 6.3%. (ES 2025-26)"},{"l":"16th Finance Commission","t":"States' real share of gross central tax is only about [[30–33%]]."},{"l":"Local body grants","t":"Rural local bodies get [[₹4.4 lakh crore]] for 2026-31, up 84%."}],"q":"What data show strain in state finances?"}]},{"id":"GS33-revenue-vs-capital-budget","line":"GS3.3","part":"","name":"Revenue vs capital budget","own":true,"cards":[{"k":"define","text":"The Union Budget has two accounts. Revenue account: revenue receipts (tax and non-tax) and revenue expenditure (interest, salaries, subsidies). Capital account: capital receipts (borrowing, disinvestment) and capital expenditure (capex, loans).","q":"How is the Union Budget split into revenue and capital accounts?"},{"k":"diagram","q":"Draw the diagram for Revenue vs capital budget","g":{"dir":"TD","nodes":[["B","Union Budget"],["R","Revenue account"],["C","Capital account"],["R1","Rev Receipts - tax, non-tax"],["R2","Rev Expenditure - interest, salaries, subsidies"],["C1","Capital Receipts - borrowing, disinvestment"],["C2","Capex - capex, loans"]],"edges":[["B","R",""],["B","C",""],["R","R1",""],["R","R2",""],["C","C1",""],["C","C2",""]]}}]},{"id":"GS33-fiscal-health-index","line":"GS3.3","part":"","name":"Fiscal Health Index","own":true,"cards":[{"k":"define","text":"A composite index developed by NITI Aayog to assess and compare the fiscal health of States based on revenue mobilisation, expenditure quality, fiscal prudence and debt sustainability.","q":"What is meant by Fiscal Health Index?"},{"k":"list","rows":[{"l":"Quality of expenditure"},{"l":"Revenue mobilisation"},{"l":"Fiscal prudence"},{"l":"Debt index"},{"l":"Debt sustainability"},{"l":"Ranking","t":"Odisha tops with [[67.8]], and Punjab is last."}],"q":"What five sub-indices make up the Fiscal Health Index, and who ranks where?","cue":"Spend well, raise revenue, be prudent, owe little, sustain it."},{"k":"for","rows":[{"l":"Competitive federalism","t":"Peer ranking pushes states to manage money better."},{"l":"Quality of spending","t":"It rewards capital spending, not just more spending."},{"l":"Early warning","t":"It flags fiscal stress in states like Punjab."},{"l":"Policy guidance","t":"It helps states find and fix weaknesses."}],"q":"Why is the Fiscal Health Index useful?","cue":"Compare → reward quality → warn early → guide."},{"k":"against","rows":[{"l":"Lagged data","t":"The first edition uses FY23 data."},{"l":"Mineral bias","t":"Mining royalties flatter states like Odisha."},{"l":"Hidden debt","t":"Off-budget borrowing and guarantees may be missed."},{"l":"No carrot or stick","t":"Rankings carry no financial reward or penalty."}],"q":"What are the limits of the Fiscal Health Index?","cue":"Old data, mineral bias, hidden debt, no carrot or stick."},{"k":"value","rows":[{"l":"Link to incentives","t":"Tie SASCI loans and Finance Commission grants to verified improvement."},{"l":"Annual updates","t":"Update it yearly using timely CAG data."},{"l":"Count hidden debt","t":"Include off-budget borrowing and guarantees."},{"l":"Adjust for context","t":"Account for differences in resources across states."},{"l":"Add outcomes","t":"Combine fiscal scores with service-delivery results."},{"l":"Mains line","t":"It must move from a ranking to incentive-backed reform."},{"l":"FHI 2026","t":"The second edition adds [[10]] North-Eastern and Himalayan states."}],"q":"How can the Fiscal Health Index be improved?","cue":"Incentivise → update yearly → count hidden debt → adjust for context → add outcomes."},{"k":"data","rows":[{"l":"Achievers","t":"Achiever states like Odisha combine high capex, revenue surplus and low interest."}],"q":"What data and examples back up Fiscal Health Index?"}]},{"id":"GS33-gender-budgeting","line":"GS3.3","part":"","name":"Gender budgeting","own":true,"cards":[{"k":"define","text":"A fiscal policy tool that examines government revenue and expenditure through a gender lens to address structural inequalities.","q":"What is meant by gender budgeting?"},{"k":"data","q":"What does the Gender Budget Statement 2026-27 show?","rows":[{"l":"Size","t":"The Gender Budget is [[₹5 lakh crore]], 9.4% of the Budget. (Budget 2026-27)"},{"l":"Coverage","t":"[[53]] ministries and departments report allocations."}]},{"k":"list","rows":[{"l":"Part A","t":"Fully women-specific schemes, [[21.5%]] of the total."},{"l":"Part B","t":"Schemes with 30–99% for women, [[72.5%]] of the total."},{"l":"Part C","t":"Schemes with under 30% for women, [[6%]] of the total."}],"q":"How is the Gender Budget Statement split into Parts A, B and C?","cue":"A = all for women (21.5%), B = partly for women (72.5%), C = a little for women (6%)."},{"k":"for","rows":[{"l":"Women-led development","t":"It builds women's human capital and leadership."},{"l":"Care economy","t":"Crèches, clean cooking and piped water cut women's unpaid work."},{"l":"Financial inclusion","t":"About [[60%]] of Mudra loan accounts belonged to women in 2024-25."},{"l":"Transparency","t":"Gender-wise tracking allows parliamentary scrutiny."}],"q":"Why does gender budgeting matter?","cue":"Women lead → care load falls → credit flows → spending is tracked."},{"k":"against","rows":[{"l":"Weak targeting","t":"[[72.5%]] sits in Part B, hiding the real benefit to women."},{"l":"Weak capacity","t":"Gender Budgeting Cells lack skills and monitoring."},{"l":"Gender-blind infrastructure","t":"Safe transport, lighting and sanitation get too little attention."},{"l":"After-the-fact accounting","t":"It is treated as accounting, not planning."},{"l":"One-size allocations","t":"Allocations ignore regional and social differences."}],"q":"What weakens gender budgeting in India?","cue":"Part B blur → weak cells → gender-blind infrastructure → accounting → one size."},{"k":"value","rows":[{"l":"Assess before budgeting","t":"Check the gender impact before finalising estimates."},{"l":"Benefit incidence","t":"Track who actually benefits instead of guessing Part B shares."},{"l":"Link to OOMF","t":"Track outcomes like women's jobs and assets."},{"l":"Better data","t":"Run regular Time Use Surveys and keep sex-wise beneficiary data."},{"l":"Go local","t":"Extend gender budgeting to states and panchayats."},{"l":"Women-friendly infrastructure","t":"Prioritise safe transport, childcare and sanitation."},{"l":"Mains line","t":"Women become active partners in growth, not passive beneficiaries."}],"q":"How can gender budgeting be strengthened?","cue":"Assess before → track benefit → link outcomes → collect data → go local → build for women."},{"k":"diagram","q":"Draw the diagram for Gender budgeting","g":{"dir":"TD","nodes":[["G","Gender budget statement"],["A","Part A - 100% for women, ≈21.5%"],["B","Part B - 30 to 99% for women, ≈72.5%"],["C","Part C - under 30% for women"]],"edges":[["G","A",""],["G","B",""],["G","C",""]]}}]},{"id":"GS33-gst","line":"GS3.3","part":"","name":"GST","own":true,"cards":[{"k":"define","text":"A destination-based indirect tax levied on the supply of goods and services at each stage of the supply chain, with Input Tax Credit (ITC) on taxes paid on inputs, ensuring taxation primarily on value addition.","q":"What is meant by GST?"},{"k":"list","rows":[{"l":"Introduced","t":"GST began on 1 July 2017 under the 101st Amendment."},{"l":"GST Council","t":"Article 279A set up the GST Council."},{"l":"GST 2.0","t":"Since September 2025 the main slabs are 5% and [[18%]], plus 40% for luxuries."},{"l":"Formalisation","t":"Registered taxpayers rose from about 60 lakh to [[1.7 crore]]."},{"l":"Collections","t":"Gross GST was [[₹2 lakh crore]] in September 2026."}],"q":"What are the basic facts of GST?","cue":"2017 → Article 279A → GST 2.0 → 1.7 crore taxpayers."},{"k":"for","rows":[{"l":"No cascading","t":"Input tax credit removes tax on tax and cuts costs."},{"l":"Formal tax base","t":"E-invoicing and e-way bills widen the tax base."},{"l":"One national market","t":"Inter-state tax barriers are gone."},{"l":"Simpler slabs","t":"GST 2.0 makes rates more predictable."},{"l":"Cooperative federalism","t":"The GST Council lets the Centre and states decide together."}],"q":"What has GST achieved?","cue":"No cascading → formal base → one market → simple slabs → shared decisions."},{"k":"against","rows":[{"l":"Blocked working capital","t":"Inverted duties and slow refunds lock up business funds."},{"l":"ITC mismatches","t":"Supplier non-compliance disrupts input tax credit."},{"l":"Incomplete base","t":"Petrol, electricity and alcohol remain outside GST."},{"l":"MSME burden","t":"Frequent returns and reconciliation cost small firms heavily."},{"l":"Less state autonomy","t":"States can no longer set these tax rates on their own."}],"q":"What are GST’s problems?","cue":"Blocked capital → ITC mismatch → fuel outside → MSME burden → state autonomy."},{"k":"value","rows":[{"l":"Bring fuel in","t":"Bring petrol and electricity under GST by consensus."},{"l":"Strengthen GSTAT","t":"Staff the tribunal's benches to settle disputes faster."},{"l":"MSME-friendly compliance","t":"Simplify returns and auto-fill invoices."},{"l":"Time-bound refunds","t":"Use automated checks and provisional refunds."},{"l":"Keep states on board","t":"Consult states and keep their revenue predictable."},{"l":"Mains line","t":"GST must become simpler and predictable without burdening MSMEs."}],"q":"How should GST evolve?","cue":"Bring fuel in → fix the tribunal → ease MSMEs → refund on time → keep states on board."},{"k":"data","rows":[{"l":"Gross GST","t":"Collections were about [[₹22.3 lakh crore]] in FY26."},{"l":"Kalidasa, Raghuvamsha","t":"The king taxed only for welfare, like the sun returning water as rain."},{"l":"Revenue-neutral rate","t":"The Arvind Subramanian Committee put it at about [[15%]]."},{"l":"GST compensation","t":"States were promised [[14%]] yearly revenue growth for five years."},{"l":"Compensation cess","t":"GST 2.0 abolished it except on tobacco."}],"q":"What do GST collections and committees tell you?"}]},{"id":"GS33-tax-expenditure","line":"GS3.3","part":"","name":"Tax expenditure","own":true,"cards":[{"k":"define","text":"Government revenue forgone through tax exemptions, deductions, rebates, credits and concessional rates, which act as indirect subsidies to encourage selected economic activities instead of providing direct budgetary expenditure.","q":"What is meant by tax expenditure?"},{"k":"for","rows":[{"l":"Targeted incentives","t":"It encourages housing, exports, R&D and savings."},{"l":"Easy delivery","t":"It needs no new scheme machinery."},{"l":"Crowds in investment","t":"Home-ownership breaks boost construction and jobs."},{"l":"Fast relief","t":"It cuts the tax burden quickly in a slowdown."},{"l":"Transparency","t":"The Budget discloses revenue forgone every year."}],"q":"Why use tax expenditure?","cue":"Target → deliver easily → crowd in → relieve fast → disclose."},{"k":"against","rows":[{"l":"Revenue loss","t":"It erodes revenue and fiscal space."},{"l":"Narrow base","t":"Exemptions shrink the tax base."},{"l":"Deadweight loss","t":"Revenue is lost even on investment that would happen anyway."},{"l":"Distorted choices","t":"It favours owning homes over renting them."},{"l":"Hidden spending","t":"It is less visible than direct spending."},{"l":"Regressive","t":"Deductions mostly help richer taxpayers."}],"q":"What is wrong with tax expenditure?","cue":"Revenue loss → narrow base → deadweight → distortion → hidden → regressive."},{"k":"value","rows":[{"l":"Cost-benefit reviews","t":"Evaluate each concession periodically."},{"l":"Sunset clauses","t":"Make tax concessions time-bound."},{"l":"Prune exemptions","t":"Remove redundant exemptions, as the new tax regime tries."},{"l":"Disclose by sector","t":"Show revenue forgone by sector and beneficiary."},{"l":"Direct support","t":"Use direct transfers where deductions miss the poor."}],"q":"How should tax expenditure be reformed?","cue":"Evaluate → expire → prune → disclose → pay directly."}]},{"id":"GS33-ltcg-and-ddt","line":"GS3.3","part":"","name":"LTCG and DDT","own":true,"cards":[{"k":"list","rows":[{"l":"LTCG","t":"Tax on profits from assets held long-term."},{"l":"DDT","t":"A tax on companies' dividends, abolished in 2020."},{"l":"Budget 2018-19","t":"LTCG on listed shares returned at [[10%]] above ₹1 lakh."},{"l":"Budget 2020-21","t":"DDT ended, and dividends are taxed at shareholders' slab rates."},{"l":"Budget 2024-25","t":"LTCG rose to [[12.5%]] above ₹1.25 lakh, and STCG to 20%."}],"q":"What are LTCG and DDT, and how has their taxation changed?","cue":"2018: LTCG back at 10% → 2020: DDT gone → 2024: LTCG 12.5% above ₹1.25 lakh."},{"k":"for","rows":[{"l":"Tax equity","t":"Capital gains enter the tax net as markets deepen."},{"l":"Tax neutrality","t":"Dividends are taxed at each shareholder's own slab rate."},{"l":"Simplification","t":"Budget 2024 set two holding periods and more uniform rates."}],"q":"What are the arguments for taxing LTCG and abolishing DDT?","cue":"Equity → neutrality → simplicity."},{"k":"against","rows":[{"l":"Higher dividend tax","t":"Rich shareholders may pay more on dividends."},{"l":"Investment disincentive","t":"Lower post-tax returns may deter retail investors."},{"l":"Lock-in effect","t":"Investors delay sales to defer tax, cutting liquidity."},{"l":"Complexity","t":"Grandfathering and asset-wise rules complicate compliance."},{"l":"Policy uncertainty","t":"Frequent rate changes hurt investor confidence."}],"q":"What are the arguments against the LTCG and DDT changes?","cue":"Dividend tax → disincentive → lock-in → complexity → uncertainty."}]},{"id":"GS33-share-buyback-tax-budget-2026-27","line":"GS3.3","part":"","name":"Share buyback tax (Budget 2026-27)","own":true,"cards":[{"k":"define","text":"A tax regime under which proceeds from company share buybacks are taxed as capital gains in shareholders' hands after deducting acquisition cost, with an additional tax on promoters to prevent tax arbitrage.","q":"How are share buybacks taxed from April 2026?"},{"k":"list","rows":[{"l":"Before Oct 2024","t":"The company paid the tax, and shareholders were mostly exempt."},{"l":"Oct 2024 to Mar 2026","t":"The whole buyback amount was taxed as a dividend."},{"l":"From April 2026","t":"Only the gain is taxed as capital gains, plus a promoter levy. (Budget 2026-27)"},{"l":"Non-promoters","t":"They pay normal capital gains rates."},{"l":"Corporate promoters","t":"They pay an effective [[22%]]."},{"l":"Other promoters","t":"They pay an effective [[30%]]."}],"q":"How has buyback taxation changed since 2024?","cue":"Company paid → whole receipt as dividend → only the gain, with a promoter top-up."},{"k":"for","rows":[{"l":"Taxes only gains","t":"Shareholders selling at a loss are no longer taxed on the full receipt."},{"l":"Stops promoter arbitrage","t":"Promoters cannot use buybacks to pay less tax than on dividends."},{"l":"Returns surplus cash","t":"Firms can return idle cash to shareholders."},{"l":"Simpler computation","t":"One capital gains calculation replaces the old split treatment."}],"q":"Why is the new buyback tax fairer?","cue":"Tax only gains → stop promoter arbitrage → return surplus cash → one simple computation."},{"k":"against","rows":[{"l":"Promoters pay more","t":"An effective rate of up to [[30%]] may deter promoters."},{"l":"Distorted payouts","t":"Firms may prefer dividends or sit on cash."},{"l":"Hard cost calculation","t":"Bonus shares and ESOPs complicate the acquisition cost."},{"l":"Changing rules","t":"Changes in 2019, 2024 and 2026 hurt predictability."},{"l":"Unequal treatment","t":"Similar gains face different rates for promoters."}],"q":"What are the problems with the new buyback tax?","cue":"Promoters pay more → payouts distorted → cost hard to compute → rules keep changing → unequal rates."},{"k":"value","rows":[{"l":"Stable policy","t":"Keep payout taxation predictable."},{"l":"Clear promoter definition","t":"Match the tax and SEBI definitions."},{"l":"Automated reporting","t":"Feed depository data into the AIS to compute costs."},{"l":"Balanced anti-abuse rules","t":"Stop promoter avoidance without penalising genuine restructuring."},{"l":"Impact reviews","t":"Check the effects on minority shareholders and liquidity."},{"l":"Mains line","t":"Protect minority shareholders, stop arbitrage and allow efficient use of capital."}],"q":"How should buyback taxation be handled?","cue":"Stability → definition → automation → balance → review."}]},{"id":"GS33-inflation-management","line":"GS3.3","part":"","name":"Inflation management","own":true,"cards":[{"k":"data","q":"Where does inflation stand now?","rows":[{"l":"Retail inflation","t":"CPI inflation was [[6.1%]] in October 2026, with food at 8.9%."},{"l":"Target","t":"The RBI targets [[4%]] inflation, give or take 2%."}]},{"k":"list","rows":[{"l":"Monetary policy","t":"The RBI's MPC sets the repo rate."},{"l":"Fiscal policy","t":"Spend less when demand is high, more when it is low."},{"l":"Supply measures","t":"Farm policy and infrastructure ease supply shortages."},{"l":"Exchange rate","t":"Forex intervention controls import prices."}],"q":"What tools manage inflation in India?","cue":"Money → budget → supply → rupee.","title":"Tools"},{"k":"against","rows":[{"l":"Supply-driven inflation","t":"About [[45%]] of CPI responds to supply, not interest rates."},{"l":"Growth trade-off","t":"Fighting inflation can slow growth."},{"l":"Food","t":"Food has a small share but an outsized impact."},{"l":"Imported shocks","t":"Oil and supply chains bring inflation from abroad."},{"l":"Track record","t":"The MPC missed [[11]] of 18 targets in 2022."}],"q":"Why is inflation hard to manage in India?","cue":"Supply shocks → growth trade-off → food → oil → missed targets."}]},{"id":"GS33-zero-based-budgeting-zbb","line":"GS3.3","part":"","name":"Zero-Based Budgeting (ZBB)","own":true,"cards":[{"k":"define","text":"A budgeting technique in which every departmental activity and expenditure must be justified afresh from a zero base during each budget cycle, rather than automatically carrying forward previous allocations.","q":"What is meant by Zero-Based Budgeting (ZBB)?"},{"k":"data","q":"What was India’s experience with zero-based budgeting?","rows":[{"l":"Introduced","t":"It was tried in the 1987-88 Union Budget."},{"l":"Result","t":"The 1990 Lal Committee found it saved little."}]},{"k":"for","rows":[{"l":"Rationalisation","t":"It removes obsolete and overlapping schemes."},{"l":"Fiscal headroom","t":"Cutting waste frees money for capex."},{"l":"No incremental inertia","t":"It stops automatic increases and the March rush."},{"l":"Accountability","t":"Departments must justify every rupee with cost-benefit analysis."}],"q":"Why adopt zero-based budgeting?","cue":"Prune → free space → end inertia → justify."},{"k":"against","rows":[{"l":"Fiscal rigidity","t":"Committed spending leaves little to review."},{"l":"Heavy workload","t":"Reviewing everything yearly needs data and trained staff."},{"l":"Poor data","t":"Fragmented spending data hamper cost comparisons."},{"l":"Bureaucratic resistance","t":"Departments resist giving up allocations."},{"l":"Hurts long-term investment","t":"Short-term reviews may cut education and health investment."}],"q":"Why is zero-based budgeting hard to implement?","cue":"Rigidity → workload → poor data → resistance → long-term harm."},{"k":"value","rows":[{"l":"Rolling reviews","t":"Review selected schemes in cycles, not all every year."},{"l":"Sunset clauses","t":"Renew schemes only after independent evaluation."},{"l":"Link to OOMF","t":"Pair upfront justification with outcome tracking."},{"l":"PFMS analytics","t":"Use PFMS data to find overlaps and compare costs."},{"l":"Protect core investment","t":"Shield welfare, human capital and green spending."},{"l":"Mains line","t":"Spending should follow present priorities, not past allocations."}],"q":"How can zero-based budgeting be made practical?","cue":"Rolling reviews → sunset clauses → link to OOMF → PFMS analytics → protect core investment."}]},{"id":"GS33-government-borrowing-and-rollover-risk","line":"GS3.3","part":"","name":"Government borrowing and rollover risk","own":true,"cards":[{"k":"define","text":"The risk that maturing government debt must be repaid by borrowing afresh, possibly at higher rates.","q":"What is rollover risk?"},{"k":"list","q":"How does the government manage rollover risk?","rows":[{"l":"Longer maturity","t":"New debt matures in about [[19 years]] on average."},{"l":"Switches and buybacks","t":"Bonds near maturity are swapped for longer ones. (ES 2025-26)"},{"l":"Instruments","t":"Dated securities for the long term, and T-bills up to 364 days."}],"cue":"Longer maturity → switches → instruments."}]},{"id":"GS33-just-in-time-jit-fund-release","line":"GS3.3","part":"","name":"Just-in-Time (JIT) fund release","own":true,"cards":[{"k":"define","text":"Releasing funds only when expenditure is incurred, not in bulk (credit-push to debit-pull), to improve public spending efficiency.","q":"What is Just-in-Time fund release?"},{"k":"list","q":"How is Just-in-Time fund release implemented?","rows":[{"l":"Centrally Sponsored Schemes","t":"Funds flow through SNA-SPARSH."},{"l":"Central Sector schemes","t":"Funds flow through the TSA. (ES 2025-26)"}],"cue":"CSS → SNA-SPARSH, Central Sector → TSA."}]},{"id":"GS33-nudge","line":"GS3.3","part":"","name":"NUDGE (Income Tax Department)","own":true,"cards":[{"k":"define","text":"The Income Tax Department’s data-analytics approach (Non-intrusive Usage of Data to Guide and Enable) of alerting taxpayers to mismatches in their returns so they correct them voluntarily, before penal action.","q":"What is meant by NUDGE (Income Tax Department)?"}]},{"id":"GS33-revenue-deficit","line":"GS3.3","part":"","name":"Revenue deficit","own":true,"cards":[{"k":"define","text":"The excess of government revenue expenditure over revenue receipts. Revenue Deficit = Revenue Expenditure - Revenue Receipts","q":"What is meant by revenue deficit?"}]},{"id":"GS33-fiscal-deficit","line":"GS3.3","part":"","name":"Fiscal deficit","own":true,"cards":[{"k":"define","text":"The excess of total government expenditure over total non-debt receipts. Fiscal Deficit = Total Expenditure - (revenue receipts + non debt creating capital receipts)","q":"What is meant by fiscal deficit?"}]},{"id":"GS33-primary-deficit","line":"GS3.3","part":"","name":"Primary deficit","own":true,"cards":[{"k":"define","text":"Fiscal deficit minus interest payments. Memory trick: revenue deficit = daily expenses; fiscal deficit = total borrowing; primary deficit = fresh borrowing burden excluding interest.","q":"What is meant by primary deficit?"}]},{"id":"GS33-inflation","line":"GS3.3","part":"","name":"Inflation","own":true,"cards":[{"k":"define","text":"A sustained increase in the general price level of goods and services in an economy, resulting in a decline in the purchasing power of money.","q":"What is meant by inflation?"}]},{"id":"GS33-budget-2026-27","line":"GS3.3","part":"","name":"Union Budget 2026-27","own":true,"cards":[{"k":"list","title":"Macro & Fiscal","q":"What did Budget 2026-27 announce on macro and fiscal?","rows":[{"l":"Presented","t":"The Budget was presented on 1 February 2026."},{"l":"Capex","t":"Capex is [[₹12.2 lakh crore]], up 11.5%."},{"l":"Effective capex","t":"It reaches [[₹17.2 lakh crore]], or 4.4% of GDP."},{"l":"Largest allocations","t":"Roads and railways get about [[₹2.9 lakh crore]] each."},{"l":"Nominal growth assumed","t":"The Budget assumes [[10%]] nominal GDP growth."},{"l":"Fiscal deficit","t":"It falls from 4.4% to [[4.3%]] of GDP."},{"l":"Debt anchor","t":"Central debt is to fall to [[55.6%]] of GDP in FY27."},{"l":"RBI surplus","t":"The RBI paid a record [[₹2.9 lakh crore]] in May 2026."},{"l":"Rural local bodies","t":"They get [[₹4.4 lakh crore]] over 2026-31."}]},{"k":"list","title":"Infrastructure","q":"What did Budget 2026-27 announce on infrastructure?","rows":[{"l":"City Economic Regions","t":"Each gets [[₹5,000 crore]] over 5 years, chosen in challenge mode."},{"l":"High-speed rail","t":"Seven corridors are proposed as growth connectors."},{"l":"Risk Guarantee Fund","t":"It covers risks in infrastructure projects."},{"l":"Infrastructure multiplier","t":"Each ₹1 adds [[₹2.5–3.5]] to GDP. (ES 2025-26)"},{"l":"National highways","t":"The network grew about [[60%]] since FY14 to 1.5 lakh km."},{"l":"Nuclear energy","t":"Customs exemption on nuclear imports runs to 2035 after the SHANTI Act."},{"l":"Data centres","t":"Tax holiday till 2047 for foreign cloud firms using Indian data centres."}]},{"k":"list","title":"Manufacturing & MSMEs","q":"What did Budget 2026-27 announce on manufacturing and msmes?","rows":[{"l":"ECMS","t":"The electronics components scheme gets [[₹40,000 crore]]."},{"l":"Manufacturing share","t":"It is about [[15–17%]] of GDP against 25–30% in South Korea."},{"l":"Legacy clusters","t":"[[200]] old industrial clusters will be revived."},{"l":"SME Growth Fund","t":"A [[₹10,000 crore]] fund gives equity to Champion SMEs."},{"l":"TReDS","t":"CPSEs must buy from MSMEs through TReDS so MSMEs get paid early."},{"l":"Biopharma SHAKTI","t":"[[₹10,000 crore]] over 5 years for biologics and biosimilars."},{"l":"Corporate bonds","t":"A market-making framework and Total Return Swaps on bonds."},{"l":"Total Return Swap","t":"One party gets a bond's full return without owning it."}]},{"k":"list","title":"Trade, Tariffs & Reforms","q":"What did Budget 2026-27 announce on trade, tariffs and reforms?","rows":[{"l":"Customs duty cuts","t":"Cuts target textiles, footwear, marine products, electronics and aircraft parts."},{"l":"Container manufacturing","t":"[[₹10,000 crore]] over 5 years to build containers at home."}]},{"k":"list","title":"Financial Markets & Taxation","q":"What did Budget 2026-27 announce on financial markets and taxation?","rows":[{"l":"Foreign investor limit","t":"The aggregate limit in listed equity rose from 10% to [[24%]]."},{"l":"Buyback tax","t":"Only the gain is now taxed, as capital gains."},{"l":"STT","t":"Securities transaction tax on futures and options went up."}]},{"k":"list","title":"Skills, Employment & Tourism","q":"What did Budget 2026-27 announce on mental health, skills and tourism?","rows":[{"l":"Mental health gap","t":"The treatment gap is [[70–92%]]."},{"l":"NIMHANS-2","t":"A second NIMHANS is proposed in North India."},{"l":"Regional apex institutes","t":"Ranchi and Tezpur institutes will be upgraded."},{"l":"Orange economy","t":"Tourism and the creative economy are treated as job creators."},{"l":"Hospitality institute","t":"A National Institute of Hospitality will be set up."},{"l":"Guide upskilling","t":"[[10,000]] guides at 20 iconic sites will be trained."},{"l":"Cultural destinations","t":"[[15]] archaeological sites, like Lothal, become experiential destinations."}]},{"k":"list","title":"New & Emerging Economy","q":"What did Budget 2026-27 announce on the new and emerging economy?","rows":[{"l":"Semiconductor Mission 2.0","t":"It moves from funding fabs to building the whole value chain."},{"l":"Rare-earth corridors","t":"Four coastal states will get dedicated rare-earth corridors."}]},{"k":"list","title":"Social Sector & Agriculture","q":"What did Budget 2026-27 announce on social sector and agriculture?","rows":[{"l":"University townships","t":"Five townships near industrial corridors will host universities and skill centres."},{"l":"Education allocation","t":"It rose about [[8.3%]] to ₹1.4 lakh crore."},{"l":"PM Research Chair","t":"[[₹200 crore]] to bring back researchers of Indian origin."},{"l":"Bharat-VISTAAR","t":"A multilingual AI platform gives farmers advice."},{"l":"High-value agriculture","t":"Programmes for sandalwood, cashew and cocoa."},{"l":"SHE-Marts","t":"Community shops help women's SHGs own enterprises."}]}]},{"id":"GS33-data-x","line":"GS3.3","part":"","name":"Government budgeting: key data","own":true,"cards":[{"k":"data","title":"Numbers","q":"What are the key numbers?","rows":[{"l":"Nominal growth assumed","t":"The Budget assumes [[10%]] nominal growth. (Budget 2026-27)"},{"l":"Direct taxes","t":"They reached [[58.8%]] of total taxes in FY25. (ES 2025-26)"}]},{"k":"data","title":"Lines","q":"Which lines can you quote?","rows":[{"l":"Arth, Srijan, Jeevan Shakti","t":"Economic power, creative power and life power."}]}]},{"id":"GS34-problems-of-agri-sector","line":"GS3.4","part":"Agriculture sector","name":"Problems of the agriculture sector","own":true,"cards":[{"k":"list","rows":[{"l":"Small farm holdings","t":"[[86%]] are small and marginal farmers"},{"l":"High employment dependence","t":"[[46%]] vs [[1.2%]] in the USA"},{"l":"Poor access to credit and inputs","t":""},{"l":"Lower productivity","t":"climate vulnerability, soil degradation, non-optimal water management and information gaps; e.g. rice yield 3.0 vs China 7"},{"l":"Poor farmers","t":""},{"l":"Underdeveloped food processing","t":"less than [[10%]] vs [[60–70%]] in the USA"},{"l":"Global vulnerabilities","t":"climate change and CBAM"},{"l":"Low farm mechanisation","t":"[[47%]] vs [[95%]] in the USA"},{"l":"Inadequate storage","t":"reason for [[30%]] of post-harvest loss"},{"l":"Wheat-rice supremacy","t":"why: MSP, lower risk, better R&D (wheat HD-3385 yield potential above 7 t/ha; rice ‘Kamala’ (DRR Dhan 100), India’s first genome-edited rice (2025), higher yield, matures [[≈20 days]] earlier); oilseeds have lower yield per hectare and are [[72%]] rainfed"}],"q":"What are the structural problems of Indian agriculture?","cue":"Land → labour → money → yield → farmer → processing → climate → machines → storage → crop choice: small plots crowded with workers, short of credit, low-yielding, so farmers stay poor; little is processed or stored, few machines, exposed to climate, and locked into wheat-rice."},{"k":"value","rows":[{"l":"Yield gap","t":"Yield: rice ≈2.9 t/ha (milled) or 4.1 t/ha (paddy) in India vs ≈7 t/ha (paddy) in China (compare like with like)"},{"l":"Post-harvest losses","t":"[[≈30–40%]] of fruits and vegetables are lost after harvest (notebook); poor transport accounts for a large share"},{"l":"Seeds","t":"only [[≈20%]] of farmers use certified seed (Agriculture notes, not traced)"}],"q":"What data show agriculture’s weaknesses?"},{"k":"value","title":"Ashok Dalwai Committee (2018): doubling farmers’ income","q":"What strategy did the Ashok Dalwai Committee propose for doubling farmers’ income?","rows":[{"l":"Crop Productivity","t":"Promote quality seeds, mechanisation, precision farming and agricultural extension"},{"l":"Livestock Productivity","t":"Improve animal breeds, veterinary services, fodder availability and dairy infrastructure"},{"l":"Resource-Use Efficiency","t":"Expand micro-irrigation, soil testing, balanced fertilisation and efficient input utilisation to reduce cultivation costs"},{"l":"Cropping Intensity","t":"Expand irrigation, short-duration crops and multiple cropping to increase annual farm output"},{"l":"High-Value Diversification","t":"Shift towards horticulture, fisheries, poultry, beekeeping and agroforestry for higher returns"},{"l":"Remunerative Price Realisation","t":"Strengthen FPOs, e-NAM, warehousing, cold chains and food processing to improve farmers' bargaining power and reduce distress sales"},{"l":"Non-Farm Employment","t":"Shift surplus agricultural labour towards agro-processing, rural MSMEs and allied rural services"}],"cue":"Crops → livestock → efficiency → intensity → diversification → price → non-farm jobs."}]},{"id":"GS34-achievements","line":"GS3.4","part":"Agriculture sector","name":"Achievements of Indian agriculture","own":true,"cards":[{"k":"list","rows":[{"l":"High contribution to economy","t":""},{"l":"Record Foodgrain Output","t":"[[376.6 MMT]] in 2025–26"},{"l":"Global Commodity Leadership","t":"India surpassed China to become the world’s largest rice producer and 2nd in wheat and sugarcane"},{"l":"Structural diversification into high-value allied sectors","t":"horticulture [[≈33%]] of agri GVA (largest producer of dry onions; 2nd in vegetables, fruits and potatoes, ES 2025-26); White Revolution 2.0 (dairy and livestock) [[over 30%]] of agri GVA; Blue Revolution (fisheries), supported by the Pradhan Mantri Matsya Sampada Yojana (PMMSY)"},{"l":"Global export","t":"Agri-exports grew [[70.5%]] between 2014–15 and 2025–26 to reach ≈USD [[54 billion]]"},{"l":"Growth","t":"[[4.4%]] five-year average (the highest decadal growth, [[4.5%]] for FY16-FY25); livestock [[7.1%]], fishing and aquaculture [[8.8%]], crops [[3.5%]] (ES 2025-26)"},{"l":"Market Modernization, Infrastructure & Collectivization","t":"e-NAM, Agriculture Infrastructure Fund (AIF), 10,000 FPOs by February 2026"},{"l":"Income Security, Institutional Credit & Risk Mitigation","t":"Direct Income Support: PM-KISAN, Expanded MSP Procurement, [[7.7 crore]] operative Kisan Credit Cards (KCC)"},{"l":"Digital public infrastructure","t":"AgriStack (farmer registries, geo-referenced plots, digital crop surveys); SVAMITVA; Namo Drone Didi"},{"l":"Green Transition","t":"Clean Energy & Biofuels Under PM-KUSUM"}],"q":"What has Indian agriculture achieved?","cue":"Contribute → produce a record → lead the world → diversify → export → grow → modernise markets → secure incomes → go digital → go green."},{"k":"data","rows":[{"l":"Share of national income","t":"Agriculture is nearly one-fifth of national income (ES 2025-26)."},{"l":"Foodgrain production","t":"[[3,577 lakh]] tonnes (2024-25) (ES 2025-26)"},{"l":"Soybean","t":"Asia’s second-largest producer after China; Madhya Pradesh is the ‘Soya State’. Soybean yields are below 2 t/ha in many districts (ES 2025-26)","unlikely":true},{"l":"Cotton","t":"India has the world’s largest cotton area, [[124.7 lakh]] ha [[≈39%]] of world area (2023-24); 2nd in production ([[325.2 lakh]] bales, [[≈23%]] of world) and 2nd largest consumer (Ministry of Textiles). Yield is low: [[436 kg]]/ha in 2023-24 (provisional); India ranks 36th in yield at [[447 kg]]/ha (Parliamentary Standing Committee on Labour, Textiles and Skill Development, 2022-23 data)"}],"q":"What data and schemes show agriculture’s progress?"},{"k":"data","rows":[{"l":"Why diversify","t":"agriculture is central to Viksit Bharat, with growth coming from allied sectors (livestock, fisheries) (ES 2025-26)"},{"l":"Floriculture is called a ‘sunrise industry’","t":"Agriculture notes","unlikely":true},{"l":"Five F vision (textiles)","t":"Five F vision of the textile sector: Farm, Fibre, Factory, Fashion, Foreign (see Cotton, Numbers)"},{"l":"Interventions the Survey covers","t":"seeds ([[6.9 lakh]] seed villages; national mission on high-yielding seeds); soil (Soil Health Card; national soil mapping); mechanisation (custom hiring centres); sustainable farming (Paramparagat Krishi Vikas Yojana); markets (post-harvest infrastructure; Agriculture Infrastructure Fund; Integrated Scheme for Agricultural Marketing; ATMA, the state extension scheme; MSP for 22 crops) (ES 2025-26)"},{"l":"PM Dhan-Dhaanya Krishi Yojana (Cabinet, July 2025)","t":"[[₹24,000 crore]] a year for six years from 2025-26; 100 districts chosen for low productivity, low cropping intensity and low credit; [[≈1.7 crore]] farmers; modelled on the Aspirational Districts Programme; converges 36 schemes for productivity, diversification, storage, irrigation and credit"}],"q":"What data and schemes show agriculture’s progress?"}]},{"id":"GS34-factors-influencing-cropping-patterns","line":"GS3.4","part":"Cropping pattern","name":"Factors influencing cropping patterns","own":true,"cards":[{"k":"list","rows":[{"l":"Climate /soil types","t":"eg. wheat & rice alluvial and millets in laterite"},{"l":"Input availability","t":"wheat and rice seeds have better R&D (wheat HD-3385 yield potential above 7 t/ha; rice ‘Kamala’) vs poor millet seed supply chains"},{"l":"Post harvest facilities","t":""},{"l":"Government policy","t":"FCI procured [[63.4 MT]] of wheat-rice in 2023-24 vs only [[1–3%]] of millets"},{"l":"Labour availability","t":"paddy needs 200–400 labour hours (better pay) vs 120 for millets"},{"l":"Export","t":"basmati rice enjoys strong exports"},{"l":"Pest and disease risk","t":"millets are naturally pest-resistant; rice faces stem borers and rising pesticide use"},{"l":"Market conditions","t":""},{"l":"Consumption factors","t":"share of cereals and pulses fell from [[52.9%]] (2011-12) to [[47%]] (2023-24); ES 2023 highlighted diversification to protein and perishables; rural FMCG demand grew [[8.4%]]"},{"l":"Capital and entrepreneurship","t":""}],"q":"What factors shape a region’s cropping pattern?","cue":"Nature → inputs → storage → policy → labour → export → pests → markets → diets → capital.","hook":"Soil, seed, store, state, sweat, sell abroad, spray, sell at home, stomach, savings."},{"k":"value","rows":[{"l":"Punjab paddy despite diversification","t":"final area for 2025 was a record [[32.5 lakh]] ha ([[32.4 lakh]] ha in 2024). Paddy covers more than [[90%]] of Punjab’s kharif area; the diversification pilot ([[12,000 ha]] moved to maize) and DSR incentives made little difference"},{"l":"Rice exports","t":"[[≈20.2 MMT]] worth a record [[≈$12.5 bn]] ([[≈₹1.05 lakh crore]]) in FY25; the volume record is still [[22.35 MMT]] (2022-23)","src":"DGCIS; APEDA"},{"l":"Examples","t":"Punjab paddy (record area despite pilots); Karnataka millets vs cotton"}],"q":"What examples show policy shaping cropping patterns?"}]},{"id":"GS34-pulses-edible-oils","line":"GS3.4","part":"Cropping pattern","name":"Pulses and edible oils","own":true,"cards":[{"k":"define","q":"What is the pulses and edible-oil paradox?","text":"India is the largest producer of pulses, yet it imports pulses and relies on imports for much of its edible oil."},{"k":"for","q":"What is the push to self-reliance?","rows":[{"l":"Missions","t":"Mission for Aatmanirbharta in Pulses (2025) and the National Mission on Edible Oils–Oilseeds (2024); MSP and PM-AASHA procurement for pulses and oilseeds"}],"cue":"Missions."},{"k":"against","q":"Why do imports persist?","rows":[{"h":"Markets","l":"Import bill","t":"pulses imports hit a record [[7.3 MT]] ([[≈$5.5 bn]]) in 2024-25 against the previous record of [[6.6 MT]] ([[$4.2 bn]]) in 2016-17, and fell back in FY26; edible oil imports doubled in 11 years, from [[7.9 MT]] (2013-14) to [[16.4 MT]] (2024-25)"},{"h":"Technology","l":"Low yields","t":"soybean yields below [[2 t/ha]] in many districts; India is Asia’s second-largest soybean producer after China; Madhya Pradesh is the ‘Soya State’ (ES 2025-26)"},{"h":"Equity and sustainability","l":"Climate","t":"in 15 of the 27 El Niño years (1951-2024), pulse acreage fell [[2–9%]] (NITI Aayog, ES 2025-26)"}],"cue":"Import bill → Low yields → Climate."}]},{"id":"GS34-millets-shree-anna","line":"GS3.4","part":"Cropping pattern","name":"Millets (Shree Anna)","own":true,"cards":[{"k":"define","text":"Millets are nutrient-rich, climate-resilient coarse cereals that require relatively low water and external inputs, making them suitable for sustainable agriculture, food security and nutritional security.","q":"What is meant by Millets (Shree Anna)?"},{"k":"list","rows":[{"l":"Global Leadership","t":"India is the world's largest millet producer, contributing [[38.4%]] of global production (FAO, 2023); production reached [[180.2 lakh]] tonnes in 2024–25."},{"l":"Research Institution","t":"ICAR–Indian Institute of Millets Research (IIMR), Hyderabad."},{"l":"International Year of Millets","t":"2023, declared by the UN."}],"q":"What are the key facts on millets?"},{"k":"for","rows":[{"l":"Climate Resilience, Low Input Agriculture","t":"Millets require less water, fertiliser and pesticides and tolerate drought and poor soils"},{"l":"Farmer Income","t":"Lower cultivation costs and reduced dependence on external inputs improve farm profitability;"},{"l":"Nutrition Security","t":"Rich in fibre, iron and calcium; dietary diversification is important as cereals and pulses' share in food expenditure declined from [[52.9%]] (2011–12) to [[47%]] (2023–24); ICMR (2024) recommends deriving around [[45%]] of calories
