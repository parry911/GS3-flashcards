<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GS3 Flashcards</title>
<style>
:root{
  --bg:#f4f2ed; --card:#ffffff; --ink:#1c1c1e; --ink2:#55565c; --ink3:#8a8b91;
  --line:#e6e3dc; --strip:#eeebe4; --strip2:#e4e0d7;
  --accent:#2f4bb5; --accent-soft:#e8ecfa;
  --for:#2b7a58; --for-soft:#e5f2ec;
  --against:#b0502a; --against-soft:#f8ebe4;
  --value:#6b4fae; --value-soft:#efeaf8;
  --define:#3f5568; --define-soft:#e8edf1;
  --data:#8a6516; --data-soft:#f6efdc;
  --say:#2f4bb5; --say-soft:#e8ecfa;
  --draw:#0f766e; --draw-soft:#e1f2ef;
  --fig:#1c1c1e; --fig-bg:#f3e7c4;
  --warn:#9a6a00;
  --good:#2b7a58; --bad:#b0502a;
  --shadow:0 1px 2px rgba(20,20,30,.05),0 8px 28px rgba(20,20,30,.07);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121315; --card:#1b1d20; --ink:#ececee; --ink2:#b3b5bb; --ink3:#7f828a;
    --line:#2b2e33; --strip:#24272c; --strip2:#2c3036;
    --accent:#8ea2f2; --accent-soft:#232a44;
    --for:#6cc79e; --for-soft:#1c2e27;
    --against:#ec9a76; --against-soft:#33231c;
    --value:#b7a2ee; --value-soft:#2a2440;
    --define:#a9bccb; --define-soft:#232a30;
    --data:#e2bd67; --data-soft:#30291a;
    --say:#8ea2f2; --say-soft:#232a44;
    --draw:#5fd0c0; --draw-soft:#1a2e2b;
    --fig:#f4ead0; --fig-bg:#4a3f22;
    --warn:#e2bd67;
    --good:#6cc79e; --bad:#ec9a76;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus{outline:none}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rw,.cue{scroll-margin-bottom:120px;scroll-margin-top:16px}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom))}

/* header */
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:4px 2px 14px}
header h1{font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:.2px;margin:0}
header .sub{font-size:13px;color:var(--ink3)}
.controls{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--strip);border-radius:10px;padding:3px;gap:2px;flex:1 1 auto}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 10px;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
select{font:inherit;font-size:13.5px;border:0;background:var(--strip);color:var(--ink);border-radius:10px;padding:8px 10px}
.progress{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink3);margin:2px 2px 0}
.bar{flex:1;height:5px;border-radius:5px;background:var(--strip);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .k{background:var(--good)} .bar .m{background:var(--bad)}
.legend b{color:var(--ink2);font-weight:600}

/* card */
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line);padding:22px 22px 18px;min-height:340px;position:relative;transition:transform .18s ease,opacity .18s ease}
.card.flipping{transform:scale(.985);opacity:.4}
.kicker{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:14px}
.front{display:flex;flex-direction:column;min-height:290px;cursor:pointer}
.front .ttl{font-family:var(--serif);font-size:30px;line-height:1.2;font-weight:600;margin:28px 0 14px}
.front .plain{font-family:var(--serif);font-size:24px;line-height:1.35;margin:26px 0 14px}
.front .plain:before{content:"“"} .front .plain:after{content:"”"}
.front .hint{margin-top:auto;font-size:13px;color:var(--ink3);display:flex;justify-content:space-between;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650;letter-spacing:.03em;padding:4px 10px;border-radius:999px;width:max-content}
.chip.define{color:var(--define);background:var(--define-soft)}
.chip.for{color:var(--for);background:var(--for-soft)}
.chip.against{color:var(--against);background:var(--against-soft)}
.chip.value{color:var(--value);background:var(--value-soft)}
.chip.data{color:var(--data);background:var(--data-soft)}
.chip.say{color:var(--say);background:var(--say-soft)}
.chip.draw{color:var(--draw);background:var(--draw-soft)}
.dg{position:relative;margin:6px 0 4px;padding:4px 0}
.dg .lv{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:0 0 30px}
.dg .lv:last-of-type{margin-bottom:4px}
.dg .nd{background:var(--card);border:1.5px solid var(--draw);color:var(--ink);border-radius:10px;padding:7px 11px;font-size:14px;line-height:1.3;text-align:center;max-width:46%;position:relative;z-index:1;animation:in .25s ease}
.dg .lv.one .nd{max-width:80%}
.dg .lv.many{flex-wrap:nowrap;gap:6px}
.dg .lv.many .nd{flex:1 1 0;max-width:none;font-size:12.5px;padding:6px 5px}
.dg svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.dg svg path{fill:none;stroke:var(--ink3);stroke-width:1.4}
.dg svg text{font-size:11px;fill:var(--ink2);font-family:var(--sans)}
.drawhint{font-size:12.5px;color:var(--ink3);margin:2px 0 10px}
.subtitle{font-size:14px;color:var(--ink2);margin-top:6px}
.topicname{font-size:13px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-top:22px}
.backhead .topicname{margin-top:4px}
.front .ttl.q{margin-top:8px;font-size:27px}
.draft{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.chiprow{display:flex;align-items:center;gap:8px;width:max-content}

.backhead{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.backhead .ttl{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.25}
.deftext{font-size:17px;line-height:1.6}

/* rows */
.rows{display:flex;flex-direction:column;gap:8px}
.rw{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:10px 12px;background:transparent;border:1px solid transparent;transition:background .2s}
.rw .n{flex:0 0 24px;height:24px;border-radius:50%;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;background:var(--strip2);color:var(--ink2);margin-top:1px;font-variant-numeric:tabular-nums}
.rw .body{flex:1;min-width:0}
.rw.s0{background:var(--strip);cursor:pointer}
.rw.s0 .body{height:24px;border-radius:6px;position:relative;overflow:hidden}
.rw.s0 .body:after{content:"";position:absolute;left:0;top:7px;height:10px;border-radius:5px;background:var(--strip2);width:var(--w,70%)}
.rw.s1{cursor:pointer;border-color:var(--line)}
.rw.s1 .more{margin-top:6px;height:8px;width:55%;border-radius:4px;background:var(--strip)}
.rw.s2{border-color:var(--line)}
.lbl{font-weight:650;font-size:16px;line-height:1.35;animation:in .22s ease}
.ln{font-size:15px;line-height:1.55;color:var(--ink2);margin-top:4px;animation:in .25s ease}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;animation:in .25s ease}
.src{font-size:11.5px;color:var(--ink3);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.unl{font-size:11.5px;color:var(--ink3);font-style:italic}
.fix{font-size:14.5px;margin-top:6px;color:var(--for);animation:in .25s ease}
.fix:before{content:"→ ";font-weight:700}
.note{font-size:12.5px;margin-top:6px;color:var(--warn);animation:in .25s ease}
.note:before{content:"⚑ "}
.fig{font-variant-numeric:tabular-nums;font-weight:650;color:var(--fig);background:var(--fig-bg);padding:0 4px;border-radius:4px;white-space:nowrap}
.rw.s0.next{outline:2px solid var(--accent-soft)}
@keyframes in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

.recall{font-size:12.5px;color:var(--ink3);margin:2px 2px 10px}
.cue{margin-top:16px;border-radius:12px;background:var(--accent-soft);padding:12px 14px;animation:in .35s ease}
.cue .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.cue .t{font-family:var(--serif);font-size:17px;line-height:1.45;margin-top:3px}
.cue .h{font-size:13px;letter-spacing:.04em;color:var(--ink2);margin-top:6px;font-weight:600}

/* say card back */
.term{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.2;margin:4px 0 8px;color:var(--say)}
.meaning{font-size:17px;line-height:1.55}
.exam{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.exam .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:4px}
.exam .t{font-size:16px;line-height:1.55}

/* action bar */
.actions{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
.actions .in{max-width:680px;margin:0 auto;display:flex;gap:6px}
.btn{white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;font-size:15px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--ink2);flex:0 0 auto}
.btn.primary{flex:1;background:var(--ink);color:var(--card);border-color:var(--ink)}
.btn.miss{flex:1;color:var(--bad)}
.btn.got{flex:1;color:var(--good)}
.btn:disabled{opacity:.35;cursor:default}
.btn kbd{font:inherit;font-size:11px;opacity:.5;margin-left:6px;font-weight:500}

.card.back{cursor:pointer}
.rw.s2{cursor:default}
.fliphint{margin-top:16px;font-size:12.5px;color:var(--ink3);text-align:center}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12px;color:var(--ink3);gap:8px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--ink3);text-decoration:underline;text-underline-offset:3px;font-size:12px;padding:4px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--card);font-size:13px;padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:.95}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:8;padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--card);border-radius:16px;padding:20px;max-width:360px;width:100%;box-shadow:var(--shadow)}
.modal h3{margin:0 0 6px;font-family:var(--serif)}
.modal p{margin:0 0 16px;color:var(--ink2);font-size:14.5px}
.modal .row{justify-content:flex-end}
.done{text-align:center;padding:30px 10px}
.done h2{font-family:var(--serif);margin:10px 0 6px}
.done p{color:var(--ink2);margin:0 0 20px}
.done .row{justify-content:center}
@media (max-width:520px){
  .btn kbd{display:none}
  .btn{padding:13px 10px}
  .btn.ghost{padding:13px 12px}
}
@media (max-width:420px){
  .front .ttl{font-size:26px}.front .plain{font-size:21px}.term{font-size:26px}
  .card{padding:18px 16px 16px}.seg button{padding:7px 6px;font-size:12.5px}
}

.selrow{display:flex;gap:8px}
.selrow select{flex:1 1 0;min-width:0;text-overflow:ellipsis}
.toggle{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;white-space:nowrap}
.toggle.on{background:var(--against-soft);color:var(--bad);border-color:transparent}
.toggle:disabled{opacity:.4;cursor:default}
.progress .legend{white-space:nowrap}
.sheet h3{margin:0 0 12px;font-family:var(--serif)}
.pl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.pl:first-of-type{border-top:0}
.pl .nm{font-size:14px;font-weight:600}
.pl .nm small{display:block;font-weight:400;color:var(--ink3);font-size:12px}
.pl .ct{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;text-align:right}
.pl .bar{grid-column:1 / -1}
.modal .box.wide{max-width:440px;max-height:82vh;overflow:auto}
.chip .ct{opacity:.7;font-weight:600}
.ktitle{font-size:13px;color:var(--ink2);margin-top:2px}
.rw .hd{font-size:11px;letter-spacing:.5px;text-transform:uppercase;font-weight:700;color:var(--against);margin-bottom:2px}
.rw.s0 .body.hb{height:auto}
.rw.s0 .body.hb:after{display:none}
.rw.s0 .body.hb .hd{margin:3px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="title">GS3 Flashcards</h1><span class="sub" id="subtitle"></span></header>
  <div class="controls">
    <div class="selrow">
      <select id="lineSel" aria-label="Syllabus line"></select>
      <select id="partSel" aria-label="Part"></select>
    </div>
    <div class="row">
      <div class="seg" id="typeSeg">
        <button data-v="all">All cards</button><button data-v="topic">Topic cards</button><button data-v="say">You want to say</button>
      </div>
    </div>
    <div class="row">
      <div class="seg" id="modeSeg">
        <button data-v="order">In order</button><button data-v="topics">Shuffle topics</button><button data-v="all">Shuffle all</button>
      </div>
    </div>
    <div class="progress">
      <div class="bar"><i class="k" id="pk"></i><i class="m" id="pm"></i></div>
      <span class="legend"><b id="nk">0</b> known · <b id="nm">0</b> missed · <b id="nn">0</b> new</span>
      <button class="toggle" id="missTgl">Missed only</button>
    </div>
  </div>
  <div id="stage"></div>
  <div class="foot">
    <button class="linkbtn" id="progBtn">Progress by line</button>
    <button class="linkbtn" id="resetBtn">Reset progress</button>
  </div>
</div>
<div class="actions"><div class="in" id="actions"></div></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box">
  <h3>Reset progress?</h3>
  <p>This clears every card's known and missed status and your place in the deck. It cannot be undone.</p>
  <div class="row"><button class="btn ghost" id="mCancel">Cancel</button><button class="btn miss" style="flex:0 0 auto" id="mOk">Reset</button></div>
</div></div>
<div class="modal" id="pmodal"><div class="box wide sheet" id="pbox"></div></div>
<script>
const DECK={"title":"GS3 Flashcards","subtitle":"Economy · GS3.1–3.10","lines":[{"id":"GS3.1","name":"GS3.1 Indian Economy and issues relating to Planning, Mobilization of Resources, Growth, Development and Employment","short":"Planning, growth, employment"},{"id":"GS3.2","name":"GS3.2 Inclusive Growth and issues arising from it","short":"Inclusive growth"},{"id":"GS3.3","name":"GS3.3 Government Budgeting","short":"Government budgeting"},{"id":"GS3.4","name":"GS3.4 Major Crops - Cropping Patterns in various parts of the country, - Different Types of Irrigation and Irrigation Systems; Storage, Transport and Marketing of Agricultural Produce and Issues and Related Constraints; E-technology in the aid of farmers","short":"Crops, irrigation, marketing"},{"id":"GS3.5","name":"GS3.5 Issues related to Direct and Indirect Farm Subsidies and Minimum Support Prices; Public Distribution System - Objectives, Functioning, Limitations, Revamping; Issues of Buffer Stocks and Food Security; Technology Missions; Economics of Animal-Rearing","short":"Subsidies, PDS, animal rearing"},{"id":"GS3.6","name":"GS3.6 Food Processing and Related Industries in India - Scope and Significance, Location, Upstream and Downstream Requirements, Supply Chain Management","short":"Food processing"},{"id":"GS3.7","name":"GS3.7 Land Reforms in India","short":"Land reforms"},{"id":"GS3.8","name":"GS3.8 Effects of Liberalization on the Economy, Changes in Industrial Policy and their Effects on Industrial Growth","short":"Liberalisation and industry"},{"id":"GS3.9","name":"GS3.9 Infrastructure: Energy, Ports, Roads, Airports, Railways etc.","short":"Infrastructure"},{"id":"GS3.10","name":"GS3.10 Investment Models","short":"Investment models"}],"topics":[{"id":"GS31-niti-aayog-vs-planning-commission","line":"GS3.1","part":"Planning","name":"NITI Aayog vs Planning Commission","own":true,"cards":[{"k":"define","text":"A policy think tank set up on 1 January 2015 by executive resolution to replace the Planning Commission, working through cooperative and competitive federalism.","q":"What is NITI Aayog?"},{"k":"value","q":"How can NITI Aayog be strengthened?","rows":[{"l":"Link funds to performance","t":"Tie part of central transfers to how states score on NITI indices."},{"l":"Regular Centre–state dialogue","t":"Build consensus through regular Governing Council meetings."},{"l":"Stronger evaluation","t":"Give the DMEO real-time outcome audits."},{"l":"State policy hubs","t":"Help states set up State Institutions for Transformation."},{"l":"Independent experts","t":"Bring in economists and technologists for non-partisan advice."}],"cue":"Fund → talk → evaluate → decentralise → diversify."},{"k":"list","q":"How is NITI Aayog structured differently from the Planning Commission?","rows":[{"l":"No fund allocation","t":"The power to allocate funds went back to the Finance Ministry."},{"l":"Governing Council","t":"The PM and all CMs, replacing the old National Development Council."}]},{"k":"for","rows":[{"l":"Cooperative federalism","t":"States help make national policy in the Governing Council."},{"l":"Competitive federalism","t":"State rankings like the SDG India Index push states to improve."},{"l":"No one-size-fits-all","t":"State-specific plans replace uniform Five-Year Plans."},{"l":"Think tank and monitor","t":"It tracks outcomes, for example through the Aspirational Districts Programme."},{"l":"Indicative planning","t":"It guides a market economy instead of allocating money."}],"q":"Why is NITI Aayog an improvement on the Planning Commission?","cue":"Co-operate → compete → tailor → think → indicate."},{"k":"against","rows":[{"l":"No financial teeth","t":"It cannot fund states, so its advice is not binding."},{"l":"Think tank, not do tank","t":"It plays little role in actual implementation."},{"l":"Trust deficit","t":"[[10]] states and UTs skipped the 9th Governing Council meeting."},{"l":"Non-statutory","t":"It exists only by an executive resolution."},{"l":"Weak long-term coordination","t":"Without Five-Year Plans, short-term budgets dominate."}],"q":"Where does NITI Aayog fall short?","cue":"No money → no execution → no trust → no law → no long view."}]},{"id":"GS31-money-multiplier","line":"GS3.1","part":"Growth and development","name":"money multiplier","own":true,"cards":[{"k":"define","text":"The ratio of broad money (M3) to reserve money (M0), showing how banks multiply central-bank money by lending out deposits and keeping only a fraction as reserves.","q":"What is meant by money multiplier?"},{"k":"value","rows":[{"l":"Money multiplier","t":"It rose to [[6.2]] in Dec 2025 from 5.7, showing better intermediation. (ES 2025-26)"},{"l":"Sources of broad money","t":"Credit to government and business, net forex assets and currency, minus non-monetary liabilities."}],"q":"What does the money multiplier show today?"}]},{"id":"GS31-double-deflation","line":"GS3.1","part":"Growth and development","name":"Double deflation","own":true,"cards":[{"k":"define","text":"Double deflation calculates an industry's true economic growth by independently removing the effect of inflation from both the raw materials it buys and the finished goods it sells.","q":"What is meant by double deflation?"}]},{"id":"GS31-gdp","line":"GS3.1","part":"Growth and development","name":"GDP","own":true,"cards":[{"k":"define","text":"GDP is the total monetary value of every final good and service produced within a country's borders in a single year.","q":"What is meant by GDP?"},{"k":"value","rows":[{"l":"Real GDP growth","t":"Growth was [[6.5%]] in FY25 and [[7.4%]] in FY26. (ES 2025-26)"},{"l":"FY27 outlook","t":"The Survey projects [[6.8–7.2%]] growth for FY27. (ES 2025-26)"},{"l":"Latest quarter","t":"GDP grew [[7.8%]] in Q1 FY27."},{"l":"Per-capita GDP","t":"About [[$2,800]] per person, or about [[$12,000]] at PPP."}],"q":"What are India's latest growth numbers?"}]},{"id":"GS31-gdp-deflator","line":"GS3.1","part":"Growth and development","name":"GDP deflator","own":true,"cards":[{"k":"define","text":"Measures the change in prices of all final goods and services produced domestically: (Nominal GDP ÷ Real GDP) × 100.","q":"What is meant by GDP deflator?"},{"k":"list","q":"Why can the GDP deflator mislead?","rows":[{"l":"Low deflator flatters real growth","t":"Near-zero prices in FY25-26 made real growth look strong and nominal growth weak."},{"l":"Nominal growth is what is felt","t":"Taxes, profits and wages follow nominal growth, not real growth."},{"l":"WPI-based deflation criticised","t":"The new 2022-23 series moves towards double deflation."}]}]},{"id":"GS31-mclr","line":"GS3.1","part":"Growth and development","name":"MCLR","own":true,"cards":[{"k":"define","text":"Marginal Cost of Funds-based Lending Rate (April 2016): a bank’s internal benchmark, based mainly on its marginal cost of funds, below which it cannot lend.","q":"What is meant by MCLR?"},{"k":"list","q":"Why did MCLR weaken repo-rate transmission?","rows":[{"l":"Margins","t":"Banks cut lending rates only when they can also cut deposit rates."},{"l":"Sticky deposit rates","t":"High small-savings rates like PPF pull depositors away from banks."},{"l":"Result","t":"MCLR barely moves after a repo cut."}]},{"k":"list","q":"What fixed MCLR’s transmission problem?","rows":[{"l":"EBLR (2019)","t":"Retail and MSME loans are linked to the repo rate, so cuts pass through faster."},{"l":"Small-savings reset","t":"Since 2016 these rates reset every quarter in line with G-sec yields."}]},{"k":"value","rows":[{"l":"Repo rate","t":"The RBI raised it by 25 bps to [[5.5%]] in October 2026."},{"l":"Stance","t":"‘Calibrated tightening’, because food and energy prices are rising."},{"l":"2025 easing","t":"The RBI cut rates by [[125 bps]] during 2025."},{"l":"CRR","t":"The cash reserve ratio was cut by 100 bps to [[3%]]. (ES 2025-26)"}],"q":"Where is the policy rate now?"}]},{"id":"GS31-supply-driven-inflation","line":"GS3.1","part":"Growth and development","name":"Supply-driven inflation","own":true,"cards":[{"k":"define","text":"A rise in prices caused by supply shortages (bad weather, crop failure, import shocks) rather than excess demand.","q":"What is supply-driven inflation?"},{"k":"list","q":"Why is India’s inflation largely supply-driven?","rows":[{"l":"Food weight","t":"Food was 46% of the old CPI and is [[36.75%]] in the new series."},{"l":"Policy limit","t":"Interest rates cannot fix a bad monsoon or a supply shock."},{"l":"New CPI (base 2024)","t":"Launched in February 2026 with [[358]] items."}]},{"k":"value","rows":[{"l":"Record low","t":"CPI inflation fell to [[0.25%]] in October 2025."},{"l":"Latest","t":"CPI inflation was [[5.5%]] in September 2026."},{"l":"Vegetables and pulses","t":"Only [[8.4%]] of the CPI basket, they drove a third of FY25 inflation (ES 2024-25)."},{"l":"Tur dal","t":"India imports tur from countries like Mozambique, so prices follow foreign supply."},{"l":"MPC record","t":"The RBI missed its target in 2022 and undershot the [[2%]] floor in 2025."}],"q":"What do the inflation numbers show?"},{"k":"diagram","q":"Draw the diagram: supply-driven inflation and monetary policy","g":{"dir":"LR","nodes":[["A","Supply shock - monsoon, imports"],["B","Food prices"],["C","Headline CPI"],["D","MPC sets repo"],["E","Transmission - EBLR, MCLR"],["F","Demand and credit"]],"edges":[["A","B",""],["B","C",""],["C","D",""],["D","E",""],["E","F",""]]}}]},{"id":"GS31-potential-gdp","line":"GS3.1","part":"Growth and development","name":"Potential GDP","own":true,"cards":[{"k":"define","text":"The highest output an economy can sustain over time when labour and capital are fully used, without accelerating inflation.","q":"What is meant by potential GDP?"},{"k":"list","q":"What is the output gap?","rows":[{"l":"Above potential","t":"The economy overheats and inflation rises."},{"l":"Below potential","t":"There is slack, called a negative output gap."},{"l":"India","t":"Potential growth is put at about [[7%]]. (ES 2025-26)"}]},{"k":"for","rows":[{"l":"Demographic dividend","t":"A large working-age population adds more workers."},{"l":"Capital formation","t":"Investment of about [[30%]] of GDP builds the capital stock. (ES 2025-26)"},{"l":"Productivity gains","t":"Digital infrastructure and formalisation raise productivity."},{"l":"Infrastructure","t":"Public capex lowers logistics costs."},{"l":"Structural reforms","t":"GST, IBC and the labour codes put resources to better use."}],"q":"What raises India's potential GDP?","cue":"People → capital → productivity → roads → rules."},{"k":"against","rows":[{"l":"Weak private investment","t":"Factories run at about [[75%]] capacity, below the 80% that triggers new investment."},{"l":"Skills and participation","t":"Only [[4.9%]] of youth are formally skilled. (ES 2025-26)"},{"l":"Export weakness","t":"India has only [[1.8%]] of world merchandise exports. (ES 2025-26)"},{"l":"Low R&D","t":"India spends only about [[0.64%]] of GDP on research. (ES 2025-26)"},{"l":"Regulatory burden","t":"Compliance costs and slow contract enforcement stop firms from growing."}],"q":"What holds India's potential GDP down?","cue":"No capex → no skills → no exports → no R&D → red tape."},{"k":"value","rows":[{"l":"Investment gap","t":"China invests over [[40%]] of GDP, well above India."},{"l":"Consumption","t":"Private consumption hit [[61.5%]] of GDP in FY26, the highest since FY12."},{"l":"Private investment","t":"It rose about [[66%]] in FY22–25 but is still below its 2011-12 share."}],"q":"What do investment numbers say about potential growth?"},{"k":"diagram","q":"Draw the diagram for Potential GDP","g":{"dir":"LR","nodes":[["I","Investment"],["K","Capital stock"],["P","Potential GDP"],["L","Labour and skills"],["T","Technology and R and D"],["R","Reforms and institutions"]],"edges":[["I","K",""],["K","P",""],["L","P",""],["T","P",""],["R","P",""]]}}]},{"id":"GS31-gdp-base-year-revision","line":"GS3.1","part":"Growth and development","name":"GDP base year revision","own":true,"cards":[{"k":"define","text":"A periodic shift of the reference year whose prices are used to measure ‘real’ GDP, together with updated data sources and methods.","q":"What is meant by GDP base year revision?"},{"k":"list","title":"2015 revision (base 2004-05 → 2011-12)","rows":[{"l":"Market prices","t":"The headline measure moved from factor cost to market prices, with sectors shown as GVA."},{"l":"MCA-21 data","t":"Company filings replaced the RBI's small sample of firms."},{"l":"UN SNA 2008","t":"India aligned its accounts with the UN standard."}],"q":"What changed in the 2015 GDP base-year revision?"},{"k":"list","title":"2026 revision (base 2011-12 → 2022-23)","rows":[{"l":"Base year 2022-23","t":"It was chosen as the latest normal year after COVID."},{"l":"New data","t":"The series uses GST returns, PFMS, vehicle registrations and PLFS."},{"l":"Double deflation","t":"It is now used in manufacturing and agriculture."},{"l":"FY26 revised","t":"FY26 growth was revised to [[7.6%]], with the back series due by December 2026."}],"q":"What changed in the 2026 GDP base-year revision?"},{"k":"for","rows":[{"l":"Captures structural change","t":"Services, digital trade and small firms are measured better."},{"l":"Better real growth","t":"Double deflation separates output prices from input prices."},{"l":"Global comparability","t":"The series follows UN standards."},{"l":"Uses PLFS","t":"Informal-sector estimates are now linked to PLFS."}],"q":"Why revise the GDP base year?","cue":"Capture → correct → compare."},{"k":"against","rows":[{"l":"Credibility debate","t":"The 2015 series raised growth sharply, and MCA-21 data was questioned."},{"l":"Blind to welfare","t":"GDP ignores quality of life and the environment, and overshadows HDI."},{"l":"Masks inequality","t":"Averages hide how income is concentrated, as in a K-shaped recovery."},{"l":"Data gaps","t":"Weak sources remain, and GST data can overstate informal activity."},{"l":"Infrequent and partial","t":"The base moved after [[11 years]], and services still lack double deflation."},{"l":"Revision shocks","t":"Each revision shifts the growth path and ratios like debt to GDP."}],"q":"What are the concerns with base-year revisions?","cue":"Credibility → welfare → inequality → data → timing → shocks."},{"k":"value","rows":[{"l":"ACNAS","t":"The committee chaired by B.N. Goldar recommended the 2022-23 base."}],"q":"Who prepared the new GDP series?"}]},{"id":"GS31-v-shaped","line":"GS3.1","part":"Growth and development","name":"V-shaped recovery","own":true,"cards":[{"k":"define","text":"A sharp fall followed by an equally quick rebound to the pre-crisis level.","q":"What is meant by V-shaped recovery?"},{"k":"list","q":"Why does a V-shaped recovery happen, and where was it seen?","rows":[{"l":"Cause","t":"A temporary shock with no lasting damage, so pent-up demand returns fast."},{"l":"Example","t":"India's GDP fell about [[24%]] in Q1 FY21, then grew over [[9%]] in FY22."}]}]},{"id":"GS31-u-shaped","line":"GS3.1","part":"Growth and development","name":"U-shaped recovery","own":true,"cards":[{"k":"define","text":"A fall, then a long flat trough before output recovers.","q":"What is meant by U-shaped recovery?"},{"k":"list","q":"Why does a U-shaped recovery happen, and where was it seen?","rows":[{"l":"Cause","t":"Damaged banks and household debt keep output flat while everyone repays debt."},{"l":"Example","t":"The US took 3–4 years to recover after the 2008 crisis."}]}]},{"id":"GS31-w-shaped-double-dip","line":"GS3.1","part":"Growth and development","name":"W-shaped recovery (double dip)","own":true,"cards":[{"k":"define","text":"A recovery interrupted by a second fall before the final recovery (double dip).","q":"What is meant by W-shaped recovery (double dip)?"},{"k":"list","q":"Why does a W-shaped recovery happen, and where was it seen?","rows":[{"l":"Cause","t":"Support is withdrawn too early, or a second shock hits."},{"l":"Example","t":"The Eurozone recovered in 2010, then austerity and rate hikes caused a second recession."}]}]},{"id":"GS31-l-shaped","line":"GS3.1","part":"Growth and development","name":"L-shaped recovery","own":true,"cards":[{"k":"define","text":"A sharp fall followed by prolonged stagnation, with output staying below its old trend for years.","q":"What is meant by L-shaped recovery?"},{"k":"list","q":"Why does an L-shaped recovery happen, and where was it seen?","rows":[{"l":"Cause","t":"Firms keep repaying debt instead of investing, even at zero interest rates."},{"l":"Example","t":"Japan's ‘lost decades’ after land and stock prices crashed by [[60–80%]]."}]}]},{"id":"GS31-k-shaped","line":"GS3.1","part":"Growth and development","name":"K-shaped recovery","own":true,"cards":[{"k":"define","text":"A recovery in which some groups (large formal firms, the well-off) rebound while others (informal workers, MSMEs, the poor) keep falling, widening inequality.","q":"What is meant by K-shaped recovery?"},{"k":"list","q":"Why does a K-shaped recovery happen, and where was it seen?","rows":[{"l":"Cause","t":"The shock rewards big formal firms and hurts informal, labour-intensive ones."},{"l":"Example","t":"After COVID, India saw record profits and luxury sales but weak rural demand."}]}]},{"id":"GS31-swoosh-shaped","line":"GS3.1","part":"Growth and development","name":"Swoosh-shaped recovery","own":true,"cards":[{"k":"define","text":"A sharp fall followed by a slow, stretched-out climb back.","q":"What is meant by swoosh-shaped recovery?"},{"k":"list","q":"Where was a swoosh-shaped recovery seen?","rows":[{"l":"Example","t":"Global aviation and tourism took nearly four years to pass 2019 levels."}]}]},{"id":"GS31-cbdc-and-monetary-sovereignty","line":"GS3.1","part":"Growth and development","name":"CBDC and monetary sovereignty","own":true,"cards":[{"k":"define","text":"CBDC: digital legal tender issued by the central bank (India: the RBI’s e₹, piloted since 2022). Monetary sovereignty: the state’s sole power to issue money and run monetary policy.","q":"What is a CBDC, and why does it matter for monetary sovereignty?"},{"k":"list","q":"How can private crypto or stablecoins erode monetary sovereignty?","rows":[{"l":"Parallel money","t":"Private tokens compete with the rupee."},{"l":"Volatility","t":"Price swings can spill into the financial system."},{"l":"Capital flight","t":"Money can leave the country outside capital controls."},{"l":"Bank disintermediation","t":"Deposits leave banks, so there is less credit."}]},{"k":"for","q":"What are the benefits of the e₹?","rows":[{"l":"Programmable money","t":"Funds can be locked to uses like fertiliser or nutrition."},{"l":"Lower currency costs","t":"There is no printing."},{"l":"Cheaper cross-border settlement","t":"Payments abroad settle with less friction."},{"l":"Wholesale settlement","t":"Wholesale e₹ can settle trades in government securities."},{"l":"Offline inclusion","t":"It works in areas with weak connectivity."}],"cue":"Program → print less → settle → tokenise → include."},{"k":"against","q":"What are the risks and hurdles of the e₹?","rows":[{"l":"Bank-run risk","t":"In a crisis, people can move deposits instantly into risk-free e₹ wallets."},{"l":"Offline hardware","t":"Rural offline use needs new point-of-sale devices."},{"l":"Low adoption","t":"UPI is already free and works abroad, so the e₹ adds little."},{"l":"Cyber target","t":"A central currency system invites state-sponsored cyberattacks."}],"cue":"Run → hardware → adoption → cyber."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Wallet caps","t":"Limits on e₹ balances reduce the risk of bank runs."},{"l":"UPI QR interoperability","t":"Bring non-bank payment firms onto the e₹."},{"l":"Token-based anonymity","t":"Allow privacy for small payments."},{"l":"BIS Innovation Hub","t":"Join global projects like Project Rialto."}]}]},{"id":"GS31-digitalisation-and-dpi","line":"GS3.1","part":"Growth and development","name":"Digitalisation and DPI","own":true,"cards":[{"k":"define","text":"Digital public infrastructure (DPI): open, interoperable digital rails built as public goods – identity (Aadhaar), payments (UPI), data sharing (DigiLocker, Account Aggregator) – together called the India Stack; ONDC extends it to e-commerce.","q":"What is meant by digitalisation and DPI?"},{"k":"data","q":"What numbers show India's digital scale?","rows":[{"l":"UPI","t":"UPI handled [[24,162 crore]] transactions in FY26."},{"l":"Internet connections","t":"Connections grew from 25 crore in 2014 to [[97 crore]] in 2024. (ES 2025-26)"}]},{"k":"for","rows":[{"l":"Payments at scale","t":"UPI carries [[84%]] of digital payments and ≈49% of world real-time payments."},{"l":"Credit for MSMEs","t":"Account Aggregator lets lenders use cash-flow data for small borrowers."},{"l":"Leak-proof welfare","t":"JAM-linked DBT removes ghost beneficiaries."},{"l":"Tax buoyancy","t":"E-invoicing and digital trails widen the tax base."},{"l":"Digital diplomacy","t":"UPI links abroad and the G20 consensus make India Stack a global model."}],"q":"How has DPI transformed India's economy?","cue":"Pay → lend → deliver → tax → diplomacy."},{"k":"against","rows":[{"l":"Jobless digital growth","t":"The digital economy employs only about [[15 million]] people."},{"l":"Last-mile gaps","t":"Rural broadband and power are still patchy."},{"l":"Duopoly","t":"PhonePe and Google Pay handle over [[80%]] of UPI payments."},{"l":"Fraud and exclusion","t":"Scams, data breaches and failed biometrics can deny welfare."},{"l":"Digital divide","t":"Women, rural people and the elderly are left behind."}],"q":"What are the limits and risks of DPI?","cue":"Jobs → reach → duopoly → fraud → divide."},{"k":"value","rows":[{"l":"Competition guardrails","t":"Enforce NPCI's [[30%]] market-share cap on UPI apps."},{"l":"Data protection","t":"Notify DPDP Act rules and strengthen CERT-In."},{"l":"Last-mile infrastructure","t":"Speed up BharatNet and satellite broadband."},{"l":"Human safeguards","t":"Keep offline fallbacks for DBT and teach digital skills."},{"l":"Open protocols","t":"Spread ONDC and similar open networks to more sectors."}],"q":"What are the solutions for DPI?","title":"Solutions and data"},{"k":"diagram","q":"Draw the diagram for Digitalisation and DPI","g":{"dir":"TD","nodes":[["H","India Stack - DPI"],["A","Aadhaar - identity"],["U","UPI - payments"],["D","DigiLocker, Account Aggregator - data"],["O","ONDC - commerce"],["W","DBT through JAM"]],"edges":[["H","A",""],["H","U",""],["H","D",""],["H","O",""],["H","W",""]]}}]},{"id":"GS31-data-issues-related-to-gr","line":"GS3.1","part":"Growth and development","name":"Growth and development: key data","own":true,"cards":[{"k":"data","title":"Numbers","q":"What are the key numbers?","rows":[{"l":"The 2025 paradox","t":"Growth above [[7%]] and record-low inflation still did not attract capital. (ES 2025-26)"}]},{"k":"data","title":"Lines","q":"Which lines can you quote?","rows":[{"l":"‘Strong fundamentals did not bring capital inflows.’","t":"ES 2025-26"}]}]},{"id":"GS31-domestic-resource-mobilization","line":"GS3.1","part":"Mobilisation of resources","name":"Domestic resource mobilisation (DRM)","own":true,"cards":[{"k":"define","text":"Domestic Resource Mobilization (DRM) simply means raising money from within our own country (through citizens' savings and government taxes) to fund our own development, rather than relying on foreign loans or aid.","q":"What is meant by Domestic resource mobilisation (DRM)?"},{"k":"value","rows":[{"l":"Household savings","t":"Net financial savings fell to about [[5%]] of income, a multi-decade low."},{"l":"Tax-to-GDP","t":"India's tax-to-GDP is about [[18%]], against about 34% in OECD countries."},{"l":"Informal base","t":"About half of output is informal, which narrows the tax base."},{"l":"RBI surplus","t":"The RBI paid a record [[₹2.9 lakh crore]] to the government in May 2026."},{"l":"Disinvestment","t":"Receipts stay under [[₹10,000 crore]] a year, far below target."},{"l":"Sevilla Commitment (2025)","t":"FfD4 aims to close the [[$4 trillion]] SDG financing gap."},{"l":"Black Money Act, 2015","t":"Hidden foreign income is taxed at [[30%]] plus a penalty."},{"l":"Conclusion phrase","t":"‘Innovative financing mechanisms’."},{"l":"FY27 non-tax receipts","t":"₹3.2 lakh crore from RBI and financial PSUs, plus [[₹75,000 crore]] from other PSUs."}],"q":"What numbers and steps show how India mobilises its own resources?"}]},{"id":"GS31-bop","line":"GS3.1","part":"Mobilisation of resources","name":"Balance of Payments (BoP)","own":true,"cards":[{"k":"define","text":"Balance of Payments (BoP): The master macroeconomic ledger recording all economic transactions between a country's residents and the rest of the world over a financial year.","q":"What is the Balance of Payments?"},{"k":"value","rows":[{"l":"Forex reserves","t":"Reserves of [[$701 bn]] cover about 11 months of imports. (ES 2025-26)"}],"q":"How strong are India's forex reserves?"}]},{"id":"GS31-current-account","line":"GS3.1","part":"Mobilisation of resources","name":"Current Account","own":true,"cards":[{"k":"define","text":"The part of the balance of payments that records trade in goods and services, income and transfers with the rest of the world, without changing external assets or liabilities.","q":"What is meant by current account?"},{"k":"list","q":"What does the current account include?","rows":[{"l":"Visible trade","t":"Exports and imports of goods."},{"l":"Services","t":"For example, IT software and tourism."},{"l":"Income","t":"Profits and interest on past investments."},{"l":"Transfers","t":"Remittances from NRIs and foreign grants."}]},{"k":"value","rows":[{"l":"Remittances","t":"India is the largest recipient, at [[$150.7 bn]] in 2025."},{"l":"Remittance shift","t":"More now comes from rich countries than from the Gulf. (ES 2025-26)"},{"l":"Why capital is costly","t":"A persistent current account deficit makes investors demand a risk premium. (ES 2025-26)"}],"q":"What sustains India's current account, and what does a deficit cost?"}]},{"id":"GS31-capital-account","line":"GS3.1","part":"Mobilisation of resources","name":"Capital account","own":true,"cards":[{"k":"define","text":"Records all cross-border transactions that create, alter, or liquidate external financial assets and liabilities. (eg. FDI, Borrowings, NRI bank deposits)","q":"What is meant by capital account?"},{"k":"value","rows":[{"l":"External debt","t":"India's external debt was [[$746 bn]] in September 2025. (ES 2025-26)"}],"q":"How large is India's external debt?"}]},{"id":"GS31-asset-monetization-nmp-2-0","line":"GS3.1","part":"Mobilisation of resources","name":"Asset monetisation (NMP 2.0)","own":true,"cards":[{"k":"define","text":"The transfer of revenue-generating rights of mature, brownfield public infrastructure to private players for a fixed period—without transferring ownership—to raise upfront capital for greenfield projects.","q":"What is meant by asset monetisation (NMP 2.0)?"},{"k":"for","rows":[{"l":"Non-debt resources","t":"It raises cash without new borrowing."},{"l":"Capital recycling","t":"Money from old assets funds new projects."},{"l":"Efficiency","t":"Private firms run and maintain assets better."},{"l":"Patient capital","t":"InvITs and TOT attract pension and sovereign funds."},{"l":"Lower private risk","t":"Investors take only operating risk, not construction risk."}],"q":"Why monetise public assets?","cue":"Cash → recycle → run better → patient capital → low risk."},{"k":"against","rows":[{"l":"End-of-lease decay","t":"Operators skimp on maintenance near the end of the lease."},{"l":"Value and concentration risk","t":"Assets may be underpriced, with only a few bidders."},{"l":"Regulatory cholesterol","t":"Red tape and sudden tariff changes hurt deals."},{"l":"Contractual rigidity","t":"Long contracts are hard to change."},{"l":"Execution capacity","t":"It assumes the state will spend the money well."}],"q":"What are the risks of asset monetisation?","cue":"Decay → value → red tape → rigidity → execution."},{"k":"value","rows":[{"l":"NMP 1.0","t":"It raised about [[₹5.3 lakh crore]], about 89% of its target."},{"l":"NMP 2.0","t":"It aims to raise about [[₹10 lakh crore]] by FY30."}],"q":"How much has the National Monetisation Pipeline raised?"}]},{"id":"GS31-to-understand-market-division-in-governm","line":"GS3.1","part":"Mobilisation of resources","name":"Financial market divisions","own":true,"cards":[{"k":"define","text":"By the maturity of instruments, financial markets divide into the money market (short-term, up to one year, for liquidity) and the capital market (medium and long-term, for capital formation).","q":"How are financial markets divided?"},{"k":"list","title":"Four bases of classification","rows":[{"l":"Maturity","t":"Money market for short-term funds, capital market for long-term funds."},{"l":"Stage","t":"Primary market for new issues, secondary market for trading."},{"l":"Nature of instrument","t":"Equity makes you an owner, debt makes you a lender."},{"l":"What is traded","t":"Forex, derivatives and commodities are separate markets."}],"q":"On what four bases are financial markets classified?","cue":"How long? When issued? Own or lend? What is traded?"},{"k":"list","title":"Money market instruments","rows":[{"l":"Treasury Bills","t":"Short-term government securities."},{"l":"Commercial Paper","t":"Unsecured short-term borrowing by companies."},{"l":"Certificate of Deposit","t":"Tradable short-term deposits issued by banks."},{"l":"Call money","t":"Overnight borrowing and lending."},{"l":"Notice money","t":"Borrowing for [[2–14 days]]."},{"l":"Term money","t":"Borrowing beyond 14 days, up to a year."},{"l":"Repo","t":"Borrowing against securities with a promise to buy them back."}],"q":"What are the main money market instruments?"}]},{"id":"GS31-corporate-bond-market","line":"GS3.1","part":"Mobilisation of resources","name":"Corporate Bond Market","own":true,"cards":[{"k":"define","text":"A disintermediated financial market where enterprises raise long-term capital directly from investors via debt instruments, bypassing traditional bank lending.","q":"What is meant by corporate bond market?"},{"k":"for","rows":[{"l":"Long-term money","t":"Bonds give patient capital for long projects."},{"l":"Fewer banking crises","t":"Bonds keep long-term risk off bank balance sheets."},{"l":"Frees bank capital","t":"Banks can lend more elsewhere."},{"l":"Faster transmission","t":"Bond yields respond quickly to policy rates."},{"l":"Funds infrastructure","t":"Domestic savings can fund the infrastructure pipeline."}],"q":"Why does India need a deep corporate bond market?","cue":"Long money → fewer crises → free capital → transmission → infrastructure.","title":"Need"},{"k":"against","rows":[{"l":"Crowding out","t":"Heavy government borrowing takes most investor money."},{"l":"Only top-rated firms","t":"EPFO and LIC may buy only AAA or AA bonds."},{"l":"Illiquid market","t":"Investors buy bonds and hold them till maturity."},{"l":"Slow recovery","t":"Long IBC delays and big haircuts scare investors."},{"l":"Bank-led history","t":"India's financial system has always relied on banks."}],"q":"Why is India's corporate bond market underdeveloped?","cue":"Crowding out → AAA only → illiquid → slow recovery → bank-led.","title":"Why it is underdeveloped"},{"k":"value","rows":[{"l":"Regulatory nudge","t":"Large firms must raise [[25%]] of new borrowing through bonds."},{"l":"Retail demand","t":"Debt mutual funds and RBI Retail Direct bring in savers."},{"l":"New instruments","t":"InvITs widen the market."},{"l":"Healthier corporates","t":"Rating upgrades make more bonds eligible for big investors."},{"l":"Hedging and liquidity","t":"Credit default swaps and bond repos make trading safer."}],"q":"What is deepening the corporate bond market now?","title":"Why it is no longer underdeveloped"},{"k":"data","rows":[{"l":"Market size","t":"Corporate bonds are about [[16%]] of GDP, against about 80% in South Korea."},{"l":"Budget measures","t":"A market-making framework and total return swaps for corporate bonds (Budget 2026-27)."}],"q":"What data and examples back up Corporate Bond Market?"}]},{"id":"GS31-nbfc-s","line":"GS3.1","part":"Mobilisation of resources","name":"NBFCs","own":true,"cards":[{"k":"define","text":"Financial institutions that provide lending and credit services but lack a full banking license—meaning they cannot accept demand deposits (CASA) or issue cheques, and are not part of the payment and settlement system.","q":"What is meant by NBFCs?"},{"k":"for","rows":[{"l":"Last-mile inclusion","t":"They reach borrowers that banks do not."},{"l":"Niche specialisation","t":"They focus on specific kinds of lending."},{"l":"Less bureaucracy","t":"Their processes are lighter than banks'."},{"l":"Faster approvals","t":"Loans are approved much faster."},{"l":"Funds job-rich sectors","t":"They lend to employment-heavy sectors."}],"q":"Why do NBFCs matter for the economy?","cue":"Last mile → specialise → less red tape → fast approvals → job-rich sectors."},{"k":"against","rows":[{"l":"Asset-liability mismatch","t":"They borrow short and lend long, which caused the IL&FS crisis."},{"l":"High cost of funds","t":"They cannot take cheap savings deposits like banks."},{"l":"Risky loan books","t":"They lend to borrowers that banks reject."},{"l":"Systemic contagion","t":"They borrow from banks, so one collapse can hit the banks too."}],"q":"What makes NBFCs risky?","cue":"Mismatch → cost → risky loans → contagion."},{"k":"value","rows":[{"l":"Scale-Based Regulation","t":"The RBI sorts NBFCs into four layers and regulates the largest like banks."},{"l":"Way forward (RBI Governor)","t":"Build resilience across the whole system and keep innovation anchored in trust."}],"q":"How has the RBI responded to NBFC risk?"}]},{"id":"GS31-total-return-swap-trs","line":"GS3.1","part":"Mobilisation of resources","name":"Total return swap (TRS)","own":true,"cards":[{"k":"define","text":"A contract in which party A receives the total return of a bond (interest plus price change) without owning it, and in return pays party B a fixed or floating rate.","q":"What is meant by total return swap (TRS)?"}]},{"id":"GS31-sdr","line":"GS3.1","part":"Mobilisation of resources","name":"Special Drawing Right (SDR)","own":true,"cards":[{"k":"define","text":"Special Drawing Right: an IMF international reserve asset (an artificial currency) whose value is based on a basket of currencies.","q":"What is meant by Special Drawing Right (SDR)?"}]},{"id":"GS31-gold-monetisation-scheme","line":"GS3.1","part":"Mobilisation of resources","name":"Gold Monetisation Scheme","own":true,"cards":[{"k":"define","text":"A 2015 scheme letting households and institutions deposit idle gold with banks to earn interest, putting it to productive use and cutting gold imports.","q":"What is meant by Gold Monetisation Scheme?"},{"k":"data","q":"What is the Gold Monetisation Scheme’s status now?","rows":[{"l":"Status","t":"Only 1–3 year bank deposits remain after March 2025."}]},{"k":"for","rows":[{"l":"Resource mobilisation","t":"Idle locker gold is put to productive use."},{"l":"Lower import bill","t":"Less gold is imported, which helps the CAD and the rupee."},{"l":"Financialised savings","t":"Physical gold moves into the banking system."},{"l":"Tax-free income","t":"Depositors earned [[2.25–2.5%]] tax-free interest."},{"l":"Jewellery supply","t":"Jewellers get cheaper gold through Gold Metal Loans."}],"q":"Why mobilise idle household gold?","cue":"Mobilise → cut imports → financialise → earn → supply jewellers."},{"k":"against","rows":[{"l":"Price risk","t":"The government carried the gold-price risk, so long-term deposits ended in 2025."},{"l":"Few testing centres","t":"Purity-testing centres are rare outside big cities."},{"l":"Weak uptake","t":"Only about [[31 tonnes]] of gold were deposited."},{"l":"Tax fear","t":"Families fear questions about undocumented gold."},{"l":"Cultural attachment","t":"People do not want to melt family jewellery."}],"q":"Why did the Gold Monetisation Scheme fall short?","cue":"Price risk → testing → uptake → tax → culture."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Bank-led short-term deposits","t":"Banks run them, so the government carries no price risk."},{"l":"More testing centres","t":"Accredit jewellers and post offices in small towns."},{"l":"Tax safe harbour","t":"Set clear thresholds for small amounts of ancestral gold."},{"l":"No-melt products","t":"Offer loans backed by jewellery instead of melting it."},{"l":"Bullion exchange link","t":"Connect deposits to Electronic Gold Receipts and IIBX."}]}]},{"id":"GS31-disinvestment","line":"GS3.1","part":"Mobilisation of resources","name":"Disinvestment","own":true,"cards":[{"k":"define","q":"What is disinvestment?","text":"Sale of part or all of the government’s stake in public-sector enterprises: a non-debt capital receipt that also aims at better efficiency."},{"k":"data","q":"How has disinvestment performed?","rows":[{"l":"Shortfall","t":"Receipts have stayed under [[₹10,000 crore]], far below targets."}]}]},{"id":"GS31-banking-npa-ibc","line":"GS3.1","part":"Mobilisation of resources","name":"Banking, NPAs and IBC","own":true,"cards":[{"k":"define","q":"What does the Insolvency and Bankruptcy Code do?","text":"The Insolvency and Bankruptcy Code, 2016 sets a creditor-in-control, time-bound resolution process, adjudicated through the NCLT, to clean up bad loans (NPAs)."},{"k":"for","q":"What has improved in banking and bad-loan resolution?","rows":[{"l":"Cleaner balance sheets","t":"Bank bad loans (GNPA) fell to [[1.8%]] in March 2026, a multi-decade low."},{"l":"Creditor power","t":"The threat of losing the company under IBC pushes promoters to settle."},{"l":"Governance reforms","t":"The P.J. Nayak Committee (2014) asked to cut the government's PSB stake below 50%."},{"l":"Consolidation","t":"The Narasimham Committee II (1998) pushed bank mergers and tighter NPA rules."},{"l":"Bad bank and supervision","t":"NARCL takes over old bad loans, and Prompt Corrective Action stops new ones."}],"cue":"Clean → creditors → governance → mergers → bad bank."},{"k":"against","q":"What still holds bad-loan resolution back?","rows":[{"l":"Steep haircuts","t":"Creditors lose about [[65–70%]] of their claims."},{"l":"Slow resolution","t":"Cases take [[713 days]] on average against a 330-day limit. (ES 2025-26)"},{"l":"Pre-packs unused","t":"Only [[14]] MSME pre-pack cases have been admitted. (ES 2025-26)"},{"l":"Weak PSB autonomy","t":"The P.J. Nayak reforms are still not implemented."},{"l":"No group insolvency law","t":"Cases involving conglomerates or foreign assets get stuck."},{"l":"NCLT backlog","t":"About [[30,600]] cases are pending, roughly 10 years of work. (ES 2025-26)"}],"cue":"Haircuts → delays → pre-packs → PSBs → group cases → NCLT backlog."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Decongest NCLT","t":"Fill vacancies and set up dedicated IBC benches."},{"l":"Fix pre-packs","t":"Simplify MSME pre-packs and allow out-of-court workouts."},{"l":"Group and cross-border insolvency","t":"Amend IBC and adopt the UNCITRAL Model Law."},{"l":"Finish Nayak reforms","t":"Empower the FSIB and shield PSB boards from interference."},{"l":"Forward-looking supervision","t":"Use expected credit loss provisioning to prevent new NPAs."}]}]},{"id":"GS31-data-issues-related-to-mo","line":"GS3.1","part":"Mobilisation of resources","name":"Mobilisation of resources: key data","own":true,"cards":[{"k":"data","title":"Numbers","q":"What are the key numbers?","rows":[{"l":"Market cap","t":"Listed firms are worth over [[130%]] of GDP, up from about 35% in FY95."},{"l":"Demat accounts","t":"India has over [[21.6 crore]] demat accounts. (ES 2025-26)"}]},{"k":"data","title":"Lines","q":"Which lines can you quote?","rows":[{"l":"Insurance","t":"The goal is ‘Insurance for All by 2047’. (ES 2025-26)"},{"l":"AI bubble risk","t":"AI stocks gave about [[75%]] of S&P 500 returns since ChatGPT. (ES 2025-26)"}]},{"k":"data","title":"Government steps and committees","q":"Which government steps and committees apply?","rows":[{"l":"Securities Markets Code, 2025","t":"It merges the SCRA, SEBI Act and Depositories Act. (ES 2025-26)"}]}]},{"id":"GS31-dd","line":"GS3.1","part":"Employment","name":"Demographic dividend","own":true,"cards":[{"k":"define","q":"What is the demographic dividend?","text":"The economic growth boost that happens when a country's working-age population ([[15–59 years]]) is larger than its dependent population (children and the elderly)."},{"k":"for","q":"How does the demographic dividend boost growth?","rows":[{"l":"Resource mobilisation","t":"More workers save more, and banks lend those savings to businesses."},{"l":"Consumption-led growth","t":"A young earning population spends more."},{"l":"Comparative advantage","t":"A large, affordable workforce can make India a GCC hub."},{"l":"Wider tax base","t":"More earners pay more income tax and GST."},{"l":"Women at work","t":"Smaller families free women to work, and [[55%]] FLFPR is needed."}],"cue":"Save → spend → produce → pay tax → women work.","hook":"Save · Spend · Supply · Tax · Women"},{"k":"against","q":"Why might the dividend turn into a disaster?","rows":[{"l":"Skill deficit","t":"Weak school learning and outdated courses leave youth unemployable."},{"l":"Health drag","t":"India ranks 100 of 122 on hunger, and child wasting is [[19%]]."},{"l":"Jobless growth","t":"Capital-heavy sectors create few jobs."},{"l":"Informal traps","t":"Over [[85%]] of workers are in the unorganised sector."},{"l":"Uneven ageing","t":"The south is ageing before the north finishes its transition."}],"cue":"Skills → health → jobs → informality → ageing.","hook":"No jobs · No skills · No food · No quality → Disaster"},{"k":"value","q":"What data backs the demographic dividend?","rows":[{"l":"Window","t":"The dividend lasts till about [[2055]]."},{"l":"Population","t":"About [[1.5 bn]], with fertility at 1.9, below replacement."},{"l":"Working-age share","t":"About [[68%]] are aged 15–64, and the share peaks around 2030."}],"title":"Data"},{"k":"value","q":"How can India harness the demographic dividend?","rows":[{"l":"Labour-intensive growth","t":"Grow manufacturing, MSMEs and tourism that employ many people."},{"l":"Skills","t":"Use NEP vocational courses and Skill India."},{"l":"Health and nutrition","t":"Scale POSHAN 2.0 to end wasting and anaemia."},{"l":"Women at work","t":"Crèches and safe transport can raise FLFPR to [[55%]]."},{"l":"State-specific plans","t":"Skill the young north and build a silver economy in the ageing south."},{"l":"If it fails","t":"The dividend becomes a disaster, with youth unrest and a middle-income trap."}],"cue":"Jobs → skills → health → women → states."}]},{"id":"GS31-ai","line":"GS3.1","part":"Employment","name":"AI and jobs","own":true,"cards":[{"k":"for","q":"How will AI boost jobs and wages?","rows":[{"l":"Labour augmentation","t":"AI makes workers faster and better."},{"l":"Innovation effect","t":"Entirely new sectors and jobs appear."},{"l":"Democratising skills","t":"Lower-skilled workers can do higher-level tasks, for example AI farm forecasts."},{"l":"Fixing inefficiencies","t":"Smarter logistics and grids make the economy cheaper to run."},{"l":"Higher-value work","t":"People move to work that machines cannot do."}],"title":"Will boost jobs and wages","cue":"Augment → innovate → democratise → fix → move up."},{"k":"against","q":"How will AI destroy and degrade jobs?","rows":[{"l":"Transition lag","t":"Old jobs disappear faster than workers can retrain."},{"l":"Services at risk","t":"India needs [[78.5 lakh]] non-farm jobs a year (ES 2023-24)."},{"l":"Cognitive automation","t":"AI may automate [[68%]] of white-collar work within five years."},{"l":"Algorithmic management","t":"Gig apps use AI to watch workers constantly."},{"l":"Inequality trap","t":"Gains go to the owners of AI, and workers lose bargaining power."}],"title":"Will destroy and degrade jobs","cue":"Lag → services → automation → surveillance → inequality."},{"k":"value","q":"What does the Economic Survey recommend on AI, and what data and example back it?","rows":[{"l":"Development-first AI","t":"Build small, open models for local problems, like Bhashini. (ES 2025-26)"},{"l":"Training from Class 11","t":"Students earn credits through apprenticeships."},{"l":"Human-centric jobs","t":"Support jobs like nursing and elderly care that AI cannot replace."},{"l":"Calibrated regulation","t":"Use tiered obligations instead of one rule for all."},{"l":"New institutions","t":"An AI Economic Council and a national AI Safety Institute."},{"l":"Roadmap","t":"Experiment first, then scale up, then build long-term resilience."},{"l":"AI adoption","t":"[[88%]] of firms worldwide use AI in at least one function."},{"l":"TCS layoffs","t":"TCS cut about [[12,000]] jobs, 2% of its staff, in July 2025."}],"title":"Economic Survey 2025-26 recommendations, data and example","cue":"Not whether to adopt AI, but how fast (ES 2025-26)."}]},{"id":"GS31-vbgramg","line":"GS3.1","part":"Employment","name":"VB-G RAM G (formerly MGNREGS)","own":true,"cards":[{"k":"define","q":"What is VB-G RAM G?","text":"The VB-G RAM G Act, 2025 replaced MGNREGA from 1 July 2026, guaranteeing [[125 days]] of rural work (up from 100)."},{"k":"data","q":"What should you know about VB-G RAM G?","rows":[{"l":"Full name","t":"Viksit Bharat-Guarantee for Rozgar and Ajeevika Mission (Gramin)."},{"l":"Person-days","t":"Work fell from 389 crore person-days in FY21 to [[184 crore]] in FY26. (ES 2025-26)"}]}]},{"id":"GS31-tourism-orange","line":"GS3.1","part":"Employment","name":"Tourism or orange economy","own":true,"cards":[{"k":"define","q":"How does Budget 2026-27 use tourism (the orange economy) as a jobs driver?","text":"Budget 2026-27 treats tourism, the ‘orange’ or creative economy, as a jobs driver: a National Institute of Hospitality; upskilling [[10,000]] guides at [[20]] iconic sites; [[15]] archaeological sites to become experiential cultural destinations (e.g. Lothal, Dholavira, Rakhigarhi)."}]},{"id":"GS31-jrwp","line":"GS3.1","part":"Employment","name":"Job-rich, wage-poor growth","own":true,"cards":[{"k":"define","q":"What is job-rich, wage-poor growth?","text":"Employment numbers rise, but workers' purchasing power stays flat or falls, because the new jobs are mostly low-skill, informal or low-productivity."},{"k":"for","q":"Why are India's new jobs wage-poor?","rows":[{"l":"Disguised unemployment","t":"More people work on a task than it needs."},{"l":"Platformisation","t":"Many new jobs are gig jobs."},{"l":"Real wage stagnation","t":"Inflation wipes out wage gains."},{"l":"Graduate glut","t":"There are too few good jobs for graduates."},{"l":"Low-productivity trap","t":"India skipped mass manufacturing, so migrants end up in low-paid services."}],"title":"Why the jobs are wage-poor","cue":"Hidden → gig → inflation → glut → low productivity."},{"k":"against","q":"What shows job quality and real wages are improving?","rows":[{"l":"Formal payrolls","t":"Record EPFO additions show jobs becoming formal."},{"l":"Factory wages","t":"PLI is lifting manufacturing wages."},{"l":"Wage convergence","t":"The gender pay gap is just [[3%]] for unmarried graduate women."},{"l":"Skill premium","t":"AI and advanced manufacturing jobs pay more."},{"l":"Safety-net floor","t":"VB-G RAM G guarantees a minimum."}],"title":"Quality jobs and real wages are improving","cue":"Payrolls → factory wages → convergence → skill premium → floor."},{"k":"value","q":"Which scheme goes with job-rich, wage-poor growth?","rows":[{"l":"PM Viksit Bharat Rozgar Yojana","t":"[[₹99,446 crore]] to support 3.5 crore new jobs by July 2027."},{"l":"First-time employees","t":"They get up to [[₹15,000]] in two instalments."}],"title":"Scheme and data"}]},{"id":"GS31-gig","line":"GS3.1","part":"Employment","name":"Gig economy","own":true,"cards":[{"k":"define","q":"What is the gig economy?","text":"A labour market where companies hire independent workers for short-term, task-based work, usually through digital apps, instead of permanent salaried jobs."},{"k":"for","q":"What does gig work offer?","rows":[{"l":"Bridges job gaps","t":"It covers workers between jobs."},{"l":"More women working","t":"Flexible hours bring women into work."},{"l":"Variable costs","t":"Firms avoid large fixed payrolls."},{"l":"Formalisation","t":"Work moves onto formal digital platforms."},{"l":"Decentralised growth","t":"Platforms spread beyond the metros."}],"cue":"Gaps → women → variable costs → formal → small towns."},{"k":"against","q":"What are the problems with gig work?","rows":[{"l":"Incentive trap","t":"Bonuses fall once workers depend on the app, so they work 12–14 hours."},{"l":"Dehumanised work","t":"Workers are managed by apps, not people."},{"l":"Regulatory arbitrage","t":"Calling workers ‘partners’ avoids labour laws."},{"l":"No collective bargaining","t":"Gig workers cannot bargain as a group."},{"l":"No safety net","t":"Most have no social security."},{"l":"Survey's concerns","t":"The Survey flags financial exclusion, algorithmic control and reskilling needs. (ES 2025-26)"}],"cue":"Trap → dehumanise → arbitrage → no bargaining → no safety net → Survey."},{"k":"value","q":"What data goes with the gig economy?","rows":[{"l":"Gig workers","t":"They are over [[2%]] of the workforce. (ES 2025-26)"}],"title":"Data"}]},{"id":"GS31-su","line":"GS3.1","part":"Employment","name":"Structural unemployment","own":true,"cards":[{"k":"define","q":"What is structural unemployment?","text":"Unemployment caused when workers' skills, location or qualifications do not match the jobs available in the economy."}]},{"id":"GS31-flfpr","line":"GS3.1","part":"Employment","name":"Female LFPR","own":true,"cards":[{"k":"define","q":"What is female LFPR?","text":"The percentage of women aged [[15 and above]] who are either working or actively looking for work."},{"k":"for","q":"Why does a higher female LFPR matter?","rows":[{"l":"Bigger economy","t":"India needs about [[55%]] FLFPR by 2050 for Viksit Bharat. (ES 2025-26)"},{"l":"Care dividend","t":"Smaller families free women for paid work."},{"l":"Second income","t":"A second earner protects the family from shocks."},{"l":"Bargaining power","t":"Women with income have more say at home."},{"l":"SHG enterprise","t":"Self-help groups turn savers into business owners."}],"cue":"Economy → care → income → voice → SHGs."},{"k":"against","q":"What holds women back from work?","rows":[{"l":"STEM gap","t":"Few women train in STEM or job-ready skills."},{"l":"Pink Tax","t":"Unsafe transport makes work costlier for women. (ES 2025-26)"},{"l":"Wage-poor surge","t":"The rise from 23% to [[42%]] is mostly unpaid farm work."},{"l":"Missing middle","t":"Women in middle-income families often leave work."},{"l":"Unpaid care","t":"A third of women doing housework would take a job."}],"title":"Hurdles","cue":"STEM → transit → quality → status → care."},{"k":"value","q":"How can female LFPR be raised?","rows":[{"l":"Lakhpati Didi and Kudumbashree","t":"Scale SHG businesses to reach [[3 crore]] Lakhpati Didis."},{"l":"Care economy","t":"Provide crèches and make care work a paid profession."},{"l":"Safe transit","t":"Safe, cheap transport ends the ‘Pink Tax’."},{"l":"STEM pathways","t":"Scholarships can bring women into green energy and deep tech."},{"l":"Safe workplaces","t":"Enforce Labour Codes safeguards and the POSH Act."}],"title":"Your solutions","cue":"SHGs → care → transit → STEM → workplaces."}]},{"id":"GS31-sm","line":"GS3.1","part":"Employment","name":"Skilling","own":true,"cards":[{"k":"define","q":"What is the skilling gap?","text":"The mismatch between the skills workers have and those employers need, leaving graduates jobless despite vacancies: a driver of structural unemployment."},{"k":"list","q":"What are the core skilling schemes?","rows":[{"l":"PMKVY 4.0","t":"Short-term, outcome-based training."},{"l":"NAPS 2.0 and NATS 2.0","t":"The government pays [[25%]] of the apprentice stipend, up to ₹1,500 a month."},{"l":"PM Internship Scheme"},{"l":"PM Vishwakarma"},{"l":"ITI Upgradation"},{"l":"Jan Shikshan Sansthan"},{"l":"DAY-NRLM"},{"l":"Skill India Digital Hub"},{"l":"NEP 2020","t":"Credit framework, multiple entry and exit, and SWAYAM Plus."}]},{"k":"against","q":"What holds skilling back?","rows":[{"l":"Skill mismatch","t":"Youth are about [[83%]] of the unemployed, most of them educated."},{"l":"Outdated ITIs","t":"Old machines and weak labs make training less useful."},{"l":"Supply-driven training","t":"Courses are designed without industry, so placements are poor."},{"l":"Fragmented governance","t":"Too many ministries and weak Sector Skill Councils."},{"l":"Stigma and AI","t":"Vocational courses carry low status, and AI makes routine skills obsolete."}],"cue":"Mismatch → ITIs → supply-driven → governance → stigma."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Sharada Prasad Committee (2016)","t":"Fund courses by placements and build a labour market information system."},{"l":"Two-track model","t":"Build a China-style vocational stream and upgrade ITIs."},{"l":"Industry apprenticeships","t":"Expand NAPS and the PM Internship Scheme."},{"l":"AI and green skills","t":"Retarget PMKVY 4.0 to new-age jobs."},{"l":"Grassroots skilling","t":"Link PM Vishwakarma and DAY-NRLM with credit."}]},{"k":"data","q":"What are the skilling numbers?","title":"Numbers","rows":[{"l":"Educated unemployed","t":"Their share rose from [[35%]] in 2000 to [[66%]] in 2022."},{"l":"Training","t":"[[21%]] of youth are informally trained. (ES 2025-26)"},{"l":"e-Shram","t":"Over [[31 crore]] workers have registered. (ES 2025-26)"}]}]},{"id":"GS31-lpe","line":"GS3.1","part":"Employment","name":"Low-productivity equilibrium","own":true,"cards":[{"k":"define","q":"What is a low-productivity equilibrium?","text":"A state where a firm or economy works harder but value added stays flat (Economic Survey, AI chapter)."},{"k":"list","q":"Why can AI lead to a low-productivity equilibrium?","rows":[{"l":"Verification cost","t":"Checking AI output can take longer than doing the work."},{"l":"Content flood","t":"Cheap AI content creates more work to check."},{"l":"J-curve","t":"Productivity often dips before it rises."}]}]},{"id":"GS31-emn","line":"GS3.1","part":"Employment","name":"Education–migration nexus","own":true,"cards":[{"k":"define","q":"What is the education–migration nexus?","text":"Students go abroad to study and stay to work, so part of the demographic dividend leaks away as brain drain (‘demographic dividend leakage’)."},{"k":"list","q":"What is the upside of the education–migration nexus?","rows":[{"l":"Remittances","t":"Money now comes more from rich countries, reflecting skilled migration. (ES 2025-26)"}]}]},{"id":"GS31-meas","line":"GS3.1","part":"Employment","name":"Measurement of unemployment","own":true,"cards":[{"k":"define","q":"What is unemployment?","text":"Unemployment: a person of working age ([[15–59 years]]) who is willing and actively seeking work at the prevailing wage but cannot find gainful employment."},{"k":"list","q":"How does the PLFS measure unemployment?","rows":[{"l":"Usual status","t":"Activity over the past [[365 days]]."},{"l":"Current weekly status","t":"Activity in the last week."},{"l":"Method","t":"Sample surveys with computer interviews, coded and weighted."}]},{"k":"for","q":"Why are India's unemployment metrics useful?","rows":[{"l":"Captures informal work","t":"It counts people outside formal jobs."},{"l":"ILO standard","t":"CWS follows ILO guidelines."},{"l":"Types of joblessness","t":"It separates different kinds of unemployment."},{"l":"Early warning","t":"CWS catches sudden job losses quickly."},{"l":"Targeted welfare","t":"The data guides schemes to the right people."}],"title":"Why these metrics are useful","cue":"Informal → ILO → types → early warning → targeting."},{"k":"against","q":"What are the flaws in how unemployment is measured?","rows":[{"l":"Illusion of employment","t":"One hour of work a week counts as employed."},{"l":"Time, not income","t":"It counts hours worked, not what people earn."},{"l":"Unpaid work counted","t":"Women in family work count as employed, yet [[33%]] of homemakers want jobs."},{"l":"Recall bias","t":"People misremember their past activity."},{"l":"Blind to job quality","t":"[[81%]] of Indian workers are casual."}],"title":"Flaws in measurement","cue":"Low bar → hours not income → unpaid work → recall → quality."},{"k":"value","q":"How can unemployment measurement improve, and what data goes with it?","rows":[{"l":"Income-linked metrics","t":"Panagariya suggests checking hours worked against minimum wages."},{"l":"CMIE method","t":"Record activity on the day before the interview."},{"l":"Merge payroll data","t":"Combine PLFS with EPFO and ESIC data."},{"l":"Time-use surveys","t":"Measure how much unpaid care women do."},{"l":"Quarterly rural data","t":"Since January 2025, PLFS gives quarterly data for rural areas too."},{"l":"CWS vs usual status","t":"CWS shows higher unemployment, and monthly CWS data started in 2025."}],"title":"Your solutions and data"}]},{"id":"GS31-puf","line":"GS3.1","part":"Employment","name":"Persistent unemployment factors","own":true,"cards":[{"k":"list","q":"Why does unemployment persist in India?","rows":[{"l":"Weak manufacturing","t":"Growth does not create many jobs."},{"l":"Informality","t":"[[90%]] of workers are informal, and [[46%]] work in farming."},{"l":"Underemployment","t":"Only [[4.9%]] of youth have vocational training."},{"l":"Slow structural shift","t":"Services give [[55%]] of GDP but only 30% of jobs."},{"l":"Low-earning self-employment","t":"Self-employed people earn under ₹13,000 a month against ₹19,000 for salaried."},{"l":"Youth unemployment","t":"Young people face the highest jobless rates."},{"l":"Slow urbanisation","t":"Cities are not creating enough jobs."},{"l":"Few digital jobs","t":"The digital economy employs only about [[14 million]]."}],"title":"Factors","cue":"Factories → informality → underemployment → farms → self-employed → youth → cities → digital.","hook":"Factories · Informal · Under-used · Shift · Self-employed · Youth · Towns · Digital"},{"k":"value","q":"What data goes with persistent unemployment?","rows":[{"l":"Farm workforce","t":"Expected to fall from [[46%]] to 25% by 2047 (ES 2023-24)."},{"l":"Digital economy","t":"India is the third most digitalised economy, yet it creates few jobs."}],"title":"Data"}]},{"id":"GS31-jg","line":"GS3.1","part":"Employment","name":"Jobless growth and employment elasticity","own":true,"cards":[{"k":"define","q":"What are jobless growth and employment elasticity?","text":"Jobless growth: GDP rises without a matching rise in good jobs. Employment elasticity = % change in employment ÷ % change in output; the lower it is, the fewer jobs each point of growth creates. Employment-elastic growth = growth led by labour-intensive sectors."},{"k":"for","q":"Why has India's growth been jobless?","rows":[{"l":"Capital-intensive growth","t":"Total employment fell by about [[9 million]] between 2011-12 and 2017-18."},{"l":"Skill mismatch","t":"Youth are [[83%]] of the unemployed, and two-thirds of them are educated."},{"l":"Missing manufacturing","t":"Services give 55% of GDP but only 30% of jobs."},{"l":"Manufacturing stuck","t":"Manufacturing still employs only about [[12%]] of workers."},{"l":"Automation and AI","t":"Output now needs less labour than before. (ES 2025-26)"},{"l":"Restrictive labour laws","t":"The old 100-worker rule kept firms small."},{"l":"Informalisation","t":"[[90%]] of workers are informal and earn much less."}],"title":"Growth has been jobless: causes","cue":"Capital → skills → services → factories → AI → laws → informality."},{"k":"against","q":"What shows growth is creating jobs?","rows":[{"l":"Rising job count","t":"About [[17 crore]] jobs were added between 2017-18 and 2023-24."},{"l":"Falling unemployment","t":"Unemployment fell from 6% to [[3.2%]]."},{"l":"Higher female LFPR","t":"It rose from 23% to [[42%]]."},{"l":"Platform jobs","t":"Gig work may reach [[2.35 crore]] by 2029-30."},{"l":"Formalisation","t":"EPFO payrolls and the salaried share ([[23.6%]]) are rising."},{"l":"Balanced line","t":"Growth is not jobless but job-rich and wage-poor."}],"title":"Growth is creating jobs","cue":"Jobs up → unemployment down → women in → gig → formal → balanced line."},{"k":"value","q":"Which data and schemes go with jobless growth?","rows":[{"l":"PLFS 2025","t":"Unemployment is [[3.1%]], and [[9.9%]] for youth."},{"l":"LFPR","t":"[[59.3%]] overall, and 40% for women."},{"l":"Jobs added","t":"About [[4.7 crore]] jobs were added in 2023-24."},{"l":"Tourism","t":"It is about 5% of GDP, or 7% with indirect effects. (ES 2025-26)"}],"title":"Data and schemes"},{"k":"diagram","q":"Draw the diagram for Jobless growth and employment elasticity","g":{"dir":"TD","nodes":[["C1","Capital-intensive growth"],["J","Low employment elasticity"],["C2","Restrictive labour laws"],["C3","Skill mismatch"],["C4","Low female LFPR"],["O","Job-poor growth"]],"edges":[["C1","J",""],["C2","J",""],["C3","J",""],["C4","J",""],["J","O",""]]}}]},{"id":"GS32-cash-transfers-conditional-vs-unconditio","line":"GS3.2","part":"","name":"Cash transfers (conditional vs unconditional)","own":true,"cards":[{"k":"define","text":"Conditional cash transfers pay households only when they meet conditions such as school attendance and immunisation (Brazil’s Bolsa Família); unconditional transfers pay without conditions.","q":"How do conditional and unconditional cash transfers differ?"},{"k":"data","q":"What does the Economic Survey say about cash transfers?","rows":[{"l":"Survey's concern","t":"States are relying too much on unconditional cash transfers. (ES 2025-26)"},{"l":"Better route","t":"Rural employment programmes offer the real opportunity. (ES 2025-26)"}]}]},{"id":"GS32-regional-inequalities","line":"GS3.2","part":"","name":"Regional inequalities","own":true,"cards":[{"k":"define","text":"Uneven distribution of financial, political and human resources across states and regions, resulting in unequal access to economic opportunities.","q":"What is meant by regional inequalities?"},{"k":"list","q":"Why do regional disparities exist?","rows":[{"l":"Concentrated growth","t":"Growth clusters in a few states and cities."},{"l":"Unequal infrastructure","t":"Irrigation and infrastructure cover some regions far better than others."},{"l":"Fiscal capacity","t":"States differ in the revenue they raise and receive through devolution."}],"cue":"Growth clusters → infrastructure gaps → fiscal capacity."}]},{"id":"GS32-careless-manpower","line":"GS3.2","part":"","name":"Careless manpower","own":true,"cards":[{"k":"define","text":"Manpower that is poorly utilised, resulting in low productivity, weak work culture and lack of accountability. Useless manpower: People who remain unemployed, underemployed or unemployable due to inadequate education and skills.","q":"What is meant by careless manpower?"}]},{"id":"GS32-market-economy","line":"GS3.2","part":"","name":"Market economy","own":true,"cards":[{"k":"define","text":"A market economy is an economic system in which the production, pricing and distribution of goods and services are primarily determined by the forces of demand and supply, rather than direct government control.","q":"What is meant by market economy?"},{"k":"list","rows":[{"l":"Private enterprise","t":"Private firms work through market forces."},{"l":"Public sector","t":"The government runs public-sector enterprises."},{"l":"State intervention","t":"The state steps in through taxes, subsidies, welfare and public inves
