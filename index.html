MEs?","cue":"Medium firms → cash-flow credit → bonsai conclusion."}]},{"id":"GS38-labour-intensive-vs-capital-intensive-ex","line":"GS3.8","part":"Industrial growth","name":"Labour-Intensive vs Capital-Intensive Exports","own":true,"cards":[{"k":"define","q":"What is India’s export structure?","text":"India’s exports lean toward capital- and skill-intensive goods (refined petroleum, pharma, engineering,electronics) rather than mass-employment goods (garments, footwear, toys, food processing)."},{"k":"for","q":"Why do labour-intensive exports matter for India?","rows":[{"l":"Mass jobs","t":"Garments and footwear absorb workers leaving farms."},{"l":"Capital-light earnings","t":"They earn more exports per unit of scarce capital."},{"l":"Dispersed growth","t":"Clusters like Tiruppur spread jobs and employ women."},{"l":"China plus one","t":"FTAs help capture supply chains moving out of China."},{"l":"Complements strengths","t":"They add to existing strength in pharma, petroleum and engineering."}],"cue":"Mass jobs → less capital → dispersed growth → China+1 → complements."},{"k":"against","q":"Why did India's labour-intensive exports fail?","rows":[{"l":"Dwarf factories","t":"The old 100-worker rule kept firms small, unlike Bangladesh's mega-factories."},{"l":"High factor costs","t":"Power, freight and capital costs hurt, with logistics at about [[8%]] of GDP."},{"l":"Tariff disadvantage","t":"Bangladesh had duty-free EU access while India faced duties."},{"l":"No fibre neutrality","t":"Man-made fibre inputs cost more than finished garments."},{"l":"Capital-biased incentives","t":"Early PLI went mostly to capital-heavy sectors."}],"cue":"Dwarf factories → factor costs → tariffs → fibre duties → capital bias."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Scale freely","t":"Labour Codes let factories grow to [[300]] workers without layoff permission."},{"l":"PM MITRA parks","t":"Seven plug-and-play textile parks cut logistics and compliance costs."},{"l":"Use the FTAs","t":"The UK deal gives duty-free access to [[99%]] of Indian exports."},{"l":"Export credit","t":"Channel trade finance to MSMEs via the Export Promotion Mission."},{"l":"Fix fibre duties","t":"Remove inverted duties on man-made fibres and subsidise formal jobs."}],"cue":"Scale → parks → FTAs → credit → fibre duties."},{"k":"data","q":"What data and examples show the problem?","title":"Data","rows":[{"l":"Costly industrial power","t":"Industry pays above cost to subsidise farmers and households. (ES 2025-26)"},{"l":"Tiruppur","t":"The knitwear cluster aims to double turnover to about [[$10 bn]]."}]}]},{"id":"GS38-semiconductors","line":"GS3.8","part":"Industrial growth","name":"Semiconductors","own":true,"cards":[{"k":"define","q":"What is the India Semiconductor Mission?","text":"The India Semiconductor Mission (2021) offers [[≈₹76,000 crore]] ([[≈$10 bn]]) in incentives to build chip fabs, packaging and design capacity in India."},{"k":"for","q":"Why do semiconductors matter for India?","rows":[{"l":"Strategic autonomy","t":"It cuts dependence on a few East Asian chip suppliers."},{"l":"Foundational tech","t":"Chips power electronics, EVs, defence and energy systems."},{"l":"Electronics anchor","t":"Electronics output rose to about [[₹9.5 lakh crore]] by FY24."},{"l":"Lower import bill","t":"Chip demand may reach [[$100–110 bn]] by 2030."},{"l":"Design talent","t":"India's chip-design talent can move into owning IP."}],"cue":"Autonomy → foundational tech → electronics → imports → design talent."},{"k":"against","q":"What are the challenges in building a chip industry?","rows":[{"l":"Huge capital","t":"Tata's Dholera fab needs about [[₹91,526 crore]]."},{"l":"No frontier firm","t":"Key tools are monopolised, like ASML in lithography."},{"l":"Import dependence","t":"Wafers, chemicals, gases and machines are all imported."},{"l":"Power and water","t":"Fabs need uninterrupted power and huge amounts of ultrapure water."},{"l":"Talent gap","t":"India has designers but few fab engineers and technicians."}],"cue":"Capital → frontier gap → imports → power and water → talent."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Semicon 2.0","t":"Approved in July 2026 with [[₹1,27,500 crore]] to go beyond fabs."},{"l":"Global partnerships","t":"Partner with foundry leaders, like Tata with Taiwan's PSMC."},{"l":"Semiconductor parks","t":"Build parks with dedicated green power and water recycling."},{"l":"Fabless startups","t":"Back chip-design startups through the Design Linked Incentive scheme."},{"l":"Talent pipeline","t":"Chips to Startup trains about [[70,000]] students."}],"cue":"Semicon 2.0 → partners → parks → fabless → talent."}]},{"id":"GS38-skill-india","line":"GS3.8","part":"Industrial growth","name":"Skill India","own":true,"cards":[{"k":"define","text":"Skill India Mission (2015), restructured in 2025 into one scheme combining short-term training, apprenticeships and vocational training for non-literates.","q":"What is Skill India?"},{"k":"list","q":"What are Skill India’s components?","rows":[{"l":"PMKVY 4.0","t":"Short-term outcome-based training, now including AI and robotics."},{"l":"NAPS","t":"The National Apprenticeship Promotion Scheme."},{"l":"Jan Shikshan Sansthan","t":"Vocational training for non-literates."},{"l":"2015 PYQ","t":"Make in India needs Skill India."}]},{"k":"for","rows":[{"l":"Scale","t":"PMKVY has trained about [[1.6 crore]] people."},{"l":"Apprenticeships","t":"About 54 lakh apprentices since 2016, with stipends shared by government."},{"l":"New-age skills","t":"Courses now cover AI, robotics and IoT."},{"l":"Reaching the excluded","t":"JSS trains non-literates in their own communities."}],"q":"What has Skill India achieved?","cue":"Scale → apprenticeships → new-age skills → reaching the excluded."},{"k":"against","rows":[{"l":"Few formally trained","t":"Only about [[5%]] of workers have formal training, against 60% in Germany."},{"l":"Low placement","t":"Courses don't match what industry wants."},{"l":"Poor quality","t":"Training quality and monitoring are weak."}],"q":"Why does Skill India fall short?","cue":"Few trained → low placement → poor quality."},{"k":"value","rows":[{"l":"Conclusion","t":"Skill India bridges India's demographic potential and its economic destiny."}],"q":"What is the takeaway on Skill India?"}]},{"id":"GS38-creative-economy","line":"GS3.8","part":"Industrial growth","name":"Creative economy","own":true,"cards":[{"k":"define","q":"What is the creative (orange) economy?","text":"The knowledge-based ‘orange’ economy built on intellectual property, technology-driven innovation, and cultural monetisation—spanning films, music, design, crafts, and AVGC-XR—with creative occupations estimated at [[≈20%]] of GVA."},{"k":"for","q":"Why promote the creative economy?","rows":[{"l":"Inclusive jobs","t":"AVGC may need nearly [[2 million]] professionals by 2030."},{"l":"Exports","t":"Media and entertainment reached about [[$30 bn]] in 2024."},{"l":"Soft power","t":"Yoga, Ayurveda and GI crafts build cultural diplomacy."},{"l":"Small-town creators","t":"Cheap data and OTT let small-town creators reach audiences."},{"l":"Low-carbon growth","t":"Creativity grows the economy without heavy resource use."}],"cue":"Jobs → exports → soft power → small-town creators → low carbon."},{"k":"against","q":"What holds the creative economy back?","rows":[{"l":"No collateral","t":"Banks avoid lending against intangible IP."},{"l":"Weak IPR","t":"Slow IPR disposal and piracy cut creators' income."},{"l":"Outsourcing hub","t":"India mostly does backend work instead of owning original IP."},{"l":"Red tape","t":"Live events need [[10–15]] separate clearances."},{"l":"Informality","t":"Grassroots artists stay in precarious, low-wage work."}],"cue":"No collateral → weak IPR → outsourcing → red tape → informality."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Faster IPR","t":"Digitise IPR offices under the National IPR Policy 2016."},{"l":"New financing","t":"Use IP-backed loans, crowdfunding and venture funds."},{"l":"Creative hubs","t":"Build creative districts, like UNESCO Creative Cities."},{"l":"Creative skilling","t":"AVGC labs in [[15,000]] schools build an original-IP workforce. (Budget 2026-27)"},{"l":"Single-window events","t":"Simplify live-event clearances and give artisans MSME benefits."}],"cue":"Faster IPR → finance → hubs → skilling → single window."},{"k":"data","q":"What data back up the creative economy?","title":"Data","rows":[{"l":"Patent disposal","t":"It takes about [[59 months]] in India against 21 in the US."}]}]},{"id":"GS38-data-effects-on-industria","line":"GS3.8","part":"Industrial growth","name":"Industrial growth: key data","own":true,"cards":[{"k":"data","title":"Numbers","q":"What are the key numbers?","rows":[{"l":"Startups","t":"India has [[2.2 lakh]] recognised startups and about 120–130 unicorns."}]},{"k":"data","title":"Lines","q":"Which lines can you quote?","rows":[{"l":"CII summit theme","t":"Reimagining Sustainability. Resilient, Regenerative, Responsible."}]},{"k":"data","title":"Government steps and committees","q":"Which government steps and committees apply?","rows":[{"l":"Startup India","t":"A [[₹10,000 crore]] Fund of Funds 2.0 came in April 2026."},{"l":"Biopharma SHAKTI","t":"₹10,000 crore over 5 years for biologics and biosimilars. (Budget 2026-27)"},{"l":"Rare-earth corridors","t":"Four coastal states get dedicated corridors. (Budget 2026-27)"}]}]},{"id":"GS38-fdi","line":"GS3.8","part":"FDI and SEZs","name":"FDI","own":true,"cards":[{"k":"define","text":"A foreign investor takes a lasting stake ([[10%]] or more) and management control in an Indian business, via the automatic or government route.","q":"What is meant by FDI?"},{"k":"list","q":"How is net FDI calculated?","rows":[{"l":"Net FDI","t":"Gross inflows minus repatriation and outward FDI by Indian firms."}]},{"k":"for","rows":[{"l":"Non-debt capital","t":"Gross inflows hit a record [[$94.5 bn]] in FY26."},{"l":"Value chains","t":"FDI brings know-how, like Samsung's Noida plant."},{"l":"Services and infrastructure","t":"Services draw the largest share of inflows."},{"l":"Jobs and spillovers","t":"It creates formal jobs, exports and technology spillovers."},{"l":"Self-reliance","t":"Defence allows [[74%]] FDI through the automatic route."}],"q":"Why does India need FDI?","cue":"Capital → value chains → services → jobs → self-reliance."},{"k":"against","rows":[{"l":"Thin net FDI","t":"Net FDI was just [[$7.7 bn]] in FY26."},{"l":"Repatriation","t":"Exits through IPOs and stake sales are at a multi-year high."},{"l":"Outward FDI","t":"Indian firms invested [[$33.3 bn]] abroad in FY26."},{"l":"MoU–FDI gap","t":"Land, approvals and tax uncertainty stall promised investment."},{"l":"Treaty uncertainty","t":"India ended [[44]] BITs after the 2016 Model BIT."}],"q":"Why is net FDI weak even though gross inflows are at a record?","cue":"Thin net → exits → outward FDI → MoU gap → treaty protection."},{"k":"value","rows":[{"l":"Defence","t":"[[74%]] through the automatic route, more through the government route."},{"l":"Defence production","t":"It rose to about [[₹1.5 lakh crore]] in FY25."},{"l":"Multi-brand retail","t":"[[51%]] through the government route, with conditions."},{"l":"Short vs long run","t":"Short run brings capital, long run brings competitiveness and spillovers."},{"l":"Way forward","t":"Stable treaties, predictable taxes, easier land and facilitation cells."},{"l":"Defence exports","t":"They reached about [[₹23,600 crore]] in FY25."}],"title":"Sector rules and PYQ points","q":"What are the sector rules and PYQ points on FDI?"},{"k":"data","rows":[{"l":"Top source","t":"Singapore gave [[$14.9 bn]] in FY25, ahead of Mauritius."},{"l":"GCCs","t":"About [[1,700]] GCCs, the world's largest concentration."},{"l":"Two readings","t":"The RBI sees mature exits, while critics see weaker fresh commitment."},{"l":"Insurance","t":"The 2025 Act raised the insurance FDI limit to [[100%]]. (ES 2025-26)"},{"l":"FEMA rules","t":"They govern how foreign investors pay for and report investments."},{"l":"FDI vs FPI","t":"FPI is a portfolio stake below 10%."},{"l":"Cumulative since 2000","t":"Singapore [[$195 bn]], Mauritius $187 bn and the US $82 bn."}],"q":"What data and rules back up FDI?"},{"k":"diagram","q":"Draw the diagram for FDI","g":{"dir":"TD","nodes":[["F","Foreign investment"],["D","FDI - 10% or more stake, long term"],["P","FPI - below 10%, portfolio"],["A","Automatic route"],["G","Government route"]],"edges":[["F","D",""],["F","P",""],["D","A",""],["D","G",""]]}}]},{"id":"GS38-sezs","line":"GS3.8","part":"FDI and SEZs","name":"SEZs","own":true,"cards":[{"k":"define","text":"Duty-free enclaves treated as foreign territory for trade and duties, meant to promote exports, investment and jobs (SEZ Act, 2005).","q":"What are SEZs?"},{"k":"data","q":"What are the SEZ numbers?","rows":[{"l":"Origins","t":"Kandla was India's first EPZ in 1965, and the SEZ Act came in 2005."},{"l":"Scale","t":"SEZs employ about [[32 lakh]] people."},{"l":"Exports","t":"SEZ exports rose [[32%]] in April–December 2025."},{"l":"FY24 exports","t":"SEZ exports were about [[$157 bn]] in FY24."}]},{"k":"for","rows":[{"l":"Export hubs","t":"Tax breaks and single-window rules attract export investment."},{"l":"Employment","t":"Zones create jobs near ports and industrial corridors."},{"l":"Ease of business","t":"Single-window clearances and ready infrastructure."},{"l":"Reform test bed","t":"A trial ground for labour and land reforms."}],"q":"What were SEZs meant to achieve?","cue":"Exports → jobs → ease of business → reform test bed."},{"k":"against","rows":[{"l":"Taxation","t":"MAT and the end of tax holidays eroded the SEZ advantage."},{"l":"Weak jobs link","t":"Zones stay enclaves with weak job creation."},{"l":"Idle zones","t":"[[95]] of 372 notified SEZs are non-operational."},{"l":"Weak domestic links","t":"Little link with the domestic economy, and sudden policy reversals."},{"l":"Poor administration","t":"The single window fails on inter-agency coordination."},{"l":"One-size rules","t":"The same rule-book applies to very different zones."},{"l":"Governing law","t":"The DESH Bill to replace the SEZ Act never passed."},{"l":"WTO compatibility","t":"Export-linked tax breaks clash with WTO rules."}],"q":"What plagues SEZs?","cue":"Taxes → enclave → idle zones → weak links → administration → one size → law → WTO."},{"k":"value","rows":[{"l":"Domestic sales","t":"Let units sell at home with duty on inputs, not final goods."},{"l":"Abolish MAT","t":"Remove MAT for SEZs and harmonise GST rules."},{"l":"WTO-compatible support","t":"Support infrastructure, not export-linked tax breaks."},{"l":"Land norms","t":"Semiconductor SEZs now need [[10 ha]] instead of 50."}],"q":"How should SEZs be reformed?","cue":"Domestic sales → no MAT → WTO-compatible → land norms."}]},{"id":"GS38-data-fdi-sezs-liberalisat","line":"GS3.8","part":"FDI and SEZs","name":"FDI and SEZs: key data","own":true,"cards":[{"k":"data","title":"Numbers","q":"What are the key numbers?","rows":[{"l":"Cross-border payments","t":"A [[$206 bn]] market, with Project Nexus for instant payments."}]},{"k":"data","title":"Lines","q":"Which lines can you quote?","rows":[{"l":"Tax justice","t":"Countries lose about [[$492 bn]] a year to tax abuse."}]}]},{"id":"GS39-energy-transition","line":"GS3.9","part":"Energy","name":"Energy transition","own":true,"cards":[{"k":"define","q":"What is the energy transition?","text":"The shift from fossil fuels to renewable and low-carbon sources while keeping power reliable and affordable."},{"k":"for","q":"What progress has India made in the energy transition?","rows":[{"l":"2030 target met early","t":"Non-fossil sources reached [[54%]] of 552 GW by July 2026."},{"l":"Solar boom","t":"Solar grew from 2.8 GW in 2014 to about [[165 GW]]."},{"l":"Wind and bio-energy","t":"Wind is about [[58 GW]], fourth in the world."},{"l":"Energy security","t":"Domestic renewables replace imported fuel and narrow trade deficits."},{"l":"Decentralised green jobs","t":"Rooftop solar and solar pumps spread jobs, like PM Surya Ghar."},{"l":"Next targets","t":"[[500 GW]] non-fossil by 2030, and 60% of capacity by 2035."}],"cue":"Target met → solar boom → wind → energy security → green jobs → next targets."},{"k":"against","q":"What holds back India’s energy transition?","rows":[{"l":"Capacity is not generation","t":"Non-fossil is half of capacity but only about [[29%]] of generation."},{"l":"Financing gap","t":"The transition needs [[₹150 lakh crore]] between 2024 and 2030. (ES 2025-26)"},{"l":"Weak DISCOMs","t":"DISCOMs carry losses of ₹6.5–7 lakh crore despite a first [[₹2,701 crore]] profit in FY25. (ES 2025-26)"},{"l":"Crude dependence","t":"About [[89%]] of crude oil is imported."},{"l":"Grid and storage gaps","t":"Weak transmission and storage force solar curtailment."}],"cue":"Capacity ≠ generation → money gap → weak DISCOMs → crude imports → grid gaps."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Fix DISCOMs","t":"Use RDSS and Gujarat's model, which cut AT&C losses to about [[13%]]."},{"l":"Storage and evacuation","t":"Fund battery storage through VGF and build green corridors."},{"l":"Clean transport","t":"Push EVs through PM E-DRIVE and the Green Hydrogen Mission."},{"l":"Energy buffers","t":"Expand strategic petroleum reserves beyond [[5.3 MMT]]."},{"l":"Green finance","t":"Raise transition capital through blended finance and green bonds."}],"cue":"DISCOMs → storage → clean transport → buffers → green finance."},{"k":"diagram","q":"Draw the diagram for Energy transition","g":{"dir":"LR","nodes":[["C","Coal - baseload"],["G","Grid"],["R","Solar and wind - variable"],["S","Storage - BESS, pumped hydro"],["T","Green energy corridors"],["D","Reliable clean power"]],"edges":[["C","G",""],["R","G",""],["S","G",""],["T","G",""],["G","D",""]]}},{"k":"data","q":"What do the capacity and emissions numbers show?","title":"Data","rows":[{"l":"Per-capita emissions","t":"About [[2.9 t]], against a world average of 6.7 t. (ES 2025-26)"},{"l":"Installed capacity","t":"[[509.7 GW]] in Nov 2025, with renewables at 49.8%. (ES 2025-26)"},{"l":"Solar capacity","t":"[[135.8 GW]] in Dec 2025, third in the world. (ES 2025-26)"},{"l":"China comparison","t":"China has about [[1,228 GW]] of renewables."},{"l":"Entropy effect","t":"The Survey warns fast decarbonisation without buffers adds volatility."},{"l":"Green Hydrogen Mission","t":"[[5 MMT]] of green hydrogen a year by 2030."},{"l":"Bio-energy","t":"[[11.6 GW]] of bio-energy capacity. (ES 2025-26)"}]}]},{"id":"GS39-nuclear-energy","line":"GS3.9","part":"Energy","name":"Nuclear energy","own":true,"cards":[{"k":"define","q":"What role does nuclear energy play?","text":"Power generated from controlled nuclear fission reactions, providing reliable, low-carbon baseload electricity to complement variable renewables."},{"k":"for","q":"Why expand nuclear energy?","rows":[{"l":"Clean baseload","t":"Plants run above [[80%]] load factor, unlike 15–25% for renewables."},{"l":"Big expansion","t":"From 8.8 GW now to 22 GW by 2031-32 and [[100 GW]] by 2047."},{"l":"Three-stage programme","t":"The Kalpakkam PFBR reached criticality in April 2026, opening Stage II."},{"l":"Small Modular Reactors","t":"[[₹20,000 crore]] for indigenous SMRs, with five by 2033."},{"l":"Energy independence","t":"Nuclear cuts fuel imports and needs little land per megawatt."},{"l":"Current share","t":"[[24]] reactors give about 3% of India's electricity."}],"cue":"Baseload → 100 GW → Stage II → SMRs → independence → current share."},{"k":"against","q":"What holds nuclear energy back?","rows":[{"l":"High cost, long delays","t":"The PFBR took over two decades to reach criticality."},{"l":"Imported uranium","t":"Slow progress on the three stages keeps uranium imports necessary."},{"l":"Safety and waste","t":"Waste and safety fears fuel protests, as at Kudankulam."},{"l":"Liability concerns","t":"The SHANTI Act repealed the 2010 supplier-liability law, raising compensation worries."},{"l":"Water and siting","t":"Cooling needs limit sites in water-stressed regions."}],"cue":"Cost and delay → imported uranium → safety → liability → water."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Cheaper imports","t":"Customs exemption runs to 2035, and absorber-rod duty fell from 7.5% to zero. (Budget 2026-27)"},{"l":"Fast-track SMRs","t":"Build BSMR-200 and SMR-55 at sites like Tarapur."},{"l":"Independent regulator","t":"Give the AERB real statutory independence under the SHANTI Act."},{"l":"Fuel security","t":"Replicate fast breeders and sign long-term uranium contracts."},{"l":"Public trust","t":"Invest in waste repositories, drills and local benefit-sharing."}],"cue":"Cheaper imports → SMRs → independent AERB → fuel → trust."},{"k":"diagram","q":"Draw the three-stage programme diagram (Nuclear energy)","g":{"dir":"LR","nodes":[["A","Stage 1 - PHWR, natural uranium"],["B","Stage 2 - fast breeders, plutonium - PFBR"],["C","Stage 3 - thorium reactors"]],"edges":[["A","B",""],["B","C",""]]}}]},{"id":"GS39-greenium","line":"GS3.9","part":"Energy","name":"Greenium","own":true,"cards":[{"k":"define","text":"The yield advantage of green bonds over ordinary bonds, i.e. how much cheaper green issuers borrow. In India it is modest, [[0–6 bps]].","q":"What is meant by greenium?"}]},{"id":"GS39-solar-energy","line":"GS3.9","part":"Energy","name":"Solar energy","own":true,"cards":[{"k":"define","q":"What is solar energy?","text":"Electricity generated from sunlight through photovoltaic cells or solar thermal plants, offering clean, zero-fuel power at utility and decentralised scales."},{"k":"for","q":"Why is solar central to India’s energy future?","rows":[{"l":"Energy security","t":"Solar needs no imported fuel, saving foreign exchange."},{"l":"Cheapest power","t":"Auction tariffs fell to about [[₹2.4–2.5]] per unit."},{"l":"Rooftops and pumps","t":"PM Surya Ghar has reached about [[50 lakh]] homes."},{"l":"Manufacturing base","t":"India has about [[170 GW]] of module-making capacity."},{"l":"Fast to build","t":"Parks come up in months with no water use, like the [[2,245 MW]] Bhadla park."}],"cue":"No fuel imports → cheapest → rooftops → manufacturing → fast build."},{"k":"against","q":"What are the limits of solar energy?","rows":[{"l":"Intermittency","t":"Solar needs costly storage to supply evening peaks."},{"l":"Curtailment","t":"[[300]] GWh of renewable power was curtailed in Q1 2026."},{"l":"Thermal strain (2015 PYQ)","t":"Solar pushes coal plants into flexible back-up, hurting their finances."},{"l":"Land conflicts","t":"It needs about [[4–5]] acres per MW, clashing with farms and wildlife."},{"l":"China dependence","t":"Domestic cells cost nearly [[40%]] more than Chinese ones."}],"cue":"Intermittency → curtailment → thermal strain → land → China."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Storage","t":"Fund battery and pumped storage through VGF."},{"l":"Transmission","t":"[[12,139]] circuit km of lines were added in FY25–26."},{"l":"Upstream manufacturing","t":"ALMM now covers solar cells, and wafers from June 2028."},{"l":"Dual-use land","t":"Prefer rooftop, canal-top, floating solar and agrivoltaics."},{"l":"Healthy DISCOMs","t":"Enforce payment security so solar generators are paid on time."}],"cue":"Storage → transmission → upstream → dual-use land → DISCOMs."},{"k":"data","q":"Which schemes push solar?","title":"Data","rows":[{"l":"PM Surya Ghar (2024)","t":"Rooftop solar with up to 300 free units a month, [[₹75,021 crore]]."},{"l":"PM-KUSUM (2019)","t":"Solar pumps and feeder solarisation."}]}]},{"id":"GS39-green-energy-corridor-and-grid-integrati","line":"GS3.9","part":"Energy","name":"Green energy corridor and grid integration","own":true,"cards":[{"k":"define","q":"What is the Green Energy Corridor?","text":"Dedicated high-voltage transmission lines, substations, and storage networks built to evacuate variable renewable power from resource-rich states to demand centres and integrate it into the national grid."},{"k":"for","q":"What has the Green Energy Corridor achieved?","rows":[{"l":"Evacuation capacity","t":"Phase II added [[10,750]] ckm of lines across 7 states."},{"l":"Remote hubs","t":"A Ladakh line will carry [[13 GW]] of renewables plus storage."},{"l":"Grid stability","t":"Renewable Energy Management Centres forecast solar and wind in real time."},{"l":"Phase III","t":"Approved in 2026 for [[135 GW]] evacuation and 50 GWh storage."},{"l":"OSOWOG","t":"One Sun One World One Grid moves solar power across borders."}],"cue":"Lines built → remote hubs → stability → Phase III → OSOWOG."},{"k":"against","q":"What are the challenges in grid integration?","rows":[{"l":"Mismatched timelines","t":"Parks get stranded as lines face land and forest delays."},{"l":"Storage deficit","t":"About [[6,900]] GWh was curtailed in FY26 due to congestion."},{"l":"Capital needs","t":"Grid expansion needs [[₹9.2 lakh crore]] by 2032."},{"l":"Cross-border trust","t":"OSOWOG faces geopolitical and regulatory barriers."},{"l":"Mineral imports","t":"Batteries depend on imported lithium, nickel and cobalt."}],"cue":"Timelines → storage → capital → trust → minerals."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Storage with every line","t":"Pair new corridors with battery and pumped storage."},{"l":"Fast clearances","t":"Use Gati Shakti and right-of-way rules for parallel approvals."},{"l":"Smart grids","t":"Use forecasting and competitive bidding to balance the grid."},{"l":"State utilities","t":"Phase III gives [[₹54,082 crore]] of central support."},{"l":"Neighbours first","t":"Start with Nepal and Bhutan links before a wider OSOWOG."}],"cue":"Storage → clearances → smart grids → state utilities → neighbours."}]},{"id":"GS39-energy-access-and-sdg-7","line":"GS3.9","part":"Energy","name":"Energy access and SDG 7","own":true,"cards":[{"k":"define","q":"What does SDG 7 require?","text":"SDG [[7]] aims to ensure universal access to affordable, reliable, sustainable, and modern energy for all by 2030."},{"k":"for","q":"What has India achieved on energy access?","rows":[{"l":"Universal electricity","t":"Rural supply rose from 12.5 to [[22.6]] hours a day."},{"l":"Clean cooking","t":"There are over [[10.3 crore]] active Ujjwala connections."},{"l":"Clean base","t":"Non-fossil sources are [[51.9%]] of capacity. (ES 2025-26)"},{"l":"Efficiency","t":"UJALA distributed [[36.9 crore]] LED bulbs."},{"l":"Livelihoods","t":"Power and solar pumps support farms, cold chains and tribal hamlets."}],"cue":"Electricity → cooking → clean base → efficiency → livelihoods."},{"k":"against","q":"Where does India fall short on SDG 7?","rows":[{"l":"Last-mile reliability","t":"Weak DISCOMs mean outages and voltage swings in villages."},{"l":"Refill affordability","t":"Ujjwala users buy about [[4.4]] cylinders a year against 7–8 needed."},{"l":"Coal-heavy supply","t":"Coal still generates about [[70%]] of electricity."},{"l":"Excluded groups","t":"Tenants, forest hamlets and slums miss formal metering."},{"l":"Low per-capita use","t":"India uses about a third of the world's per-capita electricity."}],"cue":"Reliability → refills → coal → excluded → low use."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Rural grids","t":"Use RDSS for smart meters and feeder segregation."},{"l":"Affordable cooking","t":"Keep the [[₹300]] refill subsidy and offer 5-kg cylinders."},{"l":"Decentralised renewables","t":"Expand microgrids, rooftop solar and solar pumps."},{"l":"Efficiency","t":"Scale star labelling and the PAT scheme."},{"l":"Productive use","t":"Pair power with livelihood appliances like solar cold storage."}],"cue":"Grids → cooking → decentralised → efficiency → productive use."}]},{"id":"GS39-run-of-river-hydro","line":"GS3.9","part":"Energy","name":"Run-of-river hydro","own":true,"cards":[{"k":"define","q":"What is run-of-river hydro?","text":"A hydroelectric plant that uses a river’s natural flow and elevation drop with little or no reservoir (only small pondage), unlike storage dams that hold water for months."},{"k":"for","q":"Why prefer run-of-river hydro?","rows":[{"l":"Less submergence","t":"No big reservoir means little forest loss or displacement."},{"l":"Cheaper and faster","t":"The 2026 Small Hydro scheme targets [[1,500 MW]]."},{"l":"Himalayan potential","t":"Steep snow-fed rivers suit it, as in Arunachal Pradesh."},{"l":"Peaking power","t":"Small pondage gives fast-ramping power to balance solar."},{"l":"Remote supply","t":"Mini plants up to [[25 MW]] power remote hill villages."}],"cue":"Less submergence → cheaper → Himalayas → peaking → remote."},{"k":"against","q":"What are the risks of run-of-river hydro?","rows":[{"l":"Seasonal output","t":"Hydro output fell [[16.3%]] in weak-rain FY24."},{"l":"Climate hazards","t":"The 2021 Chamoli flood wrecked two run-of-river projects."},{"l":"Dried stretches","t":"Tunnels dry long river stretches below diversion dams."},{"l":"Fragile geology","t":"Blasting and cascades trigger landslides, as at Joshimath."},{"l":"Siltation","t":"Himalayan silt wears turbines and raises outages."}],"cue":"Seasonal → hazards → dry rivers → geology → silt."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Basin-wide limits","t":"Assess cumulative impact and space projects apart."},{"l":"Environmental flows","t":"Mandate year-round e-flows with real-time monitoring."},{"l":"Hazard warning","t":"Map geology and install GLOF early warning before clearance."},{"l":"Pair with storage","t":"Add pumped storage, like the [[1,000 MW]] Tehri plant."},{"l":"Small and local","t":"Prefer small hydro with local benefit-sharing."}],"cue":"Basin limits → e-flows → warnings → storage → small and local."}]},{"id":"GS39-port-led-development","line":"GS3.9","part":"Ports","name":"Port-led development","own":true,"cards":[{"k":"define","q":"What is port-led development?","text":"Using ports, shipping, coastal and inland waterways to cut logistics costs and drive coastal industrialisation under Sagarmala (2015)."},{"k":"for","q":"What has port-led development achieved?","rows":[{"l":"Capacity doubled","t":"Port capacity rose from 1,400 to about [[2,760]] MTPA in a decade."},{"l":"Mega-ports","t":"Vadhavan, a [[₹76,000 crore]] top-10 port, and Vizhinjam handle the largest ships."},{"l":"Shipbuilding push","t":"A [[₹69,725 crore]] package aims for top-five shipbuilding by 2047."},{"l":"Modern laws","t":"Three 2025 laws replaced colonial port and shipping rules."},{"l":"Coastal industry","t":"Coastal shipping and Coastal Economic Zones cut freight costs."}],"cue":"Capacity → mega-ports → shipbuilding → laws → coastal industry."},{"k":"against","q":"What holds port-led development back?","rows":[{"l":"Weak hinterland links","t":"Poor road and rail links raise dwell times."},{"l":"Foreign transhipment","t":"About [[75%]] of transhipped cargo goes via Colombo and Singapore."},{"l":"Underused ports","t":"Major-port capacity utilisation is only about [[49%]]."},{"l":"Ecology and fishers","t":"Dredging and reclamation spark protests, as at Vadhavan."},{"l":"Coordination and climate","t":"Centre–state splits and sea-level rise threaten ports."}],"cue":"Hinterland → transhipment → underuse → ecology → coordination."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Hinterland links","t":"Sagarmala 2.0 gets [[₹85,482 crore]] for multimodal links."},{"l":"Own transhipment hubs","t":"Use Vizhinjam and Vadhavan to win back cargo from Colombo."},{"l":"Digitise ports","t":"Digitise customs and truck gates to cut JNPT's 8–9 day dwell."},{"l":"Green ports","t":"Follow Harit Sagar guidelines and support fishing communities."},{"l":"Port-led industry","t":"Build Coastal Economic Zones and dedicated coastal berths."}],"cue":"Hinterland → transhipment hubs → digitise → green → industry."},{"k":"data","rows":[{"l":"Turnaround time","t":"Cut from 43 to [[30]] hours. (ES 2025-26)"},{"l":"National Waterways","t":"32 are operational, covering [[5,155 km]]. (ES 2025-26)"},{"l":"Sagarmala (2015)","t":"Five pillars, from port modernisation to coastal shipping."},{"l":"Jal Marg Vikas","t":"Builds capacity on NW-1, the Ganga from Haldia to Varanasi."},{"l":"National Logistics Portal","t":"A single window for end-to-end marine logistics."}],"q":"Which schemes and data back up port-led development?"},{"k":"data","rows":[{"l":"Cruise Bharat Mission","t":"It aims to double cruise traffic by 2029."},{"l":"Green Tug Programme","t":"Green tugs to cut port emissions by 2030."},{"l":"Maritime Amrit Kaal Vision","t":"About [[₹80 lakh crore]] of investment by 2047."},{"l":"Container manufacturing","t":"[[₹10,000 crore]] over 5 years. (Budget 2026-27)"},{"l":"Tuticorin terminal","t":"It handles about [[6 lakh]] TEU a year and larger ships."}],"q":"Which schemes and data back up port-led development?"},{"k":"data","q":"What is the scale of India’s ports?","rows":[{"l":"Coast and ports","t":"About [[7,500 km]] of coastline and 12 major ports."},{"l":"Cargo","t":"Ports carry about [[95%]] of trade by volume and 70% by value."}]},{"k":"diagram","q":"Draw the Sagarmala diagram (Port-led development)","g":{"dir":"TD","nodes":[["S","Sagarmala"],["M","Port modernisation"],["C","Port connectivity"],["I","Port-led industrialisation"],["K","Coastal communities"],["W","Coastal shipping and inland waterways"]],"edges":[["S","M",""],["S","C",""],["S","I",""],["S","K",""],["S","W",""]]}}]},{"id":"GS39-inland-waterways-and-cruise-tourism","line":"GS3.9","part":"Infrastructure","name":"Inland waterways and cruise tourism","own":true,"cards":[{"k":"define","q":"What are inland waterways?","text":"Moving cargo and people on rivers and canals: cheaper and cleaner than road."},{"k":"data","q":"How many National Waterways does India have?","rows":[{"l":"National Waterways","t":"[[111]] declared, but only 32 operational."},{"l":"Institutions","t":"IWAI develops them under the National Waterways Act, 2016."}]},{"k":"for","q":"What are the gains from inland waterways and cruise tourism?","rows":[{"l":"Cheap and clean freight","t":"Waterway cargo hit [[218 MMT]] in FY26, beating the 2030 target."},{"l":"Jal Marg Vikas","t":"Multimodal terminals on the Ganga, like Varanasi and Haldia."},{"l":"Cruise tourism","t":"Cruise Bharat targets about [[4 lakh]] jobs."},{"l":"North-East access","t":"The Indo-Bangladesh Protocol Route links Kolkata with Assam."},{"l":"Riverside livelihoods","t":"[[66]] Arth Ganga jetties serve about 1.2 lakh users a day."}],"cue":"Cheap freight → Ganga terminals → cruises → North-East → livelihoods."},{"k":"against","q":"What are the problems with inland waterways and cruise tourism?","rows":[{"l":"Shallow drafts","t":"Siltation and lean seasons need constant dredging."},{"l":"Last-mile costs","t":"Transfer costs keep waterway freight share near [[2%]]."},{"l":"Idle network","t":"Only 32 of [[111]] National Waterways are operational."},{"l":"Physical barriers","t":"Low bridges and barrages like Farakka block vessels."},{"l":"River ecology","t":"Dredging and cruises disturb Gangetic dolphins."}],"cue":"Shallow → last mile → idle → barriers → ecology."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"New waterways","t":"Operationalise [[20]] new National Waterways in five years. (Budget 2026-27)"},{"l":"Modal-shift subsidy","t":"Jalvahak reimburses up to [[35%]] of operating costs."},{"l":"Cruise terminals","t":"Build terminals and circuits for the Cruise Bharat Mission."},{"l":"Uniform rules","t":"Enforce the Inland Vessels Act, 2021."},{"l":"Green vessels","t":"Harit Nauka targets [[100%]] green vessels by 2047."}],"cue":"New waterways → subsidy → cruises → rules → green vessels."}]},{"id":"GS39-road-infrastructure","line":"GS3.9","part":"Roads","name":"Road infrastructure","own":false,"cards":[{"k":"for","rows":[{"l":"Network growth","t":"National highways grew [[60%]] since FY14 to 1.5 lakh km."},{"l":"Density","t":"Road density is about [[1.6 km]] per sq km, above the US."},{"l":"Lower logistics cost","t":"Logistics cost fell below 8% of GDP, and India ranks [[38th]] on the LPI."},{"l":"Rural connectivity","t":"PMGSY connected [[99.7%]] of eligible habitations."},{"l":"New financing","t":"InvITs and TOT monetise roads already built."},{"l":"High-speed corridors","t":"They grew about 10 times to [[5,364 km]]. (ES 2025-26)"},{"l":"Construction pace","t":"It rose from 12 km a day in FY14 to [[34 km]] in FY24."}],"q":"What has road infrastructure achieved?","cue":"Longer network → dense → cheaper logistics → rural links → new financing → high-speed corridors → pace."},{"k":"against","rows":[{"l":"NHAI debt","t":"NHAI still owes about [[₹2.4 lakh crore]], despite a 27% cut."},{"l":"Slowing pace","t":"Construction fell from 37 km a day to about [[25–27 km]]."},{"l":"Land and clearances","t":"Acquisition costs and delays hold projects back."},{"l":"Quality","t":"Lowest-bidder contracts invite poor construction."},{"l":"Road safety","t":"India has among the highest road deaths in the world."}],"q":"What problems remain in road infrastructure?","cue":"Debt, slowing pace, land, quality, safety."},{"k":"data","rows":[{"l":"Share of capex","t":"Roads and railways take over half of effective capex. (ES 2025-26)"},{"l":"PMGSY-IV","t":"[[62,500 km]] to connect 25,000 habitations by 2029."},{"l":"Bharatmala","t":"Phase I targeted [[34,800 km]] of highways and corridors."},{"l":"Char Dham road","t":"About [[70%]] was done by 2024."},{"l":"Multimodal logistics parks","t":"They pool small truckloads into large ones."}],"q":"Which schemes back up road infrastructure?"},{"k":"data","rows":[{"l":"Gati Shakti and NLP","t":"They aim to cut logistics cost to about [[8–9%]] of GDP."},{"l":"Setu Bharatam","t":"Over-bridges replace level crossings on national highways."},{"l":"Maintenance policy","t":"Performance-based contracts of [[5–7 years]]."},{"l":"Vehicle scrapping","t":"Buyers get about [[4–6%]] of the new vehicle's price as incentive."},{"l":"Other modes","t":"Rail has DFCs, ports have Sagarmala and airports have UDAN."}],"q":"Which schemes back up road infrastructure?"},{"k":"data","q":"How big is India’s road network?","rows":[{"l":"Network","t":"Second-largest in the world, about [[63 lakh]] km."},{"l":"National highways","t":"About 2% of the network but [[40%]] of traffic."},{"l":"Freight","t":"Roads carry about two-thirds of freight."}]},{"k":"diagram","q":"Draw the PM Gati Shakti diagram (Road infrastructure)","g":{"dir":"TD","nodes":[["G","PM Gati Shakti - GIS master plan"],["R","Roads - Bharatmala"],["L","Rail - DFCs"],["P","Ports - Sagarmala"],["A","Airports - UDAN"],["W","Waterways"]],"edges":[["G","R",""],["G","L",""],["G","P",""],["G","A",""],["G","W",""]]}}]},{"id":"GS39-udan","line":"GS3.9","part":"Aviation","name":"UDAN","own":true,"cards":[{"k":"define","q":"What is meant by UDAN?","text":"UDAN (Ude Desh ka Aam Nagrik): the Regional Connectivity Scheme under the National Civil Aviation Policy 2016, connecting underserved regional airports."},{"k":"for","q":"Why does regional air connectivity matter?","rows":[{"l":"Scale","t":"UDAN has carried [[1.7 crore]] passengers."},{"l":"Airport density","t":"India has just [[0.1]] airports per million people. (ES 2025-26)"},{"l":"North-East links","t":"[[90]] priority routes operate in border regions."},{"l":"Small-city growth","t":"Regional flights boost tourism and trade in tier-2 towns."},{"l":"Affordable fares","t":"Fare caps and state tax breaks make flying cheaper."}],"cue":"Scale → airport density → North-East → small cities → fares."},{"k":"against","q":"Why do many UDAN routes fail?","rows":[{"l":"Route mortality","t":"About [[123]] routes closed before their 3-year VGF ended."},{"l":"Basic infrastructure","t":"Without ILS, small airports fly only by day."},{"l":"Hub congestion","t":"Big hubs are over capacity and short of controllers."},{"l":"High costs","t":"Steep ATF taxes and a weak MRO sector raise costs."},{"l":"Thin demand","t":"Low demand and poor road links hurt viability."}],"cue":"Routes die → no ILS → hubs jammed → high costs → thin demand."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Modified UDAN","t":"[[₹28,840 crore]] for 2026–36, with VGF extended to 5 years."},{"l":"Last-mile links","t":"Connect airports to roads and rail through Gati Shakti."},{"l":"Night landing","t":"Install ILS at small airports and hire controllers."},{"l":"Lower costs","t":"Bring ATF under GST and build a domestic MRO industry."},{"l":"Digi Yatra","t":"Paperless, face-based entry speeds up passengers."}],"cue":"Modified UDAN → last mile → ILS → costs → Digi Yatra."},{"k":"data","rows":[{"l":"Market size","t":"Third-largest domestic market, with [[21 crore]] passengers in 2024, 3.8 crore international."},{"l":"UDAN 5.0 onwards","t":"5.0 removed the 500 km cap, and later versions added helicopters."},{"l":"Modified UDAN scope","t":"100 new airports, 200 helipads, 120 new destinations and [[4 crore]] more passengers."},{"l":"Success stories","t":"Agra, Hindon and Tezpur traffic grew 7–10 times."},{"l":"Fleet","t":"Indian airlines fly about [[800]] aircraft."}],"q":"How has UDAN evolved?"},{"k":"diagram","q":"Draw the diagram for UDAN","g":{"dir":"LR","nodes":[["V","VGF and concessions"],["R","Regional routes, capped fares"],["P","Passengers from small towns"],["D","Routes viable - or die when VGF ends"]],"edges":[["V","R",""],["R","P",""],["P","D",""]]}},{"k":"data","q":"What has UDAN achieved?","title":"Data","rows":[{"l":"Airport boom","t":"Operational airports rose from 74 to [[165]] by July 2026."}]},{"k":"data","q":"How is UDAN run and funded?","rows":[{"l":"Run by","t":"MoCA, implemented by AAI."},{"l":"Funded by","t":"A Regional Connectivity Fund levy plus VGF."}]}]},{"id":"GS39-airport-privatisation","line":"GS3.9","part":"Aviation","name":"Airport privatisation","own":true,"cards":[{"k":"define","q":"How are Indian airports privatised?","text":"Airports are leased to private operators under Public–Private Partnership (PPP) concessions where the Airports Authority of India (AAI) retains ownership and receives the assets back upon expiry."},{"k":"for","q":"How has airport privatisation progressed, and what has it gained?","rows":[{"l":"Hub modernisation","t":"Delhi and Mumbai went private in 2006, with AAI keeping [[26%]]."},{"l":"Greenfield airports","t":"PPPs built Bengaluru and Hyderabad without budget strain."},{"l":"Second wave","t":"Six airports went to Adani in 2019 on 50-year leases."},{"l":"Bundling","t":"[[11]] AAI airports are bundled for monetisation in 2026."},{"l":"Non-aero revenue","t":"Retail and parking income cross-subsidise airport charges."}],"cue":"Hubs → greenfield → second wave → bundling → non-aero revenue."},{"k":"against","q":"What are the concerns with airport privatisation?","rows":[{"l":"Operator concentration","t":"GMR handles about [[43.5%]] of private airport traffic."},{"l":"Airline duopoly","t":"IndiGo and Air India control about [[90%]] of capacity."},{"l":"Conflict of interest","t":"Operators want to own airlines, now capped at [[10%]]."},{"l":"Flawed concessions","t":"Over-optimistic traffic forecasts caused disputes at Delhi and Mumbai."},{"l":"Higher fares","t":"User development fees push up airfares."}],"cue":"Concentration → duopoly → conflict → flawed concessions → fares."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Traffic-share bid caps","t":"Judge bids by traffic share, not airport count."},{"l":"Stronger AERA","t":"Link tariffs to service-quality benchmarks."},{"l":"Keep the 10% cap","t":"Limit operators' stakes in airlines and keep slots neutral."},{"l":"Better concessions","t":"Use realistic forecasts and per-passenger fees."},{"l":"Protect small airports","t":"Ring-fence capex for regional airports in bundles."}],"cue":"Bid caps → AERA → 10% cap → concessions → small airports."},{"k":"data","q":"What new rules govern aviation?","title":"Data","rows":[{"l":"Bharatiya Vayuyan Adhiniyam, 2024","t":"It replaced the Aircraft Act, 1934 with one unified framework."},{"l":"After the 2025 crash","t":"New rules let authorities remove obstacles near airports."}]}]},{"id":"GS39-aviation-safety-and-regulation","line":"GS3.9","part":"Infrastructure","name":"Aviation safety and regulation","own":true,"cards":[{"k":"define","q":"What is Aviation safety and regulation?","text":"The statutory rules and regulatory oversight that keep flying safe, led by the Directorate General of Civil Aviation (DGCA) under the Bharatiya Vayuyan Adhiniyam, 2024 (which replaced the Aircraft Act, 1934)."},{"k":"for","q":"What has improved in aviation safety and regulation?","rows":[{"l":"Modern law","t":"The 2024 Adhiniyam replaced the colonial 1934 Act."},{"l":"No overlap","t":"The DGCA now issues radio operator certificates instead of DoT."},{"l":"Obstacle rules","t":"2025 rules allow action against tall structures near aerodromes."},{"l":"Better pilot training","t":"Training is shifting to the simulator-based multi-crew licence."},{"l":"Global credibility","t":"India keeps US FAA Category 1 status."}],"cue":"New law → no overlap → obstacles → training → credibility."},{"k":"against","q":"What are the problems in aviation safety and regulation?","rows":[{"l":"Regulator understaffed","t":"Nearly [[40%]] of posts in key DGCA safety wings are vacant."},{"l":"Capacity strain","t":"Fleet growth outpaces runways and air traffic control."},{"l":"No independence","t":"The DGCA and AAIB sit under the ministry."},{"l":"Punitive culture","t":"Fear of blame deters voluntary error reporting."},{"l":"Fatigue-rule disruption","t":"Stricter rest rules caused cancellations without crew buffers."}],"cue":"Vacancies → capacity → no independence → blame culture → fatigue rules."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Autonomous regulators","t":"Give the DGCA and AAIB statutory and financial autonomy."},{"l":"Preventive surveillance","t":"Shift to risk-based audits under ICAO safety systems."},{"l":"Just culture","t":"Protect pilots and whistleblowers who report lapses."},{"l":"Obstacle zones","t":"Enforce zones and match fleet growth to ATC capacity."},{"l":"Training standards","t":"Rank flying schools, as the DGCA began in 2026."}],"cue":"Autonomy → prevention → just culture → obstacle zones → training."}]},{"id":"GS39-railway-reform","line":"GS3.9","part":"Railways","name":"Railway reform","own":true,"cards":[{"k":"list","q":"Why does railway reform matter?","rows":[{"l":"Freight backbone","t":"Rail carries most of India's heavy freight."},{"l":"Passengers","t":"About [[3 crore]] passengers a day."},{"l":"So","t":"Capacity, safety and finances must be reformed together."}]},{"k":"for","q":"What reforms are improving the Railways?","rows":[{"l":"Dedicated freight corridors","t":"About [[241]] freight trains run daily on the DFCs."},{"l":"Record cargo","t":"[[1,670 million]] tonnes were loaded in FY26."},{"l":"Modern trains","t":"[[162]] Vande Bharat trains are running."},{"l":"Fewer accidents","t":"Consequential accidents fell to [[11]] in 2025–26."},{"l":"Electrification","t":"[[99.1%]] of the broad gauge is electrified."}],"cue":"DFCs → record cargo → Vande Bharat → safety → electrification."},{"k":"against","q":"What still holds the Railways back?","rows":[{"l":"Thin finances","t":"An operating ratio of [[98.3%]] leaves almost no surplus."},{"l":"Lost freight share","t":"Freight subsidises passengers, so rail's share is stuck near [[27%]]."},{"l":"Saturated network","t":"Over half of high-density routes run at 100% or more."},{"l":"Safety gaps","t":"Kavach covers only about [[3,100]] route km."},{"l":"Slow station upgrades","t":"Only [[180]] Amrit Bharat stations were done by March 2026."}],"cue":"Finances → freight share → congestion → safety → stations."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Independent regulator","t":"Separate commercial and social roles, as the Bibek Debroy Committee advised."},{"l":"Rational fares","t":"End cross-subsidies to reach a [[45%]] freight share by 2030."},{"l":"Cargo terminals","t":"[[149]] Gati Shakti Cargo Terminals were running by August 2026."},{"l":"Kavach everywhere","t":"Deploy Kavach 4.0 and fill safety vacancies."},{"l":"Non-fare revenue","t":"Monetise land and stations through PPPs."}],"cue":"Regulator → fares → terminals → Kavach → non-fare revenue."},{"k":"data","rows":[{"l":"High-speed rail","t":"Seven corridors as growth connectors. (Budget 2026-27)"},{"l":"DFC lengths","t":"The Eastern DFC is 1,337 km and the Western 1,506 km."},{"l":"Kavach","t":"It stops a train that passes a red signal, with [[24,400 km]] under way."},{"l":"Safety fund","t":"Rashtriya Rail Sanraksha Kosh has [[₹1 lakh crore]]."},{"l":"Kakodkar Committee","t":"It recommended a statutory Railway Safety Authority."},{"l":"Bharat Gaurav","t":"Heritage tourism trains under Dekho Apna Desh."}],"q":"Which schemes and examples back up railway reform?"},{"k":"diagram","q":"Draw the dedicated freight corridors diagram (Railway reform)","g":{"dir":"LR","nodes":[["E","Eastern DFC 1,337 km"],["F","Freight moves off passenger lines"],["W","Western DFC 1,506 km"],["S","Faster freight, rail share up"],["P","More room for passenger trains"]],"edges":[["E","F",""],["W","F",""],["F","S",""],["F","P",""]]}},{"k":"data","q":"Which schemes and examples back up railway reform?","title":"Data","rows":[{"l":"Faster Kavach roll-out","t":"Speed up Kavach on high-density routes first."}]}]},{"id":"GS39-urban-transport-moving-people","line":"GS3.9","part":"Railways","name":"Urban transport: moving people","own":true,"cards":[{"k":"define","q":"What does the National Urban Transport Policy say?","text":"The National Urban Transport Policy (2006, revised 2014) says plan to move people, not vehicles: public transport, walking and cycling first."},{"k":"for","q":"What has improved in urban transport?","rows":[{"l":"Metro expansion","t":"The metro network reached about [[1,095 km]], third-largest in the world."},{"l":"E-buses","t":"PM e-Bus Sewa deploys [[10,000]] e-buses on PPP."},{"l":"One card","t":"The National Common Mobility Card works across transport modes."},{"l":"Transit-oriented development","t":"The 2017 Metro Policy links land use with transit."},{"l":"Less congestion","t":"Over [[1 crore]] people ride metros daily."}],"cue":"Metros → e-buses → one card → TOD → less congestion."},{"k":"against","q":"What is still wrong with urban transport?","rows":[{"l":"Too few buses","t":"Cities have barely a third of the buses they need."},{"l":"Last-mile gaps","t":"Some metros carry under [[50%]] of projected riders."},{"l":"Two-wheeler dominance","t":"Two-wheelers are over [[70%]] of city vehicles."},{"l":"Fragmented governance","t":"Many agencies plan transport without coordination."},{"l":"Exclusion","t":"Metro fares are steep for informal workers."}],"cue":"Few buses → last mile → two-wheelers → fragmentation → exclusion."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"UMTAs","t":"Set up unified transport authorities in million-plus cities."},{"l":"More buses","t":"Use [[₹20,000 crore]] under PM e-Bus Sewa with payment security."},{"l":"Walkable stations","t":"Build footpaths and cycle tracks within [[500]] metres of stations."},{"l":"Value capture","t":"Use TOD, higher FSI and congestion pricing to fund transit."},{"l":"Open ticketing","t":"Universalise One Nation One Card and open journey data."}],"cue":"UMTAs → buses → walkability → value capture → open ticketing."},{"k":"data","q":"What does the Metro Rail Policy 2017 require?","title":"Data","rows":[{"l":"Metro Rail Policy 2017","t":"Central aid needs a PPP component."}]}]},{"id":"GS39-infrastructure-led-growth","line":"GS3.9","part":"Infrastructure","name":"Infrastructure-led growth","own":true,"cards":[{"k":"define","text":"Spending on roads, rail, power, ports and digital networks that lifts growth by cutting costs and drawing in private investment.","q":"What is infrastructure-led growth?"},{"k":"for","rows":[{"l":"Growth multiplier","t":"Every ₹1 spent raises GDP by [[₹2.5–3.5]]."},{"l":"Competitiveness","t":"Logistics cost has fallen to about [[8%]] of GDP."},{"l":"Jobs","t":"Construction absorbs unskilled labour and lifts steel and cement."},{"l":"Regional inclusion","t":"Roads like PMGSY link lagging areas to markets."},{"l":"Foundation for growth","t":"China's infrastructure push shows how it lays the base."},{"l":"Local prosperity","t":"Roads raise land values and local business, like Chandigarh Airport Road."}],"q":"How does infrastructure drive growth?","cue":"Multiplier → competitiveness → jobs → inclusion → foundation → local prosperity."},{"k":"against","rows":[{"l":"Fiscal strain","t":"Public capex widens deficits, with debt above [[80%]] of GDP."},{"l":"Land and approvals","t":"Delays cause time and cost overruns, as with the bullet train."},{"l":"Skewed PPP risk","t":"Badly shared risk stalled BOT projects before HAM."},{"l":"Silos and maintenance","t":"Poor upkeep leaves idle assets and bridge collapses."},{"l":"Ecology and displacement","t":"Himalayan highways trigger landslides."}],"q":"What are the gaps in infrastructure-led growth?","cue":"Money → land → PPP → silos → ecology."},{"k":"value","rows":[{"l":"Data centres","t":"Capacity was about [[1,280 MW]] in June 2025, projected 4 GW by 2030."},{"l":"Two estimates","t":"The Survey also quotes Nasscom's 8 GW, so name the source."},{"l":"Data centre tax holiday","t":"Till 2047 for foreign cloud firms using Indian data centres. (Budget 2026-27)"},{"l":"Telecom vision","t":"Samaveshit, Viksit, Tvarit and Surakshit, meaning inclusive, developed, fast and safe."}],"q":"What new infrastructure areas does the Survey highlight?"},{"k":"value","q":"How can infrastructure-led growth be sustained?","rows":[{"l":"Synchronised planning","t":"Plan across ministries through PM Gati Shakti."},{"l":"New financing","t":"Use the National Monetisation Pipeline and InvITs."},{"l":"Rebalanced PPPs","t":"Speed up disputes and use HAM, as the Kelkar Committee advised."},{"l":"Faster land and clearances","t":"Digitise land records through SVAMITVA and DILRMP."},{"l":"Maintenance in contracts","t":"Build upkeep into contracts, as CDRI guidelines advise."}],"cue":"Plan → finance → PPP → land → maintain."}]},{"id":"GS39-smart-cities","line":"GS3.9","part":"Infrastructure","name":"Smart cities","own":true,"cards":[{"k":"define","q":"What are smart cities?","text":"Cities using technology and integrated planning to improve services, mobility, sanitation and governance."},{"k":"for","q":"Why does India need smart cities?","rows":[{"l":"Rapid urbanisation","t":"Urbanisation will reach about [[40%]] by 2030."},{"l":"Command centres","t":"All [[100]] mission cities have integrated command centres."},{"l":"Better streets","t":"Over [[1,700 km]] of smart roads were built."},{"l":"Design as nudge","t":"Good design and a few enforced rules build civic order, like the Metro."},{"l":"Circular cities","t":"Smart meters and water reuse, like Surat's industrial recycling."}],"cue":"Urbanisation → command centres → streets → nudges → circularity."},{"k":"against","q":"What problems do Indian cities face?","rows":[{"l":"Weak municipal finances","t":"Cities raise under [[0.6%]] of GDP in own revenue."},{"l":"Weak civic sense","t":"People see little value for their taxes, so they litter."},{"l":"Infrastructure lag","t":"Only [[28%]] of wastewater is treated."},{"l":"Messy governance","t":"Too many agencies and tight FSI force sprawl."},{"l":"Slums neglected","t":"Area-based projects ignore informal settlements."}],"cue":"Money → civic sense → infrastructure → governance → slums."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Municipal revenue","t":"Digitise property tax and use the [[₹1 lakh crore]] Urban Challenge Fund."},{"l":"Civic discipline","t":"Use design nudges and enforce a few clear rules."},{"l":"Global models","t":"Learn from Singapore's congestion pricing and Indore's sanitation."},{"l":"Empower mayors","t":"Use the 74th Amendment and liberalise FSI along transit."},{"l":"Upgrade slums in situ","t":"Give tenure security through PMAY-U 2.0 instead of demolition."}],"cue":"Revenue → discipline → models → mayors → slums."},{"k":"data","q":"What data and plans back up urban development?","title":"Data","rows":[{"l":"Investment need","t":"About [[₹70 lakh crore]] of urban infrastructure is needed by 2036."},{"l":"No master plans","t":"[[65%]] of urban settlements have no master plan."},{"l":"Planner shortage","t":"Only about 4,000 planner posts exist against 12,000 needed, and [[42%]] are vacant."},{"l":"Urban paradox","t":"Population grows faster than city infrastructure. (ES 2025-26)"},{"l":"City Economic Regions","t":"[[₹5,000 crore]] each over 5 years, in challenge mode. (Budget 2026-27)"},{"l":"Municipal bonds","t":"They have raised only about [[₹3,000 crore]], from a handful of cities."}]},{"k":"data","q":"How fast is India urbanising?","rows":[{"l":"Urbanisation","t":"From [[31%]] in 2011 to about 40% by 2030."}]}]},{"id":"GS39-smart-cities-mission-and-smart-villages","line":"GS3.9","part":"Infrastructure","name":"Smart Cities Mission and smart villages","own":false,"cards":[{"k":"define","text":"Smart Cities Mission (June 2015 – 31 March 2025): 100 cities, area-based development plus pan-city ICT solutions, run through special purpose vehicles (SPVs).","q":"What was the Smart Cities Mission?"},{"k":"for","rows":[{"l":"Projects done","t":"[[97%]] of 8,064 projects were completed by March 2026."},{"l":"Command centres","t":"All 100 cities have one, with over 83,000 CCTV cameras."},{"l":"Money released","t":"[[99.4%]] of the ₹47,652 crore Union outlay was released."}],"q":"What did the Smart Cities Mission achieve?","cue":"Projects done → command centres → money released."},{"k":"against","rows":[{"l":"Few finished","t":"Only [[18]] of 100 cities finished all projects by March 2025."},{"l":"Uneven SPVs","t":"Some SPVs wound up and handed projects to departments."},{"l":"Villages left out (2016 PYQ)","t":"The money went to 100 cities, not villages."}],"q":"Where did the Smart Cities Mission fall short?","cue":"Few cities finished, uneven SPVs, villages left out."},{"k":"value","rows":[{"l":"PURA","t":"Kalam's idea of urban amenities in rural areas."},{"l":"Rurban Mission (2016)","t":"300 rural clusters get urban facilities to curb migration."}],"title":"Smart villages","q":"What are the smart-village models?"}]},{"id":"GS310-ppp","line":"GS3.10","part":"","name":"PPP","own":true,"cards":[{"k":"define","q":"What is a PPP?","text":"A long-term contract (concession agreement) where the government and a private firm share the funding,risks, and rewards of an infrastructure project."},{"k":"for","q":"Why use PPPs for infrastructure?","rows":[{"l":"Private finance","t":"PPPs bring capital and skills beyond the budget."},{"l":"Big pipeline","t":"A 3-year PPP pipeline is worth over [[₹17 lakh crore]]."},{"l":"Risk sharing","t":"Each risk goes to the party best able to manage it."},{"l":"Faster execution","t":"Private partners speed up airport and station redevelopment."},{"l":"Capital recycling","t":"InvIT assets reached about [[₹6.2 lakh crore]] in FY25."}],"cue":"Private money → pipeline → risk sharing → speed → recycling."},{"k":"against","q":"Why do PPPs fail?","rows":[{"l":"Hidden liabilities","t":"Long-term guarantees and annuities burden future generations."},{"l":"Bankability gaps","t":"Socially vital projects cannot raise loans."},{"l":"Traffic risk","t":"Optimistic forecasts stalled BOT-toll highways."},{"l":"Rigid contracts","t":"One-size contracts lack renegotiation and dispute clauses."},{"l":"Fear of probes","t":"Officials avoid renegotiating for fear of corruption cases."}],"cue":"Hidden liabilities → bankability → traffic risk → rigid contracts → fear of probes."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Tailored risk sharing","t":"Use project-specific contracts and a PPP tribunal, as Kelkar advised."},{"l":"Credit support","t":"VGF plus a [[₹1,000 crore]] risk guarantee fund. (Budget 2026-27)"},{"l":"Better models","t":"Use HAM, InvITs and TOT to balance risk and recycle capital."},{"l":"Independent regulators","t":"Protect honest renegotiation from vigilance overreach."},{"l":"Fiscal disclosure","t":"Report contingent liabilities in the Budget."}],"cue":"Tailored risk → credit support → better models → regulators → disclosure."},{"k":"data","rows":[{"l":"PPP pipeline","t":"The Centre has [[232]] projects worth ₹13.2 lakh crore, states 620."},{"l":"Kelkar line","t":"PPP is about better service delivery, not escaping duty."},{"l":"Risk Guarantee Fund","t":"Partial credit guarantees to lenders during construction. (Budget 2026-27)"},{"l":"Kelkar Committee","t":"Report on revitalising PPPs, November 2015."}],"q":"What data, committees and examples back up PPPs?"},{"k":"data","rows":[{"l":"PPPAC","t":"Apex body appraising central PPPs, chaired by the DEA Secretary."},{"l":"IIPDF (2022)","t":"It pays for transaction advisers so projects become bankable."},{"l":"Rani Kamlapati station","t":"India's first PPP-redeveloped railway station, 2021 (2022 PYQ)."},{"l":"Delhi and Mumbai airports","t":"Revenue-share PPPs (2017 PYQ)."},{"l":"BOT vs TOT","t":"BOT builds and tolls, while TOT runs a built road for an upfront fee."}],"q":"What data, committees and examples back up PPPs?"},{"k":"diagram","q":"Draw the PPP models by who bears the risk diagram (PPP)","g":{"dir":"LR","nodes":[["E","EPC - government pays and owns"],["H","HAM - government pays 40% in construction, annuity later"],["B","BOT toll - private finances, collects tolls"],["T","TOT - private runs a built road for an upfront fee"]],"edges":[["E","H",""],["H","B",""],["B","T",""]]}}]},{"id":"GS310-bot-build-operate-transfer","line":"GS3.10","part":"","name":"BOT (Build-Operate-Transfer)","own":true,"cards":[{"k":"define","text":"The private developer builds and operates the asset for a concession period, recovers its cost from user charges such as tolls, then hands it over to the government.","q":"What is meant by BOT (Build-Operate-Transfer)?"}]},{"id":"GS310-epc-engineering-procurement-construction","line":"GS3.10","part":"","name":"EPC (Engineering-Procurement-Construction)","own":true,"cards":[{"k":"define","text":"The government pays a contractor to design and build; the government keeps the traffic and revenue risk.","q":"What is meant by EPC (Engineering-Procurement-Construction)?"}]},{"id":"GS310-ham-hybrid-annuity-model","line":"GS3.10","part":"","name":"HAM (Hybrid Annuity Model)","own":true,"cards":[{"k":"define","text":"A mix of EPC and BOT: the government pays part of the project cost during construction and the rest as fixed annuities over the operating period; the developer is not exposed to traffic risk.","q":"What is meant by HAM (Hybrid annuity Model)?"},{"k":"list","q":"How does HAM work?","rows":[{"l":"40% during construction","t":"The government pays [[40%]] of cost in five progress-linked instalments."},{"l":"60% by the developer","t":"The developer raises the rest through equity and loans."},{"l":"Annuities over 15 years","t":"The government repays that 60% in half-yearly annuities, with interest."},{"l":"Interest benchmark","t":"Interest is the top five banks' average MCLR plus [[1.25%]]."},{"l":"Toll stays with government","t":"NHAI collects tolls, so the developer bears no traffic risk."},{"l":"Developer maintains","t":"The developer maintains the road and gets separate O&M payments."}],"cue":"40% now → 60% developer → 15-year annuities → MCLR + 1.25% → toll to NHAI → developer maintains."},{"k":"list","q":"How does HAM differ from EPC and BOT?","rows":[{"l":"Who finances","t":"EPC is all government and BOT all private, while HAM splits it 40 to 60."},{"l":"Traffic risk","t":"The government bears it in EPC and HAM, the developer in BOT."},{"l":"Who collects toll","t":"The government in EPC and HAM, the developer in BOT."},{"l":"Who maintains","t":"The developer in BOT and HAM, the government after EPC."}],"cue":"Finance → traffic risk → toll → maintenance."},{"k":"for","q":"Why was HAM introduced, and what has it achieved?","rows":[{"l":"Revived private interest","t":"It drew developers back after BOT-toll projects stalled, from January 2016."},{"l":"No traffic risk","t":"Fixed annuities protect developers from wrong traffic forecasts."},{"l":"Lower equity need","t":"Developers put in only about [[12–15%]] of cost as equity."},{"l":"Backbone of highways","t":"HAM took about [[45–50%]] of NHAI awards over five years."},{"l":"Mostly on time","t":"Over [[75%]] of HAM projects studied were on time or on track."},{"l":"Built to last","t":"The builder maintains the road for 15 years, so it builds well."}],"cue":"Revived interest → no traffic risk → less equity → backbone → on time → built to last."},{"k":"against","q":"What are the problems with HAM?","rows":[{"l":"Fiscal burden","t":"The government funds most of the cost, raising NHAI's liabilities."},{"l":"Aggressive bidding","t":"Bids fell to average discounts of [[10–15%]] below NHAI estimates."},{"l":"Financial closure","t":"Very low bids leave some projects unable to raise loans."},{"l":"Land delays","t":"Work starts only after [[80%]] of land is ready, so acquisition stalls projects."},{"l":"Execution delays","t":"HAM projects worth up to [[₹1 lakh crore]] faced severe delays in FY25."},{"l":"No arbitration","t":"Revised contracts exclude arbitration, which developers oppose."}],"cue":"Fiscal burden → low bids → no loans → land → delays → no arbitration."},{"k":"value","q":"How has HAM been fixed, and what more is needed?","rows":[{"l":"Curb reckless bids","t":"Extra performance security now applies to bids over 10% below estimate."},{"l":"Stronger bidders","t":"Minimum net worth was raised to [[20%]] of project cost in 2025."},{"l":"Rating floor","t":"Bidders have needed at least a BBB credit rating since 2023."},{"l":"Harmonious substitution","t":"A stalled developer can now hand over to a new one (2026)."},{"l":"Delay compensation","t":"NHAI pays [[8%]] of unfinished work's value when it causes delay."},{"l":"Land first","t":"Award projects only after land and clearances are ready."}],"cue":"Curb bids → stronger bidders → rating floor → substitution → delay pay → land first."},{"k":"data","q":"What are the key HAM numbers?","rows":[{"l":"Launched","t":"NHAI began awarding HAM projects in January 2016."},{"l":"Scale","t":"Over [[11,000 km]] awarded under HAM in five years."},{"l":"Bid stress","t":"[[85]] of 130 projects in 2022–24 were bid below NHAI estimates."},{"l":"Mains line","t":"HAM shares risk sensibly, with traffic risk on government and construction on developers."}]}]},{"id":"GS310-vgf-viability-gap-funding","line":"GS3.10","part":"","name":"VGF (Viability Gap Funding)","own":true,"cards":[{"k":"define","text":"A government grant that makes an economically desirable but financially unviable PPP project bankable.","q":"What is meant by VGF (Viability gap Funding)?"},{"k":"value","rows":[{"l":"Grant size","t":"Up to [[20%]] from the Centre and 20% from states."},{"l":"Social infrastructure","t":"Up to 30% plus 30%."},{"l":"Spending","t":"[[₹8,100 crore]] up to 2024-25."}],"q":"What does the VGF scheme give?"}]},{"id":"GS310-invit-infrastructure-investment-trust","line":"GS3.10","part":"","name":"InvIT (Infrastructure Investment Trust)","own":true,"cards":[{"k":"define","text":"A trust that pools operating infrastructure assets and sells units to investors, so that the original owner can recycle capital into new projects.","q":"What is meant by InvIT (Infrastructure investment Trust)?"},{"k":"value","rows":[{"l":"InvIT assets","t":"About [[₹7.25–7.5 lakh crore]] expected for FY26."},{"l":"Road InvITs","t":"About ₹3 lakh crore, rising to [[₹3.9 lakh crore]] by March 2027."}],"q":"How big are InvITs?"}]},{"id":"GS310-tot-toll-operate-transfer","line":"GS3.10","part":"","name":"TOT (Toll-Operate-Transfer)","own":false,"cards":[{"k":"define","text":"The government leases an already-built, operating toll road to a private firm for an upfront payment; the firm collects tolls and maintains the road for the lease period.","q":"What is meant by TOT (Toll-Operate-Transfer)?"},{"k":"data","q":"How much has TOT contributed?","rows":[{"l":"Share","t":"TOT gave [[53%]] of NHAI's monetisation in FY19–FY25."}]}]},{"id":"GS310-concession-agreement","line":"GS3.10","part":"","name":"Concession agreement","own":true,"cards":[{"k":"define","q":"What is a concession agreement?","text":"The binding contract governing a Public–Private Partnership (PPP), defining who builds, finances, operates and maintains an infrastructure asset, for how long, and how risks, revenues and disputes are managed."},{"k":"for","q":"What are the gains from a good concession agreement?","rows":[{"l":"Risk allocation","t":"The developer takes construction risk, the government keeps land and clearances."},{"l":"Bankability","t":"Clear tariffs and annuities give investors predictable revenue."},{"l":"Service quality","t":"An independent engineer enforces performance standards."},{"l":"Shock protection","t":"Change-in-law and force-majeure clauses protect both sides."},{"l":"Orderly exit","t":"Clear termination payouts and handback standards protect taxpayers."}],"cue":"Risk → bankability → quality → shocks → exit."},{"k":"against","q":"What goes wrong with concession agreements?","rows":[{"l":"One-size templates","t":"Model agreements ignore project realities, as Kelkar noted."},{"l":"Hidden guarantees","t":"Undisclosed guarantees burden future budgets (2014 PYQ)."},{"l":"Bad traffic forecasts","t":"Aggressive projections stall projects."},{"l":"Renegotiation fear","t":"Officials fear vigilance probes."},{"l":"Weak exits","t":"Ambiguous termination clauses cause long arbitration."}],"cue":"Templates → guarantees → forecasts → fear → exits."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Balanced risk","t":"Give each risk to the party best able to bear it."},{"l":"Flexible tenure","t":"Match concession periods and indexed charges to cost recovery."},{"l":"Independent monitoring","t":"Enforce service levels and handback standards."},{"l":"Fast disputes","t":"Use clear triggers and a PPP adjudication tribunal."},{"l":"Full disclosure","t":"Report guarantees and annuities as contingent liabilities (2014 PYQ)."}],"cue":"Balance → flexibility → monitoring → disputes → disclosure."},{"k":"list","rows":[{"l":"Risk allocation","t":"Each risk to the party best able to bear it."},{"l":"Concession period","t":"Long enough to recover cost, short enough to avoid lock-in."},{"l":"Revenue model","t":"User charges, annuity or revenue share, with clear indexation."},{"l":"Performance standards","t":"Service benchmarks checked by an independent engineer."},{"l":"Change in law, force majeure","t":"Who pays if policy or nature changes the project."},{"l":"Termination and handback","t":"Compensation on early exit and the asset's return condition."},{"l":"Renegotiation and disputes","t":"A fair renegotiation window and quick dispute resolution."},{"l":"Fiscal disclosure","t":"Guarantees and annuities recorded as contingent liabilities (2014 PYQ)."}],"q":"What must a good PPP concession agreement cover?","cue":"Risk → period → revenue → standards → change in law → exit → renegotiation → disclosure."}]}],"say":[{"id":"s-eeg","topic":"GS31-jg","plain":"Growth adds too few jobs for each point of GDP.","term":"Lack of employment-elastic growth","meaning":"Each 1% of growth adds few jobs, because growth is led by capital-intensive sectors.","exam":"<b>Lack of employment-elastic growth</b> – total employment fell [[≈9 million]] between 2011-12 and 2017-18 (Mehrotra and Parida)."},{"id":"s-jrwp","topic":"GS31-jrwp","plain":"Jobs are being created, but they pay little and are poor quality.","term":"Job-rich, wage-poor growth","meaning":"Employment rises while real earnings stay flat.","exam":"<b>Job-rich, wage-poor growth</b> – female LFPR rose [[23.3%]] → [[41.7%]], mostly through rural self-employment."},{"id":"s-du","topic":"GS31-jrwp","plain":"People look employed, but their work adds nothing to output.","term":"Disguised unemployment","meaning":"More hands than the work needs; taking some away does not cut output.","exam":"<b>Disguised unemployment</b> – agriculture still employs [[46%]] of workers."},{"id":"s-sm","topic":"GS31-sm","plain":"Young people's skills don't match what firms need.","term":"Skill mismatch","meaning":"Graduates stay jobless while firms report vacancies.","exam":"<b>Skill mismatch</b> – youth are [[≈83%]] of the unemployed, [[65.7%]] of them educated (ILO–IHD 2024)."},{"id":"s-glut","topic":"GS31-jrwp","plain":"Too many graduates chasing too few good jobs.","term":"Graduate glut","meaning":"Degree-holders outnumber the high-end jobs available.","exam":"<b>Graduate glut</b> – underemployment of graduates despite low headline unemployment."},{"id":"s-rws","topic":"GS31-jrwp","plain":"Wages are rising, but prices rise just as fast.","term":"Real wage stagnation","meaning":"Inflation wipes out pay rises, so purchasing power stays flat.","exam":"<b>Real wage stagnation</b> – inflation has wiped out wage hikes."},{"id":"s-drm","topic":"GS31-dd","plain":"Working people's savings fund the country's investment.","term":"Domestic resource mobilisation","meaning":"Raising money for development from within the country: citizens' savings and taxes.","exam":"<b>Domestic resource mobilisation</b> – working-age savers give banks the funds to lend to business."},{"id":"s-clg","topic":"GS31-dd","plain":"The economy grows because people buy more.","term":"Consumption-led growth","meaning":"Growth driven by household spending.","exam":"<b>Consumption-led growth</b> – a massive young earning population buys more."},{"id":"s-tax","topic":"GS31-dd","plain":"More people end up paying taxes.","term":"Expanding the tax base","meaning":"More earners pay income tax and GST.","exam":"<b>Expanding the tax base</b> – more earners mean more direct and indirect tax."},{"id":"s-dis","topic":"GS31-dd","plain":"A young population without jobs becomes a source of unrest.","term":"Demographic disaster","meaning":"The dividend turns into a burden when the young stay jobless.","exam":"<b>Demographic disaster</b> – jobless, frustrated youth turn opportunity into social unrest."},{"id":"s-hh","topic":"GS31-dd","plain":"People eat enough but don't get enough nutrition.","term":"Hidden hunger","meaning":"Nutritional poverty: a lack of micronutrients even without calorie hunger.","exam":"<b>Hidden hunger</b> – India ranks [[100/122]] on the Global Hunger Index."},{"id":"s-aug","topic":"GS31-ai","plain":"AI makes each worker faster and better.","term":"Labour augmentation (productivity dividend)","meaning":"Technology adds to workers' output instead of replacing them.","exam":"<b>Labour augmentation</b> – AI as a co-worker: NITI Aayog's AI agri forecasts help small farmers."},{"id":"s-cog","topic":"GS31-ai","plain":"AI does the thinking jobs instead of people.","term":"Cognitive automation (substitution effect)","meaning":"AI replaces mental, white-collar work, not just manual work.","exam":"<b>Cognitive automation</b> – AI replaces the brain, threatening services-led growth."},{"id":"s-lag","topic":"GS31-ai","plain":"Old jobs disappear faster than people can retrain.","term":"Transition lag","meaning":"The gap between jobs lost to technology and workers reskilled for new ones.","exam":"<b>Transition lag</b> – old jobs go faster than retraining, causing structural unemployment."},{"id":"s-alg","topic":"GS31-ai","plain":"Apps monitor and control how workers work.","term":"Algorithmic management","meaning":"Software, not a manager, assigns, watches and rates workers.","exam":"<b>Algorithmic management</b> – gig platforms hyper-monitor workers (precarious work)."},{"id":"s-arb","topic":"GS31-gig","plain":"Companies call workers 'partners' to avoid labour laws.","term":"Regulatory arbitrage","meaning":"Structuring a business to slip between the rules.","exam":"<b>Regulatory arbitrage</b> – gig workers labelled 'independent partners' fall outside labour law."},{"id":"s-trap","topic":"GS31-gig","plain":"Platforms pay well at first, then cut pay once workers depend on them.","term":"Incentive trap","meaning":"Early bonuses lure workers in; later payouts are slashed.","exam":"<b>Incentive trap</b> – slashed payouts force [[12–14 hour]] days."},{"id":"s-vcm","topic":"GS31-gig","plain":"Firms pay only for work done, with no fixed salaries.","term":"Variable cost model","meaning":"Labour becomes a cost that rises and falls with demand.","exam":"<b>Variable cost model</b> – firms avoid fixed payroll by hiring per task."},{"id":"s-fric","topic":"GS31-gig","plain":"Being out of work for a short while between jobs.","term":"Frictional unemployment","meaning":"Temporary unemployment while workers move between jobs.","exam":"<b>Frictional employment solution</b> – gig work fills the gap between jobs."},{"id":"s-pink","topic":"GS31-flfpr","plain":"Women pay more to travel safely.","term":"Pink tax","meaning":"The extra cost women bear for safety, here on transport.","exam":"<b>Pink tax</b> – the cost of safe mobility keeps women out of work."},{"id":"s-ihb","topic":"GS31-flfpr","plain":"Women getting more say in family decisions.","term":"Intra-household bargaining power","meaning":"A member's influence over household choices, which rises with her own income.","exam":"<b>Intra-household bargaining power</b> – earning women gain a say at home (gender equity)."},{"id":"s-ie","topic":"GS31-flfpr","plain":"As family income rises, women stop working.","term":"Income effect (U-shaped female LFPR)","meaning":"Higher household income lets families withdraw women from work, often because of social stigma.","exam":"<b>Income effect</b> – moderately educated women drop out as incomes rise: a U-shaped curve."},{"id":"s-ill","topic":"GS31-meas","plain":"One hour of work a week counts as being employed.","term":"Statistical illusion of employment","meaning":"A measure so loose that it hides underemployment.","exam":"<b>Statistical illusion of employment</b> – under CWS, [[one hour]] a week counts as employed."},{"id":"s-leak","topic":"GS31-emn","plain":"Students go abroad and never come back.","term":"Demographic dividend leakage","meaning":"Part of the young workforce is lost to brain drain.","exam":"<b>Demographic dividend leakage</b> – the education–migration nexus; remittances shift towards advanced economies (ES 2025-26)."},{"id":"s-lpe","topic":"GS31-lpe","plain":"Everyone works hard, but output per worker stays flat.","term":"Low-productivity equilibrium","meaning":"A stuck state where effort does not raise value added.","exam":"<b>Low-productivity equilibrium</b> – bolting AI onto old systems raises effort, not output (ES, AI chapter)."},{"id":"s-dwarf","topic":"GS31-jg","plain":"Labour laws made firms stay small.","term":"Dwarf firms","meaning":"Firms that stay below size thresholds to avoid regulation.","exam":"<b>Dwarf firms</b> – the old [[100-worker]] permission threshold kept firms small (ES 2018-19)."},{"id":"s-0","topic":"GS31-niti-aayog-vs-planning-commission","plain":"Centre and states make policy together.","term":"Cooperative federalism","meaning":"States co-create policy with the Centre instead of approving top-down plans.","exam":"<b>Cooperative
