<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GS3 Flashcards</title>
<style>
:root{
  --bg:#f4f2ed; --card:#ffffff; --ink:#1c1c1e; --ink2:#55565c; --ink3:#8a8b91;
  --line:#e6e3dc; --strip:#eeebe4; --strip2:#e4e0d7;
  --accent:#2f4bb5; --accent-soft:#e8ecfa;
  --for:#2b7a58; --for-soft:#e5f2ec;
  --against:#b0502a; --against-soft:#f8ebe4;
  --value:#6b4fae; --value-soft:#efeaf8;
  --define:#3f5568; --define-soft:#e8edf1;
  --data:#8a6516; --data-soft:#f6efdc;
  --say:#2f4bb5; --say-soft:#e8ecfa;
  --draw:#0f766e; --draw-soft:#e1f2ef;
  --fig:#1c1c1e; --fig-bg:#f3e7c4;
  --warn:#9a6a00;
  --good:#2b7a58; --bad:#b0502a;
  --shadow:0 1px 2px rgba(20,20,30,.05),0 8px 28px rgba(20,20,30,.07);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121315; --card:#1b1d20; --ink:#ececee; --ink2:#b3b5bb; --ink3:#7f828a;
    --line:#2b2e33; --strip:#24272c; --strip2:#2c3036;
    --accent:#8ea2f2; --accent-soft:#232a44;
    --for:#6cc79e; --for-soft:#1c2e27;
    --against:#ec9a76; --against-soft:#33231c;
    --value:#b7a2ee; --value-soft:#2a2440;
    --define:#a9bccb; --define-soft:#232a30;
    --data:#e2bd67; --data-soft:#30291a;
    --say:#8ea2f2; --say-soft:#232a44;
    --draw:#5fd0c0; --draw-soft:#1a2e2b;
    --fig:#f4ead0; --fig-bg:#4a3f22;
    --warn:#e2bd67;
    --good:#6cc79e; --bad:#ec9a76;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus{outline:none}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rw,.cue{scroll-margin-bottom:120px;scroll-margin-top:16px}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom))}

/* header */
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:4px 2px 14px}
header h1{font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:.2px;margin:0}
header .sub{font-size:13px;color:var(--ink3)}
.controls{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--strip);border-radius:10px;padding:3px;gap:2px;flex:1 1 auto}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 10px;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
select{font:inherit;font-size:13.5px;border:0;background:var(--strip);color:var(--ink);border-radius:10px;padding:8px 10px}
.progress{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink3);margin:2px 2px 0}
.bar{flex:1;height:5px;border-radius:5px;background:var(--strip);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .k{background:var(--good)} .bar .m{background:var(--bad)}
.legend b{color:var(--ink2);font-weight:600}

/* card */
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line);padding:22px 22px 18px;min-height:340px;position:relative;transition:transform .18s ease,opacity .18s ease}
.card.flipping{transform:scale(.985);opacity:.4}
.kicker{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:14px}
.front{display:flex;flex-direction:column;min-height:290px;cursor:pointer}
.front .ttl{font-family:var(--serif);font-size:30px;line-height:1.2;font-weight:600;margin:28px 0 14px}
.front .plain{font-family:var(--serif);font-size:24px;line-height:1.35;margin:26px 0 14px}
.front .plain:before{content:"“"} .front .plain:after{content:"”"}
.front .hint{margin-top:auto;font-size:13px;color:var(--ink3);display:flex;justify-content:space-between;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650;letter-spacing:.03em;padding:4px 10px;border-radius:999px;width:max-content}
.chip.define{color:var(--define);background:var(--define-soft)}
.chip.for{color:var(--for);background:var(--for-soft)}
.chip.against{color:var(--against);background:var(--against-soft)}
.chip.value{color:var(--value);background:var(--value-soft)}
.chip.data{color:var(--data);background:var(--data-soft)}
.chip.say{color:var(--say);background:var(--say-soft)}
.chip.draw{color:var(--draw);background:var(--draw-soft)}
.dg{position:relative;margin:6px 0 4px;padding:4px 0}
.dg .lv{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:0 0 30px}
.dg .lv:last-of-type{margin-bottom:4px}
.dg .nd{background:var(--card);border:1.5px solid var(--draw);color:var(--ink);border-radius:10px;padding:7px 11px;font-size:14px;line-height:1.3;text-align:center;max-width:46%;position:relative;z-index:1;animation:in .25s ease}
.dg .lv.one .nd{max-width:80%}
.dg .lv.many{flex-wrap:nowrap;gap:6px}
.dg .lv.many .nd{flex:1 1 0;max-width:none;font-size:12.5px;padding:6px 5px}
.dg svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.dg svg path{fill:none;stroke:var(--ink3);stroke-width:1.4}
.dg svg text{font-size:11px;fill:var(--ink2);font-family:var(--sans)}
.drawhint{font-size:12.5px;color:var(--ink3);margin:2px 0 10px}
.subtitle{font-size:14px;color:var(--ink2);margin-top:6px}
.topicname{font-size:13px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-top:22px}
.backhead .topicname{margin-top:4px}
.front .ttl.q{margin-top:8px;font-size:27px}
.draft{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.chiprow{display:flex;align-items:center;gap:8px;width:max-content}

.backhead{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.backhead .ttl{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.25}
.deftext{font-size:17px;line-height:1.6}

/* rows */
.rows{display:flex;flex-direction:column;gap:8px}
.rw{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:10px 12px;background:transparent;border:1px solid transparent;transition:background .2s}
.rw .n{flex:0 0 24px;height:24px;border-radius:50%;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;background:var(--strip2);color:var(--ink2);margin-top:1px;font-variant-numeric:tabular-nums}
.rw .body{flex:1;min-width:0}
.rw.s0{background:var(--strip);cursor:pointer}
.rw.s0 .body{height:24px;border-radius:6px;position:relative;overflow:hidden}
.rw.s0 .body:after{content:"";position:absolute;left:0;top:7px;height:10px;border-radius:5px;background:var(--strip2);width:var(--w,70%)}
.rw.s1{cursor:pointer;border-color:var(--line)}
.rw.s1 .more{margin-top:6px;height:8px;width:55%;border-radius:4px;background:var(--strip)}
.rw.s2{border-color:var(--line)}
.lbl{font-weight:650;font-size:16px;line-height:1.35;animation:in .22s ease}
.ln{font-size:15px;line-height:1.55;color:var(--ink2);margin-top:4px;animation:in .25s ease}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;animation:in .25s ease}
.src{font-size:11.5px;color:var(--ink3);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.unl{font-size:11.5px;color:var(--ink3);font-style:italic}
.fix{font-size:14.5px;margin-top:6px;color:var(--for);animation:in .25s ease}
.fix:before{content:"→ ";font-weight:700}
.note{font-size:12.5px;margin-top:6px;color:var(--warn);animation:in .25s ease}
.note:before{content:"⚑ "}
.fig{font-variant-numeric:tabular-nums;font-weight:650;color:var(--fig);background:var(--fig-bg);padding:0 4px;border-radius:4px;white-space:nowrap}
.rw.s0.next{outline:2px solid var(--accent-soft)}
@keyframes in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

.recall{font-size:12.5px;color:var(--ink3);margin:2px 2px 10px}
.cue{margin-top:16px;border-radius:12px;background:var(--accent-soft);padding:12px 14px;animation:in .35s ease}
.cue .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.cue .t{font-family:var(--serif);font-size:17px;line-height:1.45;margin-top:3px}
.cue .h{font-size:13px;letter-spacing:.04em;color:var(--ink2);margin-top:6px;font-weight:600}

/* say card back */
.term{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.2;margin:4px 0 8px;color:var(--say)}
.meaning{font-size:17px;line-height:1.55}
.exam{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.exam .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:4px}
.exam .t{font-size:16px;line-height:1.55}

/* action bar */
.actions{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
.actions .in{max-width:680px;margin:0 auto;display:flex;gap:6px}
.btn{white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;font-size:15px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--ink2);flex:0 0 auto}
.btn.primary{flex:1;background:var(--ink);color:var(--card);border-color:var(--ink)}
.btn.miss{flex:1;color:var(--bad)}
.btn.got{flex:1;color:var(--good)}
.btn:disabled{opacity:.35;cursor:default}
.btn kbd{font:inherit;font-size:11px;opacity:.5;margin-left:6px;font-weight:500}

.card.back{cursor:pointer}
.rw.s2{cursor:default}
.fliphint{margin-top:16px;font-size:12.5px;color:var(--ink3);text-align:center}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12px;color:var(--ink3);gap:8px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--ink3);text-decoration:underline;text-underline-offset:3px;font-size:12px;padding:4px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--card);font-size:13px;padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:.95}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:8;padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--card);border-radius:16px;padding:20px;max-width:360px;width:100%;box-shadow:var(--shadow)}
.modal h3{margin:0 0 6px;font-family:var(--serif)}
.modal p{margin:0 0 16px;color:var(--ink2);font-size:14.5px}
.modal .row{justify-content:flex-end}
.done{text-align:center;padding:30px 10px}
.done h2{font-family:var(--serif);margin:10px 0 6px}
.done p{color:var(--ink2);margin:0 0 20px}
.done .row{justify-content:center}
@media (max-width:520px){
  .btn kbd{display:none}
  .btn{padding:13px 10px}
  .btn.ghost{padding:13px 12px}
}
@media (max-width:420px){
  .front .ttl{font-size:26px}.front .plain{font-size:21px}.term{font-size:26px}
  .card{padding:18px 16px 16px}.seg button{padding:7px 6px;font-size:12.5px}
}

.selrow{display:flex;gap:8px}
.selrow select{flex:1 1 0;min-width:0;text-overflow:ellipsis}
.toggle{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;white-space:nowrap}
.toggle.on{background:var(--against-soft);color:var(--bad);border-color:transparent}
.toggle:disabled{opacity:.4;cursor:default}
.progress .legend{white-space:nowrap}
.sheet h3{margin:0 0 12px;font-family:var(--serif)}
.pl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.pl:first-of-type{border-top:0}
.pl .nm{font-size:14px;font-weight:600}
.pl .nm small{display:block;font-weight:400;color:var(--ink3);font-size:12px}
.pl .ct{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;text-align:right}
.pl .bar{grid-column:1 / -1}
.modal .box.wide{max-width:440px;max-height:82vh;overflow:auto}
.chip .ct{opacity:.7;font-weight:600}
.ktitle{font-size:13px;color:var(--ink2);margin-top:2px}
.rw .hd{font-size:11px;letter-spacing:.5px;text-transform:uppercase;font-weight:700;color:var(--against);margin-bottom:2px}
.rw.s0 .body.hb{height:auto}
.rw.s0 .body.hb:after{display:none}
.rw.s0 .body.hb .hd{margin:3px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="title">GS3 Flashcards</h1><span class="sub" id="subtitle"></span></header>
  <div class="controls">
    <div class="selrow">
      <select id="lineSel" aria-label="Syllabus line"></select>
      <select id="partSel" aria-label="Part"></select>
    </div>
    <div class="row">
      <div class="seg" id="typeSeg">
        <button data-v="all">All cards</button><button data-v="topic">Topic cards</button><button data-v="say">You want to say</button>
      </div>
    </div>
    <div class="row">
      <div class="seg" id="modeSeg">
        <button data-v="order">In order</button><button data-v="topics">Shuffle topics</button><button data-v="all">Shuffle all</button>
      </div>
    </div>
    <div class="progress">
      <div class="bar"><i class="k" id="pk"></i><i class="m" id="pm"></i></div>
      <span class="legend"><b id="nk">0</b> known · <b id="nm">0</b> missed · <b id="nn">0</b> new</span>
      <button class="toggle" id="missTgl">Missed only</button>
    </div>
  </div>
  <div id="stage"></div>
  <div class="foot">
    <button class="linkbtn" id="progBtn">Progress by line</button>
    <button class="linkbtn" id="resetBtn">Reset progress</button>
  </div>
</div>
<div class="actions"><div class="in" id="actions"></div></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box">
  <h3>Reset progress?</h3>
  <p>This clears every card's known and missed status and your place in the deck. It cannot be undone.</p>
  <div class="row"><button class="btn ghost" id="mCancel">Cancel</button><button class="btn miss" style="flex:0 0 auto" id="mOk">Reset</button></div>
</div></div>
<div class="modal" id="pmodal"><div class="box wide sheet" id="pbox"></div></div>
<script>
const DECK={"title":"GS3 Flashcards","subtitle":"Economy · GS3.1–3.10","lines":[{"id":"GS3.1","name":"GS3.1 Indian Economy and issues relating to Planning, Mobilization of Resources, Growth, Development and Employment","short":"Planning, growth, employment"},{"id":"GS3.2","name":"GS3.2 Inclusive Growth and issues arising from it","short":"Inclusive growth"},{"id":"GS3.3","name":"GS3.3 Government Budgeting","short":"Government budgeting"},{"id":"GS3.4","name":"GS3.4 Major Crops - Cropping Patterns in various parts of the country, - Different Types of Irrigation and Irrigation Systems; Storage, Transport and Marketing of Agricultural Produce and Issues and Related Constraints; E-technology in the aid of farmers","short":"Crops, irrigation, marketing"},{"id":"GS3.5","name":"GS3.5 Issues related to Direct and Indirect Farm Subsidies and Minimum Support Prices; Public Distribution System - Objectives, Functioning, Limitations, Revamping; Issues of Buffer Stocks and Food Security; Technology Missions; Economics of Animal-Rearing","short":"Subsidies, PDS, animal rearing"},{"id":"GS3.6","name":"GS3.6 Food Processing and Related Industries in India - Scope and Significance, Location, Upstream and Downstream Requirements, Supply Chain Management","short":"Food processing"},{"id":"GS3.7","name":"GS3.7 Land Reforms in India","short":"Land reforms"},{"id":"GS3.8","name":"GS3.8 Effects of Liberalization on the Economy, Changes in Industrial Policy and their Effects on Industrial Growth","short":"Liberalisation and industry"},{"id":"GS3.9","name":"GS3.9 Infrastructure: Energy, Ports, Roads, Airports, Railways etc.","short":"Infrastructure"},{"id":"GS3.10","name":"GS3.10 Investment Models","short":"Investment models"}],"topics":[{"id":"GS31-niti-aayog-vs-planning-commission","line":"GS3.1","part":"Planning","name":"NITI Aayog vs Planning Commission","own":false,"cards":[{"k":"define","text":"A policy think tank set up on 1 January 2015 by executive resolution to replace the Planning Commission, working through cooperative and competitive federalism.","q":"What is NITI Aayog?","ed":true},{"k":"list","q":"How is NITI Aayog structured differently from the Planning Commission?","rows":[{"l":"No fund allocation","t":"the power to allocate funds went back to the Finance Ministry"},{"l":"Governing Council","t":"PM and all CMs; replaced the dormant National Development Council"}]},{"k":"for","rows":[{"l":"Cooperative federalism","t":"states co-create policy in the Governing Council (10th meeting, May 2025: ‘Viksit Rajya for Viksit Bharat @2047’) instead of approving top-down plans"},{"l":"Competitive federalism","t":"state rankings (SDG India Index, Health Index, Composite Water Management Index) push states to improve"},{"l":"No one-size-fits-all","t":"state-specific strategies replace uniform five-year plans"},{"l":"Think tank, outcome monitor","t":"Aspirational Districts Programme, Atal Innovation Mission"},{"l":"Indicative planning","t":"suits a market economy better than allocation-led planning"}],"q":"Why is NITI Aayog an improvement on the Planning Commission?","cue":"Co-operate → compete → tailor → think → indicate: states plan with the Centre, race each other, get their own strategies, are monitored, and are guided rather than commanded."},{"k":"against","rows":[{"l":"No financial powers","t":"cannot fund states, so its advice lacks teeth","h":"Finance"},{"l":"Non-statutory","t":"exists by executive resolution, just as the Planning Commission did","h":"Rules and institutions"},{"l":"Think tank, not a do tank","t":"little role in implementation","h":"Rules and institutions"},{"l":"States’ trust deficit","t":"10 states and UTs skipped the 9th Governing Council meeting (2024) over Budget allocations","h":"Rules and institutions"}],"q":"Where does NITI Aayog fall short?","cue":"No money → no law → no execution → no trust."}]},{"id":"GS31-money-multiplier","line":"GS3.1","part":"Growth and development","name":"money multiplier","own":true,"cards":[{"k":"define","text":"The ratio of broad money (M3) to reserve money (M0), showing how banks multiply central-bank money by lending out deposits and keeping only a fraction as reserves.","q":"What is meant by money multiplier?","ed":true},{"k":"value","rows":[{"l":"Money multiplier (M3 ÷ M0) 6.2 (Dec 2025), up from 5.7","t":"a rising multiplier means better financial intermediation (ES 2025-26). Sources of broad money: net bank credit to government + bank credit to the commercial sector + net foreign exchange assets of banks + government currency liabilities − net non-monetary liabilities of the banking sector"}],"q":"What does the money multiplier show today?"}]},{"id":"GS31-double-deflation","line":"GS3.1","part":"Growth and development","name":"Double deflation","own":true,"cards":[{"k":"define","text":"Double deflation calculates an industry's true economic growth by independently removing the effect of inflation from both the raw materials it buys and the finished goods it sells.","q":"What is meant by double deflation?"}]},{"id":"GS31-gdp","line":"GS3.1","part":"Growth and development","name":"GDP","own":true,"cards":[{"k":"define","text":"GDP is the total monetary value of every final good and service produced within a country's borders in a single year.","q":"What is meant by GDP?"},{"k":"value","rows":[{"l":"Real GDP growth (ES 2025-26)","t":"FY25 [[6.5%]] (old series); FY26 [[7.4%]] (first advance estimate); FY27 projection [[6.8–7.2%]]. Q1 FY27 (Apr–Jun 2026) [[7.8%]]; RBI’s October 2026 projection for FY27: [[7.1%]]"},{"l":"Per-capita GDP (IMF, 2025)","t":"[[≈$2,800]] nominal; [[≈$12,000]] at PPP"}],"q":"What are India's latest growth numbers?"}]},{"id":"GS31-gdp-deflator","line":"GS3.1","part":"Growth and development","name":"GDP deflator","own":true,"cards":[{"k":"define","text":"Measures the change in prices of all final goods and services produced domestically: (Nominal GDP ÷ Real GDP) × 100.","q":"What is meant by GDP deflator?","ed":true},{"k":"list","q":"Why can the GDP deflator mislead?","rows":[{"l":"Low deflator flatters real growth","t":"FY25-26: WPI and CPI near zero, so real growth looks strong while nominal growth is weak"},{"l":"Nominal growth is what is felt","t":"it drives tax revenue, corporate earnings and wages, so the economy may feel weaker than the real number"},{"l":"WPI-based deflation criticised","t":"the new 2022-23 base series (released 27 Feb 2026) moves towards double deflation and updated CPI, WPI and PPI deflators"}]}]},{"id":"GS31-mclr","line":"GS3.1","part":"Growth and development","name":"MCLR","own":true,"cards":[{"k":"define","text":"Marginal Cost of Funds-based Lending Rate (April 2016): a bank’s internal benchmark, based mainly on its marginal cost of funds, below which it cannot lend.","q":"What is meant by MCLR?","ed":true},{"k":"list","q":"Why did MCLR weaken repo-rate transmission?","rows":[{"l":"Margins","t":"when the repo rate is cut, banks cut lending rates only if they can also cut deposit rates, to keep their margin"},{"l":"Sticky deposit rates","t":"small-savings schemes (post office, PPF) offer high administered rates; if a bank such as SBI cuts deposit rates, depositors shift to post offices"},{"l":"Result","t":"banks hold deposit rates, and therefore MCLR, so repo cuts pass through slowly"}]},{"k":"list","q":"What fixed MCLR’s transmission problem?","rows":[{"l":"EBLR","t":"External Benchmark-based Lending Rate, mandatory from 1 Oct 2019 for retail and MSME floating loans, usually repo-linked; transmission is much faster than on MCLR loans"},{"l":"Small-savings reset","t":"since 2016 small-savings rates reset quarterly, linked to G-sec yields"}]},{"k":"value","rows":[{"l":"Repo rate","t":"2025 easing of [[125 bps]] ([[6.5%]] → [[5.25%]]); 7 Oct 2026 hiked [[25 bps]] to [[5.5%]] with stance ‘calibrated tightening’ (rising food and energy prices). Now: repo [[5.5%]], SDF [[5.25%]], MSF [[5.75%]]; CRR cut by [[100 bps]] to [[3%]] (ES 2025-26)"}],"q":"Where is the policy rate now?"}]},{"id":"GS31-supply-driven-inflation","line":"GS3.1","part":"Growth and development","name":"Supply-driven inflation","own":true,"cards":[{"k":"define","text":"A rise in prices caused by supply shortages (bad weather, crop failure, import shocks) rather than excess demand.","q":"What is supply-driven inflation?","ed":true},{"k":"list","q":"Why is India’s inflation largely supply-driven?","rows":[{"l":"Food weight","t":"food and beverages carried [[≈46%]] weight in the old CPI ([[36.75%]] in the new 2024 series), so weather, pulses and vegetables drive headline inflation"},{"l":"Policy limit","t":"monetary policy cannot fix supply shocks"}]},{"k":"value","rows":[{"l":"CPI inflation","t":"[[2.1%]] in June 2025 (old 2012 series); historic lows in late 2025 ([[0.25%]] in Oct 2025); new CPI series (base 2024) launched Feb 2026 with 358 items and food weight cut to [[36.75%]]; latest [[5.5%]] (Sept 2026)"},{"l":"Vegetables and pulses","t":"are only [[8.4%]] of CPI weight (6.0 + 2.4), yet drove about a third of headline inflation in FY25"},{"l":"Tur (arhar)","t":"consumption [[≈4–4.5 MT]] a year against domestic output [[≈3.4–3.6 MT]]; the gap is met by imports (Mozambique, Malawi, Myanmar, Tanzania), so prices depend on foreign supply","unlikely":true},{"l":"MPC track record","t":"formally failed the target in 2022 (inflation above [[6%]] for 3 consecutive quarters; RBI had to report to the government); undershot the [[2%]] floor in late 2025 when food prices collapsed. Transmission is weak because of sticky deposit rates (see MCLR), weak credit demand at times, and banks parking surplus funds in the Standing Deposit Facility (SDF)"}],"q":"What do the inflation numbers show?"},{"k":"diagram","q":"Draw the diagram: supply-driven inflation and monetary policy","g":{"dir":"LR","nodes":[["A","Supply shock - monsoon, imports"],["B","Food prices"],["C","Headline CPI"],["D","MPC sets repo"],["E","Transmission - EBLR, MCLR"],["F","Demand and credit"]],"edges":[["A","B",""],["B","C",""],["C","D",""],["D","E",""],["E","F",""]]}}]},{"id":"GS31-potential-gdp","line":"GS3.1","part":"Growth and development","name":"Potential GDP","own":false,"cards":[{"k":"define","text":"The highest output an economy can sustain over time when labour and capital are fully used, without accelerating inflation.","q":"What is meant by potential GDP?"},{"k":"list","q":"What is the output gap?","rows":[{"l":"Above potential","t":"actual GDP above it means overheating and inflation"},{"l":"Below potential","t":"slack: a negative output gap"},{"l":"India","t":"potential growth put at [[≈7%]] (ES 2025-26)"}]},{"k":"for","rows":[{"l":"Demographic dividend","t":"a large working-age population expands labour supply"},{"l":"Capital formation","t":"investment builds the capital stock (GFCF [[≈30%]] of GDP, ES 2025-26)"},{"l":"Productivity gains","t":"digital public infrastructure and formalisation raise total factor productivity"},{"l":"Infrastructure","t":"the public capex push lowers logistics costs"},{"l":"Structural reforms","t":"GST, IBC and the labour codes improve allocation of resources"}],"q":"What raises India's potential GDP?","cue":"People → capital → productivity → roads → rules: more workers, more machines, better use of both, cheaper movement, better allocation."},{"k":"against","rows":[{"l":"Weak private investment","t":"capacity utilisation [[≈75%]], below the [[≈80%]] that usually triggers fresh capex (RBI OBICUS)","h":"Finance"},{"l":"Skills and participation","t":"only [[4.9%]] of youth formally skilled (ES 2025-26); low female LFPR","h":"People and skills"},{"l":"Export weakness","t":"only [[1.8%]] of global merchandise exports (ES 2025-26)","h":"Markets"},{"l":"Low R&D","t":"GERD [[≈0.64%]] of GDP (ES 2025-26)","h":"Technology"},{"l":"Regulatory burden","t":"compliance load and slow contract enforcement deter firms from scaling up","h":"Rules and institutions"}],"q":"What holds India's potential GDP down?","cue":"Each AGAINST switches off one FOR engine: no private capex (capital), no skills (people), no exports (demand), no R&D (productivity), red tape (rules)."},{"k":"value","rows":[{"l":"GFCF","t":"[[≈40%]]+ of GDP in China; PFCE [[61.5%]] of GDP in FY26, highest since FY12 (Notebook 2)"},{"l":"Private corporate investment","t":"has picked up since FY22 but is still below its 2011-12 share of GDP (Notebook 2)"},{"l":"Private investment","t":"rose [[≈66%]] between FY22 and FY25 (Notebook 2)"}],"q":"What do investment numbers say about potential growth?"},{"k":"diagram","q":"Draw the diagram for Potential GDP","g":{"dir":"LR","nodes":[["I","Investment"],["K","Capital stock"],["P","Potential GDP"],["L","Labour and skills"],["T","Technology and R and D"],["R","Reforms and institutions"]],"edges":[["I","K",""],["K","P",""],["L","P",""],["T","P",""],["R","P",""]]}}]},{"id":"GS31-gdp-base-year-revision","line":"GS3.1","part":"Growth and development","name":"GDP base year revision","own":false,"cards":[{"k":"define","text":"A periodic shift of the reference year whose prices are used to measure ‘real’ GDP, together with updated data sources and methods.","q":"What is meant by GDP base year revision?"},{"k":"list","title":"2015 revision (base 2004-05 → 2011-12)","rows":[{"l":"Headline measure changed from GDP at factor cost to GDP at market prices; sectors shown as GVA at basic prices","t":"GDP = GVA at basic prices + product taxes − product subsidies"},{"l":"MCA-21 database of the Ministry of Corporate Affairs replaced the RBI sample of firms for the private corporate sector","t":""},{"l":"Aligned India with the UN System of National Accounts","t":"(SNA) 2008"}],"q":"What changed in the 2015 GDP base-year revision?"},{"k":"list","title":"2026 revision (base 2011-12 → 2022-23)","rows":[{"l":"2022-23 chosen as the most recent ‘normal’ year after COVID","t":""},{"l":"New data","t":"GST returns, PFMS, vehicle registration (e-Vahan), annual surveys such as ASUSE and PLFS"},{"l":"Double deflation in manufacturing and agriculture; Supply-Use Table framework","t":""},{"l":"FY26 growth revised to [[7.6%]]; back series","t":"(pre-2022-23) due by December 2026"}],"q":"What changed in the 2026 GDP base-year revision?"},{"k":"for","rows":[{"l":"Captures structural change","t":"services, digital trade and unincorporated enterprises measured better"},{"l":"Better real growth estimate","t":"double deflation separates output and input prices"},{"l":"Global comparability","t":"follows UN SNA standards"},{"l":"Uses PLFS","t":"informal-sector measurement now linked to PLFS"}],"q":"Why revise the GDP base year?","cue":"Capture → correct → compare."},{"k":"against","rows":[{"l":"Credibility debate","t":"the 2015 series raised growth sharply and MCA-21 data quality was questioned"},{"l":"Blind to quality of life","t":""},{"l":"Overshadows real indicators","t":"an all-encompassing growth number takes attention from indicators like HDI"},{"l":"Data reliability","t":"source gaps remain until the sources themselves are fixed"},{"l":"Masks inequality","t":"aggregates and per-capita averages hide income and wealth concentration (rising Gini, K-shaped recovery)"},{"l":"Ecologically blind","t":""},{"l":"Comparability gap","t":"long-run comparisons are hard until the back series is out"},{"l":"Informal sector proxies","t":"formal data such as GST can overstate informal activity"},{"l":"Infrequent revision","t":"the base moved only after [[11 years]]; the National Statistical Commission recommends about every five years"},{"l":"Partial double deflation","t":"only manufacturing and agriculture, not services (over half of GDP)"},{"l":"Revision shocks","t":"each revision reshapes recent growth (FY26 [[7.4%]] → [[7.6%]]) and the GDP denominator, so deficit and debt ratios shift"}],"q":"What are the concerns with base-year revisions?","cue":"Credibility debate → Blind to quality of life → Overshadows real indicators → Data reliability → Masks inequality → Ecologically blind → Comparability gap → Informal sector proxies → Infrequent revision → Partial double deflation → Revision shocks."},{"k":"value","rows":[{"l":"New GDP series (base 2022-23)","t":"prepared with the Advisory Committee on National Accounts Statistics (ACNAS), chaired by Prof. B.N. Goldar, which recommended revising the base year from 2011-12 to 2022-23"}],"q":"Who prepared the new GDP series?"}]},{"id":"GS31-v-shaped","line":"GS3.1","part":"Growth and development","name":"V-shaped recovery","own":true,"cards":[{"k":"define","text":"A sharp fall followed by an equally quick rebound to the pre-crisis level.","q":"What is meant by V-shaped recovery?"},{"k":"list","q":"Why does a V-shaped recovery happen, and where was it seen?","rows":[{"l":"Cause","t":"a temporary external shock, not structural damage; pent-up demand returns fast"},{"l":"Example","t":"India after the 2020 lockdown: GDP fell [[≈23.9%]] in Q1 FY21, then grew over [[9%]] in FY22 on RBI liquidity, ECLGS and released demand (2021 Q11)"}]}]},{"id":"GS31-u-shaped","line":"GS3.1","part":"Growth and development","name":"U-shaped recovery","own":true,"cards":[{"k":"define","text":"A fall, then a long flat trough before output recovers.","q":"What is meant by U-shaped recovery?","ed":true},{"k":"list","q":"Why does a U-shaped recovery happen, and where was it seen?","rows":[{"l":"Cause","t":"balance-sheet damage (failing banks, household debt), so output stays at a long flat bottom while firms and families deleverage"},{"l":"Example","t":"the US after the 2008 financial crisis: 3–4 years of slow growth"}]}]},{"id":"GS31-w-shaped-double-dip","line":"GS3.1","part":"Growth and development","name":"W-shaped recovery (double dip)","own":true,"cards":[{"k":"define","text":"A recovery interrupted by a second fall before the final recovery (double dip).","q":"What is meant by W-shaped recovery (double dip)?","ed":true},{"k":"list","q":"Why does a W-shaped recovery happen, and where was it seen?","rows":[{"l":"Cause","t":"stimulus withdrawn too early, or a second shock"},{"l":"Example","t":"the Eurozone 2008–13: recovery in 2010, then austerity and 2011 ECB rate hikes brought the sovereign debt crisis and a second recession"}]}]},{"id":"GS31-l-shaped","line":"GS3.1","part":"Growth and development","name":"L-shaped recovery","own":true,"cards":[{"k":"define","text":"A sharp fall followed by prolonged stagnation, with output staying below its old trend for years.","q":"What is meant by L-shaped recovery?","ed":true},{"k":"list","q":"Why does an L-shaped recovery happen, and where was it seen?","rows":[{"l":"Cause","t":"a balance-sheet recession: firms repay debt instead of investing even at [[0%]] rates"},{"l":"Example","t":"Japan’s ‘lost decades’: the Bank of Japan’s 1989–90 hikes crashed land and stock prices by [[60–80%]]"}]}]},{"id":"GS31-k-shaped","line":"GS3.1","part":"Growth and development","name":"K-shaped recovery","own":true,"cards":[{"k":"define","text":"A recovery in which some groups (large formal firms, the well-off) rebound while others (informal workers, MSMEs, the poor) keep falling, widening inequality.","q":"What is meant by K-shaped recovery?","ed":true},{"k":"list","q":"Why does a K-shaped recovery happen, and where was it seen?","rows":[{"l":"Cause","t":"the shock speeds structural shifts that reward capital-rich, formal players and hurt labour-intensive, informal ones"},{"l":"Example","t":"post-COVID India: record corporate profits and luxury sales, weak two-wheeler and rural FMCG demand"}]}]},{"id":"GS31-swoosh-shaped","line":"GS3.1","part":"Growth and development","name":"Swoosh-shaped recovery","own":true,"cards":[{"k":"define","text":"A sharp fall followed by a slow, stretched-out climb back.","q":"What is meant by swoosh-shaped recovery?","ed":true},{"k":"list","q":"Where was a swoosh-shaped recovery seen?","rows":[{"l":"Example","t":"global aviation and tourism after COVID took nearly four years to pass 2019 levels"}]}]},{"id":"GS31-cbdc-and-monetary-sovereignty","line":"GS3.1","part":"Growth and development","name":"CBDC and monetary sovereignty","own":true,"cards":[{"k":"define","text":"CBDC: digital legal tender issued by the central bank (India: the RBI’s e₹, piloted since 2022). Monetary sovereignty: the state’s sole power to issue money and run monetary policy.","q":"What is a CBDC, and why does it matter for monetary sovereignty?","ed":true},{"k":"list","q":"How can private crypto or stablecoins erode monetary sovereignty?","rows":[{"l":"Parallel money","t":"private tokens compete with legal tender"},{"l":"Volatility","t":"price swings spill into the financial system"},{"l":"Capital flight","t":"easy cross-border transfers outside capital controls"},{"l":"Disintermediation of banks","t":"deposits move out of banks, shrinking credit"}]},{"k":"for","q":"What are the benefits of the e₹?","rows":[{"l":"Programmable money","t":"governments can lock funds to end-uses such as fertilisers or nutrition"},{"l":"Lower currency-management cost","t":"no printing"},{"l":"Frictionless cross-border settlement","t":""},{"l":"Wholesale settlement and tokenisation","t":"wholesale e₹ (e₹-W) for secondary-market government securities"},{"l":"Inclusion in low-connectivity zones","t":"offline use"}],"cue":"Programmable money → Lower currency-management cost → Frictionless cross-border settlement → Wholesale settlement and tokenisation → Inclusion in low-connectivity zones."},{"k":"against","q":"What are the risks and hurdles of the e₹?","rows":[{"h":"Finance","l":"Bank run risk","t":"in banking stress, depositors can shift funds instantly from bank accounts into risk-free RBI e₹ wallets"},{"h":"Infrastructure","l":"Offline hardware","t":"scaling offline NFC-based e₹ across rural India needs point-of-sale upgrades"},{"h":"Markets","l":"Low adoption","t":"UPI already does zero-fee retail transfers, and cross-border UPI links already offer an alternative to SWIFT, so the retail e₹ adds little for users"},{"h":"Technology","l":"Cyber target","t":"centralised sovereign currency infrastructure is a target for state-sponsored cyberattacks and quantum decryption threats"}],"cue":"Bank run risk → Offline hardware → Low adoption → Cyber target."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Wallet balance caps","t":"limit bank-run risk"},{"l":"UPI QR interoperability","t":"onboard non-bank payment operators"},{"l":"Token-based anonymity","t":"for micro-transactions"},{"l":"BIS Innovation Hub","t":"Project Rialto and Project Mandala"}]}]},{"id":"GS31-digitalisation-and-dpi","line":"GS3.1","part":"Growth and development","name":"Digitalisation and DPI","own":false,"cards":[{"k":"define","text":"Digital public infrastructure (DPI): open, interoperable digital rails built as public goods – identity (Aadhaar), payments (UPI), data sharing (DigiLocker, Account Aggregator) – together called the India Stack; ONDC extends it to e-commerce.","q":"What is meant by digitalisation and DPI?"},{"k":"for","rows":[{"l":"Payments at scale","t":"UPI is [[84%]] of India’s digital payment transactions and [[≈49%]] of global real-time payments; zero-MDR cuts merchant costs"},{"l":"Credit for MSMEs","t":"Account Aggregator and OCEN enable cash-flow-based lending to thin-file borrowers"},{"l":"Leak-proof welfare","t":"JAM trinity powers DBT, removing ghost beneficiaries"},{"l":"Tax buoyancy","t":"GST e-invoicing and digital trails widen the tax base without raising rates"},{"l":"Digital diplomacy","t":"cross-border UPI links (Singapore’s PayNow, UAE) and the G20 consensus on DPI"}],"q":"How has DPI transformed India's economy?","cue":"Payments at scale → Credit for MSMEs → Leak-proof welfare → Tax buoyancy → Digital diplomacy."},{"k":"against","rows":[{"l":"Jobless digital expansion","t":"The digital economy employs only [[≈14.7 million]] workers—creating high-skill value but limited mass employment, with AI/automation threatening routine IT-BPM jobs.","h":"People and skills"},{"l":"Last-mile connectivity deficit","t":"Unreliable rural broadband, power outages, and patchy optical-fibre reach restrict seamless digital access in remote regions.","h":"Infrastructure"},{"l":"Duopoly & systemic concentration","t":"Two private apps (PhonePe and Google Pay) control over [[80%]] of UPI volume, creating platform concentration risks and threatening smaller fintech players.","h":"Markets"},{"l":"Cyber-fraud, privacy & exclusion errors","t":"Rising financial cyber-scams, deepfakes, data-breach vulnerabilities, and biometric authentication failures risk denying essential welfare to vulnerable beneficiaries.","h":"Technology"},{"l":"Gender & socio-economic digital divide","t":"Rural households, women (sharp gender gap in smartphone ownership), and the elderly lag in digital and financial literacy, risking two-tier exclusion.","h":"Equity and sustainability"}],"q":"What are the limits and risks of DPI?","cue":"Jobless digital expansion → Last-mile connectivity deficit → Duopoly & systemic concentration → Cyber-fraud, privacy & exclusion errors → Gender & socio-economic digital divide."},{"k":"value","rows":[{"l":"Competition guardrails","t":"NPCI’s [[30%]] market-share cap on UPI apps; an MDR viability framework"},{"l":"Data protection and cyber-resilience","t":"DPDP Act, 2023 rules; Digital India Act; CERT-In"},{"l":"Last-mile infrastructure","t":"BharatNet; 5G and satellite broadband"},{"l":"Human-centric safeguards","t":"offline fallback for DBT authentication; PMGDISHA for women and seniors"},{"l":"Open protocols across sectors","t":"ONDC, Unified Health Interface, DEPA"},{"l":"UPI","t":"[[24,162 crore]] transactions in FY26, up ≈13,000-fold since FY17 (Ministry of Finance)"},{"l":"Internet connections","t":"[[25 crore]] (2014) → [[97 crore]] (2024) (ES 2025-26)"}],"q":"What numbers show India's digital scale?","title":"Solutions and data"},{"k":"diagram","q":"Draw the diagram for Digitalisation and DPI","g":{"dir":"TD","nodes":[["H","India Stack - DPI"],["A","Aadhaar - identity"],["U","UPI - payments"],["D","DigiLocker, Account Aggregator - data"],["O","ONDC - commerce"],["W","DBT through JAM"]],"edges":[["H","A",""],["H","U",""],["H","D",""],["H","O",""],["H","W",""]]}}]},{"id":"GS31-data-issues-related-to-gr","line":"GS3.1","part":"Growth and development","name":"Growth and development: key data","own":true,"cards":[{"k":"data","title":"Numbers","q":"What are the key numbers?","rows":[{"l":"The 2025 paradox","t":"growth above [[7%]], inflation at record lows, fiscal deficit [[4.8%]], yet strong fundamentals did not bring capital inflows and the rupee underperformed (ES 2025-26). Lowy Institute Power Gap Index gives India −4.0, i.e. operating below strategic potential"}]},{"k":"data","title":"Lines","q":"Which lines can you quote?","rows":[{"l":"‘Strong fundamentals did not bring capital inflows.’","t":"ES 2025-26"}]}]},{"id":"GS31-domestic-resource-mobilization","line":"GS3.1","part":"Mobilisation of resources","name":"Domestic resource mobilisation (DRM)","own":true,"cards":[{"k":"define","text":"Domestic Resource Mobilization (DRM) simply means raising money from within our own country (through citizens' savings and government taxes) to fund our own development, rather than relying on foreign loans or aid.","q":"What is meant by Domestic resource mobilisation (DRM)?"},{"k":"value","rows":[{"l":"Household net financial savings","t":"fell from [[≈11.5%]] of GNDI (FY21) to [[4.9%]] (FY23), a multi-decade low, as household borrowing rose; [[5.1%]] in FY24 (RBI)"},{"l":"Tax-to-GDP","t":"Centre’s gross tax [[≈11.7%]]; Centre plus states [[≈18–19%]]; OECD average [[≈34%]]. Roughly half of GVA comes from the informal sector, which narrows the tax base (Union Budget; OECD Revenue Statistics)"},{"l":"RBI surplus transfer","t":"[[₹2.7 lakh crore]] (RBI accounting year 2024-25, approved May 2025, received by the Centre in its FY26) and a record [[₹2.9 lakh crore]] (RBI year 2025-26, paid May 2026). Budget estimate for FY27: [[₹3.2 lakh crore]] from the RBI plus public-sector financial institutions, and [[≈₹75,000 crore]] in dividends from other PSUs"},{"l":"Disinvestment","t":"below [[₹10,000 crore]] in recent years, far short of targets (DIPAM)"},{"l":"Conclusion phrase","t":"‘Innovative financing mechanisms’ (Notebook 2)"},{"l":"Tax mobilisation through GST","t":"see GS3.3 → Keywords → Taxation (PYQs 2013, 2019, 2020 sit in GS3.3)"},{"l":"FfD4","t":"Sevilla Commitment (Compromiso de Sevilla), 30 June to 3 July 2025: aims to close the [[$4 trillion]] annual SDG financing gap"},{"l":"Black Money (Undisclosed Foreign Income and Assets)","t":"and Imposition of Tax Act, 2015: taxes undisclosed foreign income and assets ([[30%]] tax plus heavy penalty), with prosecution. Aim: curb stashing of black money abroad and bring such income into the tax net; works alongside automatic exchange of information under the Common Reporting Standard (CRS)"}],"q":"What numbers and steps show how India mobilises its own resources?"}]},{"id":"GS31-bop","line":"GS3.1","part":"Mobilisation of resources","name":"Balance of Payments (BoP)","own":true,"cards":[{"k":"define","text":"Balance of Payments (BoP): The master macroeconomic ledger recording all economic transactions between a country's residents and the rest of the world over a financial year.","q":"What is the Balance of Payments?"},{"k":"value","rows":[{"l":"Forex reserves","t":"[[$701.4 bn]], covering ≈11 months of imports (ES 2025-26)"}],"q":"How strong are India's forex reserves?"}]},{"id":"GS31-current-account","line":"GS3.1","part":"Mobilisation of resources","name":"Current Account","own":true,"cards":[{"k":"define","text":"The part of the balance of payments that records trade in goods and services, income and transfers with the rest of the world, without changing external assets or liabilities.","q":"What is meant by current account?","ed":true},{"k":"list","q":"What does the current account include?","rows":[{"l":"Visible trade","t":"export and import of physical goods"},{"l":"Services","t":"IT software, tourism"},{"l":"Income","t":"profits and interest earned or paid on past investments"},{"l":"Transfers","t":"remittances from NRIs, foreign grants"}]},{"k":"value","rows":[{"l":"Remittances","t":"India is the world’s largest recipient: [[$150.7 bn]] in 2025, more than twice Mexico (World Bank). Workers’ remittances alone crossed [[$100 bn]] for the first time: [[$110.5 bn]] in FY26, up [[26%]] (RBI). FY25: [[$135.4 bn]], [[≈3.5%]] of GDP; the shift is from the Gulf towards advanced economies (high-skilled migration); top sources US ([[27.7%]]), then UAE, UK, Singapore (ES 2025-26). Always state which measure"},{"l":"Why India’s cost of capital is high","t":"Why is India’s cost of capital high? A persistent current account deficit means dependence on foreign savings, so foreign investors demand a risk premium (ES 2025-26)"}],"q":"What sustains India's current account, and what does a deficit cost?"}]},{"id":"GS31-capital-account","line":"GS3.1","part":"Mobilisation of resources","name":"Capital account","own":true,"cards":[{"k":"define","text":"Records all cross-border transactions that create, alter, or liquidate external financial assets and liabilities. (eg. FDI, Borrowings, NRI bank deposits)","q":"What is meant by capital account?"},{"k":"value","rows":[{"l":"External debt","t":"[[$718.2 bn]] (Dec 2024), 21st worldwide and 11th in the G20; it stood at [[$746 bn]] in Sept 2025 (ES 2025-26)"}],"q":"How large is India's external debt?"}]},{"id":"GS31-asset-monetization-nmp-2-0","line":"GS3.1","part":"Mobilisation of resources","name":"Asset monetisation (NMP 2.0)","own":true,"cards":[{"k":"define","text":"The transfer of revenue-generating rights of mature, brownfield public infrastructure to private players for a fixed period—without transferring ownership—to raise upfront capital for greenfield projects.","q":"What is meant by asset monetisation (NMP 2.0)?"},{"k":"for","rows":[{"l":"Non-Debt Domestic Resource Mobilization (DRM)","t":""},{"l":"Brownfield-to-Greenfield Capital Recycling","t":""},{"l":"Operational Efficiency","t":"(O&M): Replaces public-sector inertia with private efficiency"},{"l":"Deepening Capital Markets","t":"Structured instruments like InvITs (Infrastructure Investment Trusts) and ToT (Toll-Operate-Transfer) attract \"patient capital\" from global pension and sovereign wealth funds"},{"l":"De-risking Private Investment","t":"Private investors only absorb operational risks"}],"q":"Why monetise public assets?","cue":"Cash without debt → recycle brownfield into greenfield → run old assets better → draw patient capital → leave only operating risk to the private side."},{"k":"against","rows":[{"l":"End-of-lease degradation","t":"without strict quality benchmarks, private operators tend to underinvest in late-stage maintenance","h":"Infrastructure"},{"l":"Value realisation and concentration risk","h":"Markets","t":""},{"l":"Regulatory cholesterol and tariff shocks","h":"Rules and institutions","t":""},{"l":"Contractual rigidities","t":"inflexible contracts","h":"Rules and institutions"},{"l":"Execution capacity overhang","t":"the entire model assumes the state can efficiently use the monetised funds to build new assets","h":"Rules and institutions"}],"q":"What are the risks of asset monetisation?","cue":"End-of-lease degradation → Value realisation and concentration risk → Regulatory cholesterol and tariff shocks → Contractual rigidities → Execution capacity overhang."},{"k":"value","rows":[{"l":"National Monetisation Pipeline (NITI Aayog)","t":"NMP 1.0 (FY22-25) raised [[≈₹5.3 lakh crore]] against a [[₹6 lakh crore]] target ([[≈89%]]); NMP 2.0 (FY26-30, launched Feb 2026) targets [[≈₹10 lakh crore]] within a [[₹16.7 lakh crore]] monetisation potential"}],"q":"How much has the National Monetisation Pipeline raised?"}]},{"id":"GS31-to-understand-market-division-in-governm","line":"GS3.1","part":"Mobilisation of resources","name":"Financial market divisions","own":true,"cards":[{"k":"define","text":"By the maturity of instruments, financial markets divide into the money market (short-term, up to one year, for liquidity) and the capital market (medium and long-term, for capital formation).","q":"How are financial markets divided?","ed":true},{"k":"list","title":"Four bases of classification","rows":[{"l":"Maturity","t":"money market / capital market"},{"l":"Stage of transaction (issue or trading)","t":"primary market / secondary market"},{"l":"Nature of instrument","t":"equity market: ownership instruments (shares); the investor becomes a shareholder; returns through dividends and capital gains; includes issuance and trading of equity shares / debt market: borrowing instruments (bonds and debentures); the investor becomes a creditor; returns primarily through interest; divided into the government securities market (government bonds and securities) and the corporate bond market (bonds issued by companies)"},{"l":"Specialised asset or contract","t":"foreign exchange market: currencies (USD/INR) / derivatives market: contracts deriving value from an underlying asset (futures and options); they can be based on shares, interest rates, currencies or commodities, so they are classified by the nature of the contract, not by maturity / commodity market: commodities and commodity contracts (gold, crude oil, wheat)"}],"q":"On what four bases are financial markets classified?","cue":"How long? When issued? Own or lend? What is traded?"},{"k":"list","title":"Money market instruments","rows":[{"l":"Treasury Bills (T-Bills)","t":"Short-term government securities"},{"l":"Commercial Paper (CP)","t":"Unsecured short-term borrowing by eligible companies"},{"l":"Certificate of Deposit (CD)","t":"Negotiable short-term deposit instrument issued by eligible banks and financial institutions"},{"l":"Call Money","t":"Overnight borrowing and lending"},{"l":"Notice Money","t":"Borrowing and lending for [[2–14 days]]"},{"l":"Term Money","t":"Borrowing and lending beyond [[14 days]], generally up to one year"},{"l":"Repo","t":"Borrowing against securities with an agreement to repurchase them"}],"q":"What are the main money market instruments?"}]},{"id":"GS31-corporate-bond-market","line":"GS3.1","part":"Mobilisation of resources","name":"Corporate Bond Market","own":true,"cards":[{"k":"define","text":"A disintermediated financial market where enterprises raise long-term capital directly from investors via debt instruments, bypassing traditional bank lending.","q":"What is meant by corporate bond market?"},{"k":"for","rows":[{"l":"Cures asset-liability mismatch","t":"bond markets provide the ‘patient capital’ needed for long-gestation projects"},{"l":"Prevents systemic banking crises","t":"keyword: twin balance sheet crisis"},{"l":"Frees up bank capital","t":""},{"l":"Faster monetary transmission","t":"no rigid lending rates"},{"l":"Domestic resource mobilisation (DRM)","t":"for the NIP"}],"q":"Why does India need a deep corporate bond market?","cue":"Long money for long projects → banks spared a crisis → bank capital freed → rates pass through → savings fund the NIP.","title":"Need"},{"k":"against","rows":[{"l":"Crowding-out effect","t":""},{"l":"Lower-rated firms shut out","t":"major institutional investors (EPFO, LIC) are bound by mandates to buy only top-rated (AAA/AA) bonds"},{"l":"Illiquid secondary market","t":"Indian investors treat bonds as buy-and-hold-till-maturity"},{"l":"Insolvency and Bankruptcy Code (IBC)","t":"recovery delays and high haircuts make investors wary"},{"l":"Bank-dominated legacy","t":"historically, the Indian financial system is bank-led"}],"q":"Why is India's corporate bond market underdeveloped?","cue":"Government borrows first, only AAA gets in, nobody trades, recovery is slow, and banks have always dominated.","title":"Why it is underdeveloped"},{"k":"value","rows":[{"l":"Regulatory nudging","t":"SEBI now mandates that Large Corporates (LCs) must raise at least [[25%]] of their incremental borrowings through the bond market"},{"l":"Financialisation of savings","t":"the explosion of debt mutual funds and the RBI Retail Direct Scheme has structurally deepened the demand side, bringing retail money into corporate debt"},{"l":"Instrument diversification","t":"the market has evolved beyond vanilla bonds into specialised instruments like InvITs"},{"l":"Corporate deleveraging","t":"after the Twin Balance Sheet cleanup, corporate balance sheets are the healthiest in a decade; rating upgrades make their bonds eligible for institutional investment"},{"l":"Hedging and liquidity architecture","t":"RBI and SEBI’s introduction of Credit Default Swaps (CDS) and the corporate bond repo market provides a safety net, letting investors hedge risks and boosting secondary-market liquidity"}],"q":"What is deepening the corporate bond market now?","title":"Why it is no longer underdeveloped"},{"k":"data","rows":[{"l":"Corporate bond market","t":"[[≈16%]] of GDP (SEBI, Feb 2026; NITI Aayog, Dec 2025: [[15–16%]]) against [[≈80%]] in South Korea; underdeveloped compared with South Korea, Malaysia and China"},{"l":"Budget 2026-27, markets","t":"corporate bond market-making framework (access to funds and derivatives on bond indices) and Total Return Swaps on corporate bonds","unlikely":true}],"q":"What data and examples back up Corporate Bond Market?"}]},{"id":"GS31-nbfc-s","line":"GS3.1","part":"Mobilisation of resources","name":"NBFCs","own":true,"cards":[{"k":"define","text":"Financial institutions that provide lending and credit services but lack a full banking license—meaning they cannot accept demand deposits (CASA) or issue cheques, and are not part of the payment and settlement system.","q":"What is meant by NBFCs?"},{"k":"for","rows":[{"l":"Last-Mile Financial Inclusion","t":""},{"l":"Niche Asset Specialization","t":""},{"l":"Unburdened by massive banking bureaucracy","t":""},{"l":"NBFCs boast a much lower Turnaround Time","t":"(TAT) for loan approvals"},{"l":"Funding Employment-Elastic Sector","t":""}],"q":"Why do NBFCs matter for the economy?","cue":"Reach the last mile → specialise → skip bureaucracy → approve fast → fund job-rich sectors."},{"k":"against","rows":[{"l":"Asset-liability mismatch (ALM)","t":"the classic trigger of the IL&FS crisis: NBFCs borrow short-term (mutual funds, commercial paper) to lend long-term (infrastructure, real estate); when short-term markets freeze they face immediate liquidity bankruptcy","h":"Finance"},{"l":"High cost of funds","t":"legally barred from accepting cheap CASA (current and savings account) deposits, NBFCs must raise capital at higher wholesale market rates","h":"Finance"},{"l":"Sub-prime asset quality","t":"their entire business model relies on lending to borrowers banks have rejected as ‘too risky’, so their loan books are highly sensitive","h":"Finance"},{"l":"Systemic contagion (the shadow banking risk)","t":"NBFCs do not operate in isolation: they borrow their capital directly from commercial banks and mutual funds, so if a massive NBFC collapses the shockwave hits the banks","h":"Markets"}],"q":"What makes NBFCs risky?","cue":"Asset-liability mismatch → High cost of funds → Sub-prime asset quality → Systemic contagion."},{"k":"value","rows":[{"l":"Scale-Based Regulatory (SBR) Framework","t":"to fix these vulnerabilities, the RBI recently shifted from a ‘light-touch’ approach to SBR: NBFCs are classified into Base, Middle, Upper and Top layers, with strict, bank-like regulations on the largest, on the principle that they are now ‘Systemically Important’ (Too Big To Fail)"},{"l":"Way forward on financial stability (RBI Governor)","t":"strengthen systemic resilience; understand new interconnected and external risks; monitor with granular data; build resilience across the whole ecosystem, not just banks; keep financial innovation anchored in trust"}],"q":"How has the RBI responded to NBFC risk?"}]},{"id":"GS31-total-return-swap-trs","line":"GS3.1","part":"Mobilisation of resources","name":"Total return swap (TRS)","own":true,"cards":[{"k":"define","text":"A contract in which party A receives the total return of a bond (interest plus price change) without owning it, and in return pays party B a fixed or floating rate.","q":"What is meant by total return swap (TRS)?"}]},{"id":"GS31-sdr","line":"GS3.1","part":"Mobilisation of resources","name":"Special Drawing Right (SDR)","own":true,"cards":[{"k":"define","text":"Special Drawing Right: an IMF international reserve asset (an artificial currency) whose value is based on a basket of currencies.","q":"What is meant by Special Drawing Right (SDR)?"}]},{"id":"GS31-gold-monetisation-scheme","line":"GS3.1","part":"Mobilisation of resources","name":"Gold Monetisation Scheme","own":false,"cards":[{"k":"define","text":"A 2015 scheme letting households and institutions deposit idle gold with banks to earn interest, putting it to productive use and cutting gold imports.","q":"What is meant by Gold Monetisation Scheme?","ed":true},{"k":"data","q":"What is the Gold Monetisation Scheme’s status now?","rows":[{"l":"Status","t":"medium- and long-term government deposits discontinued from 26 March 2025; banks may still offer short-term ([[1–3 year]]) deposits"}]},{"k":"for","rows":[{"l":"Domestic resource mobilisation","t":"puts locker gold to productive use"},{"l":"Lower import bill","t":"curbs fresh gold imports, easing the CAD and the rupee"},{"l":"Financialisation of savings","t":"shifts physical wealth into formal banking (counts toward CRR/SLR)"},{"l":"Tax-exempt income","t":"[[2.25%]] (medium-term) and [[2.5%]] (long-term) tax-free interest plus safe custody"},{"l":"Jewellery supply chain","t":"cheaper domestic gold to jewellers and exporters through Gold Metal Loans"}],"q":"Why mobilise idle household gold?","cue":"Domestic resource mobilisation → Lower import bill → Financialisation of savings → Tax-exempt income → Jewellery supply chain."},{"k":"against","rows":[{"l":"Exchequer price risk","t":"government bore gold-price risk on MLTGD; surging prices forced March 2025 exit","h":"Finance"},{"l":"Thin testing network","t":"shortage of BIS-certified purity-testing centres (CPTCs) and refineries outside metros","h":"Infrastructure"},{"l":"Weak uptake & bank friction","t":"high assaying/melting costs yielded only [[≈31 tonnes]] from [[≈5,700]] depositors (Nov 2024)","h":"Markets"},{"l":"Tax scrutiny fear","t":"hesitation over Income Tax inquiries on undocumented ancestral gold","h":"Rules and institutions"},{"l":"Cultural attachment","t":"reluctance to melt jewellery and lose [[10–25%]] making charges and heirloom value","h":"Equity and sustainability"}],"q":"Why did the Gold Monetisation Scheme fall short?","cue":"Exchequer price risk → Thin testing network → Weak uptake & bank friction → Tax scrutiny fear → Cultural attachment."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Scale bank-led short-term deposits","t":"link 1–3 year deposits to Gold Metal Loans, with no fiscal price risk"},{"l":"Expand CPTC reach","t":"accredit private jewellers and post offices in Tier-2/3 towns"},{"l":"Tax safe harbour","t":"clear KYC and exemption thresholds for small ancestral gold"},{"l":"Non-destructive products","t":"jewellery-backed credit or vault receipts without melting"},{"l":"Bullion exchange integration","t":"Electronic Gold Receipts and IIBX"}]}]},{"id":"GS31-disinvestment","line":"GS3.1","part":"Mobilisation of resources","name":"Disinvestment","own":true,"cards":[{"k":"define","q":"What is disinvestment?","text":"Sale of part or all of the government’s stake in public-sector enterprises: a non-debt capital receipt that also aims at better efficiency."},{"k":"data","q":"How has disinvestment performed?","rows":[{"l":"Shortfall","t":"below [[₹10,000 crore]] in recent years, far short of targets (DIPAM)"}]}]},{"id":"GS31-banking-npa-ibc","line":"GS3.1","part":"Mobilisation of resources","name":"Banking, NPAs and IBC","own":true,"cards":[{"k":"define","q":"What does the Insolvency and Bankruptcy Code do?","text":"The Insolvency and Bankruptcy Code, 2016 sets a creditor-in-control, time-bound resolution process, adjudicated through the NCLT, to clean up bad loans (NPAs)."},{"k":"for","q":"What has improved in banking and bad-loan resolution?","rows":[{"l":"Cleaner balance sheets","t":"bank GNPA [[1.8%]] (March 2026), a multi-decadal low, with strong capital buffers","src":"RBI FSR, June 2026"},{"l":"Creditor empowerment","t":"the credible threat of promoter displacement under IBC drove large pre-admission settlements"},{"l":"Bank governance reforms","t":"P.J. Nayak Committee (2014): Bank Investment Company, government stake below [[50%]], professional boards, market-linked pay; partly advanced through FSIB and EASE"},{"l":"Consolidation","t":"Narasimham Committee II (1998): bank mergers, tighter NPA and capital norms, ARCs; FSLRC (Justice B.N. Srikrishna, 2013) proposed a unified non-bank financial regulator"},{"l":"Bad bank and supervision","t":"NARCL–IDRCL isolates legacy stressed assets; Prompt Corrective Action curbs fresh NPAs"}],"cue":"Cleaner balance sheets → Creditor empowerment → Bank governance reforms → Consolidation → Bad bank and supervision."},{"k":"against","q":"What still holds bad-loan resolution back?","rows":[{"h":"Finance","l":"Steep haircuts, liquidation bias","t":"delays erode asset value: [[≈65–70%]] creditor haircuts and more liquidations than resolutions"},{"h":"Rules and institutions","l":"Slow resolution","t":"IBC cases average [[713 days]] against the [[330-day]] limit; NCLT pendency [[≈30,600]] cases, ≈10 years to clear","src":"ES 2025-26"},{"h":"Rules and institutions","l":"Pre-pack unused","t":"PPIRP (2021) has had only [[14]] admissions: complexity, low awareness, trust deficit, funding","src":"ES 2025-26"},{"h":"Rules and institutions","l":"Incomplete PSB autonomy","t":"core P.J. Nayak reforms (stake below 50%, independent boards) not implemented"},{"h":"Rules and institutions","l":"No group or cross-border insolvency","t":"conglomerate resolutions stall; cyber and operational risks rise in digital banking"}],"cue":"Steep haircuts, liquidation bias → Slow resolution → Pre-pack unused → Incomplete PSB autonomy → No group or cross-border insolvency."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Decongest NCLT","t":"fill vacancies, dedicated IBC benches, penalise frivolous promoter delays"},{"l":"Fix PPIRP","t":"simpler MSME pre-packs; out-of-court creditor-led resolution; NeSL data for instant proof of default"},{"l":"Group and cross-border insolvency","t":"amend IBC; adopt the UNCITRAL Model Law"},{"l":"Complete P.J. Nayak reforms","t":"empower FSIB; ring-fence PSB boards; speed up NARCL resolutions"},{"l":"Forward-looking supervision","t":"Expected Credit Loss provisioning; RBI’s DAKSH early-warning tools"}]}]},{"id":"GS31-data-issues-related-to-mo","line":"GS3.1","part":"Mobilisation of resources","name":"Mobilisation of resources: key data","own":true,"cards":[{"k":"data","title":"Numbers","q":"What are the key numbers?","rows":[{"l":"Market cap of NSE-listed companies","t":"[[over 130%]] of GDP, up from [[≈35%]] in FY95 (SEBI chairman, March 2026)"},{"l":"Demat accounts","t":"India leads in IPO issuances; [[235 lakh]] demat accounts added in FY26 (to Dec), taking the total above [[21.6 crore]] (ES 2025-26)"}]},{"k":"data","title":"Lines","q":"Which lines can you quote?","rows":[{"l":"Insurance","t":"‘Insurance for All by 2047’; life insurance dominates the sector (ES 2025-26)"},{"l":"AI-related stocks","t":"account for [[≈75%]] of S and P 500 returns since ChatGPT’s launch: a bubble risk for global markets (ES 2025-26)","unlikely":true}]},{"k":"data","title":"Government steps and committees","q":"Which government steps and committees apply?","rows":[{"l":"Securities Markets Code","t":"2025 replaces the SCRA, SEBI Act and Depositories Act (ES 2025-26)","unlikely":true}]}]},{"id":"GS31-dd","line":"GS3.1","part":"Employment","name":"Demographic dividend","own":true,"cards":[{"k":"define","q":"What is the demographic dividend?","text":"The economic growth boost that happens when a country's working-age population ([[15–59 years]]) is larger than its dependent population (children and the elderly)."},{"k":"for","q":"How does the demographic dividend boost growth?","rows":[{"l":"Domestic resource mobilisation","t":"Working people save in banks; those savings become the raw material banks lend to businesses."},{"l":"Consumption-led growth","t":"A massive young earning population buys more."},{"l":"Comparative advantage","t":"India has a massive, affordable labour supply."},{"l":"Expanding the tax base","t":"More earners pay more direct (income) and indirect (GST) taxes."},{"l":"Women enter the workforce","t":"As family sizes get smaller (falling fertility rates), women are freed from domestic care and can enter the workforce; [[55%]] female participation is needed for Viksit Bharat 2047."}],"cue":"More earners than dependants means more saving, more spending, cheap labour, more taxpayers, and women freed to work.","hook":"Save · Spend · Supply · Tax · Women"},{"k":"against","q":"Why might the dividend turn into a disaster?","rows":[{"l":"Human capital & skill deficit","t":"weak foundational learning (ASER) and outdated curricula create an acute industry–academia skill mismatch, worsened by AI/automation risks.","h":"People and skills"},{"l":"Hidden hunger & health drag","t":"persistent malnutrition (Global Hunger Index 2026: [[100]]/[[122,]] serious category; child wasting [[19%]]) impairs cognitive and physical productivity.","h":"People and skills"},{"l":"Jobless, capital-intensive growth","t":"rapid GDP growth is driven by capital- and skill-intensive sectors with low employment elasticity, failing to absorb millions entering the workforce annually.","h":"Markets"},{"l":"Informalisation & low-wage traps","t":"over [[85%]] unorganised employment traps youth in low-productivity jobs without social security or real wage growth.","h":"Rules and institutions"},{"l":"Gender & regional divergence","t":"care burdens and unsafe transit depress FLFPR, while southern states age rapidly before northern states complete their demographic transition.","h":"Equity and sustainability"}],"cue":"Human capital & skill deficit → Hidden hunger & health drag → Jobless, capital-intensive growth → Informalisation & low-wage traps → Gender & regional divergence.","hook":"No jobs · No skills · No food · No quality → Disaster"},{"k":"value","q":"What data backs the demographic dividend?","rows":[{"l":"Population","t":"[[≈1.5 bn]]; TFR 1.9, below the replacement level of 2.1.","src":"UNFPA 2025"},{"l":"Working-age share","t":"[[≈68%]] aged 15–64 (UNFPA); the Survey says the 15–59 group will exceed [[98 crore]] within [[10 years]] and the dividend peaks around 2030 at [[≈65%]] of the population. Not a true conflict (different age bands and sources): always state the band."}],"title":"Data"}]},{"id":"GS31-ai","line":"GS3.1","part":"Employment","name":"AI and jobs","own":true,"cards":[{"k":"for","q":"How will AI boost jobs and wages?","rows":[{"l":"Labour augmentation / productivity dividend","t":"AI makes workers faster and better."},{"l":"Innovation effect","t":"Entirely new sectors and occupations emerge."},{"l":"Democratising capabilities","t":"AI lets lower-skilled workers perform higher-level tasks, e.g. NITI Aayog used AI for agri forecasts that help small farmers."},{"l":"Solving structural inefficiencies","t":"Optimised logistics, agriculture and grids make the whole economy cheaper and faster."},{"l":"Shift to high-value human work","t":""}],"title":"Will boost jobs and wages","cue":"AI as a tool: it lifts each worker, creates new work, and frees people for higher-value tasks."},{"k":"against","q":"How will AI destroy and degrade jobs?","rows":[{"l":"Transition lag","t":"Old jobs vanish faster than workers can retrain: severe structural unemployment.","h":"People and skills"},{"l":"Vulnerability of services-led growth","t":"India needs to create [[78.5 lakh]] non-farm jobs (a year).","h":"Markets"},{"l":"Cognitive automation / substitution effect","t":"AI replaces the brain: [[68%]] of white-collar work to be automated in 5 years.","h":"Technology"},{"l":"Algorithmic management / precarious work","t":"Platforms such as gig apps use AI to hyper-monitor workers.","h":"Rules and institutions"},{"l":"Inequality trap","t":"AI software is owned by massive corporations; the financial gains flow to the owners of the technology (capital), while workers lose bargaining power and the wealth gap widens.","h":"Equity and sustainability"}],"title":"Will destroy and degrade jobs","cue":"Transition lag → Vulnerability of services-led growth → Cognitive automation / substitution effect → Algorithmic management / precarious work → Inequality trap."},{"k":"value","q":"What does the Economic Survey recommend on AI, and what data and example back it?","rows":[{"l":"Development-oriented approach","t":"Bottom-up: small models over large ones; the state builds an AI-OS to democratise access; open-source, interoperable models instead of black boxes; frugal AI for local problems (Bhashini); IT pivots from 'AI back office (fixing bugs)' to 'AI front office (designing from scratch)'.","src":"Economic Survey 2025-26 recommendations"},{"l":"Practical training from Class 11","t":"Earn credits through apprenticeships."},{"l":"Human-centric jobs","t":"Nursing and geriatric care, culinary sciences, advanced craftsmanship, physiotherapy."},{"l":"Calibrated regulation","t":"Accountable portability: tiered obligations."},{"l":"AI Economic Council","t":""},{"l":"Sovereign AI Safety Institute","t":"Mandatory public safety evaluations."},{"l":"Roadmap","t":"Phase 1 operationalisation and experimentation → Phase 2 selective scaling and formal regulation → Phase 3 long-term resilience."},{"l":"The pacing dilemma","t":"Rapid, uncalibrated AI adoption risks displacing workers, while delaying adoption risks a low-productivity equilibrium. So the question is not whether to adopt AI but how to pace it; the dilemma is that AI can make jobs scarcer.","src":"ES 2025-26"},{"l":"AI adoption (data)","t":"[[88%]] of organisations worldwide use AI in at least one business function; in US services AI has not cut jobs abruptly.","src":"McKinsey 2025; ES 2025-26"},{"l":"TCS layoffs (example)","t":"[[≈12,000]] jobs ([[2%]] of its workforce), July 2025: a signal of AI and automation."}],"title":"Economic Survey 2025-26 recommendations, data and example","cue":"Rapid, uncalibrated adoption displaces workers; delaying it risks a low-productivity equilibrium. So the question is not whether to adopt AI but how to pace it (ES 2025-26)."}]},{"id":"GS31-vbgramg","line":"GS3.1","part":"Employment","name":"VB-G RAM G (formerly MGNREGS)","own":true,"cards":[{"k":"define","q":"What is VB-G RAM G?","text":"The VB-G RAM G Act, 2025 replaced MGNREGA from 1 July 2026, guaranteeing [[125 days]] of rural work (up from 100).","ed":true},{"k":"data","q":"What should you know about VB-G RAM G?","rows":[{"l":"Full name","t":"Viksit Bharat-Guarantee for Rozgar and Ajeevika Mission (Gramin)"},{"l":"Person-days","t":"[[389 crore]] in the COVID year FY21 → [[184 crore]] (FY26, to Dec) (ES 2025-26)"}]}]},{"id":"GS31-tourism-orange","line":"GS3.1","part":"Employment","name":"Tourism or orange economy","own":true,"cards":[{"k":"define","q":"How does Budget 2026-27 use tourism (the orange economy) as a jobs driver?","text":"Budget 2026-27 treats tourism, the ‘orange’ or creative economy, as a jobs driver: a National Institute of Hospitality; upskilling [[10,000]] guides at [[20]] iconic sites; [[15]] archaeological sites to become experiential cultural destinations (e.g. Lothal, Dholavira, Rakhigarhi)."}]},{"id":"GS31-jrwp","line":"GS3.1","part":"Employment","name":"Job-rich, wage-poor growth","own":true,"cards":[{"k":"define","q":"What is job-rich, wage-poor growth?","text":"Employment numbers rise, but workers' purchasing power stays flat or falls, because the new jobs are mostly low-skill, informal or low-productivity."},{"k":"for","q":"Why are India's new jobs wage-poor?","rows":[{"l":"Disguised unemployment","t":""},{"l":"Platformisation of labour","t":"Gig work."},{"l":"Real wage stagnation","t":"Inflation has wiped out the wage hikes."},{"l":"Underemployment / skill mismatch","t":"The graduate glut: many professionals, but a lack of high-end corporate jobs."},{"l":"Low-productivity trap","t":"India skipped the labour-intensive manufacturing boom (textiles, toy factories), so the masses migrating from villages are absorbed into low-productivity, low-paying urban services (security guards, street vending)."}],"title":"Why the jobs are wage-poor","cue":"The jobs exist, but they are the wrong kind: hidden, gig, eaten by inflation, below workers' skills, and low-productivity."},{"k":"against","q":"What shows job quality and real wages are improving?","rows":[{"l":"Record EPFO payroll additions","t":"Formalisation of the workforce."},{"l":"PLI-driven factory wages","t":"A manufacturing renaissance."},{"l":"Wage convergence among the educated","t":"Gender wage gap just [[3%]] among unmarried, college-educated women."},{"l":"Niche skill premium","t":"AI and advanced manufacturing jobs pay higher salaries."},{"l":"Social safety-net minimums","t":"VB-G RAM G."}],"title":"Quality jobs and real wages are improving","cue":"Formal payrolls, factory wages, educated women and new skills show quality rising, with a guaranteed floor below."},{"k":"value","q":"Which scheme goes with job-rich, wage-poor growth?","rows":[{"l":"PM Viksit Bharat Rozgar Yojana (Employment Linked Incentive scheme)","t":"[[₹99,446 crore]] to incentivise over [[3.5 crore]] jobs created between 1 Aug 2025 and 31 Jul 2027, [[1.9 crore]] of them first-timers; up to [[₹15,000]] to first-time employees in two instalments, and incentives to employers with special focus on manufacturing.","src":"Ministry of Labour"}],"title":"Scheme and data"}]},{"id":"GS31-gig","line":"GS3.1","part":"Employment","name":"Gig economy","own":true,"cards":[{"k":"define","q":"What is the gig economy?","text":"A labour market where companies hire independent workers for short-term, task-based work, usually through digital apps, instead of permanent salaried jobs."},{"k":"for","q":"What does gig work offer?","rows":[{"l":"Frictional employment solution","t":"Covers frictional unemployment: temporary unemployment while workers move between jobs."},{"l":"Boosts female LFPR","t":""},{"l":"Variable cost model","t":"Firms avoid massive fixed payroll costs."},{"l":"Formalisation","t":""},{"l":"Decentralised growth (spatial equity)","t":"Platforms expand beyond the metros."}],"cue":"Flexible for workers and firms: it fills gaps, brings women in, cuts fixed costs, and spreads to small towns."},{"k":"against","q":"What are the problems with gig work?","rows":[{"l":"Incentive trap","t":"High early bonuses; once workers depend on the app, payouts are slashed and they work [[12–14 hours]] to survive.","h":"Markets"},{"l":"Dehumanisation of labour","h":"Technology","t":""},{"l":"Regulatory arbitrage","t":"Calling gig workers 'independent partners' to escape labour laws.","h":"Rules and institutions"},{"l":"Absence of collective bargaining","h":"Rules and institutions","t":""},{"l":"Social safety-net deficit","h":"Equity and sustainability","t":""},{"l":"Survey's concerns","t":"Outside financial inclusion, algorithmic control by platforms, need for reskilling.","src":"ES 2025-26"}],"cue":"Incentive trap → Dehumanisation of labour → Regulatory arbitrage → Absence of collective bargaining → Social safety-net deficit → Survey's concerns."},{"k":"value","q":"What data goes with the gig economy?","rows":[{"l":"Gig workers","t":"Over [[2%]] of the workforce.","src":"ES 2025-26"}],"title":"Data"}]},{"id":"GS31-su","line":"GS3.1","part":"Employment","name":"Structural unemployment","own":true,"cards":[{"k":"define","q":"What is structural unemployment?","text":"Unemployment caused when workers' skills, location or qualifications do not match the jobs available in the economy."}]},{"id":"GS31-flfpr","line":"GS3.1","part":"Employment","name":"Female LFPR","own":true,"cards":[{"k":"define","q":"What is female LFPR?","text":"The percentage of women aged [[15 and above]] who are either working or actively looking for work."},{"k":"for","q":"Why does a higher female LFPR matter?","rows":[{"l":"Macroeconomic expansion","t":"A female LFPR of [[≈55%]] by 2050 is needed for Viksit Bharat.","src":"ES 2025-26"},{"l":"Demographic and care dividend","t":"Falling fertility frees women from domestic care, so more of the working-age population enters work."},{"l":"Household income diversification","t":"A second earner lifts families out of vulnerability."},{"l":"Intra-household bargaining power","t":"Gender equity."},{"l":"SHG-led micro-capitalism","t":"Women's self-help groups turn passive savers into local business owners."}],"cue":"More women working means a bigger economy, safer households, a stronger say at home, and more women-run enterprises."},{"k":"against","q":"What holds women back from work?","rows":[{"l":"STEM & skill deficit","t":"low female representation in STEM and industry-aligned vocational training limits access to high-paying formal sectors.","h":"People and skills"},{"l":"Safety & mobility \"Pink Tax\"","t":"unsafe, poorly connected transit forces women to pay more for safe transport or forego distant jobs (ES [[2025–26]]).","h":"Infrastructure"},{"l":"Job-rich, wage-poor growth","t":"the surge from [[23.3%]] ([[2017–18]]) to [[41.7%]] ([[2023–24]]) reflects mostly low-productivity rural self-employment and unpaid family farm work rather than regular salaried jobs.","h":"Markets"},{"l":"The \"Missing Middle\" anomaly","t":"as household incomes rise above subsistence, moderately educated women exit work due to patriarchal status no
