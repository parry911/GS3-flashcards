itle":"Data","rows":[{"l":"Agri-extension through social media","t":"farmers increasingly learn through micro-learning formats such as Instagram reels and YouTube shorts; a low-cost complement to KVKs and Kisan Call Centres (Notebook 2)"},{"l":"Krishi Integrated Command and Control Centre (Ministry of Agriculture)","t":"a central hub for agricultural data and decision support (named in notebook; details not traced)"},{"l":"Meghdoot app","t":"location-, crop- and weather-based farm advice"},{"l":"Digital Agriculture Mission (Cabinet, 2 Sept 2024)","t":"[[₹2,817 crore]] (Centre [[₹1,940 crore]]); AgriStack (farmer, land and crop registries), Krishi Decision Support System, soil profile mapping, Digital Crop Survey. The target of [[11 crore]] Farmer IDs was reached on 23 Oct 2026, five months before the March 2027 deadline (Ministry of Agriculture)"}]}]},{"id":"GS34-nanotechnology-in-agriculture","line":"GS3.4","part":"E-technology for farmers","name":"Nanotechnology in Agriculture","own":true,"cards":[{"k":"define","q":"What is meant by nanotechnology in agriculture?","text":"Use of materials at the [[1–100]] nanometre scale in farming—including nano fertilisers (IFFCO’s nano urea, 2021 in [[500]] ml bottles; nano DAP), nano pesticides, nanosensors, and nano packaging."},{"k":"for","q":"What are the claimed benefits of nano fertilisers and nanotech?","rows":[{"l":"Cuts bulky fertiliser use and the subsidy bill","t":"one [[500]] ml bottle can replace a urea bag, potentially cutting subsidised urea use by [[50%]] (Parliamentary Standing Committee, March 2023)."},{"l":"Boosts nutrient uptake and cuts soil and water runoff via targeted foliar delivery and real-time nanosensors","t":"e.g. IFFCO nano urea and nano DAP"},{"l":"Slashes storage and transport costs since a [[500]] ml bottle is far easier to move than a heavy urea bag","t":""},{"l":"Extends shelf life and cuts post-harvest losses using antimicrobial nano coatings and smart packaging","t":""},{"l":"Backed by ready domestic manufacturing across six nano urea plants with a capacity of [[26.6 crore]] bottles a year (Rajya Sabha, July 2024)","t":""}],"cue":"Ultra-small particles deliver nutrients and protection directly to plants, slashing fertiliser subsidies, freight costs, and runoff."},{"k":"against","q":"Why is nano urea contested?","rows":[{"l":"Contested yield and nutrition results","t":"two-season PAU trials found [[50%]] soil nitrogen plus nano urea sprays cut wheat yields by [[≈21.6%]] and paddy by [[≈13%]], with grain nitrogen (protein) down up to [[17%]]."},{"l":"Weak regulatory vetting","t":"approvals leaned on manufacturer data, lacking independent multi-season trials and biosafety studies of nano nitrogen."},{"l":"Unknown long-term risks of nanoparticles accumulating in soil, water, and human health","t":""},{"l":"Higher net cost for farmers, as two bottles per spray plus hired labour can cost more than the granular urea saved","t":""},{"l":"Coercive market practices, with cooperatives forcing farmers to buy nano bottles alongside subsidised urea (Down To Earth ground reports)","t":""}],"cue":"Contested field yields, higher spraying costs, and missing long-term biosafety checks raise doubts over premature mass rollout."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Run independent, multi-season, multi-location trials on yield and grain protein before recommending fertiliser cuts (via ICAR and state agricultural universities)","t":""},{"l":"Strictly enforce biosafety, toxicity, and residue testing across soil, water, and food (under DBT’s 2020 Guidelines for Nano-Based Agri-Inputs)","t":""},{"l":"Ban forced tagging or bundling of nano bottles with subsidised urea at cooperatives and retail outlets","t":""},{"l":"Cut foliar spraying labour costs by linking nano inputs with shared drone services","t":"e.g. Namo Drone Didi and Custom Hiring Centres"},{"l":"Train farmers via Krishi Vigyan Kendras (KVKs) on correct dosage and balanced soil-plus-foliar nutrition","t":""}],"cue":"Mandate independent multi-season testing, stop forced bundling, and lower spraying costs before scaling adoption."}]},{"id":"GS35-food-inflation","line":"GS3.5","part":"Farm subsidies","name":"Food inflation","own":true,"cards":[{"k":"define","text":"A sustained rise in food prices; because food carries a large weight in the CPI basket, food shocks move headline inflation. Any shock to cropping patterns or supply feeds into inflation.","q":"What is food inflation, and why does it matter so much in India?"},{"k":"list","rows":[{"l":"Rain dependence","t":"[[≈52%]] of net sown area depends on rainfall (notebook)"},{"l":"Narrow food basket","t":"rice and wheat make up [[≈78%]] of foodgrain output (ES 2022-23, notebook); pulses and edible oils depend on imports"},{"l":"Post-harvest losses","t":"[[≈30–40%]] of fruits and vegetables lost after harvest (see GS3.4 → Marketing)"},{"l":"Fragmented supply chain","t":"many intermediaries and weak cold chains magnify supply shocks"},{"l":"Fuel and transport costs","t":"diesel runs trucks and pumps, so fuel hikes pass into food prices; in June 2026 the RBI raised its FY27 inflation projection from [[4.6%]] to [[5.1%]], citing pass-through of higher energy prices"},{"l":"MSP and rural wages","t":"MSP sets a price floor; employment schemes (MGNREGA, now VB-G RAM G) push up farm wages"},{"l":"Rising incomes and urbanisation","t":"demand shifts to pulses, vegetables, dairy and meat"}],"q":"What drives food inflation in India?","cue":"Rain → narrow basket → losses → middlemen → fuel → MSP and wages → richer diets: supply is fragile and demand is shifting.","title":"PYQ 2024 Q2"}]},{"id":"GS35-rbi-inflation-control","line":"GS3.5","part":"Farm subsidies","name":"RBI and food inflation","own":true,"cards":[{"k":"list","rows":[{"l":"Target","t":"CPI [[4%]] ± [[2%]]; the RBI usually looks through supply-driven food shocks and acts only to stop them spilling into core inflation"},{"l":"Limits of monetary policy","t":"food carries a high weight in CPI, so monetary policy cannot fix a supply shortfall"},{"l":"Prices outside RBI control","t":"MSP increases, procurement and stocking decisions, and import policy move food prices"}],"q":"Why can’t the RBI control food inflation on its own?","cue":"Look through the shock → can’t grow food with rates → the government sets the food levers.","title":"PYQ 2024 Q2"}]},{"id":"GS35-farm-credit-pacs-ardbs","line":"GS3.5","part":"Farm subsidies","name":"Farm credit (PACS, ARDBs)","own":true,"cards":[{"k":"define","text":"Institutional credit for farmers. PACS (Primary Agricultural Credit Societies) are village-level cooperatives giving short-term loans; ARDBs (Agriculture and Rural Development Banks) give long-term investment credit.","q":"What are PACS and ARDBs?"},{"k":"for","rows":[{"l":"Rising flow of credit","t":"ground-level credit rose from [[≈₹8.5 lakh crore]] (FY15) to [[₹28.7 lakh crore]] (FY25) (ES 2025-26)"},{"l":"Cooperative reach","t":"cooperative banks provide [[≈30–40%]] of rural credit, with PACS as the village-level outlet"},{"l":"Cheaper than informal credit","t":"institutional loans reduce dependence on moneylenders"},{"l":"PACS model","t":"one member, one vote; no profit motive; credit, storage and marketing under one roof; PACS are being computerised"},{"l":"ARDBs","t":"long-term investment credit; the first was set up in Punjab in 1920"}],"q":"How has institutional farm credit improved?","cue":"More credit → cooperative reach → cheaper than moneylenders → PACS as hubs → ARDBs for the long term."},{"k":"against","rows":[{"l":"Access","t":"bank penetration is only [[≈30%]] (RBI); only [[≈40%]] of farmers have access to formal credit (NABARD)","fix":"Kisan Credit Card (collateral-free limit [[₹2 lakh]], RBI 2025); Modified Interest Subvention Scheme (loan limit [[₹5 lakh]])","h":"Finance"},{"l":"Risk and NPAs","t":"agricultural GNPA [[≈6.2%]], the highest of any sector (others [[≈1.2%]]); loan waivers ([[≈₹2.5 lakh crore]] announced between 2014 and March 2022) weaken repayment discipline","h":"Finance"},{"l":"Lender’s risk","t":"monsoon dependence, pests and price swings; small holdings give little collateral; informal tenants have no papers","h":"Finance"},{"l":"Capacity and social capital","t":"PACS need training and capacity building to work as accountable village institutions; they are also being given godowns (see Buffer stock)","h":"People and skills"},{"l":"Technology","t":"digital delivery and records are needed to reach rural clients at low cost (see E-technology, GS3.4)","h":"Technology"},{"l":"Low productivity","t":"average crop yield ≈2.7 t/ha in India against 5.9 in China and 7.2 in the USA (notebook)","h":"Technology"},{"l":"Low digital use","t":"only [[≈37%]] use online banking (NSSO survey, notebook)","h":"Technology"},{"l":"Governance","t":"cooperatives need stronger oversight and professional management","h":"Rules and institutions"},{"l":"ARDB weakness","t":"poor recovery ([[≈40%]], notebook), under-capitalisation, governance problems","h":"Rules and institutions"},{"l":"Indebtedness","t":"about half of agricultural households have debt of [[₹15,000]] or more","h":"Equity and sustainability"}],"q":"Why does farm credit still fall short?","cue":"Access → Risk and NPAs → Lender’s risk → Capacity and social capital → Technology → Low productivity → Low digital use → Governance → ARDB weakness → Indebtedness."}]},{"id":"GS35-farm-subsidies","line":"GS3.5","part":"Farm subsidies","name":"Farm Subsidies","own":true,"cards":[{"k":"define","q":"How do direct and indirect farm subsidies differ?","text":"Direct support puts cash in farmers’ hands (PM-KISAN, state schemes); indirect support lowers input costs (fertiliser, power, seeds, credit). The core reform goal is replacing price subsidies with direct benefit transfer (DBT)."},{"k":"for","q":"Why are farm subsidies needed?","rows":[{"l":"Ensures national food security","t":"cheap inputs built self-sufficiency in rice and wheat after the Green Revolution."},{"l":"Supplements small-farmer income directly without distorting prices","t":"e.g. PM-KISAN pays [[₹6,000]]/year; states add top-up schemes"},{"l":"Cushions farmers against weather and crop-loss shocks","t":"e.g. PMFBY has paid claims above [[₹2.1 lakh crore]], PIB Aug 2026"},{"l":"Speeds up technology and HYV seed adoption","t":"e.g. rice and wheat seeds subsidised at [[50%]] or [[₹10]]/kg, whichever is lower"},{"l":"Cuts middleman diversion by sending cash straight to farmer bank accounts via DBT","t":""}],"cue":"Subsidies lower farming costs, shield farmers from crop and income shocks, and secure national food supply."},{"k":"against","q":"What are the costs of farm subsidies?","rows":[{"l":"Heavy fiscal burden crowds out farm investment","t":"Budget 2026-27 allocates [[₹2,27,629 crore]] for food and [[₹1,70,805 crore]] for fertiliser subsidies (BE), while Punjab’s power subsidy costs [[≈₹20,000 crore]]/year(PSPCL spent [[≈₹1.2 lakh crore]] over the years)."},{"l":"Severe ecological damage","t":"Punjab extracts [[≈165%]] of its groundwater recharge, India causes [[≈17%]] of global aquatic nitrogen pollution, and ranks among the top [[3]] agrifood-system emitters."},{"l":"Distorts cropping patterns","t":"cheap power, fertiliser, and assured procurement over-incentivise water-guzzling paddy and wheat over pulses and oilseeds."},{"l":"Skews fertiliser use","t":"urea MRP frozen at [[₹242]]/45-kg bag since 2018 pushes use to [[≈141 kg]]/ha away from the ideal [[4]]:[[2]]:[[1]] NPK ratio, dropping irrigated fertiliser response from [[13.4 kg]] grain/kg NPK (1970) to [[3.7 kg]] (2005) (Lok Sabha)."},{"l":"Unequal benefits and persistent distress","t":"subsidies favour large farmers and states like Punjab over Bihar, [[≈6 lakh]] farmers faced PM-KISAN DBT exclusion, [[11,290]] farm-sector suicides occurred in 2022 ([[5,207]] farmers, [[6,083]] labourers; NCRB), and India ranked [[105]]/127 in the Global Hunger Index 2024."}],"cue":"Open-ended input subsidies drain public funds, degrade soil and groundwater, and lock farmers into rice-wheat monoculture."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Redirect funds from input subsidies into public capital expenditure (irrigation, storage, rural roads) to raise the investment-to-subsidy ratio","t":""},{"l":"Replace price subsidies with targeted per-hectare DBT to stop leakage and input overuse, while widening state cover for excluded farmers","t":""},{"l":"Raise agricultural R&D spending","t":"every [[₹1]] invested returns [[≈₹13]], far outperforming input subsidies."},{"l":"Curb urea overuse through nutrient-based pricing (N, P, K, S), neem-coated, nano, and sulphur-coated (Urea Gold) urea, and Aadhaar-linked PoS checks (iFMS)","t":""},{"l":"Build food processing, quality standards, and assured markets for crops beyond wheat and rice to encourage diversification","t":""}],"cue":"Shift spending from distorting input subsidies to public infrastructure, R&D, and direct cash transfers."},{"k":"data","rows":[{"l":"Crop insurance","t":"insurers’ premium income has exceeded claims paid by more than [[₹10,000 crore]] every year since 2019 (Rural Voice, PMFBY data)"},{"l":"PMFBY (crop insurance, Feb 2016)","t":"farmer premium [[2%]] for kharif, [[1.5%]] for rabi, [[5%]] for commercial and horticulture crops; the rest is shared Centre–state 50:50 (90:10 for NE and Himalayan states). Kharif 2016 to Rabi 2025-26: [[92.5 crore]] farmer applications insured (PIB, Aug 2026)"},{"l":"RKVY (Rashtriya Krishi Vikas Yojana)","t":"encourages states to raise public investment in agriculture; projects are approved by a State-Level Sanctioning Committee; also supports agri-entrepreneurs – now PM-RKVY: [[₹57,075 crore]] within the [[₹1,01,322 crore]] PM-RKVY and Krishonnati Yojana umbrella (Cabinet, 3 Oct 2024)"},{"l":"State income-support schemes","t":"Andhra Pradesh Annadata Sukhibhava ([[₹20,000]] a year, including PM-KISAN) replaced YSR Rythu Bharosa ([[₹13,500]] a year); Telangana Rythu Bharosa ([[₹6,000]]/acre per season) replaced Rythu Bandhu ([[₹5,000]]/acre per season); Odisha KALIA (income support, including for landless households); Chhattisgarh Rajiv Gandhi Kisan Nyay Yojana (input assistance); West Bengal Krishak Bandhu ([[₹10,000]]/acre a year, pro-rata, minimum [[₹4,000,]] plus a death benefit); Madhya Pradesh Bhavantar Bhugtan Yojana (price-deficiency payment); Haryana Bhavantar Bharpai Yojana (pays the gap when mandi prices of notified vegetables, fruits and bajra fall below a protected price; [[₹600]]/quintal for bajra in 2021); Karnataka Raitha Siri ([[₹10,000]]/ha for millets); Maharashtra Krishi Sanjivani (climate-resilient farming); Punjab: Paani Bachao Paisa Kamao, crop residue management, solar tube wells"}],"q":"Which schemes and data back up farm subsidies?"},{"k":"data","q":"How should farm subsidies be reformed?","title":"Data","rows":[{"l":"More R&D","t":"every [[₹1]] returns [[≈₹13]] (notebook)"}]}]},{"id":"GS35-wto-agreement-on-agriculture-and-farm-su","line":"GS3.5","part":"Farm subsidies","name":"WTO Agreement on Agriculture and Farm Subsidies","own":true,"cards":[{"k":"define","q":"How does the WTO Agreement on Agriculture classify farm subsidies?","text":"The Agreement on Agriculture (1995) sorts farm support into Amber (trade-distorting, capped at [[10%]] for developing countries), Blue (production-limiting) and Green (minimally distorting, uncapped) boxes."},{"k":"for","q":"How does India defend its farm support at the WTO?","rows":[{"l":"Protects national food security by allowing public stockholding to feed free grain to [[≈81 crore]] beneficiaries under NFSA","t":"e.g. PMGKAY distribution"},{"l":"Safeguards smallholders via Article [[6.2]], which exempts input and investment subsidies for low-income,resource-poor farmers ([[86%]] of India’s farmers are small and marginal)","t":""},{"l":"Uses a flawed 1986–88 external reference price that ignores decades of inflation, artificially inflating India’s measured market price support","t":""},{"l":"Offsets historic asymmetry","t":"countries with high 1986–88 subsidies kept permanent above-cap entitlements, while India with low or negative base-period support took none (e.g., US and EU AMS headroom)."},{"l":"Remains non-trade-distorting because procured grain is used for domestic welfare rather than dumped onto global markets (protected by the 2013 Bali Peace Clause)","t":""}],"cue":"Public stockholding and input subsidies are essential food-security and livelihood lifelines, not trade distortions, and look inflated only due to outdated 1986–88 WTO rules."},{"k":"against","q":"What challenges does India face at the WTO on farm support?","rows":[{"l":"Rice support hit [[≈$7.6 billion]] in 2024–25 ([[≈11.8%]] of production value against the [[10%]] cap), forcing India to invoke the Peace Clause for the seventh time since 2020 (India’s WTO notification, April 2026)","t":""},{"l":"Repeated multilateral deadlock","t":"MC14 (Yaoundé, March 2026) ended without a permanent solution on public stockholding, leaving India reliant on an interim Peace Clause."},{"l":"The Peace Clause covers only pre-2013 programmes and traditional staples, imposes heavy notification burdens, and bars export disruptions","t":""},{"l":"Developed exporters (US, Australia, and others) have filed counter-notifications accusing India of under-reporting rice and wheat price support, which India rejects","t":""},{"l":"Non-tariff disputes persist","t":"the US alleges India blocks dairy imports by refusing products from animals fed GM feed (alongside wider WTO subsidy clashes, such as India’s [[≈$35]]/fisher support vs up to [[≈$76,000]] in Europe, Dec 2024)."}],"cue":"Breaching the 10% subsidy ceiling, strict Peace Clause limits, and repeated multilateral deadlock leave India’s farm programmes vulnerable to trade disputes."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Secure a permanent solution for public stockholding that excludes food-security procurement from Amber Box limits, or index the 1986–88 reference price to inflation","t":""},{"l":"Set fair farm subsidy caps measured per farmer rather than per country to end the structural gap between developing smallholders and rich nations","t":""},{"l":"Adopt a Special Safeguard Mechanism (SSM) letting developing countries temporarily raise tariffs against sudden import surges and price crashes","t":""},{"l":"Restore a fully functional two-tier WTO dispute-settlement system and preserve inclusive, consensus-based decision-making","t":""},{"l":"Frame balanced rules for digital trade (preserving developing-country policy space on customs duties)alongside equitable fisheries rules","t":"e.g. a 25-year moratorium on distant-water fishing subsidies"}],"cue":"Update outdated subsidy math, exempt food-security stocks permanently, and rebalance WTO rules toward per-farmer equity and consensus."},{"k":"diagram","q":"Draw the diagram for WTO Agreement on Agriculture","g":{"dir":"TD","nodes":[["W","WTO Agreement on Agriculture"],["A","Amber box - trade-distorting, 10% de minimis"],["B","Blue box - production-limiting"],["G","Green box - minimal distortion"],["P","Peace clause for food stocks, Bali 2013"]],"edges":[["W","A",""],["W","B",""],["W","G",""],["A","P",""]]}}]},{"id":"GS35-msp","line":"GS3.5","part":"MSP","name":"MSP (Minimum Support Price)","own":true,"cards":[{"k":"define","q":"What is meant by MSP?","text":"The floor price at which the government stands ready to buy a crop, recommended by CACP and approved by CCEA."},{"k":"list","q":"Which crops does MSP cover?","rows":[{"l":"Mandated crops","t":"[[22]]: [[7]] cereals, [[5]] pulses, [[7]] oilseeds, [[3]] commercial crops (cotton, jute, copra)"},{"l":"Plus sugarcane","t":"Fair and Remunerative Price (FRP), making [[23]] in all"}]},{"k":"for","q":"Why is MSP important?","rows":[{"l":"Lowers price risk and lifts farm incomes, helping farmers escape the low-income, low-investment trap (payouts hit [[₹3.3 lakh crore]] for [[1.8 crore]] farmers in 2024–25, PIB)","t":""},{"l":"Stocks the PDS for [[≈81 crore]] NFSA beneficiaries and builds national buffers (wheat [[≈26.6 MMT]] in RMS 2024–25 and rice [[≈52.5 MMT]] in KMS 2023–24, [[≈79 MMT]] combined)","t":""},{"l":"Nudges crop diversification when backed by active buying of pulses and oilseeds","t":"e.g. [[100%]] procurement of tur, urad, and masur under PM-AASHA"},{"l":"Sets a benchmark price floor in mandis that prevents distress sales even without full government purchase","t":""},{"l":"Stabilises consumer food prices by letting the government release buffer stocks during inflation spikes","t":"e.g. Bharat Atta and Bharat Dal sales"}],"cue":"An assured floor price removes market uncertainty, raises farm incomes, and secures food stocks for public welfare."},{"k":"against","q":"What are the problems with MSP?","rows":[{"l":"Narrow crop and regional bias","t":"[[≈85%]] of procurement is wheat and rice, while Punjab and Haryana supply >[[60%]] of central wheat despite producing only [[≈30%]], leaving smallholders mostly uncovered (unlike decoupled income payments abroad)."},{"l":"Locks farmers into water-guzzling paddy and wheat (the cobweb effect), blocking diversification and depleting groundwater","t":""},{"l":"Heavy fiscal and storage burden","t":"open-ended buying piles up FCI buffer stocks beyond norms, causing high carrying costs and grain spoilage (making a blanket legal MSP fiscally risky)."},{"l":"Input costs rise faster than MSP hikes, alongside ongoing demands to calculate MSP on comprehensive C2+[[50%]] costs rather than A2+FL (Swaminathan formula)","t":""},{"l":"Breaches WTO Amber Box subsidy caps","t":"especially for rice—exposing India to international trade disputes."}],"cue":"Open-ended procurement for just two crops drains public funds, skews cropping patterns, and leaves most smallholders out."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Scale Price Deficiency Payment Schemes (PDPS) under PM-AASHA to pay the gap between market price and MSP via DBT without costly physical storage (modeled on MP’s Bhavantar Bhugtan Yojana)","t":""},{"l":"Expand active procurement and guaranteed off-take for pulses, oilseeds, and millets to break the rice-wheat lock-in","t":"e.g. NAFED and NCCF buying under PSS"},{"l":"Decentralise procurement to eastern and central states by building local warehouses and mandi centres (Shanta Kumar Committee recommendation)","t":""},{"l":"Pair MSP with decoupled direct income transfers (like PM-KISAN) so small and marginal farmers benefit regardless of marketable surplus","t":""},{"l":"Address the Parliamentary Standing Committee’s legal MSP recommendation by strengthening rural mandis, FPOs, and cold chains first so market prices stay above MSP naturally","t":""}],"cue":"Shift from physical grain buying to direct price-deficiency payments, diversified procurement, and stronger market infrastructure."},{"k":"diagram","q":"Draw the low-income trap diagram (MSP)","g":{"dir":"LR","nodes":[["I","Low income"],["S","Low savings"],["V","Low investment"],["P","Low productivity and returns"],["M","MSP - assured price"]],"edges":[["I","S",""],["S","V",""],["V","P",""],["P","I",""],["M","I",""]]}},{"k":"diagram","q":"Draw the diagram for MSP","g":{"dir":"LR","nodes":[["C","CACP - cost A2+FL, C2"],["R","Recommends MSP"],["G","CCEA approves"],["P","Procurement - FCI, states, PM-AASHA"],["F","Farmer income and central pool"]],"edges":[["C","R",""],["R","G",""],["G","P",""],["P","F",""]]}},{"k":"data","q":"How is MSP fixed, and what do committees say?","title":"Data","rows":[{"l":"Procurement share","t":"[[≈65%]] of wheat and rice produced is procured by FCI (notebook, not traced)"},{"l":"MSP formula","t":"since the 2018-19 Budget, at least [[1.5 times]] the A2+FL cost (paid-out costs plus family labour); the Swaminathan Commission (National Commission on Farmers, 2006) asked for at least [[50%]] over cost, which farm unions read as C2 (adds rent and interest on owned land and capital) + [[50%]]. CACP recommends; it is advisory"},{"l":"PM-AASHA (2018; continued Sept 2024, [[₹35,000 crore]] to 2025-26)","t":"Price Support Scheme (procurement of notified pulses, oilseeds and copra up to [[25%]] of national production), Price Deficit Payment Scheme for oilseeds ([[40%]] of state production), Price Stabilisation Fund, Market Intervention Scheme (PIB)"},{"l":"Shanta Kumar Committee (2015)","t":"only [[≈6%]] of farmers sold at MSP to procurement agencies (NSSO 2012-13 data; critics say it undercounts); see PDS → Government steps"},{"l":"Other countries","t":"US: Price Loss Coverage pays farmers when market prices fall below an ‘effective reference price’. EU: the Common Agricultural Policy (CAP) gives direct income payments. Both are income-support and decoupled payments that mostly benefit large commercial farms"},{"l":"From the diagram","t":"CCEA approves"}]}]},{"id":"GS35-pds","line":"GS3.5","part":"PDS","name":"PDS","own":true,"cards":[{"k":"define","q":"What is the PDS?","text":"Public Distribution System: fair-price shops distribute subsidised foodgrain procured by the Food Corporation of India (FCI) to eligible households."},{"k":"for","q":"What has the PDS achieved?","rows":[{"l":"Reaches [[≈70%]] of households in 2022–23 (up from [[≈49%]] in 2011–12), giving free grain to [[≈81 crore]] people (under NFSA/PMGKAY)","t":""},{"l":"Cuts extreme poverty","t":"without the PDS, the poverty gap would be [[18–20%]] wider."},{"l":"Improves child nutrition","t":"NFSA prevented [[≈1.8 million]] cases of child stunting, stunting fell from [[48%]] (NFHS-3, 2005–06) to [[35.5%]] (NFHS-5, 2019–21), and undernourishment fell to [[≈60 million]] (2000–2019)."},{"l":"Slashed grain leakage from [[42%]] (2011–12) to [[22%]] (2022–23), with sharp drops in Bihar ([[≈69%]] → [[≈19%]]) and West Bengal ([[≈69%]] → [[9%]])","t":""},{"l":"Digitised last-mile delivery","t":"e-POS machines cover [[≈100%]] of fair-price shops, with [[≈95%]] of transactions Aadhaar-authenticated."}],"cue":"Guaranteed subsidised foodgrains shield poor households from hunger and poverty, with digitisation sharply cutting historic leakages."},{"k":"against","q":"What are the limitations of the PDS?","rows":[{"l":"Persistent leakage and diversion","t":"still [[≈22%]] in 2022–23 (losing [[≈₹69,000 crore]] a year; ICRIER, Gulati 2024),with Tamil Nadu rising from [[12%]] to [[25%]] (2023), Uttar Pradesh highest in absolute terms (ICRIER), and [[≈20]],000malpractice cases against fair-price shop dealers."},{"l":"Heavy fiscal burden","t":"the true economic cost is [[≈$45 billion]] against [[≈$16 billion]] shown in the budget (due to off-budget FCI borrowings and carrying costs)."},{"l":"Exclusion of [[≈10 crore]] eligible people because the Census is delayed and NFSA coverage still uses the 2011 population","t":""},{"l":"Nutrition gap","t":"a grain-based (rice and wheat) basket fails to end malnutrition and micronutrient deficiencies on its own."},{"l":"Storage and transport inefficiency","t":"[[≈90%]] of handling facilities are non-mechanised, worsened by weak depot monitoring and inefficient routes."}],"cue":"High fiscal costs, persistent diversion, outdated population lists, and a cereal-only basket limit efficiency and nutrition."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Curb transit diversion via SMART-PDS (end-to-end digital tracking with GPS and SMS alerts, now integrated under SARTHAK-PDS) and One Nation One Ration Card for inter-state portability","t":""},{"l":"Update beneficiary rolls using current population projections (until the delayed Census is completed) to cover the [[≈10 crore]] left-out poor and weed out ghost cards","t":""},{"l":"Modernise storage and logistics through Depot Darpan (real-time monitoring and composite rating of storage depots), mechanised silos, and route-optimisation algorithms (IIT-Delhi and the UN World Food Programme's Anna Chakra)","t":""},{"l":"Bridge the nutrition gap by scaling fortified rice, pulses, and millets in the PDS alongside PM POSHAN (mid-day meals) and Mission POSHAN [[2.0]]","t":""},{"l":"Bring off-budget food costs onto the budget and pilot Direct Benefit Transfer (DBT) cash options in urban areas with strong banking and market access (Shanta Kumar Committee recommendation)","t":""}],"cue":"End-to-end digital tracking, mechanised storage, updated beneficiary lists, and fortified baskets plug leaks and improve health."},{"k":"diagram","q":"Draw the diagram for PDS","g":{"dir":"LR","nodes":[["F","FCI and state procurement"],["C","Central pool"],["S","States lift grain"],["D","Fair price shops"],["B","Ration card holders - ONORC"]],"edges":[["F","C",""],["C","S",""],["S","D",""],["D","B",""]]}},{"k":"data","q":"How has the PDS evolved, and how should it be revamped?","title":"Data","rows":[{"l":"Suggestion","t":"narrow subsidised coverage from [[≈53%]] to the poorest [[≈15%]] (notebook)"},{"l":"PDS timeline","t":"Revamped PDS (1992) for tribal and hilly areas; Targeted PDS (1997) with APL and BPL categories; Antyodaya Anna Yojana (2000): [[35 kg]] per household per month for the poorest"},{"l":"NFSA 2013","t":"covers [[75%]] of the rural and [[50%]] of the urban population; includes maternity benefits for pregnant and lactating women; grain was priced at [[₹3]]/[[₹2]]/[[₹1]] per kg; free since January 2024 (PMGKAY, extended to 2028); the eldest woman (18+) is head of household on the ration card"},{"l":"PMGKAY","t":"extra [[5 kg]] of free grain during Covid; since 2023 merged with the free NFSA entitlement (Agriculture notes)"},{"l":"Jan Poshan Kendras","t":"fair-price shops turned into nutrition hubs selling more food items and offering other services (pilot, 2024); a millet-for-rice switch in PDS could save [[≈$1.4 bn]] (notebook)"},{"l":"Shanta Kumar Committee","t":"(High-Level Committee on restructuring FCI, Jan 2015): cut NFSA coverage from [[67%]] to [[≈40%]] of the population; move to cash transfers; let FCI procure fully only in states weak in procurement; end state bonuses on MSP; outsource storage; negotiable warehouse receipts with bank loans of up to [[80%]] of MSP value"},{"l":"From the diagram","t":"Ration card holders - ONORC"}]}]},{"id":"GS35-buffer-stock","line":"GS3.5","part":"Buffer stock","name":"Buffer stock","own":true,"cards":[{"k":"define","q":"What is the buffer stock?","text":"Foodgrain held by the FCI above the operational stock norm so the PDS can run uninterrupted and market prices can be stabilised (dating from the Fourth Five-Year Plan, 1969–74)."},{"k":"for","q":"Why does India keep a buffer stock?","rows":[{"l":"Keeps PDS and NFSA entitlements supplied even in a bad crop year","t":"e.g. FCI moved over [[3 million]] tonnes for PMGKAY during the Covid lockdown"},{"l":"Stabilises domestic prices through Open Market Sale Scheme (OMSS) interventions","t":"e.g. FCI sold [[34.8 lakh]] tonnes of wheat in 2022–23, and doubled the 2026–27 rice sale target to [[50]] LMT"},{"l":"Protects consumers from food inflation spikes","t":"e.g. open-market sales cut CPI wheat inflation from [[≈25%]] to [[≈6.5%]] by May 2024"},{"l":"Shields India from global grain price spikes without forcing panic imports","t":"e.g. during global supply disruptions"},{"l":"Anchors MSP procurement by absorbing post-harvest surpluses from farmers (preventing distress sales in surplus states)","t":""}],"cue":"Holding strategic grain reserves protects poor households from hunger and shields consumers and the economy from sudden price shocks."},{"k":"against","q":"What are the problems with India’s buffer stock?","rows":[{"l":"Heavy fiscal cost","t":"carrying excess grain inflates FCI’s economic cost and the national food subsidy ([[₹2,27,629 crore]], BE 2026–27)."},{"l":"Chronic excess stocks","t":"on [[1]] July 2026 the central pool held [[925.9]] LMT of wheat and rice against a [[411.2]] LMT norm, with rice at [[403.1]] LMT against [[135.4]] LMT (≈3x; government data, Business Today)."},{"l":"High storage wastage","t":"[[≈87,000 tonnes]] were lost in FCI godowns in 2010–11 (Down To Earth), over [[40,000 tonnes]] rotted in 2014–20, and rodents eat [[≈2.4–2.6 MT]] of stored grain a year (IGMRI)."},{"l":"Regionally skewed and unmechanised storage","t":"Punjab has [[611]] godowns (full after a record rice crop)versus [[≈30]] in West Bengal, with non-mechanised handling."},{"l":"Poor stock rotation","t":"ignoring first-in-first-out (FIFO) rules in outdated warehouses causes older grain to rot and raises pilferage."}],"cue":"Holding stocks far above norms drains public money, overloads uneven storage, and causes heavy grain wastage."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Build decentralised godowns at Primary Agricultural Credit Societies (PACS) under the World’s Largest Grain Storage Plan to bridge regional gaps","t":""},{"l":"Adopt an automatic liquidation rule to sell stocks above buffer norms early via OMSS, exports, or ethanol diversion (Shanta Kumar Committee)","t":""},{"l":"Phase out open Covered and Plinth (CAP) storage and build mechanised steel silos via public-private partnerships","t":""},{"l":"Enforce strict first-in-first-out (FIFO) rotation and real-time depot monitoring (through Depot Darpan and SMART-PDS)","t":""},{"l":"Decentralise procurement to eastern and central states so grain is stored and distributed locally rather than hauled from Punjab","t":""}],"cue":"Decentralise modern storage, offload excess grain early, and enforce digital stock rotation to cut costs and waste."},{"k":"diagram","q":"Draw the diagram for Buffer stock","g":{"dir":"TD","nodes":[["C","Central pool"],["O","Operational stock - PDS, welfare"],["R","Strategic reserve"],["E","Excess over buffer norm"],["M","OMSS sales, exports, ethanol"]],"edges":[["C","O",""],["C","R",""],["C","E",""],["E","M",""]]}},{"k":"data","q":"How is storage being expanded and stock released?","title":"Data","rows":[{"l":"World’s Largest Grain Storage Plan in the","t":"Cooperative Sector (pilot from 31 May 2023): godowns at PACS; by July 2026, 313 PACS had finished godowns with more than [[1.8 LMT]] of capacity, and 1,012 PACS had been identified (PIB, Sept 2026)"}]}]},{"id":"GS35-agricultural-revolutions","line":"GS3.5","part":"Technology missions","name":"Agricultural revolutions","own":true,"cards":[{"k":"define","q":"What is meant by an agricultural revolution?","text":"Mission-mode drives that sharply lifted output of one product group."},{"k":"list","q":"Name India’s agricultural revolutions.","rows":[{"l":"Green","t":"high-yielding wheat and rice from the mid-1960s; M.S. Swaminathan"},{"l":"White","t":"milk; Operation Flood from 1970; Verghese Kurien, NDDB"},{"l":"Blue","t":"fish; Neeli Kranti, now PMMSY"},{"l":"Yellow","t":"oilseeds; Technology Mission on Oilseeds, 1986"},{"l":"Golden","t":"horticulture"},{"l":"Silver","t":"eggs"},{"l":"Pink","t":"meat and poultry"},{"l":"Round","t":"potato"}]},{"k":"for","q":"What did the agricultural revolutions achieve?","rows":[{"l":"Ended famine risk and secured national food supply","t":"foodgrain output of [[357.7 million]] tonnes in 2024–25 backs NFSA cover for [[≈80 crore]] people (PIB)."},{"l":"Improved protein and micronutrient nutrition","t":"milk reached [[247.9 MT]] in 2024–25 (world’s largest),raising daily availability from [[319]] g to [[485]] g per person since 2014–15 (BAHS 2025)."},{"l":"Diversified farm incomes and cushioned crop shocks","t":"livestock now makes up [[≈31%]] of agricultural GVA (alongside Golden and Blue Revolution gains in horticulture and fisheries)."},{"l":"Empowered rural women with regular cash income, as dairy cooperatives and livestock rearing employ mostly women","t":"e.g. Amul and state dairy federations"},{"l":"Turned India into a major agri-exporter across rice, marine products, and horticulture","t":"e.g. shrimp exports boosted under Blue Revolution / PMMSY"}],"cue":"Targeted technology, credit, and market drives turned chronic food deficits into surpluses, lifting rural incomes and nutrition."},{"k":"against","q":"What were their downsides?","rows":[{"l":"Distorted cropping patterns","t":"MSP-backed rice and wheat crowded out pulses and oilseeds, pushing pulses imports to a record high in 2024–25 (alongside heavy edible oil imports)."},{"l":"Depleted groundwater and degraded soil due to water-guzzling paddy-wheat monoculture and heavy chemical fertiliser use","t":"e.g. falling water tables in Punjab and Haryana"},{"l":"Widened regional inequality, as Green Revolution gains stayed concentrated in Punjab, Haryana, and western UP while leaving eastern and rainfed states behind","t":""},{"l":"Favoured larger farmers who could afford tubewells, HYV seeds, and machinery, leaving small and marginal holders behind","t":""},{"l":"Eroded native crop biodiversity and nutrition by replacing climate-resilient millets (Shri Anna) and local varieties with a few high-yielding hybrids","t":""}],"cue":"Single-crop focus, input-heavy farming, and uneven regional rollout caused ecological damage, import dependence, and inequality."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Boost domestic oilseeds and pulses through targeted cluster missions","t":"NMEO-Oilseeds (2024), NMEO-Oil Palm (2021), and Mission for Aatmanirbharta in Pulses (2025)—backed by assured PM-AASHAprocurement."},{"l":"Transition to an Evergreen Revolution (M.S. Swaminathan) using micro-irrigation (PMKSY), Soil Health Cards, and natural farming to restore groundwater and soil","t":""},{"l":"Expand productivity drives to eastern and rainfed India with region-specific seeds and irrigation (e.g., Bringing Green Revolution to Eastern India","t":"BGREI)."},{"l":"Scale allied-sector missions in fisheries, livestock, and horticulture","t":"(e.g., PMMSY, Rashtriya Gokul Mission, and MIDH) so smallholders earn steady non-crop income."},{"l":"Aggregate small and marginal farmers via FPOs and women-led cooperatives to share machinery, cold chains, and direct market access","t":""}],"cue":"Shift from single-crop, input-heavy drives to a sustainable, region-wide \"Evergreen Revolution\" focused on deficit crops and smallholders."},{"k":"diagram","q":"Draw the diagram for Agricultural revolutions","g":{"dir":"TD","nodes":[["R","Agricultural revolutions"],["G","Green - foodgrains"],["W","White - milk"],["B","Blue - fish"],["Y","Yellow - oilseeds"],["P","Pink - meat"],["O","Golden - horticulture"]],"edges":[["R","G",""],["R","W",""],["R","B",""],["R","Y",""],["R","P",""],["R","O",""]]}},{"k":"data","q":"Which current missions continue them?","title":"Data","rows":[{"l":"National Food Security Mission","t":"(rice, wheat, pulses, coarse cereals) – renamed the National Food Security and Nutrition Mission (2024-25); runs under Krishonnati Yojana ([[₹44,247 crore]], Cabinet, Oct 2024)"},{"l":"National Mission on Edible Oils–Oilseeds (Oct 2024)","t":"primary oilseed output from [[39 MT]] (2022-23) to [[69.7 MT]] by 2030-31"},{"l":"Mission for Aatmanirbharta in Pulses","t":"(Oct 2025, [[₹11,440 crore]], 2025-26 to 2030-31): output to [[350 lakh]] tonnes, area to [[310 lakh]] ha, yield to [[1,130 kg]]/ha by 2030-31; tur, urad and masoor first (PIB)"}]}]},{"id":"GS35-midh-and-horticulture","line":"GS3.5","part":"Technology missions","name":"MIDH and horticulture","own":true,"cards":[{"k":"define","q":"What is MIDH?","text":"Mission for Integrated Development of Horticulture (MIDH): Centrally sponsored scheme (since 2014–15)covering fruits, vegetables, spices, flowers, plantation crops, and mushrooms."},{"k":"for","q":"What has horticulture achieved under MIDH?","rows":[{"l":"Surpassed foodgrain output at [[≈370 MT]] in 2024–25 (NAAS), with MIDH lifting area by [[≈9%]], output by [[≈14%]], and annual growth to [[≈3%]] (PIB)","t":""},{"l":"Nearly doubled average horticulture household income from [[≈₹0.7 lakh]] to [[₹1.3 lakh]] a year (PIB) through higher per-hectare returns","t":""},{"l":"Added [[≈15.7 lakh]] ha since 2014–15 and set up [[58]] Centres of Excellence (PIB, 2025) for quality planting material and modern techniques","t":""},{"l":"Improved crop forecasting and transparency via CHAMAN (GIS and remote-sensing estimates for mango, banana, tomato, onion, and three other crops) and HORTNET (online tracked applications under the National Horticulture Board)","t":""},{"l":"Strengthens national micronutrient security and creates year-round, labour-intensive rural jobs in picking,grading, and packing","t":"e.g. protected cultivation and floriculture"}],"cue":"High-value horticulture yields more per hectare than cereals, boosting farm incomes, nutrition, and crop diversification."},{"k":"against","q":"What holds horticulture back?","rows":[{"l":"Heavy post-harvest losses","t":"[[≈30–40%]] of fruits and vegetables spoil due to acute cold-storage and pack-house gaps."},{"l":"Too few processing units and weak market linkages trigger distress sales and sharp price swings during harvest gluts","t":"e.g. tomato, onion, and potato crashes"},{"l":"Smallholders miss out on capital-heavy infrastructure like polyhouses, drip systems, and cold storages due to small farm sizes","t":""},{"l":"Weak institutional credit linkage leaves farmers short of working capital for high-input horticultural crops","t":""},{"l":"Uneven adoption and fund utilisation across states limit balanced regional growth","t":"e.g. lagging uptake in eastern and rainfed states"}],"cue":"High perishability combined with weak cold chains, processing, credit, and smallholder access causes heavy waste and price crashes."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Build farm-gate pack-houses, cold storages, and reefer transport by converging MIDH with the Agriculture Infrastructure Fund (AIF)","t":""},{"l":"Expand local processing and price-stabilisation support to absorb gluts and cut [[≈30–40%]] waste","t":"e.g. PM Kisan SAMPADA Yojana and Operation Greens"},{"l":"Aggregate smallholders into crop-specific clusters and FPOs to share infrastructure and sell directly on e-NAM and ONDC","t":"e.g. Horticulture Cluster Development Programme"},{"l":"Widen institutional credit and weather-indexed insurance for high-value crops","t":"e.g. Kisan Credit Card and Restructured Weather Based Crop Insurance Scheme"},{"l":"Improve state-level execution through performance-linked MIDH grants and disease-free planting material from the [[58]] Centres of Excellence","t":""}],"cue":"Build farm-gate cold chains, boost processing, aggregate smallholders into clusters, and ease credit to cut waste and stabilise prices."},{"k":"data","q":"Which programmes and examples back up MIDH?","title":"Data","rows":[{"l":"MIDH (Mission for Integrated Development of Horticulture)","t":"Cluster Development Programme for horticulture (NHB): Mega cluster above [[15,000 ha]] up to [[₹100 crore]]; Midi [[5,000–15,000 ha]] up to [[₹50 crore]]; Mini up to [[5,000 ha]] up to [[₹25 crore]]"},{"l":"Uttar Pradesh date palm","t":"Uttar Pradesh subsidises date palm (Agriculture notes) : [[40%]] subsidy on a cost of [[₹4 lakh]]/ha under MIDH (notebook; [[₹4 lakh]] not traced)","unlikely":true}]}]},{"id":"GS35-livestock-economics","line":"GS3.5","part":"Animal rearing","name":"Livestock economics","own":true,"cards":[{"k":"define","q":"What is meant by livestock economics?","text":"Rearing of animals for milk, meat, and other produce, providing a steady source of rural income beyond crops."},{"k":"for","q":"Why does livestock matter for the rural economy?","rows":[{"l":"High economic growth","t":"accounts for [[≈31%]] of agricultural GVA and [[≈5.5%]] of total GVA, growing [[≈195]]%between FY15 and FY24 ([[12.8%]] CAGR; milk is [[≈82%]] of livestock GVA)."},{"l":"Major rural and women's employment","t":"employs [[≈20 million]] people and supports [[≈8 crore]] farmers, with women forming [[≈70%]] of the workforce."},{"l":"Acts as a climate buffer, steadying farm household income when monsoon or crop failures strike","t":"e.g. drought-prone and rainfed regions"},{"l":"Strong export earner","t":"buffalo meat exports hit [[₹34,392 crore]] in FY25 ([[≈82%]] of animal-product exports; India ranks 3rd globally by volume)."},{"l":"Provides circular farm utility","t":"milk, meat, eggs, and draught power alongside dung for organic manure and biogas (e.g., GOBARdhan scheme)."}],"cue":"Livestock drives rapid agricultural growth, employs rural women, and cushions farm households against crop failure."},{"k":"against","q":"What holds back India’s livestock sector?","rows":[{"l":"Low productivity due to breed and feed gaps","t":"milk yield averages [[≈1,777 kg]] per animal per year in India against [[≈2,699 kg]] globally."},{"l":"Frequent disease outbreaks (foot-and-mouth disease, haemorrhagic septicaemia, brucellosis, and lumpy skin) cut output, worsened by weak veterinary infrastructure and antimicrobial resistance","t":""},{"l":"Largely unorganised markets push marketing costs to [[15–20%]] of the sale price, hurting farmer margins (especially outside dairy cooperatives)","t":""},{"l":"Acute fodder shortage and high emissions","t":"only [[≈5%]] of land is under fodder, while livestock cause [[≈15]]%of global greenhouse emissions, mostly enteric methane (FAO)."},{"l":"Minimal financial risk cover","t":"only [[≈16%]] of animals are insured, and just [[≈1%]] are covered under the National Livestock Mission."}],"cue":"Low animal yields, frequent disease outbreaks, unorganised markets, and fodder shortages hold back farmer returns."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Upgrade breeds and milk yields via Rashtriya Gokul Mission (conserves indigenous bovine breeds, nucleus breeding centres, artificial-insemination network, and one-time [[35%]] capital subsidy for heifer-rearing centres) and National Livestock Mission (breed, feed, and infrastructure)","t":""},{"l":"Control diseases and expand rural care through National Animal Disease Control Programme,National Animal Disease Reporting System, and mobile veterinary units with trained staff for artificial insemination, delivery, and vaccination","t":""},{"l":"Bridge fodder deficits and cut emissions by growing area-specific fodder for deficit regions and adopting Precision Livestock Farming (sensors, cameras, and apps tracking each animal's health, welfare, and output in real time)","t":""},{"l":"Scale integrated farming and widen livestock insurance","t":"e.g. an Uttarakhand farm combining fish, dairy, poultry, vegetables, an orchard, bees, and mushrooms earns [[≈₹6.4 lakh]] a year and buys no food from outside"},{"l":"Organise supply chains and boost market access through dairy cooperatives (Amul model) and digital platforms","t":"e.g. e-Gopala and ONDC"}],"cue":"Better breeds, mobile veterinary care, fodder security, integrated farming, and organised markets can unlock full sector value."},{"k":"data","rows":[{"l":"Milk","t":"[[247.9 MT]] in 2024-25, the world’s largest ([[≈25%]] of global output); 485 g per person per day (Basic Animal Husbandry Statistics 2025)"},{"l":"From the diagram","t":"Cooperative - Amul model"}],"q":"What do the milk numbers show?"},{"k":"diagram","q":"Draw the diagram for Livestock economics","g":{"dir":"LR","nodes":[["B","Breed and feed"],["A","Animal health"],["O","Output - milk, meat, eggs"],["C","Cooperative - Amul model"],["M","Market and exports"]],"edges":[["B","A",""],["A","O",""],["O","C",""],["C","M",""]]}}]},{"id":"GS35-national-livestock-mission","line":"GS3.5","part":"Animal rearing","name":"National Livestock Mission","own":true,"cards":[{"k":"define","q":"What is the National Livestock Mission?","text":"A centrally sponsored mission (2014–15, re-aligned 2021–22) for sustainable livestock growth through better breeds, fodder supply and rural entrepreneurship."},{"k":"list","q":"What are the National Livestock Mission’s sub-missions?","rows":[{"l":"Breed development","t":"livestock and poultry"},{"l":"Feed and fodder"},{"l":"Innovation and extension"},{"l":"Works alongside","t":"Rashtriya Gokul Mission (indigenous cattle)"}]},{"k":"for","q":"What does the National Livestock Mission offer?","rows":[{"l":"Empowers landless farmers and women by boosting small-animal value chains","t":"sheep, goats, pigs, and backyard poultry (key rural household assets)."},{"l":"Sparks rural entrepreneurship via a [[50%]] capital subsidy up to [[₹50 lakh]] for poultry, sheep, goat, pig, and fodder units (NLM-EDP)","t":""},{"l":"Shows strong uptake with [[≈3,300]] projects sanctioned and [[≈₹1,100 crore]] in subsidy approved (Lok Sabha, March 2025)","t":""},{"l":"Tackles the fodder deficit through subsidised fodder seeds, hay, and silage units","t":"e.g. Fodder Plus FPOs"},{"l":"Raises herd productivity and cuts risks through breed improvement, extension services, and livestock insurance support","t":""}],"cue":"Small animals and fodder support give landless families steady income while capital subsidies build rural enterprises."},{"k":"against","q":"What are its limits?","rows":[{"l":"Back-ended subsidy rules require a bank loan and guarantee upfront, shutting out landless and small farmers who lack collateral","t":""},{"l":"Negligible risk cover","t":"only [[≈1%]] of livestock is insured under the mission, leaving poor owners exposed to disease losses."},{"l":"Thin fodder land and weak veterinary services limit animal survival and productivity on the ground","t":""},{"l":"Unorganised markets and weak modern processing for sheep, goat, and pig meat leave breeders dependent on middlemen","t":""},{"l":"Complex project proposals (DPRs), low awareness, and uneven state execution skew benefits toward larger entrepreneurs","t":""}],"cue":"Upfront loan rules, tiny insurance cover, and thin fodder and vet support keep poor farmers out."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Use Credit Guarantee Funds and channel loans through SHGs and FPOs so small farmers need no collateral","t":"e.g. NABARD guarantee cover"},{"l":"Bundle subsidised livestock insurance automatically with every NLM loan to raise coverage far above [[≈1%]]","t":""},{"l":"Grow community pastures and silage banks by converging with MGNREGA and Fodder Plus FPOs","t":""},{"l":"Build organised processing, cold chains, and direct buyer links for small-animal produce (converging with AHIDF and ONDC)","t":""},{"l":"Simplify online DPR applications in local languages and expand mobile veterinary units for doorstep care","t":""}],"cue":"Ease collateral rules via collectives, bundle insurance with loans, and link fodder, vet care, and markets."}]},{"id":"GS35-pink-revolution","line":"GS3.5","part":"Animal rearing","name":"Pink revolution","own":true,"cards":[{"k":"define","q":"What is the pink revolution?","text":"Modernising meat and poultry production and processing (the term is also used for onions and prawns)through organised abattoirs, cold chains, processing, and exports."},{"k":"for","q":"What is the case for the pink revolution?","rows":[{"l":"Tackles protein malnutrition with cheap nutrition","t":"eggs hit [[149.1 billion]] in 2024–25 (2nd in the world; [[106]] per person a year, BAHS 2025)."},{"l":"Drives large production scale","t":"meat output reached [[10.5 MT]] in 2024–25 (4th in the world), with poultry forming about half at [[5.2 MT]] (BAHS 2025)."},{"l":"Boosts export earnings","t":"buffalo meat exports hit [[₹34,392 crore]] in FY25 (3rd globally by volume; [[≈82%]] of animal-product exports)."},{"l":"Raises rural incomes quickly because poultry and small-animal rearing need little land and give fast cash returns","t":"e.g. contract poultry farming in Tamil Nadu"},{"l":"Cuts spoilage and adds value through cold chains, processing, and by-products","t":"e.g. leather and gelatin"}],"cue":"Modernising meat and poultry provides affordable protein, boosts rural incomes, and turns India into a global export hub."},{"k":"against","q":"What holds the pink revolution back?","rows":[{"l":"Mostly unorganised slaughter with weak hygiene and cold chains causes spoilage, contamination, and export rejections","t":""},{"l":"Varying state cattle-slaughter laws and uneven FSSAI food-safety enforcement create regulatory uncertainty","t":""},{"l":"Low domestic demand base","t":"meat availability is only [[7.5 kg]] per person a year (BAHS 2025) due to cultural preferences and low incomes."},{"l":"Disease outbreaks (like bird flu) and antibiotic overuse in poultry raise zoonotic and antimicrobial resistance (AMR) risks","t":""},{"l":"Untreated slaughterhouse waste pollutes local water bodies, while spikes in maize and soymeal feed prices squeeze farmer margins","t":""}],"cue":"Unorganised slaughter, weak cold chains, uneven state rules, and disease risks hold back domestic quality and exports."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Build modern abattoirs, processing units, and cold chains","t":"e.g. via Animal Husbandry Infrastructure Development Fund and PM Kisan SAMPADA Yojana"},{"l":"Enforce strict FSSAI hygiene rules, traceability, and export certification","t":"e.g. APEDA-registered integrated meat plants"},{"l":"Control animal diseases and curb antibiotic misuse in poultry","t":"e.g. National Animal Disease Control Programme and One Health framework"},{"l":"Provide working capital and stable feed access to small farmers via FPOs and Kisan Credit Cards (and National Livestock Mission)","t":""},{"l":"Convert slaughterhouse waste into biogas and organic manure to stop pollution","t":"e.g. GOBARdhan scheme"}],"cue":"Build modern abattoirs and cold chains, enforce strict hygiene and disease control, and support small farmers with credit and feed."}]},{"id":"GS35-mariculture","line":"GS3.5","part":"Animal rearing","name":"Mariculture and fisheries","own":true,"cards":[{"k":"define","text":"Farming of fish, shellfish and seaweed in the sea or in coastal saltwater.","q":"What is mariculture?"},{"k":"value","rows":[{"l":"Fisheries","t":"India is the 2nd-largest producer, with [[≈8%]] of global output. Production was [[197.75 lakh]] tonnes in FY25, up from [[95.8 lakh]] tonnes in FY14 (PIB, 6 Apr 2026)"},{"l":"PM Matsya Sampada Yojana (Blue Revolution 2.0)","t":"[[₹20,050 crore]], made up of a Central Sector part and a Centrally Sponsored part; implemented with NABARD’s support. Aims: fish production of [[22 MMT]] ([[19.8 MMT]] achieved in FY25), aquaculture productivity from 3 to 5 t/ha, post-harvest management, species diversification, technology such as GIS mapping. Also PM Matsya Kisan Samridhi Sah-Yojana"},{"l":"Neeli Kranti (Blue Revolution, 2015-16)","t":"forerunner of PMMSY; financed aquaculture (fish, crustaceans, molluscs, algae) and post-harvest activities. Run by the Department of Fisheries, implemented through state/UT departments and the National Fisheries Development Board"},{"l":"Budget 2026-27","t":"integrated development of 500 reservoirs and Amrit Sarovars for fisheries; stronger coastal fisheries value chains with start-ups, women-led groups and Fish Farmer Producer Organisations"}],"q":"What are the key fisheries numbers and schemes?"}]},{"id":"GS35-biofloc-technology","line":"GS3.5","part":"Animal rearing","name":"Biofloc technology","own":true,"cards":[{"k":"define","text":"Fish farming in tanks where beneficial microbes turn fish waste into protein-rich floc that the fish eat, allowing dense stocking with little water exchange.","q":"What is meant by biofloc technology?"}]},{"id":"GS36-contract-farming","line":"GS3.6","part":"","name":"Contract farming","own":true,"cards":[{"k":"define","text":"An agreement between farmers and a buyer (processor or retailer) to grow a crop at an agreed price and quality, often with inputs and technical support.","q":"What is contract farming?"},{"k":"list","title":"Contract farming vs corporate farming (2015 Q3)","rows":[{"l":"Land owner","t":"Contract farming: Farmer; Corporate farming: Company"},{"l":"Management","t":"Contract farming: Farmer runs the farm; Corporate farming: Company runs everything"},{"l":"Risk","t":"Contract farming: Shared by company and farmer; Corporate farming: Borne by the company"},{"l":"Aim","t":"Contract farming: Assured quantity and quality of produce; Corporate farming: Large, industrial-scale output"},{"l":"Farmer's status","t":"Contract farming: Independent producer; Corporate farming: Usually a wage labourer"}],"q":"How does contract farming differ from corporate farming?","cue":"Who owns, who runs, who bears risk, what is the aim, what is the farmer?"},{"k":"for","rows":[{"l":"Yield and income gains","t":"in a Benin and Ghana panel survey, yields rose [[29%]] under contract farming; incomes rise [[≈23–54%]] (notebook)"},{"l":"Assured market and price","t":"lowers market and price risk for small farmers"},{"l":"Steady supply for processors","t":"gives food processing industries a regular supply of the right quality"},{"l":"Technology access","t":"buyers bring seed, machines and know-how to small farmers"},{"l":"Scale without losing land","t":"pooled plots justify machines and shared drip irrigation while farmers keep ownership"}],"q":"What are the benefits of contract farming?","cue":"Higher yields → assured price → steady supply → technology → scale without selling land."},{"k":"against","rows":[{"l":"Debt and land risk","t":"about half of farm households are in debt, [[≈US$1,500]] each (notebook); a failed contract can push them towards losing land","h":"Finance"},{"l":"Exploitation of farmers","t":"in India a survey found [[94%]] of farmers faced exploitation and only [[6%]] benefited (IJDR)","h":"Markets"},{"l":"Power imbalance","t":"a few dominant buyers can put profit before farmers’ welfare","h":"Markets"},{"l":"Weak safeguards","t":"needs checks and balances: price floors, dispute resolution and land-title protection (Sansad TV perspective)","fix":"strong legal framework, standard farmer-friendly agreements, capacity building for marginal farmers","h":"Rules and institutions"},{"l":"Unequal benefits","t":"richer farmers gain most","h":"Equity and sustainability"}],"q":"What are the risks of contract farming?","cue":"Debt and land risk → Exploitation of farmers → Power imbalance → Weak safeguards → Unequal benefits."},{"k":"value","title":"Laws and cases","rows":[{"l":"Model Contract Farming Act, 2018","t":"released by the Centre in May 2018 (drafted by the Ashok Dalwai committee) for states to adopt: written agreement before sowing; contract farming kept outside the APMC Act; contracted produce insured; no permanent structure on the farmer’s land; sponsor must buy the agreed quantity; village-level facilitation groups; a state authority settles disputes"},{"l":"Tamil Nadu","t":"first state to pass a contract farming law on the model (2019; President’s assent October 2019)"},{"l":"Farm law of 2020","t":"the Farmers (Empowerment and Protection) Agreement on Price Assurance and Farm Services Act, 2020 gave a central framework for pre-agreed price contracts; repealed with the other two farm laws by the Farm Laws Repeal Act, 2021 (assent 30 Nov 2021)"},{"l":"PepsiCo potato case","t":"in 2019 PepsiCo sued Gujarat farmers for growing its FL-2027 chip potato outside its contract programme; it withdrew the suits in May 2019 after protests, and the PPVFR Authority revoked its variety registration in December 2021 (litigation continued in the Delhi High Court). Shows buyer power and the seed-rights risk for farmers"},{"l":"Note","t":"the [[94%]] figure (IJDR) comes from a single survey in a little-known journal; the PepsiCo case is the safer AGAINST example"}],"q":"Which laws and cases shape contract farming in India?"}]},{"id":"GS36-supermarkets","line":"GS3.6","part":"","name":"Supermarkets","own":true,"cards":[{"k":"define","text":"Organised modern retail (supermarkets, hypermarkets, online grocery) that buys produce through its own supply chains, bypassing the mandi chain of intermediaries.","q":"What is organised retail (supermarkets)?"},{"k":"list","q":"Which mandi chain do supermarkets bypass, and who does it?","rows":[{"l":"The mandi chain","t":"village merchant → transporter → labourers → graders → arhtiyas → brokers → speculators who buy cheap in a glut"},{"l":"Examples","t":"Reliance Retail; ITC e-Choupal links farmers digitally"}]},{"k":"for","rows":[{"l":"Shorter chain","t":"direct buying from farmers and FPOs can cut intermediaries and raise the farmer’s share; near cities they buy at the farm gate, for distant farmers through aggregators (cooperatives, logistics firms), saving transport and unloading costs"},{"l":"Low margin, high volume","t":"can pay farmers more and still sell cheaper; supports SDG 12.3"},{"l":"Supply-chain investment","t":"cold storage, grading and logistics improve quality and cut wastage"},{"l":"Demand pull for processing","t":"steady demand for graded and branded products"}],"q":"How can supermarkets help farmers and consumers?","cue":"Shorter chain → lower margins → better infrastructure → demand for processing."},{"k":"against","rows":[{"l":"Limited reach","t":"organised retail is concentrated in cities, so most rural demand is still met by unbranded products (see Numbers)","h":"Infrastructure"},{"l":"Thin procurement investment","t":"many chains spend little on collection infrastructure; unfair trading practices; strict standards cause food waste","h":"Infrastructure"},{"l":"Buyer power","t":"large retailers can squeeze suppliers on price and payment terms","h":"Markets"},{"l":"Small farmers left out","t":"volume and quality standards favour larger suppliers","h":"Equity and sustainability"}],"q":"What are the downsides of supermarket-led supply chains?","cue":"Limited reach → Thin procurement investment → Buyer power → Small farmers left out."}]},{"id":"GS36-food-processing-industry","line":"GS3.6","part":"","name":"Food processing industry","own":true,"cards":[{"k":"define","q":"What is the food processing industry?","text":"Turning raw farm, livestock, and fishery produce into longer-lasting, higher-value products—spanning primary(cleaning, grading, milling), secondary (canning, freezing, pulping), and tertiary (ready-to-eat, branded)stages. Bridges agriculture and manufacturing under the Ministry of Food Processing Industries (MoFPI)."},{"k":"for","q":"Why is food processing important for India?","rows":[{"l":"Boosts farmer incomes by creating a second buyer that cuts distress sales and drives diversification into fruits, vegetables, millets, and makhana (backed by [[₹800 crore]] PLI for millet products, 2023 International Year of Millets, and India being the largest spice producer)","t":""},{"l":"Generates massive rural and women-centric employment as the largest employer in organised manufacturing ([[12.8%]] of registered-sector jobs)","t":""},{"l":"Curbs the [[≈30–40%]] post-harvest loss in fruits and vegetables, stabilises prices by absorbing gluts (Operation Greens), and enables food fortification","t":""},{"l":"Drives high-value exports","t":"processed food rose from [[14.9%]] to [[23.4%]] of agri-food exports (2017–18 to 2022–23, ES 2023–24)—aided by [[100%]] FDI, PLI, organic exports, and AI/IoT adoption."},{"l":"Expands national reach for small processors and FPOs via D2C brands (growing [[≈40%]]/year), quick commerce ([[≈$6–7 billion]] in 2024; Blinkit, Zepto, Instamart), and ONDC ([[5,000]]+ FPOs selling millet and GI products)","t":""}],"cue":"Processing links farms to factories, cutting waste while raising farmer incomes, jobs, and exports."},{"k":"against","q":"What constraints does the food processing industry face?","rows":[{"l":"Acute cold-chain, reefer, and storage gaps","t":"India needs [[≈61 MT]] of cold storage, pushing logistics costs to [[14–18%]] of product price against [[≈8%]] globally."},{"l":"Very low processing levels (fruits [[4.5%]], vegetables [[2.7%]]) stuck mostly at the primary stage with old machinery in micro units, alongside price-sensitive consumers who prefer fresh staples and weak food brands/GIs","t":""},{"l":"Multiple licenses, heavy FSSAI rules, restrictive APMC direct-buying limits, and weak quality checks","t":"(e.g., tricyclazole residues in rice) hurt small units and exports."},{"l":"Costly institutional credit (banks wary of seasonal, perishable raw materials) combined with an unskilled workforce and low food-safety awareness","t":""},{"l":"Processing capacity remains concentrated in a few states, while rising packaged food creates plastic packaging waste","t":""}],"cue":"Weak cold chains, low value addition, costly credit, and heavy compliance trap the sector in low-margin primary processing."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Bridge storage and cold-chain gaps through PM Kisan SAMPADA Yojana (PMKSY) cold chains,irradiation units, Mega Food Parks, and the Agriculture Infrastructure Fund","t":""},{"l":"Formalise micro units and upgrade old machinery through PMFME credit-linked subsidies and PLIschemes (PLISFPI)","t":""},{"l":"Boost domestic demand and global branding via PLISFPI branding support, tax cuts (GST [[2.0]] moved most processed food to [[5%]]), and food GI promotion","t":""},{"l":"Simplify FSSAI compliance with single-window clearances, allow direct farm-gate buying outside APMCs,and enforce farm-level residue testing","t":""},{"l":"Build skilled manpower via NIFTEM institutes (including the new one announced for Bihar in Budget 2025–26) and enforce sustainable packaging norms","t":""}],"cue":"Build cold-chain infrastructure, subsidise micro-unit credit and branding, simplify rules, and train workers."},{"k":"data","rows":[{"l":"Size and growth","t":"GVA [[₹1.3 lakh crore]] (2014-15) → [[₹2.2 lakh crore]] (2023-24); growth [[≈7.3%]] a year (Agriculture notes). Shares: [[≈8%]] of agricultural GVA and [[≈8%]] of manufacturing GVA (Agriculture notes; [[8.5%]] and [[7.7%]] in 2022-23, MoFPI)"},{"l":"Employment","t":"rose from [[≈17 lakh]] to [[20 lakh]] in FY22 (ASI, Agriculture notes); food products had the most factories (40,508) in ASI 2022-23 and still employ the most in ASI 2024-25. Unregistered units employ [[≈51 lakh]] more (NSS 73rd round), so [[≈70%]] of the sector’s workers are in unorganised units (Agriculture notes)"},{"l":"Exports and FDI","t":"[[≈13%]] of India’s total exports (Agriculture notes); FDI equity [[$7.3 bn]], April 2014 to March 2025 (MoFPI)"},{"l":"Processing level","t":"[[under 10%]] overall, against [[≈23%]] in China and [[≈70%]] in Brazil (notebook); milk [[21.1%]], fish [[15.4%]], meat [[34.2%]] (MoFPI study, cited in Parliament); [[≈65%]] of fruit and vegetable output is processed in the USA (KPMG, cited in an RBI Bulletin)"},{"l":"Demand constraints","t":"only [[≈9%]] of rural demand is for processed food; [[≈80%]] of the market is unbranded (Agriculture notes); rural FMCG grows [[≈6.8%]] against [[≈3.7%]] urban (notebook)"},{"l":"Market size","t":"food consumption projected at [[≈$560 bn]] (2024); processed fruits and vegetables [[≈$15 bn]]; the sector is expected to double to [[≈$700 bn]] by 2030 from [[≈$307 bn]] in 2023 (PHDCCI; notebook); grocery consumption [[≈$1.2 trillion]] by 2025-26; India is the 3rd-largest packaging market, [[≈$2.8 bn]] → [[≈$6.4 bn]] by 2029 (notebook)","unlikely":true}],"q":"What data and schemes back up food processing?"},{"k":"data","rows":[{"l":"PLISFPI (Cabinet, 31 March 2021; [[₹10,900 crore]], 2021-22 to 2026-27)","t":"incentives on incremental sales plus support for Indian brands abroad; [[₹9,207 crore]] invested and [[≈3.4 lakh]] jobs against a [[2.5 lakh]] target; capacity up [[34 LMT]] a year; beneficiaries’ export sales [[₹89,053 crore]], April 2021 to September 2025 (PIB, April 2026; Parliament, July 2026)"},{"l":"FDI","t":"[[100%]] through the automatic route in food processing (DPIIT)"},{"l":"GST 2.0 (56th GST Council, effective 22 Sept 2025)","t":"UHT milk, paneer and Indian breads to nil (MoFPI)"},{"l":"World Food India 2025 (25–28 Sept, Bharat Mandapam)","t":"26 MoUs worth [[₹102,046.9 crore]], over 64,000 direct jobs expected (MoFPI)"},{"l":"Amul","t":"is the world’s strongest dairy brand (Brand Finance, BSI 91/100, AAA+); it runs the largest curd plant, in Kolkata (notebook)"}],"q":"What data and schemes back up food processing?"},{"k":"diagram","q":"Draw the diagram for Food processing industry","g":{"dir":"TD","nodes":[["F","Food processing"],["P","Primary - cleaning, grading, milling"],["S","Secondary - canning, freezing, pulping"],["T","Tertiary - ready-to-eat, branded"],["E","Value addition and exports"]],"edges":[["F","P",""],["F","S",""],["F","T",""],["T","E",""]]}}]},{"id":"GS36-location-of-food-processing-industries","line":"GS3.6","part":"","name":"Location of Food Processing Industries","own":true,"cards":[{"k":"define","q":"What decides where a food processing unit locates?","text":"Where a unit locates sets its cost of raw material, transport, and access to buyers. Perishable or weight-losing raw material pulls units toward farms; bulky, fragile, or quickly sold final goods pull them toward cities."},{"k":"for","q":"What patterns explain the location of food processing industries?","rows":[{"l":"Pulls units toward raw-material belts when crops are perishable or weight-losing","t":"e.g. sugar mills in Uttar Pradesh and Maharashtra cane belts, rice mills in Punjab and Haryana, and seafood processing on the coasts"},{"l":"Pulls units toward large cities when final goods are bulky, fragile, or quickly sold","t":"e.g. bakeries, beverages, and fresh dairy products"},{"l":"Attracts units to ports, highways, and reliable power hubs to cut freight costs and boost exports","t":"e.g. spice and marine export units near Kochi and Visakhapatnam ports"},{"l":"Draws units into policy-led clusters that share cold chains and farm-gate primary processing centres","t":"e.g. Mega Food Parks and agro-processing clusters under PMKSY, and One District One Product under PMFME"},{"l":"Opens up new eastern hubs through targeted regional institutions and crop boards","t":"e.g. National Makhana Board and a new NIFTEM in Bihar announced in Budget 2025–26"}],"cue":"Units locate where total transport and spoilage costs are lowest—near farms for perishable inputs, near cities for fragile outputs, and near supported clusters."},{"k":"against","q":"What keeps food processing away from lagging regions?","rows":[{"l":"Weak power, rural roads, and cold chains keep units away from eastern and north-eastern states despite rich farm output","t":""},{"l":"Thin local demand and long distances to urban or port buyers raise freight and spoilage costs","t":""},{"l":"Investment clusters where infrastructure already exists","t":"(e.g., Maharashtra, Gujarat, and Andhra Pradesh),leaving lagging states further behind."},{"l":"Differing state incentives distort location choices, making units chase subsidies rather than raw-material proximity","t":""},{"l":"Rural land-conversion hurdles, costly credit, and shortage of skilled workers push units toward established cities","t":""}],"cue":"Missing rural infrastructure, distant buyers, and uneven state policies push factories into already-developed regions."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Build shared primary processing centres, cold chains, and reliable power in lagging eastern and north-eastern states (via PMKSY Agro-Processing Clusters and the Agriculture Infrastructure Fund)","t":""},{"l":"Connect farm-gate hubs to major cities and ports using dedicated freight routes","t":"e.g. Kisan Rail, Krishi UDAN, and PM Gati Shakti multimodal parks"},{"l":"Anchor units to local crop strengths rather than subsidy shopping through cluster schemes","t":"e.g. One District One Product under PMFME and the National Makhana Board in Bihar"},{"l":"Simplify rural land-use conversion and provide plug-and-play industrial sheds with single-window clearances near farms","t":""},{"l":"Set up regional food-technology training institutes near production belts","t":"(e.g., the new NIFTEM in Bihar) to build local skilled manpower."}],"cue":"Build shared rural infrastructure, link farm belts to freight corridors, and tie incentives to local crop strengths."},{"k":"data","q":"Which examples show location choices?","title":"Data","rows":[{"l":"Patanjali food park, Haridwar","t":"rural jobs and farmer linkages (notebook)"},{"l":"Mithila makhana","t":"(GI tag 2022; Bihar grows [[≈80%]] of India’s makhana): Budget 2025-26 set up a Makhana Board for production, processing, value addition and marketing, with growers organised into FPOs. The ICAR National Research Centre for Makhana is at Darbhanga, and makhana is a One District One Product crop in Darbhanga and Muzaffarpur. Traditional methods yield only 1.7–1.9 t/ha against 3–3.5 t/ha with improved varieties (ICAR, 2020)"}]}]},{"id":"GS36-upstream-and-downstream-requirements-and","line":"GS3.6","part":"","name":"Upstream and downstream supply chain (food processing)","own":false,"cards":[{"k":"define","text":"Upstream: everything before the factory gate (inputs, farming, aggregation, storage, transport of raw produce). Downstream: everything after processing (packaging, branding, distribution, retail, exports).","q":"What are the upstream and downstream requirements of food processing?"},{"k":"for","rows":[{"l":"Assured raw material","t":"contract farming and FPOs supply the right variety and quality (see Contract farming; FPOs, GS3.4)"},{"l":"Storage and finance","t":"warehouses and loans against e-NWRs (see GS3.4 → Marketing)"},{"l":"Cold chain","t":"integrated cold-chain projects and 50 irradiation units under PMKSY (see Government steps)"},{"l":"Food safety","t":"100 NABL-accredited food testing labs under PMKSY; FSSAI standards"},{"l":"Market access and e-commerce","t":"ONDC; [[100%]] FDI through the government route for trading, including e-commerce, of food made in India; organised retail (see Supermarkets)"},{"l":"Exports","t":"PLISFPI supports Indian brands abroad"}],"q":"What strengthens the food processing supply chain?","cue":"Assured raw material → storage and finance → cold chain → testing → market access → exports."},{"k":"against","rows":[{"l":"Finance","t":"small units cannot afford cold storage or carry stock"},{"l":"People and skills","t":"farmers lack training in grading and hygiene"},{"l":"Infrastructure","t":"[[≈97%]] of fruits and vegetables travel by road; only [[≈4%]] of fruits move in reefer trucks (see GS3.4 → Marketing)"},{"l":"Markets","t":"many intermediaries; farmers get only about a third of the consumer rupee for tomato, onion and potato (RBI, see GS3.4)"},{"l":"Technology","t":"weak traceability and digital records among small traders"},{"l":"Rules and institutions","t":"APMC rules and stock limits deter bulk buying"},{"l":"Equity and sustainability","t":"[[≈30–40%]] of fruits and vegetables are lost after harvest (notebook); packaging waste"}],"q":"Where does the food processing supply chain break down?","cue":"No money, no training, road-only transport, middlemen, no traceability, APMC limits, losses."},{"k":"value","rows":[{"l":"Losses","t":"the ICAR-CIPHET study (2015) put harvest and post-harvest losses at [[≈₹92,651 crore]] a year"},{"l":"Thinking framework (allied sectors)","t":"plant products need a regulatory mechanism; animal products need health, mechanism and environment; regulation covers both"},{"l":"Conclusion anchor","t":"SDG 12.3 (halve per-capita food waste and reduce food losses along supply chains by 2030); processing is the main lever"},{"l":"PM Kisan SAMPADA Yojana (PMKSY, MoFPI umbrella scheme)","t":"[[₹6,520 crore]] for 2021-22 to 2025-26 after an extra [[₹1,920 crore]] in July 2025, including [[₹1,000 crore]] for 50 multi-product food irradiation units ([[20–30 LMT]] a year) and 100 NABL-accredited food testing labs (Cabinet, 31 July 2025). Components: Mega Food Parks (scheme discontinued from 2021), integrated cold chain, agro-processing clusters, backward and forward linkages, processing capacity, food safety infrastructure. Agro-processing clusters: common infrastructure plus at least 5 units each. Cold chain: [[≈10.3 lakh]] MT of cold storage and [[≈335 MT]] of individual quick freezing created by 2023 (notebook). NABARD’s [[≈$263]] mn Food Processing Fund lends to Mega Food Parks (notebook). Operation Greens and the Cold Chain Scheme: see GS3.4 → Marketing"}],"q":"Which schemes and data address supply-chain gaps?"},{"k":"diagram","q":"Draw the diagram for Upstream and downstream supply chain (food processing)","g":{"dir":"LR","nodes":[["I","Inputs and farm"],["A","Aggregation - FPOs, contract farming"],["S","Storage and cold chain"],["P","Processing unit"],["D","Packaging and branding"],["M","Retail, e-commerce, exports"]],"edges":[["I","A",""],["A","S",""],["S","P",""],["P","D",""],["D","M",""]]}}]},{"id":"GS36-micro-food-processing-units","line":"GS3.6","part":"","name":"Micro food processing units","own":true,"cards":[{"k":"define","q":"What are micro food processing units?","text":"Small, mostly unregistered, largely rural and family-run units such as flour and oil mills, pickles, papad, jaggery and sweets."},{"k":"for","q":"Why do micro food processing units matter?","rows":[{"l":"Keeps processing margins with farmers, SHGs, and FPOs while creating a local buyer that encourages crop diversification","t":""},{"l":"Generates massive rural and women-led employment (under PMFME, [[44%]] of beneficiaries are women and [[≈90%]] are first-generation entrepreneurs; MoFPI, July 2026)","t":""},{"l":"Cuts post-harvest wastage through primary processing right near the farm before perishables spoil","t":""},{"l":"Curbs distress migration by creating steady non-farm work inside villages","t":""},{"l":"Builds collective scale when SHGs, FPOs, and cooperatives share common facilities","t":"e.g. One District One Product clusters"}],"cue":"Local, low-capital processing keeps profits in villages, cuts crop spoilage, and creates rural jobs for women and youth."},{"k":"against","q":"What holds micro food processing units back?","rows":[{"l":"Costly credit and strict collateral demands despite priority-sector status, worsened by complex procedures and low financial literacy","t":""},{"l":"Lack of brands, small volumes, and seasonal, perishable raw materials make it hard to hold buffer stocks or compete with big firms","t":""},{"l":"Outdated, low-capacity machinery alongside erratic power and missing common processing, storage, or testing facilities","t":""},{"l":"Heavy FSSAI and GST compliance burdens on informal units, paired with little training in technology,hygiene, and business","t":""},{"l":"Uneven regional uptake concentrated in a few states (Bihar, Maharashtra, Uttar Pradesh, Tamil Nadu, and Madhya Pradesh lead)","t":""}],"cue":"Informality, costly credit, outdated machines, and weak market reach trap micro units in low-value survival."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Ease credit access via PMFME’s [[35%]] credit-linked subsidy (up to [[₹10 lakh]]) and [[₹40,000]] seed capital per SHG member","t":""},{"l":"Build shared processing, storage, and testing hubs under PMFME common infrastructure ([[108]] sanctioned, [[59]] working by Dec 2025) and One District One Product clusters","t":""},{"l":"Boost market reach through PMFME’s [[50%]] grant for branding and marketing alongside direct digital selling on ONDC","t":""},{"l":"Handhold informal units into FSSAI and GST compliance ([[59,202]] units formalised under PMFME by Dec 2025)","t":""},{"l":"Upgrade skills in hygiene, machinery, and business via PMFME training ([[≈1.8 lakh]] trained, [[77%]] women)and expand outreach to lagging states","t":""}],"cue":"Subsidised credit, shared infrastructure, formalisation,
