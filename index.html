ses, coarse cereals) – renamed the National Food Security and Nutrition Mission (2024-25); runs under Krishonnati Yojana ([[₹44,247 crore]], Cabinet, Oct 2024)"},{"l":"National Mission on Edible Oils–Oilseeds (Oct 2024)","t":"primary oilseed output from [[39 MT]] (2022-23) to [[69.7 MT]] by 2030-31"},{"l":"Mission for Aatmanirbharta in Pulses","t":"(Oct 2025, [[₹11,440 crore]], 2025-26 to 2030-31): output to [[350 lakh]] tonnes, area to [[310 lakh]] ha, yield to [[1,130 kg]]/ha by 2030-31; tur, urad and masoor first (PIB)"}]}]},{"id":"GS35-midh-and-horticulture","line":"GS3.5","part":"Technology missions","name":"MIDH and horticulture","own":true,"cards":[{"k":"define","q":"What is MIDH?","text":"Mission for Integrated Development of Horticulture (MIDH): Centrally sponsored scheme (since 2014–15)covering fruits, vegetables, spices, flowers, plantation crops, and mushrooms."},{"k":"for","q":"What has horticulture achieved under MIDH?","rows":[{"l":"Surpassed foodgrain output at [[≈370 MT]] in 2024–25 (NAAS), with MIDH lifting area by [[≈9%]], output by [[≈14%]], and annual growth to [[≈3%]] (PIB)","t":""},{"l":"Nearly doubled average horticulture household income from [[≈₹0.7 lakh]] to [[₹1.3 lakh]] a year (PIB) through higher per-hectare returns","t":""},{"l":"Added [[≈15.7 lakh]] ha since 2014–15 and set up [[58]] Centres of Excellence (PIB, 2025) for quality planting material and modern techniques","t":""},{"l":"Improved crop forecasting and transparency via CHAMAN (GIS and remote-sensing estimates for mango, banana, tomato, onion, and three other crops) and HORTNET (online tracked applications under the National Horticulture Board)","t":""},{"l":"Strengthens national micronutrient security and creates year-round, labour-intensive rural jobs in picking,grading, and packing","t":"e.g. protected cultivation and floriculture"}],"cue":"High-value horticulture yields more per hectare than cereals, boosting farm incomes, nutrition, and crop diversification."},{"k":"against","q":"What holds horticulture back?","rows":[{"l":"Heavy post-harvest losses","t":"[[≈30–40%]] of fruits and vegetables spoil due to acute cold-storage and pack-house gaps."},{"l":"Too few processing units and weak market linkages trigger distress sales and sharp price swings during harvest gluts","t":"e.g. tomato, onion, and potato crashes"},{"l":"Smallholders miss out on capital-heavy infrastructure like polyhouses, drip systems, and cold storages due to small farm sizes","t":""},{"l":"Weak institutional credit linkage leaves farmers short of working capital for high-input horticultural crops","t":""},{"l":"Uneven adoption and fund utilisation across states limit balanced regional growth","t":"e.g. lagging uptake in eastern and rainfed states"}],"cue":"High perishability combined with weak cold chains, processing, credit, and smallholder access causes heavy waste and price crashes."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Build farm-gate pack-houses, cold storages, and reefer transport by converging MIDH with the Agriculture Infrastructure Fund (AIF)","t":""},{"l":"Expand local processing and price-stabilisation support to absorb gluts and cut [[≈30–40%]] waste","t":"e.g. PM Kisan SAMPADA Yojana and Operation Greens"},{"l":"Aggregate smallholders into crop-specific clusters and FPOs to share infrastructure and sell directly on e-NAM and ONDC","t":"e.g. Horticulture Cluster Development Programme"},{"l":"Widen institutional credit and weather-indexed insurance for high-value crops","t":"e.g. Kisan Credit Card and Restructured Weather Based Crop Insurance Scheme"},{"l":"Improve state-level execution through performance-linked MIDH grants and disease-free planting material from the [[58]] Centres of Excellence","t":""}],"cue":"Build farm-gate cold chains, boost processing, aggregate smallholders into clusters, and ease credit to cut waste and stabilise prices."},{"k":"data","q":"Which programmes and examples back up MIDH?","title":"Data","rows":[{"l":"MIDH (Mission for Integrated Development of Horticulture)","t":"Cluster Development Programme for horticulture (NHB): Mega cluster above [[15,000 ha]] up to [[₹100 crore]]; Midi [[5,000–15,000 ha]] up to [[₹50 crore]]; Mini up to [[5,000 ha]] up to [[₹25 crore]]"},{"l":"Uttar Pradesh date palm","t":"Uttar Pradesh subsidises date palm (Agriculture notes) : [[40%]] subsidy on a cost of [[₹4 lakh]]/ha under MIDH (notebook; [[₹4 lakh]] not traced)","unlikely":true}]}]},{"id":"GS35-livestock-economics","line":"GS3.5","part":"Animal rearing","name":"Livestock economics","own":true,"cards":[{"k":"define","q":"What is meant by livestock economics?","text":"Rearing of animals for milk, meat, and other produce, providing a steady source of rural income beyond crops."},{"k":"for","q":"Why does livestock matter for the rural economy?","rows":[{"l":"High economic growth","t":"accounts for [[≈31%]] of agricultural GVA and [[≈5.5%]] of total GVA, growing [[≈195]]%between FY15 and FY24 ([[12.8%]] CAGR; milk is [[≈82%]] of livestock GVA)."},{"l":"Major rural and women's employment","t":"employs [[≈20 million]] people and supports [[≈8 crore]] farmers, with women forming [[≈70%]] of the workforce."},{"l":"Acts as a climate buffer, steadying farm household income when monsoon or crop failures strike","t":"e.g. drought-prone and rainfed regions"},{"l":"Strong export earner","t":"buffalo meat exports hit [[₹34,392 crore]] in FY25 ([[≈82%]] of animal-product exports; India ranks 3rd globally by volume)."},{"l":"Provides circular farm utility","t":"milk, meat, eggs, and draught power alongside dung for organic manure and biogas (e.g., GOBARdhan scheme)."}],"cue":"Livestock drives rapid agricultural growth, employs rural women, and cushions farm households against crop failure."},{"k":"against","q":"What holds back India’s livestock sector?","rows":[{"l":"Low productivity due to breed and feed gaps","t":"milk yield averages [[≈1,777 kg]] per animal per year in India against [[≈2,699 kg]] globally."},{"l":"Frequent disease outbreaks (foot-and-mouth disease, haemorrhagic septicaemia, brucellosis, and lumpy skin) cut output, worsened by weak veterinary infrastructure and antimicrobial resistance","t":""},{"l":"Largely unorganised markets push marketing costs to [[15–20%]] of the sale price, hurting farmer margins (especially outside dairy cooperatives)","t":""},{"l":"Acute fodder shortage and high emissions","t":"only [[≈5%]] of land is under fodder, while livestock cause [[≈15]]%of global greenhouse emissions, mostly enteric methane (FAO)."},{"l":"Minimal financial risk cover","t":"only [[≈16%]] of animals are insured, and just [[≈1%]] are covered under the National Livestock Mission."}],"cue":"Low animal yields, frequent disease outbreaks, unorganised markets, and fodder shortages hold back farmer returns."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Upgrade breeds and milk yields via Rashtriya Gokul Mission (conserves indigenous bovine breeds, nucleus breeding centres, artificial-insemination network, and one-time [[35%]] capital subsidy for heifer-rearing centres) and National Livestock Mission (breed, feed, and infrastructure)","t":""},{"l":"Control diseases and expand rural care through National Animal Disease Control Programme,National Animal Disease Reporting System, and mobile veterinary units with trained staff for artificial insemination, delivery, and vaccination","t":""},{"l":"Bridge fodder deficits and cut emissions by growing area-specific fodder for deficit regions and adopting Precision Livestock Farming (sensors, cameras, and apps tracking each animal's health, welfare, and output in real time)","t":""},{"l":"Scale integrated farming and widen livestock insurance","t":"e.g. an Uttarakhand farm combining fish, dairy, poultry, vegetables, an orchard, bees, and mushrooms earns [[≈₹6.4 lakh]] a year and buys no food from outside"},{"l":"Organise supply chains and boost market access through dairy cooperatives (Amul model) and digital platforms","t":"e.g. e-Gopala and ONDC"}],"cue":"Better breeds, mobile veterinary care, fodder security, integrated farming, and organised markets can unlock full sector value."},{"k":"data","rows":[{"l":"Milk","t":"[[247.9 MT]] in 2024-25, the world’s largest ([[≈25%]] of global output); 485 g per person per day (Basic Animal Husbandry Statistics 2025)"},{"l":"From the diagram","t":"Cooperative - Amul model"}],"q":"What do the milk numbers show?"},{"k":"diagram","q":"Draw the diagram for Livestock economics","g":{"dir":"LR","nodes":[["B","Breed and feed"],["A","Animal health"],["O","Output - milk, meat, eggs"],["C","Cooperative - Amul model"],["M","Market and exports"]],"edges":[["B","A",""],["A","O",""],["O","C",""],["C","M",""]]}}]},{"id":"GS35-national-livestock-mission","line":"GS3.5","part":"Animal rearing","name":"National Livestock Mission","own":true,"cards":[{"k":"define","q":"What is the National Livestock Mission?","text":"A centrally sponsored mission (2014–15, re-aligned 2021–22) for sustainable livestock growth through better breeds, fodder supply and rural entrepreneurship.","ed":true},{"k":"list","q":"What are the National Livestock Mission’s sub-missions?","rows":[{"l":"Breed development","t":"livestock and poultry"},{"l":"Feed and fodder"},{"l":"Innovation and extension"},{"l":"Works alongside","t":"Rashtriya Gokul Mission (indigenous cattle)"}]},{"k":"for","q":"What does the National Livestock Mission offer?","rows":[{"l":"Empowers landless farmers and women by boosting small-animal value chains","t":"sheep, goats, pigs, and backyard poultry (key rural household assets)."},{"l":"Sparks rural entrepreneurship via a [[50%]] capital subsidy up to [[₹50 lakh]] for poultry, sheep, goat, pig, and fodder units (NLM-EDP)","t":""},{"l":"Shows strong uptake with [[≈3,300]] projects sanctioned and [[≈₹1,100 crore]] in subsidy approved (Lok Sabha, March 2025)","t":""},{"l":"Tackles the fodder deficit through subsidised fodder seeds, hay, and silage units","t":"e.g. Fodder Plus FPOs"},{"l":"Raises herd productivity and cuts risks through breed improvement, extension services, and livestock insurance support","t":""}],"cue":"Small animals and fodder support give landless families steady income while capital subsidies build rural enterprises."},{"k":"against","q":"What are its limits?","rows":[{"l":"Back-ended subsidy rules require a bank loan and guarantee upfront, shutting out landless and small farmers who lack collateral","t":""},{"l":"Negligible risk cover","t":"only [[≈1%]] of livestock is insured under the mission, leaving poor owners exposed to disease losses."},{"l":"Thin fodder land and weak veterinary services limit animal survival and productivity on the ground","t":""},{"l":"Unorganised markets and weak modern processing for sheep, goat, and pig meat leave breeders dependent on middlemen","t":""},{"l":"Complex project proposals (DPRs), low awareness, and uneven state execution skew benefits toward larger entrepreneurs","t":""}],"cue":"Upfront loan rules, tiny insurance cover, and thin fodder and vet support keep poor farmers out."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Use Credit Guarantee Funds and channel loans through SHGs and FPOs so small farmers need no collateral","t":"e.g. NABARD guarantee cover"},{"l":"Bundle subsidised livestock insurance automatically with every NLM loan to raise coverage far above [[≈1%]]","t":""},{"l":"Grow community pastures and silage banks by converging with MGNREGA and Fodder Plus FPOs","t":""},{"l":"Build organised processing, cold chains, and direct buyer links for small-animal produce (converging with AHIDF and ONDC)","t":""},{"l":"Simplify online DPR applications in local languages and expand mobile veterinary units for doorstep care","t":""}],"cue":"Ease collateral rules via collectives, bundle insurance with loans, and link fodder, vet care, and markets."}]},{"id":"GS35-pink-revolution","line":"GS3.5","part":"Animal rearing","name":"Pink revolution","own":true,"cards":[{"k":"define","q":"What is the pink revolution?","text":"Modernising meat and poultry production and processing (the term is also used for onions and prawns)through organised abattoirs, cold chains, processing, and exports."},{"k":"for","q":"What is the case for the pink revolution?","rows":[{"l":"Tackles protein malnutrition with cheap nutrition","t":"eggs hit [[149.1 billion]] in 2024–25 (2nd in the world; [[106]] per person a year, BAHS 2025)."},{"l":"Drives large production scale","t":"meat output reached [[10.5 MT]] in 2024–25 (4th in the world), with poultry forming about half at [[5.2 MT]] (BAHS 2025)."},{"l":"Boosts export earnings","t":"buffalo meat exports hit [[₹34,392 crore]] in FY25 (3rd globally by volume; [[≈82%]] of animal-product exports)."},{"l":"Raises rural incomes quickly because poultry and small-animal rearing need little land and give fast cash returns","t":"e.g. contract poultry farming in Tamil Nadu"},{"l":"Cuts spoilage and adds value through cold chains, processing, and by-products","t":"e.g. leather and gelatin"}],"cue":"Modernising meat and poultry provides affordable protein, boosts rural incomes, and turns India into a global export hub."},{"k":"against","q":"What holds the pink revolution back?","rows":[{"l":"Mostly unorganised slaughter with weak hygiene and cold chains causes spoilage, contamination, and export rejections","t":""},{"l":"Varying state cattle-slaughter laws and uneven FSSAI food-safety enforcement create regulatory uncertainty","t":""},{"l":"Low domestic demand base","t":"meat availability is only [[7.5 kg]] per person a year (BAHS 2025) due to cultural preferences and low incomes."},{"l":"Disease outbreaks (like bird flu) and antibiotic overuse in poultry raise zoonotic and antimicrobial resistance (AMR) risks","t":""},{"l":"Untreated slaughterhouse waste pollutes local water bodies, while spikes in maize and soymeal feed prices squeeze farmer margins","t":""}],"cue":"Unorganised slaughter, weak cold chains, uneven state rules, and disease risks hold back domestic quality and exports."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Build modern abattoirs, processing units, and cold chains","t":"e.g. via Animal Husbandry Infrastructure Development Fund and PM Kisan SAMPADA Yojana"},{"l":"Enforce strict FSSAI hygiene rules, traceability, and export certification","t":"e.g. APEDA-registered integrated meat plants"},{"l":"Control animal diseases and curb antibiotic misuse in poultry","t":"e.g. National Animal Disease Control Programme and One Health framework"},{"l":"Provide working capital and stable feed access to small farmers via FPOs and Kisan Credit Cards (and National Livestock Mission)","t":""},{"l":"Convert slaughterhouse waste into biogas and organic manure to stop pollution","t":"e.g. GOBARdhan scheme"}],"cue":"Build modern abattoirs and cold chains, enforce strict hygiene and disease control, and support small farmers with credit and feed."}]},{"id":"GS35-mariculture","line":"GS3.5","part":"Animal rearing","name":"Mariculture and fisheries","own":true,"cards":[{"k":"define","text":"Farming of fish, shellfish and seaweed in the sea or in coastal saltwater.","q":"What is mariculture?","ed":true},{"k":"value","rows":[{"l":"Fisheries","t":"India is the 2nd-largest producer, with [[≈8%]] of global output. Production was [[197.75 lakh]] tonnes in FY25, up from [[95.8 lakh]] tonnes in FY14 (PIB, 6 Apr 2026)"},{"l":"PM Matsya Sampada Yojana (Blue Revolution 2.0)","t":"[[₹20,050 crore]], made up of a Central Sector part and a Centrally Sponsored part; implemented with NABARD’s support. Aims: fish production of [[22 MMT]] ([[19.8 MMT]] achieved in FY25), aquaculture productivity from 3 to 5 t/ha, post-harvest management, species diversification, technology such as GIS mapping. Also PM Matsya Kisan Samridhi Sah-Yojana"},{"l":"Neeli Kranti (Blue Revolution, 2015-16)","t":"forerunner of PMMSY; financed aquaculture (fish, crustaceans, molluscs, algae) and post-harvest activities. Run by the Department of Fisheries, implemented through state/UT departments and the National Fisheries Development Board"},{"l":"Budget 2026-27","t":"integrated development of 500 reservoirs and Amrit Sarovars for fisheries; stronger coastal fisheries value chains with start-ups, women-led groups and Fish Farmer Producer Organisations"}],"q":"What are the key fisheries numbers and schemes?"}]},{"id":"GS35-biofloc-technology","line":"GS3.5","part":"Animal rearing","name":"Biofloc technology","own":true,"cards":[{"k":"define","text":"Fish farming in tanks where beneficial microbes turn fish waste into protein-rich floc that the fish eat, allowing dense stocking with little water exchange.","q":"What is meant by biofloc technology?","ed":true}]},{"id":"GS36-contract-farming","line":"GS3.6","part":"","name":"Contract farming","own":true,"cards":[{"k":"define","text":"An agreement between farmers and a buyer (processor or retailer) to grow a crop at an agreed price and quality, often with inputs and technical support.","q":"What is contract farming?"},{"k":"list","title":"Contract farming vs corporate farming (2015 Q3)","rows":[{"l":"Land owner","t":"Contract farming: Farmer; Corporate farming: Company"},{"l":"Management","t":"Contract farming: Farmer runs the farm; Corporate farming: Company runs everything"},{"l":"Risk","t":"Contract farming: Shared by company and farmer; Corporate farming: Borne by the company"},{"l":"Aim","t":"Contract farming: Assured quantity and quality of produce; Corporate farming: Large, industrial-scale output"},{"l":"Farmer's status","t":"Contract farming: Independent producer; Corporate farming: Usually a wage labourer"}],"q":"How does contract farming differ from corporate farming?","cue":"Who owns, who runs, who bears risk, what is the aim, what is the farmer?"},{"k":"for","rows":[{"l":"Yield and income gains","t":"in a Benin and Ghana panel survey, yields rose [[29%]] under contract farming; incomes rise [[≈23–54%]] (notebook)"},{"l":"Assured market and price","t":"lowers market and price risk for small farmers"},{"l":"Steady supply for processors","t":"gives food processing industries a regular supply of the right quality"},{"l":"Technology access","t":"buyers bring seed, machines and know-how to small farmers"},{"l":"Scale without losing land","t":"pooled plots justify machines and shared drip irrigation while farmers keep ownership"}],"q":"What are the benefits of contract farming?","cue":"Higher yields → assured price → steady supply → technology → scale without selling land."},{"k":"against","rows":[{"l":"Debt and land risk","t":"about half of farm households are in debt, [[≈US$1,500]] each (notebook); a failed contract can push them towards losing land","h":"Finance"},{"l":"Exploitation of farmers","t":"in India a survey found [[94%]] of farmers faced exploitation and only [[6%]] benefited (IJDR)","h":"Markets"},{"l":"Power imbalance","t":"a few dominant buyers can put profit before farmers’ welfare","h":"Markets"},{"l":"Weak safeguards","t":"needs checks and balances: price floors, dispute resolution and land-title protection (Sansad TV perspective)","fix":"strong legal framework, standard farmer-friendly agreements, capacity building for marginal farmers","h":"Rules and institutions"},{"l":"Unequal benefits","t":"richer farmers gain most","h":"Equity and sustainability"}],"q":"What are the risks of contract farming?","cue":"Debt and land risk → Exploitation of farmers → Power imbalance → Weak safeguards → Unequal benefits."},{"k":"value","title":"Laws and cases","rows":[{"l":"Model Contract Farming Act, 2018","t":"released by the Centre in May 2018 (drafted by the Ashok Dalwai committee) for states to adopt: written agreement before sowing; contract farming kept outside the APMC Act; contracted produce insured; no permanent structure on the farmer’s land; sponsor must buy the agreed quantity; village-level facilitation groups; a state authority settles disputes"},{"l":"Tamil Nadu","t":"first state to pass a contract farming law on the model (2019; President’s assent October 2019)"},{"l":"Farm law of 2020","t":"the Farmers (Empowerment and Protection) Agreement on Price Assurance and Farm Services Act, 2020 gave a central framework for pre-agreed price contracts; repealed with the other two farm laws by the Farm Laws Repeal Act, 2021 (assent 30 Nov 2021)"},{"l":"PepsiCo potato case","t":"in 2019 PepsiCo sued Gujarat farmers for growing its FL-2027 chip potato outside its contract programme; it withdrew the suits in May 2019 after protests, and the PPVFR Authority revoked its variety registration in December 2021 (litigation continued in the Delhi High Court). Shows buyer power and the seed-rights risk for farmers"},{"l":"Note","t":"the [[94%]] figure (IJDR) comes from a single survey in a little-known journal; the PepsiCo case is the safer AGAINST example"}],"q":"Which laws and cases shape contract farming in India?"}]},{"id":"GS36-supermarkets","line":"GS3.6","part":"","name":"Supermarkets","own":true,"cards":[{"k":"define","text":"Organised modern retail (supermarkets, hypermarkets, online grocery) that buys produce through its own supply chains, bypassing the mandi chain of intermediaries.","q":"What is organised retail (supermarkets)?","ed":true},{"k":"list","q":"Which mandi chain do supermarkets bypass, and who does it?","rows":[{"l":"The mandi chain","t":"village merchant → transporter → labourers → graders → arhtiyas → brokers → speculators who buy cheap in a glut"},{"l":"Examples","t":"Reliance Retail; ITC e-Choupal links farmers digitally"}]},{"k":"for","rows":[{"l":"Shorter chain","t":"direct buying from farmers and FPOs can cut intermediaries and raise the farmer’s share; near cities they buy at the farm gate, for distant farmers through aggregators (cooperatives, logistics firms), saving transport and unloading costs"},{"l":"Low margin, high volume","t":"can pay farmers more and still sell cheaper; supports SDG 12.3"},{"l":"Supply-chain investment","t":"cold storage, grading and logistics improve quality and cut wastage"},{"l":"Demand pull for processing","t":"steady demand for graded and branded products"}],"q":"How can supermarkets help farmers and consumers?","cue":"Shorter chain → lower margins → better infrastructure → demand for processing."},{"k":"against","rows":[{"l":"Limited reach","t":"organised retail is concentrated in cities, so most rural demand is still met by unbranded products (see Numbers)","h":"Infrastructure"},{"l":"Thin procurement investment","t":"many chains spend little on collection infrastructure; unfair trading practices; strict standards cause food waste","h":"Infrastructure"},{"l":"Buyer power","t":"large retailers can squeeze suppliers on price and payment terms","h":"Markets"},{"l":"Small farmers left out","t":"volume and quality standards favour larger suppliers","h":"Equity and sustainability"}],"q":"What are the downsides of supermarket-led supply chains?","cue":"Limited reach → Thin procurement investment → Buyer power → Small farmers left out."}]},{"id":"GS36-food-processing-industry","line":"GS3.6","part":"","name":"Food processing industry","own":true,"cards":[{"k":"define","q":"What is the food processing industry?","text":"Turning raw farm, livestock, and fishery produce into longer-lasting, higher-value products—spanning primary(cleaning, grading, milling), secondary (canning, freezing, pulping), and tertiary (ready-to-eat, branded)stages. Bridges agriculture and manufacturing under the Ministry of Food Processing Industries (MoFPI)."},{"k":"for","q":"Why is food processing important for India?","rows":[{"l":"Boosts farmer incomes by creating a second buyer that cuts distress sales and drives diversification into fruits, vegetables, millets, and makhana (backed by [[₹800 crore]] PLI for millet products, 2023 International Year of Millets, and India being the largest spice producer)","t":""},{"l":"Generates massive rural and women-centric employment as the largest employer in organised manufacturing ([[12.8%]] of registered-sector jobs)","t":""},{"l":"Curbs the [[≈30–40%]] post-harvest loss in fruits and vegetables, stabilises prices by absorbing gluts (Operation Greens), and enables food fortification","t":""},{"l":"Drives high-value exports","t":"processed food rose from [[14.9%]] to [[23.4%]] of agri-food exports (2017–18 to 2022–23, ES 2023–24)—aided by [[100%]] FDI, PLI, organic exports, and AI/IoT adoption."},{"l":"Expands national reach for small processors and FPOs via D2C brands (growing [[≈40%]]/year), quick commerce ([[≈$6–7 billion]] in 2024; Blinkit, Zepto, Instamart), and ONDC ([[5,000]]+ FPOs selling millet and GI products)","t":""}],"cue":"Processing links farms to factories, cutting waste while raising farmer incomes, jobs, and exports."},{"k":"against","q":"What constraints does the food processing industry face?","rows":[{"l":"Acute cold-chain, reefer, and storage gaps","t":"India needs [[≈61 MT]] of cold storage, pushing logistics costs to [[14–18%]] of product price against [[≈8%]] globally."},{"l":"Very low processing levels (fruits [[4.5%]], vegetables [[2.7%]]) stuck mostly at the primary stage with old machinery in micro units, alongside price-sensitive consumers who prefer fresh staples and weak food brands/GIs","t":""},{"l":"Multiple licenses, heavy FSSAI rules, restrictive APMC direct-buying limits, and weak quality checks","t":"(e.g., tricyclazole residues in rice) hurt small units and exports."},{"l":"Costly institutional credit (banks wary of seasonal, perishable raw materials) combined with an unskilled workforce and low food-safety awareness","t":""},{"l":"Processing capacity remains concentrated in a few states, while rising packaged food creates plastic packaging waste","t":""}],"cue":"Weak cold chains, low value addition, costly credit, and heavy compliance trap the sector in low-margin primary processing."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Bridge storage and cold-chain gaps through PM Kisan SAMPADA Yojana (PMKSY) cold chains,irradiation units, Mega Food Parks, and the Agriculture Infrastructure Fund","t":""},{"l":"Formalise micro units and upgrade old machinery through PMFME credit-linked subsidies and PLIschemes (PLISFPI)","t":""},{"l":"Boost domestic demand and global branding via PLISFPI branding support, tax cuts (GST [[2.0]] moved most processed food to [[5%]]), and food GI promotion","t":""},{"l":"Simplify FSSAI compliance with single-window clearances, allow direct farm-gate buying outside APMCs,and enforce farm-level residue testing","t":""},{"l":"Build skilled manpower via NIFTEM institutes (including the new one announced for Bihar in Budget 2025–26) and enforce sustainable packaging norms","t":""}],"cue":"Build cold-chain infrastructure, subsidise micro-unit credit and branding, simplify rules, and train workers."},{"k":"data","rows":[{"l":"Size and growth","t":"GVA [[₹1.3 lakh crore]] (2014-15) → [[₹2.2 lakh crore]] (2023-24); growth [[≈7.3%]] a year (Agriculture notes). Shares: [[≈8%]] of agricultural GVA and [[≈8%]] of manufacturing GVA (Agriculture notes; [[8.5%]] and [[7.7%]] in 2022-23, MoFPI)"},{"l":"Employment","t":"rose from [[≈17 lakh]] to [[20 lakh]] in FY22 (ASI, Agriculture notes); food products had the most factories (40,508) in ASI 2022-23 and still employ the most in ASI 2024-25. Unregistered units employ [[≈51 lakh]] more (NSS 73rd round), so [[≈70%]] of the sector’s workers are in unorganised units (Agriculture notes)"},{"l":"Exports and FDI","t":"[[≈13%]] of India’s total exports (Agriculture notes); FDI equity [[$7.3 bn]], April 2014 to March 2025 (MoFPI)"},{"l":"Processing level","t":"[[under 10%]] overall, against [[≈23%]] in China and [[≈70%]] in Brazil (notebook); milk [[21.1%]], fish [[15.4%]], meat [[34.2%]] (MoFPI study, cited in Parliament); [[≈65%]] of fruit and vegetable output is processed in the USA (KPMG, cited in an RBI Bulletin)"},{"l":"Demand constraints","t":"only [[≈9%]] of rural demand is for processed food; [[≈80%]] of the market is unbranded (Agriculture notes); rural FMCG grows [[≈6.8%]] against [[≈3.7%]] urban (notebook)"},{"l":"Market size","t":"food consumption projected at [[≈$560 bn]] (2024); processed fruits and vegetables [[≈$15 bn]]; the sector is expected to double to [[≈$700 bn]] by 2030 from [[≈$307 bn]] in 2023 (PHDCCI; notebook); grocery consumption [[≈$1.2 trillion]] by 2025-26; India is the 3rd-largest packaging market, [[≈$2.8 bn]] → [[≈$6.4 bn]] by 2029 (notebook)","unlikely":true}],"q":"What data and schemes back up food processing?"},{"k":"data","rows":[{"l":"PLISFPI (Cabinet, 31 March 2021; [[₹10,900 crore]], 2021-22 to 2026-27)","t":"incentives on incremental sales plus support for Indian brands abroad; [[₹9,207 crore]] invested and [[≈3.4 lakh]] jobs against a [[2.5 lakh]] target; capacity up [[34 LMT]] a year; beneficiaries’ export sales [[₹89,053 crore]], April 2021 to September 2025 (PIB, April 2026; Parliament, July 2026)"},{"l":"FDI","t":"[[100%]] through the automatic route in food processing (DPIIT)"},{"l":"GST 2.0 (56th GST Council, effective 22 Sept 2025)","t":"UHT milk, paneer and Indian breads to nil (MoFPI)"},{"l":"World Food India 2025 (25–28 Sept, Bharat Mandapam)","t":"26 MoUs worth [[₹102,046.9 crore]], over 64,000 direct jobs expected (MoFPI)"},{"l":"Amul","t":"is the world’s strongest dairy brand (Brand Finance, BSI 91/100, AAA+); it runs the largest curd plant, in Kolkata (notebook)"}],"q":"What data and schemes back up food processing?"},{"k":"diagram","q":"Draw the diagram for Food processing industry","g":{"dir":"TD","nodes":[["F","Food processing"],["P","Primary - cleaning, grading, milling"],["S","Secondary - canning, freezing, pulping"],["T","Tertiary - ready-to-eat, branded"],["E","Value addition and exports"]],"edges":[["F","P",""],["F","S",""],["F","T",""],["T","E",""]]}}]},{"id":"GS36-location-of-food-processing-industries","line":"GS3.6","part":"","name":"Location of Food Processing Industries","own":true,"cards":[{"k":"define","q":"What decides where a food processing unit locates?","text":"Where a unit locates sets its cost of raw material, transport, and access to buyers. Perishable or weight-losing raw material pulls units toward farms; bulky, fragile, or quickly sold final goods pull them toward cities."},{"k":"for","q":"What patterns explain the location of food processing industries?","rows":[{"l":"Pulls units toward raw-material belts when crops are perishable or weight-losing","t":"e.g. sugar mills in Uttar Pradesh and Maharashtra cane belts, rice mills in Punjab and Haryana, and seafood processing on the coasts"},{"l":"Pulls units toward large cities when final goods are bulky, fragile, or quickly sold","t":"e.g. bakeries, beverages, and fresh dairy products"},{"l":"Attracts units to ports, highways, and reliable power hubs to cut freight costs and boost exports","t":"e.g. spice and marine export units near Kochi and Visakhapatnam ports"},{"l":"Draws units into policy-led clusters that share cold chains and farm-gate primary processing centres","t":"e.g. Mega Food Parks and agro-processing clusters under PMKSY, and One District One Product under PMFME"},{"l":"Opens up new eastern hubs through targeted regional institutions and crop boards","t":"e.g. National Makhana Board and a new NIFTEM in Bihar announced in Budget 2025–26"}],"cue":"Units locate where total transport and spoilage costs are lowest—near farms for perishable inputs, near cities for fragile outputs, and near supported clusters."},{"k":"against","q":"What keeps food processing away from lagging regions?","rows":[{"l":"Weak power, rural roads, and cold chains keep units away from eastern and north-eastern states despite rich farm output","t":""},{"l":"Thin local demand and long distances to urban or port buyers raise freight and spoilage costs","t":""},{"l":"Investment clusters where infrastructure already exists","t":"(e.g., Maharashtra, Gujarat, and Andhra Pradesh),leaving lagging states further behind."},{"l":"Differing state incentives distort location choices, making units chase subsidies rather than raw-material proximity","t":""},{"l":"Rural land-conversion hurdles, costly credit, and shortage of skilled workers push units toward established cities","t":""}],"cue":"Missing rural infrastructure, distant buyers, and uneven state policies push factories into already-developed regions."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Build shared primary processing centres, cold chains, and reliable power in lagging eastern and north-eastern states (via PMKSY Agro-Processing Clusters and the Agriculture Infrastructure Fund)","t":""},{"l":"Connect farm-gate hubs to major cities and ports using dedicated freight routes","t":"e.g. Kisan Rail, Krishi UDAN, and PM Gati Shakti multimodal parks"},{"l":"Anchor units to local crop strengths rather than subsidy shopping through cluster schemes","t":"e.g. One District One Product under PMFME and the National Makhana Board in Bihar"},{"l":"Simplify rural land-use conversion and provide plug-and-play industrial sheds with single-window clearances near farms","t":""},{"l":"Set up regional food-technology training institutes near production belts","t":"(e.g., the new NIFTEM in Bihar) to build local skilled manpower."}],"cue":"Build shared rural infrastructure, link farm belts to freight corridors, and tie incentives to local crop strengths."},{"k":"data","q":"Which examples show location choices?","title":"Data","rows":[{"l":"Patanjali food park, Haridwar","t":"rural jobs and farmer linkages (notebook)"},{"l":"Mithila makhana","t":"(GI tag 2022; Bihar grows [[≈80%]] of India’s makhana): Budget 2025-26 set up a Makhana Board for production, processing, value addition and marketing, with growers organised into FPOs. The ICAR National Research Centre for Makhana is at Darbhanga, and makhana is a One District One Product crop in Darbhanga and Muzaffarpur. Traditional methods yield only 1.7–1.9 t/ha against 3–3.5 t/ha with improved varieties (ICAR, 2020)"}]}]},{"id":"GS36-upstream-and-downstream-requirements-and","line":"GS3.6","part":"","name":"Upstream and downstream supply chain (food processing)","own":false,"cards":[{"k":"define","text":"Upstream: everything before the factory gate (inputs, farming, aggregation, storage, transport of raw produce). Downstream: everything after processing (packaging, branding, distribution, retail, exports).","q":"What are the upstream and downstream requirements of food processing?","ed":true},{"k":"for","rows":[{"l":"Assured raw material","t":"contract farming and FPOs supply the right variety and quality (see Contract farming; FPOs, GS3.4)"},{"l":"Storage and finance","t":"warehouses and loans against e-NWRs (see GS3.4 → Marketing)"},{"l":"Cold chain","t":"integrated cold-chain projects and 50 irradiation units under PMKSY (see Government steps)"},{"l":"Food safety","t":"100 NABL-accredited food testing labs under PMKSY; FSSAI standards"},{"l":"Market access and e-commerce","t":"ONDC; [[100%]] FDI through the government route for trading, including e-commerce, of food made in India; organised retail (see Supermarkets)"},{"l":"Exports","t":"PLISFPI supports Indian brands abroad"}],"q":"What strengthens the food processing supply chain?","cue":"Assured raw material → storage and finance → cold chain → testing → market access → exports."},{"k":"against","rows":[{"l":"Finance","t":"small units cannot afford cold storage or carry stock"},{"l":"People and skills","t":"farmers lack training in grading and hygiene"},{"l":"Infrastructure","t":"[[≈97%]] of fruits and vegetables travel by road; only [[≈4%]] of fruits move in reefer trucks (see GS3.4 → Marketing)"},{"l":"Markets","t":"many intermediaries; farmers get only about a third of the consumer rupee for tomato, onion and potato (RBI, see GS3.4)"},{"l":"Technology","t":"weak traceability and digital records among small traders"},{"l":"Rules and institutions","t":"APMC rules and stock limits deter bulk buying"},{"l":"Equity and sustainability","t":"[[≈30–40%]] of fruits and vegetables are lost after harvest (notebook); packaging waste"}],"q":"Where does the food processing supply chain break down?","cue":"No money, no training, road-only transport, middlemen, no traceability, APMC limits, losses."},{"k":"value","rows":[{"l":"Losses","t":"the ICAR-CIPHET study (2015) put harvest and post-harvest losses at [[≈₹92,651 crore]] a year"},{"l":"Thinking framework (allied sectors)","t":"plant products need a regulatory mechanism; animal products need health, mechanism and environment; regulation covers both"},{"l":"Conclusion anchor","t":"SDG 12.3 (halve per-capita food waste and reduce food losses along supply chains by 2030); processing is the main lever"},{"l":"PM Kisan SAMPADA Yojana (PMKSY, MoFPI umbrella scheme)","t":"[[₹6,520 crore]] for 2021-22 to 2025-26 after an extra [[₹1,920 crore]] in July 2025, including [[₹1,000 crore]] for 50 multi-product food irradiation units ([[20–30 LMT]] a year) and 100 NABL-accredited food testing labs (Cabinet, 31 July 2025). Components: Mega Food Parks (scheme discontinued from 2021), integrated cold chain, agro-processing clusters, backward and forward linkages, processing capacity, food safety infrastructure. Agro-processing clusters: common infrastructure plus at least 5 units each. Cold chain: [[≈10.3 lakh]] MT of cold storage and [[≈335 MT]] of individual quick freezing created by 2023 (notebook). NABARD’s [[≈$263]] mn Food Processing Fund lends to Mega Food Parks (notebook). Operation Greens and the Cold Chain Scheme: see GS3.4 → Marketing"}],"q":"Which schemes and data address supply-chain gaps?"},{"k":"diagram","q":"Draw the diagram for Upstream and downstream supply chain (food processing)","g":{"dir":"LR","nodes":[["I","Inputs and farm"],["A","Aggregation - FPOs, contract farming"],["S","Storage and cold chain"],["P","Processing unit"],["D","Packaging and branding"],["M","Retail, e-commerce, exports"]],"edges":[["I","A",""],["A","S",""],["S","P",""],["P","D",""],["D","M",""]]}}]},{"id":"GS36-micro-food-processing-units","line":"GS3.6","part":"","name":"Micro food processing units","own":true,"cards":[{"k":"define","q":"What are micro food processing units?","text":"Small, mostly unregistered, largely rural and family-run units such as flour and oil mills, pickles, papad, jaggery and sweets.","ed":true},{"k":"for","q":"Why do micro food processing units matter?","rows":[{"l":"Keeps processing margins with farmers, SHGs, and FPOs while creating a local buyer that encourages crop diversification","t":""},{"l":"Generates massive rural and women-led employment (under PMFME, [[44%]] of beneficiaries are women and [[≈90%]] are first-generation entrepreneurs; MoFPI, July 2026)","t":""},{"l":"Cuts post-harvest wastage through primary processing right near the farm before perishables spoil","t":""},{"l":"Curbs distress migration by creating steady non-farm work inside villages","t":""},{"l":"Builds collective scale when SHGs, FPOs, and cooperatives share common facilities","t":"e.g. One District One Product clusters"}],"cue":"Local, low-capital processing keeps profits in villages, cuts crop spoilage, and creates rural jobs for women and youth."},{"k":"against","q":"What holds micro food processing units back?","rows":[{"l":"Costly credit and strict collateral demands despite priority-sector status, worsened by complex procedures and low financial literacy","t":""},{"l":"Lack of brands, small volumes, and seasonal, perishable raw materials make it hard to hold buffer stocks or compete with big firms","t":""},{"l":"Outdated, low-capacity machinery alongside erratic power and missing common processing, storage, or testing facilities","t":""},{"l":"Heavy FSSAI and GST compliance burdens on informal units, paired with little training in technology,hygiene, and business","t":""},{"l":"Uneven regional uptake concentrated in a few states (Bihar, Maharashtra, Uttar Pradesh, Tamil Nadu, and Madhya Pradesh lead)","t":""}],"cue":"Informality, costly credit, outdated machines, and weak market reach trap micro units in low-value survival."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Ease credit access via PMFME’s [[35%]] credit-linked subsidy (up to [[₹10 lakh]]) and [[₹40,000]] seed capital per SHG member","t":""},{"l":"Build shared processing, storage, and testing hubs under PMFME common infrastructure ([[108]] sanctioned, [[59]] working by Dec 2025) and One District One Product clusters","t":""},{"l":"Boost market reach through PMFME’s [[50%]] grant for branding and marketing alongside direct digital selling on ONDC","t":""},{"l":"Handhold informal units into FSSAI and GST compliance ([[59,202]] units formalised under PMFME by Dec 2025)","t":""},{"l":"Upgrade skills in hygiene, machinery, and business via PMFME training ([[≈1.8 lakh]] trained, [[77%]] women)and expand outreach to lagging states","t":""}],"cue":"Subsidised credit, shared infrastructure, formalisation, and digital branding help micro units scale and compete."},{"k":"diagram","q":"Draw the diagram for Micro food processing units","g":{"dir":"TD","nodes":[["P","PMFME"],["C","35% credit-linked subsidy"],["S","Seed capital for SHGs"],["O","One District One Product"],["I","Common infrastructure"],["B","Branding and marketing"]],"edges":[["P","C",""],["P","S",""],["P","O",""],["P","I",""],["P","B",""]]}},{"k":"data","q":"How does PMFME support micro units?","title":"Data","rows":[{"l":"PMFME","t":"(29 June 2020, Atmanirbhar Bharat, centrally sponsored, [[₹10,000 crore]]): One District One Product. Its target of [[2 lakh]] units was crossed on 11 July 2026: [[≈₹20,300 crore]] investment, [[≈11 lakh]] jobs (MoFPI)"},{"l":"Budget allocations","t":"PMFME [[≈₹2,000 crore]]; PLISFPI [[≈₹1,400 crore]] (notebook)"}]},{"k":"data","q":"What is the scale of micro food processing?","rows":[{"l":"Units and jobs","t":"about [[25 lakh]] units provide [[74%]] of the sector’s jobs; [[66%]] rural, [[80%]] family-run (MoFPI)"},{"l":"Under-resourced","t":"just [[7%]] of plant investment and [[3%]] of credit, yet [[12%]] of output (PMFME guidelines)"}]}]},{"id":"GS36-data-x","line":"GS3.6","part":"","name":"Food processing: key data","own":true,"cards":[{"k":"data","title":"Lines","q":"Which lines can you quote?","rows":[{"l":"Nutraceuticals","t":"preparations designed for specific dietary needs (ES 2025-26)","unlikely":true}]}]},{"id":"GS37-land-titling","line":"GS3.7","part":"","name":"Land Titling","own":true,"cards":[{"k":"define","q":"What is land titling?","text":"A legal guarantee of ownership of a parcel of land, backed by accurate records and maps."},{"k":"for","q":"Why does India need conclusive land titles?","rows":[{"l":"Unlocks institutional credit and farm investment by letting owners pledge clear titles as bank collateral","t":"e.g. Kisan Credit Card and long-term loans"},{"l":"Cuts civil court congestion and property litigation through dispute-free, guaranteed ownership (land cases form [[≈66%]] of civil litigation, DAKSH)","t":""},{"l":"Enables safe land leasing and operational consolidation without fear of losing ownership","t":"e.g. Model Agricultural Land Leasing Act, 2016"},{"l":"Speeds up public infrastructure and fair land acquisition by clearly identifying rightful owners for compensation","t":""},{"l":"Improves governance, transparency, and welfare targeting by linking verified plots to schemes","t":"e.g. PM-KISAN and crop insurance via AgriStack"}],"cue":"Clear, legally guaranteed ownership unlocks bank credit, cuts court disputes, and makes land leasing and governance safe."},{"k":"against","q":"What stands in the way of clear land titles?","rows":[{"l":"Presumptive rather than conclusive titles","t":"current records only show who pays land revenue, not guaranteed ownership, so disputes persist despite digitisation."},{"l":"Outdated, fragmented records with incomplete spatial integration","t":"while [[99.8%]] of Records of Rights are computerised and [[≈97%]] of maps digitised, text and maps are integrated in only [[≈84%]] of villages (Standing Committee, Jan 2026)."},{"l":"Missing formal records for rural residential areas (abadi) leave village homesteads without legal proof or mortgage value","t":""},{"l":"Tiny, fragmented holdings","t":"a clear title alone cannot make uneconomic small plots viable without leasing or consolidation ([[86%]] of farmers own <[[2]] ha)."},{"l":"Unrecorded oral tenancies, delayed inheritance mutations, and high stamp duties discourage people from updating land records","t":""}],"cue":"Presumptive records, unintegrated maps, unmapped village homes, and tiny plot sizes limit the real-world gains of titling."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Transition from presumptive to conclusive titling with state-guaranteed ownership and indemnity","t":"e.g. NITI Aayog draft model law based on Torrens principles"},{"l":"Complete text-and-map integration and unique plot tagging under DILRMP (already [[99.8%]] Records of Rights computerised, [[≈97%]] maps digitised, [[≈84%]] villages integrated; Bhu-Aadhaar / ULPIN given to [[40.6 crore]] parcels, DoLR Aug 2026)","t":""},{"l":"Formalise village homestead ownership through drone surveys under SVAMITVA ([[3.3 lakh]] villages surveyed and [[3.2 crore]] property cards prepared, 2026)","t":""},{"l":"Enact transparent leasing laws to protect both landowners and tenants without affecting ownership titles","t":"e.g. Model Agricultural Land Leasing Act, 2016"},{"l":"Automate post-sale mutations, lower stamp duties, and link land registries with civil courts and AgriStackto prevent fraud","t":""}],"cue":"Move to state-guaranteed conclusive titles, finish spatial digitisation and drone mapping, and legalise land leasing."},{"k":"data","q":"Which schemes and data back up land titling?","title":"Data","rows":[{"l":"Holdings","t":"small and marginal holdings are [[86.1%]] of all holdings but operate only [[46.9%]] of the area (Agriculture Census 2015-16; the 2021-22 results are awaited)"},{"l":"DILRMP 3.0 (2026-31, [[₹565.5 crore]], fully centrally funded)","t":"a GIS land stack, Bhu-Aadhaar for every parcel, computerised revenue courts (RCCMS) and registration linked to mutation. The Standing Committee (2026) asked it to shift from digitising records to making them accurate and legally valid"},{"l":"SVAMITVA","t":"(Ministry of Panchayati Raj, 24 April 2020; drone surveys by Survey of India): property cards have backed loans of [[₹1,713 crore]] in 11,147 cases (PIB, Aug 2026)"},{"l":"Land records schemes","t":"Strengthening Revenue Administration and Updating Land Records (centrally sponsored, 1987-88); NLRMP (2008), later merged into DILRMP"}]}]},{"id":"GS37-land-reforms","line":"GS3.7","part":"","name":"Land reforms","own":true,"cards":[{"k":"define","q":"What are land reforms?","text":"Changes in who owns and who tills land, meant to end feudal relations, give land to the tiller, and raise productivity."},{"k":"list","q":"What is the constitutional basis of land reforms?","rows":[{"l":"State subject","t":"Entry [[18]], List II"},{"l":"First Amendment (1951)","t":"added Articles 31A, 31B and the Ninth Schedule to shield land laws"},{"l":"Guiding principle","t":"Article [[39]](b) and (c)"}]},{"k":"list","q":"What were the main land reform measures?","rows":[{"l":"Zamindari abolition","t":"intermediaries removed, early 1950s"},{"l":"Tenancy reform","t":"fair rent, tenure security, ownership"},{"l":"Ceiling on holdings","t":"surplus redistributed"},{"l":"Consolidation","t":"of fragmented plots (Punjab, Haryana, western UP)"},{"l":"Bhoodan","t":"Vinoba Bhave, 1951"},{"l":"Land records","t":"updating and digitising"}]},{"k":"for","q":"What did land reforms achieve?","rows":[{"l":"Cuts rural poverty and inequality by redistributing land","t":"[[≈2 million]] hectares of ceiling-surplus land went to [[≈57 lakh]] beneficiaries, about half SC/ST (MoRD, 2015), helping reduce West Bengal’s rural poverty headcount by [[≈56%]] (1972–73 to 1999–2000, World Bank)."},{"l":"Raises farm productivity because secure tenure spurs investment","t":"Operation Barga raised rice yields by [[≈20%]] (Banerjee, Gertler, and Ghatak, 2002), explaining [[≈28%]] of West Bengal’s farm productivity growth (1979–93) and [[≈36%]] of its overall farm growth (1972–90)."},{"l":"Ends forced labour and rent extraction, giving registered tenants social dignity and political voice in panchayats","t":""},{"l":"Unlocks formal bank credit against recorded titles or tenancy rights, cutting dependence on moneylenders","t":""},{"l":"Creates viable family farms through plot consolidation","t":"(e.g., Punjab, Haryana, western UP) and boosts rural demand via wider income spread."}],"cue":"Giving secure land rights to the actual tiller ends feudal exploitation, unlocks investment and credit, and lifts rural equity and output."},{"k":"against","q":"Why did land reforms fall short in most states?","rows":[{"l":"Legal loopholes let zamindars keep land as khudkasht (personal cultivation), make benami or fictitious transfers, and exploit exemptions (plantations, religious trusts, orchards) and court delays, aided by landed elites in legislatures and varying state laws","t":""},{"l":"Restrictive tenancy laws drove leasing underground into oral leases","t":"[[≈17%]] of holdings had leased-in land (NSS 2019)—leaving tenants without legal protection or institutional credit."},{"l":"Outdated land records, decades without surveys, and tenant illiteracy or fear of eviction kept unorganised sharecroppers from registering","t":""},{"l":"Women and Dalits were often left out, while inheritance keeps fragmenting farms","t":"average holding fell from [[≈1.1]] ha (2015–16) to [[≈0.7]] ha (2021–22) (NABARD NAFIS)."},{"l":"High compensation to intermediaries and heavy survey costs strained state budgets","t":""}],"cue":"Legal loopholes, weak land records, elite resistance, and ongoing inheritance division stalled redistribution and pushed tenancy underground."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Pair strong political will and clear legal protection (heritable, perpetual rights as in Kerala, West Bengal, and Jammu & Kashmir) with peasant mobilisation","t":"(e.g., Kisan Sabha, Tebhaga legacy) and panchayat-led beneficiary identification."},{"l":"Take registration to villages through proactive administrative drives (like Operation Barga camps) and complete modern record digitisation","t":"e.g. DILRMP, Bhu-Aadhaar/ULPIN, SVAMITVA, and Kerala’s Ente Bhoomi portal"},{"l":"Legalise and formalise land leasing so owners can lease out safely and tenants get institutional credit and insurance","t":"e.g. NITI Aayog’s Model Agricultural Land Leasing Act, 2016"},{"l":"Supply complementary inputs","t":"credit, seeds, and irrigation—alongside land rights so new owners and smallholders can invest productively."},{"l":"Curb further farm fragmentation and empower women and Dalits through joint family titling, cooperative/FPO pooling, and voluntary land consolidation","t":""}],"cue":"Combine strong political will, village-level tenant mobilisation, transparent leasing laws, and modern digital records with farm inputs."},{"k":"data","rows":[{"l":"West Bengal titles","t":"West Bengal distributed [[6.7%]] of its agricultural land as titles to the poor by the early 1990s, against a national average of [[1.4%]] (Appu, 1996)"},{"l":"Land inequality","t":"the top [[10%]] own [[≈45%]] of farmland (notebook; World Inequality Lab, 2026)"},{"l":"Tenancy reform","t":"[[≈11 million]] tenants got ownership rights (notebook)"},{"l":"West Bengal","t":"marginal ownership up [[≈84%]]; land Gini 0.67 (1970) → 0.60 (1990) (notebook)"},{"l":"Kerala","t":"[[≈1.5 million]] households became owners; rural poverty [[≈69%]] (1970) → [[≈29%]] (1994) (notebook, not traced); land security let families diversify into allied activities (notebook)"},{"l":"Andhra Pradesh","t":"land-reform beneficiaries are [[≈24%]] more likely to attend village meetings (M.K. Narayana study, notebook)"}],"q":"What data and examples show the effect of land reforms?"},{"k":"data","rows":[{"l":"‘Land to the tiller’","t":"the core slogan of tenancy reform (Agriculture notes)"},{"l":"Conclusion anchors","t":"Article 39(b) and (c) (distribution of material resources to serve the common good); SDG 1.4 (equal rights to land and secure tenure)"},{"l":"Conclusion","t":"land reform must be well designed, because its productivity gains depend on implementation (notebook)"},{"l":"UP Zamindari Abolition and Land Reforms Act, 1950","t":"the first major law abolishing intermediaries"},{"l":"West Bengal, Operation Barga (1978)","t":"[[≈1.5 million]] sharecroppers recorded, more than [[65%]] of an estimated [[2.3 million]] by 1993; rice yields rose by [[≈20%]] (Banerjee, Gertler and Ghatak, 2002); rural poverty fell from [[≈64%]] (1983) to [[≈41%]] (1993-94) and [[≈29%]] (2004-05) (NSSO, cited by D. Bandyopadhyay, who ran the programme)"},{"l":"Taiwan’s ‘land to the tiller’ (1950s)","t":"tenancy fell from [[≈41%]] to [[≈16%]], giving an equitable distribution of land"},{"l":"From the diagram","t":"Land records - DILRMP, SVAMITVA"}],"q":"What data and examples show the effect of land reforms?"},{"k":"diagram","q":"Draw the diagram for Land reforms","g":{"dir":"TD","nodes":[["L","Land reforms"],["Z","Abolition of intermediaries - zamindari"],["T","Tenancy reform - Operation Barga"],["C","Ceiling and redistribution"],["K","Consolidation of holdings"],["R","Land records - DILRMP, SVAMITVA"]],"edges":[["L","Z",""],["L","T",""],["L","C",""],["L","K",""],["L","R",""]]}},{"k":"data","q":"What made land reforms work where they succeeded?","title":"Data","rows":[{"l":"Local institutions","t":"panchayats involved in identifying beneficiaries (West Bengal)"},{"l":"Top-down plus bottom-up","t":"officials identified beneficiaries while peasant groups mobilised them"}]}]},{"id":"GS37-land-ceiling","line":"GS3.7","part":"","name":"Land Ceiling","own":true,"cards":[{"k":"define","q":"What is a land ceiling?","text":"A legal maximum on the land a family may hold; land above it is taken as surplus and given to the landless."},{"k":"for","q":"Why impose land ceilings?","rows":[{"l":"Keeps farm output high because marginal farms remain more productive per hectare (NABARD, NAFIS 2021–22), with small holdings giving over 3x the output per hectare of large ones (Farm Management Studies)","t":""},{"l":"Puts idle land of large owners into the hands of labour-rich landless households, lifting overall land and labour use","t":""},{"l":"Ends absentee landlordism and rewards actual cultivation over rent-seeking","t":"e.g. prioritising SC/ST landless tillers"},{"l":"Spreads rural income across more households, widening local consumption demand","t":""},{"l":"Prevents extreme land concentration and semi-feudal estates from re-emerging","t":"e.g. curbing speculative land hoarding"}],"cue":"Capping large holdings shifts idle land to landless tillers, raising per-hectare productivity, rural equity, and local demand."},{"k":"against","q":"What are the problems with land ceilings?","rows":[{"l":"Very little land was caught","t":"surplus declared was only [[≈1%]] of cultivable land (MoRD, 1986), far below the Committee on State Agrarian Relations’ (2009) estimate."},{"l":"Widespread evasion through benami transfers, family partitions, broad exemptions","t":"(e.g., plantations, religious trusts, orchards), and long court cases."},{"l":"Tiny farms cannot support a family","t":"NABARD puts the viable income threshold at [[≈1.6]] ha, making consolidation and leasing matter more now."},{"l":"Deters large-scale private investment in farming and raises the cost of assembling land for industry and infrastructure","t":""},{"l":"Redistributed surplus land was often barren or degraded, and poor allottees lacked credit and inputs to farm it","t":"e.g. uncultivated allotted plots"}],"cue":"Massive evasion, tiny unviable plot sizes, and barriers to commercial land assembly limit the relevance of rigid ceilings today."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Legalise land leasing so farmers can operationally scale holdings above [[≈1.6]] ha without losing ownership or breaching ceilings","t":"e.g. Model Agricultural Land Leasing Act, 2016"},{"l":"Aggregate smallholders via FPOs and cooperatives to gain economies of scale without concentrating land ownership","t":"e.g. [[10,000]] FPOs scheme"},{"l":"Plug evasion and clear court backlogs by digitising records and tagging plots with Bhu-Aadhaar (ULPIN)(under DILRMP)","t":""},{"l":"Pair any redistributed surplus or government wasteland with credit, irrigation, and soil reclamation so allottees can farm profitably","t":""},{"l":"Use transparent state land banks and calibrated leasing rules to assemble land for industry and agro-processing without displacing smallholders","t":""}],"cue":"Shift focus from rigid ownership caps to legal land leasing, FPO pooling, digital records, and transparent industrial land banks."},{"k":"data","q":"What are the ceiling norms and numbers?","title":"Data","rows":[{"l":"Ceiling surplus","t":"[[68.5 lakh]] acres declared surplus (MoRD, Lok Sabha, Feb 2015). Bhoodan: [[39.2 lakh]] acres donated, [[21.75 lakh]] acres distributed (MoRD)"},{"l":"Average holding in the USA","t":"[[≈187 ha]] (Agriculture notes)"},{"l":"Jammu and Kashmir Big Landed Estates Abolition Act, 1950","t":"land above the ceiling went to tillers without compensation (the Act)"}]},{"k":"data","q":"What were the 1972 land ceiling guidelines?","rows":[{"l":"Before 1972","t":"ceilings applied to individuals, letting owners split land among relatives"},{"l":"1972 guidelines","t":"family of five as the unit: [[10–18]] acres for land irrigated for two crops, [[27]] acres for one crop, up to [[54]] acres for dry land"}]}]},{"id":"GS37-land-leasing-and-tenancy-reform","line":"GS3.7","part":"","name":"Land Leasing and Tenancy Reform","own":true,"cards":[{"k":"define","q":"What is legalised land leasing?","text":"Legalised leasing lets owners rent out farmland while retaining ownership title, ending unrecorded oral deals (concealed tenancy)."},{"k":"for","q":"What are the benefits of legalising land leasing?","rows":[{"l":"Consolidates fragmented operational holdings and brings fallow land of absentee or migrant owners under active cultivation","t":"e.g. [[86%]] small and marginal holdings, Agriculture Census"},{"l":"Enables recorded tenants to access institutional crop loans, crop insurance, and disaster relief without landowner consent","t":"e.g. Kisan Credit Card and PMFBY"},{"l":"Lets landowners take non-farm jobs without fearing loss of land, accelerating rural economic diversification","t":"e.g. Economic Survey on structural transformation"},{"l":"Creates larger contiguous operated areas for buyers and Farmer Producer Organisations (FPOs) to execute contract farming (GS3 2015 Q3)","t":""},{"l":"Empowers landless women’s collectives to lease land and farm jointly for scale, as seen under Kudumbashree (Kerala) and the AP Mahila Samatha Society","t":""}],"cue":"Formalising land leasing unlocks dormant farmland, consolidates fragmented plots for scale, and brings invisible tenants into the institutional credit and welfare net."},{"k":"against","q":"What holds back leasing reform?","rows":[{"l":"Restrictive state laws push tenancy into unrecorded oral deals, as Kerala, Jammu and Kashmir, and Manipur ban leasing while others allow it only for widows, minors, the disabled, or soldiers (NITI Aayog)","t":""},{"l":"Deep-seated owner fear of losing title under old \"land to the tiller\" laws deters formal registration even where permitted","t":"e.g. post-independence tenancy abolition acts"},{"l":"Unrecorded tenants remain excluded from direct cash transfers, subsidies, and credit tied strictly to land ownership records, such as PM-KISAN","t":""},{"l":"Weak bargaining power exposes landless tenants to high rent burdens, arbitrary eviction, and short-term farming that degrades soil health","t":"e.g. NSSO Situational Assessment Survey"},{"l":"Sluggish state-level adoption stalls reform, with only Uttar Pradesh and Uttarakhand amending their laws and Madhya Pradesh passing a new one (2016)","t":""}],"cue":"Restrictive tenancy laws and owner fears of losing title push leasing underground, leaving landless cultivators vulnerable and excluded from state support."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Adopt state tenancy laws aligned with the Model Agricultural Land Leasing Act, 2016 guaranteeing automatic land resumption to owners upon lease expiry","t":"e.g. Ashok Dalwai Committee recommendations"},{"l":"Digitise land records and maintain a separate, non-title-conferring registry of lease deeds and actual cultivators","t":"e.g. Digital India Land Records Modernization Programme"},{"l":"Delink crop loans, insurance, and cash transfers from ownership titles by recognising registered lease agreements","t":"e.g. Andhra Pradesh Loan Eligibility Cards and Joint Liability Groups"},{"l":"Scale up group leasing through women’s self-help groups and FPOs to strengthen tenant bargaining power, replicating Kudumbashree (Kerala)","t":""},{"l":"Create fast-track, village-level dispute resolution mechanisms outside civil courts to build mutual trust","t":"e.g. Gram Nyayalayas and local revenue tribunals"}],"cue":"Effective reform requires delinking ownership from cultivation rights through uniform state laws, digitised cultivator registries, and lease-backed credit."},{"k":"data","q":"What do the model law and data say?","title":"Data","rows":[{"l":"Tenancy","t":"[[≈13%]] of area was leased in (NSS 77th round, 2019), up from [[≈10%]] of area in 2012-13 (NSS 70th round)"},{"l":"Model Agricultural Land Leasing Act, 2016 (NITI Aayog model law)","t":"legalises and regulates leasing of farmland so that tenants can access credit, insurance and disaster relief while the landowner’s title stays fully protected; disputes go to a special land tribunal (PRS summary of the model Act). Adopted only in part: Uttar Pradesh and Uttarakhand amended their laws; Madhya Pradesh passed a new leasing law in 2016 (Lok Sabha reply) (NITI Aayog; T. Haque Committee)"}]}]},{"id":"GS37-larr-act-2013","line":"GS3.7","part":"","name":"LARR Act, 2013","own":true,"cards":[{"k":"define","q":"What is the LARR Act, 2013?","text":"Governs land acquisition by the state, with fair compensation, social impact assessment, consent for private and PPP projects, and rehabilitation and resettlement; replaced the Land Acquisition Act, 1894.","ed":true},{"k":"for","q":"What does the LARR Act, 2013 get right?","rows":[{"l":"Ensures fair compensation of up to four times market value in rural areas and twice in urban areas,against [[1.3]] times under the [[1894]] Act (PRS), fulfilling the 17th Amendment (1964) proviso to Article 31A","t":""},{"l":"Mandates prior consent from [[80%]] of landowners for private projects and [[70%]] for PPP projects alongside a Social Impact Assessment (SIA) with public hearings, reducing protests and project stoppages","t":""},{"l":"Extends Rehabilitation and Resettlement (R&R) benefits to all livelihood losers, including landless labourers and tenants, beyond just title-holding landowners","t":""},{"l":"Protects vulnerable communities through special SC/ST safeguards under the Second Schedule,including land-for-land, a one-time [[₹50,000]] grant, and free community land","t":""},{"l":"Safeguards food security by restricting acquisition of irrigated multi-cropped land and mandating the return of land left unused for five years","t":""}],"cue":"Replacing colonial eminent domain with participatory consent, fair market pricing, and livelihood rehabilitation prevents forced displacement and reduces project-stalling protests."},{"k":"against","q":"What are the criticisms of the LARR Act, 2013?","rows":[{"l":"Stretches acquisition timelines from roughly [[6]] months to [[4.5]] years due to mandatory SIA and consent rules, delaying critical infrastructure and industrial corridors","t":""},{"l":"Escalates capital expenditure and makes industrial or infrastructure ventures unviable due to fourfold rural compensation multipliers","t":"e.g. stalled highway and industrial park land purchases"},{"l":"Fragments uniform national protection after the December 2014 central ordinance lapsed on [[31]] August 2015 prompting states like Tamil Nadu, Gujarat, Telangana, Jharkhand, Maharashtra (under Article [[254]]([[2]])), and Assam (2023) to dilute consent and SIA rules","t":""},{"l":"Leaves farmers undercompensated despite high multipliers due to flawed valuation practices, as a CAG review of six acquisitions found adjoining village sale prices were ignored","t":""},{"l":"Fails to halt farmland loss as conversion continues via state routes and land pooling, while SIA steers projects away from dense farm zones and fragments remaining holdings","t":""}],"cue":"High acquisition costs, multi-year procedural delays, and state-level dilutions under Article 254(2) undermine both infrastructure speed and uniform farmer protection."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Adopt voluntary land pooling and land-readjustment models that make farmers equity partners in urban and industrial development rather than displaced sellers","t":"e.g. Amaravati capital region and Gujarat Town Planning Schemes"},{"l":"Create state-level land banks using unutilised government, barren, and PSU land to minimise acquisition of fertile agricultural holdings","t":"e.g. India Industrial Land Bank portal"},{"l":"Time-bind Social Impact Assessments and digitise land records with transparent circle-rate benchmarks to prevent both multi-year delays and undervaluation","t":"e.g. NITI Aayog land reform recommendations"},{"l":"Offer structured annuity payments, inflation-indexed bonds, or long-term lease rentals instead of one-time lump-sum cash payouts to ensure sustained rural livelihoods","t":"e.g. Haryana and Uttar Pradesh annuity policies"},{"l":"Operationalise dedicated, time-bound LARR Authorities to resolve valuation and R&R disputes rapidly outside regular civil courts","t":"e.g. Section [[51]] of the LARR Act, 2013"}],"cue":"Balancing rapid infrastructure development with landowner equity requires alternative acquisition models like land pooling, fast-tracked assessments, and transparent valuation."},{"k":"diagram","q":"Draw the diagram for LARR Act, 2013","g":{"dir":"LR","nodes":[["S","Social Impact Assessment"],["C","Consent - 70% PPP, 80% private"],["P","Compensation - up to 4x rural, 2x urban"],["R","Rehabilitation and resettlement"]],"edges":[["S","C",""],["C","P",""],["P","R",""]]}},{"k":"data","q":"What example shows the cost of delay?","title":"Data","rows":[{"l":"Sardar Sarovar","t":"delays cost [[≈$200]] mn a year (World Bank assessment, notebook, not traced)"}]},{"k":"data","q":"When did the LARR Act take effect, and under which list?","rows":[{"l":"Full name","t":"Right to Fair Compensation and Transparency in Land Acquisition, Rehabilitation and Resettlement Act, 2013"},{"l":"In force","t":"[[1]] January 2014"},{"l":"Constitutional basis","t":"Concurrent List (Entry [[42]], List III)"}]}]},{"id":"GS38-liberalisation","line":"GS3.8","part":"Effects of liberalisation","name":"Liberalisation","own":true,"cards":[{"k":"define","text":"Reducing state control over trade, investment and industry so that private and foreign firms can compete.","q":"What is meant by liberalisation?"}]},{"id":"GS38-friendshoring-and-nearshoring","line":"GS3.8","part":"Effects of liberalisation","name":"Friendshoring and nearshoring","own":true,"cards":[{"k":"define","text":"Friendshoring: moving supply chains to allied countries. Nearshoring: relocating processes or manufacturing to a nearby country to cut transport cost and delivery time.","q":"What is meant by friendshoring and nearshoring?"},{"k":"value","rows":[{"l":"Friendshoring","t":"Rising friendshoring, nearshoring and trade concentration (ES 2025-26)"}],"q":"What schemes, data and examples back up Friendshoring and nearshoring?"}]},{"id":"GS38-economic-statecraft","line":"GS3.8","part":"Effects of liberalisation","name":"Economic statecraft","own":true,"cards":[{"k":"define","text":"Using economic tools (trade, finance, supply chains) to achieve political and strategic goals.","q":"What is meant by economic statecraft?"},{"k":"value","rows":[{"l":"Economic statecraft (Survey prologue)","t":"economic policy must focus on stability of supply, creation of resource buffers, and diversification of routes and payment systems. ‘Policy credibility, predictability and administrative discipline cease to be mere virtues and become strategic assets.’ (ES 2025-26)"},{"l":"Historical examples","t":"Economic statecraft: Kautilya’s Arthashastra; the Roman Empire’s grain-provisioning system (Cura Annonae), which worked like a strategic grain reserve"}],"q":"What schemes, data and examples back up Economic statecraft?"}]},{"id":"GS38-trade-diversion","line":"GS3.8","part":"Effects of liberalisation","name":"Trade diversion","own":true,"cards":[{"k":"define","text":"Shift of imports from a lower-cost non-member to a higher-cost FTA partner purely because of preferential tariffs; the opposite of trade creation.","q":"What is meant by trade diversion?"}]},{"id":"GS38-mfn-status","line":"GS3.8","part":"Effects of liberalisation","name":"MFN status","own":true,"cards":[{"k":"define","text":"Most Favoured Nation: the WTO rule that a tariff concession given to one member must be extended to all members.","q":"What is meant by MFN status?"}]},{"id":"GS38-ftas","line":"GS3.8","part":"Effects of liberalisation","name":"FTAs","own":false,"cards":[{"k":"define","text":"Agreements in which partners cut tariffs on most trade between them.","q":"What are FTAs?"},{"k":"data","q":"Where does India stand on FTAs?","rows":[{"l":"RCEP exit","t":"India left RCEP in Nov 2019 (China-dumping and dairy and agriculture concerns)"},{"l":"Bilateral FTAs since","t":"UAE, Australia, EFTA (TEPA), UK, and the EU (concluded 2026)"}]},{"k":"for","rows":[{"l":"Market access for exports","t":"India’s share of global exports rose only from [[1%]] to [[1.8%]] in merchandise and from [[2%]] to [[4.3%]] in commercial services (2005 to 2024)"},{"l":"Cost of staying out","t":"the Surjit Bhalla committee estimated that joining RCEP could add up to [[≈$60 bn]] by 2030 (notebook)"},{"l":"Building blocks for multilateralism","t":"deeper regional and bilateral liberalisation can pave the way for WTO-level deals when multilateral talks stall"},{"l":"GVC integration","t":"lower tariffs on inputs and assured markets help firms plug into GVCs"},{"l":"Supply-chain diversification","t":"partners beyond one dominant supplier reduce trade concentration (friendshoring)"},{"l":"Investment and technology inflows","t":"assured market access draws FDI"}],"q":"Why should India sign FTAs?","cue":"Markets → cost of staying out → building blocks → GVCs → diversification → FDI."},{"k":"against","rows":[{"l":"Weak GVC integration","t":"gains need supply-side fixes: cost of capital, logistics, quality norms","h":"Infrastructure"},{"l":"Trade diversion","t":"imports shift to a less efficient partner because of preferential tariffs","h":"Markets"},{"l":"Sensitive sectors","t":"dairy and agriculture, and dumping routed through partners (India’s RCEP walk-out)","h":"Markets"},{"l":"Erosion of MFN status","t":"preferences for partners dilute equal treatment of all WTO members","h":"Rules and institutions"},{"l":"Uneven benefits","t":"large firms and services gain faster than small producers","h":"Equity and sustainability"}],"q":"What are the risks of FTAs?","cue":"Supply side unfixed → diverted trade → sensitive sectors → MFN eroded → big firms gain."},{"k":"value","rows":[{"l":"Services and FTAs","t":"Services are boosted by FTAs (e.g. with the UK) (ES 2025-26)"},{"l":"Foreign Trade Policy 2023","t":"target of [[$2 trillion]] in exports by 2030"}],"q":"What data and targets back up India’s trade strategy?"}]},{"id":"GS38-some-terms-definition","line":"GS3.8","part":"Effects of liberalisation","name":"Key terms: globalisation and liberalisation","own":true,"cards":[{"k":"list","rows":[{"l":"Globalisation","t":"The increasing integration of countries through the free flow of goods, services, capital, technology and people across national borders."},{"l":"Liberalisation","t":"Removal of government restrictions to promote private enterprise and market competition."},{"l":"Privatisation","t":"Transfer of ownership or management of public-sector enterprises to private entities."},{"l":"Economic Integration","t":"The process through which countries reduce trade and investment barriers to create interconnected markets."},{"l":"Deglobalisation","t":"A reversal of global economic integration through reduced cross-border trade, investment and supply-chain dependence."},{"l":"Protectionism","t":"Government policies that restrict imports through tariffs, quotas and other barriers to protect domestic industries."},{"l":"Technological Displacement","t":"Loss of jobs due to automation, imported technologies and global competition replacing human labour."},{"l":"Excess Labour Supply","t":"More workers than available employment opportunities."}],"q":"Define the key terms of globalisation and liberalisation."}]},{"id":"GS38-lpg-reforms-of-1991","line":"GS3.8","part":"Effects of liberalisation","name":"LPG reforms of 1991","own":true,"cards":[{"k":"define","q":"What were the LPG reforms of 1991?","text":"Liberalisation, privatisation and globalisation: reforms launched after the 1991 balance-of-payments crisis to open India’s economy to markets and the world.","ed":true},{"k":"list","q":"What did the 1991 reforms do?","rows":[{"l":"Trigger","t":"BoP crisis: forex left for [[≈3]] weeks of imports"},{"l":"Measures","t":"delicensing, MRTP repeal, automatic FDI, rupee devaluation, tariff cuts, PSU narrowing and Narasimham financial reforms"},{"l":"Outcome","t":"lifted India past the [[≈3.5%]] pre-1991 ‘Hindu rate of growth’"}]},{"k":"for","q":"What were the positive effects of the 1991 reforms?","rows":[{"l":"Accelerated GDP growth and lifted millions out of poverty while expanding consumer choice through market competition","t":"e.g. average GDP growth doubling from [[≈3.5%]] pre-1991 to [[6–7%]]+ post-1991"},{"l":"Eliminated chronic balance-of-payments vulnerability by building substantial foreign exchange buffers through liberalised trade and capital flows","t":"e.g. forex reserves rising from [[≈3]] weeks of imports in 1991 to over [[$700 billion]]"},{"l":"Deepened global trade integration, raising India's share of world merchandise exports from [[1%]] to [[1.8%]] (2005 to 2024) and driving global competitiveness in IT services (7th-largest services exporter; [[4.3%]] world share), generic pharma ([[≈20%]] of global generics), and autos","t":""},{"l":"Enabled Indian firms to scale domestically and expand globally, raising Indian-owned firms' share of GDP from [[≈15%]] in 1991 to [[≈25%]] and outward FDI to [[$23.6 bn]] in FY25 (ES 2025-26) and [[$33.3 bn]] in FY26 (RBI)","t":"e.g. Tata–Corus in 2007 and Tata–JLR in 2008"},{"l":"Modernised banking, capital markets, and infrastructure by ending public monopolies and opening private investment","t":"e.g. Narasimham Committee banking reforms and SEBI statutory empowerment"}],"cue":"Dismantling the Licence-Permit Raj unleashed private enterprise, accelerated GDP growth, integrated India into global value chains, and built durable external-sector resilience."},{"k":"against","q":"What were the negative effects of the 1991 reforms?","rows":[{"l":"Bypassed agriculture and rural livelihoods completely, widening sectoral and regional disparities as services and a few states captured most gains","t":"e.g. persistent agrarian distress and coastal-versus-hinterland divergence"},{"l":"Produced job-weak and informalised growth with limited formal employment creation, leaving contract workers at [[42%]] of organised manufacturing workers (ASI 2023-24)","t":""},{"l":"Induced premature deindustrialisation by skipping labour-intensive manufacturing and deepening strategic import dependence on China for APIs and electronics","t":"e.g. manufacturing stagnating around [[15–17%]] of GDP"},{"l":"Widened income and wealth inequality alongside oligopolistic market concentration in key sectors","t":"e.g. World Inequality Lab findings on top-1% income share"},{"l":"Eroded domestic brand ownership as foreign MNCs acquired leading Indian companies and came to dominate consumer electronics and e-commerce","t":"e.g. Thums Up sold to Coca-Cola in 1993 and Flipkart to Walmart in 2018"}],"cue":"Market-led reforms bypassed agriculture and labour-intensive manufacturing, producing uneven regional growth, informalised jobs, rising inequality, and strategic import dependence."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Extend structural reforms to agriculture and rural value chains through market liberalisation, cold-chain infrastructure, and agro-processing","t":"e.g. e-NAM and Agriculture Infrastructure Fund"},{"l":"Boost labour-intensive manufacturing and domestic supply-chain resilience to cut critical import dependence on APIs and electronics","t":"e.g. Production Linked Incentive schemes and India Semiconductor Mission"},{"l":"Simplify labour codes, upgrade vocational skilling, and incentivise formal hiring to reverse contractualisation and absorb surplus farm labour","t":"e.g. four Labour Codes and PMKVY [[4.0]]"},{"l":"Enforce robust antitrust regulation and support domestic R&D so Indian startups and MSMEs scale globally without predatory MNC takeovers","t":"e.g. Competition Commission of India and Anusandhan National Research Foundation"},{"l":"Deepen factor-market reforms in land, power, and logistics alongside targeted social-sector spending to bridge regional and income divides","t":"e.g. PM Gati Shakti and National Logistics Policy"}],"cue":"Second-generation reforms must pair factor-market deregulation and targeted industrial policy with rural transformation and strong competition oversight to make growth broad-based and resilient."},{"k":"diagram","q":"Draw the diagram for LPG reforms of 1991","g":{"dir":"TD","nodes":[["C","1991 BoP crisis"],["L","Liberalisation - delicensing"],["P","Privatisation - disinvestment"],["G","Globalisation - tariffs cut, FDI opened"],["O","Competition, MNC entry, Indian firms go global"]],"edges":[["C","L",""],["C","P",""],["C","G",""],["L","O",""],["P","O",""],["G","O",""]]}},{"k":"data","q":"How have Indian firms competed with MNCs?","title":"Data","rows":[{"l":"Indian firms competing with MNCs (2013 Q7)","t":"TCS, Infosys and Wipro among the world’s largest IT firms; Bharat Biotech; generic pharma (see Effects on industrial growth → Numbers). MNCs still lead FMCG: HUL, Nestlé (notebook)"}]}]},{"id":"GS38-globalisation-and-informalisation","line":"GS3.8","part":"Effects of liberalisation","name":"Globalisation and Informalisation","own":true,"cards":[{"k":"define","q":"What is informalisation?","text":"Informalisation is the rising share of work without a written contract, social security, or job security, including contract workers inside formal firms."},{"k":"for","q":"How did globalisation reduce formal jobs?","rows":[{"l":"Intense import and export price competition pushes firms to replace permanent staff with flexible labour,raising contract workers from [[≈20%]] (1999–2000) to [[42%]] (2023–24) of org
