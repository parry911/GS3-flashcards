 introduce or modify desirable traits such as pest resistance, herbicide tolerance, drought resilience and improved nutritional content.","q":"What is meant by GM crops?"},{"k":"list","rows":[{"l":"Transgenic crops","t":"Foreign genes are added, as in Bt cotton."},{"l":"Gene-edited crops","t":"Existing DNA is precisely changed, as in Kamala rice."},{"l":"Commercial approval","t":"Bt cotton (2002) is the only approved GM crop."},{"l":"GM maize","t":"GEAC allowed confined trials of HT maize (NK603) at PAU, Ludhiana."},{"l":"GM mustard","t":"A three-judge bench heard the DMH-11 case in September 2026."},{"l":"Genome editing","t":"India released its first two genome-edited rice varieties in May 2025."}],"q":"What is the status of GM and gene-edited crops in India?"},{"k":"for","rows":[{"l":"Higher yield, lower cost","t":"Bt cotton halved insecticide sprays, from 8 to [[4]]."},{"l":"Fewer imports","t":"GM oilseeds could cut edible oil imports, now about [[56%]] of need."},{"l":"Climate resilience","t":"Crops can be bred to resist drought, salt and pests."},{"l":"Nutrition","t":"Biofortification can tackle micronutrient deficiency."},{"l":"Farmer income","t":"Fewer losses and higher yields raise profits."}],"q":"What are the arguments for GM crops?","cue":"Yield → fewer imports → resilience → nutrition → income."},{"k":"against","rows":[{"l":"Seed sovereignty","t":"Patented seeds raise costs and cut farmers' control."},{"l":"Pest resistance","t":"Pink bollworm now resists Bollgard-II cotton."},{"l":"Regulatory uncertainty","t":"DMH-11 litigation and no national policy stall R&D."},{"l":"Biosafety","t":"Gene flow can harm native varieties and non-GM exports."},{"l":"Social acceptance","t":"Farmers and consumers fear corporate control."}],"q":"What are the arguments against GM crops?","cue":"Seed sovereignty → pest resistance → regulatory limbo → biosafety → public doubt."},{"k":"value","rows":[{"l":"National GM policy","t":"Frame one, as the Supreme Court directed in 2024."},{"l":"Public R&D","t":"ICAR should develop affordable local varieties."},{"l":"Resistance management","t":"Enforce refuge-in-a-bag and pest monitoring."},{"l":"Farmers' rights","t":"Protect seed rights under the PPV&FR Act, 2001."},{"l":"Labelling","t":"Use FSSAI labelling to protect choice and exports."},{"l":"Mains line","t":"Balance innovation with biosafety and seed sovereignty."}],"q":"How should India regulate and use GM crops?","cue":"National policy → public R&D → manage resistance → protect seeds → label."}]},{"id":"GS34-intercropping-and-relay-cropping","line":"GS3.4","part":"Cropping pattern","name":"Intercropping and relay cropping","own":true,"cards":[{"k":"define","text":"Intercropping: growing two or more crops at the same time on one field in a set row pattern. Relay cropping: sowing the next crop before the standing one is harvested.","q":"What is meant by intercropping and relay cropping?"},{"k":"for","rows":[{"l":"More from the same land","t":"Intercropping raises cropping intensity."},{"l":"Fewer weeds","t":"Mixed canopies cut weeds by [[70–91%]]."},{"l":"Broken weed cycles","t":"Legume mixes disrupt wheat weeds like Phalaris minor."},{"l":"Push-pull pest control","t":"Maize with Desmodium suppresses Striga weed."},{"l":"Steady income","t":"Two crops hedge against one failing."},{"l":"Machines for hire","t":"About [[27,500]] Custom Hiring Centres offer multi-crop tools."}],"q":"Why practise intercropping and relay cropping?","cue":"More from the land → fewer weeds → broken cycles → push-pull → steady income → machines."},{"k":"against","rows":[{"l":"Working capital","t":"Managing several crops needs more upfront money."},{"l":"Information gap","t":"Farmers lack know-how on crop combinations."},{"l":"No downstream support","t":"Few buyers and processors take secondary crops."},{"l":"Procurement bias","t":"Open-ended procurement favours cereal monoculture."},{"l":"Machinery mismatch","t":"Combines and seed drills suit single-crop rows."}],"q":"Why don’t more farmers intercrop?","cue":"Money → information → downstream → procurement → machines."},{"k":"value","rows":[{"l":"Rebalance prices","t":"Extend price support beyond staple cereals."},{"l":"Custom hiring centres","t":"Stock row planters and inter-row weeders."},{"l":"Composite credit","t":"Lend working capital for mixed holdings."},{"l":"Multi-crop insurance","t":"Insure the whole crop mix."},{"l":"Extension and bio-inputs","t":"Train extension workers and supply smother-crop seeds."},{"l":"FPO aggregation","t":"FPOs can clean, grade and sell secondary harvests."}],"q":"How can intercropping be scaled up?","cue":"Prices → machines → credit → insurance → extension → FPOs."}]},{"id":"GS34-crop-diversification-and-emerging-techno","line":"GS3.4","part":"Cropping pattern","name":"Crop diversification and emerging technology","own":true,"cards":[{"k":"define","text":"Shifting area from a few staples (paddy, wheat) to a wider mix of high-value crops, pulses, millets, horticulture and allied activity, to raise income and cut risk and water use.","q":"What is crop diversification?"},{"k":"list","rows":[{"l":"Precision tools","t":"GIS soil maps guide Punjab's shift from paddy to maize."},{"l":"Resilient varieties","t":"ICAR spreads high-yield millet, pulse and oilseed seeds."},{"l":"Digital advice","t":"AI combines weather, soil and price data to suggest crops."},{"l":"Market links","t":"e-NAM and e-Choupal connect farmers to buyers."},{"l":"Protected cultivation","t":"Polyhouses and hydroponics allow year-round high-value crops."},{"l":"Public systems","t":"FASAL forecasts output and KISAN supports crop insurance."}],"q":"Which technologies support crop diversification?","cue":"Map soil → better seed → smart advice → markets → protected farms → public systems."},{"k":"against","rows":[{"l":"High cost","t":"Technology is expensive for small farmers."},{"l":"Digital literacy","t":"Only about [[25%]] of farmers are comfortable with digital tools."},{"l":"Cold storage gaps","t":"Diversified crops are perishable and need cold storage."},{"l":"MSP pull","t":"MSP steers farmers back to paddy and wheat."},{"l":"Weak policy support","t":"Policy does little to back the switch."},{"l":"Cultural inertia","t":"Farmers distrust new methods like direct-seeded rice."}],"q":"What holds back crop diversification?","cue":"Cost → digital literacy → cold storage → MSP pull → weak policy → habit."},{"k":"value","rows":[{"l":"Natural Farming Mission","t":"About [[₹2,500 crore]] to bring 1 crore farmers into natural farming."},{"l":"Clusters","t":"It targets [[15,000]] clusters in gram panchayats."},{"l":"Area","t":"1 crore farmers on about [[7.5 lakh]] ha."},{"l":"Krishi Sakhis","t":"[[30,000]] Krishi Sakhis spread natural farming."},{"l":"PM-PRANAM","t":"States keep [[50%]] of the fertiliser subsidy they save."},{"l":"PKVY","t":"Organic farming support covers about [[19 lakh]] ha."},{"l":"UP Centre of Excellence","t":"Indo-Israeli technology helps dragon fruit, date and flower growers."},{"l":"Odisha pilot","t":"Weather stations and an app helped [[7,000]] farmers."}],"q":"Which schemes and examples support diversification?"}]},{"id":"GS34-climate-change-and-cropping-patterns","line":"GS3.4","part":"Cropping pattern","name":"Climate change and cropping patterns","own":true,"cards":[{"k":"define","text":"Changes in temperature, rainfall and extreme weather shift which crops are grown where, when they are sown and how much they yield.","q":"How does climate change affect cropping patterns?"},{"k":"list","rows":[{"l":"Zones shift","t":"Rice, millet and maize zones move across South Asia."},{"l":"Uphill crops","t":"Coffee and spices move to higher altitudes."},{"l":"More irrigation","t":"Rainfed kharif turns into irrigated kharif."},{"l":"Wetter regions","t":"Water-hungry cereals move to wetter areas."},{"l":"Flood-tolerant paddy","t":"Paddy shifts to submergence-tolerant varieties."},{"l":"Impact","t":"Each 1°C rise could cut wheat output by [[4–5 million]] tonnes."}],"q":"How is climate change shifting cropping patterns?","cue":"Zones shift → uphill → irrigated → wetter → flood-tolerant → wheat loss."},{"k":"value","rows":[{"l":"2°C warming","t":"Farm output could fall [[8–12%]]."}],"q":"How much could warming cut farm output?"}]},{"id":"GS34-integrated-farming","line":"GS3.4","part":"Cropping pattern","name":"Integrated farming","own":true,"cards":[{"k":"define","text":"Crops, livestock, fisheries and allied enterprises on one farm, where the waste of one component becomes the input of another.","q":"What is an Integrated Farming System?"},{"k":"data","q":"What gains does integrated farming show?","rows":[{"l":"Returns and jobs","t":"Coconut, banana, dairy and horticulture together give about [[2x]] returns."},{"l":"Horticulture income","t":"Average income rose from ₹0.73 lakh to [[₹1.3 lakh]] a year."}]},{"k":"for","rows":[{"l":"Higher productivity","t":"Karnataka's mixed farms doubled returns."},{"l":"Stable income","t":"Income is [[1.5–2x]] more stable."},{"l":"Less waste, lower cost","t":"Recycling waste cut cultivation cost by about [[24%]]."},{"l":"More work days","t":"The Karnataka model doubled days of work."},{"l":"Climate resilience","t":"Several enterprises spread the risk."}],"q":"What are the benefits of integrated farming?","cue":"Produce more → earn steadily → waste nothing → work more days → resist climate."},{"k":"against","rows":[{"l":"High initial cost","t":"Setup is costly, with few subsidies beyond NMSA."},{"l":"Skills and labour","t":"It needs knowledge of several fields and more labour."},{"l":"Land","t":"It is hard for farmers with under [[2 ha]]."},{"l":"Many markets","t":"Each product needs its own buyer."},{"l":"Complex management","t":"Running several enterprises is complex."}],"q":"What limits integrated farming?","cue":"Cost → skills → land → many markets → complexity."},{"k":"value","rows":[{"l":"Kalam's line","t":"Waste is only misplaced wealth."},{"l":"NMSA support","t":"It pays [[50%]] of input cost, up to ₹40,000/ha for crop plus livestock."}],"q":"What backs up integrated farming?"},{"k":"diagram","q":"Draw the integrated farming system diagram (Integrated farming)","g":{"dir":"TD","nodes":[["I","IFS"],["C","Crops - plantation, fruit, mushroom"],["A","Animal husbandry - dairy, poultry, piggery"],["F","Fishery"],["S","Soil health - nutrient recycling"],["W","Waste management - vermicompost, apiary"],["R","Diverse models - risk mitigation, climate resilience"]],"edges":[["I","C",""],["I","A",""],["A","F",""],["F","S",""],["I","W",""],["I","R",""]]}}]},{"id":"GS34-allelopathy","line":"GS3.4","part":"Cropping pattern","name":"Allelopathy","own":false,"cards":[{"k":"define","text":"The release of chemicals (allelochemicals) by plants, microbes or fungi that affect the germination, growth or survival of neighbouring organisms.","q":"What is meant by allelopathy?"},{"k":"list","rows":[{"l":"Rice","t":"Lines like PI 312777 suppress barnyard grass without herbicides."},{"l":"Wheat","t":"White clover intercropping reduces wild oats and ryegrass."},{"l":"Sugarcane","t":"Cowpea or soybean intercropping cuts weeds by [[70–90%]]."},{"l":"Maize","t":"Desmodium suppresses Striga and adds nitrogen."},{"l":"Fallow periods","t":"Rye, mustard or cowpea cover crops suppress weeds."}],"q":"Which crops use allelopathy to suppress weeds?"},{"k":"list","q":"How is allelopathy used in farming?","rows":[{"l":"Acts at the roots","t":"It stunts weed seedlings and root growth."},{"l":"Pest and weed control","t":"Marigold and Desmodium chemicals repel pests."},{"l":"Main use","t":"Fewer weeds, less weedicide and a base for bio-herbicides."},{"l":"Limit","t":"Only [[3–5%]] of plants show a strong effect."}]},{"k":"for","rows":[{"l":"Lower input cost","t":"It cuts weedicide use and fits integrated weed management."}],"q":"Why use allelopathy?"},{"k":"against","rows":[{"l":"Weak in most plants","t":"Only [[3–5%]] of plants show it strongly."},{"l":"Variable results","t":"Efficacy changes with soil pH, water and microbes."}],"q":"What limits allelopathy?","cue":"Weak in most plants → variable results."}]},{"id":"GS34-high-value-crops","line":"GS3.4","part":"Cropping pattern","name":"High-value crops","own":true,"cards":[{"k":"define","text":"Crops that generate relatively higher income per unit of land compared to traditional staples, such as fruits, vegetables, spices, flowers and medicinal plants.","q":"What is meant by high-value crops?"},{"k":"data","q":"Where does India stand in high-value crops?","rows":[{"l":"Rank","t":"India is the largest dry onion producer, second in vegetables and fruits. (ES 2025-26)"}]},{"k":"value","rows":[{"l":"Budget support","t":"Programmes for sandalwood, cashew and cocoa. (Budget 2026-27)"}],"q":"What does Budget 2026-27 do for high-value crops?"}]},{"id":"GS34-cropping-pattern","line":"GS3.4","part":"Cropping pattern","name":"Cropping pattern","own":true,"cards":[{"k":"define","text":"The proportion of agricultural land allocated to different crops in a particular region during a given period or agricultural season.","q":"What is meant by cropping pattern?"}]},{"id":"GS34-agroforestry","line":"GS3.4","part":"Cropping pattern","name":"Agroforestry","own":true,"cards":[{"k":"define","text":"Growing trees together with crops or livestock on farmland.","q":"What is meant by agroforestry?"},{"k":"data","q":"Why does agroforestry matter, and where is it practised?","rows":[{"l":"Carbon","t":"It stores about [[30%]] more carbon."},{"l":"Tree cover","t":"It helps meet the [[33%]] tree cover target of the 1988 Forest Policy."},{"l":"Wood imports","t":"India imported about [[$2.7 bn]] of wood products."},{"l":"Traditional systems","t":"Khejri in Rajasthan, Taungya in Kerala and the North-East."}]},{"k":"value","rows":[{"l":"National policy","t":"India adopted the world's first agroforestry policy in 2014."},{"l":"GROW initiative","t":"NITI's 2024 plan to green wastelands with agroforestry."}],"q":"Which policies back agroforestry?"}]},{"id":"GS34-irrigation","line":"GS3.4","part":"Irrigation","name":"Irrigation","own":true,"cards":[{"k":"define","text":"The artificial supply of water to agricultural land through canals, wells, pumps and sprinklers to support crop growth.","q":"What is irrigation?"},{"k":"for","rows":[{"l":"More irrigated area","t":"Irrigated area rose from 41.7% to [[55.8%]] of cropped area."},{"l":"Climate resilience","t":"Irrigation protects crops from erratic monsoons."},{"l":"Micro-irrigation","t":"Over [[115 lakh]] ha are under drip and sprinkler."},{"l":"Aquifer recharge","t":"Watershed restoration recharges groundwater."},{"l":"Community control","t":"Odisha has [[39,000]] Pani Panchayats."}],"q":"What has India achieved in irrigation?","cue":"More area → resilience → micro-irrigation → recharge → community control."},{"k":"against","rows":[{"l":"Wasteful use","t":"Farms consume [[688 billion]] cubic metres of water."},{"l":"Over-pumped groundwater","t":"[[60%]] of Punjab's districts face over-extraction."},{"l":"Regional gaps","t":"Only 28% of the North-East is irrigated, against [[95%]] in the north."},{"l":"Project delays","t":"Sardar Sarovar, planned in the 1940s, was finished only in 2017."},{"l":"Waterlogging","t":"Soil degradation affects [[147 million]] ha."},{"l":"Free power","t":"Subsidised electricity drives over-pumping."}],"q":"What are the challenges in India’s irrigation system?","cue":"Wasteful → over-pumped → unequal → delayed → waterlogged → free power."},{"k":"value","rows":[{"l":"PMKSY convergence","t":"Coordinate Har Khet Ko Pani, Per Drop More Crop and watershed work."},{"l":"WDC-PMKSY 2.0","t":"It targeted about [[50 lakh]] ha with ₹8,100 crore for 2021-26."},{"l":"Piped water","t":"Use pipelines and SCADA, as the Mihir Shah Committee advised."},{"l":"Aquifer governance","t":"Create a National Water Commission merging CWC and CGWB."},{"l":"Farmer management","t":"Let water user groups run canals, like Odisha's Pani Panchayats."},{"l":"Crop diversification","t":"Move over-exploited blocks from paddy to millets and pulses."}],"q":"How can India’s irrigation be reformed?","cue":"Converge PMKSY → watershed 2.0 → pipes → aquifer governance → farmer control → diversify."},{"k":"data","rows":[{"l":"Coverage","t":"Irrigation covers [[55.8%]] of gross cropped area (2022-23). (ES 2025-26)"},{"l":"Conclusion anchor","t":"Har Khet Ko Pani, Per Drop More Crop and [[20%]] better water-use efficiency."},{"l":"PMKSY ministries","t":"Jal Shakti, Agriculture and Land Resources run it together."},{"l":"Odisha","t":"Over 39,000 farmer-run Pani Panchayats."}],"q":"What data and schemes back up irrigation?"}]},{"id":"GS34-water-storage","line":"GS3.4","part":"Irrigation","name":"Water storage (traditional and farm-level)","own":true,"cards":[{"k":"list","rows":[{"l":"Farm ponds","t":"103 ponds in Bandhlapaur stored [[27 lakh]] m³ of water."},{"l":"UP Har Khet Talab","t":"About [[37,000]] farm ponds were built."},{"l":"Tanks and cascades","t":"Linked reservoirs catch monsoon runoff, like Mission Kakatiya."},{"l":"Johads","t":"Earthen check dams in the north-west."},{"l":"Ahar-pynes","t":"Traditional catchment-and-channel systems of south Bihar."}],"q":"Which water-storage systems can you cite, with examples?"},{"k":"list","q":"What makes water storage work, and what goes wrong?","rows":[{"l":"What works","t":"Catching runoff, recharging aquifers and community ownership."},{"l":"What goes wrong","t":"Poor site choice, silting and plastic lining that blocks recharge."}]}]},{"id":"GS34-micro-irrigation","line":"GS3.4","part":"Irrigation","name":"Micro-irrigation","own":true,"cards":[{"k":"define","text":"A water-efficient irrigation method that delivers small, controlled quantities of water directly to the plant root zone minimising water wastage. eg. drip, sprinkler, sub-surface","q":"What is meant by micro-irrigation?"},{"k":"for","rows":[{"l":"Water efficiency","t":"Efficiency is [[75–95%]], against 35–40% for flooding."},{"l":"Energy and fertiliser","t":"It saves 10–30% power and [[28%]] fertiliser."},{"l":"Fertigation","t":"Fertiliser mixed in water goes straight to the roots."},{"l":"Higher yields","t":"Yields rise [[20–80%]]."},{"l":"Groundwater relief","t":"Groundwater supplies about [[60–65%]] of irrigation."}],"q":"Why expand micro-irrigation?","cue":"Save water → save power and fertiliser → feed the root → raise yields → spare groundwater."},{"k":"against","rows":[{"l":"Capital cost","t":"Setup costs about [[₹1 lakh]]/ha in Assam."},{"l":"Maintenance","t":"Upkeep costs [[10–20%]] of setup cost a year."},{"l":"Weak promotion","t":"Chikkaballapur farmers lacked technical support."},{"l":"Small holdings","t":"Fragmented plots raise cost per farmer."},{"l":"Poor integration","t":"It fits badly with existing farm systems."},{"l":"Free power","t":"Free electricity removes the reason to save water."}],"q":"Why is micro-irrigation adoption slow?","cue":"Cost → upkeep → weak promotion → small plots → poor fit → free power."},{"k":"value","rows":[{"l":"Coverage","t":"Over [[115 lakh]] ha, about 8% of net sown area."},{"l":"Micro Irrigation Fund","t":"[[₹5,000 crore]] with NABARD."}],"q":"How much land is under micro-irrigation, and how is it funded?"},{"k":"diagram","q":"Draw the diagram for Micro-irrigation","g":{"dir":"TD","nodes":[["I","Irrigation"],["S","Surface - canals, tanks"],["G","Groundwater - wells, tubewells"],["M","Micro - drip, sprinkler"],["E","Water-use efficiency 75 to 95%"]],"edges":[["I","S",""],["I","G",""],["I","M",""],["M","E",""]]}}]},{"id":"GS34-water-use-efficiency","line":"GS3.4","part":"Irrigation","name":"Water-use efficiency","own":true,"cards":[{"k":"define","text":"The amount of agricultural output (crop yield) produced per unit of water used, reflecting how effectively water resources are utilised. (more crop per drop)","q":"What is meant by water-use efficiency?"},{"k":"for","rows":[{"l":"Funding","t":"Per Drop More Crop and the Micro Irrigation Fund pay for drip."},{"l":"Canal modernisation","t":"It could raise irrigation efficiency by about [[20%]]."},{"l":"Crop choice","t":"Millets and pulses need far less water than paddy."},{"l":"Drip and sprinkler","t":"Drip reaches about [[85–90%]] efficiency, against 25–40% for flooding."},{"l":"Fertigation","t":"Nutrients dissolved in drip water reach roots directly."},{"l":"Water-saving methods","t":"AWD, direct-seeded rice and laser levelling cut water use."},{"l":"Water pricing","t":"Pricing and turn-based sharing, like Warabandi."}],"q":"How can India raise agricultural water-use efficiency?","cue":"Fund → modernise canals → choose crops → drip → fertigate → save water → price it."},{"k":"against","rows":[{"l":"Costly kit","t":"Drip and sprinkler hardware need high upfront spending."},{"l":"Weak extension","t":"Farmers stick to flood irrigation habits."},{"l":"Leaky canals","t":"Old canals run at only [[30–38%]] efficiency."},{"l":"MSP pull","t":"Assured procurement keeps paddy and wheat attractive."},{"l":"State subject","t":"Water pricing reform depends on each state."},{"l":"Groundwater stress","t":"[[60%]] of Punjab's blocks are over-exploited."}],"q":"What keeps water-use efficiency low?","cue":"Costly kit → weak extension → leaky canals → MSP pull → State subject → groundwater stress."},{"k":"value","rows":[{"l":"Piped irrigation","t":"Pipelines and SCADA can lift efficiency [[20%]], per the Mihir Shah Committee."},{"l":"Volumetric pricing","t":"Price water and solarise pumps, as the Dalwai Committee advised."},{"l":"Crop realignment","t":"Match crops to each agro-climatic zone."},{"l":"Smart irrigation","t":"Use AI and IoT under the Digital Agriculture Mission."},{"l":"Community aquifers","t":"Let communities budget groundwater, as in Atal Bhujal Yojana."}],"q":"Which reforms and committees improve water-use efficiency?","cue":"Pipe it → price it → realign crops → automate → let communities manage aquifers."},{"k":"data","rows":[{"l":"Atal Bhujal Yojana","t":"Communities manage groundwater together."}],"q":"What examples back up water-use efficiency?"}]},{"id":"GS34-watershed-development","line":"GS3.4","part":"Irrigation","name":"Watershed development","own":true,"cards":[{"k":"define","text":"Treating an entire watershed (the area draining to a common point) as one planning unit for integrated soil, water and land management, from ridge to valley.","q":"What is meant by watershed development?"},{"k":"list","q":"How has watershed development evolved?","rows":[{"l":"Early programmes","t":"DPAP, DDP and IWDP."},{"l":"IWMP","t":"Launched in 2009-10."},{"l":"WDC-PMKSY","t":"From 2015-16, with version 2.0 for 2021-26."},{"l":"Ridge to valley","t":"Treat slopes first, slow runoff, recharge, then farm the valley."}],"cue":"DPAP, DDP, IWDP → IWMP → WDC-PMKSY → 2.0."},{"k":"for","rows":[{"l":"Groundwater recharge","t":"Check dams and bunds refill aquifers."},{"l":"Rainfed farming","t":"[[76%]] of oilseed area is rainfed, so soil moisture matters."},{"l":"Cropping intensity","t":"More water allows more crops a year."},{"l":"Rural jobs","t":"Building ponds and bunds creates work."},{"l":"Ecological restoration","t":"Afforestation cuts erosion and desertification."},{"l":"Climate resilience","t":"Moist soils protect farmers in droughts."},{"l":"Diverse livelihoods","t":"Dairy and fisheries reduce distress migration."},{"l":"Latest results","t":"WDC-PMKSY 2.0 covers [[53 lakh]] ha and benefits 28.5 lakh farmers."}],"q":"What are the benefits of watershed development?","cue":"Recharge → rainfed farms → more crops → jobs → restore → resist drought → diversify → results."},{"k":"against","rows":[{"l":"Maintenance deficit","t":"Assets decay once projects end."},{"l":"Isolated structures","t":"Without ridge-to-valley planning, siltation rises."},{"l":"Silos","t":"Departments fail to coordinate."},{"l":"Landowners gain most","t":"The landless depend on commons and gain little."},{"l":"Upstream harm","t":"Upstream harvesting starves downstream villages."}],"q":"Why do watershed projects underperform?","cue":"Assets decay → isolated → silos → landowners gain → upstream harm."},{"k":"value","rows":[{"l":"Maintenance fund","t":"Reserve [[50%]] of the Watershed Development Fund for upkeep."},{"l":"Converge with MGNREGS","t":"Use rural job funds for conservation, as Parthasarathy advised."},{"l":"Include the landless","t":"Give [[15%]] of outlay to landless households."},{"l":"GIS planning","t":"Map and geo-tag assets by satellite."},{"l":"Water budgeting","t":"Regulate pumping and crops through village water budgets."},{"l":"Springsheds","t":"Protect spring catchments in Himalayan states."},{"l":"Landscape planning","t":"Plan the whole ridge-to-valley landscape."},{"l":"Mains line","t":"Move from building structures to community-managed restoration."}],"q":"How can watershed development work better?","cue":"Fund upkeep → MGNREGS → landless → GIS → water budgets → springs → landscape."},{"k":"data","rows":[{"l":"Srikakulam","t":"Watershed work raised maize yields about [[25%]] and rice 21%."}],"q":"What data and examples back up Watershed development?"},{"k":"diagram","q":"Draw the diagram for Watershed development","g":{"dir":"LR","nodes":[["R","Ridge - trenches, plantation"],["D","Drainage line - check dams"],["H","Valley - ponds, recharge"],["G","Groundwater up"],["Y","Yields and jobs"]],"edges":[["R","D",""],["D","H",""],["H","G",""],["G","Y",""]]}}]},{"id":"GS34-jal-shakti-abhiyan","line":"GS3.4","part":"Irrigation","name":"Jal Shakti Abhiyan","own":true,"cards":[{"k":"define","text":"A mission-mode water conservation campaign (Ministry of Jal Shakti, 2019; nationwide as ‘Catch the Rain’ in 2021) for rainwater harvesting and groundwater recharge through community participation.","q":"What is meant by Jal Shakti Abhiyan?"},{"k":"list","q":"How has the Jal Shakti Abhiyan evolved?","rows":[{"l":"2019","t":"It began in [[256]] water-stressed districts."},{"l":"2021","t":"Catch the Rain took it nationwide."},{"l":"2024","t":"Jal Sanchay Jan Bhagidari began."},{"l":"2026","t":"The two merged as JSJB Catch the Rain."}],"cue":"256 districts → nationwide → Jan Bhagidari → merged."},{"k":"for","rows":[{"l":"Fund convergence","t":"It pools MGNREGS, PMKSY and AMRUT money, with no separate budget."},{"l":"Groundwater recharge","t":"Rainwater harvesting and recharge shafts refill aquifers."},{"l":"Climate-resilient farming","t":"More groundwater protects crops in dry spells."},{"l":"Jan Bhagidari","t":"Communities, CSR and women's groups join through the 3Cs."},{"l":"District planning","t":"[[712]] Jal Shakti Kendras plan water locally."},{"l":"Traditional commons","t":"Stepwells and village tanks are desilted."},{"l":"Recharge structures","t":"Over [[1.6 crore]] structures were built."}],"q":"What has the Jal Shakti Abhiyan achieved?","cue":"Converge funds → recharge → protect farms → mobilise people → plan by district → revive commons → structures."},{"k":"against","rows":[{"l":"No dedicated fund","t":"It depends on other schemes' money."},{"l":"Silting assets","t":"Shafts, check dams and ponds silt up."},{"l":"Wrong sites","t":"Templates ignore local aquifers, so structures fail."},{"l":"Counting structures","t":"It counts structures, not groundwater levels."},{"l":"Free power","t":"Cheap pumping undoes recharge."}],"q":"What are the limits of the Jal Shakti Abhiyan?","cue":"No own fund → silting → wrong sites → counting structures → free power."},{"k":"value","rows":[{"l":"Measure outcomes","t":"Track groundwater with piezometers, like Atal Bhujal Yojana."},{"l":"Fund upkeep","t":"Use Finance Commission and MGNREGS money for desilting."},{"l":"Price water","t":"Price water and separate farm feeders, as Dalwai advised."},{"l":"Map aquifers","t":"Use NAQUIM 2.0 maps to pick recharge sites."},{"l":"Women-led governance","t":"Give Pani Samitis and SHGs maintenance rights."},{"l":"Basin planning","t":"Merge CWC and CGWB, as the Mihir Shah Committee proposed."},{"l":"Mains line","t":"Move from building structures to a community water movement."}],"q":"How should the Jal Shakti Abhiyan evolve?","cue":"Measure outcomes → fund upkeep → price water → map aquifers → women lead → plan by basin."}]},{"id":"GS34-pm-kusum","line":"GS3.4","part":"Irrigation","name":"PM-KUSUM","own":true,"cards":[{"k":"define","text":"PM Kisan Urja Suraksha evam Utthaan Mahabhiyan: solar pumps and solarised farm feeders, so irrigation gets cheaper, cleaner power and farmers can sell surplus power to the grid.","q":"What is meant by PM-KUSUM?"},{"k":"for","rows":[{"l":"Efficiency","t":"Solar pumps with drip save water and energy."},{"l":"No power bill","t":"Farmers pay no diesel or electricity bill."},{"l":"Extra income","t":"Surplus solar power is sold to the grid."},{"l":"Diversification","t":"Chandrapur farmers moved from paddy to vegetables."}],"q":"Why is PM-KUSUM useful?","cue":"Efficient → free to run → earns income → lets farmers diversify."},{"k":"against","rows":[{"l":"High cost","t":"Small farmers struggle with the upfront cost."},{"l":"No storage","t":"Cheap, efficient energy storage is missing."},{"l":"Over-pumping","t":"Near-free daytime power can drain groundwater."}],"q":"What are the problems with PM-KUSUM?","cue":"Costly to start → no storage → may drain groundwater."},{"k":"value","rows":[{"l":"What it does","t":"Solar pumps and solarised farm feeders."}],"q":"What schemes, data and examples back up PM-KUSUM?"},{"k":"data","q":"What data goes with PM-KUSUM?","title":"Data","rows":[{"l":"Progress","t":"About [[₹34,000 crore]] for 35 GW, but only about 13 GW installed by March 2026."}]}]},{"id":"GS34-saving-water-in-a-depleting-scenario","line":"GS3.4","part":"Irrigation","name":"Saving water in a depleting scenario","own":true,"cards":[{"k":"list","rows":[{"l":"Rainwater harvesting","t":"India harvests only about [[8%]] of its 1,180 mm of rain."},{"l":"Watershed management","t":"The Mid-Himalayan project treated about [[1 lakh]] ha."},{"l":"Drip plus mulch","t":"Mulch cuts evaporation from the soil."},{"l":"Hardy crops","t":"Millets and pulses tolerate drought."},{"l":"Sub-surface dykes","t":"Underground barriers hold groundwater near wells."},{"l":"Water schedules","t":"Punjab's Warabandi shares water turn by turn."},{"l":"Water audit","t":"Maharashtra has audited irrigation water since 2003."},{"l":"Water pricing","t":"Andhra Pradesh uses volumetric pricing."}],"q":"How can India save water in agriculture as groundwater depletes?","cue":"Catch rain → treat watersheds → drip and mulch → hardy crops → hold groundwater → share → audit → price."},{"k":"value","rows":[{"l":"Soil degradation","t":"It affects about [[147 Mha]]."},{"l":"Bundelkhand","t":"Rainwater projects raised groundwater by about [[10%]]."}],"q":"What data and examples back up water saving?"}]},{"id":"GS34-surface-manual-irrigation","line":"GS3.4","part":"Irrigation","name":"Surface (manual) irrigation","own":true,"cards":[{"k":"define","text":"Surface irrigation: letting water flow over the soil surface by gravity (e.g. flood, furrow and basin irrigation). Manual irrigation: applying water by hand with buckets, watering cans or hoses.","q":"What is meant by surface (manual) irrigation?"}]},{"id":"GS34-sprinkler-irrigation","line":"GS3.4","part":"Irrigation","name":"Sprinkler irrigation","own":true,"cards":[{"k":"define","text":"Spraying water over crops through pipes and sprinklers, simulating rainfall.","q":"What is meant by sprinkler irrigation?"}]},{"id":"GS34-sub-surface-irrigation","line":"GS3.4","part":"Irrigation","name":"Sub-surface irrigation","own":true,"cards":[{"k":"define","text":"Supplying water directly to the root zone through underground pipes or buried drip lines.","q":"What is meant by sub-surface irrigation?"}]},{"id":"GS34-automated-precision-irrigation","line":"GS3.4","part":"Irrigation","name":"Automated (precision) irrigation","own":true,"cards":[{"k":"define","text":"Using sensors, timers and automated systems to deliver precise quantities of water according to crop requirements and soil moisture.","q":"What is meant by automated (precision) irrigation?"}]},{"id":"GS34-jevons-paradox-rebound-effect","line":"GS3.4","part":"Irrigation","name":"Jevons paradox (rebound effect)","own":true,"cards":[{"k":"define","text":"A situation where improvements in resource-use efficiency reduce the cost of using a resource, encouraging greater consumption and thereby offsetting the expected resource savings.","q":"What is meant by Jevons paradox (rebound effect)?"}]},{"id":"GS34-apmc-and-the-2020-farm-laws","line":"GS3.4","part":"Agricultural marketing","name":"APMC","own":true,"cards":[{"k":"define","q":"How do APMC mandis work?","text":"APMC mandis are state-regulated market yards where notified agricultural produce is traded through licensed commission agents (arhtiyas). Statutory fees and commissions add [[≈15%]] to intermediation costs."},{"k":"for","q":"What do APMCs do well?","rows":[{"l":"No distress sales","t":"Open auctions give transparent prices."},{"l":"MSP procurement","t":"Punjab and Haryana mandis supply over [[70%]] of FCI grain."},{"l":"Payment and weighing","t":"Farmers get timely payment and fair weighment."},{"l":"State revenue","t":"Mandi fees fund rural roads, like Punjab's Rural Development Fund."},{"l":"One meeting place","t":"Buyers and sellers gather in one place, cutting search costs."}],"cue":"Fair auctions → MSP → payment → revenue → meeting place."},{"k":"against","q":"What is wrong with APMCs?","rows":[{"l":"Arhtiya cartels","t":"Agents rig auctions and trap indebted farmers."},{"l":"High levies","t":"Fees and commissions add about [[15%]] to costs."},{"l":"Poor infrastructure","t":"Under [[20%]] of mandis have grading or cold storage."},{"l":"Fragmented rules","t":"State rules block interstate trade."},{"l":"Information gap","t":"Smallholders lack real-time prices."}],"cue":"Cartels → levies → poor infrastructure → fragmented rules → information gap."},{"k":"value","q":"How should APMCs be reformed?","title":"Solutions","rows":[{"l":"e-NAM integration","t":"Link mandis with single licences, as about [[1,400]] already are."},{"l":"Cap fees","t":"Cap fees at [[1–2%]], as the Model APLM Act 2017 suggests."},{"l":"Rural feeder markets","t":"Upgrade 22,000 GrAMs within 5 km of farms."},{"l":"Infrastructure fund","t":"Use the ₹1 lakh crore AIF for grading and cold storage."},{"l":"Free perishables","t":"Let fruits and vegetables bypass mandis."}],"cue":"e-NAM → cap fees → GrAMs → AIF → free perishables."},{"k":"diagram","q":"Draw the diagram for APMC and the 2020 farm laws","g":{"dir":"LR","nodes":[["F","Farmer"],["A","APMC mandi - commission agent"],["W","Wholesaler"],["R","Retailer"],["C","Consumer"],["P","FPO, e-NAM, processor - shorter chain"]],"edges":[["F","A",""],["A","W",""],["W","R",""],["R","C",""],["F","P",""],["P","R",""]]}},{"k":"data","q":"What did commentators say about the private sector in farm markets?","title":"Data","rows":[{"l":"Private sector view","t":"Contract farming and FPO tie-ups could modernise farming."}]}]},{"id":"GS34-the-2020-farm-laws","line":"GS3.4","part":"Agricultural marketing","name":"The 2020 Farm Laws","own":true,"cards":[{"k":"define","q":"What is The 2020 Farm Laws?","text":"Three central acts passed in September 2020 to create tax-free parallel trade areas outside APMCs, permit contract farming, and deregulate stock limits; repealed in November 2021 following sustained protests."},{"k":"for","q":"What were the arguments for the 2020 farm laws?","rows":[{"l":"Sell anywhere","t":"Farmers could sell outside notified mandis."},{"l":"Higher income","t":"Net farm income could rise about [[14–17%]], per the Dalwai Committee."},{"l":"Lower costs","t":"Bypassing arhtiyas cuts about 15% in intermediation costs."},{"l":"Private investment","t":"Cold chains could curb [[₹1.5 lakh crore]] of yearly losses."},{"l":"Diversification","t":"Assured buyers encourage perishables and oilseeds."}],"cue":"Sell anywhere → more income → lower costs → private capex → diversify."},{"k":"against","q":"Why did the 2020 farm laws fail?","rows":[{"l":"MSP fears","t":"Farmers feared private markets would end APMCs and MSP."},{"l":"Federal overreach","t":"Markets and agriculture are State List subjects, Entries 28 and 14."},{"l":"Ordinance route","t":"There was no committee scrutiny or farmer consultation."},{"l":"No court recourse","t":"Contract disputes went to the SDM, not civil courts."},{"l":"Bihar precedent","t":"Repealing APMC in 2006 led to lower farm-gate prices."}],"cue":"MSP fears → federal overreach → ordinance → no courts → Bihar."},{"k":"value","q":"What is the way forward for farm-market reform?","title":"Solutions","rows":[{"l":"Federal consensus","t":"Use a GST Council-style body and the Model APLM Act."},{"l":"FPOs","t":"[[10,000]] FPOs give smallholders bargaining power."},{"l":"Upgrade APMCs","t":"Link 22,000 GrAMs to e-NAM."},{"l":"Fair contract farming","t":"Follow the Model APLCS Act 2018, with court recourse."},{"l":"Price assurance","t":"Extend PM-AASHA to non-cereal crops."}],"cue":"Consensus → FPOs → upgrade APMCs → fair contracts → price assurance."}]},{"id":"GS34-fpos","line":"GS3.4","part":"Agricultural marketing","name":"FPOs","own":true,"cards":[{"k":"define","q":"What is meant by FPOs?","text":"Collectives of farmers, usually registered as producer companies or cooperatives, that pool inputs and produce to gain scale and bargaining power."},{"k":"for","q":"Why are FPOs important?","rows":[{"l":"Scale","t":"Pooling harvests gives small farmers bulk bargaining power."},{"l":"Cheaper inputs","t":"Bulk buying cuts input costs [[15–20%]]."},{"l":"Value addition","t":"Grading and branding capture more of the consumer rupee."},{"l":"Direct buyers","t":"FPOs sell on e-NAM and ONDC, bypassing middlemen."},{"l":"Credit access","t":"They unlock bank credit and subsidies."}],"cue":"Scale → cheaper inputs → value addition → direct buyers → credit."},{"k":"against","q":"What holds FPOs back?","rows":[{"l":"Thin capital","t":"Most hold under [[₹5 lakh]], too little to buy crops upfront."},{"l":"No managers","t":"Weak governance leaves many units dormant."},{"l":"Few buyers","t":"Only about [[30%]] turn profitable."},{"l":"No storage","t":"Without grading or cold chains, they sell raw."},{"l":"Heavy compliance","t":"Company-law filings drain funds, and women are underrepresented."}],"cue":"Thin capital → no managers → few buyers → no storage → compliance."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Working capital","t":"Credit guarantees under the 10,000 FPOs scheme."},{"l":"Professional CEOs","t":"Fund managers and handholding through CBBOs."},{"l":"Assured buyers","t":"Link FPOs to firms like ITC and Mother Dairy."},{"l":"Storage loans","t":"Use AIF loans for warehouses and grading."},{"l":"Easier compliance","t":"Simplify filings and reserve board seats for women."}],"cue":"Capital → managers → buyers → storage → compliance."},{"k":"data","q":"Which platforms and recommendations support FPOs?","title":"Data","rows":[{"l":"ONDC","t":"About [[5,000]] FPOs have joined."},{"l":"Survey view","t":"FPOs should be the main channel for farm extension. (ES 2025-26)"}]}]},{"id":"GS34-cobweb-model","line":"GS3.4","part":"Agricultural marketing","name":"Cobweb model","own":true,"cards":[{"k":"define","text":"Explains why farm prices swing year to year: farmers plant on last season’s price, so supply overreacts and price and quantity spiral around equilibrium.","q":"What does the cobweb model explain?"},{"k":"list","q":"How does the cobweb cycle work, and how do APMCs feed it?","rows":[{"l":"Boom","t":"A high price brings more sowing, so prices then fall."},{"l":"Bust","t":"Next season fewer farmers sow, so prices rise again."},{"l":"APMCs feed it","t":"Entry barriers and delayed local price data distort planting."}],"cue":"High price → oversupply → low price → undersupply."}]},{"id":"GS34-supply-chain-bottlenecks","line":"GS3.4","part":"Agricultural marketing","name":"Supply-chain bottlenecks","own":true,"cards":[{"k":"define","q":"What are the upstream and downstream parts of the farm supply chain?","text":"Upstream: inputs, production, R&D and harvest. Downstream: processing, distribution and sale."},{"k":"for","q":"Why do seamless farm supply chains matter?","rows":[{"l":"Farmer's share","t":"Cutting middlemen raises farmers' share, now 28–74% for perishables."},{"l":"Less spoilage","t":"Timely processing curbs waste, as Operation Greens aims to."},{"l":"Stable prices","t":"Smoother supply keeps food inflation down."},{"l":"Exports","t":"Meeting residue standards avoids rejections like basmati's."},{"l":"Rural jobs","t":"Grading and processing create non-farm work."}],"cue":"Farmer's share → less spoilage → stable prices → exports → jobs."},{"k":"against","q":"What are the main supply-chain bottlenecks?","rows":[{"l":"Infrastructure gap","t":"Only about [[10%]] of produce is processed, against 70% in Brazil."},{"l":"Middlemen","t":"Arhtiya cartels squeeze the farmer's share of the price."},{"l":"Policy fear","t":"Sudden stock limits under the Essential Commodities Act deter investment."},{"l":"Informal units","t":"Unregistered firms employ about [[70%]] of workers."},{"l":"No standards","t":"Lack of grading triggers export rejections."}],"cue":"Infrastructure → middlemen → policy fear → informal units → no standards."},{"k":"value","q":"How can supply-chain bottlenecks be fixed?","title":"Solutions","rows":[{"l":"Farm-gate infrastructure","t":"Use the AIF and PM Kisan SAMPADA for cold storage."},{"l":"Digital links","t":"Link FPOs to e-NAM, ONDC and organised retail."},{"l":"Predictable rules","t":"Keep stock-limit rules stable."},{"l":"Formalise units","t":"Train small processors under PMFME."},{"l":"Uniform grading","t":"Enforce AGMARK and FSSAI standards and residue testing."}],"cue":"Infrastructure → digital links → stable rules → formalise → grade."},{"k":"list","rows":[{"l":"Finance","t":"Fear of stock limits deters private investment."},{"l":"People and skills","t":"Informal firms employ about 70% of workers."},{"l":"Infrastructure","t":"Only about 10% of markets have cold storage."},{"l":"Markets","t":"e-NAM carries only about [[15%]] of trades."},{"l":"Technology","t":"There are no uniform grading standards."},{"l":"Rules","t":"Licences and inter-state permits are complex."},{"l":"Equity","t":"Farmers get only [[28–74%]] of the consumer price."}],"title":"Across the chain","q":"What bottlenecks run through the farm supply chain?","cue":"Money → people → cold storage → markets → standards → rules → farmer's share."},{"k":"list","title":"Transport constraints (2020 Q3)","rows":[{"l":"Rural roads","t":"Without all-weather roads, mandis are cut off in the monsoon."},{"l":"Few reefers","t":"Only about [[4%]] of fruits move in refrigerated trucks."},{"l":"Road-heavy","t":"About [[97%]] of fruits and vegetables go by road."},{"l":"Losses","t":"Transport causes about ₹92,000 crore of losses a year."},{"l":"Weak multimodal links","t":"Main freight routes are congested."},{"l":"Permits","t":"Reefer vans get limited inter-state permits."}],"q":"What transport constraints hurt farm supply chains?","cue":"Roads → reefers → road-heavy → losses → no multimodal → permits."},{"k":"list","q":"What does the downstream of the farm supply chain need?","rows":[{"l":"Needs","t":"Processing machinery, quality testing, organised retail and skilled workers."},{"l":"PYQs","t":"2022 Q13, 2020 Q3, 2025 Q4."}]},{"k":"data","rows":[{"l":"Cold chain","t":"Only about [[10%]] of perishables move through cold storage."},{"l":"Non-perishables","t":"Farmers get [[49–76%]] of the consumer price."},{"l":"Farmer's share","t":"Tomato 33%, onion 36%, milk [[70%]], wheat 67%."},{"l":"Thinking framework","t":"Cold chain, handling, infrastructure, credit and policy."},{"l":"AIF","t":"[[₹1 lakh crore]] with 3% interest subvention, through NABARD."}],"q":"What data and schemes address supply-chain gaps?"},{"k":"data","rows":[{"l":"Operation Greens","t":"Begun for tomato, onion and potato, it now covers [[41]] crops."},{"l":"Cold Chain Scheme","t":"395 projects approved and [[291]] running."},{"l":"Ranchi, 2025","t":"Waterlogged roads delayed farm transport."},{"l":"Anantapur, 2025","t":"Rain delays pushed tomato prices from ₹45 to [[₹60]] a kg."}],"q":"What data and schemes address supply-chain gaps?"}]},{"id":"GS34-transport-constraints-agri-logistics","line":"GS3.4","part":"Agricultural marketing","name":"Transport Constraints (Agri-Logistics)","own":true,"cards":[{"k":"define","q":"What is agri-logistics, and what constrains it?","text":"Moving produce from farmgate to mandis, processors and consumers; heavily road-dependent, with severe cold-chain and rural connectivity gaps."},{"k":"for","q":"Why does efficient farm transport matter?","rows":[{"l":"Less spoilage","t":"Faster transport saves perishable produce."},{"l":"Wider markets","t":"Kisan Rail carries Maharashtra produce to eastern India."},{"l":"Cheaper freight","t":"Rail and coastal shipping cost less per tonne-km."},{"l":"Cold chains","t":"Unbroken cold chains preserve dairy and fish."},{"l":"Exports","t":"Krishi UDAN links landlocked farms to export markets."}],"cue":"Less spoilage → wider markets → cheaper freight → cold chains → exports."},{"k":"against","q":"What are the transport constraints?","rows":[{"l":"Heavy losses","t":"Transport wastes about [[₹92,000 crore]] a year."},{"l":"Reefer shortfall","t":"The shortfall in refrigerated trucks is about [[85%]]."},{"l":"Road dependence","t":"Only [[1.9%]] of fruits and vegetables go by rail."},{"l":"No all-weather roads","t":"Vegetables cannot reach mandis in the monsoon."},{"l":"Permits and congestion","t":"Five-year reefer permits limit inter-state movement."}],"cue":"Losses → reefer shortfall → road dependence → no all-weather roads → permits."},{"k":"value","q":"How can farm transport be fixed?","title":"Solutions","rows":[{"l":"Rural roads","t":"Build all-weather links under PMGSY."},{"l":"Reefer subsidies","t":"Fund refrigerated trucks under MIDH and the AIF."},{"l":"Rail and air cargo","t":"Scale up Kisan Rail and Krishi UDAN."},{"l":"National permits","t":"Replace 5-year permits with all-India permits."},{"l":"Logistics parks","t":"Build rail-side cold storage along freight corridors."}],"cue":"Roads → reefers → rail and air → permits → logistics parks."}]},{"id":"GS34-data-marketing-of-agricul","line":"GS3.4","part":"Agricultural marketing","name":"Agricultural marketing: key data","own":true,"cards":[{"k":"data","title":"Numbers","q":"What are the key numbers?","rows":[{"l":"Export share","t":"India has only [[2.2%]] of world agri exports. (ES 2025-26)"},{"l":"Export fall","t":"Agri exports fell about 8% in 2023-24, to [[$48.9 bn]]."}]},{"k":"data","title":"Government steps and committees","q":"Which government steps and committees apply?","rows":[{"l":"e-NWR credit guarantee","t":"A [[₹1,000 crore]] corpus backs loans against warehouse receipts."},{"l":"GI registration","t":"Application, scrutiny, publication, three months for opposition, then registration."}]}]},{"id":"GS34-e-nam","line":"GS3.4","part":"E-technology for farmers","name":"e-NAM","own":true,"cards":[{"k":"define","q":"What is meant by e-NAM?","text":"An online trading platform linking physical mandis for transparent price discovery."},{"k":"for","q":"What does e-NAM offer farmers?","rows":[{"l":"Pan-India buyers","t":"It links over [[1,500]] mandis and 1.8 crore farmers."},{"l":"Transparent prices","t":"Open online bidding, as in Telangana's turmeric trade."},{"l":"Direct payment","t":"Money goes straight to farmers' bank accounts."},{"l":"FPO trading","t":"About [[4,700]] FPOs trade in bulk."},{"l":"Pledge loans","t":"e-NWR links let farmers borrow instead of selling cheap."}],"cue":"Buyers → transparent prices → direct payment → FPOs → pledge loans."},{"k":"against","q":"Why is e-NAM underused?","rows":[{"l":"Mostly offline","t":"Only about [[15%]] of trades are truly online."},{"l":"No assaying","t":"Distant buyers cannot trust unseen quality."},{"l":"Weak logistics","t":"Shipping to far buyers is costly."},{"l":"State rules","t":"Marketing is a State subject, so licences differ."},{"l":"Low digital literacy","t":"Farmers and arhtiyas resist online bidding."}],"cue":"Offline → no assaying → weak logistics → state rules → low literacy."},{"k":"value","q":"How can e-NAM work better?","title":"Solutions","rows":[{"l":"Quality labs","t":"Install assaying and grading labs using the AIF."},{"l":"Single licence","t":"Harmonise state rules, as the Model APLM Act suggests."},{"l":"Link FPOs and ONDC","t":"Connect collection centres and GrAMs to e-NAM."},{"l":"Logistics links","t":"Use Kisan Rail and reefer subsidies."},{"l":"Helpdesks","t":"Local-language helpdesks move farmers online."}],"cue":"Labs → single licence → FPOs and ONDC → logistics → helpdesks."},{"k":"data","q":"What schemes, data and examples back up e-NAM?","title":"Data","rows":[{"l":"ITC e-Choupal","t":"It connects about [[4 million]] farmers."}]},{"k":"data","q":"How far does e-NAM reach?","rows":[{"l":"Coverage (Dec 2025)","t":"Over 1,500 mandis, 1.8 crore farmers and [[4,700]] FPOs."}]}]},{"id":"GS34-precision-agriculture","line":"GS3.4","part":"E-technology for farmers","name":"Precision Agriculture","own":true,"cards":[{"k":"define","q":"What is meant by precision agriculture?","text":"Using sensors, satellites, drones, AI/ML, and GIS to apply the right input at the right place and time—covering soil pH and nutrient-load mapping, crop monitoring, spraying, and forecasting."},{"k":"for","q":"What are the benefits of precision agriculture?","rows":[{"l":"Baramati farm of the future","t":"AI gave about [[40%]] more sugarcane with 30% less water."},{"l":"Drones","t":"They cut costs about 40% and chemical use [[30–60%]]."},{"l":"Drone gains","t":"Drones lift yields [[20–30%]] and cut carbon about 25%."},{"l":"Drone adoption","t":"Projected at [[6–7 lakh]] drones by 2030-31."},{"l":"Better advisories","t":"Bharat-VISTAAR links AgriStack, Bhashini and ICAR advice. (Budget 2026-27)"},{"l":"Soil health","t":"GIS soil maps curb fertiliser overuse."},{"l":"Faster insurance","t":"Space data speed up crop insurance assessment."}],"cue":"AI yields → drones → drone gains → adoption → advisories → soil health → insurance."},{"k":"against","q":"What limits precision agriculture in India?","rows":[{"l":"Small holdings","t":"[[86%]] of farmers own under 2 ha, too small for drones."},{"l":"High cost","t":"Drones and sensors are costly to buy and repair."},{"l":"Low digital skills","t":"Farmers lack training to use the tools."},{"l":"Internet and privacy","t":"Rural internet gaps and AgriStack data risks slow use."},{"l":"Drone rules","t":"Airspace rules and short battery life limit scaling."}],"cue":"Small plots → cost → skills → internet and privacy → drone rules."},{"k":"value","q":"How can precision agriculture reach small farms?","title":"Solutions","rows":[{"l":"Shared drones","t":"Namo Drone Didi gives SHGs [[80%]] subsidy, up to ₹8 lakh."},{"l":"Drone loans","t":"The balance comes as AIF loans with [[3%]] interest subvention."},{"l":"Agri-tech funding","t":"The [[₹750 crore]] AgriSURE fund backs startups."},{"l":"Multilingual advice","t":"Bharat-VISTAAR adds Bhashini voice support."},{"l":"Rural broadband","t":"Improve connectivity and protect farmer data under AgriStack."},{"l":"Simpler drone rules","t":"Ease licensing and link satellite data to PMFBY."}],"cue":"Shared drones → startup funds → local-language advice → broadband → simpler rules."},{"k":"diagram","q":"Draw the diagram for Precision agriculture","g":{"dir":"LR","nodes":[["D","Drones and sensors"],["S","Soil and crop data"],["A","AgriStack and decision support"],["V","Advice - seed, water, fertiliser"],["Y","Lower cost, higher yield"]],"edges":[["D","S",""],["S","A",""],["A","V",""],["V","Y",""]]}},{"k":"data","q":"Which digital platforms support farmers?","title":"Data","rows":[{"l":"Social media extension","t":"Reels and short videos complement KVKs."},{"l":"Krishi command centre","t":"A central hub for farm data."},{"l":"Meghdoot app","t":"Location- and weather-based farm advice."},{"l":"Digital Agriculture Mission","t":"About [[₹2,800 crore]], and 11 crore Farmer IDs were issued by October 2026."}]}]},{"id":"GS34-nanotechnology-in-agriculture","line":"GS3.4","part":"E-technology for farmers","name":"Nanotechnology in Agriculture","own":true,"cards":[{"k":"define","q":"What is meant by nanotechnology in agriculture?","text":"Use of materials at the [[1–100]] nanometre scale in farming—including nano fertilisers (IFFCO’s nano urea, 2021 in [[500]] ml bottles; nano DAP), nano pesticides, nanosensors, and nano packaging."},{"k":"for","q":"What are the claimed benefits of nano fertilisers and nanotech?","rows":[{"l":"Less fertiliser","t":"One 500 ml bottle could cut subsidised urea use by [[50%]]."},{"l":"Better uptake","t":"Foliar sprays deliver nutrients directly and cut runoff."},{"l":"Cheaper transport","t":"A bottle is far easier to move than a bag."},{"l":"Longer shelf life","t":"Nano coatings cut post-harvest losses."},{"l":"Domestic capacity","t":"Six plants can make about [[27 crore]] bottles a year."}],"cue":"Less fertiliser → better uptake → cheaper transport → shelf life → capacity."},{"k":"against","q":"Why is nano urea contested?","rows":[{"l":"Lower yields","t":"PAU trials found wheat yields fell about [[22%]]."},{"l":"Weak vetting","t":"Approval relied on manufacturer data."},{"l":"Unknown risks","t":"Long-term effects on soil and health are unknown."},{"l":"Higher cost","t":"Two bottles plus spraying labour can cost more."},{"l":"Forced sales","t":"Cooperatives bundle nano bottles with urea."}],"cue":"Lower yields → weak vetting → unknown risks → higher cost → forced sales."},{"k":"value","q":"How should nano fertilisers be handled?","title":"Solutions","rows":[{"l":"Independent trials","t":"ICAR should run multi-season, multi-location trials."},{"l":"Biosafety testing","t":"Enforce DBT's 2020 nano guidelines."},{"l":"Ban bundling","t":"Stop tagging nano bottles with subsidised urea."},{"l":"Drone spraying","t":"Use Namo Drone Didi to cut labour cost."},{"l":"Farmer training","t":"KVKs should teach correct dosage."}],"cue":"Trials → biosafety → no bundling → drones → training."}]},{"id":"GS35-food-inflation","line":"GS3.5","part":"Farm subsidies","name":"Food inflation","own":true,"cards":[{"k":"define","text":"A sustained rise in food prices; because food carries a large weight in the CPI basket, food shocks move headline inflation. Any shock to cropping patterns or supply feeds into inflation.","q":"What is food inflation, and why does it matter so much in India?"},{"k":"list","rows":[{"l":"Rain dependence","t":"About [[52%]] of net sown area depends on rain."},{"l":"Narrow food basket","t":"Rice and wheat are [[78%]] of foodgrains, so pulses and oils are imported."},{"l":"Post-harvest losses","t":"About [[30–40%]] of fruits and vegetables are lost after harvest."},{"l":"Fragmented supply chain","t":"Many middlemen and weak cold chains magnify supply shocks."},{"l":"Fuel and transport","t":"Fuel hikes pushed RBI's FY27 inflation forecast from 4.6% to [[5.1%]] (June 2026)."},{"l":"MSP and rural wages","t":"MSP sets a price floor and job schemes push up farm wages."},{"l":"Richer diets","t":"Demand shifts to pulses, vegetables, dairy and meat."}],"q":"What drives food inflation in India?","cue":"Rain → narrow basket → losses → middlemen → fuel → MSP and wages → richer diets.","title":"PYQ 2024 Q2"}]},{"id":"GS35-rbi-inflation-control","line":"GS3.5","part":"Farm subsidies","name":"RBI and food inflation","own":true,"cards":[{"k":"list","rows":[{"l":"Looks through food shocks","t":"RBI targets CPI [[4%]] ± 2% and acts only if food spills into core."},{"l":"Rates can't grow food","t":"Monetary policy cannot fix a supply shortfall."},{"l":"Government levers","t":"MSP, procurement, stocks and import policy move food prices."}],"q":"Why can’t the RBI control food inflation on its own?","cue":"Looks through shocks → rates can't grow food → government holds the levers.","title":"PYQ 2024 Q2"}]},{"id":"GS35-farm-credit-pacs-ardbs","line":"GS3.5","part":"Farm subsidies","name":"Farm credit (PACS, ARDBs)","own":true,"cards":[{"k":"define","text":"Institutional credit for farmers. PACS (Primary Agricultural Credit Societies) are village-level cooperatives giving short-term loans; ARDBs (Agriculture and Rural Development Banks) give long-term investment credit.","q":"What are PACS and ARDBs?"},{"k":"for","rows":[{"l":"Rising credit","t":"Ground-level farm credit rose from ₹8.5 to [[₹28.7 lakh crore]] in a decade. (ES 2025-26)"},{"l":"Cooperative reach","t":"Cooperative banks give [[30–40%]] of rural credit through PACS."},{"l":"Cheaper than moneylenders","t":"Institutional loans cut dependence on moneylenders."},{"l":"PACS model","t":"One member, one vote, with credit, storage and marketing under one roof."},{"l":"ARDBs","t":"They give long-term credit, and the first opened in Punjab in 1920."}],"q":"How has institutional farm credit improved?","cue":"More credit → cooperative reach → cheaper than moneylenders → PACS model → ARDBs."},{"k":"against","rows":[{"l":"Access","t":"Only about [[40%]] of farmers reach formal credit."},{"l":"Farm NPAs","t":"Farm GNPA is [[6.2%]], against about 1.2% for other sectors."},{"l":"Loan waivers","t":"About [[₹2.5 lakh crore]] was waived from 2014 to 2022, weakening repayment."},{"l":"Lender's risk","t":"Weather, pests and price swings, with little collateral or tenant papers."},{"l":"PACS capacity","t":"PACS need training to work as accountable village bodies."},{"l":"Technology","t":"Digital delivery and records are needed to reach farmers cheaply."},{"l":"Low productivity","t":"Yields average [[2.7 t/ha]], against 5.9 in China and 7.2 in the USA."},{"l":"Low digital use","t":"Only about [[37%]] use online banking."},{"l":"Governance","t":"Cooperatives need stronger oversight and professional managers."},{"l":"ARDB weakness","t":"ARDBs recover only about [[40%]] of loans and lack capital."},{"l":"Indebtedness","t":"About half of farm households owe [[₹15,000]] or more."}],"q":"Why does farm credit still fall short?","cue":"Access → NPAs → waivers → lender's risk → PACS capacity → technology → low yields → low digital use → governance → ARDBs → debt."}]},{"id":"GS35-farm-subsidies","line":"GS3.5","part":"Farm subsidies","name":"Farm Subsidies","own":true,"cards":[{"k":"define","q":"How do direct and indirect farm subsidies differ?","text":"Direct support puts cash in farmers’ hands (PM-KISAN, state schemes); indirect support lowers input costs (fertiliser, power, seeds, credit). The core reform goal is replacing price subsidies with direct benefit transfer (DBT)."},{"k":"for","q":"Why are farm subsidies needed?","rows":[{"l":"Food security","t":"Cheap inputs made India self-sufficient in rice and wheat."},{"l":"Direct income support","t":"PM-KISAN pays [[₹6,000]] a year without distorting prices."},{"l":"Crop-loss cushion","t":"PMFBY has paid claims above [[₹2.1 lakh crore]]."},{"l":"Seed adoption","t":"Rice and wheat seeds are subsidised at [[50%]] or ₹10/kg."},{"l":"DBT","t":"Cash goes straight to farmers' bank accounts, bypassing middlemen."}],"cue":"Food security → income → insurance → seeds → DBT."},{"k":"against","q":"What are the costs of farm subsidies?","rows":[{"l":"Fiscal burden","t":"Budget 2026-27 gives about [[₹2.3 lakh crore]] for food and ₹1.7 lakh crore for fertiliser."},{"l":"Free power","t":"Punjab's farm power subsidy costs about [[₹20,000 crore]] a year."},{"l":"Groundwater","t":"Punjab pumps about [[165%]] of its groundwater recharge."},{"l":"Nitrogen pollution","t":"India causes about [[17%]] of global aquatic nitrogen pollution."},{"l":"Emissions","t":"India is among the top [[3]] agrifood-system emitters."},{"l":"Distorted cropping","t":"Cheap power, fertiliser and procurement favour paddy and wheat."},{"l":"Urea overuse","t":"Urea frozen at ₹242 a bag since 2018 pushes use to [[141 kg/ha]]."},{"l":"Ideal ratio","t":"NPK should be used in a 4 to 2 to 1 ratio."},{"l":"Falling response","t":"Grain per kg of NPK fell from 13.4 kg to [[3.7 kg]]."},{"l":"Unequal benefits","t":"Large farmers and states like Punjab gain more than Bihar."},{"l":"DBT exclusion","t":"About [[6 lakh]] farmers were left out of PM-KISAN DBT."},{"l":"Persistent distress","t":"[[11,290]] farm-sector suicides in 2022, 5,207 farmers and 6,083 labourers."},{"l":"Hunger","t":"India ranked [[105]] of 127 in the Global Hunger Index 2024."}],"cue":"Fiscal burden → free power → groundwater → nitrogen → emissions → cropping → urea → falling response → unequal → DBT exclusion → distress → hunger."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Capex over subsidies","t":"Move input-subsidy money into irrigation, storage and rural roads."},{"l":"Per-hectare DBT","t":"Replace price subsidies with targeted cash per hectare."},{"l":"Farm research","t":"Every [[₹1]] in research returns about ₹13."},{"l":"Balanced fertiliser","t":"Use nutrient-based pricing, coated urea and Aadhaar-linked PoS checks."},{"l":"Diversify","t":"Build processing and assured markets beyond wheat and rice."}],"cue":"Capex → DBT → research → balanced fertiliser → diversify."},{"k":"data","rows":[{"l":"Insurer profits","t":"Premiums exceeded claims by over [[₹10,000 crore]] every year since 2019."},{"l":"PMFBY premium","t":"Farmers pay [[2%]] for kharif, 1.5% for rabi and 5% for commercial crops."},{"l":"PMFBY reach","t":"[[92.5 crore]] farmer applications insured since 2016."},{"l":"PM-RKVY","t":"[[₹57,075 crore]] to push state investment in agriculture."},{"l":"Andhra Pradesh","t":"Annadata Sukhibhava pays [[₹20,000]] a year, including PM-KISAN."},{"l":"Telangana","t":"Rythu Bharosa pays [[₹6,000]] an acre a season, replacing Rythu Bandhu."},{"l":"Odisha","t":"KALIA gives income support, including to landless households."},{"l":"West Bengal","t":"Krishak Bandhu pays [[₹10,000]] an acre a year, minimum ₹4,000, plus a death benefit."},{"l":"Madhya Pradesh","t":"Bhavantar Bhugtan pays the gap between market price and MSP."},{"l":"Haryana","t":"Bhavantar Bharpai paid [[₹600]] a quintal for bajra in 2021."},{"l":"Karnataka","t":"Raitha Siri pays [[₹10,000]] a hectare for millets."},{"l":"Chhattisgarh","t":"Rajiv Gandhi Kisan Nyay Yojana gives input assistance."},{"l":"Maharashtra","t":"Krishi Sanjivani backs climate-resilient farming."},{"l":"Punjab","t":"Paani Bachao Paisa Kamao, residue management and solar tube wells."}],"q":"Which schemes and data back up farm subsidies?"},{"k":"data","q":"How should farm subsidies be reformed?","title":"Data","rows":[{"l":"Research pays","t":"Every [[₹1]] in farm research returns about ₹13."}]}]},{"id":"GS35-wto-agreement-on-agriculture-and-farm-su","line":"GS3.5","part":"Farm subsidies","name":"WTO Agreement on Agriculture and Farm Subsidies","own":true,"cards":[{"k":"define","q":"How does the WTO Agreement on Agriculture classify farm subsidies?","text":"The Agreement on Agriculture (1995) sorts farm support into Amber (trade-distorting, capped at [[10%]] for developing countries), Blue (production-limiting) and Green (minimally distorting, uncapped) boxes."},{"k":"for","q":"How does India defend its farm support at the WTO?","rows":[{"l":"Food security stocks","t":"Public stocks feed free grain to about [[81 crore]] NFSA beneficiaries."},{"l":"Article 6.2","t":"It exempts input subsidies for poor farmers, and [[86%]] are small."},{"l":"Outdated reference price","t":"The 1986–88 price ignores inflation and inflates India's support."},{"l":"Historic asymmetry","t":"Rich countries kept high base-period entitlements, while India got none."},{"l":"No dumping","t":"Procured grain feeds Indians, not world markets, under the Peace Clause."}],"cue":"Food security → Article 6.2 → old price → asymmetry → no dumping."},{"k":"against","q":"What challenges does India face at the WTO on farm support?","rows":[{"l":"Cap breached","t":"Rice support hit [[11.9%]] of output value, above the 10% cap."},{"l":"Peace Clause again","t":"India invoked it a seventh time since 2020."},{"l":"MC14 deadlock","t":"Yaoundé (March 2026) ended with no permanent solution."},{"l":"Narrow Peace Clause","t":"It covers only pre-2013 programmes and staples, with heavy reporting."},{"l":"Counter-notifications","t":"The US and Australia accuse India of under-reporting rice and wheat support."},{"l":"Dairy dispute","t":"The US objects to India refusing dairy from GM-fed animals."},{"l":"Fisheries gap","t":"India gives about [[$35]] per fisher, against up to $76,000 in Europe."}],"cue":"Cap breached → Peace Clause → MC14 → narrow clause → counter-notifications → dairy → fisheries."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Permanent solution","t":"Exempt food stocks from Amber Box limits or index the 1986–88 price."},{"l":"Per-farmer caps","t":"Measure subsidy caps per farmer, not per country."},{"l":"Special Safeguard Mechanism","t":"Let developing countries raise tariffs against import surges."},{"l":"Dispute settlement","t":"Restore the two-tier dispute system and consensus decisions."},{"l":"Balanced new rules","t":"Keep policy space in digital trade and get fair fisheries rules."}],"cue":"Permanent solution → per-farmer caps → SSM → dispute system → balanced rules."},{"k":"diagram","q":"Draw the diagram for WTO Agreement on Agriculture","g":{"dir":"TD","nodes":[["W","WTO Agreement on Agriculture"],["A","Amber box - trade-distorting, 10% de minimis"],["B","Blue box - production-limiting"],["G","Green box - minimal distortion"],["P","Peace clause for food stocks, Bali 2013"]],"edges":[["W","A",""],["W","B",""],["W","G",""],["A","P",""]]}}]},{"id":"GS35-msp","line":"GS3.5","part":"MSP","name":"MSP (Minimum Support Price)","own":true,"cards":[{"k":"define","q":"What is meant by MSP?","text":"The floor price at which the government stands ready to buy a crop, recommended by CACP and approved by CCEA."},{"k":"list","q":"Which crops does MSP cover?","rows":[{"l":"Mandated crops","t":"[[22]] crops, made up of 7 cereals, 5 pulses, 7 oilseeds and 3 commercial crops."},{"l":"Plus sugarcane","t":"Sugarcane's FRP makes it [[23]] in all."}]},{"k":"for","q":"Why is MSP important?","rows":[{"l":"Higher incomes","t":"Payouts hit [[₹3.33 lakh crore]] for 1.84 crore farmers in 2024-25."},{"l":"Stocks the PDS","t":"It fills the PDS and buffer with about [[79 MMT]] of wheat and rice."},{"l":"Diversification","t":"PM-AASHA promises [[100%]] procurement of tur, urad and masur."},{"l":"Price floor","t":"A mandi benchmark price prevents distress sales."},{"l":"Consumer prices","t":"Buffer releases like Bharat Atta cool food inflation."}],"cue":"Income → PDS stocks → diversification → floor price → consumer prices."},{"k":"against","q":"What are the problems with MSP?","rows":[{"l":"Narrow coverage","t":"About [[85%]] of procurement is wheat and rice."},{"l":"Regional bias","t":"Punjab and Haryana give over [[60%]] of central wheat but grow 30%."},{"l":"Paddy-wheat lock-in","t":"It ties farmers to water-guzzling paddy and wheat."},{"l":"Fiscal and storage burden","t":"Open-ended buying swells FCI stocks, costs and spoilage."},{"l":"Cost formula","t":"Farmers demand MSP on C2 cost plus [[50%]], not A2+FL."},{"l":"WTO caps","t":"Rice support breaches the WTO Amber Box cap."}],"cue":"Narrow crops → regional bias → lock-in → fiscal burden → formula → WTO."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Price deficiency payments","t":"Pay the gap between market price and MSP by DBT, like Bhavantar."},{"l":"Buy beyond cereals","t":"NAFED and NCCF should buy more pulses, oilseeds and millets."},{"l":"Decentralise procurement","t":"Build warehouses and mandis in eastern and central states."},{"l":"Income transfers","t":"Pair MSP with PM-KISAN-style cash for small farmers."},{"l":"Markets before legal MSP","t":"Strengthen mandis, FPOs and cold chains so prices stay above MSP."}],"cue":"Pay the gap → buy beyond cereals → decentralise → add cash → fix markets."},{"k":"diagram","q":"Draw the low-income trap diagram (MSP)","g":{"dir":"LR","nodes":[["I","Low income"],["S","Low savings"],["V","Low investment"],["P","Low productivity and returns"],["M","MSP - assured price"]],"edges":[["I","S",""],["S","V",""],["V","P",""],["P","I",""],["M","I",""]]}},{"k":"diagram","q":"Draw the diagram for MSP","g":{"dir":"LR","nodes":[["C","CACP - cost A2+FL, C2"],["R","Recommends MSP"],["G","CCEA approves"],["P","Procurement - FCI, states, PM-AASHA"],["F","Farmer income and central pool"]],"edges":[["C","R",""],["R","G",""],["G","P",""],["P","F",""]]}},{"k":"data","q":"How is MSP fixed, and what do committees say?","title":"Data","rows":[{"l":"Procurement share","t":"FCI procures about [[65%]] of wheat and rice produced."},{"l":"MSP formula","t":"At least [[1.5 times]] A2+FL cost since the 2018-19 Budget."},{"l":"Swaminathan Commission","t":"It asked for at least [[50%]] over cost, which unions read as C2."},{"l":"Who fixes it","t":"CACP recommends and CCEA approves."},{"l":"PM-AASHA","t":"[[₹35,000 crore]] to 2025-26 for price support and deficit payments."},{"l":"Price Support Scheme","t":"It buys pulses and oilseeds up to [[25%]] of national output."},{"l":"Shanta Kumar finding","t":"Only about [[6%]] of farmers sold at MSP."},{"l":"Abroad","t":"US Price Loss Coverage and the EU's CAP pay decoupled income support."}]}]},{"id":"GS35-pds","line":"GS3.5","part":"PDS","name":"PDS","own":true,"cards":[{"k":"define","q":"What is the PDS?","text":"Public Distribution System: fair-price shops distribute subsidised foodgrain procured by the Food Corporation of India (FCI) to eligible households."},{"k":"for","q":"What has the PDS achieved?","rows":[{"l":"Wide reach","t":"About [[70%]] of households used the PDS in 2022-23, up from 49%."},{"l":"Less poverty","t":"Without it, the poverty gap would be [[18–20%]] wider."},{"l":"Child nutrition","t":"Stunting fell from 48% to [[35.5%]] between NFHS-3 and NFHS-5."},{"l":"Less leakage","t":"Leakage fell from 42% to [[22%]] between 2011-12 and 2022-23."},{"l":"Bihar turnaround","t":"Bihar's leakage fell from about 69% to [[19%]]."},{"l":"West Bengal turnaround","t":"Leakage fell from about 69% to [[9%]]."},{"l":"Digital delivery","t":"e-POS covers nearly all ration shops, and [[95%]] of sales use Aadhaar."}],"cue":"Reach → poverty → nutrition → less leakage → Bihar → West Bengal → digital."},{"k":"against","q":"What are the limitations of the PDS?","rows":[{"l":"Leakage persists","t":"About 22% still leaks, worth about [[₹69,000 crore]] a year."},{"l":"Tamil Nadu","t":"Leakage rose from 12% to [[25%]] in 2023."},{"l":"Hidden cost","t":"The true cost is about [[$45 bn]], against $16 bn shown in the budget."},{"l":"Exclusion","t":"About [[10 crore]] people are left out because NFSA uses 2011 population."},{"l":"Nutrition gap","t":"A rice-wheat basket cannot end micronutrient deficiency."},{"l":"Weak handling","t":"About [[90%]] of handling facilities are not mechanised."}],"cue":"Leakage → Tamil Nadu → hidden cost → exclusion → nutrition → handling."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Track the grain","t":"SMART-PDS tracking and One Nation One Ration Card curb diversion."},{"l":"Update the rolls","t":"Use population projections to add the [[10 crore]] left out."},{"l":"Modern logistics","t":"Depot Darpan, silos and the Anna Chakra route tool cut waste."},{"l":"Fortify the basket","t":"Add fortified rice, pulses and millets, alongside PM POSHAN."},{"l":"Honest accounts and DBT","t":"Put off-budget food costs on budget and pilot urban cash transfers."}],"cue":"Track → update rolls → modernise logistics → fortify → DBT."},{"k":"diagram","q":"Draw the diagram for PDS","g":{"dir":"LR","nodes":[["F","FCI and state procurement"],["C","Central pool"],["S","States lift grain"],["D","Fair price shops"],["B","Ration card holders - ONORC"]],"edges":[["F","C",""],["C","S",""],["S","D",""],["D","B",""]]}},{"k":"data","q":"How has the PDS evolved, and how should it be revamped?","title":"Data","rows":[{"l":"Suggested targeting","t":"Cover only the poorest [[15%]], down from 53%."},{"l":"Revamped PDS (1992)","t":"It covered tribal and hilly areas."},{"l":"Targeted PDS (1997)","t":"It split households into APL and BPL."},{"l":"Antyodaya Anna Yojana (2000)","t":"[[35 kg]] a month for the poorest households."},{"l":"NFSA 2013","t":"Covers [[75%]] of rural and 50% of urban people."},{"l":"Free grain","t":"NFSA grain has been free since January 2024, extended to 2028."},{"l":"Women as heads","t":"The eldest woman heads the household on the ration card."},{"l":"PMGKAY","t":"An extra [[5 kg]] in Covid, merged into free NFSA grain in 2023."},{"l":"Jan Poshan Kendras","t":"Ration shops turned into nutrition hubs, piloted in 2024."},{"l":"Millet switch","t":"Swapping millets for rice could save about [[$1.4 bn]]."},{"l":"Shanta Kumar Committee","t":"Cut NFSA coverage from 67% to [[40%]] and move to cash."}]}]},{"id":"GS35-buffer-stock","line":"GS3.5","part":"Buffer stock","name":"Buffer stock","own":true,"cards":[{"k":"define","q":"What is the buffer stock?","text":"Foodgrain held by the FCI above the operational stock norm so the PDS can run uninterrupted and market prices can be stabilised (dating from the Fourth Five-Year Plan, 1969–74)."},{"k":"for","q":"Why does India keep a buffer stock?","rows":[{"l":"Keeps the PDS running","t":"FCI moved over [[3 million]] tonnes for PMGKAY in the lockdown."},{"l":"OMSS sales","t":"FCI sold [[35 lakh]] tonnes of wheat in 2022-23."},{"l":"Bigger rice sales","t":"The 2026-27 rice sale target doubled to [[50 LMT]]."},{"l":"Cools inflation","t":"Wheat inflation fell from 25% to [[6.5%]] by May 2024."},{"l":"Global shocks","t":"Stocks avoid panic imports during global price spikes."},{"l":"MSP anchor","t":"Stocks absorb harvest surpluses, preventing distress sales."}],"cue":"PDS → OMSS → rice sales → inflation → global shocks → MSP."},{"k":"against","q":"What are the problems with India’s buffer stock?","rows":[{"l":"Fiscal cost","t":"Excess grain swells the [[₹2.3 lakh crore]] food subsidy."},{"l":"Excess stocks","t":"Wheat and rice stocks were [[926 LMT]] against a 411 LMT norm (July 2026)."},{"l":"Rice glut","t":"Rice stocks were [[403 LMT]] against a 135 LMT norm, about 3x."},{"l":"Rodents","t":"Rodents eat about [[2.4–2.6 MT]] of stored grain a year."},{"l":"Godown losses","t":"About [[87,000]] tonnes were lost in FCI godowns in 2010-11."},{"l":"Rotting grain","t":"Over [[40,000]] tonnes rotted in FCI godowns in 2014-20."},{"l":"Skewed storage","t":"Punjab has [[611]] godowns, against about 30 in West Bengal."},{"l":"Poor rotation","t":"Ignoring first-in-first-out lets older grain rot."}],"cue":"Cost → excess stocks → rice glut → rodents → godown losses → rotting grain → skewed storage → rotation."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Village godowns","t":"Build PACS godowns under the World's Largest Grain Storage Plan."},{"l":"Sell early","t":"Sell stock above norms through OMSS, exports or ethanol."},{"l":"Steel silos","t":"Replace open CAP storage with mechanised silos through PPPs."},{"l":"FIFO and tracking","t":"Enforce first-in-first-out with Depot Darpan monitoring."},{"l":"Local procurement","t":"Buy and store grain in eastern and central states."}],"cue":"Village godowns → sell early → silos → FIFO → local procurement."},{"k":"diagram","q":"Draw the diagram for Buffer stock","g":{"dir":"TD","nodes":[["C","Central pool"],["O","Operational stock - PDS, welfare"],["R","Strategic reserve"],["E","Excess over buffer norm"],["M","OMSS sales, exports, ethanol"]],"edges":[["C","O",""],["C","R",""],["C","E",""],["E","M",""]]}},{"k":"data","q":"How is storage being expanded and stock released?","title":"Data","rows":[{"l":"Grain Storage Plan","t":"[[313]] PACS had godowns of 1.8 LMT by July 2026."},{"l":"PACS identified","t":"[[1,012]] PACS have been identified for godowns."},{"l":"OMSS","t":"FCI e-auctions surplus wheat and rice to cool prices."}]}]},{"id":"GS35-agricultural-revolutions","line":"GS3.5","part":"Technology missions","name":"Agricultural revolutions","own":true,"cards":[{"k":"define","q":"What is meant by an agricultural revolution?","text":"Mission-mode drives that sharply lifted output of one product group."},{"k":"list","q":"Name India’s agricultural revolutions.","rows":[{"l":"Green","t":"High-yield wheat and rice from the mid-1960s, led by M.S. Swaminathan."},{"l":"White","t":"Milk through Operation Flood from 1970, led by Verghese Kurien."},{"l":"Blue","t":"Fish through Neeli Kranti, now PMMSY."},{"l":"Yellow","t":"Oilseeds through the 1986 Technology Mission on Oilseeds."},{"l":"Golden","t":"Horticulture."},{"l":"Silver","t":"Eggs."},{"l":"Pink","t":"Meat and poultry."},{"l":"Round","t":"Potato."}],"cue":"Green grain → white milk → blue fish → yellow oil → golden fruit → silver eggs → pink meat → round potato."},{"k":"for","q":"What did the agricultural revolutions achieve?","rows":[{"l":"Food security","t":"Output of [[358 million]] tonnes backs NFSA cover for about 80 crore people."},{"l":"Better nutrition","t":"Milk availability rose from 319 g to [[485 g]] a person a day."},{"l":"Milk output","t":"Milk reached [[248 MT]] in 2024-25, the world's largest."},{"l":"Diverse incomes","t":"Livestock is about [[31%]] of agricultural GVA."},{"l":"Women's income","t":"Dairy cooperatives like Amul give rural women regular cash."},{"l":"Exports","t":"Rice, shrimp and horticulture made India a major agri-exporter."}],"cue":"Food security → nutrition → milk → diverse incomes → women → exports."},{"k":"against","q":"What were their downsides?","rows":[{"l":"Distorted cropping","t":"Rice-wheat bias pushed pulse imports to a record in 2024-25."},{"l":"Groundwater and soil","t":"Paddy-wheat and heavy fertiliser drained Punjab and Haryana aquifers."},{"l":"Regional inequality","t":"Gains stayed in Punjab, Haryana and western UP."},{"l":"Big-farmer bias","t":"Only larger farmers could afford tubewells, seeds and machines."},{"l":"Lost biodiversity","t":"Hybrids replaced millets and local varieties."}],"cue":"Distorted cropping → groundwater → regions → big farmers → biodiversity."},{"k":"value","q":"What are the solutions?","title":"Solutions","rows":[{"l":"Oilseed and pulse missions","t":"NMEO-Oilseeds and the Pulses Mission, backed by PM-AASHA buying."},{"l":"Evergreen Revolution","t":"Swaminathan's idea, using micro-irrigation, soil health cards and natural farming."},{"l":"Eastern India","t":"BGREI extends gains east with regional seeds and irrigation."},{"l":"Allied missions","t":"Scale PMMSY, Rashtriya Gokul Mission and MIDH."},{"l":"Collectives","t":"FPOs and women's cooperatives share machines and markets."}],"cue":"Deficit-crop missions → Evergreen Revolution → eastern India → allied missions → collectives."},{"k":"diagram","q":"Draw the diagram for Agricultural revolutions","g":{"dir":"TD","nodes":[["R","Agricultural revolutions"],["G","Green - foodgrains"],["W","White - milk"],["B","Blue - fish"],["Y","Yellow - oilseeds"],["P","Pink - meat"],["O","Golden - horticulture"]],"edges":[["R","G",""],["R","W",""],["R","B",""],["R","Y",""],["R","P",""],["R","O",""]]}},{"k":"data","q":"Which current missions continue them?","title":"Data","rows":[{"l":"Food Security and Nutrition Mission","t":"Renamed in 2024-25, under the [[₹44,247 crore]] Krishonnati Yojana."},{"l":"Oilseeds Mission","t":"Raise oilseed output from 39 MT to [[69.7 MT]] by 2030-31."},{"l":"Pulses Mission","t":"[[₹11,440 crore]] to reach 350 lakh tonnes by 2030-31."}]}]},{"id":"GS35
